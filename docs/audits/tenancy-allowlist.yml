# Allowlist do gate de tenancy — Story 900-2c
#
# ⚠️ ISENTAR AQUI NÃO TORNA A TABELA SEGURA. Só declara que a ausência de policy
# org-scoped é DESENHO, e registra quem respondeu por essa decisão.
#
# REGRAS DE USO
#   1. `reason:` é OBRIGATÓRIO e não pode ser vazio — entrada sem reason é IGNORADA pelo
#      motor (o efeito é a tabela continuar sendo reportada). Allowlist sem justificativa é
#      exatamente o buraco que a allowlist deveria fechar.
#   2. Toda entrada nova aparece em diff e precisa de revisão. A `900-18` congela este
#      arquivo na saída da Onda 1.
#   3. Isto NÃO é o lugar de tabela nova sem `org_id` que deveria ter `org_id`. Se a R3
#      acusou, a resposta correta quase sempre é acrescentar a coluna, não isentar.
#   4. `tenancy-known-tables.json` NUNCA é editado. É este arquivo que isenta.
#
# ---------------------------------------------------------------------------------------
# As 16 tabelas do achado P8 (docs/audits/rls-multi-tenant-audit.md).
#
# O padrão delas é deliberado e documentado em `131_imobiliarias.sql`: RLS habilitada com
# ZERO policies resulta em deny-all para anon/authenticated — não há vazamento por acesso
# direto. O acesso acontece só por service-role em rota gated.
#
# A auditoria é explícita sobre onde está o risco: **não é o padrão, é a escala dele.**
# Todo o isolamento desses 16 domínios depende de alguém ter escrito `.eq("org_id", …)` à
# mão em cada query. Isentá-las aqui é honesto — elas não têm policy por decisão — mas o
# gate NÃO as cobre, e é a story `900-14` (`createOrgScopedAdminClient` + ESLint) que
# fecha esse flanco. Ver a ressalva de cobertura impressa em toda execução do gate.
# ---------------------------------------------------------------------------------------

