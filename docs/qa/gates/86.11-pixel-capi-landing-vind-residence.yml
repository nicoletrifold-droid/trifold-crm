reverificacao_iteracao_2: |
  Re-verificação de 2026-08-25 — nada aceito de segunda mão. Executado por mim:

  | Verificação | Comando | Resultado |
  |---|---|---|
  | Diff real de `form-capi.ts` | leitura do arquivo | `OpcoesSinais.confiarEmClientIpDoCorpo` (default `false`); `confiaNoCorpo = opcoes?.confiarEmClientIpDoCorpo === true`; `(confiaNoCorpo ? texto(corpo?.client_ip) : undefined) ?? ipDaRequest(request)` — opt-in verdadeiro, não fallback |
  | 4 call-sites de `extrairSinais` | grep | 86-11 (`landing-page/route.ts:135`, `track/route.ts:106`) passam `{ confiarEmClientIpDoCorpo: true }`; 86-9 (`formulario/[token]/route.ts:173`, `tracking/route.ts:82`) não passam nada (default seguro) |
  | 5 testes novos de segurança | leitura + execução | existem, testam o cenário certo (forja no corpo IGNORADA na 86-9, IP do header vence, valor forjado não aparece na CAPI) e passam |
  | Opt-in ainda funciona na 86-11 | `route.test.ts:278` / `track/route.test.ts:138` | IP legítimo do corpo `187.1.2.3` vence, IP do datacenter `76.76.21.21` não aparece — verde |
  | Suíte dos 5 arquivos afetados | `npx vitest run <5 arquivos>` | 70 testes passando |
  | Suíte completa | `npx vitest run` | 249 arquivos, 3051 testes passando + 6 expected fail, 0 falhas |
  | Type-check | `npx turbo type-check` | 8/8 pacotes OK |
  | Lint | `npx turbo lint` | 8/8, 0 erros, 30 warnings pré-existentes (arquivos de teste não relacionados) |
  | "Convenção de deploy" da story | leitura das linhas 496-524 + Change Log v1.2 | reflete PR #501 (trifold-design-system tracked), alerta de rebase presente |

  **Confirmações adicionais desta passada** (coisas que a tabela acima não cobria
  e que eu não queria deixar no plano da afirmação):

  | Verificação | Comando | Resultado |
  |---|---|---|
  | As rotas da 86-9 realmente não foram editadas | `git diff -- '.../formulario/[token]/route.ts' '.../formulario/[token]/tracking/route.ts'` | **diff VAZIO nos dois.** `git status` lista só os dois `route.test.ts` como modificados. A alegação do @dev ("a proteção veio do default, sem tocar nas rotas antigas") é literal |
  | Só os testes do achado | `npx vitest run -t "86.11-QA-001"` | **5 testes em 3 arquivos, 5 passed, 246 arquivos skipped** — confere com os 5 declarados, um a um |
  | Type-check SEM cache | `npx turbo type-check --force` | 8/8 OK. Rodei com `--force` de propósito: sem ele o turbo devolvia `FULL TURBO` / 8 cached, e cache hit não é evidência de compilação |
  | Lint SEM cache | `npx turbo lint --force` | 8/8, 0 erros, 30 warnings — os MESMOS 30 da iteração 1, em `kanban-board.tsx`, `logger.test.ts`, `alert-credencial-morta.test.ts`, `distributor.test.ts` (nenhum tocado por esta story) |
  | AC7 não regrediu | execução verbose dos 5 arquivos | todos os testes `AC7 —` verdes dos dois lados, incluindo "o evento sai com o IP do corpo, nunca com o do datacenter Vercel" e "manda o IP e o UA do visitante, não os do datacenter Vercel" |
  | `86.11-QA-002` — estado do repo hoje | `git fetch` + `git ls-tree origin/main` + `diff` | 13 commits atrás (não 12); `trifold-design-system/vercel.json` tracked em `origin/main` e untracked no disco; conteúdo **IDÊNTICO** (diff vazio) — nenhum trabalho de CSP pode se perder no rebase, o risco é só de resolução confusa |

  **O raio do defeito era MAIOR do que o achado original registrou — e a correção
  cobre o excedente.** Eu havia descrito o impacto do `86.11-QA-001` só sobre o
  evento CAPI. Relendo o código: `/formulario/[token]/route.ts` também persiste o
  MESMO objeto `sinais` em `leads.metadata.meta_ad` via `comMetaAd` (linhas 229 e
  285). O IP forjado seria portanto **gravado no banco** e depois relido pelo
  evento "Visitou" do cron (86-2/86-4) — a forja sobreviveria dias ao request que
  a originou. Como as duas saídas derivam do mesmo `sinais`, o opt-in fecha as
  duas de uma vez: a correção foi feita no ponto de estrangulamento certo, não no
  sintoma. Conferido também que `lerTracking` (a allowlist que aceita
  `client_ip`/`client_ua`) só tem dois chamadores, ambos da 86-11 — não há
  caminho alternativo pelo qual o corpo alcance `SinaisTracking` nas rotas da 86-9.

  **Os 5 testes não passam por vacuidade** (verifiquei, porque teste de segurança
  que passa sem exercitar nada é pior do que teste nenhum):
  - `form-capi.test.ts:92` e `:107` chamam `extrairSinais` DIRETO e asserem o
    valor do header — inverter o default quebra os dois imediatamente.
  - `formulario/[token]/route.test.ts` assere `expect(eventosCapi).toHaveLength(1)`
    ANTES de olhar o conteúdo: se o mock de `enviarEventoFormulario` nunca fosse
    chamado, o teste FALHA em vez de passar vazio.
  - `tracking/route.test.ts` lê `enviados[0]?.sinais` e acessa `.clientIp` — com a
    lista vazia, lança.
  - Os dois testes de rota asserem `JSON.stringify(...)` **não conter** o valor
    forjado, não só que o valor certo está presente. É a forma que pega a
    regressão real, não só o caminho feliz.

  **Superfície nova re-auditada** (só o delta desde a iteração 1, como pedido):
  `OpcoesSinais` + 4 linhas em `extrairSinais` + 2 argumentos nos call-sites da
  86-11 + 5 testes + as seções "Correção pós-QA" e "Convenção de deploy" da story.
  Nenhum outro arquivo de produção mudou. Não re-auditei o que já havia passado na
  iteração 1 (hashing, dedup, degradação graciosa, CSP, isolamento de PII).

