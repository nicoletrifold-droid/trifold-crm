cadeia_ip_ua: |
  Verificada lendo o código, elo por elo (o achado mais caro da story se passasse
  despercebido). Está CORRETA:

  1. Browser (`index.html:811-822`) monta `data.tracking` com `event_id`,
     `complete_registration_event_id`, `visitor_id`, `page_url`, `fbc`/`fbp`/`fbclid`
     — e **deliberadamente não** com `client_ip`/`client_ua`.
  2. `api/lead.js:61-78` (`montarTracking`) copia só a allowlist `TRACKING_FIELDS`
     (que **não inclui** `client_ip`/`client_ua`) e só DEPOIS escreve os dois a
     partir de `req.headers['x-forwarded-for'][0]` / `req.headers['user-agent']`.
     É este proxy que o browser chama diretamente — é o único ponto da cadeia que
     vê o IP real. Qualquer `client_ip` que o browser tente ditar é sobrescrito
     (teste `api-proxy.test.ts:121`).
  3. `api/track.js:77-90` faz o mesmo para `ViewContent`/`InitiateCheckout`.
  4. CRM: `extrairSinais` (`form-capi.ts:135-138`) dá precedência ao corpo
     **somente com o opt-in** (correção do `86.11-QA-001`):
     `(confiaNoCorpo ? texto(corpo?.client_ip) : undefined) ?? ipDaRequest(request)`.
     As duas rotas da 86-11 ligam o flag porque há proxy no meio; as da 86-9 não.
  5. `buildCapiUserData` mapeia para `client_ip_address`/`client_user_agent` em
     TEXTO PURO (`capi-payload.ts:169-170`), nunca hasheados.

  Provas de teste: `route.test.ts:273` assere que `76.76.21.21` (IP simulado do
  datacenter Vercel) **não aparece em lugar nenhum** do payload nem das escritas
  no banco; `track/route.test.ts:130` faz o mesmo para a rota `/track`.

dedup_event_id: |
  Os 5 eventos, conferidos um a um:

  | Evento | Browser | Servidor | `event_id` |
  |---|---|---|---|
  | `PageView` | `index.html:186` | — (por design, AC1) | próprio, sem par |
  | `ViewContent` | `evento('ViewContent')` (`index.html:189`) | `/landing-page/track` | MESMO id nos dois (`evento()` gera 1 id e usa nos dois disparos) |
  | `InitiateCheckout` | `index.html:783`, 1x por carregamento (`{once:true}` + guard `disparado`) | `/landing-page/track` | idem |
  | `Lead` | `pixelTrack('Lead', eventIdLead)` (`index.html:846`) | `tracking.event_id` | MESMO |
  | `CompleteRegistration` | `pixelTrack(..., eventIdCadastro)` (`index.html:847`) | `tracking.complete_registration_event_id` | MESMO, e **distinto** do anterior |

  Os dois ids do par `Lead`/`CompleteRegistration` são gerados no mesmo instante
  por duas chamadas separadas de `novoId('e')` — não colidem nem se confundem, e
  o servidor lê cada um da sua chave própria (`route.ts:413-422`). A dedup do
  Meta usa o par `event_name` + `event_id`, então mesmo uma colisão hipotética
  seria inócua; ids distintos deixam os Test Events auditáveis, como a story pedia.

degradacao_graciosa: |
  Os 4 cenários exigidos, verificados no código e cobertos por teste:

  - **Ad-blocker** (sem `fbq`, sem `_fbp`/`_fbc`): `pixelTrack` tem `try/catch` +
    guard `if (window.fbq)`; `atribuicao()` devolve `{}` em qualquer exceção; o
    `fetch` de `CONFIG.leadEndpoint` é uma chamada independente do Pixel. O lead
    nasce. `quandoFbpPronto` tem teto de 50 tentativas × 100ms e chama o callback
    de qualquer jeito.
  - **Sem `localStorage`**: `visitorId()` cai para `visitorMemoria` no `catch`,
    estável dentro do carregamento.
  - **Sem `crypto.randomUUID`**: fallback `e-<base36>-<base36>`, aceito pelo
    `EVENT_ID_RE` do servidor (teste dedicado em `track/route.test.ts`).
  - **`tracking` ausente/malformado no CRM**: `lerTracking` devolve `undefined`
    para string, array, `null`, número e objeto vazio; o lead nasce e nenhum
    evento sai (`route.test.ts:348`). Sem `event_id` válido, grava `meta_ad` mas
    não inventa evento (`route.test.ts:361`).
  - **`/api/track` fora do ar**: `fetch(...).catch(function(){})`, fire-and-forget.

nao_regressao_wordpress: |
  O ponto mais caro de quebrar sem perceber. Verificado:

  - `git diff` do `landing-page/route.ts`: 133 inserções, 8 remoções — e as
    únicas remoções são linhas reescritas no mesmo lugar. A única mudança que
    toca o caminho de TODO chamador é `select("id")` → `select("id, metadata")`
    na busca de duplicata: lê uma coluna a mais, usada só quando há `tracking`.
  - `flattenIntoFields` **não foi tocado** (o `else if` final continua
    descartando `typeof v === "object"`), o que mantém o isolamento estrutural:
    `tracking` nunca chega a `fields`, logo nunca a `webhook_logs.payload` nem a
    `leads.metadata.raw_fields`. Um teste falha se alguém "consertar" o flatten.
  - Testes de regressão presentes e verdes: JSON sem `tracking` grava o
    `metadata` byte a byte anterior e não chama a CAPI; `form-urlencoded`
    (Elementor/CF7) idem; token inválido segue 401 sem tocar no banco.
  - `/formulario/[token]` (86-9): os dois chamadores não passam `contentCategory`
    nem `derivarUf`, então mantêm `form_qualificacao` e o `st` derivado do DDD —
    travado por testes nomeados "NÃO-REGRESSÃO 86-9".

issues:
  - id: "86.11-QA-001"
    severity: medium
    category: security
    title: "A precedência do corpo sobre os headers vazou para as rotas públicas da 86-9 — o browser passa a poder forjar `client_ip`/`client_ua`"
    evidence: |
      O ADAPT do AC7 acrescentou `client_ip?`/`client_ua?` a `CorpoTracking` e
      deu a eles precedência sobre os headers em `extrairSinais`
      (`form-capi.ts:106-107`). Correto e necessário para a 86-11, onde há um
      proxy servidor-a-servidor no meio.

      Mas `extrairSinais` é compartilhada, e os outros DOIS chamadores são
      chamados DIRETO PELO BROWSER, sem proxy nenhum:

        - `packages/web/src/app/api/formulario/[token]/route.ts:173`
          `const sinais = extrairSinais(request, body.tracking)`
        - `packages/web/src/app/api/formulario/[token]/tracking/route.ts:82`
          `const sinais = extrairSinais(request, body)`
          — e ali `body` é o JSON BRUTO da requisição, apenas *castado* para
          `CorpoPost extends CorpoTracking` (linha 42), nunca estreitado em
          runtime. Uma interface TypeScript não filtra chaves.

      Antes desta story o corpo não tinha como influenciar IP/UA: `extrairSinais`
      sempre lia de `ipDaRequest(request)`. Depois dela, qualquer visitante de um
      link público de formulário pode enviar
      `{"evento":"ViewContent","event_id":"<uuid>","client_ip":"1.2.3.4","client_ua":"..."}`
      e o valor vai literalmente para `client_ip_address`/`client_user_agent` do
      evento CAPI.

      Impacto: forja de geografia/dispositivo no dataset do Meta do funil de
      qualificação (integridade do dado de atribuição). NÃO é vazamento de PII,
      não afeta a criação do lead, não afeta a 86-11. A premissa registrada pelo
      @po ("o chamador `/formulario/[token]` continua sem enviar esses campos,
      então seu comportamento não muda") vale para chamadores honestos apenas.
    affects_ac: ["AC7"]
    affects_story: "86-9 (em produção)"
    recommendation: |
      Tornar a precedência OPT-IN, para que ela exista só onde há um proxy no
      meio. Duas formas, ambas pequenas:
        a) terceiro parâmetro em `extrairSinais(request, corpo, { ipUaDoCorpo = false })`,
           ligado explicitamente pelas duas rotas da 86-11; ou
        b) nas duas rotas da 86-9, estreitar o corpo antes de passar
           (`extrairSinais(request, { visitor_id, fbp, fbc, fbclid, page_url })`).
      Acompanhar de um teste que assere que um `client_ip` no corpo de
      `/formulario/[token]/tracking` é IGNORADO.
    resolution: |
      RESOLVIDO na iteração 1.1 do @dev, opção (a) da recomendação. Verificado no
      código nesta re-revisão (2026-08-25):
        - `form-capi.ts`: nova `OpcoesSinais.confiarEmClientIpDoCorpo` (default
          `false`). `extrairSinais` só lê `client_ip`/`client_ua` do corpo quando
          o flag é `true`; sem ele o valor é `undefined` — não fallback, é como se
          os campos não existissem (linhas 127, 135, 137).
        - As duas rotas da 86-11 passam `{ confiarEmClientIpDoCorpo: true }`
          (proxies servidor-a-servidor no meio). As duas rotas da 86-9 NÃO foram
          editadas — a proteção é o default, não uma linha removível.
        - 5 testes de segurança novos (2 em `form-capi.test.ts`, 1 em
          `formulario/[token]/tracking/route.test.ts`, 2 em
          `formulario/[token]/route.test.ts`) enviam `client_ip: "1.2.3.4"` /
          `client_ua: "UA-forjado-pelo-visitante"` no corpo e asserem que o IP do
          header vence e o valor forjado não aparece em canto nenhum do que iria à
          CAPI. Todos passam.
        - Os testes de precedência do lado da landing (opt-in) continuam verdes.
    status: RESOLVED

  - id: "86.11-QA-002"
    severity: medium
    category: process
    title: "A premissa de deploy da story ficou obsoleta hoje: o `vercel.json` da CSP já está versionado e mergeado em `main`"
    evidence: |
      A story afirma (Convenção de deploy, Dev Notes, Nota de auditoria) que
      `landing-pages/trifold-design-system/` é untracked, que a CSP "não vai para
      PR nenhum" e que existe um "ponto cego de auditoria". Verificado com
      `git fetch` durante esta revisão — não é mais verdade:

        - PR #501 ("docs: registra vercel.json do proxy trifold-design-system"),
          MERGED em 2026-08-24T20:10:57Z, adicionou
          `landing-pages/trifold-design-system/vercel.json` e `README.md` a `main`.
        - `diff` entre `origin/main:.../vercel.json` e a cópia no working tree:
          **vazio**. Ou seja, a versão em `main` JÁ contém as três adições de CSP
          do AC8 (`connect.facebook.net` em `script-src`, `www.facebook.com` em
          `img-src`, ambos em `connect-src`).
        - `main` local está 12 commits atrás de `origin/main` (`e2f5219a`), e no
          working tree o arquivo ainda aparece como **untracked**.

      Riscos concretos para o @devops:
        1. Um `git pull`/rebase vai abortar com "untracked working tree file
           would be overwritten by merge" nesse arquivo. Uma resolução com
           `checkout -f`/`clean` teria a aparência de estar descartando o
           trabalho de CSP.
        2. `origin/main` também já traz `landing-pages/vind-residence/api/lead.js`
           e `index.html` alterados pelo PR #499 (`-teste` → domínio canônico).
           O working tree do @dev já aplicou o mesmo valor canônico, então
           converge — mas o rebase precisa ser feito e conferido, não presumido.
    affects_ac: ["AC8"]
    recommendation: |
      Antes de commitar: `git fetch origin && git rebase origin/main` (ou branch
      a partir de `origin/main`), resolvendo o `vercel.json` como um arquivo
      TRACKED — o conteúdo alvo é exatamente o que já está no disco e em `main`,
      então na prática o AC8 não gera diff novo. Restam do AC8 apenas o
      `vercel deploy --prod` manual do projeto `trifold-design-system` e a
      conferência de console do AC11. A "Nota de auditoria" no Dev Agent Record
      continua útil como registro, mas o ponto cego não existe mais.
    resolution: |
      RESOLVIDO na iteração 1.2 do @dev — só documentação, como recomendado.
      Verificado nesta re-revisão: a seção "Convenção de deploy" da story (linhas
      496-524) foi reescrita para tratar `landing-pages/trifold-design-system/`
      como versionado desde o PR #501, com a tabela "Como o código entra / Como o
      site sobe" corrigida para os dois diretórios e o alerta de rebase em
      `origin/main` presente para o @devops (tratar `vercel.json` como arquivo já
      rastreado). Change Log v1.2 registra a correção. O achado permanece um
      roteiro de deploy para o @devops (rebase + `vercel project ls`), não um
      bloqueio de merge.
    status: RESOLVED

  - id: "86.11-QA-003"
    severity: low
    category: security
    title: "A rota `/landing-page/track` não tem rate limit, ao contrário da rota-modelo da 86-9"
    evidence: |
      `/api/formulario/[token]/tracking` (a rota que a story mandou espelhar) usa
      `criarRateLimit(60)`. A nova `/api/webhooks/landing-page/track` não tem
      nenhum. A porta pública de verdade é o proxy `api/track.js`, que guarda o
      segredo e também não limita nada — logo, um terceiro pode inflar
      `ViewContent`/`InitiateCheckout` no dataset do Meta à vontade.
    recommendation: >
      Não é pior do que a exposição já existente do `api/lead.js` (que cria
      leads) e o volume desta landing é baixo, então não bloqueia. Registrar como
      dívida: um limite por IP no proxy, ou reusar `criarRateLimit` na rota do
      CRM, fecha o buraco em poucas linhas.
    status: OPEN

  - id: "86.11-QA-004"
    severity: low
    category: reliability
    title: "`quandoFbpPronto` atrasa o par server-side em até 5s — visitante que sai antes perde o evento de servidor"
    evidence: |
      `index.html:132-139` adia o POST de `ViewContent`/`InitiateCheckout` até o
      cookie `_fbp` nascer, com teto de 50×100ms. Um visitante que fecha a página
      em menos de 5s produz o evento no Pixel e nenhum no servidor. Não há
      contagem dobrada (o Meta recebe 1 evento), só match quality menor para quem
      dá bounce rápido.
    recommendation: >
      Trade-off correto — a decisão #6 do @dev pré-corrige o defeito
      `86.9-QA-004` e vale mais do que o custo. Só registrar: se no futuro
      alguém investigar "faltam ViewContent de servidor", a causa é esta, não um
      bug. Alternativa futura: `navigator.sendBeacon` no `visibilitychange`.
    status: ACCEPTED

  - id: "86.11-QA-005"
    severity: low
    category: security
    title: "Desvio literal do AC9: `console.log('[lead capturado]', data)` passa a logar `fbc`/`fbp`/`visitor_id`"
    evidence: |
      `index.html:853` — no ramo em que `CONFIG.leadEndpoint` está vazio, o
      objeto `data` (que agora inclui `data.tracking`) vai inteiro para o console.
      O AC9 diz "nenhum desses campos aparece em `console.log`/`console.error` em
      nenhum caminho".
    recommendation: >
      Caminho morto em produção (`leadEndpoint` é uma constante não-vazia) e o
      console é o do próprio visitante — cosmético. Se for corrigir, logar só
      `{nome, whatsapp, email}` e omitir `tracking`.
    status: OPEN

  - id: "86.11-QA-006"
    severity: low
    category: data
    title: "`api/lead.js` passa a anexar `tracking: {client_ip, client_ua}` MESMO quando o browser não mandou tracking nenhum"
    evidence: |
      `montarTracking` sempre escreve IP/UA a partir dos headers, e o bloco só é
      omitido se ambos faltarem. O próprio teste do @dev documenta isso
      (`api-proxy.test.ts:167` — "sem tracking no corpo, o payload é o de antes
      da story + IP/UA"). Consequência: TODO lead desta landing passa a ter
      `leads.metadata.meta_ad` com IP e User-Agent do visitante persistidos, mesmo
      com o Pixel 100% bloqueado.
    recommendation: >
      Está conforme o AC7 ("sobrescrever/preencher"), é o que faz o evento
      "Visitou" (86-2/86-4) sair com atribuição depois, e é o mesmo precedente já
      aceito na 86-9. Aceito. Registrado explicitamente para ficar ao lado do
      risco #5 da story (LGPD) em vez de implícito: é PII persistida antes de
      qualquer aceite.
    status: ACCEPTED

  - id: "86.11-QA-007"
    severity: low
    category: process
    title: "AC11/T12 não verificável antes dos 3 deploys"
    evidence: >
      Depende de `META_CAPI_TEST_EVENT_CODE` no projeto `trifold-crm` e de uma
      visita real com preenchimento do formulário, com os 3 deploys no ar.
    recommendation: >
      Tarefa do @devops, com roteiro completo já no Dev Agent Record. Não bloqueia
      o merge; bloqueia o "Done".
    status: RESOLVED
    resolution: >
      Fechado em 2026-08-26 pelo @devops (Gage). Validação end-to-end concluída
      com o `test_event_code` real `TEST15571` numa sessão de browser real em
      `trifold.eng.br/vindresidence/?fbclid=TESTE123` (14:06–14:23 BRT), com
      evidência visual em 4 fontes independentes: Events Manager (Lead e
      CompleteRegistration marcados "Desduplicado" = pareamento por `event_id`
      entre servidor e browser), aba Rede do DevTools (`fbevents.js` + config do
      pixel + beacons `tr`), extensão Meta Pixel Helper (os 5 eventos "Ativo",
      incluindo o `PageView`) e console sem violação de CSP. O `PageView` não
      aparece no painel de Test Events por limitação da ferramenta do Meta — o
      SDK JS não carrega `test_event_code`, logo o painel só enxerga a metade
      servidor de cada par. Env de teste removida do `trifold-crm` (ausência
      reconferida) + redeploy, e os 4 leads de teste apagados de produção. Ver
      "Fechamento do T12 — 2026-08-26" no Dev Agent Record da story.

  - id: "86.11-QA-008"
    severity: low
    category: docs
    title: "Sobraram duas frases da premissa antiga do QA-002 em outras seções da story — contradizem a 'Convenção de deploy' já corrigida"
    evidence: |
      A correção do `86.11-QA-002` atualizou a seção autoritativa ("Convenção de
      deploy", linhas 496-524), que agora está certa e traz o alerta de rebase.
      Mas duas passagens do Dev Agent Record continuam com o texto anterior:

        - Roteiro do T12, item 7 (linhas 870-872): "o diretório
          `trifold-design-system/` é untracked e não haverá diff versionado para
          consultar depois (ponto cego de auditoria conhecido)".
        - Título da seção seguinte (linha 874): "Nota de auditoria — CSP aplicada
          (o diretório é untracked)".

      Ambas são falsas desde o PR #501. Achado meu na iteração 2, encontrado ao
      re-verificar se o QA-002 estava mesmo fechado.
    recommendation: >
      Cosmético e não bloqueia: a seção que o @devops vai efetivamente seguir já
      está correta, e o pior caso aqui é o @devops colar o valor da CSP num
      comentário de PR desnecessariamente — trabalho a mais, nunca trabalho
      errado. Corrigir junto do próximo toque na story: no item 7, trocar o
      motivo por "para deixar o valor à mão na revisão" e ajustar o título para
      "Nota de auditoria — CSP aplicada". Não vale um round-trip com o @dev só
