decisoes_do_dev_avaliadas: |
  As seis decisões que a story não especificava, avaliadas uma a uma:

  1. **`event_id` relaxado para `/^[A-Za-z0-9._-]{8,64}$/`** — ACEITO, sem
     push-back. O `event_id` não é fronteira de autenticação: ele só precisa ser
     o MESMO dos dois lados. Exigir UUID descartaria em silêncio os eventos do
     fallback vanilla (`e-<base36>-<base36>`), ou seja, justamente os navegadores
     mais frágeis. O regex recusa espaço, `/`, `<`, `..` — coberto por teste de
     injeção. A divergência com a 86-9 está documentada no próprio módulo.
  2. **Espera do cookie `_fbp` antes do POST** — ACEITO e elogiado. Pré-corrige
     o `86.9-QA-004`. Custo registrado em `86.11-QA-004`.
  3. **Honeypot com `{status:"ok", tracked:false}`** — ACEITO. O status HTTP
     continua 200 (indistinguível para o bot, que é o que importa), e o browser
     assume `tracked` quando o corpo é ilegível — o default seguro é o caminho
     normal, não o silêncio.
  4. **Testes automatizados para os proxies** — ACEITO e elogiado. Metade do AC7
     vive em `api/lead.js`; deixá-lo com verificação só manual seria manter
     descoberto o ponto mais frágil da story. `.vercelignore` + arquivo fora de
     `api/` evitam que o teste vire função serverless.
  5. **`landing-page-tracking.ts` como CREATE** — ACEITO. Justificativa válida:
     arquivos de rota do Next.js não podem exportar símbolos arbitrários, e uma
     allowlist duplicada é uma fronteira de segurança que diverge em silêncio.
     Registro IDS presente na story.
  6. **`<noscript>` no `<body>`** — ACEITO e tecnicamente correto: `<img>` dentro
     de `<noscript>` no `<head>` encerra o parsing do head. O AC8 previa
     registrar a decisão caso o `<noscript>` fosse OMITIDO; ele não foi.

security_notes: |
  - **Hashing (AC9) — conforme.** `em`/`ph`/`fn`/`ln`/`external_id`/`st` sempre
    SHA-256 hex; `fbc`/`fbp`/`client_ip_address`/`client_user_agent` sempre texto
    puro. Verificado em `buildCapiUserData` (`capi-payload.ts:123-172`) e travado
    por teste em `capi-payload-form.test.ts:87` e `form-capi.test.ts:231`.
  - **PII fora dos logs — conforme.** `form-capi.ts:230` loga só o nome do evento
    e o erro, nunca o `user_data`. Os dois proxies logam `err.message`, nunca o
    corpo. Testes de spy em `console.log/warn/error` cobrem os dois lados. Única
    exceção: `86.11-QA-005` (caminho morto, console do próprio visitante).
  - **PII fora do banco onde não deve — conforme e ESTRUTURAL.** `tracking` nunca
    entra em `webhook_logs.payload` nem em `metadata.raw_fields`, porque
    `flattenIntoFields` descarta objetos aninhados. Não é uma promessa: é uma
    propriedade do código, com teste que quebra se alguém a remover.
  - **A rota `/track` recusa `Lead` e `CompleteRegistration`** por design (400,
    não descarte silencioso) — fecha o canal de conversão forjada. Coberto por
    dois testes nomeados.
  - **Allowlist nos dois proxies** — chaves fora da lista são descartadas; o
    proxy não vira encaminhador cego. Teste assere o conjunto exato de chaves.
  - **CORS**: os proxies só ecoam a origem quando ela está na allowlist; origem
    desconhecida recebe a primeira da lista, não `*`. Coberto por teste.
  - **Forja de IP/UA nas rotas da 86-9 (`86.11-QA-001`) — FECHADO na iteração 2.**
    A precedência do corpo é opt-in (`confiarEmClientIpDoCorpo`, default `false`),
    ligada só onde há proxy servidor-a-servidor. Fecha as DUAS saídas de uma vez:
    o evento CAPI e a persistência em `leads.metadata.meta_ad` via `comMetaAd`
    (que o achado original não tinha mapeado). 5 testes de regressão travam.
  - Aberto, ambos LOW e aceitos como dívida: `86.11-QA-003` (sem rate limit na
    rota nova) e `86.11-QA-005` (console.log em caminho morto).

positive_notes: |
  - A armadilha nomeada pelo @po no AC7 — a mais cara da story — foi resolvida
    nos DOIS lados e travada por teste em ambos, inclusive com a assertiva
    "o IP do datacenter não aparece em canto nenhum do payload nem do banco",
    que é o tipo de teste que pega a regressão real e não só o caminho feliz.
  - O isolamento do endpoint compartilhado é estrutural (objetos aninhados nunca
    chegam ao `pick()`), não uma convenção — e há um teste cuja única função é
    quebrar se alguém "consertar" o `flattenIntoFields`.
  - O update de `metadata.meta_ad` foi deliberadamente separado do update de UTM
    (que é condicionado a `utm_campaign IS NULL`). Pendurar um no outro faria a
    atribuição do clique depender de o lead não ter campanha — um bug silencioso
    de manual. O teste assere os filtros do update, não só o payload.
  - Testar os proxies serverless, que a story declarava "manuais", foi a decisão
    de maior retorno da implementação: é onde metade do AC7 vive.
  - Não-regressão da 86-9 travada por testes com nome próprio ("NÃO-REGRESSÃO
    86-9") em `content_category`, `st`, batch de 1 evento e leitura de headers.

