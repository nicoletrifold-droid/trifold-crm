# 8. CONCERNS
# ═══════════════════════════════════════════════════════════════════════════
concerns:
  - id: QA-900-60-1
    severidade: media
    titulo: "A AC7 — o desfecho de falha — não tem carrasco nenhum. Medido."
    onde: "`packages/web/src/app/platform/orgs/_components/pausar-empresa-dialog.tsx`"
    o_que_medi: >-
      Acrescentei `aoFechar()` ao ramo `if (!res.ok)` do `confirmar()` — o diálogo passa a FECHAR
      em cima da falha, perdendo o motivo digitado e convidando à segunda pausa num 5xx que na
      verdade gravou. **`tsc --noEmit` rc=0** e a suíte INTEIRA: **308 arquivos / 4187 passed /
      6 expected fail / rc=0**. Verde. Restaurei o arquivo.
    porque_acontece: >-
      Não é descuido: `vitest.config.ts` inclui `packages/web/src/**/*.test.ts` e **não `.tsx`**,
      não há `environment: "jsdom"` nem `@testing-library/react` no repositório. O @dev tirou o
      TEXTO do JSX exatamente por isso (Decisão 3) — mas a **máquina de estados do envio** ficou
      dentro do componente, e ela é o que a AC7 promete.
    impacto: >-
      Nenhum defeito vivo: o comportamento está certo hoje, e eu o reproduzi na tela (500 mantém
      aberto e preserva o motivo; 200 fecha). O que falta é proteção contra regressão da AC que o
      próprio pedido chama de "a AC que impede o console de fingir que salvou".
    conserto_sugerido_e_mensuravel: >-
      Duas opções, qualquer uma resolve. (a) **Extrair a decisão para `.ts`**: uma função pura
      `decidirDesfecho(res.ok, corpo)` → `{ fecha: boolean, erro: string | null }`, com carrasco
      em `console-pausa-empresa.test.ts`; o mutante acima passa a matar. (b) **Régua de FORMA
      sobre a fonte do diálogo**, no padrão que este repositório já usa (`codigoDe` +
      `trechoDelimitado`): `aoFechar()` aparece **exatamente uma vez** dentro de `confirmar()`, e
      dentro do trecho que vem DEPOIS de `router.refresh()`; e o trecho do `if (!res.ok)` contém
      `setErro(` e `return` e **não** contém `aoFechar()`. A (a) é melhor — é comportamento, não
      forma. Critério de aceite: o mutante `aoFechar()` no ramo de erro tem de ficar VERMELHO.
  - id: QA-900-60-2
    severidade: baixa
    titulo: "A ordem do deploy é um pré-requisito da rota, e ela só está escrita em prosa"
    o_que: >-
      A `251` não está em produção. Se o código subir antes dela, o `PATCH` responde **500
      `ESCRITA_FALHOU`** com a mensagem do Postgres sobre função inexistente — e o operador vê
      "Não foi possível concluir" numa tela que parece pronta. O `STATUS_POR_CODIGO_SQL` não tem
      entrada para `42883`/`PGRST202`, então cai no `?? 500` genérico.
    conserto_sugerido: >-
      Não é código: é a ordem no runbook do `@devops` — **`251` primeiro, deploy depois** — e
      confirmar por `pg_proc` no banco de produção (leitura de metadado, permitido) antes de
      liberar a tela. Se o dono do produto quiser rede: mapear o código de função inexistente
      para uma mensagem que diga "esta função ainda não foi publicada no banco".

