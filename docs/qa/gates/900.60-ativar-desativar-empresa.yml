# ═══════════════════════════════════════════════════════════════════════════
# 4. DECISÕES CONTRA A LETRA DA AC — julgadas
# ═══════════════════════════════════════════════════════════════════════════
decisoes_contra_a_letra:
  - id: "D1 — o `UPDATE` foi para a RPC `organization_set_active_as_platform` (AC2)"
    veredicto: "**CERTA**, e as três razões foram medidas por mim, não aceitas"
    provas:
      razao_1_mesma_transacao: >-
        Verificável no SQL da `251`: `SELECT … FOR UPDATE` → `UPDATE` → `count(*)` → `platform_audit()`,
        tudo antes do `COMMIT`. Ler a contagem pela rota seriam duas viagens, e a trilha registraria
        um número que nunca existiu. A AC10 existe exatamente para explicar o roteamento meses depois.
      razao_2_contagem_inalcancavel: >-
        **Medido contra o `trifold-crm-dev` pelo PostgREST:** `?select=count()` →
        **HTTP 400 `PGRST123` "Use of aggregate functions is not allowed"**. E `platformQuery()`
        (lido) é `(table, columns, orgId?)` chamando `.select(columns)` **sem objeto de opções** —
        `count`/`head` não têm por onde entrar — e `columns.includes("(")` recusa `count()` antes
        disso. As duas portas estão fechadas.
      razao_3_from_literal_proibido: >-
        **Medido por mutação:** pôr `.from("organizations").update(...)` na rota deixa
        `platform-query-scan.test.ts` **VERMELHO**. A letra da AC2 não era implementável.
    ressalva: >-
      A AC2 pede `createAdminClient()`, e ele **está** na rota — é ele quem chama a `.rpc()`, e a
      rota está registrada em `docs/audits/admin-client-allowlist.json` seção `plataforma`. O que
      mudou de lugar foi o `UPDATE`, não o cliente. A catraca `TOTAL_ESPERADO` foi de **242 → 243**
      e eu **recontei a união das 5 seções do JSON: 243**, com
      `src/app/api/platform/orgs/[id]/route.ts` presente em `plataforma`.
  - id: "D2 — `503 LEITURA_FALHOU` separado de `404 ORG_NOT_FOUND`"
    veredicto: "**CERTA**. Um 404 sobre leitura que falhou manda o operador procurar a empresa em vez da rede. Os carrascos existem e são disjuntos (B1 e B8 no registro do @dev)."
  - id: "D3 — o texto do diálogo mora em `.ts`, fora do JSX"
    veredicto: >-
      **CERTA, e é o que torna a AC8 defensável.** `vitest.config.ts` inclui
      `packages/web/src/**/*.test.ts` — **não `.tsx`**. Texto dentro do componente é texto que esta
      suíte não alcança. É exatamente por isso que a AC7 (que ficou no `.tsx`) não tem carrasco —
      ver QA-900-60-1.
  - id: "D5 — rótulo muda, valor da URL (`?status=inativas`) não"
    veredicto: "**CERTA.** O valor é contrato de URL já compartilhada desde a `900-58`; o rótulo é a promessa ao humano, e era ela que mentia."

# ═══════════════════════════════════════════════════════════════════════════
# 5. O RÓTULO (AC8) — confirmado que não pode ser amaciado
# ═══════════════════════════════════════════════════════════════════════════
rotulo:
  decisao_do_po_aprovada_pelo_dono: "Pausar / Retomar · badge Ativa / Pausada"
  fundamento_verificado_no_codigo: >-
    `lib/supabase/middleware.ts` e `lib/api-auth.ts` leem **`users.is_active`** — outra tabela,
    outra granularidade. `organizations.is_active` não aparece em nenhum dos dois. "Desativar"
    prometeria um bloqueio de acesso que o sistema não aplica.
  mutacoes_que_medem:
    C1_volta_para_Desativar: "3 mortos"
    C2_suaviza_a_frase_iii: "3 mortos"
    C2b_so_a_caixa_das_letras: "3 mortos"
  veredicto: "**CONFIRMADO** — nenhuma das três formas de amaciar sobrevive."
  orgs_ativas_depois: >-
    Verificado no código vivo: `resolveSoleOrg()` (`webhook-org.ts`) lê a coluna como
    **contagem** (`.eq(\"is_active\", true).limit(2)`), então pausar A muda o roteamento de B.
    A trilha grava o número, e eu o vi cair de 3 para 2 e voltar para 3, na mesma linha do motivo.

# ═══════════════════════════════════════════════════════════════════════════
# 6. MIGRATION — a colisão e o conserto, reconferidos por mim
# ═══════════════════════════════════════════════════════════════════════════
migration:
  numero_final: "251_pausar_retomar_empresa.sql"
  livre_reconferido_por_mim:
    metodo: >-
      `git fetch --prune` e depois `git ls-tree -r --name-only <ref> -- supabase/migrations`
      sobre **TODAS** as refs (`refs/heads` + `refs/remotes`), não só a `main`.
    refs_varridas: 181
    arquivos_distintos: 279
    resultado: >-
      O único `251_*` em ref nenhuma é o desta pilha. `250_kanban_stages_default_unico.sql`
      (da `main`) e `250_pausar_retomar_empresa.sql` **não coexistem mais** — o `250_pausar`
      sumiu de toda ref, e `grep -rn "250_pausar"` só devolve as duas linhas da própria story que
      NARRAM a colisão. **Livre confirmado.**
  colisao_de_conteudo: >-
    **Não há.** A `250` da `main` cria `kanban_stages_default_unico_por_org` (índice único
    parcial), a função `kanban_stages_default_unico()` e o trigger
    `trg_kanban_stages_default_unico` — tudo em `kanban_stages`. A `251` cria
    `organization_set_active_as_platform` e escreve em `organizations`/`platform_audit_log`.
    Zero objetos em comum, zero ordem exigida.
  aplicada_no_banco_de_teste:
    pergunta_do_pedido: "está aplicada no banco de teste?"
    resposta: "**SIM** — confirmado ANTES de testar a rota, por leitura direta do catálogo."
    evidencia: >-
      `pg_proc`: `organization_set_active_as_platform(p_org_id uuid, p_is_active boolean,
      p_reason text, p_actor_user_id uuid)`, `prosecdef = true`.
      `has_function_privilege` na assinatura exata: **anon `false` · authenticated `false` ·
      service_role `true` · postgres `true`** — a REVOKE/GRANT da migration está viva, não só
      escrita no arquivo.
  producao: >-
    **NÃO aplicada, e é assim que tem de estar.** É do `@devops`, na ordem do deploy: a `251`
    ANTES do código, senão a rota responde erro de função inexistente.
  observacao_de_registro: >-
    `docs/audits/migrations-aplicadas.json` não foi regenerado (declarado pelo @dev). Regenerá-lo
    capturaria `246`/`247`/`249` como PENDENTE por causa de outras frentes — o diff não seria
    desta story. Concordo com a decisão.

# ═══════════════════════════════════════════════════════════════════════════
# 7. OS DOIS AUTOACHADOS DO @dev — o conserto pegou?
# ═══════════════════════════════════════════════════════════════════════════
autoachados_do_dev:
  - id: "perda de `app/page.tsx` por `git checkout --`"
    conserto_declarado: "refazer a bateria com snapshot por `cp`, sha256 dos dois lados"
    minha_verificacao: >-
      **PEGOU.** Refiz a bateria inteira eu mesmo, com `cp`. O sha256 do baseline que eu medi
      (`bf7d4969a0785b0964917495b4869161ed726994a40b917584a36da5709d0e7e`) é o mesmo que ele
      declarou. Os conjuntos de morte que eu obtive são **2 e 5, disjuntos**, e a inversão é a
      união exata (7). O sintoma que denunciou a bateria corrompida — mutantes diferentes com o
      mesmo número de mortos — **não reaparece**. Restaurei por `cp` e o `git diff` do arquivo
      ficou vazio.
    nota: >-
      O @dev registra a bateria refeita como "2 e 7" (A1 e a inversão). Eu medi as **três** (2, 5
      e 7) — a de `if (true)` é a que o pedido exigia, e é ela que fecha o par disjunto com a A1.
  - id: "réguas de outras stories MOVIDAS"
    minha_verificacao: "**nenhuma ficou mais fraca.** Verificação item a item:"
    itens:
      - regua: "`scripts/admin-client-allowlist.test.ts` — `TOTAL_ESPERADO` 242 → 243"
        veredicto: "**MOVEU, não afrouxou.** A asserção é a mesma (`uniao.size`/`PERMITIDOS.size` contra a constante). Recontei a união das 5 seções do JSON real: **243**. O que mudou junto foram dois NOMES de `it` que ainda diziam `240` enquanto a asserção já usava `TOTAL_ESPERADO` — o nome estava obsoleto antes desta story; passou a dizer `TOTAL_ESPERADO`. Isso é conserto de rótulo, não de força."
      - regua: "`console-lista-empresas.test.ts` AC5 — call site do `<OrgRowMenu>`"
        veredicto: "**MAIS FORTE.** Era 1 `toContain` sobre a linha formatada; virou recorte fail-closed (`trechoDelimitado` + `not.toBe(\"\")`) mais **4** asserções de prop, incluindo as duas novas (`nome`, `isActive`)."
      - regua: "`console-lista-empresas.test.ts` AC6 — `expect(fonte).not.toContain(\"is_active\")`"
        veredicto: >-
          **CADUCOU LEGITIMAMENTE.** Era fronteira de cronograma ("o quarto item é da 900-60"),
          não propriedade do produto — e a `900-60` chegou. O que a substitui são **3 asserções
          positivas** (`textoDaConfirmacao(isActive).rotuloDoMenu`, `setDialogo(true)`,
          `setAberto(false)`) mais a proibição que **sobrevive** e agora é sobre o produto
          (`codigo` sem `Desativar`). ⚠️ Conferi o ponto que mais me preocuparia: a proibição de
          `Desativar` **já era** sobre `codigo` (não `fonte`) no commit anterior `098bf4de` — não
          houve troca de escopo escondida no meio da mudança.
      - regua: "`console-lista-empresas.test.ts` — controle positivo do `Esc`"
        veredicto: >-
          **MAIS FORTE, e eu provei os dois lados.** O escopo da unicidade foi de "arquivo
          inteiro" para "o trecho do `aoTeclar`", mantendo `toBe(1)` — necessário, porque o
          arquivo passou a ter duas devoluções de foco legítimas. **(a)** o defeito real continua
          morrendo: apaguei o `botao.current?.focus()` do `aoTeclar` em produção → **2 vermelhos**.
          **(b)** a asserção NOVA ("o veneno acertou o alvo certo") não é enfeite: inseri um
          terceiro `botao.current?.focus()` ANTES do `aoTeclar`, para que o `replace` sem `g`
          errasse o alvo → **VERMELHO**. Sem a mudança de escopo o `toBe(1)` teria virado falso
          sem nada ter quebrado; com ela, e com a asserção nova, a régua mede exatamente o que
          dizia medir.

