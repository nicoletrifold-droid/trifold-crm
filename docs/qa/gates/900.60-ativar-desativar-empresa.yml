# 2. MUTAÇÕES QUE EU MESMO APLIQUEI (snapshot por `cp`, nunca `git checkout`)
# ═══════════════════════════════════════════════════════════════════════════
mutacoes_reproduzidas:
  metodo: >-
    Snapshot por CÓPIA antes de cada mutante, sha256 dos dois lados, restauro por `cp` e
    `git diff` vazio conferido depois. Nenhum `git stash` (há 9 stashes de outras sessões neste
    repositório). `tsc --noEmit` rc=0 medido antes de contar cada vermelho.
  baseline_page_test: "9 passed — `app/page.tsx` sha256 `bf7d4969a0785b0964917495b4869161ed726994a40b917584a36da5709d0e7e` (bate com o declarado)"
  A1_some_o_ramo:
    tsc: "rc=0"
    mortos: 2
    quais: "METADE 1 (platform admin `admin` → /platform; platform admin `broker` → /platform)"
  A2_if_true:
    tsc: "rc=0"
    mortos: 5
    quais: >-
      METADE 2 inteira: `broker` comum → /broker; `admin` comum → /dashboard;
      `is_platform_admin:false` explícito; linha de `users` ausente; valor não-booleano.
    veredicto: >-
      **É a mutação que o pedido exigia, e ela separa mesmo "protegi" de "abri para todos".**
      Interseção com A1 = **vazia**. Os conjuntos são disjuntos e de tamanhos diferentes (2 e 5).
  A3_inverte:
    tsc: "rc=0"
    mortos: 7
    quais: "a UNIÃO exata de A1 e A2 — 2 + 5, sem sobra e sem falta"
  restauro: "sha256 `bf7d4969…` reproduzido byte a byte, `git diff -- packages/web/src/app/page.tsx` vazio, 9 verdes de novo"
  MB1_literal_no_client:
    o_que: "o `/platform` volta a ser literal DENTRO de `sidebar-nav.tsx` (`\"use client\"`) e renderiza para todo mundo"
    tsc: "rc=0"
    mortos: 3
    quais: >-
      as três da METADE 2, inclusive **`a rota não está no TEXTO-FONTE do componente`** — a
      asserção que é especificamente sobre vazamento, não sobre pixel. METADE 1 fica verde.
  MC1b_autoridade_true:
    o_que: "`isPlatformAdmin()` responde `true` para todo mundo"
    tsc: "rc=0"
    mortos: 5
  MB3_layout_incondicional: { tsc: "rc=0", mortos: 2 }
  MB4_layout_nao_passa: { tsc: "rc=0", mortos: 2 }
  C1_rotulo_desativar: { tsc: "rc=0", mortos: 3 }
  C2_suaviza_frase_iii: { tsc: "rc=0", mortos: 3 }
  C2b_suavizacao_sutil:
    o_que: "`de OUTRA empresa` → `de outra empresa` (a caixa baixa que um revisor de texto faria)"
    tsc: "rc=0"
    mortos: 3
    veredicto: "**o texto não pode ser amaciado nem na caixa das letras** — a régua morde a grafia exata"
  SONDA_from_literal:
    o_que: "`.from(\"organizations\").update(...)` dentro da rota — a AC2 ao pé da letra"
    resultado: >-
      **VERMELHO** em `platform-query-scan.test.ts` → *nenhum `.from(<literal>)` cru sobrevive em
      app/platform/** e app/api/platform/***. É a prova de que a letra da AC2 não era
      implementável sem quebrar uma régua viva.
  SONDA_comentario_jsx:
    o_que: "a expressão exata da ligação escrita num `{/* … */}` no call site, com a prop real removida"
    resultado: "**VERMELHO** (2) — `codigoDe` não é satisfeito pelo comentário JSX"
  SONDA_veneno_alvo_errado:
    o_que: >-
      um terceiro `botao.current?.focus()` inserido ANTES do `aoTeclar`, para que o `replace` sem
      `g` do controle positivo acerte o alvo errado
    resultado: "**VERMELHO** (1) — o controle positivo detecta quando o veneno erra o alvo"
  SONDA_defeito_real_esc:
    o_que: "remove de verdade o retorno de foco do `Esc` em `org-row-menu.tsx`"
    resultado: "**VERMELHO** (2) — a régua estreitada continua matando o defeito que ela existe para matar"

