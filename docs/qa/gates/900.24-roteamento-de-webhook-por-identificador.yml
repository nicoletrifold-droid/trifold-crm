# 2. O DÉCIMO PRIMEIRO INSTRUMENTO CEGO — a classe que o call site não alcança
# ═════════════════════════════════════════════════════════════════════════════
concerns:
  QA-900-24-5:
    titulo: "O ARGUMENTO do resolver nunca é afirmado — o mock que viabiliza a #8 cega a fiação"
    severidade: medium
    categoria: tests
    tipo: forward-gate
    bloqueia_merge: false
    fecha_antes_de: "confiar no modo `identifier` (Task 9.1) e no cutover da Onda 3"
    ac_afetada: "AC3 (`phoneNumberId` vem de `value?.metadata?.phone_number_id`), AC4 (`entry?.id`), AC10"
    por_que_o_call_site_nao_alcanca: >-
      As suítes de rota substituem o resolver (`vi.mock` + `importOriginal`) para poder plantar a
      divergência da mutação #8 — e é exatamente essa substituição que faz o ARGUMENTO passado ao
      resolver nunca ser observado. `webhook-org.test.ts`, do outro lado, testa o resolver
      isolado e não sabe que existe rota. A classe mora na costura entre as duas suítes: nenhuma
      das duas a alcança. Confirmado por grep: **nenhum** `toHaveBeenCalledWith` sobre os mocks de
      resolver, em nenhuma das duas suítes.
    medido: |
      | mutação                                                    | resultado |
      |------------------------------------------------------------|-----------|
      | whatsapp: `resolveOrgByWhatsAppPhone(supabase, fromRaw)`   | **VERDE (121p)** ⚠️ |
      | meta_ads: `resolveOrgByMetaPage(supabase, leadgenId)`      | **VERDE (121p)** ⚠️ |
      A rota pode entregar ao resolver o **telefone do lead** no lugar do `phone_number_id` da WABA,
      ou o `leadgen_id` no lugar do `page_id`, e a suíte inteira segue verde.
    cobertura_colinear_que_nao_conta: |
      Estas duas ficam VERMELHAS — mas por acidente, não por desenho:
      | mutação                                              | resultado |
      |------------------------------------------------------|-----------|
      | whatsapp: ler `metadata.display_phone_number`        | 🔴 0p/1f |
      | meta_ads: `pageId` vindo de `webhookValue.form_id`   | 🔴 0p/1f |
      Elas acendem só porque a MESMA variável também alimenta o `identificador`, que o `toEqual`
      confere. A prova de que a cobertura é colinear são as duas mutações verdes acima, que mudam
      o argumento do resolver **sem** tocar o `identificador`. No dia em que as duas deixarem de
      ser a mesma variável, some também esse vermelho de brinde.
    escopo: >-
      Exatamente 2 receptores — `whatsapp` e `meta_ads`, os únicos que roteiam por identificador do
      payload. `landing_page` e `telegram` chamam `resolveSoleOrg(db)`, sem argumento derivado do
      payload: não há o que errar.
    consequencia_se_regredir: |
      - Em `identifier` (o modo do `trifold-crm-dev` desde o dia 1, Task 9.1, e o que a Onda 3
        promove): a consulta usa a chave errada ⇒ `nenhuma_correspondencia` ⇒ **toda mensagem/lead
        descartada com 200**. É o defeito que esta story existe para fechar, reintroduzido uma
        camada acima.
      - Em `both` (produção hoje): não perde dado — o legado decide. Mas `divergiu` fica
        envenenado, e é ele que decide o cutover. **Atenuante real:** a query 4 da AC9 ("zero
        divergência em 24h") detectaria isso em produção. É por isso que não bloqueia o merge.
    recomendacao: >-
      Duas linhas, uma por receptor, nas suítes que já têm o mock:
      `expect(resolveOrgByWhatsAppPhoneMock).toHaveBeenCalledWith(expect.anything(), "PNID-DA-ORG")`
      e o equivalente com `page_id` no `process-lead.test.ts`. Custa menos que o parágrafo que
      escrevi para explicar.

