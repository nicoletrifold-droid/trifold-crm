status_reason: >-
  Segunda rodada, sobre `20a4eaf6`. As 4 concerns estão fechadas, e fechadas com o vermelho MEDIDO
  por mim: as **13 mutações de call site** que ficavam verdes acendem **13/13**. Verifiquei o
  detalhe que a coordenação pediu — os conjuntos de morte das concerns 1 e 2 são **disjuntos**
  (PII derruba "o que a rota passa … EXATAMENTE isto"; `await`→`void` derruba "a escrita COMPLETA
  antes de a rota responder"), ou seja, o espião que delega ao real NÃO apagou a régua do `await`.
  As três camadas da concern 1 têm dentes de verdade e medi as três, uma a uma: o tipo fechado
  reprova no `tsc` (`TS2353`, com controle positivo limpo sem a mutação), a allowlist de runtime
