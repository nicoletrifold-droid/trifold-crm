  régua: alvo textual inexistente **ABORTA** ("ALVO NÃO ENCONTRADO"), não sai verde — é o oposto
  dos onze instrumentos cegos desta onda. Suíte **284/3656**, lint 0 erros e **0 warnings nos
  arquivos da story**, `type-check` verde, `eslint src` 1214/0.
  Encontrei o **décimo primeiro**, e é a classe que a coordenação previu: uma que o call site não
  alcança. Fica registrada como **forward-gate** (QA-900-24-5) — não bloqueia o merge porque em
  `both` ela não perde dado e a própria query 4 da AC9 a detecta, mas tem de fechar antes de
  `identifier` ser levado a sério.
