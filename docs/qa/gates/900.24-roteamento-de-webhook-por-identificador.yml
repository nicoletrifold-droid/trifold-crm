# ═════════════════════════════════════════════════════════════════════════════
# 1. AS 4 CONCERNS — FECHADAS, COM O VERMELHO REPRODUZIDO POR MIM
# ═════════════════════════════════════════════════════════════════════════════
concerns_fechadas:
  metodo: >-
    Mesmas mutações da rodada 1, no arquivo em disco, sha256 antes/depois, restauro conferido por
    sha256, e guarda que aborta se o alvo não existir. Baseline 121p verde nos 5 arquivos.
  medido: |
    | classe | mutação                                             | rodada 1 | **rodada 2** |
    |--------|-----------------------------------------------------|----------|--------------|
    | 1 PII  | `+telefone_do_lead` (whatsapp)                      | 🟢 111p  | 🔴 **0p/1f** |
    | 1 PII  | `+nome_do_lead` (meta_ads)                          | 🟢 111p  | 🔴 **0p/1f** |
    | 1 PII  | `+email_do_lead` (landing_page)                     | 🟢 111p  | 🔴 **0p/1f** |
    | 1 PII  | `+chat_id` (telegram)                               | 🟢 111p  | 🔴 **0p/1f** |
    | 2 await| `await`→`void` (whatsapp)                           | 🟢 111p  | 🔴 **0p/1f** |
    | 2 await| `await`→`void` (meta_ads)                           | 🟢 111p  | 🔴 **0p/1f** |
    | 2 await| `await`→`void` (landing_page)                       | 🟢 111p  | 🔴 **0p/1f** |
    | 2 await| `await`→`void` (telegram)                           | 🟢 111p  | 🔴 **0p/1f** |
    | 3      | `webhookLogsExistenteId` removido (meta_ads)        | 🟢 111p  | 🔴 **0p/1f** |
    | 3      | `webhookLogsExistenteId` removido (landing_page)    | 🔴 já era| 🔴 **0p/2f** |
    | 4      | `webhookLogsSource`→`"other"` (whatsapp)            | 🟢 111p  | 🔴 **0p/1f** |
    | 4      | `webhookLogsSource`→`"other"` (meta_ads)            | 🟢 111p  | 🔴 **0p/1f** |
    | 4      | `webhookLogsSource`→`"other"` (landing_page)        | 🟢 111p  | 🔴 **0p/1f** |
    **13/13.**

  disjuncao_pedida_pela_coordenacao:
    pergunta: "A correção da concern 1 apagou a régua da concern 2?"
    resposta: "NÃO — os conjuntos de morte são DISJUNTOS, medido por nome de teste."
    medido: |
      | mutação (whatsapp)      | teste que morre |
      |-------------------------|-----------------|
      | `+telefone_do_lead`     | "o que a rota passa a `logOrgUnresolved` é EXATAMENTE isto" |
      | `await` → `void`        | "a escrita de `WEBHOOK_ORG_UNRESOLVED` COMPLETA antes de a rota responder" |
      | `webhookLogsSource`     | "o que a rota passa … EXATAMENTE isto" (compartilhada com a classe 1) |
      O espião de `logOrgUnresolved` **delega ao real** (`vi.mock` + `importOriginal`, chamando
      `real.logOrgUnresolved(...)`), então o `await` do call site continua sendo exercitado —
      confirmado pelo fato de a mutação `void` derrubar um teste DIFERENTE do da PII.
    nota: >-
      As classes 1 e 4 compartilham o mesmo `toEqual`. Medi a consequência: trocar `toEqual` por
      `toMatchObject` deixa a suíte **VERDE (121p)** — as duas classes ficam cegas com uma edição
      só. Não é concern (enfraquecer um teste é invisível por construção em qualquer suíte), mas o
      `toEqual` é load-bearing e vale um comentário no teste dizendo isso.

  concern_1_as_tres_camadas:
    camada_1_tipo:
      medido: |
        Com `telefone_do_lead` no call site do whatsapp:
        `src/app/api/webhook/whatsapp/route.ts(477,56): error TS2353: Object literal may only
        specify known properties, and 'telefone_do_lead' does not exist in type
        'Partial<Record<"phone_number_id" | "page_id" | "quantidade_organizacoes_ativas", …>>'`
        **Controle positivo:** sem a mutação, `tsc --noEmit` sai **limpo**. O tipo fechado é gate
        de verdade, e recupera a defesa que se perdeu quando o tipo teve de aceitar `number`.
    camada_2_runtime:
      medido: >-
        Neutralizei a allowlist (`permitidas.has` → sempre `true`): **1 falha**. A segunda barreira
        tem carrasco próprio — não é código decorativo.
      pii_no_log_de_recusa: >-
        Conferido na leitura: só o NOME vai para `identificador_chaves_recusadas`
        (`chavesRecusadas.push(chave)`), nunca o valor. É a decisão certa: o valor é o que pode ser PII.
    camada_3_call_site:
      medido: "É a que morde primeiro nas 4 rotas (tabela acima)."
      alem_da_chave: |
        Sondei também a CONTRABANDA POR VALOR (tipo e allowlist são de CHAVE, não de valor):
        pôr um dado do lead como VALOR de uma chave permitida.
        | mutação (só variáveis EM ESCOPO)                | resultado |
        |--------------------------------------------------|-----------|
        | whatsapp `phone_number_id := fromRaw`            | 🔴 0p/1f |
        | meta_ads `page_id := leadgenId`                  | 🔴 0p/1f |
        | landing  `quantidade := fields.email`            | 🔴 0p/2f |
        | telegram `quantidade := chatId`                  | 🔴 0p/2f |
        Fecha porque o `toEqual` afirma o VALOR exato, e as asserções de serialização confirmam que
        nada do lead aparece no evento. **Aviso de método:** a primeira tentativa desta sonda usou
        `from`, fora de escopo, e deu VERMELHO por `ReferenceError` — falso vermelho. Refiz com
        variáveis em escopo. É o modo de falha da MINHA régua e fica registrado.

  mutacoes_de_helper_reexecutadas: |
    | # | mutação                                        | resultado |
    |---|------------------------------------------------|-----------|
    | H1| `select` sem `access_token`                    | 🔴 0p/1f |
    | H2| `resolveSoleOrg` sem `id` no select            | 🔴 0p/2f |
    | H3| `.limit(2)`→`.limit(1)` (whatsapp)             | 🔴 0p/2f |
    | H4| `.limit(2)`→`.limit(1)` (soleOrg)              | 🔴 0p/1f |
    | H5| `resolveSoleOrg` sem o filtro `is_active`      | 🔴 0p/3f |
    | H7| `logEventOnce`→`logEvent` no helper            | 🔴 0p/16f |
    Seguem vermelhas depois do refactor. Nenhuma ficou inerte.

  comportamento_da_regua:
    pedido: "confirmar que a régua AVISA em vez de passar verde quando o alvo se move"
    medido: >-
      Rodei a sonda contra um alvo inexistente (`ALVO_QUE_NAO_EXISTE_ZZZ`): o sha256 não muda, a
      régua imprime **"⛔ ALVO NÃO ENCONTRADO"** e **aborta sem medir**. Confirmado, e é o oposto
      do 9º instrumento cego desta onda (`vitest -t` sem casamento sai **exit 0**, que eu também
      reconferi na rodada 1). Toda régua de mutação precisa das duas guardas: alvo mutado E filtro
      não-vazio.

