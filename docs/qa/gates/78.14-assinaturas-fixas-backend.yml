top_issues:
  - id: 'REL-001'
    severity: medium
    category: reliability
    finding: >-
      PATCH /api/admin/billing-reminders/[id] com status='paid' sobre uma assinatura fixa
      seedada (due_date=NULL, billing_cycle='monthly') entra no ramo de recorrência-ao-pagar
      e chama avancarCiclo(atual.due_date, cicloEfetivo) com due_date=NULL. avancarCiclo faz
      dueDateIso.split("T") num valor null -> TypeError -> HTTP 500. É o MESMO risco de runtime
      que a AC12 corrigiu no cron, mas num segundo consumidor de due_date (o PATCH) que a
      mudança de nullable (AC1) tornou vulnerável e a story não cobriu.
    reachability: >-
      Não alcançável por nenhuma UI hoje (78-15 não existe) nem pelo cron. Alcançável por
      chamada direta à API admin, e será alcançável pela UI da 78-15 se ela marcar 'paid'
      antes de o admin preencher due_date. Não afeta o risco de produção nº 1 (cron), que
      está seguro.
    suggested_action: >-
      Guardar avancarCiclo contra due_date null no [id]/route.ts (ex.: só entrar no ramo de
      recorrência se atual.due_date != null), tratado em/antes da 78-15. @dev.
  - id: 'REQ-001'
    severity: low
    category: requirements
    finding: >-
      AC10 (T-Vercel-Dedup, chamada real a GET /v1/billing/charges) permanece [ ] — verificação
      factual do overlap de dupla contagem não executável na sessão dev (sem token real).
    reachability: 'Não é defeito: default seguro (excluded=true) garante que a Vercel nunca soma até prova em contrário.'
    suggested_action: 'Executar a chamada real e escolher o ramo da AC10 no deploy. @devops. Enquanto pendente, manter excluded=true.'

