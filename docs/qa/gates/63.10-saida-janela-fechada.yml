title: "Caminho de Saída quando Janela de 24h está Fechada"
epic: 63
gate: PASS
verdict: PASS
status_reason: >
  AC1-AC6 atendidos por código. Endpoint dedicado POST /api/leads/[id]/notify-on-reply
  com autorização sólida: requireAuth (401 sem sessão) → SELECT do lead com a
  supabase do USUÁRIO (RLS por org) + .eq(org_id).eq(is_active) → gate de ownership
  (role privilegiada OU assigned_broker_id === appUser.id, senão 403) → merge JSONB
  preservando metadata existente ({ ...currentMetadata, notify_broker_on_reply }) →
  UPDATE via createAdminClient escopado por id+org_id (sem vazar cross-org).
  Idempotente (body { enabled } default true). CON-3: o endpoint só escreve
  `metadata`, NÃO toca is_ai_active. CON-1 INVIOLÁVEL: git grep ZERO ocorrências.
  Plumbing correto: page.tsx (select `*` → metadata) → ConversationThread
  (notifyOnReply) → BrokerMessageInput, sem pular o intermediário da 63-5. UI:
  botão Bell→Loader2→BellRing "Aviso configurado" (não clicável após confirmar) +
  placeholder MessageSquarePlus informativo (sem ação, sem envio real). a11y:
  aria-label, aria-live="polite" no estado confirmado, ≥44px, ícones aria-hidden.
  Suíte completa 431/431 (33 arquivos); ESLint 0 e type-check 0 nos arquivos da story.
