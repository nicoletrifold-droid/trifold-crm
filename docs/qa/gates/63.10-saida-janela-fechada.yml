gate_decision:
  verdict: PASS
  rationale: >
    Os 6 ACs estão atendidos por código. O endpoint dedicado tem autorização
    correta (requireAuth + ownership por org/role, 403/404 apropriados), o admin
    client é escopado por id+org_id (sem cross-org), o merge preserva o JSONB
    existente e a operação é idempotente. CON-3 respeitado (só metadata). CON-1
    limpo. O plumbing atravessa o ConversationThread sem pular o intermediário. O
    escopo é honesto: persiste a preferência sem prometer/realizar envio. As issues
    são LOW/CONCERNS não-bloqueantes (ausência de teste de rota — padrão do repo;
    notificação real é débito futuro por design; TOCTOU teórico inócuo p/ flag
    idempotente). Suíte 431/431; lint e type-check limpos nos arquivos da story.
    Recomendação: LIBERAR para @devops *push.
  next_steps:
    - "@devops *push (branch feat/epic-51-handoff-chat-corretor) — commit 8826843."
    - "Smoke pós-deploy: lead WhatsApp com janela fechada → botão 'Me avisar' visível; clicar → 'Aviso configurado'; reload mantém estado; SELECT metadata mostra notify_broker_on_reply=true."
    - "@sm: rastrear REL-001 (consumir notify_broker_on_reply no webhook WhatsApp) como débito futuro."
