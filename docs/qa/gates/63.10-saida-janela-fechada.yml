issues:
  - id: TEST-001
    severity: low
    category: tests
    finding: >
      Endpoint notify-on-reply e UI do caminho de saída sem teste automatizado.
      Repo não tem infra de teste de rota/componente (padrão do Epic 63 = só
      helpers puros). Lógica simples e revisada manualmente.
    suggested_action: >
      Não-bloqueante. Cobrir authz (401/403/404) e merge idempotente se infra de
      teste de rota (MSW/supertest) for introduzida.
    suggested_owner: dev
  - id: REL-001
    severity: low
    category: reliability
    finding: >
      A entrega real da notificação quando o lead responde NÃO é implementada
      (requer check no webhook WhatsApp). A preferência é persistida mas inerte até
      essa integração — placeholder "em breve" pode permanecer indefinidamente.
    suggested_action: >
      Não-bloqueante e por design (R3 da story, escopo Fase 3). Rastrear como débito
      para implementar o consumo de notify_broker_on_reply no webhook handler.
    suggested_owner: sm
  - id: SEC-001
    severity: low
    category: security
    finding: >
      Read-then-write do metadata (SELECT RLS → merge → UPDATE admin) tem janela
      TOCTOU teórica. Para um flag booleano idempotente o impacto é nulo (último
      write vence com o mesmo valor).
    suggested_action: "Não-bloqueante. Aceitável para P2; um UPDATE com jsonb_set no servidor eliminaria a janela se virar campo crítico."
    suggested_owner: dev

