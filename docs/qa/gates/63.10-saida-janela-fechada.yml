quality_checks:
  - check: "1. Requirements Traceability"
    status: PASS
    note: >
      AC1 (bloco disabledByWindow exibe msg + botão "me avisar"), AC2 (POST endpoint
      dedicado grava metadata.notify_broker_on_reply — PATCH genérico não aceita
      metadata, confirmado), AC3 (notifyEnabled ? BellRing "Aviso configurado" :
      botão; não clicável após confirmar), AC4 (page passa notifyOnReply de
      lead.metadata → useState inicial), AC5 (placeholder MessageSquarePlus cinza
      sem ação), AC6 (type-check/ESLint limpos).
  - check: "2. Code Quality & Standards"
    status: PASS
    note: >
      Endpoint dedicado (não afrouxa o whitelist do PATCH genérico — decisão
      correta de escopo). Merge JSONB preserva chaves existentes. Estados de UI
      idle/loading/confirmado/erro bem modelados. Imports absolutos @web/*. JSDoc
      explica a escolha do admin client para o merge e o escopo honesto (sem envio).
  - check: "3. Test Architecture"
    status: CONCERNS
    note: >
      Endpoint e UI sem teste automatizado. Consistente com o padrão do Epic 63
      (repo só tem teste de helper puro; sem infra de teste de rota/componente —
      sem @testing-library/jsdom/MSW; vitest env=node). A lógica do endpoint é
      simples (authz + merge idempotente) e foi revisada manualmente linha a linha.
      Suíte completa 431/431 sem regressão. TEST-001 LOW advisory.
  - check: "4. No Regressions"
    status: PASS
    note: >
      BrokerMessageInput mantém o fluxo de envio (handleSend/isDisabled) intacto;
      o novo bloco só renderiza quando disabledByWindow. ConversationThread repassa
      a prop nova com default false (retrocompatível). page.tsx adiciona só a prop.
      Suíte 431/431.
  - check: "5. Performance"
    status: PASS
    note: >
      Sem query adicional na página (metadata já vem no select `*`). O endpoint faz
      1 SELECT (RLS) + 1 UPDATE (admin). POST disparado só no clique do corretor.
  - check: "6. Security (CON-1 + endpoint authz)"
    status: PASS
    note: >
      CON-1: git grep ZERO. Authz: requireAuth → ownership por org + assigned_broker
      ou role privilegiada (403 caso contrário). SELECT com supabase do usuário
      (RLS); UPDATE admin escopado por id+org_id (id já validado como do usuário) —
      sem cross-org. Merge preserva JSONB (não clobbra outras chaves). Idempotente.
      CON-3: is_ai_active não tocado.
  - check: "7. Documentation"
    status: PASS
    note: >
      Completion Notes e AUTO-DECISION (Option B leads.metadata) honestos sobre o
      escopo: persiste preferência, NÃO entrega notificação real (débito futuro no
      webhook). Placeholder "em breve" é informativo, não promessa de release (R3).

