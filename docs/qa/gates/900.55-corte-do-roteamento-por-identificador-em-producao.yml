        n/(n+3) depois** — **nunca 100%**. O operador só teria duas saídas, e as duas são a mesma:
        não cortar nunca, ou cortar ignorando a régua.
    a_janela_nao_vira_absolvicao:
      veredito: "✅ **CONFIRMADO — por três razões, todas medidas, não argumentadas.**"
      razao_1_o_que_ela_exclui: >-
        Ela exclui **só linhas cujo valor é `null`**, e a própria AC define `null` como
        **não-evidência nos dois sentidos** ("`divergiu=null` não conta como concordância"). Não há
        um único `false` nem um único `true` de `meta_ads` para recortar — medido: 0 e 0.
      razao_2_o_veto_de_true_nao_tem_janela: >-
        A AC mantém, por escrito, que `divergiu='true'` em **qualquer** receptor veta o corte e que
        **"isto vale sobre a consulta SEM janela também"**. O histórico inteiro continua sob o veto.
        Hoje há **0 `true` em 123 linhas, em todos os receptores, desde sempre** — então não há
        nada escondido, e estruturalmente não há como esconder.
      razao_3_erro_de_ancora_e_monotonicamente_seguro: >-
        **Esta é a prova que fecha a pergunta.** Simulei a janela ancorada em `now()`:
        `created_at > now()` devolve **0 linhas para os DOIS receptores**. Ou seja, **a janela não
        concede nada — ela ZERA o contador e exige prova nova.** E os dois erros de âncora são
        conservadores: ancorar **tarde demais** encolhe a janela ⇒ menos eventos ⇒ **mais difícil**
        bater `n ≥ 3`; ancorar **cedo demais** readmite as 3 linhas `null` ⇒ o `100% false`
        **falha**. **Não existe valor de âncora que torne o critério mais fácil que a verdade.**
      razao_4_auditabilidade: >-
        A AC obriga a colar no Dev Agent Record **as duas versões da consulta** (com e sem janela).
        A exclusão fica explícita e conferível, nunca silenciosa.
    a_autocorrecao_do_po_confere_numericamente:
      alegacao: "aplicar a janela ao `whatsapp` zeraria 115/115 e atrasaria um P0 em ~um dia"
      medicao: >-
        **Confere.** `whatsapp` está em **120/120** agora (era 115 às 15:19Z; última linha
        15:43Z), acumulados em ~21,7h ⇒ ~5,5 eventos/h. Com a janela, o contador vai a **0** e
        rebater `n ≥ 100` leva **~18h**. "~um dia" é o número certo, e o critério sem janela é o
        **mais estrito** dos dois — aplicá-lo ao `whatsapp` não mediria nada de novo. A primeira
        versão (janela para todos) era um erro real, e ele se corrigiu antes de custar o dia.

  # ─────────────────────────────────────────────────────────────────────────────
  a_regua_derrubada:
    pergunta: "Ele derrubou a régua que eu e o @dev sugerimos (contar linhas na trilha, `>= 1`/`>= 2`). Concordo?"
    veredito: >-
      ✅ **CONCORDO INTEIRAMENTE — e a régua defeituosa era a MINHA.** Verifiquei nos **objetos
      vivos de produção**, por linha, não no arquivo de migration.
    o_que_li_no_objeto_vivo:
      _org_integration_write_secret: >-
        `UPDATE org_integrations SET config = p_config, secret_ref = v_secret_ref, updated_at =
        now()` — **`status` não aparece no `SET`.** Registra `v_action := 'org_integration.
        secret_write'` (ou `'org_integration.page_id_reassigned_cross_org'` se outra org já tiver
        o `page_id`). O `'connected'` que aparece na definição está em **comentário** — a extração
        por linha com `l !~ '^\s*--'` mostra isso; um `ILIKE` sobre o blob mentiria.
      _org_integration_mark_connected: >-
        `UPDATE org_integrations SET status = 'connected', updated_at = now()`, registra
        `'org_integration.marked_connected'`, e **RAISE** *"sem secret_ref — não marca connected
        sem um segredo gravado"*. A ordem é imposta pelo banco, não pelo checklist.
    por_que_a_minha_regua_era_verde_sob_o_defeito: >-
      Duas chamadas de `write_secret` produzem **2 linhas** na trilha e deixam
      `status='disconnected'`. `resolveOrgByMetaPage` exige `status='connected'` desde a 900-51 ⇒
      **não resolve** ⇒ a AC3 nunca fecha para `meta_ads` ⇒ o corte quebra a entrada de leads
      pagos. Uma régua `platform_audit_log >= 2` sai **VERDE exatamente nesse cenário**. É o meu
      próprio padrão de "contador que satura" na forma de "contador que não discrimina": o número
      certo pelo caminho errado.
    a_regua_nova_e_correta: >-
      **As duas ações NOMEADAS** (`org_integration.secret_write` **e**
      `org_integration.marked_connected`) **mais** `org_integrations` com `status='connected'`,
      `secret_ref` não nulo e `config->>'page_id'` com 15 dígitos. As duas ações são disjuntas por
      construção (cada RPC grava a sua), então nenhuma repetição de uma cobre a ausência da outra.
    a_terceira_perna_que_tambem_esta_certa_e_quase_ninguem_pega: >-
      **`config->>'page_id'` (valor), não `config ? 'page_id'` (chave).** Medido AGORA em produção:
      a linha `meta_ads` **já tem a chave** `page_id`, com valor JSON `null` —
      `jsonb_typeof(config->'page_id')='null'`, `config->>'page_id' IS NULL`,
      `length(coalesce(config->>'page_id','')) = 0`, e `page_id` é a **única** chave do `config`.
      Uma régua escrita `config ? 'page_id'` estaria **VERDE hoje, antes de qualquer escrita.**
      O runbook §2 já registra exatamente isso ("a **chave** `page_id` presente com **valor
      nulo**"), e a AC exige os 15 dígitos. **Eles pegaram a armadilha.**

