  - id: QA-900-55-6
    severidade: MEDIUM
    bloqueia: "a recomendação da AC4 como está escrita. Não bloqueia o merge da AC1."
    titulo: "A perda de `landing_page` cai sobre a TRIFOLD, e começa no onboarding — não no flip"
    medido: >-
