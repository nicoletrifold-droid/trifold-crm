      própria linha do runbook**. Não há registro da decisão em nenhum outro lugar de `docs/`.
    por_que_importa: >-
      Não é inconsistência de redação. É a autorização, para o @devops, de colocar **um token real
      de Página da Meta no Vault de produção pela primeira vez** — um segredo que, por decisão
      explícita da régua `nao-consumo.test.ts`, **nada vai ler até a Onda 7**. Uma decisão cuja
