    severidade: MEDIUM
    bloqueia: "**a Task 2 (@devops). Não executar a gravação enquanto isto não fechar.**"
    titulo: "O runbook afirma uma decisão do dono do produto que a story registra como ABERTA"
    medido: >-
      `docs/runbooks/900-55-corte-do-roteamento-por-identificador.md:58` — *"**Decisão do dono do
      produto (registrada 2026-08-31):** gravar o **token real da Página** junto do `page_id` (…)
