# ═════════════════════════════════════════════════════════════════════════════
# 2. AS 6 MUTAÇÕES — REPRODUZIDAS, COM tsc rc=0 ANTES DE CONTAR O VERMELHO
# ═════════════════════════════════════════════════════════════════════════════
carrasco:
  protocolo: >-
    Cada mutação foi aplicada na árvore restaurada, seguida de `npx tsc --noEmit -p
    packages/web/tsconfig.json` (rc capturado ANTES da suíte) e da suíte INTEIRA (`pnpm test`,
    296 arquivos) — nunca de um subconjunto filtrado, que é como um vermelho some sem ninguém ver.
    Forma da mutação: sempre COMPORTAMENTO, nunca `if (false)`/`const x = null`, que nesta base
    quebram o `tsc` por narrowing e produzem um vermelho de compilador disfarçado de carrasco.
  medicoes:
    - id: M1
      mutacao: "`route.ts`: motivo novo volta a `nenhuma_correspondencia`"
      tsc_rc: 0
      vermelho_medido: "1 teste / 1 arquivo"
      declarado_pelo_dev: "1 teste"
      confere: true
    - id: M2
      mutacao: "`route.ts`: `else` também emite o motivo novo (emite SEMPRE que o legado for nulo)"
      tsc_rc: 0
      vermelho_medido: "2 testes / 1 arquivo"
      declarado_pelo_dev: "2 testes"
      confere: true
    - id: M3
      mutacao: "`webhook-org.ts`: `nivelDoMotivo` devolve sempre `warn`"
      tsc_rc: 0
      vermelho_medido: "**3 testes / 3 arquivos**"
      declarado_pelo_dev: "2 testes (2 arquivos)"
      confere: false
      nota: "subdeclarado — ver QA-900-55-7. Direção segura (o teste é mais forte que o alegado)."
    - id: M3r
      mutacao: "`webhook-org.ts`: `nivelDoMotivo` devolve sempre `error` (sentido inverso)"
      tsc_rc: 0
      vermelho_medido: "**8 testes / 3 arquivos**"
      declarado_pelo_dev: "6 testes (2 arquivos)"
      confere: false
      nota: >-
        subdeclarado. Um dos 8 é PRÉ-EXISTENTE (`logOrgUnresolved > é AGUARDADO (logEventOnce),
        nunca fire-and-forget`), que assere `level` junto — colinear, inofensivo, mas precisa ficar
        nomeado para não ser lido como regressão na próxima rodada.
    - id: M4
      mutacao: "o fake volta a mentir: `maybeSingle()` devolve `linhas[0]`"
      tsc_rc: 0
      vermelho_medido: "2 testes / 1 arquivo"
      declarado_pelo_dev: "2 testes"
      confere: true
    - id: M5
      mutacao: "`process-lead.ts`: motivo novo volta a `nenhuma_correspondencia`"
      tsc_rc: 0
      vermelho_medido: "1 teste / 1 arquivo"
      declarado_pelo_dev: "1 teste"
      confere: true
    - id: M6
      mutacao: "`process-lead.ts`: `else` também emite o motivo novo"
      tsc_rc: 0
      vermelho_medido: "4 testes / 1 arquivo"
      declarado_pelo_dev: "4 testes"
      confere: true

  o_que_prova_de_verdade: >-
    **Não é a contagem de vermelhos — é a DISJUNÇÃO dos conjuntos de morte nos pares de sentido
    oposto.** M1 mata `2 empresas ativas + telefone conhecido`; M2 mata os DOIS testes de `warn` e
    NÃO mata o de M1. M3 mata os 3 testes que exigem `error`; M3r mata 8 testes que exigem `warn` e
    NENHUM dos 3 de M3. M5{1} × M6{4}, idem. Conjuntos disjuntos em três pares independentes: o
    teste discrimina a direção, não apenas reage a qualquer mexida. Se M3 e M3r matassem o mesmo
    conjunto, "subir tudo para `error`" passaria verde e o motivo novo viraria ruído — que é a
    forma mais barata de matar justamente o sinal que esta story existe para criar.

  instrumento:
    veredicto: "🔴 confirmado — o fake é carga, e o conserto era pré-requisito, não higiene."
    prova_por_codigo: >-
      `lib/tenancy/__fixtures__/fake-supabase-postgrest.ts`: `resultadoMaybeSingle(linhas)` devolve
      `{data:null, error:null, status:200}` com 0 linhas e delega a `resultadoSingular` com 1+,
      que devolve `PGRST116`/406/`data:null` para `length !== 1`. **Com 2+ linhas o fake reproduz o
      `PGRST116` — que é o mecanismo exato do defeito.**
    prova_por_mutacao: >-
      M4 (o fake volta a `linhas[0] ?? null` com `error:null`) acende exatamente os 2 testes que
      dependem da ambiguidade — e acende porque `legacyResolveActiveConfig` deixa de devolver
      `null`, o ramo `else` nunca é alcançado e a asserção do motivo novo fica **insatisfazível**.
      Sob o fake antigo o teste da AC1 ficaria vermelho por causa do instrumento, ou verde medindo
      outra coisa. O @dev está certo, e a ordem em que ele fez (instrumento primeiro) é a certa.

# ═════════════════════════════════════════════════════════════════════════════
# 3. AS DUAS CORREÇÕES DO @DEV À STORY — AUDITADAS NO OBJETO VIVO
# ═════════════════════════════════════════════════════════════════════════════
correcoes_do_dev:
  correcao_1_ac2_precisa_de_duas_chamadas:
    veredicto: "✅ CORRETA, e a story está de fato incompleta do jeito que quebraria produção."
    metodo: >-
      Não li a régua do arquivo de migration. Consultei a FUNÇÃO VIVA em produção
      (`dsopqkqjkmhytudaaolv`) por `pg_get_functiondef`, quebrada em linhas — porque um `ILIKE`
      sobre a definição inteira dá FALSO POSITIVO no comentário: minha primeira sonda acusou
      `promove_connected=true` para `_org_integration_write_secret`, e a linha real desmente.
    medido:
      _org_integration_write_secret: >-
        única escrita é `UPDATE org_integrations SET config = p_config, secret_ref = v_secret_ref,
        updated_at = now()`. **Nunca toca `status`.** O `'connected'` que aparece na definição está
        num COMENTÁRIO (o achado N2(a) do @po sobre segredo vazio). Guards presentes: P0017, P0018.
      _org_integration_mark_connected: >-
        `UPDATE ... SET status = 'connected'`, precedido do guard **P0015** (`sem secret_ref — não
        marca connected sem um segredo gravado`). Guards presentes: P0015, P0017.
      resolveOrgByMetaPage: >-
        `lib/tenancy/webhook-org.ts:221` — `.eq("status","connected")`, exigido pela 900-51/AC10. O
        gate JÁ estava escrito no cabeçalho da função desde a 900-51 (*"A assimetria ACABOU"*), e a
        story 900-55 não o incorporou. **Confirmado.**
      linha_da_trifold_hoje: "`provider='meta_ads'`, `status='disconnected'`, `secret_ref` nulo."
    consequencia: >-
      Gravar só o `page_id` deixaria a linha `disconnected`, `resolveOrgByMetaPage` continuaria sem
      resolver, a AC3 nunca fecharia para `meta_ads` e o corte quebraria a entrada de leads pagos —
      exatamente o que a story existe para evitar. **A AC2 e a Task 2.2 da story precisam ser
      corrigidas pelo @po** (eu não edito AC). O runbook §2.1 já traz as duas chamadas na ordem
      certa; o risco é o @devops seguir o CHECKLIST da story em vez do runbook.
  correcao_2_page_id_presente_com_valor_nulo:
    veredicto: "✅ CORRETA."
    medido_em_producao: >-
      `SELECT provider, status, (config ? 'page_id'), length(coalesce(config->>'page_id',''))
      FROM org_integrations` — a linha `meta_ads` tem `tem_chave_page_id = true` e
      `len_page_id = 0`. As outras 5 linhas não têm a chave. **Placeholder de seed, não chave
      ausente.** Não muda o caminho de gravação (a RPC faz `SET config = p_config`, substituindo o
      objeto), muda o diagnóstico de quem for conferir — que é o que o @dev disse.

# ═════════════════════════════════════════════════════════════════════════════
# 4. AS PERGUNTAS DA MISSION, RESPONDIDAS
# ═════════════════════════════════════════════════════════════════════════════
respostas:
  nivel_derivado_do_motivo_e_robustez_ou_acoplamento:
    veredicto: "**Robustez real**, com um acoplamento que é o desejado — e um preço que ninguém nomeou."
    a_favor: >-
      Derivar põe o mapa `motivo → nível` num ponto único e NOMEADO (`nivelDoMotivo`), e é
      exatamente isso que torna M3/M3r expressáveis como mutação de um ponto só. Com `level` por
      parâmetro, o controle negativo "os outros 3 motivos continuam `warn`" viraria uma asserção
      sobre call sites, não sobre o logger — e `webhook-org.test.ts` não teria os 4 testes de mapa
      que M3r derruba. A severidade É propriedade do estado, não do relator: quem lê o runbook §6
      decide pelo MOTIVO, e ter o nível colado nele impede que os dois divirjam.
    ressalva_ao_argumento_do_dev: >-
      A justificativa escrita ("deixaria um `error` órfão mantendo metade da asserção verde") não
      se sustenta sob a forma do teste que ele escreveu: o `toMatchObject` é ÚNICO e cobre `level` e
      `motivo` juntos, então M1 o derruba de qualquer jeito. O ganho real é outro — é o de cima, o
      da mutação de ponto único. Vale corrigir o texto para o motivo certo.
    preco_nomeado: >-
      Nenhum call site futuro poderá emitir `legado_ambiguo_novo_resolveu` em outro nível sem mexer
      no mapa. Hoje isso é correto (o motivo tem uma semântica só). Fica registrado para quando
      houver dois.
  a_ac1_nao_cobre_o_modo_legacy_concorda:
    veredicto: "**Concordo com a decisão. Discordo do motivo declarado — ele é falso para o `whatsapp`.**"
    o_que_a_story_diz: >-
      "Não há verdade barata disponível nesse modo (a informação que faltaria é o `error` que
      `legacyResolveActiveConfig` descarta)."
    o_que_eu_medi: >-
      `legacyResolveActiveConfig` (`route.ts:65-75`) usa **`.maybeSingle()`**. Pela medição que o
      próprio projeto fez contra `@supabase/postgrest-js@2.101.1` e registrou em
      `fake-supabase-postgrest.ts`, `.maybeSingle()` **só erra com 2+ linhas** — com 0 devolve
      `{data:null, error:null}`. Logo `error?.code === "PGRST116"` é um discriminante EXATO e
      barato de ambiguidade nesse receptor, disponível em `legacy` **e** em `both`, sem computar o
      resolver novo. A alegação vale para `meta_ads` (`legacyResolveActiveOrgId` usa `.single()`,
      que confunde 0 com 2+), **não** para `whatsapp`.
    por_que_ainda_concordo_em_nao_cobrir: >-
      Produção roda `both` (medido), o corte vai para `identifier`, e o rollback da AC6 volta para
      **`both`**, nunca para `legacy`. O modo é inalcançável no plano operacional inteiro. Cobrir
      seria construir carrasco para um caminho que ninguém pisa.
    por_que_o_motivo_errado_importa: >-
      Porque a mesma verdade barata fortaleceria o ramo `both` — ver QA-900-55-4.
  ac4_landing_page_5_webhooks_story_propria_basta:
    veredicto: "**Não basta como está escrito.** Ver QA-900-55-6 — falta uma condição de ordem, não uma story a mais."
  trifold_nao_muda_de_comportamento:
    veredicto: "✅ **Provado por três caminhos independentes.**"
    prova_1_alcancabilidade: >-
      Com 1 org, `legacyResolveActiveConfig` sempre resolve, então o ramo `else if (novo.status ===
      "resolvida")` — o único acrescentado — é **inalcançável**. Os ramos `identifier` e `legacy`
      não foram tocados pelo diff.
    prova_2_equivalencia_do_else: >-
      O `else` trocou `novo.status === "nao_resolvida" ? novo.motivo : "nenhuma_correspondencia"`
      por `novo.motivo`. Ele só é alcançado quando `novo.status !== "resolvida"`, isto é
      `=== "nao_resolvida"` (o tipo `ResolucaoWhatsApp`/`ResolucaoOrg` tem exatamente 2 variantes).
      Os dois ramos do ternário antigo colapsam no mesmo valor. Idem para `quantidadeEncontrada`.
    prova_3_nivel_dos_motivos_antigos: >-
      `nivelDoMotivo` devolve `warn` para os 3 motivos pré-existentes — literalmente o mesmo
      `"warn"` que estava hardcoded antes. Nenhum evento de hoje muda de nível.
    prova_4_medida: >-
      Baseline 3886 → 3900 com **zero** teste pré-existente virando vermelho, e o teste explícito
      `com UMA empresa ativa nada muda — o legado resolve e o lead nasce` (que existe para impedir
      que um bug de "cai sempre na não-resolução" passe verde nos outros três).
  a_nota_honesta_sobre_os_timeouts:
    veredicto: >-
      **Não é defeito real — e a causa declarada está errada.** Não bloqueia, mas o registro
      precisa ser corrigido.
    o_que_eu_fiz: >-
      Rodei a suíte INTEIRA **10 vezes** nesta árvore: 1 sozinha, 1 baseline (mudanças guardadas),
      **1 deliberadamente concorrente com `turbo lint --force`**, e 7 rodadas de mutação.
      `grep -c "Test timed out"` = **0 nas dez**. A rodada concorrente saiu
      `296 passed / 3900 passed / 6 xfail / rc=0` enquanto o `lint --force` fazia `8 successful` em
      36,6s ao lado. **Não reproduzi a falha em nenhum cenário — inclusive no cenário que o @dev
      culpa.**
    a_causa_mais_provavel_que_ele_nao_viu: >-
      **Há outra sessão de agente escrevendo NESTA mesma árvore de trabalho.** Entre dois comandos
      meus, o arquivo `packages/web/src/lib/tenancy/__po_probe_42a.test.ts` (uma sonda do @po para a
      story 900-42a) apareceu como `??` e existiu em disco, e minutos depois deixou de existir. Eu
      não o criei nem o apaguei. Ele é um `*.test.ts` **dentro do `include` do vitest**
      (`packages/web/src/**/*.test.ts`), e o conteúdo dele assere `expect(lancou).toBe(true)` sobre
      um furo que a story 900-42a diz existir — ou seja, se estivesse presente numa rodada ele
      **mudaria a contagem de arquivos e sairia vermelho**. Um arquivo de teste que nasce e morre
      no meio de uma rodada explica timeout e contagem instável muito melhor que `turbo lint`.
      A árvore também carrega trabalho não commitado de pelo menos três outras frentes
      (`docs/stories/epics/epic-900-*.md` editado por @po/@pm sobre 900-42a e Epic 91, ~40 arquivos
      novos de `agent-memory`, 10 drafts de story), nada disso na File List desta story.
    o_que_muda_na_pratica: >-
      Registrar "concorrente com `turbo lint --force`" fixa a causa errada, e é assim que o próximo
      timeout é dispensado com um dar de ombros. O registro certo é **"agentes concorrentes numa
      árvore de trabalho compartilhada"** — e a contramedida é rodar a régua com a árvore quieta,
      não parar de rodar o lint.

# ═════════════════════════════════════════════════════════════════════════════
# 5. CONCERNS — o que o @dev / @po precisa mudar
# ═════════════════════════════════════════════════════════════════════════════
concerns:
  - id: QA-900-55-1
    severidade: MEDIUM
    bloqueia: "o texto da AC7 e do runbook §1. NÃO bloqueia o merge da AC1."
    titulo: "O nível `error` não tem quem o entregue — o 'alarme' da AC7 é um registro passivo"
    medido: >-
      Único leitor de `system_events.level='error'` em toda a árvore:
      `app/api/cron/nicole-health/route.ts:186` (`.eq("level","error")`). Ele então roda
      `classificarErroIA(ev.message)` e faz `if (!tipo) continue`. A mensagem que `logOrgUnresolved`
      grava é `"whatsapp: org não resolvida (legado_ambiguo_novo_resolveu)"`, e as 8 assinaturas de
      `lib/alerts/erro-ia.ts` (`credit balance is too low`, `purchase credits`,
      `insufficient_quota`, `authentication_error`, `invalid x-api-key`, `permission_error`,
      `rate_limit_error`, `overloaded_error`) **não casam nenhuma** ⇒ `null` ⇒ o evento é
      descartado ANTES de qualquer decisão de canal. `git grep WEBHOOK_ORG_UNRESOLVED` fora de
      testes: 3 ocorrências, todas comentário ou o próprio ponto de emissão — **ninguém seleciona
      esse `event_type`.** Consumidores de `system_events` que não são teste: `admin/email-stats`,
      `cron/nicole-health`, `api/system-events` (filtro manual `?level=`), `lib/logger.ts`.
      Descartei supressão por dedup: o índice único é PARCIAL
      (`ux_system_events_dedupe_key ... WHERE metadata->>'dedupe_key' IS NOT NULL`) e
      `logOrgUnresolved` nunca passa `dedupe_key` — todo evento entra. Em produção há **0**
      `WEBHOOK_ORG_UNRESOLVED` em 7 dias, então não existe histórico de alguém ter notado um.
    o_que_o_error_compra_de_fato: >-
      (a) `console.error` em vez de `console.warn` no log da Vercel (`lib/logger.ts:22`);
      (b) o filtro `?level=error` de `/api/system-events`, que exige um humano ir olhar. Nada mais.
    por_que_importa: >-
      O runbook §1 chama isso de *"o alarme atrás dela"* e a AC7 inteira se apoia nele como
      substituto honesto da trava que não existe. **É um evento ESCRITO, não um alerta
      ENTREGUE.** É a mesma classe de defeito que a AC1 conserta um nível acima: um artefato que
      afirma mais do que faz. A própria AC7 diz *"Não fingir que isto é uma trava"* — o mesmo
      padrão de honestidade precisa valer para a palavra "alarme".
    correcao_exigida: >-
      Uma das duas, à escolha do @po/@dev:
      **(a) ligar a entrega** — o canal já existe (`lib/alerts/admin-whatsapp.ts`, Story 87-19);
      basta um caminho que carregue `WEBHOOK_ORG_UNRESOLVED` com motivo
      `legado_ambiguo_novo_resolveu`, com carrasco próprio (mutação: matar o predicado ⇒ vermelho);
      **ou (b) reescrever** o runbook §1 e o texto da AC7 para dizer literalmente o que existe:
      *"um registro em `system_events` de que ninguém é notificado — a detecção depende de alguém
      abrir o painel `/api/system-events?level=error`"*. (b) é aceitável e barato; o inaceitável é
