  observacao_nova:
    - id: QA-900-55-8
      severidade: LOW
      bloqueia: "nada"
      titulo: "Com a janela, o `n >= 3` do `meta_ads` vira a restrição que manda na data do corte — e cria a mesma tentação de antes"
      medido: >-
        A janela começa em **0 linhas** (simulado: `created_at > now()` ⇒ 0 nos dois receptores).
        O `whatsapp` já está batido **sem** janela (120/120), então **o `meta_ads` é a restrição
        que amarra**. Ao volume real do receptor — **3 eventos em ~30h ≈ 0,1/h** — encher a janela
        até `n ≥ 3` custa **~30h de tráfego** depois da `mark_connected`.
      por_que_registro: >-
        Se em ~30h chegarem **2** eventos, o operador cai exatamente na pressão que produziu a
        régua de contar linhas: um número que quase bate, dentro de uma janela P0 aberta. A AC
        justifica **por que 3** com medição (e está certa em não inventar 100), mas **não diz o que
        fazer com 2**. Uma frase resolve, e ela pertence à AC ou ao runbook §3, não a este gate.
      sugestao: >-
        Acrescentar ao critério do `meta_ads`: *"com `n = 0..2` dentro da janela o critério
        **não** está satisfeito — esperar, nunca baixar o limiar nem reabrir a janela para trás.
        Se o receptor não produzir 3 eventos, o caminho é investigar por que o volume caiu, não
        afrouxar a régua."*

