issues:

  - id: C1
    severity: low
    category: evidence
    titulo: "Um dos quatro `md5` do Dev Agent Record não bate com o arquivo em disco"
    declarado: "`packages/web/src/app/api/properties/[id]/route.ts` = `712ac34e4e2c0832e0d97d9769aece07`"
    medido: "`ba8ffb3ae5f6788ec101ed13716909f9`"
    metodo: >
      Medido ANTES de eu aplicar qualquer mutação e novamente DEPOIS de restaurar — o mesmo valor
      nas duas vezes. Os outros três batem exatamente (`pipeline.ts` `44b957fa…`,
      `properties/route.ts` `968404e7…`, `nicole-minimos.ts` `d8c3b43a…`).
    o_que_isso_NAO_significa: >
      Não há resíduo de mutação no arquivo. Li os 201 linhas inteiras e as quatro guardas estão
      vivas — e eu derrubei cada uma para provar (V5, V6, e a AC6-(v)/AC7 pelos testes). A suíte
      está verde no estado atual. A hipótese benigna é uma edição cosmética posterior ao cálculo
      (o Change Log fala em corrigir o comentário de `:41`, enquanto o corpo da story dizia `:37`).
    o_que_significa: >
      Para o **único arquivo que carregou o vermelho da AC6-(v)**, a afirmação "árvore restaurada
      byte a byte, `md5` conferido depois de cada mutação" **não é verificável**. Numa story cuja
      tese é o número medido, o registro precisa fechar com o disco.
    recomendacao: "Recalcular e corrigir o valor no Dev Agent Record. Dois minutos."

  - id: C2
    severity: low
    category: evidence
    titulo: "O tamanho do golden da AC3 não bate"
    declarado: "1.869 bytes"
    medido: "**2.035** (bytes = chars = 2.035, 21 linhas — `wc -c`, `wc -m` e `len()` em Python concordam)"
    o_que_isso_NAO_significa: >
      A proveniência do golden **está provada**, por outro caminho: sob a mutação M1 (semântica de
      query idêntica à do `HEAD`) o caso byte-a-byte fica verde (V3). O golden é o comportamento do
      `HEAD`, não uma gravação circular.
    recomendacao: "Corrigir o número. É o segundo do registro que não fecha (ver C1)."

  - id: C3
    severity: medium
    category: tests
    titulo: "Nenhum teste segura o `.eq(\"is_active\", true)` de `loadProperties` — a suíte fica 100% verde sem ele"
    medido: "mutação M2: **2174 passed | 7 expected fail**, zero vermelho (V4)"
    porque_importa_NESTA_story: >
      O buraco é anterior à story — mas é **esta** story que separa formalmente os dois conceitos
      (`is_active` = existe no CRM; `nicole_enabled` = a IA fala dele), e o `comment on column` da
      220 grava essa separação no banco. A partir daqui, quem refatorar `loadProperties` tem duas
      linhas que parecem redundantes e só uma delas tem teste. A que não tem é a que segura o
      empreendimento **excluído**.
    recomendacao: >
      Um `it()` a mais no `nicole-enabled.test.ts` com uma quinta linha
      (`is_active: false, nicole_enabled: true` — o estado exato que o `DELETE /api/properties/[id]`
      produz hoje) afirmando que ela **não** aparece. Uma fixture e uma asserção; simétrico ao que
      a story já fez do outro lado.
    dono: "@dev, nesta story (é barato) ou item de backlog se o @po preferir não reabrir"

  - id: C4
    severity: low
    category: requirements
    titulo: "`softDelete` não desliga `nicole_enabled` — excluir um empreendimento deixa o switch ligado"
    medido: "`api-utils.ts:29-49` só escreve `is_active: false`; a coluna nova não é tocada por nenhum dos 3 writers de `properties`"
    leitura: >
      Hoje é inofensivo: a linha do `is_active` em `loadProperties` segura. Mas a story acabou de
      criar o precedente de **restaurar** `is_active` (é o que a 221 faz) — e ela precisou de uma
      guarda de aborto exatamente porque restaurar com o switch ligado devolve o empreendimento ao
      contexto. Fora da migration, não existe guarda nenhuma: qualquer futura tela de "desfazer
      exclusão" reintroduz o empreendimento **falando**.
    recomendacao: "Item de backlog (P3): `softDelete` de `properties` zera `nicole_enabled` junto, ou o documento de arquitetura do Achado nº 5 registra o acoplamento explicitamente. NÃO corrigir aqui."
    dono: "@po/@pm — backlog"

  - id: C5
    severity: medium
    category: requirements
    titulo: "A AC8 não tem prova nenhuma — nem teste automatizado, nem conferência visual"
    detalhe: >
      A story escreve que *"nenhuma AC desta story é 'existe no painel' — todas as três acima são
      verificadas contra a resposta HTTP"*. **Duas das três não são resposta HTTP:** o badge da
      lista é render de server component (`dashboard/properties/page.tsx`) e a renderização da lista
      `faltando` é estado de client component (`edit/page.tsx`). Não há teste de render para nenhum
      dos dois, e a File List não cria nenhum.
    o_que_eu_pude_verificar: >
      Por leitura, o código está **correto**: o `select` da lista inclui `nicole_enabled`, o ternário
      emite "Nicole: ligada"/"Nicole: desligada", o `colSpan` foi de 6 para 7, o toggle tem o rótulo
      e a legenda que a story pede, o `faltando` do 422 é renderizado item a item num `<ul>` (não um
      "erro ao salvar" genérico) e o campo só entra no body quando difere de `nicoleEnabledOriginal`.
      `turbo build --force` passa 5/5.
    o_que_eu_NAO_pude_verificar: >
      **A tela.** O código não está deployado (passo 2 pendente) e as duas páginas exigem sessão
      autenticada. Não vou escrever que conferi o que não conferi. **Não é verificável agora.**
    recomendacao: "Conferência visual obrigatória na janela do passo 3, com print, por @qa; e considerar um teste de render do badge para que a AC8 pare de depender de olho humano."
    dono: "@qa, pós-deploy"

  - id: C6
    severity: low
    category: evidence
    titulo: "Off-by-one no intervalo declarado do diff de `pipeline.ts`"
    declarado: "\"os quatro hunks estão todos entre as linhas 1830 e 1866\""
    medido: "o último hunk é `+1865,3` ⇒ o intervalo real termina em **1867**"
    leitura: "Cosmético. Registro só porque o intervalo é a régua de corte declarada da story, e uma régua com um byte de folga não é régua."

