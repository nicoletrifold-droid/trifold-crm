  V9_escopo_declarado:
    zero_linhas_conferido: >
      `git diff --numstat` = vazio em `packages/ai/src/flows/identify-property.ts`,
      `flows/qualification.ts`, `flows/agenda-state.ts`, `flows/visit-slot.ts` **e**
      `chat/property-data-context.test.ts`. (Nota: os três últimos vivem em `flows/`, não em
      `chat/` como o Dev Notes sugere em dois pontos — conferi nos caminhos reais, não nos citados.)
    pipeline_ts: >
      **4 hunks**, todos dentro de `loadProperties`: `+1830,13` · `+1856,2` · `+1859,4` ·
      `+1865,3`. `buildPropertyDataContext` começa em **2099** e tem **0 linhas de diff**.
    testes_75_281: "**6** `it()` no `describe` da 75-281 (`:107`), **sem uma linha de edição**, e passam."
    resultado: CONFERE

  V10_suite_tipos_e_build:
    suite_raiz: "`npx vitest run` ⇒ **Test Files 173 passed · Tests 2174 passed | 7 expected fail (2181)** — bate exatamente com o declarado"
    type_check_lint: "`npx turbo type-check lint --force` ⇒ **13 successful, 13 total · 0 errors** · 24 warnings"
    warnings_em_arquivo_tocado: "**zero** — grep dos caminhos da File List na saída do lint devolve nada"
