story: "docs/stories/87-13-switch-por-empreendimento-do-que-a-nicole-fala.story.md"
title: "Quality Gate — um switch por empreendimento decide se a Nicole pode falar dele (W1-8, Onda 1)"
epic: 87
gate: CONCERNS
verdict: CONCERNS
review_round: 1
reviewed_by: "@qa (Quinn)"
reviewed_at: "2026-08-11"
branch: "story/87-13-switch-nicole-por-empreendimento (de origin/main em f885b06a; nada commitado)"
po_validation: "docs/qa/po-validation-87-13.md (GO 10/10 após emendas)"

status_reason: >
  **O instrumento morde, e eu o mordi por conta própria.** Removi a linha
  `.eq("nicole_enabled", true)` de `loadProperties` e a suíte da raiz devolveu **4 vermelhos**,
  nome a nome idênticos aos colados no Dev Agent Record, incluindo a mensagem **literal** exigida
  pela AC5-(iv). As três decisões que o @dev tomou fora da story têm, cada uma, um vermelho próprio
  que eu reproduzi — e a mais preocupante das três (o não-booleano) eu instrumentei com sonda
  própria: sem a guarda, `nicole_enabled: "true"` devolve **200** e grava **false**, desligando a
  Nicole em silêncio. A guarda de aborto da 221 é **transacional de verdade**: provei no projeto de
  dev `xnxvygyfyyyzwhiuoehz`, envenenando o estado e conferindo que o `UPDATE` do bloco anterior foi
  revertido — nenhum DDL experimental em produção. Suíte **2174 passed / 7 expected fail** e
  `turbo type-check lint --force` **13/13, 0 errors** batem exatamente.
  **A saída para a colinearidade resolve de verdade, e não a empurra.** Em `cadastroPos221()` os
  quatro ficam `is_active = true`, o que reduz o `is_active` a poder discriminante **zero** e deixa
  o `nicole_enabled` como único critério capaz de excluir alguém. Contei os que NÃO caem sob a
  mutação e os três são corretos que não caiam: o golden de não-regressão (por definição tem de
  ficar verde) e os dois controles-espelho, que a AC declara passantes nas duas direções.
  **O que sobra não derruba nada, mas não é nada.** Dois números do Dev Agent Record não batem — um
  `md5` e o tamanho do golden. Existe um **buraco de cobertura simétrico** que esta própria story
  abriu ao separar os dois conceitos: remover `.eq("is_active", true)` de `loadProperties` deixa a
  suíte **2174/2174 verde**, zero vermelho. E a **AC8 não tem prova nenhuma** — nem teste, nem
  conferência visual, que não é possível hoje porque o código não está no ar. Nada disso é defeito
  de código; os dois primeiros se fecham em minutos, e a AC8 é condição pós-deploy com dono.

# ────────────────────────────────────────────────────────────────────────────
# Verificado de forma independente — reproduzido, não aceito por relato
# ────────────────────────────────────────────────────────────────────────────
verificacoes:

  V1_mutacao_central_M1:
    forma: "remover a linha 1862 (`.eq(\"nicole_enabled\", true)`) de `loadProperties`; `npx vitest run` da RAIZ"
    declarado: "4 failed | 17 passed | 5 expected fail (recorte do @dev, por arquivo)"
    medido: "Test Files 2 failed | 171 passed (173) · Tests **4 failed | 2170 passed | 7 expected fail (2181)**"
    resultado: CONFERE
    os_quatro_vermelhos:
      - "AC3 > continua igual ao golden DEPOIS da 221, com os dois de volta a is_active=true — `expected [ 'Vind Residence', 'Yarden', …(2) ] to deeply equal [ 'Vind Residence', 'Yarden' ]`"
      - "AC4 > (i) o `system` enviado à Anthropic não contém Japura nem Solum — `expected 'IDIOMA: Responda EXCLUSIVAMENTE em po…' not to contain 'Japura'`"
      - "AC4 > (ii) 'quero saber do Japurá' NÃO identifica nada — `expected [ { level: 'info', …(4) } ] to have a length of +0 but got 1`"
      - "config-surfaces > properties.nicole_enabled → chat/pipeline.ts — loadProperties"
    ac5_iv_mensagem_literal: >
      `AssertionError: properties.nicole_enabled não tem consumidor no runtime.` — colada pelo
      reporter, palavra por palavra como a AC exige. É o vermelho que separa "registrei o campo"
      de "provei o campo", e ele existe.
    controle_positivo: "AC4-(iii) 'quero saber do Vind' PASSOU sob a mutação, exatamente como a AC4-(iv) manda."

  V2_auditoria_da_saida_para_a_colinearidade:
    pergunta: "`cadastroPos221()` resolve a colinearidade ou só a empurra?"
    resultado: RESOLVE
    razao: >
      `cadastroPos221()` põe `is_active = true` nas QUATRO linhas. Nesse estado o `is_active` tem
      poder discriminante **zero** — não pode excluir ninguém — e o único critério capaz de tirar
      Japura e Solum da lista é o `nicole_enabled`. Não é a colinearidade deslocada para outro par
      de campos: é a variável de confusão anulada por construção.
    os_tres_que_nao_caem_sob_M1_e_por_que_esta_certo:
      - "AC3 > 'bate byte a byte com o golden do HEAD' — usa `cadastro()` (estado colinear de hoje) DE PROPÓSITO: é o caso de NÃO-REGRESSÃO. Um caso de não-regressão que ficasse vermelho ao remover a linha estaria provando o contrário do que se propõe."
      - "AC3 > 'controle negativo: ligar o Japura QUEBRA a igualdade' — controle, verde nas duas direções por desenho."
      - "AC4 > 'com o Japura LIGADO, o mesmo turno passa a identificá-lo' — espelho de (ii), idem."
    conclusao: "Nenhum teste que a story afirma que morde deixou de morder. A contagem de 4 é a certa, e não há um quinto que devesse ter caído."

  V3_proveniencia_do_golden:
    metodo: >
      A alegação é que o golden foi gerado pelo `loadProperties` de produção ANTES de a linha do
      filtro existir. Provei sem confiar no relato: sob a mutação M1 a query de `loadProperties`
      tem exatamente a semântica do `HEAD`, e o caso "bate byte a byte com o golden do HEAD" ficou
      **VERDE**. Um golden gravado depois do filtro (circular) não sobreviveria a isso.
    resultado: CONFERE

  V4_mutacao_complementar_M2_que_ninguem_pediu:
    forma: "remover `.eq(\"is_active\", true)` de `loadProperties` (a OUTRA linha do par)"
    medido: "**Test Files 173 passed (173) · Tests 2174 passed | 7 expected fail (2181)** — ZERO vermelho"
    resultado: BURACO_DE_COBERTURA
    leitura: >
      A suíte não tem um único caso que segure o soft delete em `loadProperties`. Não é regressão
      introduzida por esta story (o buraco é anterior), mas é **esta** a story que estabelece que
      `is_active` e `nicole_enabled` são conceitos independentes — e o único guardião desse
      acoplamento passa a ser uma linha que nada protege. Ver C3 e C4.

  V5_decisao_a_papel_e_minimos_so_quando_o_valor_muda:
    forma: "`const muda = (atual).nicole_enabled !== desejado` → `const muda = true`"
    medido: "2 failed | 12 passed (14) — `AssertionError: expected 403 to be 200` e `expected 422 to be 200`"
    resultado: CONFERE
    leitura: >
      O `403 to be 200` é literalmente a regressão que o @dev descreve: sem a regra, um usuário de
      `obras`/`gerente-relacionamento` (3 pessoas ativas, medidas pelo @po) levaria 403 ao salvar
      QUALQUER coisa, porque a tela monta o body inteiro. A decisão está fixada como intenção, com
      vermelho próprio, e não como omissão.

  V6_decisao_b_nao_booleano_devolve_400:
    forma: "remover o bloco `if (typeof body.nicole_enabled !== \"boolean\") … 400` da rota"
    medido_pelo_teste: "1 failed | 13 passed (14) — `AssertionError: expected 200 to be 400`"
    medido_por_sonda_propria: >
      O teste aborta na primeira asserção, então instrumentei o efeito com uma sonda temporária
      (criada, rodada e apagada): `PATCH { nicole_enabled: \"true\" }` sobre um empreendimento
      LIGADO ⇒ **`status=200 nicole_enabled_final=false`**.
    resultado: CONFERE
    leitura: >
      Confirmado empiricamente que o modo de falha é **mudo**: a string `\"true\"` é coagida a
      `false` por `=== true`, a rota devolve **200 de sucesso** e a Nicole é **desligada sem que
      ninguém peça**, na superfície que esta story existe para tornar deliberada. A guarda é
      load-bearing e o 400 é o comportamento certo.

  V7_decisao_c_guarda_de_aborto_da_221_e_transacional:
    onde: "projeto de DEV `xnxvygyfyyyzwhiuoehz` — nenhum DDL experimental em produção (regra do gate da 87-1)"
    montagem: >
      Semeei as 4 linhas reais (mesmos `id` de produção) num `public.properties` que estava vazio e
      sem a coluna; apliquei a **220 inteira num único POST** pela Management API ⇒ coluna criada e
      backfill correto (Vind/Yarden `true`, Japura/Solum `false`).
    teste_1_aborto_com_estado_envenenado:
      preparo: "Japura ⇒ `nicole_enabled = true`; os dois seguem `is_active = false`"
      saida_bruta: >
        ERROR: P0001: Story 87-13 / migration 221: 1 dos dois empreendimentos está(ão) com
        nicole_enabled = true. Restaurar o is_active agora os devolveria ao contexto da Nicole.
        Abortado. / CONTEXT: PL/pgSQL function inline_code_block line 12 at RAISE
      prova_da_transacionalidade: >
        🔴 **O ponto.** O `UPDATE` que restaura o `is_active` está no PRIMEIRO bloco `do $$`, e a
        guarda no SEGUNDO — o `UPDATE` roda ANTES da checagem. Conferido depois do aborto:
        `Japura is_active=false · Solum is_active=false`. O `UPDATE` foi **revertido**. É
        transacional de fato, não por afirmação.
      resultado: CONFERE
    teste_2_guarda_de_duas_linhas_da_221:
      forma: "trocar o `id` do Solum por um inexistente e reaplicar"
      saida_bruta: "ERROR: P0001: … a restauração esperava afetar EXATAMENTE 2 linhas, afetou 1."
      pos_aborto: "Japura `is_active` continua `false` — a linha que casou também foi revertida"
      resultado: CONFERE
    teste_3_caminho_feliz:
      medido: "Japura `japura true false` · Solum `solun true false` — exatamente a saída esperada pela AC9"
      resultado: CONFERE
    limpeza: "linhas removidas, coluna derrubada, org de teste removida — dev voltou a `linhas=0 · coluna=0`"

  V8_producao_estado_real:
    metodo: "Management API, somente SELECT, contra `dsopqkqjkmhytudaaolv`"
    ac1_linhas: >
      `[{Vind Residence, vind-residence, is_active:true, nicole_enabled:true},
        {Yarden, yarden, true, true}, {Japura, japura, false, false},
        {Solum, solun, false, false}]` — idêntico ao colado.
    ac1_metadados: "`nicole_enabled`: `column_default = false` · `is_nullable = NO` · `data_type = boolean` — e `is_active` devolve `true`/`NO`, o formato de comparação que a AC pede."
    migration_221: "**NÃO aplicada** — confirmado pelos dois `is_active = false`."
    consequencia: "A coluna existe e é INERTE (nada a lê). O deploy do passo 2 é seguro; a ordem está certa."
    contagens_remedidas:
      - "Vind: 7 mídias · 1 tipologia · **723** leads · 104 PROPERTY_IDENTIFIED"
      - "Yarden: 5 · 2 · 68 · 22"
      - "Japura e Solum: 0 · 0 · 0 · 0"
    divergencia_publicada: >
      leads do Vind: **713** (@sm 10/08) × **721** (@po 11/08) × **722** (@dev 11/08) × **723**
