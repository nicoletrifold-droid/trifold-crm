  - id: 'MNT-001'
    severity: low
    finding: 'Na agregação de enrichment (route.ts:301-308), o gate de extração de vídeo usa `cur.video_hook_rate === null`. Num cenário raro em que a linha mais recente com video_metrics tem hook_rate=null mas completion_rate preenchido, uma linha posterior com hook_rate não-null sobrescreveria o completion_rate já capturado. Edge case sem impacto real (hook e completion são gravados juntos por buildVideoMetrics), apenas nota de robustez.'
    suggested_action: 'Opcional: extrair hook e completion com gates independentes se houver evidência de dados parciais. Sem ação obrigatória.'
