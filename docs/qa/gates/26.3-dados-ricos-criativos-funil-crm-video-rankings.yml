    finding: 'O cron meta-sync-insights/route.ts:305-307 grava o ranking cru da Meta (`i.quality_ranking ?? null`). A Meta Marketing API pode retornar variantes `BELOW_AVERAGE_10/20/35`, mas o CHECK da migration 075 só aceita os 3 valores canônicos (ABOVE_AVERAGE/AVERAGE/BELOW_AVERAGE) — inserts com variantes seriam rejeitados, de modo que ads "abaixo da média" podem nunca persistir ranking e o badge vermelho "Abaixo da média" pode nunca aparecer na prática. Issue de completude de dados na camada cron/migration (075 + meta-sync-insights), PRÉ-EXISTENTE e FORA do escopo read-only desta story.'
