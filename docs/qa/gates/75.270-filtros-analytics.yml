schema: 1
story: '75-270'
story_title: 'Filtros do Analytics: corretor, calor e perfil do lead'
gate: CONCERNS
status_reason: 'Nenhum HIGH, e a base está bem resolvida: FILTER_SPEC como fonte única, opções
  facetadas, e o bug que impedia somar filtros (links montados à mão que se atropelavam) morreu com
  cobertura de teste. Dois motivos para CONCERNS, ambos declarados pelo próprio @dev em vez de
  escondidos: (a) **AC6 (PDF) não foi entregue** — e a decisão de PARAR está certa, ver QA-001;
  (b) 4 dos 11 ACs são de RENDER e não têm cobertura (server component com links). tsc 0, eslint 0
  nos arquivos da story, vitest 132/1593 (+80).'
reviewer: 'Quinn'
updated: '2026-08-04T15:10:00Z'
quality_score: 85
expires: '2026-08-18T15:10:00Z'

evidence:
  tests: '132 arquivos / 1593 testes; +80 em 2 suítes novas'
  tsc: 'limpo (8/8)'
  eslint: '0 erros e 0 warnings nos arquivos da story'
  medicao_que_moldou_o_desenho: 'Reconferi por query independente: corretor 97,6% e calor 79,6%
    preenchidos; os 8 campos de perfil entre 1,0% e 2,3%. É o que justifica a contagem no rótulo —
    sem ela, "Casado (31)" de 1.657 leads faria a tela parecer quebrada. Entregar o que o Marcos
    pediu SEM esconder a escassez é a decisão certa.'
  ac11_verificado: 'O risco que o @po levantou está fechado no lugar certo (o spec, não a UI):
    `profissao`/`cidadeBairro` com `ci: true` → `ilike` com curinga escapado, e `facetOptions`
    elege a grafia mais comum, igual ao `aggregatePerfil`. Teste prova que a contagem do rótulo é a
    contagem devolvida.'
  ac2_verificado: 'Teste explícito do bug original: trocar empreendimento preserva o corretor.
    Antes o href era string à mão e descartava tudo fora de property_id+range.'
  facetado: 'Teste percorre cada opção oferecida e confirma que combinada com os filtros vigentes
    sobra ao menos 1 linha (AC4), e que a dimensão selecionada não se auto-colapsa.'
  ac7_sem_regressao: 'Por leitura: sem filtro, `hasAnyFilter` é false e o caminho da RPC é o mesmo
    de antes. Os 7 pontos migrados vivem no ramo filtrado.'
  trace:
    ac_covered: [4, 8, 9, 10, 11]
    ac_gaps: [1, 2, 3, 5, 6]
    ac_gaps_motivo: 'AC1/AC2/AC3/AC5 são de render (server component com links — lógica coberta por
      unidade, tela não aberta). AC6 não implementado, ver QA-001.'

nfr_validation:
  security:
    status: PASS
    notes: 'Nenhuma mudança de autorização; a página segue com o mesmo gate de role. Os filtros são
      `.eq()`/`.ilike()` parametrizados via PostgREST — sem concatenação de SQL. O curinga do LIKE
      é escapado, então valor de usuário não vira busca por prefixo.'
  performance:
    status: CONCERNS
    notes: 'A story adiciona UMA query nova por render (facetamento, ~12 colunas na janela) e, com
      filtro ativo, o card "Leads por Empreendimento" faz uma contagem por empreendimento. Após o
      fix do QA-002 o facetamento usa o recorte de ativos (612 em 90d), longe do teto de 1000.
      Segue como CONCERNS pelo custo das N contagens por empreendimento no caminho filtrado —
      hoje são 2 empreendimentos, então é barato; com muitos, revisitar.'
  reliability:
    status: PASS
    notes: 'Módulos puros e testados; `parse` trata string vazia, espaço e param repetido. O
      genérico livre em `applyLeadFilters` (fix do TS2589) é coberto pelo teste com fake, então o
      cast interno não é fé.'
  maintainability:
    status: PASS
    notes: 'Adicionar filtro = uma linha no FILTER_SPEC. O teste "todas as dimensões do spec são
      lidas" impede filtro meio-implementado.'

top_issues:
  - id: 'QA-001'
    severity: medium
    category: requirements
    finding: 'AC6 (PDF respeita os filtros) NÃO entregue. Endosso a decisão de parar: o
      `buildAnalyticsReportData` tira métricas, funil, empreendimentos, corretores e origens da RPC
      `get_analytics_summary_ranged`, que só aceita org + datas — aplicar filtro nas 4 queries
      diretas e não nos números da RPC geraria PDF misturando filtrado com não filtrado, divergindo
      da tela sem sinal. Meio-filtrado mente; não-filtrado só é incompleto. O @dev reverteu e
      documentou o motivo no código, em vez de deixar parecer esquecimento — é o comportamento
      certo. Atenuante real: o PDF já ignorava o filtro de empreendimento ANTES desta story.'
    suggested_action: 'Story própria: dar ao report-data a mesma bifurcação da tela (agregar em JS
      quando há filtro). Enquanto não existir, o PDF continua sendo do período inteiro — e isso
      precisa estar claro para quem usa, senão alguém compara PDF com tela e abre bug.'
    suggested_owner: po
  - id: 'QA-002'
    severity: medium
    outcome: 'CORRIGIDO NA REVISÃO — o recorte da query de facetamento passou a ser o de ATIVOS
      (is_active + sem lost_reason), o mesmo dos cards. Resolve DUAS coisas de uma vez: (1) sai do
      teto, porque esse recorte mede 612 em 90d contra os ~1.650 do recorte largo; (2) a contagem do
      rótulo passa a ser a que o usuário vê ao aplicar o filtro — antes "Casado (31)" contaria
      perdidos e inativos e o card mostraria menos, ou seja, o rótulo mentiria. Melhor que paginar:
      paginar corrigiria o corte e deixaria a inconsistência de recorte de pé.'
    category: correctness
    finding: 'A query de facetamento não é paginada e usa o recorte LARGO (org + segmento + janela,
      SEM `is_active`/`lost_reason`) — o mesmo recorte que medi hoje na 75-269 em **1.650 leads em
      90d**. Ou seja: ela JÁ passa do teto de 1000 do PostgREST, que corta em silêncio. Efeito: em
      janelas grandes, as CONTAGENS dos rótulos ficam subestimadas e uma opção rara pode nem
      aparecer. Não afeta os números dos cards (esses vêm de queries próprias), mas afeta
      exatamente o que a story prometeu: a contagem visível.'
    suggested_action: 'Usar `fetchAllLeads` (`lib/analytics/fetch-all-leads.ts`, PR #353) na query
      de facetamento. É importar e envolver — o helper existe justamente para isto. Se o #353 ainda
      não estiver na main, rebasear nele antes de mergear esta story.'
    suggested_owner: dev
  - id: 'QA-003'
    severity: low
    category: ux
    finding: 'Com 9 dimensões de perfil + corretor + calor, a barra pode exibir até 11 seletores —
      e as de perfil, por serem raras, aparecem e desaparecem conforme o período (só entram se
      tiverem valor). A tela pode ficar visualmente instável entre períodos.'
    suggested_action: 'Observar em uso. Se incomodar, agrupar as de perfil atrás de um "mais
      filtros" — mas só depois de ver com dado real, porque quando o perfil encher (a Nicole
      auto-preenche) o cenário muda.'
    suggested_owner: po
  - id: 'QA-004'
    severity: low
    category: test-coverage
    finding: 'AC1/AC2/AC3/AC5 são de render e não têm teste. `buildAnalyticsHref` está coberto, mas
      ninguém garante que a tela CHAMA com os argumentos certos — um `periodParams` esquecido em um
      link só apareceria clicando.'
    suggested_action: 'Conferir na tela pós-deploy: aplicar corretor + empreendimento juntos e
      trocar o período, verificando que os três sobrevivem na URL.'
    suggested_owner: dev

