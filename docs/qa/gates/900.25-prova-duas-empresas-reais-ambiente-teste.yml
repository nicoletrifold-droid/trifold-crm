  substituição pelo join preserva o poder da asserção. AC15 fecha pelas duas réguas. Camada A
  **287/3693 + 6 expected fail**, lint 0 erros, type-check 8/8.
  **As duas concerns não invalidam nenhuma asserção feita hoje — elas dizem quando a prova para de
  provar.** A primeira eu medi: o contador do canário **satura no teto do PostgREST**
  (`max_rows` = **1000**, lido da config do projeto), e com os contadores saturados a MESMA mutação
