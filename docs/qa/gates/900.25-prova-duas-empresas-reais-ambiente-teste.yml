# 2. AS 3 RENÚNCIAS — JULGADAS
# ═════════════════════════════════════════════════════════════════════════════
renuncias_julgadas:
  - id: R1
    o_que: "Não conseguiu provar que `tests/` na raiz seja coberto por algum gate."
    veredicto: "ACEITA — e a renúncia é MENOR do que o buraco. Ver `concerns[1]`."
    razao: >-
      Ele mediu a metade certa (`tsc --listFiles | grep -c tests/tenancy` → 0) e registrou como
      segundo ocupante do `[MNT-001]`. Medi a consequência inteira e ela é maior: **nem lint, nem
      type-check, nem `pnpm test`** enxergam o arquivo. A renúncia é honesta; a concern é o
      tamanho real dela.

  - id: R2
    o_que: >-
      Não conseguiu exercitar o caminho de retry em campo — a instabilidade era real (2 falhas em
      6 execuções) mas 8 execuções pós-conserto não dispararam nenhuma repetição.
    veredicto: "ACEITA, e a substituição é a correta."
    razao: >-
      `retry-transporte.test.ts` (5 asserções, sem rede e sem credencial) é exatamente o que se
      faz com mecanismo que só roda quando dá azar. Li os 5 testes: o discriminante **conjuntivo**
      (`sem code` E mensagem de transporte) tem carrasco em AMBAS as pernas — o caso HÍBRIDO
      (mensagem de transporte **com** `code: PGRST116`) é o que vigia o `code`, e o `23505` puro
      vigia o regex. Os dois não são redundantes, como ele diz. Nas minhas 6 execuções da suíte,
      **zero** repetições disparadas — a rede colaborou comigo também, o que só reforça a
      necessidade do carrasco offline.
    nota_de_desenho_boa: >-
      O helper NUNCA repete resposta do banco. Numa suíte cujo propósito é não engolir erro, essa
      era a mitigação mais perigosa disponível, e ele a fechou pelo lado certo.

  - id: R3
    o_que: "A mutação de `provision_org` exigiria alterar a função no banco compartilhado; fez leitura de confirmação por `pg_get_functiondef`."
    veredicto: "ACEITA — a própria AC4 autoriza, e a alternativa era pior."
    razao: >-
      Mutar uma função no `trifold-crm-dev` compartilhado é DDL experimental em banco de terceiros
      — a classe de efeito colateral que o D7 desta mesma story mandou escopar. Além disso a
      renúncia é parcialmente compensada por medição indireta: a AC4 afirma idempotência
      EXECUTANDO `provision_org` duas vezes e checando 1 linha por slug, e a AC5 conta as 6
      `org_integrations` e o `whatsapp_config` inactive. Se a seção 1 ou a 6 sumissem, essas
      asserções acendiam. A leitura por `pg_get_functiondef` cobre o que sobra.

# ═════════════════════════════════════════════════════════════════════════════
# 3. O DÉCIMO SÉTIMO INSTRUMENTO CEGO — MEDIDO, NÃO ESPECULADO
# ═════════════════════════════════════════════════════════════════════════════
decimo_setimo_instrumento_cego:
  pergunta_da_coordenacao: "O que esta prova não consegue observar de si mesma?"
  resposta: >-
    **Ela não observa o próprio teto de leitura.** O canário conta linhas com
    `admin.from(tabela).select("id").eq(coluna, canarioId)` e usa `linhas.length` como contagem — e
    o PostgREST deste projeto tem `max_rows` = **1000** (lido da config, não inferido). Quando
    qualquer tabela vigiada do canário alcançar o teto, `antes` e `depois` passam a ser o MESMO
    número constante e `expect(depois).toEqual(antes)` fica **vacuamente verdadeiro** — para
    sempre, em silêncio, e justamente no cenário que a story teme (banco compartilhado que cresce
    com o trabalho de outra pessoa).
  medicao: >-
    Simulei o teto (`.limit(1)` no contador) com a linha de base saturada (1 lead + 1 webhook_log
    plantados no canário) e apliquei a MESMA mutação de roteamento que antes acendia a AC14.
  resultado: |
    sem teto simulado : Tests **3 failed** | 22 passed  → AC9(×2) + **AC14 VERMELHA**
    com teto simulado : Tests **2 failed** | 23 passed  → AC9(×2) + **AC14 VERDE**
  leitura: >-
    A única coisa que sobrou vermelha foi a AC9, que responde outra pergunta ("a org dona recebeu?"),
    não a pergunta do canário ("perturbei alguém além das minhas fixtures?"). O canário morreu em
    silêncio.
  hoje_e_latente: >-
    As tabelas vigiadas do canário têm hoje 0–6 linhas. **Nenhuma asserção feita nesta story está
    comprometida.** O que está comprometido é a durabilidade do instrumento.
  conserto: >-
    `select("id", { count: "exact", head: true })` e ler `count`. O comentário do código
    explicitamente recusou essa forma porque `comRetryDeTransporte` só sabe olhar `{ data, error }`
    — a compatibilidade com o helper escolheu, sem querer, a forma que satura. Consertar o helper
    para propagar `count` é a correção de uma vez só.
  registro: >-
    Vale a mesma nota que a onda toda vem colecionando: **o instrumento também é código, e código
    também tem teto.** Dezesseis instrumentos cegos vieram de lógica; este veio de um LIMITE DE
    TRANSPORTE que ninguém escreveu e que nenhuma leitura do código revela.

# ═════════════════════════════════════════════════════════════════════════════
# 4. CONCERNS
# ═════════════════════════════════════════════════════════════════════════════
concerns:
  - id: QA-900-25-1
    severidade: MEDIA
    titulo: "O contador do canário satura no teto do PostgREST (max_rows = 1000) e perde poder discriminante em silêncio"
    dono: "@dev"
    bloqueia_merge: false
    evidencia: "ver `decimo_setimo_instrumento_cego` — reprodução A/B medida por mim"
    por_que_nao_bloqueia: >-
      Latente: as 7 tabelas vigiadas têm 0–6 linhas hoje, e todas as asserções desta story foram
      medidas com o instrumento vivo. O risco é de durabilidade, não de correção.
    correcao_pedida: >-
      Propagar `count` no `comRetryDeTransporte` (ou um helper irmão) e trocar
      `contarLinhasDoCanario`/`contarDaOrg` para `{ count: "exact", head: true }`. Carrasco: um
      teste que planta N+1 linhas com teto N e exige vermelho — ou, mais barato, o mesmo A/B com
      `.limit()` que eu executei, versionado.

  - id: QA-900-25-2
    severidade: MEDIA
    titulo: "Nada no repositório vigia o produto desta story — os três gates ficam verdes com o arquivo quebrado"
    dono: "@devops / Onda 3"
    bloqueia_merge: false
    medido: |
      Plantei em `tests/tenancy/alias-vivo.test.ts`:
        const erroPlantadoQa: number = "isto nao e number"
        export const naoUsado = () => { let x; return x.y.z }
      pnpm type-check --force → Tasks: 8 successful, 8 total     (VERDE)
      pnpm lint       --force → 0 errors, 30 warnings (idênticos) (VERDE)
      pnpm test               → 287 files / 3693 passed          (VERDE)
    leitura: >-
      O `@dev` disclosou a metade do `type-check`. A consequência inteira é maior: **um PR que
      quebre, esvazie ou APAGUE `tests/tenancy/` passa por todos os gates**. A story é OUT de job
      de CI por decisão consciente e bem argumentada (custo de segundo escritor concorrente no
      banco compartilhado, sem lock) — o que a torna aceitável hoje. Mas o efeito líquido é que a
      prova da Onda 2 existe **enquanto alguém lembrar de rodá-la à mão**, e nada avisa quando
      pararem.
    correcao_pedida: >-
      Quando a Onda 3 decidir lock/TTL (o handoff que a própria story nomeia), amarrar junto: (a)
      job de CI da Camada B, e (b) enquanto isso não vier, o mínimo barato — incluir `tests/**` no
      `type-check`/`lint` da raiz, que não precisa de rede nem credencial e já pegaria o arquivo
      apagado/quebrado. Segundo ocupante do `[MNT-001]`, agora com o tamanho medido.

# ═════════════════════════════════════════════════════════════════════════════
# 5. MENORES — não pedem ação antes do merge
# ═════════════════════════════════════════════════════════════════════════════
menores:
  - id: m1
    titulo: "A lista do canário é derivada de UMA mutação observada, não do write-set do código sob teste"
    detalhe: >-
      A lição que o `@dev` tirou ("exclusão justificada é alegação") vale um nível acima: a
      **inclusão** também é. As 3 tabelas entraram porque uma mutação as iluminou, não porque
      alguém enumerou onde os receptores escrevem. Medido: **99 tabelas** do `trifold-crm-dev`
      carregam `org_id`; o canário vigia **7**. Contraexemplo concreto: `activities` tem `org_id`
      e é alvo de escrita do próprio receptor de WhatsApp sob teste
      (`webhook/whatsapp/route.ts`, ramo de opt-out de marketing) — fora do canário. Hoje é
      latente (o payload-fixture não dispara aquele ramo), mas é a mesma classe. E
      `conversations` entrou **sem carrasco próprio**.
    sugestao: "Derivar a lista do write-set (grep dos `.from(x).insert/upsert` alcançáveis pelos handlers sob teste), não da fallout da última mutação."

  - id: m2
    titulo: "O resíduo por execução é maior do que o Dev Agent Record conta"
    medido: |
      system_events: 189 → 193 após UMA execução limpa (+4), sendo:
        2 × CRON_RESUMO          org_id=null   metadata.source = 'tests/tenancy/isolamento-900-25' | 'api/cron/daily-report'
        2 × CRON_ORG_PROCESSADA  org_id=CANÁRIO  metadata = {}   ← sem marcador nenhum
    detalhe: >-
      O Dev Agent Record reporta só as linhas "casando '900-25'" (as `CRON_RESUMO`). As
      `CRON_ORG_PROCESSADA` atribuídas ao **canário** não têm `source` nem metadata e são
      indistinguíveis de uma execução real de cron contra ele. Não é corrupção e a exclusão de
      `system_events` do canário está corretamente justificada (`forEachActiveOrg` escreve lá para
      toda org ativa, por desenho) — mas a frase "não perturbei nada além das minhas fixtures"
      tem, medido, uma exceção que a documentação não nomeia com esse tamanho.
    veredicto_sobre_a_exclusao_de_system_events: >-
      **MANTIDA.** Incluí-la produziria vermelho legítimo em toda execução correta, e vermelho
      recorrente ensina a ignorar o instrumento. A justificativa é de mecanismo, não de
      conveniência — diferente da que ele derrubou sobre `leads`.

  - id: m3
    titulo: "Evidência colada envelheceu em dois pontos"
    detalhe: |
      (a) O bloco `--stat` da AC15 mostra **8 arquivos / 2027 insertions**; o HEAD real é
          **9 arquivos / 2291** (o `retry-transporte.test.ts` e as edições da story entraram
          depois da colagem). O conjunto de arquivos continua dentro dos padrões da AC15 — é a
          colagem que ficou para trás, não o fato.
      (b) O docblock de `retry-transporte.test.ts` diz "oito execuções seguidas da suíte saíram
          `20 passed`"; a suíte é **25**.
    nota: "Cosmético, mas numa story cuja disciplina inteira é 'cole o que mediu', a colagem tem que acompanhar o último commit."

# ═════════════════════════════════════════════════════════════════════════════
# 6. O db:status DIVERGENTE — julgado
# ═════════════════════════════════════════════════════════════════════════════
ledger_vs_catalogo:
  fato: "`pnpm db:status` reporta `246`/`247` PENDENTE no `trifold-crm-dev`; o ledger para na `245`."
  o_catalogo_diz_o_contrario_medido_por_mim: |
    whatsapp_config_phone_ativo       presente
    whatsapp_config_org_ativo         presente
    org_integrations_meta_page_ativo  presente
    whatsapp_sem_identificador_proprio  CHECK (… !~* 'phone[^[:alnum:]]{0,2}number[^[:alnum:]]{0,2}id')
      ← a grafia da **247**, que é o discriminante entre as duas versões da constraint
  nenhuma_ac_depende_do_ledger:
    verificado: "grep de `db:status|ledger|migrations-aplicadas|registro de migration` no bloco inteiro de ACs (linhas 216-1036) → **0 ocorrências**."
    veredicto: >-
      Confirmado: a dependência existe só na **Task 0.2** (pré-condição de processo), e o fato que
      ela queria confirmar ("247 aplicada") foi confirmado por um instrumento MAIS FORTE — o
      catálogo vivo. A Camada B exercita o catálogo, não o ledger. **Nenhuma AC fica sem lastro.**
  consequencia_para_o_devops: >-
    O `db:status` do banco de teste **não serve como pré-condição** enquanto isso não for
    regularizado, e há um risco a mais que a story não nomeia: com o ledger dizendo PENDENTE, um
    `pnpm db:apply` futuro tentaria **reaplicar** `246`/`247` no `trifold-crm-dev`. Registrar as
    duas no ledger (sem reaplicar DDL) ou documentar por que o banco de teste fica fora dele.
  dono: "@devops"

# ═════════════════════════════════════════════════════════════════════════════
# 7. RESÍDUO ACEITO — julgado
# ═════════════════════════════════════════════════════════════════════════════
residuo_aceito:
  webhook_logs_set_null:
    veredicto: "ACEITO — e a documentação está no lugar certo (`fixtures.ts`, não só na story)."
    razao: >-
      É o comportamento correto da FK (`confdeltype='n'`, único caso do catálogo — confirmei). A
      linha continua íntegra, só perde a referência. E a suíte faz o que dá para fazer: guarda os
      ids das linhas que ELA criou (`idsWebhookLogsDaAC9`, `idsComOrgIdNuloDaAC10`) e apaga por id.
      Medi o estado final: `webhook_logs` = **0** linhas no banco depois de todas as minhas
      execuções. Na prática o resíduo desta tabela é **zero**, não "aceitável".
  cron_resumo_org_id_null:
    veredicto: "ACEITO."
    razao: >-
      `forEachActiveOrg` omite `org_id` no resumo de propósito (atribuí-lo a uma org qualquer seria
      erro de atribuição), não devolve o id da linha, e caçá-la por `source`/janela seria
      exatamente o `DELETE` por predicado que esta story existe para tornar impossível. **A
      alternativa é pior que o resíduo**, e essa é a razão certa para aceitar — não "é pouca
      linha". Custo real medido: **4 linhas por execução** (ver `menores[m2]` — são 4, não 2).

