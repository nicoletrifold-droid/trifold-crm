# ═════════════════════════════════════════════════════════════════════════════
# 1. AS ALEGAÇÕES DO @dev — REPRODUZIDAS, UMA A UMA
# ═════════════════════════════════════════════════════════════════════════════
alegacoes_reproduzidas:
  metodo: >-
    Mutação aplicada no arquivo em disco, revertida por cópia byte-a-byte do backup, com `diff -q`
    e `git status --short` confirmando árvore limpa e `grep` dos marcadores → 0. Todo resíduo que
    as minhas mutações deixaram no banco compartilhado foi apagado **por id** e o estado final
    reconferido contra a linha de base que eu tirei antes de começar.

  suite_verde:
    comando: "pnpm test:tenancy"
    medido: "Test Files 4 passed (4) · Tests **25 passed (25)** — 4 execuções minhas, sem reset entre elas."
    nota: "**0 skipped.** `0 passed | N skipped` seria reprovação (AC3b.2); não é o caso."

  assercao_central:
    mutacao: "`expect(conversas[0]!.org_id).toBe(orgBId)` → `orgAId` (cross-tenant.test.ts:569)"
    medido: |
      AssertionError: expected '0540d2d0-…' to be '0933bef4-…'  // Object.is equality
       ❯ tests/tenancy/cross-tenant.test.ts:569:36
       Test Files  1 failed | 3 passed (4)
            Tests  1 failed | 24 passed (25)
    veredicto: >-
      `AssertionError`, não `ReferenceError`/`SyntaxError`/erro de setup — erro de compilação
      excluído. Exatamente 1 teste morre: a mutação é cirúrgica, não derruba a suíte por arrasto.

  canario_reprova_lead_na_empresa_errada:
    mutacao: >-
      `resolveOrgByMetaPage` ignora o `pageId` e pega `.order("created_at", asc).limit(1)` — resolve
      para o canário, a org mais antiga do banco. É a mutação que o próprio `@dev` diz ter usado.
    medido: |
      × PAGE-A → org A;  AssertionError: expected '00000000-…-000000000001' to be 'dd94af82-…'
      × PAGE-B → org B;  AssertionError: expected '00000000-…-000000000001' to be 'db1fb7d1-…'
      × AC14 · assertion 11 — teardown por id: apaga o que disse que apagaria, e NADA além
        {
          "conversations": 0,
        -  "leads": 0,          +  "leads": 2,
          "meta_capi_outbox": 0,
          "org_integrations": 6,
          "organizations": 1,
        -  "webhook_logs": 0,   +  "webhook_logs": 2,
          "whatsapp_config": 1,
        }
       Tests  3 failed | 22 passed (25)
    disjuncao_que_eu_acrescentei: >-
      **O delta vive INTEIRAMENTE nas 3 tabelas novas.** `organizations`, `whatsapp_config`,
      `org_integrations` e `meta_capi_outbox` — as 4 da lista ORIGINAL — saem idênticas sob a
      mutação. Isso converte a autocrítica do `@dev` de alegação em medição: com a lista velha, o
      canário teria ficado **verde** com 2 leads na empresa errada dentro dele. A exclusão
      justificada era, de fato, cega para o defeito-mãe da onda.
    ressalva: >-
      `conversations` entrou na lista **sem carrasco próprio** — esta mutação (Meta Ads) não
      escreve lá. A inclusão é por analogia ("o mesmo defeito no receptor de WhatsApp escreveria
      nela"), o que é razoável e barato, mas é uma alegação, não uma medição. Ver `concerns[2]`.

  fks_derivadas_em_runtime:
    medido_pela_suite: |
      [900-25] FKs bloqueantes derivadas de pg_constraint (4): agent_media_assets.org_id,
      financial_notification_log.org_id, system_events.org_id, visit_feedback.org_id
    medido_por_mim_no_catalogo: |
      confdeltype: a=4 · c=87 · n=1
      SET NULL (n): webhook_logs.org_id  — única
      bloqueantes (a): agent_media_assets, financial_notification_log, system_events, visit_feedback
    veredicto: >-
      Bate com o N1 do parecer. **Nada hardcoded**: a query deriva tabela E coluna, e aborta
      nomeando para FK composta ou fora do schema `public`. Li o SQL — os dois abortos existem.

  guarda_de_destino_fail_closed:
    achado_do_dev_confirmado: >-
      A redação da AC3 (`!ref || ehRefDeProducao(ref)`) falhava ABERTA para todo ref não cadastrado,
      e o exemplo da própria AC (`producao-falsa`, com hífen) mascarava o furo pelo parser
      (`[a-zA-Z0-9]+` → `null` → cai no ramo `!ref`). A correção para allowlist (`ehRefDeTeste`)
      está no código e eu a exercitei.
    medido: |
      TENANCY_TEST_SUPABASE_URL=https://producaofalsa.supabase.co pnpm test:tenancy
      → Error: tests/tenancy recusa rodar: https://producaofalsa.supabase.co NÃO está na allowlist
        de refs de teste (ref extraído: producaofalsa). …
         Test Files  2 failed | 2 passed (4)
              Tests  8 passed | 17 skipped (25)     exit 1
    antes_de_qualquer_fetch: >-
      SIM — a mensagem é a da guarda, não `{"message":"Invalid project ref: …"}` da Management API,
      que é o sintoma que o `@dev` mediu ANTES da correção.
    ref_de_producao: >-
      Não executei o cenário com a URL real de produção (o classificador de permissões do ambiente
      barrou o comando, e não contornei). Verifiquei a equivalência na fonte:
      `REFS_PERMITIDOS_TESTE = {"xnxvygyfyyyzwhiuoehz"}` — qualquer outro ref, inclusive o de
      produção, cai no MESMO ramo que eu exercitei acima. `alias-vivo.test.ts` já afirma
      `ehRefDeProducao("dsopqkqjkmhytudaaolv") === true` com controle negativo.

  guarda_de_credencial_dois_caminhos:
    medido: |
      | cenário                              | resultado medido                                   | exit |
      |--------------------------------------|----------------------------------------------------|------|
      | `.env.teste` presente, var VAZIA     | `Error: … .env.teste existe mas … não chegaram ao process.env — o loader … quebrou` | **1** |
      | `.env.teste` AUSENTE (movido/restaurado) | `Test Files 2 passed \| 2 skipped` · `Tests 8 passed \| 17 skipped` | **0** |
    veredicto: >-
      Os dois motivos do skip têm dois caminhos, como o N2 exigia. E o skip legítimo **não** é
      `0 passed`: `alias-vivo` + `retry-transporte` rodam sem credencial (8 passed), o que separa
      "sem ambiente" de "`include` quebrado". `.env.teste` restaurado e conferido por `shasum -a
      256 -c` (OK) com permissão `600` preservada.

  ac8_o_join_no_lugar_de_uma_coluna_que_nao_existe:
    medido: |
      information_schema.columns / messages:
      id, conversation_id, role, content, media_url, media_type, metadata, created_at
    veredicto: >-
      **A AC8 era mesmo insatisfazível como escrita** — `msg.org_id` seria `undefined`. A
      substituição **mantém o poder**: o teste afirma a cadeia inteira (linha em `messages` com o
      `wamid` EXATO → conversa dela → `conversations.org_id === orgBId` → lead da conversa →
      `leads.org_id === orgBId`). A pergunta da AC8 é "a resposta caiu no ramo `if (!config) return
      ok`?" — a EXISTÊNCIA da linha responde isso, e o escopo de org é respondido pelo join. Ele
      **não** relaxou para "a mensagem existe", que era o conserto errado disponível. Confirmado no
      código: a asserção de org está lá, não foi trocada por `toBeDefined()`.
    prova_de_que_o_join_e_load_bearing: >-
      A mutação da vivacidade (`orgBId`→`orgAId`) morde exatamente `conversas[0]!.org_id`. Se o
      join fosse decorativo, ela sairia verde.

  unicidade_nomeia_a_constraint:
    indices_no_catalogo: |
      whatsapp_config_phone_ativo      UNIQUE (phone_number_id) WHERE status='active' AND phone_number_id IS NOT NULL
      whatsapp_config_org_ativo        UNIQUE (org_id)          WHERE status='active'
      org_integrations_meta_page_ativo UNIQUE ((config->>'page_id')) WHERE provider='meta_ads' AND config->>'page_id' IS NOT NULL
    ordem_de_oid_confirmada: "phone_ativo oid **79472** < org_ativo oid **79473** — a dependência que o caso isolado (org C) remove é real, não hipotética."
    veredicto: >-
      Os 3 `toContain(nome_do_indice)` estão no código; o controle positivo (A e B com telefones
      distintos → sem erro, 2 linhas ativas) vem ANTES das falhas; a org C é provisionada e
      desmontada dentro de um `try/finally` no próprio bloco. O caso isolado é estruturalmente
      discriminante: C não tem outra linha ativa própria, então `org_ativo` não tem o que reprovar.

  ac15_nao_regressao:
    medido: |
      merge-base(origin/main, HEAD) == origin/main == aa584dfb  → `...` e `..` medem a MESMA base
      9 arquivos: story.md, package.json, vitest.tenancy.config.ts, tests/tenancy/**(6)
      `git status --short -- packages/ scripts/ supabase/` → VAZIO
    veredicto: "Zero arquivo fora dos padrões declarados. Nenhuma migration. Nenhum arquivo de produção."

  camada_a_e_gates:
    pnpm_test: "287 files / **3693 passed + 6 expected fail**"
    lint: "0 errors / 30 warnings (nenhum em arquivo desta fatia)"
    type_check: "8/8 tasks OK"
    regua_da_ac2: >-
      `grep -nE "\\[0\\] \\?\\? null"` nos 2 arquivos migrados → **0**. Controle de vivacidade da
      régua contra os blobs de origem (`aa584dfb~1`): **2** e **1**. A régua morde.

