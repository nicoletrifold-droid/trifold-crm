status_reason: >-
  **Tudo que o `@dev` alegou e que eu podia medir, eu medi — e tudo se sustentou.** `pnpm
  test:tenancy` **25 passed / 0 skipped** em 4 execuções minhas. A asserção central reproduzida:
  `orgBId`→`orgAId` acende **1 failed / 24 passed** com `AssertionError` (não erro de setup). A
  reprovação do canário reproduzida com a mutação de `resolveOrgByMetaPage`, e eu fui um passo
  além do que o `@dev` colou: **medi a disjunção** — sob a mutação, o delta vive INTEIRAMENTE nas
  3 tabelas que ele acrescentou (`leads` 0→2, `webhook_logs` 0→2) e as 4 originais ficam
  IDÊNTICAS. Ou seja, a cegueira que ele confessou está provada, não alegada: com a lista velha o
  canário teria ficado verde. As FKs conferem com o catálogo vivo (`a`=4 · `c`=87 · `n`=1, com
  `financial_notification_log` dentro e `webhook_logs.org_id` como único SET NULL). A guarda de
  destino é fail-closed de verdade: `producaofalsa` (alfanumérico, fora das duas allowlists) morre
  com a mensagem nomeando o ref, **antes de qualquer `fetch`** — que é onde a redação da AC3
