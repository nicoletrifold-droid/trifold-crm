# ─────────────────────────────────────────────────────────────────────────────
# OS DOIS REFUTES — julgados, com medição própria
# ─────────────────────────────────────────────────────────────────────────────
refute_1_QA_900_65_1:
  veredicto: "PROCEDE. O conserto dele é melhor que o meu, e a minha prescrição repetiria o defeito."
  minha_prescricao_era: "acrescentar `trifold-crm.vercel.app` à lista (1 linha)"
  por_que_ele_esta_certo: >-
    O defeito que eu nomeei era "a lista está incompleta E a prosa é falsa". Aplicar o literal e
    deixar "hoje há **dois**" teria trocado uma afirmação falsa de completude por outra — a mesma
    família de [[censo_de_superficies_e_uma_alegacao]] que eu invoquei para abrir o achado. Ele
    enumerou a CLASSE e sondou cada candidato em vez de adotar o sítio que eu citei.
  sondas_que_EU_refiz: |
    crm.trifold.eng.br                 login=200 dash=307 <title>Trifold CRM</title>
    trifold-crm.vercel.app             login=200 dash=307 <title>Trifold CRM</title>
    trifold-crm-teste.vercel.app       login=200 dash=307 <title>Trifold CRM</title>
    trifold-crm-teste-three.vercel.app login=200 dash=307 <title>Trifold CRM</title>
    trifold-crm-staging.vercel.app     login=404 dash=404   (não é o CRM — confere)
  "deixar_de_afirmar_completude_e_suficiente?": >-
    **Sim para esta story; o resíduo é dívida NOMEADA, não furo aberto.** O argumento dele sobre o
    alias por deployment (`trifold-{hash}-{team}.vercel.app`, cardinalidade ilimitada) é correto
    por construção: nenhuma LISTA pode fechar uma classe infinita — só um PADRÃO fecharia, e isso é
    decisão de desenho fora do escopo. O que importa para o risco: **os quatro hosts que um humano
    escolheria para a sonda pré-DNS estão fechados**, e o host de cliente
    (`crm.trifold.eng.br`) já estava. A prosa agora nomeia o que não cobre — que era exatamente o
    que eu cobrei.
  limite_registrado_nao_contornado: >-
    Não houve enumeração pela API da Vercel: o token da CLI nesta máquina é de outra conta
    (`403 Not authorized`). Registrado como limite da medição, **não contornado** — a existência do
    alias por deployment é afirmação arquitetural padrão da Vercel, e permanece **declarada, não
    medida**. É a única afirmação desta rodada nessa condição.
  virou_divida: "QA-900-65-8 (abaixo)"

refute_2_QA_900_65_3:
  veredicto: "PROCEDE, e o erro era MEU. As duas metades foram medidas por mim, separadamente."
  metade_a_meu_duble_nao_matava_M16: >-
    Escrevi o carrasco exatamente como o prescrevi no gate anterior (`vi.mock` de
    `@web/lib/supabase/middleware`, 3 testes), apliquei o M16 e rodei: **3/3 VERDE**. Confirmado:
    o M16 (`url.pathname = "/platform"` depois do bounce) mora DENTRO de `updateSession`, e com o
    módulo dublado o defeito **nunca executa**. Minha prescrição era da família "teste que exige a
    cegueira" — o dublê que viabiliza a medição de M15 é o mesmo que apaga M16.
  metade_b_o_duble_dele_mata_os_dois: >-
    Com o dublê em `createServerClient` (fronteira do Supabase, um nível abaixo), `proxy()` e
    `updateSession()` são os reais: **M15 → 6🔴** (`Tests 6 failed | 1 passed`) e **M16 → 2🔴**.
    Os dois kill sets são **disjuntos por describe**: M15 mata AC9(2) + AC4/AC7(2) + AC5(2); M16
    mata só os 2 de AC5, e por motivo diferente (destino errado, não ausência de chamada).
  ganho_colateral_que_confirmo: >-
    A sonda de NÃO-chamada da AC7 passou a medir o round-trip ao **Supabase**, que é o custo real
    que a AC7 existe para evitar — não a chamada a uma função intermediária. É um endurecimento,
    não uma troca lateral.

