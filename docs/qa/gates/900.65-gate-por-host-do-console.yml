# ─────────────────────────────────────────────────────────────────────────────
# QA-900-65-2 — o JSDoc agora é verdadeiro nas DUAS pontas
# ─────────────────────────────────────────────────────────────────────────────
QA_900_65_2_fechado:
  conserto: "`.replace(/\\.+$/, \"\")` depois da remoção da porta; JSDoc reescrito com a razão estrutural"
  jsdoc_e_verdadeiro_agora: >-
    **Sim, e medido por fuzz das duas pontas.** 12 formas degeneradas do host de inquilino (canônica,
    `.`, `..`, `:443`, `.:443`, `:443.`, CAIXA ALTA, CAIXA ALTA + `.`, com espaços, com `\t`/`\n`,
    `.:80`, mista) × 12 na env × 12 no cabeçalho `Host` = **144 combinações**: **zero** devolve
    `"admin"`. E nas 12, a promoção legítima de `admin.judtecnologia.com.br` continua `"admin"` —
    a normalização é **colapso**, não descarte. A exceção que o JSDoc mantém (Unicode/punycode só
    afeta a ponta do pedido) está corretamente escopada: nenhuma forma Unicode é escrita
    alternativa de um literal ASCII de `HOSTS_DE_TENANT`.
  regua_e_carrasco_de_verdade: >-
    As duas asserções novas da C6 resistem à armadilha do "conjunto de nomes": os quatro literais
    são escritos **à mão** no teste, nunca derivados de `HOSTS_DE_TENANT` — por isso M17 morre. E a
    segunda mede **efeito** (papel `"app"` + `console.error` audível), não só presença: o token
    chegou à guarda, não deixou de casar por acidente.

