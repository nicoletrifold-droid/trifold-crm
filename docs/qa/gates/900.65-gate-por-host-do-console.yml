status_reason: >-
  **Rodada 2 (re-gate do delta).** Os três achados estão fechados, e dois deles com um conserto
  MELHOR do que o que eu prescrevi — os dois refutes do @dev foram julgados e os dois procedem,
  medidos. **QA-900-65-1:** os quatro hosts declarados foram sondados por mim (`GET /login` +
  `GET /dashboard`): os quatro respondem 200 com `<title>Trifold CRM</title>` e 307 em
  `/dashboard`; `trifold-crm-staging.vercel.app` dá 404 e de fato não é o CRM. A tabela da story
  reproduz byte a byte. **QA-900-65-3:** as DUAS metades confirmadas — com o dublê que EU prescrevi
  (módulo `updateSession`), o M16 fica **3/3 VERDE**, porque o bounce mora dentro do módulo
  dublado; com o dublê dele (`createServerClient`), M15 morre **6🔴** e M16 morre **2🔴**. Minha
  prescrição era um teste que exigia a cegueira. **M15 reformulado:** `tsc` rc=0 e **incondicional
  na prática** — medido com 7 métodos HTTP, `GET=404 POST=404 PUT=404 PATCH=404 DELETE=404 HEAD=404
  OPTIONS=404`. **Contraprova reproduzida exatamente:** contra a régua só de FORMA, M15 e M16
  sobrevivem **32/32**. M17 **2🔴** e M18 **2🔴**, ambos com `tsc` rc=0 — e ambos são literalmente
  o código do commit `c01cfa03`. **`proxy.ts` e `lib/supabase/middleware.ts` byte a byte iguais a
  `c01cfa03`** (sha256 conferido + ausentes do `git status`): os sobreviventes morreram por régua,
  não por conserto de comportamento. Réguas idênticas ao declarado: **319 · 4394 | 6**, lint 0
  erros/30 avisos, type-check rc=0, build 5/5. **Nada bloqueia o merge:** todo item remanescente
  tem **população 0 medida** ou é texto de AC sem consequência de comportamento.
