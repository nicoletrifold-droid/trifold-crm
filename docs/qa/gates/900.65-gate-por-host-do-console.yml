# ─────────────────────────────────────────────────────────────────────────────
# ATAQUE AO NOVO `proxy.test.ts` — ele mede o que a função DEVOLVE?
# ─────────────────────────────────────────────────────────────────────────────
ataque_ao_carrasco_novo:
  veredicto: >-
    **Sim, é carrasco comportamental de verdade** — assevera `status`, `X-Robots-Tag`, corpo,
    `x-middleware-rewrite`, `location` e contagem de chamadas ao `createServerClient`. Não voltou a
    medir forma em nível nenhum: não há um único `toContain` sobre código-fonte nele. Mas **achei
    uma inserção que passa** — ver QA-900-65-7.
  o_que_encontrei: >-
    No caminho `"app"`, o predicado é `expect(resposta.status).not.toBe(404)` — ele nomeia o dano
    do M15 (404) e para um degrau antes do dano GERAL ("a resposta do inquilino é a de antes").
    Qualquer desvio que **preserve** a chamada ao Supabase e **não** seja 404 sobrevive.
  mutante_QA_M19_medido: >-
    Inserção DEPOIS de `await updateSession(request)`, no `proxy.ts`:
    `if (host === "crm.trifold.eng.br" && pathname !== "/login") return NextResponse.redirect(new
    URL("/manutencao", request.url))`. Resultado: **39/39 VERDE**, `tsc` **rc=0**. Efeito real:
    **100% do tráfego não-`/login` de `crm.trifold.eng.br` vira 307 para uma rota inexistente.**
    Sobrevive porque `createServerClient` foi chamado (1), o status é 307 (≠404) e
    `x-middleware-rewrite` é nulo. O `/login` fica de fora justamente para não acordar a AC5.
  conserto_medido_nos_dois_sentidos: >-
    Trocar o predicado por **passa-adiante**: comparar `[status, location]` de `proxy(req)` contra
    `[status, location]` de `updateSession(req)` chamado direto, no mesmo laço de 4 rotas. Sob
    QA-M19: 🔴 (`Expected "https://crm.trifold.eng.br/login"` / `Received
    "https://crm.trifold.eng.br/manutencao"`). No código limpo: 🟢 controle positivo verde. Kill
    set disjunto do de M15 — mata o que o `not.toBe(404)` perdoa.

# ─────────────────────────────────────────────────────────────────────────────
# A DÉCIMA OITAVA ARMADILHA
# ─────────────────────────────────────────────────────────────────────────────
armadilha_18: >-
  **O dublê que viabiliza a mutação apaga o defeito irmão — e o nível certo é o da FRONTEIRA
  EXTERNA, não o do módulo vizinho.** Eu prescrevi dublar `updateSession` porque era o vizinho
  imediato do `proxy()`. Isso mata o mutante que mora ACIMA do dublê (M15) e cega, por construção,
  todo mutante que mora ABAIXO dele (M16, dentro de `updateSession`). O dublê no lugar certo é
  aquele posto na **fronteira do sistema externo** (`createServerClient` — o Supabase), porque aí
  todo o código da própria casa continua sendo o real, e o kill set cresce em vez de trocar de
  lugar. Regra operacional: ao prescrever um dublê, pergunte **"que código deixa de executar por
  causa dele?"** e confira se algum defeito da story mora nessa região. Se morar, o dublê está
  alto demais. É irmã de [[o_duplo_que_viabiliza_a_mutacao_cega_o_vizinho]], agora do lado de quem
  PRESCREVE a régua — o gate anterior teria "provado" o conserto com um carrasco estruturalmente
  incapaz de ver metade do defeito.

