M15_reformulacao:
  minha_formulacao: "`return` incondicional no topo ⇒ resto inalcançável ⇒ `tsc` narrowa `decisao` para `never` ⇒ TS2339. Mutante que não compila NÃO é mutante. Erro meu, aceito."
  reformulacao_dele: '`if (request.method !== "___METODO_QUE_NAO_EXISTE___") { return 404 }` no topo do `proxy()`'
  compila: "`pnpm type-check --force` **rc=0**, 0 `error TS` — verificado com o mutante aplicado"
  incondicional_na_pratica: >-
    **Medido, não deduzido.** Sonda fora da árvore chamando o `proxy()` real no host de inquilino
    com a env desligada, variando o método: `GET=404 POST=404 PUT=404 PATCH=404 DELETE=404
    HEAD=404 OPTIONS=404` — 7/7. O predicado é opaco ao compilador e verdadeiro para todo método
    HTTP existente.

