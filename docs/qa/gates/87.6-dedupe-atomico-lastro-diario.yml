observacoes:

  O1_a_autocritica_e_o_padrao_da_casa: >
    O @dev encontrou, sozinho, que o defeito da story estava contaminando o teste da story — e
    encontrou porque **contou os vermelhos em vez de aceitar o número**. É a nota de processo `D5`
    da 87-4 funcionando na mão de quem implementa, sem o gate precisar cobrar. Registro como o
    melhor sinal desta leva: é a terceira aparição da classe "fake complacente" no epic (87-7 e
    87-8 pagaram as duas primeiras) e a primeira em que ela morre antes do gate.

  O2_a_prioridade_invertida_esta_certa: >
    A story nasceu "evitar linha duplicada" e o que ela entrega é "não perder a linha". A inversão
    é correta e a ordem também: sem o `await` não há linha para deduplicar; com o `await` e sem o
    `dedupe_key`, o conserto publicaria dois números por dia. Os dois na mesma entrega é a única
    combinação que não piora nada.

  O3_o_source_e_a_correcao_de_convencao: >
    `cron/…` → `api/cron/…`. Aparentemente cosmético, e não é: foi essa divergência que fez o
    `like 'cron/%'` do @po devolver vazio e alimentou a conclusão de que nenhum cron grava evento.
    Uma convenção quebrada em UM lugar produziu uma inferência errada em outro. A M7 prova que a
    correção tem teste.

  O4_NICOLE_LASTRO_FALHA_nao_tem_dedupe_key: >
    Duas invocações que falhem produzem duas linhas de falha. Está certo assim — cada invocação
    falhou de fato, e são fatos distintos. Registro só para que ninguém leia isso como esquecimento.

  O5_a_AC9_precisa_de_um_registro_final_escrito: >
    A regra de leitura do @devops era `1 linha ⇒ derruba minha medição dos dois projetos`. Saiu 1
    linha, e a inferência correta é a oposta: a medição dele foi **confirmada** por outro caminho.
    Uma regra pré-registrada que o fato falsifica é ciência funcionando — mas o desfecho tem de ser
    **escrito por quem registrou a regra**, não deixado no corpo da implementação. Sem isso, o
    próximo a ler a AC9 lê a regra antiga.

  O6_o_dedupe_do_alerta_perdeu_o_teto_de_180_dias: >
    O `select` removido filtrava por `created_at >= now() - 180 dias`; o índice (A) não tem recorte
    temporal. Um `message_id` já alertado passa a ser dedupado para sempre. É o comportamento
    desejável e o efeito prático é nulo — mas é uma diferença real entre o que saiu e o que entrou,
    e não estava escrita em lugar nenhum.

