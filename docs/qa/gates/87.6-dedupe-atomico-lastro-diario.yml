status_reason: >
  **O código está certo e a evidência é a mais limpa desta leva. As 9 mutações reproduzem, uma a
  uma, na contagem E na lista de nomes.** Não conferi um único número por relato: rodei a suíte
  inteira da raiz dez vezes (baseline + 9 mutações + 1 contraprova) e li o reporter.
  **O item que a story pediu para eu conferir com mais rigor — a autocrítica do @dev sobre o próprio
  fake — é verdadeiro e é load-bearing, e eu provei nos dois sentidos.** Com a guarda de geração a
  M1 dá **6** vermelhos; removendo APENAS a guarda e mantendo a mutação, ela dá **3** — e os três
  que ficam verdes por herança são exatamente `o RECIBO é aguardado` (o teste dedicado ao conserto),
  `AC5 dedupe_key` e `AC5 BRT`. Removendo a guarda **sem** mutação a suíte segue 1954/1954: a guarda
  não sustenta nenhum verde, ela só apaga verdes falsos. É a propriedade certa, e é a terceira vez
  neste epic que um fake complacente aparece — desta vez encontrado pelo próprio autor, por contar
  vermelho em vez de aceitar o número.
  **Os dois índices estão em produção com o DDL que a migration versiona, conferido por mim em
  `pg_indexes` (9 índices, nem 8 nem 10), e o código não depende de nenhum outro.** A ordem
  índice-antes-de-código está respeitada.
  **O que impede o PASS não é defeito de código; são três coisas que se fecham sem tocar em fonte.**
  (1) A prova no banco da AC1-b — o `23505` e, principalmente, o **vermelho** (as duas linhas
  passando ANTES do índice) — **não está transcrita em lugar nenhum**, e ela é irreproduzível agora
  que o índice está de pé: é evidência que não volta. (2) A AC8 é pós-deploy e segue aberta.
  (3) Um resíduo que a própria manchete da story torna relevante: o recibo passa a ser **muito mais**
  confiável, não **garantido** — erro de escrita que não seja `23505` continua devolvendo HTTP 200,
  sem recibo e sem `NICOLE_LASTRO_FALHA`, que é a mesma ambiguidade, uma camada abaixo.

