issues:

  - id: EVID-001
    severity: medium
    category: requirements
    titulo: "A prova no banco da AC1-b não está transcrita — e metade dela é irreproduzível"
    descricao: >
      A AC1-b-(ii) pede a mensagem `23505` colada e a AC1-b-(iii) pede o VERMELHO: as duas linhas
      entrando sem erro ANTES do índice. A AC1-a-(i) pede o log da execução do Gabriel de 08/08.
      **Nenhum dos três está no Dev Agent Record.** O @dev declarou corretamente que não executou
      (janela read-only), e o Gabriel informa ter provado os dois sentidos — mas informar não é
      colar, e o vermelho de (iii) **não volta**: com o índice de pé não há como reproduzir as duas
      inserções passando, a não ser derrubando o índice em produção, o que ninguém vai fazer por
      causa de um registro.
      O que eu consigo garantir sozinho, e garanto: o índice existe, com nome, colunas e predicado
      idênticos aos da migration. Um índice único **impõe** unicidade — isso é determinístico, não
      precisa de experimento. O que se perde sem o registro não é a certeza técnica; é a
      auditabilidade que esta família de stories decidiu que vale o preço.
    recommendation: >
      @devops/@data-engineer cola no Dev Agent Record, antes de Done: (a) o output do pré-check;
      (b) a mensagem literal do `23505` do `BEGIN…ROLLBACK`; (c) o que foi observado ANTES do
      índice, ainda que reconstruído de memória e **marcado como tal**. Se (c) não existir mais em
      lugar nenhum, escrever isso — "o vermelho de AC1-b-(iii) não foi registrado e não é
      recuperável" é um registro honesto; o silêncio não é.
    dono: "@devops"

  - id: REL-004
    severity: medium
    category: code
    titulo: "`{ inserted: false }` confunde 'já existia' com 'a escrita falhou' — e a rota não tem como saber"
    descricao: >
      `logEventOnce` devolve o mesmo `false` para `23505` e para qualquer outro erro. O
      `LOGGER_FALLBACK` distingue os dois **no console**, mas o chamador não. Duas consequências,
      e a segunda toca a manchete da story:
      **(a)** um erro transitório no insert do alerta vira alerta suprimido e contado como
      `alertas_deduplicados` — hoje inofensivo porque o Telegram está morto, amanhã não;
      **(b)** um erro no insert do RECIBO devolve HTTP **200**, sem recibo e **sem**
      `NICOLE_LASTRO_FALHA` — o `catch` só cobre exceção de `reconciliarAgenda`. Ou seja: o dia
      volta a ficar indistinguível de "o agendador não disparou", que é exatamente a ambiguidade
      que custou quatro dias.
      **Isto não é regressão** — antes o recibo se perdia por padrão. É **resíduo**, e é muito
      menor: exige o banco falhar, e deixa rastro no log da Vercel. Mas "o recibo passa a ser
      confiável" é a manchete, e a diferença entre *muito mais confiável* e *garantido* merece
      estar escrita, não subentendida.
    recommendation: >
      Não mexer nesta story (mudar a assinatura agora reabriria as 9 mutações por um ganho que não
      é do dia). Vai junto com a story dos 11 pontos expostos:
      `logEventOnce` devolve `{ inserted, reason: "duplicate" | "error" }`, a rota soma
      `alertas_falharam` separado de `alertas_deduplicados`, e o JSON de resposta ganha
      `recibo_gravado: boolean`.
    dono: "@sm (na story nova) — registrar aqui como resíduo conhecido"

  - id: DOC-002
    severity: low
    category: docs
    titulo: "A régua do DoD do `sendTelegramAdminAlert` mede a coisa errada — o @dev está certo"
    descricao: >
      O DoD pede `grep -n "sendTelegramAdminAlert" …/route.ts` ≤ 1 e o comando devolve **3**:
      import (linha 3), comentário (48) e a chamada (56). Conferido por mim. **Há exatamente 1
