achados_da_rodada_3:
  - id: "TEST-002"
    severity: low
    finding: >-
      `env-banner.test.ts` não discrimina a fonte única. Fica 22/22 verde tanto quando o
      ref de produção é trocado quanto quando a normalização é removida — porque monta as
      URLs esperadas a partir das próprias constantes (`URL_PROD = https://${REF_PRODUCAO}…`)
      e não tem nenhum caso de variação de caixa. Medi a consequência: sob a mutação, o
      banner devolve "ok" para `https://DSOPQ….supabase.co` em dev, ou seja, o instrumento
      da AC2 ficaria MUDO sobre produção — o defeito exato que a AC2 existe para não ter.
    por_que_low: >-
      A classe está guardada repo-wide: supabase-refs.test.ts (3), db-env.test.ts (3) e
      supabase-check.test.ts (1) acendem na mesma mutação, então uma regressão deixaria a
      suíte vermelha. O que falta é o carrasco na ponta certa.
    suggested_action: >-
      Um caso em env-banner.test.ts: avaliarRefDoAmbiente(URL_PROD.toUpperCase(),
      "development") === "alerta". Uma linha.
  - id: "TEST-003"
    severity: low
    finding: >-
      Nenhum teste fixa os VALORES da fonte única por literal. `supabase-refs.test.ts`
      deriva `PROD`/`TESTE` dos próprios Sets (verde na MUT1); a única âncora literal está
      em db-env.test.ts/supabase-check.test.ts. Trocar os dois conjuntos entre si é pego
      (10 vermelhos), mas pela periferia, não pelo carrasco do próprio arquivo.
    suggested_action: "Uma asserção literal em supabase-refs.test.ts: ehRefDeProducao('dsopq…') === true."
  - id: "SEC-002"
    severity: medium
    fora_do_escopo_desta_story: true
    finding: >-
      `packages/web/scripts/fix-campaign-lead-names.mjs:12` faz
      `process.env.SUPABASE_URL || "https://dsopqkqjkmhytudaaolv.supabase.co"` — default
      PRODUÇÃO — e ESCREVE (`method: "PATCH"` em leads). É a mesma classe que a AC3 existe
      para matar, num diretório irmão ao qual esta story acabou de acrescentar um arquivo
      (`next-com-env.mjs`).
    nao_bloqueia: >-
      O denominador da AC3 é explicitamente `scripts/*.ts`, e `scripts/README.md` diz
      "todo `scripts/*.ts`" — preciso e verdadeiro. O arquivo é pré-existente e não foi
      tocado por esta story.
    suggested_action: >-
      Backlog: migrar `packages/web/scripts/*.mjs` para a mesma allowlist, ou ao menos
      remover o default de produção (exigir SUPABASE_URL explícita).

