top_issues:
  - id: "DOC-001"
    status: RESOLVIDO
    resolucao: >-
      RESOLVIDO em f736355e — `git rm --cached -r supabase/.temp/` (4 arquivos fora do índice, 0 apagados do disco; project-ref com SHA-256 e8793fe3d3c6910c inalterado). REVERIFICADO PELO @qa: `git ls-files supabase/.temp/` vazio; `.gitignore` idêntico entre HEAD~1 e HEAD (logo a diferença é o ÍNDICE, não a regra); `git check-ignore` sem --no-index passa de 1 para 0. CLONE NOVO DE VERDADE (`git clone` da branch): sem `supabase/.temp/`, `supabase:check` responde "NÃO LINKADO", exit 0, fail-closed. Nesta máquina segue exit 1 (arquivo em disco, produção) — o estado audível, correto. As 3 afirmações falsas reescritas; a de `scripts/README.md` passou a ser VERDADEIRA pelo próprio conserto.
    severity: high
    category: requirements
    finding: >-
      `supabase/.temp/project-ref` NÃO é gitignored — está RASTREADO em origin/main, no
      commit-base e no HEAD, com o conteúdo `dsopqkqjkmhytudaaolv` (PRODUÇÃO). O padrão
      `supabase/.temp/` existe no .gitignore (linha 36) mas é inerte para caminhos já
      rastreados (adicionados em 0b6e1baf) — exatamente o mesmo defeito que esta story
      conserta para `.env.example`. A story afirma o contrário ("gitignored, por máquina")
      em três arquivos rastreados que ela cria ou edita — `supabase/config.toml`,
      `scripts/supabase-check.ts` e `.claude/CLAUDE.md`, este último editado sob a régua
      S1 de "as três linhas têm que ser verdadeiras ao mesmo tempo".
    impacto: >-
      (a) A story que existe para consertar documentos que mentiam publica uma mentira nova.
      (b) Muda a resposta da pergunta que a Rodada 3 arbitrou: o repositório NÃO está
      deixando de governar o link — ele está ATIVAMENTE entregando produção como projeto
      linkado a todo clone. `pnpm supabase:check` não nasce vermelho "por estado desta
      máquina": nasce vermelho para todo mundo, por conteúdo do repositório.
      (c) Existia uma quarta opção que ninguém avaliou porque todos criam o arquivo ser
      por máquina — `git rm --cached supabase/.temp/` (a regra de ignore já está lá) ou
      versionar o ref de teste.
      (d) O conserto prescrito (`supabase link --project-ref xnxvygyfyyyzwhiuoehz`) SUJA
      arquivos rastreados e pode ser commitado por acidente.
    suggested_action: >-
      Antes do push: corrigir a afirmação nos três arquivos (é edição de comentário/doc,
      barata). Abrir item para @devops/@po decidir sobre `git rm --cached supabase/.temp/`
      — candidato natural à 900-3c, que é a fatia que mexe em promoção.
  - id: "SEC-001"
    status: RESOLVIDO
    resolucao: >-
      RESOLVIDO em f736355e — `git grep 'PGHOST="db\.'` em toda a árvore rastreada: nenhuma ocorrência, inclusive nos arquivos do @po e no gate do @qa. Varredura das linhas ADICIONADAS por f736355e: zero segredo, zero saída crua. `pooler-url` auditado de forma independente pelo @qa: DSN parseado, grupo de senha AUSENTE (sem separador `:`), comprimento 0 — o pior caso era benigno. RESIDUAL PARA O @devops: a linha crua segue no HISTÓRICO da branch (9d104e73); squash no merge a apaga.
    severity: medium
    category: security
    finding: >-
      A regra E3 foi aplicada ao HEAD, não à branch. A linha crua de host (bloco `export
      PG*` da saída de `db dump --dry-run`, não reproduzida aqui por R6/E3) entrou em
      `supabase/config.toml:16` pelo commit 9d104e73 e só saiu em f3f978e8 — continua no
      histórico da branch. A MESMA linha crua estava viva em dois arquivos RASTREADOS do
      @po: `docs/backlog.md:20` e `docs/qa/po-validation-900-3b.md:852` — ambos
      substituídos por descrição pelo @dev na rodada de correção do gate. Além deles, `supabase/.temp/pooler-url`
      (rastreado, ver DOC-001) guarda um DSN de produção.
    nao_e: >-
      Não há vazamento de segredo. Varri os 3 commits e a árvore: zero `PGPASSWORD=` com
      valor, zero `eyJ…`, zero `sbp_…`, zero DSN com credencial. O host é derivado do ref,
      que é identificador público já versionado em vários arquivos.
    suggested_action: >-
      Squash no merge apaga a cópia do histórico (é a convenção da casa). Para os dois
      arquivos do @po, decidir antes do commit: substituir por descrição, como o @dev fez
      nos dele — a regra E3 não pode valer só para quem a descobriu.
  - id: "TEST-001"
    status: RESOLVIDO
    resolucao: >-
      RESOLVIDO — baseline MEDIDA pelo @qa de forma independente (as 4 suítes excluídas da árvore): 267 arquivos, 3403 passed | 6 expected fail = 3409. 3409 + 53 = 3462, fecha exato. O 3407 registrado era erro de RÓTULO: já continha os 4 casos de `gitignore-env`.
    severity: low
    category: tests
    finding: >-
      A baseline registrada na DoD não fecha. Registrado: 267 arquivos / 3407 passed /
      6 xfail (total 3413). Medido agora: 271 / 3456 / 6 (total 3462), com exatamente 53
      casos nos 4 arquivos novos ⇒ total pré-existente = 3409, quatro a menos que 3413.
      Nenhum arquivo de teste pré-existente foi modificado na branch, então essa contagem
      não podia ter mudado. A aritmética do próprio @dev tem a mesma lacuna: ele escreve
      "+42 = 4+22+16" enquanto os números dele dão 3451−3413 = 38.
    nao_e: "A alegação de fundo se sustenta — 0 falhas, nada existente quebrou."
    suggested_action: >-
      Remedir a baseline contra 255e645a e corrigir a DoD, ou registrar que o número não
      foi reproduzível. Num repo cuja própria memória de CI manda comparar
      `passed + expected fail`, o número precisa fechar.
  - id: "MNT-001"
    status: RESOLVIDO
    resolucao: >-
      ACEITO COMO DÍVIDA — registrado em docs/backlog.md com a medição de por que não é conserto de passagem (apontar o tsconfig raiz para `scripts/` expõe erros pré-existentes de resolução de módulo e `noImplicitAny`). Fora do escopo desta fatia.
    severity: low
    category: maintainability
    finding: >-
      `pnpm type-check` não cobre `scripts/` — confirmado estruturalmente: nenhum
      tsconfig inclui o diretório e o `type-check` da raiz é `turbo type-check`, que só
      abre nos pacotes. O job `static` do CI herda o ponto cego. A alegação do @dev
      procede. Esta fatia AUMENTA a superfície descoberta (4 arquivos novos + 17
      migrados em `scripts/`).
    suggested_action: >-
      Story derivada: `tsconfig.scripts.json` + um `type-check:scripts` no job `static`.
  - id: "DOC-002"
    status: RESOLVIDO
    resolucao: >-
      RESOLVIDO — `scripts/README.md` não instrui mais `node --env-file`; a tabela nomeia `packages/web/scripts/next-com-env.mjs`. `grep -n "node --env-file"` na árvore: nenhuma.
    severity: low
    category: docs
    finding: >-
      `scripts/README.md:27` ainda diz que `dev:prod` lê o env "via `node --env-file`" —
      o mecanismo que esta mesma story mediu como INOPERANTE e substituiu por
      `next-com-env.mjs`.
    suggested_action: "Trocar por `via packages/web/scripts/next-com-env.mjs`."
  - id: "MNT-002"
    status: RESOLVIDO
    resolucao: >-
      RESOLVIDO — revalidado pelo @qa com `turbo --force`: type-check 8/8 com `0 cached, 8 total`; lint 0 errors / 36 warnings com `0 cached`. O worktree fantasma `wt-900-3` ainda existe (prunable) — higiene do @devops, não da story.
    severity: low
    category: code
    finding: >-
      `pnpm lint` e `pnpm type-check` voltaram FULL TURBO na primeira execução, com
      entradas de cache geradas em `scratchpad/wt-900-3` (worktree prunable de outra
      branch). Um gate que aceita o cache mede outra árvore.
    suggested_action: "Gates futuros: `turbo <task> --force`. E `git worktree prune`."

