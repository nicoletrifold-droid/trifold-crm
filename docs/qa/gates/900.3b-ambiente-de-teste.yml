pontos_julgados:
  regua_que_nasce_vermelha: >-
    A pergunta estava mal posta, e a culpa não é do @dev. Comparar com a 900-22b só vale
    quando o vermelho é medida de estado real e o conserto tem dono; aqui o dono não é a
    máquina, é o repositório — `supabase/.temp/project-ref` é rastreado. Corrigida a
    premissa, o desenho DA RÉGUA continua certo (tornar audível, no padrão do banner da
    AC2), mas a narrativa em volta dela precisa ser reescrita. Ver DOC-001.
  ref_vindo_do_config_toml: >-
    REUSO CORRETO, não acoplamento indevido. O `config.toml` é o lugar onde o repositório
    declara qual DEVERIA ser o default; ler dali evita o terceiro nomeador do ref de teste,
    e fecha o ciclo com a régua estática da AC4a — se alguém "consertar" o config.toml
    para produção, a AC4a acende. Provado pelo teste "segue o project_id declarado, seja
    ele qual for" (raiz de mentira com `outrorefdeteste0000`).
  reversao_dos_renames: >-
    FUNCIONA. `.bak` preservado com 36 chaves; nenhum arquivo com valores foi para o git
    (só `.env.example` e `packages/web/.env.development.example`, este só com nomes); a
    assimetria de 59-vs-35 chaves está documentada com instrução de reversão byte-exata.
  tres_substituicoes: >-
    Nenhuma recria o defeito em outra forma. A do controle negativo é a mais forte: em vez
    de apagar o caso colinear, o @dev o preservou rotulado — o defeito fica documentado
    onde alguém que comparar teste e AC vai encontrá-lo.

nota_de_metodo_do_qa: >-
  Duas mutações minhas, escritas por `perl`/`node -e` no Bash, relataram sucesso e NÃO
  alteraram o arquivo — e as suítes passaram verdes. Se eu tivesse parado ali, teria
  reprovado o @dev por mutação inerte que era minha. Só a asserção de `git diff` + leitura
  do arquivo em disco no momento da execução pegou. Mutação sem prova de aplicação é
  alegação, igual à do @dev.

