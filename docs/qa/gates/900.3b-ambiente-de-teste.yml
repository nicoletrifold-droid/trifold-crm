    severity: low
    fora_do_escopo_desta_story: true
    finding: >-
      Generalizei o método que produziu o DOC-001 e varri TODOS os arquivos rastreados
      contra as regras de ignore (`git ls-files | git check-ignore --no-index --stdin -v`).
      6 casamentos, dos quais 4 são benignos (as 2 negações intencionais de `.env*.example`
