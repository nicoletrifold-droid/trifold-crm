rodada_3_codereabbit:
  contexto: >-
    O CodeRabbit achou, no PR #524, um furo que passou por mim em DUAS rodadas de gate:
    `reset-tenancy-testdb.ts` extraía o ref com regex case-INsensitive e comparava com
    `Set.has()` case-SENSITIVE. `https://DSOPQ….supabase.co` produzia `ehProducao=false`
    e o script SEGUIA para `drop schema ... cascade` CONTRA PRODUÇÃO. Todos nós — @dev,
    @po e eu, duas vezes — exercitamos a allowlist só com refs em minúsculas, a forma
    como eles aparecem na vida real. Registro como falha minha de cobertura: eu havia
    rodado uma matriz de guardas sem nunca variar a CAIXA do insumo.
  verificacoes:
    ponto_unico_de_extracao:
      varredura: "git grep de regex de URL supabase em todo .ts/.tsx/.mjs rastreado"
      resultado: >-
        UMA única ocorrência, em packages/shared/src/constants/supabase-refs.ts:46.
        Nenhum caminho extrai ref por conta própria. `extrairRef` de db-env.ts e de
        env-banner.ts são wrappers que delegam.
    reproducao_ponta_a_ponta:
      reset_maiusculo: "ABORTADO, exit 1, ref normalizado na mensagem"
      reset_caixa_mista: "ABORTADO, exit 1"
      db_env_teste_com_prod_maiusculo: "ABORTADO (guarda 3)"
      db_env_producao_maiusculo_sem_flag: "ABORTADO (guarda 1)"
      banner_em_dev: "alerta para minúscula, MAIÚSCULA e mista (as três)"
    fonte_unica_derivacao:
      resolucao: >-
        packages/shared/package.json main = src/index.ts, SEM dist — logo os testes leem
        a FONTE, não build velho. packages/web importa por `@trifold/shared`; scripts/
        importam por caminho relativo. Nenhuma segunda definição sobrevive.
      mutacao_MUT1_troca_o_ref_de_producao:
        supabase-refs.test.ts: "9 passed — NÃO acende"
        env-banner.test.ts: "22 passed — NÃO acende"
        db-env.test.ts: "7 failed"
        supabase-check.test.ts: "3 failed"
      mutacao_MUT2_remove_a_normalizacao:
        supabase-refs.test.ts: "3 failed — ACENDE"
        env-banner.test.ts: "22 passed — NÃO acende"
        db-env.test.ts: "3 failed"
        supabase-check.test.ts: "1 failed"
      leitura: >-
        A regressão que causou o incidente ESTÁ guardada repo-wide (3 suítes acendem em
        MUT2). Mas o pedido literal do coordenador — "mexa só na fonte e veja o OUTRO
        LADO acender" — NÃO se cumpre para a ponta web: env-banner.test.ts fica verde nas
        duas mutações. Ver TEST-002.
    fail_closed_dois_lados:
      metodo: "matriz de 12 células (2 ambientes x 3 classes de ref x flag x escreve)"
      resultado: >-
        Só 3 das 12 combinações com escreve=true liberam: teste+ref de teste (2, com e sem
        flag) e producao+ref de producao+flag=1. Ref DESCONHECIDO é recusado em TODAS as
        combinações, lendo e escrevendo. Nenhum caminho de escape.
    supabase_check_desconhecido: "exit 1; exit 0 reservado a ref de teste declarado e a não-linkado"
    ac6_fallback:
      correcao: "reset:527 — FALHAS_CONHECIDAS passa a ser consultada no ramo de sucesso do fallback"
      confirmacao_pedida: >-
        CONFIRMADO. FALHAS_CONHECIDAS tem 4 entradas (025 x2, 223, 224). Os 6 arquivos que
