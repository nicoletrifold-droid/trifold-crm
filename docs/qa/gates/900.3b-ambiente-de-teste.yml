      silenciosamente inadicionável, exatamente o modo de falha do `.env.example` que a AC1
      consertou.
    nao_bloqueia: >-
      Pré-existente, não introduzido pela 900-3b, e fora do escopo da fatia.
    suggested_action: >-
      Item de backlog — restringir a regra (`/logs/` na raiz) ou negar o caminho de
      código-fonte no `packages/web/.gitignore`. O comando da varredura cabe num gate futuro.

