observacao_de_processo: >
  Registro três coisas que pesaram a favor e que eu conferi por execução, não por
  leitura. Primeira: o @dev colou a divergência que mais o expõe — o tsc não pega o
  sítio :511/:512 — em vez de omitir; eu fui atrás, desmigrei a linha e o resultado foi
  o melhor possível (compilador quieto, TESTE VERMELHO). É o oposto de relatório
  inflado, e a conclusão certa é que a rede da story é a suíte, exatamente como a AC10
  previu. Segunda: ele mediu 26 onde a story dizia ~37 e escreveu o número menor, com o
  motivo; eu reproduzi e confirmei os 26. Terceira: ele NÃO inventou copy quando teve a
  ideia, registrou como sugestão e seguiu o Artigo IV — e a lacuna que sobrou é
  genuinamente do @po, porque o literal é compartilhado entre dois sítios com
  precondições diferentes.
  E registro uma armadilha que eu quase pisei neste gate: `npm run lint` me deu EXIT=0
  com "8 cached, FULL TURBO". Cache hit não é evidência. Remedi com `--force` (0 cached,
  40s) e só então o verde valeu. Vai para a memória junto com `-t` como regex e
  `grep -c`.

