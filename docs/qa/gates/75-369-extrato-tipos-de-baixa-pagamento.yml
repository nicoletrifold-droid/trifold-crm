  reais (C1) — e essa conferência foi feita no mesmo dia, contra os extratos oficiais do Vind e do
  Yarden: 89 de 89 títulos no saldo devedor e R$ 721,78 de diferença no total pago. C2 segue como
  débito registrado em docs/backlog.md e C3 foi aceito com o deploy. Nada pendente que dependa de
  código.

