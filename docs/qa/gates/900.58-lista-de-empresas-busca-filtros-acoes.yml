top_issues:
  - id: 'DOC-001'
    severity: medium
    finding: >-
      A linha de recorte da tabela de Réguas não é reproduzível. Declarado
      "16 → 18 arquivos, 312 → 370 testes". Medido: a base c2720149 tem 17 arquivos de teste
      nesses diretórios (git ls-tree), não 16; e o "370" está contaminado — webhook-org.test.ts
      carrega 136 linhas NÃO COMMITADAS de outra frente na árvore compartilhada (48 testes
      commitados × 51+each = 53 na árvore). O estado commitado é 365. O 312 da base está exato.
    suggested_action: >-
      Corrigir para "17 → 18 arquivos, 312 → 365 testes" e registrar que a medição foi feita
      numa árvore com trabalho de outra frente. O delta REAL deste commit é +1 arquivo/+53 testes.
    files: ['docs/stories/900-58-lista-de-empresas-busca-filtros-acoes.story.md']

  - id: 'DOC-002'
    severity: low
    finding: >-
      O não-provado nº 5 afirma "whatsapp_config está vazia no banco de teste". Medido agora:
      3 linhas, uma por org, todas status=inactive, criadas em 2026-08-29T21:31 e
      2026-08-31T12:30 — TODAS anteriores ao commit (2026-09-01T01:13Z). A conclusão sobrevive
      (nenhuma linha é `active`, então o tile não pode aparecer conectado), mas o motivo escrito
      é falso e era falsificável com uma chamada HTTP.
    suggested_action: >-
      Trocar por "whatsapp_config tem 3 linhas, todas `inactive` — nenhuma `active`, então o
      caminho do tile conectado não é alcançável no banco de teste sem escrita".
    files: ['docs/stories/900-58-lista-de-empresas-busca-filtros-acoes.story.md']

  - id: 'REL-001'
    severity: low
    finding: >-
      A coluna "Usuários" é o ÚNICO contador desta tela sem declaração. `porOrg` sai de
      platformQuery("users","org_id") e é renderizado cru — `paginaSaturada(usuarios)` nunca é
      calculado e `usuariosFalhou` não entra em `listaIncompleta`. Com `users` no teto de 1.000,
      aquela célula mostra um número exato que o sistema não sabe: exatamente o defeito que a
      AC10 existe para impedir, na mesma linha da tabela. Fora da LETRA da AC10 (que nomeia só
      org_integrations e o `users` da pendência) e longe do teto hoje (113 em produção).
    suggested_action: >-
      Não reabrir a 900-58. Registrar como dívida nomeada no epic 900 (ou puxar para a 900-61,
      que já mexe em diagnóstico de integração): usar `contarComTeto` também na coluna Usuários
      e somar `paginaSaturada(usuarios)` ao `listaIncompleta`.
    files: ['packages/web/src/app/platform/orgs/page.tsx']

  - id: 'TEST-001'
    severity: low
    finding: >-
      O "fail-closed" de platform-query-scan.test.ts NÃO é portador do veredicto. Contrafactual
      medido: com a âncora quebrada E a guarda nova removida, o teste AINDA falha —
      "expected '\n' to match /\.eq\(\"role\", \"admin\"\)/". As duas asserções pós-slice são
      `toMatch` POSITIVOS, então slice(-1) jamais aprovaria. A guarda melhora a MENSAGEM, não o
      veredicto; a justificativa escrita ("poderia virar aprovação por acidente") é falsa para
      este teste. (A forma perigosa do -1 — comparação de ordem — existe na régua da base,
      console-fail-closed.test.ts:486, mas lá está protegida por dois
      `ocorrenciasNoCodigo(...) === 1` logo acima. Não há furo vivo.)
    suggested_action: >-
      Manter a guarda (é boa higiene) e corrigir a redação para "melhora o diagnóstico quando a
      âncora some; o veredicto já era fail-closed porque as duas asserções são positivas".
    files: ['docs/stories/900-58-lista-de-empresas-busca-filtros-acoes.story.md']

