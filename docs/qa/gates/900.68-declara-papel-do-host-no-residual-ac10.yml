corpo_do_pr: |
  ## O que este PR faz
  Declara `lib/tenancy/papel-do-host.ts` no mapa `RESIDUAL_DECLARADO` da régua AC10
  (`packages/web/src/lib/tenancy/app-url-fallback.test.ts`) e devolve o check bloqueante
  `type-check · lint · test` ao verde em `main`.

  **Um único arquivo de teste. Zero arquivo de produção. Zero migration.**

  ## Por que `main` está vermelha
  O #565 (Story 900-66) criou a régua AC10: um mapa `arquivo → nº de ocorrências do host nu
  `crm.trifold.eng.br` em CÓDIGO`, comparado com `.toEqual` contra a varredura de
  `packages/web/src`. O #569 (Story 900-65) mergeou depois e trouxe `papel-do-host.ts`, que contém
  o literal 1× em código (4× no arquivo cru; 3 em JSDoc, descartadas por `linhasDeCodigo()`).

  **A régua funcionou exatamente como projetada** — ela existe para pegar todo arquivo novo que
  passe a conter o host. Faltava declarar a entrada. A régua não foi enfraquecida em nada.

  ## O que NÃO mudou (e foi verificado item por item)
  `.toEqual` sobre o mapa inteiro (nunca `.has`) · a contagem ao lado de cada nome ·
  `toBeGreaterThan(100)` · `{arquivosComChamada: 24, chamadas: 30}` da régua irmã · os 6 `it`s do
  detector · `fonte-scan.ts` · `papel-do-host.ts`.

  ## Por que declarar, e não rotear pelo `tentarAppUrl`
  Ali o literal está dentro de `HOSTS_DE_TENANT`, uma **denylist de segurança** avaliada em
  import-time e consumida por `hostsAdminDeclarados()` a cada requisição. `resolveAppUrlFallback`
  lê env e **lança** — semântica oposta. Rotear a denylist pelo resolver colocaria leitura de env e
  um caminho que lança dentro de uma guarda de segurança. Decisão fechada pelo @po e verificada no
  código pelo gate.

  ## Evidência (QA, rodada 1 — PASS)
  - **Contraprova:** a versão de `origin/main` do teste, contra esta árvore, sai **exit 1** com a
    assertion descrita. `main` está de fato vermelha.
  - **Contagem remedida pelo scanner real** (não por `grep`, não pelo relato): **1**.
  - **4 mutações de controle, todas exit 1**, todas restauradas com `shasum -c` + `git status`
    vazio: remover a entrada (2 `it`s vermelhos) · contagem `1`→`2` · host nu em arquivo de
    produção não declarado · **segunda ocorrência em arquivo já declarado** (`- 1 / + 2`) — esta
    última prova que o perdão continua sendo do *literal declarado*, não do *arquivo*.
  - **Gates com cache do turbo forçado (`Cached: 0 cached`):** `type-check` **0** · `lint` **0**
    (0 errors, 30 warnings pré-existentes, nenhum no arquivo alterado) · `test` **0**
    (324 arquivos, 4599 passed + 6 expected fail).
  - **AC4 provado:** `git diff --exit-code` = 0 em `papel-do-host.ts`, `fonte-scan.ts` e
    `app-url-fallback.ts`.

  Gate: PASS → `docs/qa/gates/900.68-declara-papel-do-host-no-residual-ac10.yml`
  Story: `docs/stories/900-68-declara-papel-do-host-no-residual-ac10.story.md`
