decisao_de_desenho:
  pergunta: "declarar o residual ou rotear `papel-do-host.ts` pelo `tentarAppUrl`?"
  veredito: "declarar — e a razão está verificada no código, não só na prosa da story"
  prova: >-
    `HOSTS_DE_TENANT` (papel-do-host.ts:77) tem um único consumidor:
    `hostsAdminDeclarados()` (linha 134, `HOSTS_DE_TENANT.includes(host)` na 140), que alimenta
    `decidirNoHostAdmin` (linha 162) a cada requisição. Do outro lado,
    `resolveAppUrlFallback` (app-url-fallback.ts:96) LÊ env (`falhaFechadaLigada()`) e **lança**
    `AppUrlIndisponivelError`. Rotear a denylist pelo resolver colocaria leitura de env e um caminho
    que lança dentro de uma guarda de segurança avaliada por requisição, hoje estática e resolvida em
    import-time. A decisão do @po está certa e não foi reaberta.

auto_decision_avaliada:
  o_que: >-
    Além do JSDoc do mapa (que o AC1.1 nomeia), o @dev corrigiu "Dois dos **seis** declarados" →
    "sete" no cabeçalho do arquivo, linha 28.
  veredito: "CERTA — aprovada"
  por_que: >-
    A linha 28 é uma contagem DA LISTA DECLARADA, exatamente a mesma classe de mentira aritmética que
    o AC1.1 existe para matar, no mesmo arquivo, e ela ficou falsa no instante em que a sétima entrada
    entrou. Pior: a linha 28 é justamente o parágrafo que EXPLICA por que a contagem ao lado de cada
    nome existe (cegueira nº 3) — deixá-la contando errado anularia metade do valor do AC1.1, cuja
    própria justificativa ("um cabeçalho que conta errado é o primeiro passo para alguém 'arrumar' o
    mapa apagando uma entrada") se aplica verbatim a ela. Verifiquei que a frase corrigida continua
    VERDADEIRA: dois dos sete declarados (`lib/notificacoes.ts` e `billing-reminders`) seguem sendo os
    que hospedam sítios migrados. Custo: uma palavra em comentário, zero asserção, zero dado — não
    colide com o AC3, que proíbe enfraquecer régua, não corrigir prosa.

linha_14_avaliada:
  o_que: >-
    O cabeçalho diz, na linha 14, que `.has` "fica verde com **sete** arquivos a mais que ninguém
    migrou". O @dev não mexeu, e registrou a colisão visual com o sete real do mapa.
  veredito: "DEIXAR COMO ESTÁ — o @dev acertou em não mexer"
  por_que: >-
    Aquele "sete" não é contagem do mapa: é o número retórico do argumento das linhas 6-7 do mesmo
    cabeçalho ("alcançar 21 dos 28 sítios e esquecer 7"). Ele é rastreável e não ficou falso com esta
    story. Mais importante para o julgamento: o risco que o AC1.1 protege é alguém APAGAR uma entrada
    porque o cabeçalho discorda do mapa — e a linha 14 não afirma nada sobre quantas entradas o mapa
    tem, então não pode induzir esse erro. É prosa herdada da 900-66, não introduzida aqui.
  follow_up_opcional: >-
    Numa story futura de prosa (não neste P0), remover o numeral: "fica verde com arquivos a mais que
    ninguém migrou". O número não acrescenta nada ao argumento e a colisão visual desaparece. Não
    vale inflar o diff de um P0 nem gastar outra rodada de 4 minutos de gate por isso.

