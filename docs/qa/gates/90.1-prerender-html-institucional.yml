reverificacao_qa1:
  escopo: "Só o QA-1 e os 2 nits. AC0/AC1/AC2/AC3/AC4/AC5/AC6a/AC6b/AC7/AC8 NÃO foram reabertos — validados na 1ª rodada."

  o_que_mudou_no_disco: >
    Alterados: deploy.sh, scripts/build-dist.mjs, scripts/check-dist.mjs, scripts/verify-prerender.mjs e a story.
    `prerender.mjs` NÃO foi tocado (mtime 08:47, anterior à correção) — a lógica de serialização/sanitização
    que sustenta a AC7 está intacta, então nada do que eu já havia validado precisou ser reaberto.
    `git diff` dos 5 `.dc.html`-fonte + `support.js` + `vercel.json`: continua contendo SÓ a reescrita de href
    da Story 90-6. Sem escopo novo.

  fix_correto_no_mecanismo: >
    `copyProjectLink()` copia `.vercel/project.json` + `README.txt` para o `dist/` no fim do `assemble()`,
    deixando `cache/` de fora. O passo 4 do `deploy.sh` NÃO mudou (`cd dist && vercel deploy --prod --yes
    --scope ...`) — correto, porque agora o `dist/` carrega o vínculo. A causa-raiz que eu apontei (o
    `fsp.rm(outRoot)` do assemble apagar um `vercel link` manual) é fechada por construção: o vínculo é
    RE-copiado a cada build, não depende de ninguém lembrar.

  prova_de_sobrevivencia_ao_rebuild: >
    `./deploy.sh --dry-run` completo (rm -rf dist + assembly + prerender + gate) => EXIT 0.
    Passo 1 agora imprime "✓ vínculo do projeto Vercel presente (trifold-design-system)".
    Assembly passou de 17 para 18 entradas: `.vercel/{project.json,README.txt}`.
    Depois do rebuild: `dist/.vercel/project.json` presente, `cmp -s` IDÊNTICO ao da pasta-fonte
    (projectId prj_1SRBOXwTclTFwGDz3zjIO6uM0pMG / trifold-design-system) — vínculo certo, não só "algum"
    vínculo; `dist/.vercel/cache` inexistente.

  prova_independente_pela_CLI: >
    De dentro do `dist/` RECONSTRUÍDO (não do que o @dev deixou):
      `vercel env ls` => "Environment Variables found for trifold-s-projects/trifold-design-system"
      `vercel ls`     => "Deployments for trifold-s-projects/trifold-design-system", listando o deployment
                         de produção real (● Ready / Production). Prova mais forte que `env ls`: a CLI não só
                         resolve um projeto, resolve O projeto que serve o site.
    Contraste com a 1ª rodada, mesmo comando e mesma CLI 54.6.1: "Error: Your codebase isn't linked".

  claim_do_dev_sobre_cwd_conferida: >
    O @dev alega ter descartado `--cwd` porque a flag move a resolução do vínculo junto. Confirmado sem
    desfazer nada: `vercel env ls --cwd assets` (pasta sem vínculo, invocada de dentro da pasta-fonte que TEM
    vínculo) => "isn't linked to a project". Logo `--cwd dist` sozinho não teria resolvido o QA-1 — a rota
    descartada foi descartada pelo motivo certo.

  falha_dura_sem_vinculo: >
    Testei o caminho negativo movendo `.vercel/project.json` para fora (com backup) e restaurando depois:
      `./deploy.sh --dry-run` => aborta no PASSO 1, antes de gastar o build, com o comando pronto:
