    com "VIOLAÇÃO DA AC7". O risco descrito na AC7 é real e o teste que o cobre não é vacuoso.

  AC7_ancoras_decisao_do_dev: >
    Desvio do @dev (manter `<a href>` no bloco) AVALIADO E RATIFICADO — não volta para o @dev. Base factual:
    (1) o bloco não tem NENHUM elemento que colete entrada — sem dado digitado, não há o que uma âncora carregue;
