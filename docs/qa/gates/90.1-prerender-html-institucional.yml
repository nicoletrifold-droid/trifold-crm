  - id: QA-8
    severity: info
    blocking: false
    category: testability
    owner: "@dev (cosmético)"
    description: >
      A mensagem do guarda novo em `check-dist.mjs` afirma "NÃO tem as sentinelas" mesmo quando o caso real é
      "sentinelas presentes, `<script>` observador ausente" (o meu mutante original). O VEREDITO está certo —
      reprova nos dois casos, medido — mas o diagnóstico induz a procurar a sentinela errada na hora de depurar.
    remediation: "Distinguir as duas causas na mensagem: sentinelas ausentes vs bloco presente sem observador."

  - id: QA-9
    severity: low
    blocking: false
    category: documentation
    owner: "@dev ou @devops antes do commit"
    description: >
      A linha `| 2026-09-02 | 1.1 | ... |` do Change Log foi acrescentada no FIM do arquivo da story, depois da
      seção `## QA Results` — o que parte a tabela do Change Log em duas e deixa a linha 1.1 órfã, fora da
      tabela, renderizando quebrado.
    remediation: "Mover a linha 1.1 para junto das outras, logo abaixo da linha 1.0 (a seção QA Results é a última do documento)."

  - id: QA-10
    severity: info
    blocking: false
    category: efficiency
    description: >
      `copyProjectLink()` roda no FIM do `assemble()`, então uma invocação direta de
      `node scripts/build-dist.mjs` sem vínculo copia os ~77 MB antes de falhar. O `deploy.sh` já barra no
      passo 1, então isso só afeta quem chama o script direto. Sem impacto em produção.

