issues:
  - id: QA-1
    status: RESOLVIDO (re-verificado pelo @qa em 2026-09-02 — ver reverificacao_qa1)
    severity: high
    blocking: false
    category: deployment
    owner: "@dev"
    description: >
      O passo 4 do `deploy.sh` (`cd dist && vercel deploy --prod --yes --scope trifold-s-projects`) NÃO publica
      no projeto certo: `dist/` não tem `.vercel/project.json` (a allowlist do `build-dist.mjs` não copia
      `.vercel`, e `assemble()` faz `fsp.rm(outRoot)` no início de cada build, então um `vercel link` manual
      dentro de dist/ é apagado no build seguinte).
    evidencia: >
      Provado sem deployar nada: `vercel env ls` dentro de `landing-pages/trifold-design-system/` resolve
      "Environment Variables found for trifold-s-projects/trifold-design-system"; o MESMO comando dentro de
      `dist/` devolve "Error: Your codebase isn't linked to a project on Vercel. Run `vercel link ...`".
      CLI 54.6.1. Portanto o passo 4 ou aborta, ou (com `--yes`, que "skip all prompts" usando os defaults do
      setup) cria um projeto NOVO com o nome da pasta (`dist`) e publica lá — em nenhum dos dois casos o
      trifold.eng.br é atualizado.
    impacto: >
      Não corrompe produção (produção fica byte-idêntica ao que já serve, medido) e o passo 5 grita
      corretamente, mas o único caminho de deploy que a story criou não funciona — e o README agora PROÍBE o
      caminho antigo ("Não rode `vercel deploy` da pasta-fonte"). É exatamente o passo que `--dry-run` não
      exercita, e é por isso que "testado fim a fim em dry-run" não pegou.
    remediation: >
      Passar a vinculação explicitamente. Qualquer uma resolve, é 1 linha:
      (a) `vercel deploy --prod --yes --scope "$SCOPE" --project trifold-design-system` (a CLI 54 aceita
          `--project <NAME_OR_ID>`);
      (b) exportar `VERCEL_ORG_ID`/`VERCEL_PROJECT_ID` lidos de `../.vercel/project.json` antes do comando;
      (c) copiar `.vercel/project.json` para dentro do `dist/` no `assemble()` — o upload já o exclui pela
          linha `.vercel` do `.vercelignore`.
      Recomendo (b) ou (c): tiram o nome do projeto de dentro do script e não podem divergir do link real.
      Depois da correção, quem valida de fato é o @devops rodando `./deploy.sh` — o passo 5 (`check-live.mjs`)
      já cobre a verificação e hoje reprova corretamente.

  - id: QA-2
    status: RESOLVIDO (re-verificado — o mutante original do @qa, com sentinelas intactas, agora reprova)
    severity: low
    blocking: false
    category: testability
    owner: "@dev (oportunístico)"
    description: >
      O gate pré-deploy classifica "página em fallback do AC5" pela AUSÊNCIA do `<script>` observador
      (`extractPrerenderBlock` devolve `null` quando não acha `<script>` depois do `<div id="dc-prerender">`).
      Sondado (MUT5): removendo o observador E o `<style>` do head JUNTOS, uma página com `#dc-prerender` vivo
      e sem ninguém para removê-lo PASSA no gate — duplicação permanente publicável.
    impacto: >
      Teórico hoje: o build não produz esse estado (`injectPrerender` emite os dois sempre, ou nada).
      É defesa em profundidade, não bug ativo.
    remediation: >
      Decidir "fallback" pela ausência de `id="dc-prerender"`/sentinelas, e tratar "bloco presente sem
      observador" como problema duro em vez de cair no ramo de fallback.

  - id: QA-3
    status: RESOLVIDO (Dev Agent Record reescrito: explicita que os 64 testes são de yarden/vind e que turbo só cobre packages/web)
    severity: low
    blocking: false
    category: documentation
    owner: "@dev"
    description: >
      As Completion Notes citam "`npx vitest run landing-pages`: 64/64" e "`pnpm lint` / `pnpm type-check`
      verdes" na lista de evidências. Verifiquei: os 64 testes são pré-existentes de OUTRAS landings
      (`landing-pages/yarden/tracking-browser.test.ts`, `landing-pages/yarden/api-proxy.test.ts`,
      `landing-pages/vind-residence/api-proxy.test.ts`) e não tocam nada desta story; e `turbo lint`/
      `type-check` só cobrem `packages/web` (único eslint config do repo é `packages/web/eslint.config.mjs`).
      Esta story adicionou zero teste unitário.
    impacto: "Nenhum no produto. Risco de leitura: os números parecem cobertura desta story e não são."
    remediation: >
      Reescrever como "não aplicável a esta story" — o @dev já diz isso duas linhas depois, honestamente
      ("o turbo não cobre landing-pages/*; o gate aplicável é `node --check` + `bash -n`"). A evidência real
      desta story é o harness de 80 checagens, que eu re-executei e mutei.

  - id: QA-4
    severity: low
    blocking: false
    category: requirements
    owner: "@sm / Story 90-2"
    description: >
      Consequência de SEO nova e não registrada: o bloco do Blog expõe 27 links estáticos para
      `Artigo.dc.html?slug=…` a crawlers sem JS. Antes eles viviam dentro de `<sc-for>` e eram invisíveis.
      Essas URLs respondem 200 (não há redirect para `Artigo.dc.html` no `vercel.json`), então nada quebra —
      mas a limitação de roteamento do `Artigo.dc.html` está registrada como Tier 4 pela própria story.
    remediation: "A Story 90-2 (sitemap/robots) precisa decidir explicitamente: incluir no sitemap ou `Disallow`. Não decidir é deixar o Google escolher."

  - id: QA-5
    severity: info
    blocking: false
    category: observation
    description: >
      O screenshot full-page de `/` em viewport mobile tem 470px de largura para uma viewport de 390px —
      overflow horizontal pré-existente na Home mobile, idêntico antes e depois (0% de diff). Não é regressão
      desta story; registrado porque aparece em qualquer medição futura sensível a viewport.

  - id: QA-6
    severity: info
    blocking: false
    category: observation
    description: >
      Em `/sobre-nos` a sanitização da AC7 remove também 1 `<iframe>` (mapa) do bloco. É consequência esperada
      de `REMOVED_TAGS` e tem efeito colateral bom (não carrega iframe de terceiro na janela pré-mount).
      Sem regressão pós-mount (0% de diff de pixel).

  - id: QA-7
    severity: low
    blocking: false
    category: requirements
    owner: "@sm"
    description: >
      A AC7 diz "qualquer elemento interativo" mas justifica e testa apenas o submit nativo de formulário —
      e a AC1 exige "CTAs" dentro do bloco, que neste site são âncoras. A contradição foi resolvida pelo @dev
      no sentido certo (ver qa_own_evidence.AC7_ancoras_decisao_do_dev), mas a redação deveria ser corrigida
