qa_own_evidence:
  ambiente: "servidor estático local (scripts/dc-site.mjs) + Chromium do @playwright/test 1.60.0; dist/ remontado por mim via ./deploy.sh --dry-run"

  AC0_fonte_intocada: >
    grep 'dc-prerender' nos 5 .dc.html-fonte => 0 em todos.
    `git diff -M -U0` dos arquivos modificados (B2B/Blog/Empreendimentos/sobre-nos/Artigo) contém
    EXCLUSIVAMENTE reescrita de href da Story 90-6 (Home.dc.html não aparece no diff: intocado).
    `git check-ignore -v` confirma dist/ (.gitignore:54) e .seo-metrics/ (.gitignore:58) ignorados.
    support.js: 0 linhas de diff e `cmp -s support.js dist/support.js` idêntico (AC3).

  AC1_mecanismo: >
    5/5 páginas: 1 sentinela start + 1 end + 1 `id="dc-prerender"`; bloco ANTES do `<x-dc>` (medido por índice);
    `<x-dc>` byte a byte igual ao fonte (cobrado pelo próprio gate via extractXdc, e mutado por mim — ver contraprovas);
    0 `{{`, 0 `<sc-*`, 0 `<dc-import>`, 0 `<x-dc` e 0 `id="dc-root"` dentro do bloco;
    `<style id="dc-prerender-hide-template">` presente e pareado; observer em `document.body` + checagem síncrona de corrida.
    GET HTTP simples (método da auditoria) devolve texto real em 5/5: 2112 / 2011 / 956 / 5951 / 2794 chars.

  AC1_reentrancia_do_runtime: >
    Achado meu, não relatado: li `boot()` (support.js:158) e `updateHtml()` (support.js:1463) para descartar o
    risco de o bloco VOLTAR depois do mount. `updateHtml` só recompila o template no registry (`r.tpl`) e faz
    `registry.bump` — NÃO reescreve o documento. Com o bloco antes do `<x-dc>` e as guardas de `injectPrerender`
    (aborta se o snapshot contiver `<x-dc`, `</x-dc>`, `id="dc-root"` ou `#dc-prerender` aninhado), o
    `fetch(location.href)` → `parseDcText` readota exatamente o template do `<x-dc>`. Sem reentrância.

  AC2_diff_de_pixel: >
    Comparador AUDITADO e MUTADO, não aceito de palavra: `compare-metrics.mjs` decodifica as PNGs em
    OffscreenCanvas e compara por canal (tolerância 12). Contraprova: troquei o `home.mobile.png` do "depois"
    pelo screenshot do Blog => 76.634% de diferença reportada. Nos pares verdadeiros: 0% em 10/10, dimensões
    idênticas, err/warn/4xx inalterados em todas as combinações. O 0% não é vacuidade do comparador.

  AC4_falha_de_mount: "5/5 páginas com `assets/vendor/react*.js` abortado na rede: #dc-prerender permanece presente, visível, 948–5898 chars; #dc-root nunca criado."

  AC5_fallback: >
    Reproduzido por mim com `DC_PRERENDER_FAIL_IDS=home,blog`: build segue, loga alto, 3/5 pré-renderizadas.
    `cmp -s` confirma Home.dc.html e Blog.dc.html em dist IDÊNTICOS ao fonte (fallback é "não sobrescrever",
    não um passo de restauração que pode falhar). Gate pré-deploy APROVA o dist com 2 páginas em fallback.
    check-live.mjs cruza com .seo-metrics/build-report.json e distingue fallback esperado (⚠, aceito) de
    fallback inesperado (✖) — buraco real que o @dev fechou e que eu confirmei nos dois sentidos.

  AC6a_sem_duplicacao: >
    5/5: captura 1 (support.js atrasado 1,5s) = #dc-prerender com conteúdo e #dc-root AUSENTE do DOM;
    captura 2 = #dc-root com conteúdo e #dc-prerender REMOVIDO do DOM (não escondido).
    Janela de coexistência 0.1–0.4ms, sempre nessa ordem.

  AC6b_CLS_remedido_por_mim: >
    NÃO aceitei a tabela do @dev: reconstruí a variante "bloco DEPOIS de </x-dc>" a partir do próprio dist
    (recorte por sentinela + reinserção após o último `</x-dc>`) e medi as duas com PerformanceObserver
    ({type:'layout-shift'}, hadRecentInput=false), 5 páginas × 2 viewports × pior de 2 execuções:
      bloco ANTES (entregue):  soma 0.2944 | pior 0.0583 (/sobre-nos mobile) | nenhuma combinação > 0.061
      bloco DEPOIS (variante): soma 2.9137 | pior 1.0435 (/empreendimentos mobile); 3 páginas ≈ 1.0
      razão 9.90x (o @dev reportou 12.3x com 3 execuções)
    A justificativa do @dev para inverter a posição é CORRETA e MENSURÁVEL, não racionalização. Meus números
    de "antes" reproduzem os dele (pior 0.0583 nos dois).

  AC7_PII_contraprova: >
    Estático (5/5 páginas): 0 `<form>`, `<button>`, `<input>`, `<textarea>`, `<select>`, `<iframe>`, `<object>`,
    `<embed>`, `<dialog>`, `<script>` dentro do `<div id="dc-prerender">`; 0 atributo `on*`; 0 `tabindex`;
    0 `contenteditable`. (O único `<script>` na região das sentinelas é o observador, IRMÃO do div, fora dele.)
    Ao vivo (Home e Blog, vendor do React abortado => janela de risco aberta indefinidamente): 0 controles no
    bloco; `requestSubmit()` forçado em todo `<form>` do documento não navega; digitar + Enter sem foco não
    gera query string nem requisição com `nome=|email=|telefone=|mensagem=`; 60x Tab só passam por A e BODY.
    CONTRAPROVA (a parte que importa): injetei um `<form><input name=nome><textarea name=mensagem><button>`
    dentro do #dc-prerender da Home e reexecutei. O vazamento MATERIALIZOU — a URL virou `/?nome=&mensagem=`,
