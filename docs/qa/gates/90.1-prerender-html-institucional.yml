  sintaxe_e_gates_aplicaveis: "node --check ok nos 8 .mjs; bash -n ok no deploy.sh; ./deploy.sh --dry-run passa os passos 1-3 e para antes de publicar."

  deriva_producao_vs_working_tree: >
