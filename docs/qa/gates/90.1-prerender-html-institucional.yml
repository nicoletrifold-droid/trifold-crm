    (3) query strings: 1 `wa.me/5544991089698?text=<mensagem de marketing hardcoded>` por página (sem PII) +
        27 `Artigo.dc.html?slug=fN|pN` no Blog (slugs estáticos). Nenhuma carrega ou coleta dado do usuário.
    (4) 1 `target="_blank"` por página, todos com `rel="noopener"` — sem reverse tabnabbing.
    (5) DECISIVO: a AC1 exige explicitamente "CTAs" dentro do #dc-prerender, e nesse site os CTAs SÃO âncoras
        (`<a href="/#contato">Solicitar orçamento</a>`); os `<button>` removidos eram controles de carrossel/menu.
        A leitura literal de "qualquer elemento interativo" colocaria a AC7 em contradição direta com a AC1.
    Conclusão: a interpretação do @dev é a única que satisfaz AC1 e AC7 ao mesmo tempo, e ele a transformou em
    invariante testada ("âncoras preservadas no bloco"), não em omissão. Ver QA-7 (redação a herdar).

  AC8_contagem_de_headings: >
    Reproduzido: h1(documento) == h1(<x-dc>) + h1(#dc-prerender) e h1(#dc-prerender) == h1(<x-dc>) em 5/5.
    Tabela (critério para 90-3a/90-3b): / = 0/0/0 | /sobre-nos = 0/0/0 | /empreendimentos = 2/1/1 |
    /corporativas = 2/1/1 | /blog = 2/1/1. Nota: em / e /sobre-nos a asserção é vacuosa hoje (não há h1) —
    a 90-3b é que vai criar o primeiro, e a partir daí a contagem TEM de ser `#dc-prerender h1`.

  harness_reexecutado: "80/80 checagens de scripts/verify-prerender.mjs passando na minha execução (não no relato do @dev)."

  contraprovas_por_mutacao: >
    5 mutações aplicadas sobre uma cópia do dist, para provar que o gate pré-deploy não é decorativo:
