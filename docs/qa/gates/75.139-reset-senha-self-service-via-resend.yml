smoke_production:
  status: PASS
  date: 2026-07-07
  summary: "Teste end-to-end real em crm.trifold.eng.br com o admin ghr_el@hotmail.com. Fluxo completo de reset self-service validado: e-mail Resend delivered → link auth/callback → /reset-senha → nova senha → login. Anti-enumeração + throttle confirmados no banco. SMTP custom 75-122 intacto."

production_fixes:
  note: "6 defeitos de produção descobertos DURANTE o smoke e já corrigidos+deployados. Nenhum é defeito de código do escopo original revisado no gate CONCERNS; são gaps de config/ambiente serverless e branding expostos apenas em execução real de produção."
  fixes:
    - id: "PRODFIX-1"
      pr: "#143"
      finding: "Link caía em localhost — Server Action com origin vazio."
      resolution: "baseUrl = NEXT_PUBLIC_SITE_URL ?? origin ?? NEXT_PUBLIC_APP_URL ?? 'https://crm.trifold.eng.br'."
    - id: "PRODFIX-2"
      pr: "#143"
      finding: "E-mail em roxo #4f46e5 (fora da identidade da marca)."
      resolution: "Coral da marca #F27A5E no design-system de e-mail."
    - id: "PRODFIX-3"
      pr: "#145"
      finding: "void sendEmail (fire-and-forget) não confiável em serverless — e-mail não chegava ao Resend."
      resolution: "Uso de after() do next/server para garantir o envio após a resposta."
    - id: "PRODFIX-4"
      pr: "#146"
      finding: "Link usava action_link (fluxo verify+fragment, incompatível)."
      resolution: "Link montado via hashed_token para /auth/callback nos 5 call-sites."
    - id: "PRODFIX-5"
      pr: "#147"
      finding: "Página /reset-senha sem identidade visual."
      resolution: "Alinhada ao login (dark, logo, coral)."
    - id: "PRODFIX-6"
      pr: "config (Supabase Management API + Vercel redeploy)"
      finding: "Supabase Auth site_url = localhost; NEXT_PUBLIC_SITE_URL do Vercel = vercel.app."
      resolution: "site_url → crm.trifold.eng.br + allowlist via Management API; NEXT_PUBLIC_SITE_URL → crm.trifold.eng.br + redeploy."

residuals_accepted:
