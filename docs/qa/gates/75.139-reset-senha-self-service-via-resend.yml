acceptance_criteria_trace:
  AC1: "PASS — generateLink(type recovery) + renderPasswordActionEmail(mode reset) + sendEmail via Resend em login/actions.ts. Smoke prod 2026-07-07: e-mail Resend delivered → link /auth/callback?token_hash=...&type=recovery&next=/reset-senha → tela 'Nova senha' → troca efetiva + login OK. Link agora montado via hashed_token (PRODFIX-4) e baseUrl robusto (PRODFIX-1)."
  AC2: "PASS — redirectTo corrigido de /portal/reset-password (inexistente) para /reset-senha (página confirmada). generateLink+sendEmail(mode reset). Erros 404/422 preservados. logAudit cliente.senha.reset_email_sent intacto. Fluxo de link validado no smoke prod (mesma cadeia auth/callback → /reset-senha)."
  AC3: "PASS — genericSuccess ({sent:true,email:rawEmail}) retornado em TODOS os branches: throttled (L118), e-mail inexistente (L137), falha createUser (L150), falha generateLink (L163) e sucesso (L197). Nenhuma mensagem/status revela existência. Único early-return distinto é validação de input vazio (L108, 'Email é obrigatório') — não revela conta. generateLink só é chamado após confirmar users existente (L130-138)."
  AC4: "PASS — WINDOW=15min, MAX=3; isPasswordResetThrottled e recordPasswordResetAttempt recebem o MESMO identifier normalizado (email lowercase+trim) → consistente. Protege inbox real (3 e-mails/15min). Migration 162 aplicada em prod; registros de throttle confirmados no banco durante o smoke 2026-07-07. Desvio literal do AC4.3 (insert só no caminho existente) permanece imaterial (nenhum e-mail é enviado nos demais casos) — ver REQ-001."
  AC5: "PASS — generateLink usa exclusivamente createAdminClient() (service-role). Arquivo é Server Action ('use server'); helper de throttle tem import 'server-only'. Grep confirma que nenhum Client Component importa createAdminClient. admin.ts usa SUPABASE_SERVICE_ROLE_KEY (var privada, não NEXT_PUBLIC → não é inlined no bundle do browser)."
  AC6: "PASS — renderPasswordActionEmail({userName,actionLink,siteUrl,mode}) criado em lib/email-layout/components/password-action.ts, exportado em index.ts. Os 2 novos call-sites (login + cliente portal) e os 3 legados (users/reset-password + brokers x2) usam o template — zero HTML inline nos arquivos desta story."
  AC7: "PASS — nenhuma alteração em config SMTP; decisão de manter como fallback documentada em Dev Notes + Change Log. Confirmado no smoke prod 2026-07-07 que o SMTP custom da 75-122 permanece intacto (não removido)."

security_review:
  anti_enumeration: "SÓLIDA. Resposta genérica idêntica em todos os caminhos; generateLink nunca é chamado para e-mail sem users correspondente (fecha o vetor de mensagem nativa divergente do Supabase)."
  timing_side_channel: "RESÍDUO CONHECIDO E ACEITO. sendEmail e logAudit são fire-and-forget (void, sem await) → resposta retorna sem aguardar Resend. generateLink permanece await (precisa do link) e recordPasswordResetAttempt é await no caminho existente → assimetria de latência residual entre e-mail existente/inexistente permanece, mensurável em teoria. Aceitável no threat model do CRM (base limitada). Mitigação opcional adicional: tornar recordPasswordResetAttempt fire-and-forget também."
  unhandled_rejection: "OK. sendEmail() captura todos os erros internamente (try/catch + checagem de resend nulo) e sempre resolve para {id,error?} — nunca rejeita. Portanto `void sendEmail(...)` NÃO gera unhandled promise rejection."
  service_role_exposure: "OK. Chave service-role só em arquivos server-side; não vaza para bundle do browser."
  injection: "OK. Todas as queries via supabase-js parametrizado (.eq/.ilike/.insert); sem SQL cru."
  throttle_ip: "AUSENTE por decisão (defesa-em-profundidade). Coluna `identifier` genérica é forward-compatible p/ IP sem nova migration. Não-bloqueante, registrado como enhancement futuro."

migration_review:
  file: "supabase/migrations/162_password_reset_throttle.sql"
  numbering: "PASS — renumerada 161 → 162 (Change Log 1.5) por colisão com a branch de distrato que reservou 161; origin/main até 160, 131 ocupada por 131_imobiliarias.sql. 162 confirmado livre."
  idempotency: "PASS — CREATE TABLE IF NOT EXISTS + CREATE INDEX IF NOT EXISTS. Aplicada em PRODUÇÃO (2026-07-07); registros de throttle confirmados no banco durante o smoke."
  rls: "PASS — ALTER TABLE ... ENABLE ROW LEVEL SECURITY, sem policies (intencional e documentado; mesmo padrão de imob_*). service_role bypassa RLS → admin client funciona; anon/authenticated não leem. Comportamento confirmado em prod (throttle registrado via admin client)."

copy_delta_review:
  verdict: "ACEITO (Task 6 é recomendada/não-bloqueante) — manter a unificação."
  users_reset_password: "'O administrador solicitou a redefinição...' → 'Você solicitou a redefinição...'. Levemente impreciso para reset disparado por admin (o usuário não solicitou), mas não é enganoso nem prejudicial; o template já inclui 'Se você não esperava este e-mail, pode ignorá-lo'. Subject/CTA/link idênticos. Opcional: adicionar um 3º mode/param se a equipe quiser preservar a autoria correta."
  brokers: "'cadastrado como corretor' → 'cadastrado'. Cosmético, sem impacto funcional. Subject/CTA/link idênticos."
  recommendation: "Não reverter. Se a precisão de 'O administrador solicitou' for desejada, tratar como enhancement de baixa prioridade (param opcional no template), sem afetar Tasks 1-5."

issues:
  - id: "SEC-001"
    severity: low
    category: security
    finding: "Timing side-channel residual: generateLink (await) + recordPasswordResetAttempt (await) executam apenas no caminho de e-mail existente, criando diferença de latência mensurável vs. e-mail inexistente."
    suggested_action: "Aceitar (documentado no threat model). Opcional: tornar recordPasswordResetAttempt fire-and-forget (void) para encurtar ainda mais a janela."
  - id: "REQ-001"
    severity: low
    category: requirements
    finding: "AC4.3 literal ('cada tentativa não bloqueada é registrada') diverge da implementação: o insert só ocorre após generateLink bem-sucedido (usuário existente). Tentativas p/ e-mail inexistente ou generateLink com falha não são registradas."
    suggested_action: "Aceitar — imaterial para o objetivo de proteção de inbox (nenhum e-mail é enviado nesses casos). Se defesa contra varredura for desejada no futuro, registrar mais cedo e/ou adicionar identifier por IP."
  - id: "SEC-002"
    severity: low
    category: security
    finding: "Throttle apenas por e-mail, sem throttle por IP (sem defesa-em-profundidade contra origem única varrendo muitos e-mails)."
    suggested_action: "Não-bloqueante. Coluna `identifier` genérica já é forward-compatible p/ IP. Registrar como enhancement futuro."
  - id: "DOC-001"
    severity: low
    category: docs
    finding: "Copy do reset admin-triggered mudou para 'Você solicitou' (Task 6) — semanticamente o admin dispara."
    suggested_action: "Aceitar; opcional adicionar param/mode para preservar autoria. Reversível sem afetar Tasks 1-5."

