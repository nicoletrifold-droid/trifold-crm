# ─────────────────────────────────────────────────────────────────────────────
# RESSALVAS (não bloqueiam o deploy — exigem follow-up)
# ─────────────────────────────────────────────────────────────────────────────
ressalvas:
  - id: C1
    severidade: MEDIA
    titulo: "Causa raiz na ESCRITA continua aberta — novos fantasmas seguem sendo gerados"
    detalhe: |
      Verificado: `/assign` (route.ts:46), `/handoff` (route.ts:72) e `/transferir` (route.ts:83)
      fazem `.update({ assigned_broker_id: ... })` SEM limpar `bolsao_em`. O fix na LEITURA é a
      escolha defensiva certa (protege independentemente do caminho), mas o carimbo sujo tem uma
      consequência que a leitura NÃO cobre:
        Lead cai no bolsão → gestor usa /assign em vez de o corretor puxar → bolsao_em fica sujo
        → corretor não atende → o cron bolsao-rebalance NÃO o resgata, porque a query de
        candidatos exige `.is("bolsao_em", null)` (route.ts:100). O lead perde a rede de
        segurança do bolsão. Cobertura parcial resta pelo sla-alerts (10min/60min).
      Pré-existente, fora do escopo declarado do commit, e não mencionado na mensagem de commit.
    acao: "Story de follow-up: limpar `bolsao_em: null` no UPDATE de /assign, /handoff e /transferir (é o único write path que ainda produz sujeira; roleta e RPC já têm guard)."

  - id: C2
    severidade: BAIXA
    titulo: "Dado sujo remanescente em produção não remediado"
    detalhe: "1 lead (299b4e7b…) segue com bolsao_em preenchido e dono. Inofensivo após o fix (não conta no digest nem aparece no painel) e já atendido, portanto também fora da query de candidatos. Fica só como resíduo."
    acao: "Opcional, junto de C1: `UPDATE leads SET bolsao_em = NULL WHERE is_active AND bolsao_em IS NOT NULL AND assigned_broker_id IS NOT NULL;` — via @devops/@data-engineer, nunca ad-hoc."

  - id: C3
    severidade: BAIXA
    titulo: "Imprecisão factual no comentário do código e na mensagem de commit"
    detalhe: |
      O comentário em route.ts:162-163 lista "roleta" entre os caminhos que sujam o carimbo.
      A roleta NÃO gera fantasma — há guard duplo:
        - distributor.ts:100 → `if (lead.bolsao_em) return { status: "em_bolsao" }`
        - RPC roleta_pick_and_advance → `UPDATE leads SET assigned_broker_id = v_user_id
          WHERE ... AND bolsao_em IS NULL`
      O comentário existe justamente para guiar quem for atacar a causa raiz (C1); manter
      "roleta" na lista faz um dev futuro caçar bug onde não há.
    acao: "Remover 'roleta' da lista no comentário (route.ts:163). Uma palavra."

  - id: C4
    severidade: BAIXA
    titulo: "Story file ausente — quebra a convenção do projeto"
    detalhe: "O commit referencia [Story 75-286], mas não existe `docs/stories/75-286-*.story.md`. Todas as vizinhas (75-270 a 75-285) têm arquivo."
    acao: "@sm criar `docs/stories/75-286-bolsao-digest-lead-fantasma.story.md` retroativamente, com AC e o registro do incidente de 05/08."

observacoes_menores:
  - "O mock filtra com `l.assigned_broker_id == null` (loose). Os 2 testes pré-existentes usam fixtures SEM a propriedade (undefined), e passam por causa disso. Trocar para `=== null` quebraria 2 testes verdes — deixar comentado ou normalizar as fixtures para `assigned_broker_id: null`."
  - "O mock só simula filtro na query do pool; a query de candidatos volta `leadsData` cru. Não é regressão (era assim antes), mas os filtros da query de candidatos não têm cobertura de teste."

