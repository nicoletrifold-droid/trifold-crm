# ─────────────────────────────────────────────────────────────────────────────
# 1. O TESTE REALMENTE FALHA SEM O FIX? (verificação independente — a mais importante)
# ─────────────────────────────────────────────────────────────────────────────
verificacao_do_teste:
  metodo: "route.ts revertido (removida SÓ a linha `.is(\"assigned_broker_id\", null)`), route.test.ts intacto, suíte executada; árvore restaurada e `git diff` confirmado vazio."
  resultado: FALHA_CONFIRMADA
  evidencia:
    - "digest ignora lead 'fantasma' → AssertionError: expected 1 to be +0 (digestCount)"
    - "digest conta lead do pool real → AssertionError: expected 2 to be 1 (digestCount)"
    - "Test Files 1 failed | Tests 2 failed | 6 passed (8)"
  conclusao: "O teste NÃO é decorativo. A correção do mock (`is: (col) => { isNullCols.push(col); ... }` + filtro real em `limit()`) foi o que deu poder de discriminação ao caso."
  nota_de_precisao: |
    A afirmação do @dev de que "com o mock antigo o teste passaria mesmo SEM o fix" está
    invertida: com `is: () => b`, `poolData` voltava sempre inteiro, então o teste do
    fantasma falharia COM e SEM o fix. O efeito material é o mesmo (mock inútil), e o que
    importa para o gate — o teste discrimina hoje — está empiricamente comprovado.

# ─────────────────────────────────────────────────────────────────────────────
# 2. REGRESSÃO NO RESTO DO CRON
# ─────────────────────────────────────────────────────────────────────────────
regressao_rebalanceamento:
  query_de_candidatos: "INTACTA (route.ts:92-103) — é uma query SEPARADA, com .is('bolsao_em', null) + .not('assigned_broker_id','is',null). O fix não a toca."
  toMove: "INTACTO (route.ts:128-137) — lógica de elapsed/BOLSAO_REBALANCE_MIN inalterada."
  update_rebalanceamento: "INTACTO (route.ts:139-154) — update + insert de activities inalterados."
  discriminacao_no_mock: "isPool = cols.includes('bolsao_em') && !cols.includes('assigned_broker_id') → a query de candidatos (select 'id, name, assigned_broker_id, distribuido_em') cai em leadsData; só a do pool é filtrada. `isNullCols` tem escopo por chamada de from(), sem vazamento entre queries."
  testes_de_guarda: "os 3 testes de rebalanceamento (move >=15, não move <15, gate enabled=false) seguem verdes."

# ─────────────────────────────────────────────────────────────────────────────
# 3. FALSO NEGATIVO (o digest deixaria de avisar sobre lead legítimo?)
# ─────────────────────────────────────────────────────────────────────────────
falso_negativo:
  coberto_por_teste: "sim — 'digest conta lead do pool real': 2 linhas no pool (1 sem dono, 1 fantasma) → digestCount 1, digestSent true, 1 fetch, push chamado."
  rpc_atomica: |
    Não há janela de corrida: `pegar_lead_bolsao` (migration 185, versão vigente) faz
    `SET assigned_broker_id = p_broker_user_id, bolsao_em = NULL` no MESMO UPDATE, com guard
    `WHERE bolsao_em IS NOT NULL AND assigned_broker_id IS NULL`. Não existe estado
    intermediário em que um lead legítimo do pool apareça com dono.
  conclusao: "O filtro é exatamente o do painel. Se some do digest, sumiu do painel também — consistência total entre os 5 leitores."

# ─────────────────────────────────────────────────────────────────────────────
# 4. OS OUTROS LEITORES DE bolsao_em
# ─────────────────────────────────────────────────────────────────────────────
leitores_bolsao_em:
  ja_corrigidos_na_75_89:
    - "dashboard/bolsao/page.tsx:38 → .is('assigned_broker_id', null) ✓"
    - "broker/bolsao/page.tsx:31 → .is('assigned_broker_id', null) ✓"
    - "dashboard/layout.tsx:219 → .is('assigned_broker_id', null) ✓"
    - "broker/layout.tsx:94 → .is('assigned_broker_id', null) ✓"
  sobrevivente: "api/cron/bolsao-rebalance/route.ts (digest) — corrigido aqui. Os 5 leitores estão agora consistentes."
  sla_alerts_confirmado: |
    CONFIRMADA a afirmação mais frágil do relatório do @dev. `sla-alerts/route.ts:165` usa
    `.or("assigned_broker_id.not.is.null,bolsao_em.not.is.null")`: o fantasma entra pelo ramo
    `assigned_broker_id.not.is.null` e é tratado como lead COM dono — que é o comportamento
    correto, pois ele de fato tem dono e o SLA do corretor deve valer. Camada extra de
    proteção: a mesma query tem `.is("primeiro_atendimento_em", null)`, então o lead do
    incidente (atendido) já estava fora dela. sla-alerts não é afetado nem foi tocado.
  outros_consumidores_nao_afetados:
    - "roleta-retry/route.ts:52 → .is('bolsao_em', null) — exclui o pool de propósito, sem relação com o digest."
    - "distributor.ts:100 → bail 'em_bolsao'; leads/bulk:62 e reativar:150/222 limpam o carimbo."

