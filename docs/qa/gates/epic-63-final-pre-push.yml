  rationale: >
    Estado merged + Story 63-15 passam em todos os checks. Não-regressão da Nicole
    confirmada por leitura do fluxo (lead novo responde como antes; merge não removeu
    lógica da main). Os 2 gatilhos de handoff (agendamento e broker_reply) e a
    reativação ancorada em resolveTakeoverAnchor estão corretos, idempotentes e
    por-conversa. CON-1 limpo. Suíte 526/526, type-check 0 (3 erros ambientais
    aceitos), ESLint 0. Riscos residuais (RISK-001 best-effort do handoff por
    agendamento, RISK-002 race, INFRA-001 publicação realtime) são LOW/MEDIUM,
