status_reason: >
  Gate final pré-push sobre o ESTADO MERGED com a main (merge 798681c) + commit
  5ae3b2f (Story 63-15, handoff por agendamento). Valida não-regressão da Nicole e
  os 2 gatilhos de handoff. RESULTADO: PASS. Não-regressão CONFIRMADA: lead novo
  nasce com is_ai_active=true (findOrCreateConversation route.ts:994) → guard
  `!isAiActive` pula o bloco de reativação → `if (isAiActive)` (L682) → Nicole
  responde; appointmentCreated permanece false para mensagens normais → SEM handoff.
  Pipeline, createCalendarEvent (73-1), 71-1 (sem distribuição na 1ª msg) e dedupe
  wamid 23505 (early-return) preservados pelo merge — diff main→merge SÓ adiciona o
  push 63-12 e o bloco de reativação 63-13/63-15, nenhuma lógica da main removida.
  Handoff por agendamento CONFIRMADO: appointmentCreated setado no onEvent em
  APPOINTMENT_CREATED (L728), e após o envio da resposta da Nicole o UPDATE
  is_ai_active=false/handoff_at/handoff_reason='appointment' com `.eq("is_ai_active",
  true)` (idempotente, por-conversa, L768-778); notifyBrokerOfAppointment preservado
  (L733, dispara ANTES do fetch → corretor avisado mesmo se o envio falhar). Handoff
  por msg do corretor CONFIRMADO: send-message/route.ts:281-297 seta
  is_ai_active=false/handoff_at/handoff_reason='broker_reply' via admin client sob
  guard `if(conversation.is_ai_active)`. Reativação 24h ANCORADA CONFIRMADA:
  resolveTakeoverAnchor(handoff_at, lastBrokerAt) + shouldReactivateAi(anchor)
  (L650-678), limpa handoff_at/handoff_reason ao reassumir. CON-1 inviolável LIMPO
  (git grep zero ocorrências nos arquivos do 63-15). Suíte completa 526/526 (40
  arquivos). type-check 0 erros nos arquivos do Epic 63 (3 erros ambientais
  pré-existentes em visual-editor.tsx/react-email-editor). ESLint exit 0 nos 4
  arquivos do 63-15. Sem migration (handoff_at/handoff_reason existem desde
  001_base_schema.sql:159-160). Pronto para @devops *push.
