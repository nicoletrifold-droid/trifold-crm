nfr_validation:
  performance:
    status: PASS
    notes: >
      Reativação faz 2 queries em Promise.all SÓ quando is_ai_active=false (caminho
      raro de conversa em handoff), ambas indexadas e limit(1)/maybeSingle. Handoff por
      agendamento é 1 UPDATE no after() (fora do caminho crítico do HTTP 200).
  security:
    status: PASS
    notes: >
      Webhook usa admin client server-side (sem sessão). Handoff por agendamento e
      reativação escopados por conversation.id (sem cross-conversation). send-message
      valida ownership antes do handoff (padrão do Epic 51/63).
  reliability:
    status: CONCERNS
    notes: >
      Handoff por agendamento roda no after() best-effort: se o fetch de envio (L748)
      lançar, o catch (L796) é alcançado ANTES do UPDATE de handoff → Nicole permanece
      ativa. Mitigado por: notifyBrokerOfAppointment já disparou no onEvent (antes do
      fetch) → corretor é avisado e, ao responder, o handoff por broker_reply assume
      como backstop. Risco residual aceitável e documentado (RISK-001).
  maintainability:
    status: PASS
    notes: >
      resolveTakeoverAnchor unifica os 2 gatilhos num único helper puro testado;
      reusa shouldReactivateAi/brokerSentRecently. handoff_reason dá rastreabilidade.

residual_risks:
  - id: RISK-001
    severity: medium
    finding: >
      Handoff por agendamento é best-effort no after(): se o envio da confirmação
      falhar, o UPDATE de is_ai_active=false não roda e a Nicole continua respondendo.
    mitigation: >
      notifyBrokerOfAppointment dispara no onEvent ANTES do fetch → corretor sempre
      avisado; a resposta dele aciona o handoff por broker_reply. Backstop estrutural.
    suggested_owner: dev
    blocking: false
  - id: RISK-002
    severity: low
    finding: >
      Race R1 (herdado 63-13): se o webhook leu is_ai_active=true antes do send-message
      desligar, a Nicole pode responder 1x a mais. A próxima msg do lead já verá false.
    mitigation: "Aceito — janela de race mínima, sem efeito de negócio relevante."
    suggested_owner: dev
    blocking: false
  - id: INFRA-001
    severity: medium
    finding: >
      Pré-existente da Fase 4 (63-11): `messages` precisa estar na publicação
      supabase_realtime (migration 102) para o chat em tempo real funcionar. Não é do
      63-15, mas é dependência de deploy do Epic 63 como um todo.
    mitigation: "Degrada graciosamente (reload). Habilitar antes/durante o deploy."
    suggested_owner: devops
    blocking: false

