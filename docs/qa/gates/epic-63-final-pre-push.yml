  - "Handoff por msg do corretor: corretor responde no chat → is_ai_active=false, handoff_reason='broker_reply'; Nicole para imediatamente."
  - "Reativação ancorada: conversa em handoff por agendamento → Nicole NÃO reassume antes de 24h do handoff_at (mesmo sem msg de corretor); após 24h sem corretor, reassume e limpa handoff_at/handoff_reason."
  - "Não-regressão: lead NOVO manda 'Olá' → Nicole responde normalmente; sem handoff espúrio."
  - "INFRA-001: confirmar `messages` na publicação supabase_realtime (chat em tempo real do corretor)."

