behaviors_verified:
  nao_regressao_nicole:
    result: CONFIRMED
    evidence:
      - "findOrCreateConversation cria conversa com is_ai_active=true (route.ts:994)."
      - "let isAiActive = conversation!.is_ai_active (route.ts:644) → true para lead novo."
      - "guard if(!isAiActive) (L645) pula o bloco de reativação para conversa ativa."
      - "if(isAiActive) (L682) → pipeline processMessage → Nicole responde."
      - "appointmentCreated default false (L693); só vira true em APPOINTMENT_CREATED → mensagem normal NÃO dispara handoff."
      - "Merge preservou main: 23505 early-return (L443), 71-1 sem distribuição (L628), createCalendarEvent 73-1 (L687)."
  handoff_por_agendamento:
    result: CONFIRMED
    trigger: "APPOINTMENT_CREATED"
    evidence:
      - "appointmentCreated = true no onEvent quando event.event_type === 'APPOINTMENT_CREATED' (route.ts:728)."
      - "Após enviar a resposta da Nicole (fetch L748-760), UPDATE is_ai_active=false / handoff_at=now / handoff_reason='appointment' (L768-778)."
      - "Guard .eq('is_ai_active', true) → idempotente, só desliga se ainda ativa; por-conversa via .eq('id', conversation.id)."
      - "notifyBrokerOfAppointment preservado (L733), dispara no onEvent ANTES do fetch → backstop: corretor é avisado mesmo se o envio/handoff falhar."
  handoff_por_msg_corretor:
    result: CONFIRMED
    trigger: "broker_reply"
    evidence:
      - "send-message/route.ts:281 guard if(conversation.is_ai_active)."
      - "createAdminClient().update({ is_ai_active:false, handoff_at:now, handoff_reason:'broker_reply' }).eq('id', conversation.id) (L282-290)."
      - "Admin client necessário: corretor não-admin pode não ter policy UPDATE em conversations sob RLS."
      - "Best-effort: se UPDATE falhar, loga e segue; próximo envio reencontra is_ai_active=true."
  reativacao_ancorada:
    result: CONFIRMED
    evidence:
      - "Promise.all busca conversations.handoff_at + última msg role='broker' (route.ts:650-664)."
      - "anchor = resolveTakeoverAnchor(handoff_at, lastBrokerAt) (L666-669) — retorna o mais recente; null se ambos null."
      - "shouldReactivateAi(anchor) (L671): reassume se anchor null OU ≥24h; mantém se <24h."
      - "Ao reassumir, limpa handoff_at/handoff_reason (L675) para não influenciar cálculos futuros."
      - "Helper resolveTakeoverAnchor puro (broker-takeover-status.ts:116-125) + 9 testes novos (boundaries, igualdade >=, integração com shouldReactivateAi)."

