escopo: >
  6 dos 125 leads da etapa Atendimento não têm nome, e o template escolhido começa com "Oi {{1}}!".
  Sairia "Oi ! Tudo bem?" — mensagem paga ao lead com a variável vazia à mostra. Esta story barra
  qualquer parâmetro vazio e acerta o acento dos fallbacks que chegam ao cliente.

resumo: >
  Achado ao MEDIR os dados das variáveis antes de escrever cópia nova — não por teste, por ir olhar.
  A run das 14:00 seria a primeira a incluir esses leads, porque a 75-355 acabou de torná-los
  alcançáveis. Mitigação imediata por config; conserto de código aqui.

  Registro que muda prioridade: `nicole_sent` ENTREGUES na etapa Atendimento em 30 dias = 0, e é
  estrutural (a regra dispara com 3+ dias sem contato; mensagem do lead atualiza `last_contact_at`, logo
  a janela de 24h está sempre fechada quando ela dispara). O texto livre daquela regra é praticamente
  inalcançável — quem fala com o lead é o template.

status_reason: "Liberado. Depois do merge, religar o template na etapa Atendimento."

