decisao: >-
  **CONCERNS — nenhum item bloqueia o push.** Zero defeito vivo, zero regressão. A entrega faz o
  que promete, e as quatro medições que o @po pediu eu refiz com as minhas próprias mãos contra
  o banco, incluindo a redefinição da forma defeituosa dentro da mesma transação. O que fica é
  uma régua que para um degrau antes do dano que ela mesma descreve (QA-900-62-1) e o ponto cego
  já conhecido do `.tsx` (QA-900-62-2) — os dois com remédio escrito e barato.
