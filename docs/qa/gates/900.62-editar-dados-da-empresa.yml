top_issues:
  - id: QA-900-62-1
    severity: medium
    finding: >-
      **A régua da AC13 para uma casa antes do dano que ela nomeia.** Ela prende a PROJEÇÃO
      (`updated_at`/`settings` na string de colunas). Não prende a FIAÇÃO — que a projeção
      chegue de fato ao `inicial` do diálogo. Medido (PROBE-1): com a projeção intacta, seis
      literais `""` no lugar de `...dadosDeContato` deixam `tsc` rc=0 e a suíte 311/4274/6, e
      produzem exatamente o desfecho que a AC13 cita como razão de existir — "o operador que
      abre o diálogo para corrigir o `name` e salva apaga o contato e o fiscal que já estavam
      lá, com `200` na tela". Não é defeito vivo: o código entregue lê `...dadosDeContato` e o
      @dev exercitou na tela. É carrasco ausente para a regressão que a AC já declarou.
    suggested_owner: dev
    bloqueia_push: false
    recomendado_fechar_nesta_story: true
    remedio_exato: >-
      No bloco `describe("AC13 (900-62) …")` de `platform-query-scan.test.ts`, ao lado dos dois
      `it` da projeção, um terceiro que ancore o call site — a régua de existência sobe de
      degrau, de "a coluna está na projeção" para "a coluna chega na prop":
      `const fonte = fs.readFileSync(PAGE, "utf8")` ;
      `expect(fonte).toContain("const dadosDeContato = lerContatoEFiscal(org?.settings)")` ;
      `expect(fonte).toContain("inicial={{ name: org.name, slug: org.slug, ...dadosDeContato }}")`.
      Mais forte (e é o que eu prefiro, porque régua de forma é cega a rebind): extrair
      `dadosIniciaisDoDialogo(org)` para `console-dados-empresa.ts`, com `it` provando que uma
      org com `settings.contato` produz `contatoNome` NÃO-vazio, e ancorar só a CHAMADA
      `inicial={dadosIniciaisDoDialogo(org)}` no `.tsx`.
  - id: QA-900-62-2
    severity: low
    finding: >-
      **AC15 sem carrasco — e a resposta à pergunta é: DÁ para extrair.** Confirmei por medição
      (PROBE-2) que remover as seis linhas do card deixa tudo verde. O @dev declarou isso com
      honestidade e disse "a prova é a tela". Discordo do "só": o precedente é a própria 900-60,
      onde a decisão saiu do `.tsx` para função pura justamente porque eu derrubei essa classe
      lá. Aqui o que precisa sair não é o markup — é a DECISÃO de quais seis rótulos, com que
      valor e com que travessão.
    suggested_owner: dev
    bloqueia_push: false
    remedio_exato: >-
      `linhasDeContatoEFiscal(settings): Array<{ rotulo: string; valor: string }>` em
      `console-dados-empresa.ts` (com `maskCpfCnpj` aplicado ALI, não no JSX), com `it` provando:
      6 linhas; `—` em cada uma quando `settings` é `{}`/`null`; CNPJ mascarado quando gravado só
      com dígitos. O `.tsx` vira um `.map` sobre isso. A prova deixa de ser só a tela.
  - id: QA-900-62-3
    severity: low
    finding: >-
      **A `252` não está no ledger do banco de teste** — `pnpm db:status` mostra `PENDENTE` num
      banco onde a função existe. **Aceitável até o deploy, e eu provei mais do que o @dev
      afirmou:** o `md5` do corpo VIVO das duas funções em `trifold-crm-dev` é idêntico ao corpo
      do arquivo. A razão declarada (não arrastar 4 migrations de outras stories) é sólida, e
      reverter `docs/audits/migrations-aplicadas.json` foi a decisão certa pelo mesmo motivo.
      Nenhuma régua depende do ledger real (`scripts/migrations-ledger.test.ts` roda sobre
      fixtures sintéticas — conferido).
    suggested_owner: devops
    bloqueia_push: false
    acao: "No deploy, aplicar pelo caminho sancionado (`CREATE OR REPLACE` é idempotente) junto das outras pendentes, e conferir o ledger depois."
  - id: QA-900-62-4
    severity: low
    finding: >-
      **A denylist da AC14 é da ROTA, não da tabela — e eu julgo que BASTA para esta story,
      com dívida nomeada.** Medi os três server actions (`configuracoes/empresa/page.tsx:134`,
      `materiais/page.tsx:71`, `relatorio-diario/page.tsx:120`): os três leem `settings` FRESCO
      dentro da própria action e dão spread. Logo (a) não conseguem escrever `contato`/`fiscal`
      — nenhum formulário deles tem os campos — e (b) PRESERVAM as duas chaves quando gravam.
      O resíduo é uma janela de lost-update de milissegundos que **já existia** para
      `city`/`state` e não é criada por esta story. O @dev está certo: "propriedade dos
      formulários, não garantia". Não vira concern bloqueante; vira item de backlog.
    suggested_owner: po
    bloqueia_push: false
    acao: "Backlog: fechar por `CHECK`/trigger em `organizations` (ou mover a denylist para um helper compartilhado pelos 4 escritores). Story própria."

