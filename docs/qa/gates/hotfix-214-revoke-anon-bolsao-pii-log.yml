      refs: ['supabase/migrations/214_hotfix_revoke_anon_bolsao_pii_log.sql']
    - action: 'Após aplicar, exercitar 1 puxada real de lead do bolsão pela UI — é a única função
        de escrita afetada, e o sintoma de erro seria 42501 nos logs da Vercel'
      refs: ['packages/web/src/app/api/bolsao/[id]/pegar/route.ts']
  future:
