    status: PASS
    notes: 'Nenhum fetch novo no caminho crítico: o drawer já buscava conversations e só passou a
      pedir last_message_at na mesma query. O único request adicional é 1 select em users para
      resolver o viewer, uma vez por abertura de drawer.'
  reliability:
    status: PASS
    notes: 'O gotcha 75-228 (useState(prop) congela após refresh) foi tratado corretamente:
      openingSent é estado próprio do componente, não derivado de prop, e o reloadToken força o
      re-fetch. LeadDetailContent é montado com key={leadId} (:194), então o estado de sucesso
      NÃO vaza para outro lead — verifiquei porque seria o erro natural aqui.'
  maintainability:
    status: PASS
    notes: 'A story removeu duplicação em vez de criar (REUSE > CREATE): o menu passou de 1 cópia
