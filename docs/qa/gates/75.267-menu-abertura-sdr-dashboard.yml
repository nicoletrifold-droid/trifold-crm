story_title: 'Menu de abertura no /dashboard: a SDR inicia atendimento de onde ela trabalha'
gate: CONCERNS
status_reason: 'Nenhum problema HIGH. O código está correto e a extração é fiel: conferi o
  recorte `broker-message-input.tsx` (estado + handlers + UI) contra a main linha a linha — as
  classes, os textos e o fluxo são idênticos, e a única mudança de contrato é `router.refresh()`
  → callback `onSent` (o /broker passa exatamente `() => router.refresh()`). A constante
  `OPENING_PRIVILEGED_ROLES` virou módulo client-safe com re-export e o array inline duplicado da
  rota morreu — fonte única, sem valor reproduzido. O CONCERNS é por EVIDÊNCIA, não por defeito:
  AC1 e AC4 são o fluxo central da story (a SDR abrindo de verdade) e seguem sem validação de
  runtime com o login da Thielly em prod — o dev DB tem drift grande e não serve de prova
  (lição 75-188). tsc 0 erros, eslint 0 novos (os 2 warnings do drawer já existem na main,
  conferido), vitest 132 arquivos/1552 testes verdes.'
reviewer: 'Quinn'
