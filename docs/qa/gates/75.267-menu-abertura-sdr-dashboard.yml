      terceira cópia.'

top_issues:
  - id: 'QA-001'
    severity: low
    category: correctness
    finding: 'RISCO LATENTE CORRIGIDO NA REVISÃO — o drawer escolhe a conversa com
      `.order("last_message_at", { ascending: false }).limit(1)`, e em Postgres DESC ordena
      NULLS FIRST. Como `conversations.last_message_at` é nullable (confirmado no
      information_schema), uma conversa vazia venceria a conversa real e o lead pareceria "nunca
      teve conversa" — oferecendo abertura a quem já está em atendimento. Medi a incidência em
      prod antes de decidir a severidade: 415 conversas, 0 com last_message_at null, 1 lead com
      2+ conversas, 0 leads no padrão de risco. Ou seja: hoje não acontece, mas o gate novo
      passou a DEPENDER dessa ordenação estar certa.'
    suggested_action: 'CORRIGIDO pelo @qa: `nullsFirst: false` explícito em
      lead-detail-drawer.tsx. Zero mudança de comportamento hoje (0 linhas afetadas em prod),
      correto por construção amanhã.'
    suggested_owner: dev
  - id: 'QA-002'
    severity: low
    category: ux
    finding: 'O viewer (role + id) é resolvido em efeito assíncrono, então no primeiro paint
      `canShowOpeningMenu("", false)` é false e o drawer mostra "Conversar no WhatsApp" por um
      instante antes de trocar pelo menu de abertura. Cosmético, sem risco de vazamento (o estado
      inicial é o MAIS restritivo, que é o lado certo para errar).'
    suggested_action: 'Observar. Se incomodar, o caminho limpo é computar o gate no server e
      passar prop booleana — a própria Dev Note já registrou essa alternativa.'
    suggested_owner: dev
  - id: 'EVID-001'
    severity: low
    category: requirements
    finding: 'AC1 e AC4 sem prova de runtime: ninguém enviou uma abertura de verdade pelo drawer
      com o login da Thielly em prod. É o coração da story — o resto do trabalho existe para esse
      fluxo funcionar. O RLS do sdr passa pela matriz do gerente-comercial (75-204) e a API usa
      admin client para privilegiados; o caminho é plausível, mas plausível não é medido.'
    suggested_action: 'Validar com a Thielly logada em prod após o deploy: abrir um lead sem
      conversa pelo Kanban, enviar a abertura, conferir o CTA "Ver conversa", a mensagem na thread
      e a aparição em /dashboard/conversas. Só então Status → Done.'
    suggested_owner: po
  - id: 'PROC-001'
    severity: low
    category: process
    finding: 'Lacuna de processo notada de passagem: as stories 75-264 e 75-266 registraram o
      resultado do QA só no corpo da story, sem arquivo em docs/qa/gates/ — a convenção
      75.{story}-{slug}.yml vinha sendo seguida até a 75-256/257.'
    suggested_action: 'Não é desta story. Vale retomar o arquivo de gate por default, senão o
      histórico de qualidade fica só dentro das stories.'
    suggested_owner: sm

