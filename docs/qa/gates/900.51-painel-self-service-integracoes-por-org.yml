status_reason: >-
  Segunda rodada, sobre o commit `bc8c48ae`. **As duas concerns bloqueantes estão fechadas, e
  fechadas com o vermelho reproduzido por mim.** QA-900-51-1: `alertarAposEscritaDeIntegracao()`
  virou o único ponto de disparo e as duas rotas o chamam; rodei as duas mutações — matar o
  predicado do Alerta 1 acende `/dashboard` **1 failed | 7 passed** (antes: as duas rotas verdes),
  e remover o disparo do call site do `/dashboard` acende **2 failed | 6 passed** enquanto
  `alertas-page-id.test.ts` segue **13 passed** — conjuntos de morte na direção certa, o carrasco
  mora no call site. QA-900-51-2: a causa foi consertada, não o sintoma — `montarTilesDoPainel()`
  é a única montagem, as duas telas a usam, `whatsapp_config` entrou em
  `PLATFORM_READABLE_TABLES` lendo **só** `status`/`phone_number_id`/`updated_at`, e há régua nova
  reprovando menção da credencial em toda a árvore de `/platform`. O cartão parou de mandar o
  usuário para um fluxo inexistente e diz a verdade, nomeando `900-52`/`53`/`54`.
  **A assimetria do `/platform` é achado, não buraco** — naquela superfície o Alerta 1 é
  inalcançável por construção, e exigir vermelho ali obrigaria a fabricar um cenário impossível,
  que é exatamente o pecado da versão anterior.
  **O M23 do `@dev` está certo e eu confirmo o método — mas a régua final tem a MESMA cegueira,
  um nível acima**, e isso é o décimo nono. Ele saiu de "guarda de existência do *import*" para
  "guarda de existência da *chamada*"; medi que reverter o conserto inteiro no `/platform` (apagar
  a leitura de `whatsapp_config` e passar `null`) traz o 18º cego de volta **intacto** e deixa
  `pnpm test` **294/3763 verde**, `type-check --force` verde e `lint --force` com **0 erros**.
  A régua ainda mede a CHAMADA, não o ARGUMENTO — que é literalmente a lição da M14 que ele
  aplicou ao `technicalDetail` e ao disparo do alerta, e não aplicou à centralização que acabou de
  criar. **Não bloqueia o merge:** o valor está correto nas duas telas hoje, nada regride, e o
  buraco é de catraca sobre um conserto provado, não defeito vivo. Fica como **forward-gate
  QA-900-51-3**, com conserto nomeado.
  Números reconferidos por mim: `pnpm test` **294 files / 3763 passed**, `pnpm test:tenancy`
  **28 passed / 0 skipped**, `turbo type-check --force` e `turbo lint --force` verdes (0 erros;
  30 warnings, nenhum em arquivo da story).
