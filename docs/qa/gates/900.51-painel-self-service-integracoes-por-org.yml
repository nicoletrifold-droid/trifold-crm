# 6. AS QUATRO RENÚNCIAS — JULGADAS
# ═════════════════════════════════════════════════════════════════════════════
renuncias:
  - id: "WEBHOOK_ORG_ROUTING lido direto de produção (403)"
    veredicto: "ACEITA — e a conclusão não depende da leitura que faltou."
    razao: >-
      Também não consigo ler a env do projeto canônico desta máquina. Mas o gate da Task 12 não
      precisa dela, e isso é mais forte do que as 3 evidências indiretas: eu MEDI em produção
      (somente leitura) que a linha `meta_ads` da única org tem `status='disconnected'` **e**
      `config->>'page_id' = NULL`. `resolveOrgByMetaPage` casa por `config->>page_id`; com o valor
      NULO, **nenhuma linha casa, em qualquer modo**, com ou sem o filtro novo. O filtro não pode
      regredir o roteamento hoje nem em `identifier`. A medição extra do `@dev` está correta e é
      ela que sustenta a decisão — não o default.
      Confirmei o default no código: `decidirModoRoteamento()` devolve `"both"` para qualquer
      valor que não seja exatamente `legacy`/`identifier`, inclusive ausente e inclusive erro de
      grafia. Não lança.
      **Continua valendo o "reconfirmar no dia do deploy"** — a env pode mudar, e o gate de
      `identifier` na AC10 continua bloqueante por outro motivo (não há `page_id` gravado).
  - id: "Teste manual ponta a ponta + o probe que não prova posse"
    veredicto: "RENÚNCIA ACEITA — e a pergunta que eu levantei na rodada 1 PROCEDE, confirmada."
    razao: >-
      `validarMetaAds` testa com `GET /{page_id}?fields=id,name` — metadados PÚBLICOS do nó Página.
      Prova "o token é válido" + "a Página existe"; **não prova posse**. O `@dev` confirmou e
      escreveu a consequência inteira: com o `P0018` já declarado como zero redução de superfície e
      a AC10 fechando só a sub-classe não-promovida, **nenhuma camada prova posse** — e o único
      freio vivo do risco de C1 passa a ser a detecção da AC11.
      **Não trocar o probe às cegas é a decisão certa:** rede não é exercitável aqui, e um probe
      errado tornaria `meta_ads` inconfigurável por um caminho que nenhum teste cobre — trocaria
      um risco declarado por uma quebra silenciosa. O experimento decisivo (dois tokens, admin e
      não-admin, mesmo `page_id`) e as candidatas (`/{page_id}/leadgen_forms`,
      `fields=access_token`) estão no backlog, com o raciocínio.
    peso_que_eu_dou: >-
      Registro que este item **não é um débito qualquer**: ele é a pré-condição do gate de
      `identifier` da AC10. Enquanto ninguém rodar o experimento, "quem grava o `page_id` é dono
      dele" é suposição, e a única compensação viva é um alerta com um call site. Em `both` (o modo
      de hoje) isso não custa nada — em `identifier` custa os leads de outra empresa.
  - id: "P0013/P0016 sem carrasco"
    veredicto: "ACEITA, e a razão é boa."
    razao: >-
      São defesa em profundidade contra a linha sumir entre o `SELECT … FOR UPDATE` e o `UPDATE`;
      o próprio `FOR UPDATE` torna o cenário inalcançável de dentro de uma transação de teste. Dito
      em vez de fingido coberto — é a conduta certa. O caminho que importa (`v_row_id IS NULL`,
      `P0012`) TEM carrasco e tem mutação (M7, 5 failed).
  - id: "CodeRabbit não executado"
    veredicto: "ACEITA — e a frase dele está certa."
    razao: >-
      *"Não executado ≠ passou"*. O gatilho que vale neste repositório é o App do GitHub no PR;
