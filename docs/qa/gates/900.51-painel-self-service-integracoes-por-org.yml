# ═════════════════════════════════════════════════════════════════════════════
# 1. O DEFEITO UNIFICADOR — MEDIDO NA SUPERFÍCIE, NÃO NO ARQUIVO
# ═════════════════════════════════════════════════════════════════════════════
defeito_unificador:
  pergunta: >-
    As duas reprovações foram pelo mesmo defeito: as garantias viviam na rota Next, não na RPC que
    `authenticated` alcança direto. A pergunta do gate é se elas agora vivem na RPC.
  metodo: >-
    Não li a lista de `GRANT`/`REVOKE` do arquivo. Consultei `has_function_privilege(<role>, oid,
    'EXECUTE')` para as 14 funções da `248` no `trifold-crm-dev` — a régua do arquivo é alegação,
    o catálogo é o objeto.
  medido: |
    | função                                     | authenticated | anon  | service_role | secdef | search_path |
    |--------------------------------------------|---------------|-------|--------------|--------|-------------|
    | `org_integration_write_secret_as_org`      | **true**      | false | true         | true   | pinado      |
    | `org_integration_mark_connected_as_org`    | **true**      | false | true         | true   | pinado      |
    | `org_integration_mark_error_as_org`        | **true**      | false | true         | true   | pinado      |
    | `org_integration_reveal_last4_as_org`      | **true**      | false | true         | true   | pinado      |
    | `org_integration_*_as_platform` (4)        | false         | false | true         | true   | pinado      |
    | `_org_integration_write_secret`            | false         | false | true         | true   | pinado      |
    | `_org_integration_mark_connected`          | false         | false | true         | true   | pinado      |
    | `_org_integration_mark_error`              | false         | false | true         | true   | pinado      |
    | `_org_integration_reveal_last4`            | false         | false | true         | true   | pinado      |
    | `_org_integration_ator_org`                | false         | false | true         | true   | pinado      |
    | `platform_audit`                           | false         | false | true         | true   | pinado      |
  conclusao: >-
    A superfície exposta é exatamente a pretendida, e é a mais estreita possível: as 4 funções
    `_as_org` **não têm parâmetro de org nem de ator** (endurecimento sobre o texto da AC1,
    declarado pelo `@dev` no item 3 do Dev Agent Record). A org vem de `user_org_id()`, o ator de
    `auth.uid()` e `actor_type` é a constante `'org_admin'` — não existe parâmetro para o corpo da
    requisição mentir. É o que torna o `actor_type` confiável como discriminante da AC11.
    `_org_integration_ator_org()` é avaliada como ARGUMENTO das 4 funções, logo sempre executa:
    sem sessão, sem org ou sem a capability ⇒ `P0021`, antes de qualquer efeito.

# ═════════════════════════════════════════════════════════════════════════════
# 2. O ACHADO R1×R7 — A EXCEÇÃO É MESMO CIRÚRGICA (MEDIDO NA FUNÇÃO VIVA)
# ═════════════════════════════════════════════════════════════════════════════
achado_r1_x_r7:
  veredicto: CONFIRMADO — o achado é real e o conserto não abre mais que a nulificação.
  metodo: >-
    `pg_get_functiondef` de `platform_audit_log_immutavel` (a função VIVA, não o arquivo) +
    8 mutações de FORMA do UPDATE, todas em `BEGIN…ROLLBACK` via Management API, coletando
    `SQLSTATE` em temp table. Ressalva do próprio instrumento, registrada porque quase me enganou:
    a primeira rodada deu `c1_reaponta_org = PASSOU`, e o motivo era o **setup**, não o trigger —
    `trifold-crm-dev` tem **1 organização só**, então `v_org2` vinha `NULL` e o meu "reaponta"
    era, na verdade, uma nulificação. Refiz com `COALESCE(v_org2, gen_random_uuid())`.
  medido: |
    | # | mutação de FORMA do UPDATE                       | esperado | **medido** |
    |---|--------------------------------------------------|----------|------------|
    | 1 | `org_id` → OUTRA org (não NULL)                  | bloqueia | **P0020**  |
    | 2 | `metadata` → `|| '{"forjado":true}'`             | bloqueia | **P0020**  |
    | 3 | `created_at` → `now() - 10 anos`                 | bloqueia | **P0020**  |
    | 4 | `actor_type` → `'platform_admin'`                | bloqueia | **P0020**  |
    | 5 | `action` → `'outra.acao'`                        | bloqueia | **P0020**  |
    | 6 | `actor_user_id` → OUTRO usuário (não NULL)       | bloqueia | **P0020**  |
    | 7 | `actor_user_id = NULL, org_id = NULL`            | PASSA    | **PASSOU** |
    | 8 | `DELETE` da linha                                | bloqueia | **P0020**  |
  cobertura_de_colunas: >-
    A tabela tem 9 colunas. O predicado do trigger cobre as 9: `id`, `actor_type`, `action`,
    `target_table`, `target_id`, `metadata`, `created_at` por `IS NOT DISTINCT FROM` estrito, e
    `actor_user_id`/`org_id` por "igual OU NULL". Não existe coluna fora do predicado — a exceção
    é a forma da ação referencial e nada mais.
  privilegios_vivos:
    sr_ins: true
    sr_upd: false
    sr_del: false
    sr_trunc: false
    authenticated_update: false
    authenticated_select: true
    triggers_nao_internos: 3
    rls: true
    force_rls: false
  residual_declarado: >-
    O DONO da tabela passa a poder nulificar atribuição em massa (`UPDATE … SET org_id = NULL`
    sem `WHERE`). Está escrito no comentário da `248`, na `AC2` e em `docs/backlog.md` como item
    P3 com dono nomeado (`900-16`). Aceito: para os demais roles o `REVOKE UPDATE` fecha, e
    `metadata->>'actor_label'` sobrevive congelado.

# ═════════════════════════════════════════════════════════════════════════════
# 3. AS 17 MUTAÇÕES DO @dev — AMOSTRA REPRODUZIDA
# ═════════════════════════════════════════════════════════════════════════════
mutacoes_conferidas:
  metodo: >-
    Não reproduzi as 17 (a Camada B exige mutar a função no banco compartilhado). Reproduzi a que
    o `@dev` disse ser a mais importante, e a **mutação inversa** dela, que é a que discrimina.
  m14_confirmada: >-
    A tese está certa e é a lente desta story. `escrita.test.ts` prova o HELPER
    (`montarRespostaDeErro` omite `technicalDetail` com `false`); quem escolhe o argumento é a
    rota. O carrasco do call site existe e morde: `route.test.ts` do `/dashboard` afirma sobre o
    JSON que sai (`Object.keys(json)` sem `technicalDetail`, e o texto sem `OAuthException` nem o
    app id), e o par de `/platform` afirma o contrário (`technicalDetail` PRESENTE). São
    afirmações opostas sobre a mesma sequência, decididas por rota — é o desenho certo.
  mutacao_inversa_que_eu_rodei: >-
    Mutei `ehEscritaDePageIdPorCliente` para `return false` (o alerta 1 da AC11 morre inteiro) e
    rodei **só os dois testes de rota**: `2 files passed | 12 passed`. Depois rodei o teste do
    helper: `5 failed | 8 passed`. Conjuntos de morte **não disjuntos, mas alinhados na direção
    errada**: quem mata o alerta 1 é apenas o carrasco do helper — nenhuma rota o observa. É esse
    resultado que vira a concern 1.

# ═════════════════════════════════════════════════════════════════════════════
# 4. AS DUAS CONCERNS — FECHADAS, COM O VERMELHO REPRODUZIDO POR MIM (rodada 2)
# ═════════════════════════════════════════════════════════════════════════════
concerns_fechadas:
  metodo: >-
    Mesmas mutações da rodada 1, no arquivo em disco, com `assert` que ABORTA se o alvo textual não
    existir (mutação que não encontra alvo sai verde e mente), `shasum` antes/depois e
    `git checkout --` conferido. Baseline do commit `bc8c48ae`: `pnpm test` 294 files / 3763 passed.

  itens:
    - id: QA-900-51-1
      veredicto: FECHADA
      conserto: >-
        `alertarAposEscritaDeIntegracao(provider, lerTrilha)` é o ÚNICO ponto de disparo e as DUAS
        rotas o chamam. A janela filtra por `metadata->>provider` (a rodada 1 lia as 2 últimas linhas
        da org sem filtrar provider — uma escrita de `sienge` podia arrastar linhas de `meta_ads`
        para a janela). `lerTrilha` é injetada porque o transporte difere (`platformQuery` lá, client
        RLS-scoped cá) e a DECISÃO não difere — mora numa implementação só.
        A leitura do `/dashboard` é RLS-scoped (`platform_audit_log_select_org`), sem
        `createAdminClient()`: confirmei que `scripts/admin-client-allowlist.test.ts` segue verde com
        `TOTAL_ESPERADO = 242`, ou seja, nenhuma rota nova entrou na allowlist.
      medido: |
        | mutação                                                  | rodada 1                | **rodada 2**                          |
        |----------------------------------------------------------|-------------------------|---------------------------------------|
        | `ehEscritaDePageIdPorCliente → return false`              | 2 rotas **verdes** (12p)| `/dashboard` **1 failed** \| 7 passed  |
        | disparo removido do call site `/dashboard`                | — (não existia)         | **2 failed** \| 6 passed               |
        | ↳ e `alertas-page-id.test.ts` sob a MESMA mutação          | —                       | **13 passed** (o helper não vê)       |
        Total nos dois arquivos de rota sob a 1ª mutação: **1 failed | 15 passed**.
      a_assimetria_do_platform:
        veredicto: "ACHADO, não buraco — e a argumentação dele está certa."
        porque: >-
          Na `/platform` toda escrita é `platform_admin` por construção (o `actor_type` é congelado
          pelo ponto de entrada `_as_platform`), e a janela lida são as 2 linhas que a própria escrita
          acabou de inserir. Logo `ehEscritaDePageIdPorCliente` **não pode** ser verdadeiro ali.
          Exigir vermelho naquela superfície obrigaria a fabricar um cenário impossível — que é
          exatamente o que a versão anterior fazia (semeava `actor_type: "org_admin"` num fake da
          `/platform`) e o que fez o Alerta 1 parecer coberto quando não tinha caminho nenhum.
          Kill set vazio numa superfície onde o predicado é inalcançável é o resultado CORRETO.
        consequencia_a_registrar: >-
          O Alerta 1 tem, de novo, **um** call site efetivo — mas agora é o certo (`/dashboard`, por
          onde o `org_admin` grava). O Alerta 2 tem dois. A frase "único ponto de disparo chamado
          pelas duas rotas" é verdadeira para o mecanismo e vale só para o Alerta 2 na prática; a
          tabela do `@dev` mostra isso sem maquiar.
        cosmetico_nao_bloqueante: >-
          O teste de AC11 da `/platform` ainda semeia `actor_type: "org_admin"` na fixture. Ele passa
          pelo motivo certo (afirma "MUDOU DE EMPRESA", que é o Alerta 2, e `ehReatribuicaoCrossOrg`
          ignora `actor_type`), mas a fixture carrega um atributo impossível naquela janela e convida
          o leitor a crer que o Alerta 1 dispara ali. Uma linha de comentário resolve.

    - id: QA-900-51-2
      veredicto: FECHADA — e ele consertou a CAUSA, não o valor.
      conserto: >-
        Existiam duas montagens do mesmo fato, uma por tela. Agora `montarTilesDoPainel()` é a única,
        com `derivarEstadoDoTileWhatsapp()` isolando "o WhatsApp desta empresa está conectado?".
        `providers.test.ts` reproduz o estado REAL de produção como fixture — inclusive o caso
        "alguém promoveu à mão a linha morta de `org_integrations`", que continua sendo ignorada.
        `whatsapp_config` entrou em `PLATFORM_READABLE_TABLES` **com justificativa por tabela**, como
        a regra de crescimento exige, lendo só `status`/`phone_number_id`/`updated_at`.
      régua_nova_de_vazamento: >-
        `nao-consumo.test.ts` reprova a menção de `access_token` em toda a árvore de
        `app/platform/**` + `app/api/platform/**`. É a régua certa: a "correção óbvia" seria copiar o
        `!!access_token` do `/dashboard`, e isso puxaria a credencial do tenant para o painel da
        Trifold (D14/AC6). Bem pensada.
      verificado_por_mim: >-
        Confirmei que as duas telas dão a MESMA resposta hoje. O `/dashboard` filtra
        `.eq("status","active")` na própria consulta e por isso passa `status: "active"` literal —
        **não é fabricação**, é o mesmo predicado dito duas vezes. Cheguei a levantar isto como
        divergência e a medição me desmentiu; fica registrado para ninguém repetir o falso positivo.
        Ressalva de robustez (não é achado): se alguém remover aquele `.eq` da consulta, o literal
        vira mentira e nada acende — mesma cegueira do forward-gate abaixo.
      cartao_reescrito: >-
        "Ainda não há como configurar o WhatsApp por esta aplicação. Hoje a credencial é gravada
        direto no banco. As stories 900-52/900-53/900-54 é que abrem esse caminho — até lá, fale com
        o suporte da Trifold." Diz a verdade, nomeia o encaminhamento e parou de citar o nome de um
        `CHECK` de banco para quem lê um painel. A divergência (a) da rodada 1 fica resolvida no que
        me cabia; a decisão de escopo continua sendo do `@po`/dono do produto.

# ═════════════════════════════════════════════════════════════════════════════
# 4b. O DÉCIMO NONO — A RÉGUA DE COBERTURA AINDA MEDE A CHAMADA, NÃO O ARGUMENTO
# ═════════════════════════════════════════════════════════════════════════════
forward_gate:
  - id: QA-900-51-3
    severity: medium
    bloqueia_merge: false
    titulo: >-
      A centralização removeu o ramo duplicado e não criou observador do que cada página ALIMENTA
      na função única. Reverter o conserto da QA-900-51-2 no `/platform` deixa todos os gates
      verdes.
    familia: >-
      M14, terceira volta — "quem escolhe o VALOR/ARGUMENTO é a rota/página, não o helper".
      Aplicada ao `technicalDetail` (rodada 1) e ao disparo do alerta (rodada 2); não aplicada à
      montagem de tiles criada na própria rodada 2.
    o_m23_do_dev_confirmado: >-
      A lição dele está certa e o método é bom: a primeira régua era de EXISTÊNCIA
      ("as duas páginas mencionam a função de derivação") e apagar o ramo do `whatsapp` no
      `/platform` passava VERDE, porque o `import` sobrevive à remoção do uso. Registrar M23 com
      resultado "PASSOU" é a conduta certa — mutação que passa é informação, não ruído.
    mas_a_regua_final_herda_a_cegueira: >-
      A régua virou `expect(fonte).toContain("montarTilesDoPainel(")` +
      `expect(fonte).not.toContain("temSegredo:")`. As duas continuam sendo guardas de
      **existência de texto**. A chamada sobrevive à NEUTRALIZAÇÃO do argumento exatamente como o
      `import` sobrevivia à remoção do uso — o degrau subiu, a classe é a mesma.
    medido: |
      Mutação (reversão completa do conserto no `/platform`): apagar o
      `platformQuery("whatsapp_config", …)` e passar `null` como 2º argumento de
      `montarTilesDoPainel`. É literalmente o código de antes da correção.

      | gate                        | resultado sob a mutação        |
      |-----------------------------|--------------------------------|
      | `pnpm test`                 | **294 files / 3763 passed** ✅  |
      | `turbo type-check --force`  | **8 successful** ✅            |
      | `turbo lint --force`        | **0 erros** (31 warnings) ✅   |
      | régua `toContain("montarTilesDoPainel(")` | **casa** — a chamada continua lá |
      | régua `not.toContain("temSegredo:")`      | **casa** — nada foi derivado à mão |

      E o efeito da mutação é o 18º cego **intacto**: em produção, `whatsapp_config` da Trifold
      está `status='active'` com `phone_number_id` (remedi hoje), e o tile do `/platform` voltaria a
      dizer "Não conectado".
    porque_nao_bloqueia: >-
      O valor está CORRETO nas duas telas hoje, a causa (duas montagens) foi removida, e
      `providers.test.ts` mata mutação dentro da função com o estado real de produção como fixture.
      O que falta é catraca sobre um conserto já provado — não é defeito vivo, e nada regride em
      relação à `main`. Mesmo tratamento que dei ao forward-gate QA-900-24-5.
    conserto_sugerido: >-
      Subir o mesmo movimento um degrau: se a página não escolhe o argumento, não há argumento para
      neutralizar. Uma `carregarTilesDoPainel(porta)` que receba as DUAS leituras (org_integrations
      e whatsapp_config) por uma porta injetada — igual ao que `alertarAposEscritaDeIntegracao` já
      faz com `lerTrilha` — deixa cada página com transporte e zero decisão.
      Alternativa barata, no idioma que a story já usa: acrescentar à régua estática que **cada uma
      das duas páginas menciona `whatsapp_config`** (a mutação acima quebraria) — e, melhor ainda,
      que nenhuma delas passa o literal `null` para a montagem. Guarda de existência com o alvo
      certo já teria mordido.

# ═════════════════════════════════════════════════════════════════════════════
# 5. AS TRÊS DIVERGÊNCIAS DECLARADAS — JULGADAS
# ═════════════════════════════════════════════════════════════════════════════
divergencias:
  - id: "(a) whatsapp somente-leitura"
    veredicto: "REDUÇÃO REAL — a justificativa técnica procede; a comunicação ao usuário NÃO."
    justificativa_tecnica: >-
      ACEITA, e é a decisão certa. `_org_integration_write_secret` levanta `P0010` para
      `whatsapp` por desenho, o `CHECK` da `247` fecha o mesmo caminho no schema, `platform_audit`
      está `REVOKE`ada de `authenticated`, e a migração de `whatsapp_config.access_token` para o
      Vault está no OUT. Escrever `whatsapp_config` aqui seria escrita SEM trilha — contradiz
      AC2/AC11. O caminho de três fatias (`900-52`/`53`/`54`, os três em `Draft`, com a `900-54`
      explicitamente GATED) é o encaminhamento correto.
    honestidade_na_story: >-
      SUFICIENTE, com uma aspereza: a `AC4` continua dizendo "`whatsapp` (grava em
      `whatsapp_config`)" — e está certo que continue, porque o `@dev` não pode editar AC. A
      divergência está no Dev Agent Record (item 2a, com as razões na ordem em que pesaram) e no
      Change Log v0.6. Quem ler só a AC se engana; quem ler a story inteira, não. O `@po` precisa
      corrigir a AC4 ou registrar o waiver.
    comunicacao_ao_usuario: >-
      **RESOLVIDO na rodada 2.** Na rodada 1 o cartão dizia *"a configuração continua no fluxo de
      WhatsApp"* e eu medi que esse fluxo não existe (32 call sites LEEM `whatsapp_config`, ZERO
      escrevem). O texto novo diz: *"Ainda não há como configurar o WhatsApp por esta aplicação.
      Hoje a credencial é gravada direto no banco. As stories 900-52/900-53/900-54 é que abrem esse
      caminho — até lá, fale com o suporte da Trifold."* Verdadeiro, acionável, e sem citar nome de
      `CHECK` de banco para quem lê um painel.
    consequencia_de_produto: >-
      Registrada para o dono do produto, sem suavizar: o pedido foi *"ele cadastra a empresa nova
      e preenche as chaves dela"*. Para o canal de PRODUÇÃO (WhatsApp), isso continua não sendo
      possível pelo painel. As outras 4 chaves, sim.

  - id: "(b) PLATFORM_READABLE_TABLES ganhou platform_audit_log (+ whatsapp_config na rodada 2)"
    veredicto: "AMPLIAÇÃO NECESSÁRIA E BEM REGISTRADA — aprovada."
    verificado: >-
      Entrou com justificativa POR TABELA no comentário de `platform-query.ts` (uma seção para
      `org_integrations`, outra para `platform_audit_log`, esta última dizendo em voz alta "NÃO
      está escrito na AC3"), e o teste literal de `platform-query.test.ts` foi ATUALIZADO com o
      motivo escrito — não afrouxado nem derivado da fonte que ele vigia. É exatamente o que a
      regra de crescimento pede. A alternativa (`.from()` cru em `app/api/platform/**`) é proibida
      por `platform-query-scan.ts`, com razão.
    rodada_2: >-
      A terceira entrada (`whatsapp_config`, exigida pelo conserto da QA-900-51-2) entrou com a
      mesma disciplina: justificativa própria, medição que a motivou, e o limite explícito **"só
      `status`/`phone_number_id`/`updated_at` — nunca `access_token`"**, com régua que reprova a
      menção da credencial em toda a árvore de `/platform`. A lista cresceu de 2 para 5 nesta
      story; as três aparecem em diff, com dono e razão. É o comportamento que a regra pede.
    ressalva_nao_bloqueante: >-
      SEC-001 (embedding do PostgREST contorna a allowlist: `platformQuery("x", "id, users(*)")`
      passa) continua aberto e é dívida pré-existente com dono (`900-42a`). A nova entrada não a
      agrava: as tabelas alcançáveis por embedding a partir de `platform_audit_log` são `users` e
      `organizations`, as duas já na lista.

  - id: "(c) P0021 acrescentado, P0019 não alocado"
    veredicto: "APROVADA — o comentário REGISTRA a recusa, não a esconde."
    verificado: >-
      `248:30-34` diz, textualmente: *"P0019 DELIBERADAMENTE NÃO ALOCADO. Era o código do fecho
      sugerido pelo `@po` na Rodada 3 … O dono do produto RECUSOU esse fecho em 2026-08-30 … O
      código fica vago para que ninguém o reuse achando que a decisão foi outra."* Nomeia quem
      propôs, quem recusou, quando e por quê. `P0021` está na mesma tabela de códigos, com o
      alcance certo (sem sessão / sem org / sem capability nos 4 pontos `_as_org`).

