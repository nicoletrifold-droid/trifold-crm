# 8. ARMADILHA DE INSTRUMENTO QUE EU MESMO CAÍ (registrada para a próxima onda)
# ═════════════════════════════════════════════════════════════════════════════
armadilhas_do_meu_proprio_instrumento:
  - id: "head:true mente sobre tabela inexistente"
    o_que_aconteceu: >-
      Minha primeira sonda de produção usou `.select("id", { head: true, count: "exact" })` para
      perguntar se `platform_audit_log` existe. Voltou `error: null, count: null` — e eu quase
      registrei "a tabela EXISTE em produção", o que teria invertido a leitura inteira da
      aplicação da `248`. Uma consulta honesta (`select` de colunas nomeadas, sem `head`) devolveu
      `PGRST205 Could not find the table`.
    licao: "Requisição `head` não discrimina 'vazia' de 'inexistente'. Pergunte com corpo."
  - id: "quase reportei o literal 'active' como fabricação (rodada 2)"
    o_que_aconteceu: >-
      Vi `status: "active"` literal no argumento que o `/dashboard` passa a `montarTilesDoPainel` e
      montei o caso de que ele ignorava a coluna real, divergindo do `/platform`. A consulta acima,
      que eu ainda não tinha lido, já filtra `.eq("status","active")` — o literal é o mesmo
      predicado dito duas vezes, não uma invenção. **A mutação ficou verde e a leitura do call site
      me desmentiu.**
    licao: >-
      Antes de acusar um argumento literal, leia a CONSULTA que produz o objeto. Um literal
      redundante com o filtro não é fabricação; é acoplamento. (O acoplamento é real e está
      registrado como ressalva de robustez em QA-900-51-2, mas não é achado.)
  - id: "setup de 1 linha transforma 'reaponta' em 'nulifica'"
    o_que_aconteceu: >-
      No carrasco de cirurgia do trigger, `v_org2` veio NULL (o banco de teste tem 1 org só) e o
      meu UPDATE "reaponta para outra org" virou, sem eu perceber, um UPDATE de nulificação — que
      o trigger PERMITE por desenho. O falso positivo dizia que a exceção era frouxa.
    licao: >-
      Fixture com uma entidade só apaga a diferença entre as duas mutações que o teste existe para
      distinguir. Afirme a pré-condição do setup (`setup_org2_existe`) antes de afirmar o
      resultado — foi essa chave que me denunciou.

