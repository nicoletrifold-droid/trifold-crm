  b_botao_em_todas_as_listas: 'CUMPRIDA E VERIFICADA POR CONTAGEM — 1 única ocorrência do botão, dentro do PostCard (linha 593, antes do componente principal na 611), e **4 listas** usam PostCard. Aparece nas quatro de uma vez, sem replicação por call-site.'
  c_perda_silenciosa: 'CUMPRIDA — o texto ANTES do primeiro marcador é preservado como tela própria, e há teste que percorre cada palavra significativa do original conferindo que aparece em alguma tela.'
top_issues:
  - id: 'REVELA-001'
    severity: medium
    finding: '🔴 O QUE O PREVIEW REVELA, e é o achado que importa: o motor gera **uma arte por post**, mas a Lídia propõe 2 telas de story — a própria justificativa dela em produção diz isso. Hoje a lacuna passa batida e o marketing recebe post incompleto sem perceber. Depois desta story ela fica visível no momento de aprovar.'
    suggested_action: 'DECISÃO DO MARCOS: quer N artes por post? É story própria e mexe no motor (o aspectRatio e o prompt são por post hoje). O preview foi feito justamente para essa decisão ser informada.'
  - id: 'UX-001'
