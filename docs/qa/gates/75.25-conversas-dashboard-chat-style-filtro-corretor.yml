  ("Sem contato") deixado como no-op igual ao /broker/chat (evita Date.now no render,
  que dispara react-hooks/purity — erro pré-existente na leads/page). typecheck e lint
  limpos no arquivo. Vale para gerente-comercial, supervisor e admin (mesma página).
