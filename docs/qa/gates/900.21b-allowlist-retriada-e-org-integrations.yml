# 2. MUTAÇÕES DESTE GATE — as duas réguas são carrascos, e são DISJUNTAS
# ═════════════════════════════════════════════════════════════════════════════
# O @po pediu: "o gate deve conferir que R1 falha de verdade". As três mutações do @dev (M1/M2/M3)
# são válidas, mas todas deformam o ARQUIVO de dados ou a regra. Nenhuma delas exercita o modo de
# falha que a catraca existe para pegar no futuro: um arquivo NOVO de verdade em `src`. A célula de
# `--stdin-filename` do @dev prova que a regra acende, mas não que a VARREDURA de `src` alcança um
# arquivo recém-criado. Fiz as duas, para medir kill sets.
mutations:
  - id: "MQ-A — tirar `src/app/api/platform/orgs/route.ts` da seção `legitimos` (arquivo em disco)"
    observed: >-
      4 VERMELHOS: controle positivo (`validarAllowlist` do arquivo real ≠ []; Regra 0, legitimos
      com 11 < 12), união 241 ≠ 242, `PERMITIDOS.size` 241 ≠ 242, e `eslint src` volta a acusar 2
      ocorrências. Restaurado por cópia + conferência de shasum.
  - id: "MQ-B — criar um arquivo NOVO e real em `src/app/api/cron/__qa_probe_900_21b__/route.ts` que importa e chama `createAdminClient()`"
    why: >-
      É o cenário de amanhã: alguém acrescenta uma rota que usa service-role e não passa pela
      allowlist. A régua de FORMA não pode vê-lo, por construção.
    observed: >-
      1 VERMELHO, e SÓ um: `eslint src inteiro não acusa nenhum createAdminClient() fora da
      allowlist` (14 passaram). Kill set DISJUNTO do da MQ-A: a asserção da varredura carrega
      sozinha o caso que nenhuma outra cobre. As duas réguas não são colineares — cada uma mata o
      que a outra não mata. Arquivo e diretório removidos; `git status` de `packages/web/src` limpo.

# ═════════════════════════════════════════════════════════════════════════════
# 3. OS PONTOS QUE O LEAD PEDIU EXPLICITAMENTE — julgados
# ═════════════════════════════════════════════════════════════════════════════
julgamentos:
  - ponto: "A verificação de \"a Trifold não mudou\" é feita onde? É suficiente?"
    veredito: "SUFICIENTE COMO GATE PRÉ-APLICAÇÃO — insuficiente como prova final, e a story diz isso corretamente."
    fundamentacao: >-
      O A/B empírico das 5 consultas rodou no `trifold-crm-dev`, que não tem a org `trifold` nem
      linha de `whatsapp_config` — ou seja, no ambiente que NÃO tem o dado de que a garantia trata.
      O @dev acertou duas vezes aí: (1) descobriu que a AC, escrita com `slug='trifold'`, casaria
      zero linhas e mandaria concluir "procedimento cego" — e recusou o diagnóstico falso em vez de
      colher o verde por vacuidade (é o oposto exato do modo de falha da 900-3c); (2) registrou a
      Divergência 2 (a contagem CRESCE no dev, 0 → 1) em vez de normalizá-la para fora da comparação.
      O que substitui o A/B é uma DECOMPOSIÇÃO, e reexecutei cada perna dela em produção, read-only:
      backfill de whatsapp_config afeta 0 linhas (com controle de vivacidade), org_integrations não
      existe e não tem consumidor, não há caminho de escrita em whatsapp_config, as duas
      pré-condições zeram com grupo não-vazio, a migration é aditiva por leitura do arquivo (só
      CREATE/INSERT; nenhum UPDATE, DELETE ou ALTER sobre tabela existente), e produção não recebeu
      escrita nenhuma (carimbos de updated_at anteriores à story). Acrescentei as duas medições que
      faltavam e que eram o furo real da decomposição: a `provision_org` VIVA em produção não
      derivou do arquivo 240, e as funções que a 246 referencia existem lá. Com isso, a única coisa
      que resta é medível apenas DEPOIS de aplicar — que é passo do @devops, não do @dev. Por isso
      PASS, com a verificação pós-aplicação como condição de deploy (§5) e os hashes pré-aplicação
      registrados abaixo para que ela seja executável em vez de declarativa.
  - ponto: "A contradição interna da AC1 (Regra 2 exige `:linha`; a AC prescrevia motivo sem `:linha` para os 5 testes-irmãos)"
    veredito: "RESOLUÇÃO CORRETA, e pela razão certa."
    fundamentacao: >-
      Abrir exceção por sufixo `.test.ts` seria um buraco permanente numa régua cuja única função é
      não deixar motivo apodrecer — e um buraco que se abre por NOME de arquivo é o mais fácil de
      atravessar sem querer. Acrescentar o `arquivo:linha` da implementação deixa a régua uniforme e
      o motivo mais informativo. Conferido no JSON: os 5 testes-irmãos de `itera-orgs` e os 3 de
      `alvos-onda-2` carregam a citação real (`boleto-scan/route.ts:130`,
      `bolsao-rebalance/route.ts:70-71`, `enrich-leads/route.ts:60`, `meta-leads-retry/route.ts:63`,
      `roleta-retry/route.ts:74`), e nenhuma das 24 entradas de `itera-orgs` fica sem `:dígito`.
      Ressalva menor, registrada e não bloqueante: `/:\d+/` aceita qualquer `:` seguido de dígito —
      um motivo com `12:00` passaria sem citar linha nenhuma. A régua é de forma, não de verdade;
      hoje as 24 citações são verdadeiras (amostrei 7, todas exatas).
  - ponto: "A catraca do gate de tenancy acusa delta +8 — é artefato de medição? Alguma das 8 vem da 246?"
    veredito: "ARTEFATO CONFIRMADO. NENHUMA das 8 vem da migration 246."
    fundamentacao: >-
      Medido sem rodar `gate:tenancy` (que reescreve `docs/audits/gate-tenancy-report.json`,
      rastreado E fixture de teste). Tabelas que existem no dev e não em produção: `lead_facts`,
      `lead_memories`, `trifold_migrations_aplicadas` e `org_integrations` (124 tabelas no dev, 121
      em produção). Conjunto R1 (tabela com `org_id` e RLS desligada): `supremo_sync_log` no DEV,
      VAZIO em produção — a violação R1 é do banco de teste, não do schema real. `org_integrations`
      não aparece em nenhum dos conjuntos: RLS ligada, 2 policies cobrindo os 4 comandos,
      `org_id NOT NULL` — R1, R2 e R3 satisfeitas por medição direta, não por ausência no relatório.
  - ponto: "`alvos-onda-2` não ganhou campo `classe`; a classe virou prefixo do `motivo`"
    veredito: "ACEITO — mas não é estritamente melhor, e sim equivalente com um custo diferente."
    fundamentacao: >-
      O argumento do @dev ("campo que nenhuma regra verifica apodrece calado") é verdadeiro e vale
      igualmente para o prefixo: nenhuma regra verifica `travado:`/`defeituoso:`/`órfão não
      agendado:` também. O que o prefixo tem a mais é que não pode existir sem motivo — a Regra 3
      exige `motivo` não vazio, então a classe viaja presa à justificativa em vez de numa coluna
      paralela que pode ficar em branco. Conferido: as 12 entradas trazem o prefixo, e as 3 classes
      aparecem. O custo real é para quem quiser AGIR sobre a classe na 900-20 — vai ter que fazer
      `startsWith` em prosa. Como a seção inteira expira em 2026-09-30 e existe para esvaziar, o
      custo é limitado. Se sobreviver ao prazo, a story que renovar deve promover a classe a campo
      verificado, não empurrar a data.
  - ponto: "A R9 do gate é cega para arquivo não commitado"
    veredito: "CONFIRMADO, por leitura do código — e é o mesmo padrão da 900-3c."
    fundamentacao: >-
      `rodarR9()` (scripts/gate-tenancy.ts:859) roda
      `git diff --name-only --diff-filter=A ${base}...HEAD -- supabase/migrations/`, que compara
      COMMITS. Com a `246` só na árvore de trabalho, a lista sai vazia e o gate imprime "R9: nenhuma
      migration nova em relação a origin/main" — verde por vacuidade, não por ausência de colisão.
      Não é defeito do gate; é a régua medindo o que ela mede. Vai na §5 como condição do @devops.

# ═════════════════════════════════════════════════════════════════════════════
# 4. ACHADOS — nenhum bloqueia, os dois primeiros viajam para a 900-24
# ═════════════════════════════════════════════════════════════════════════════
top_issues:
  - id: "ARCH-001"
    severity: medium
    finding: >-
      O CHECK `whatsapp_sem_identificador_proprio` é evadido pela grafia mais natural em TypeScript.
      Medido por mim no banco de teste, em BEGIN…ROLLBACK: com `provider='whatsapp'`,
      `config = '{"phone_number_id": …}'` é bloqueado (23514, como a AC promete), MAS
      `config = '{"phoneNumberId": …}'` PASSA e `config = '{"meta": {"phone_number_id": …}}'`
      também PASSA. O comentário da migration diz "com ele, reabrir a decisão custa uma migration";
      medido, custa uma troca de grafia — e `phoneNumberId` é justamente como um dev TS escreveria.
      O @po examinou a semântica e aceitou o recorte "só a chave de topo"; a medição mostra que o
      recorte real é "só a grafia exata da chave de topo", que é mais estreito do que o registrado.
    suggested_action: >-
      Não refazer a 246. Carregar a limitação para a 900-24 (a story que vai CONSUMIR o roteamento
      por `phone_number_id`) e lá fechar por qualquer um dos dois caminhos: normalizar as chaves de
      `config` no CHECK (`NOT (config ?| array['phone_number_id','phoneNumberId','phone'])`), ou —
      melhor — validar a forma do `config` por provider num único ponto de escrita. Corrigir também
      a frase "custa uma migration" no comentário da 246 quando a 900-24 tocar o arquivo.
  - id: "REL-001"
    severity: low
    finding: >-
      `whatsapp_config.status` não tem CHECK nem domínio em produção (é `varchar` livre, default
      `'inactive'`). Os dois índices parciais da AC2 discriminam pelo literal `'active'`; medido em
      BEGIN…ROLLBACK: duas linhas com `status='Active'` e `'ACTIVE'` e o MESMO `phone_number_id`
      convivem sem erro. A AC2 diz que a duplicata fica "estruturalmente impossível" para 18 call
      sites — é verdade para o literal exato, não para o campo. Hoje a exposição é só futura (não
      existe caminho de escrita em `whatsapp_config` em `packages/web/src`, medido: 31 referências,
      0 escritas), e é da mesma família dos 9 call sites residuais que a própria AC2 já nomeia.
    suggested_action: >-
      Na story de onboarding/painel que primeiro ESCREVER em `whatsapp_config` (Onda 7), acrescentar
      `CHECK (status IN ('active','inactive'))` na mesma migration que introduzir a escrita — antes
      disso não há o que proteger.
  - id: "TEST-001"
    severity: low
    finding: >-
      Pré-existente à story (regra nasceu na 900-14), mas relevante para o valor do "0 ocorrências":
      a regra AST detecta `ImportSpecifier` e `CallExpression` com callee `Identifier`. Medido:
      `import * as admin from ".../admin"; admin.createAdminClient()` → 0 hits;
      `export { createAdminClient } from ".../admin"` → 0 hits. A forma canônica dá 2 hits e o
      import aliasado dá 1. Nenhuma dessas formas de evasão existe hoje em `packages/web/src`
      (medido), e não há uso de `createAdminClient` fora de `packages/web/src` a não ser a própria
      regra, o gate e os testes — então a catraca é exata para a população atual.
    suggested_action: >-
      Registrar no backlog (não nesta story): cobrir `MemberExpression` e `ExportNamedDeclaration`
      na regra, com teste de mutação para cada forma.
  - id: "DOC-001"
    severity: low
    finding: >-
      A Regra 3 é bomba-relógio por desenho: em 2026-10-01 as 12 entradas de `alvos-onda-2`
      (`alvosExpiramEm: 2026-09-30`) vencem e `pnpm test` fica VERMELHO no controle positivo do
      arquivo real. Isso é o comportamento pretendido, mas ninguém fora desta story sabe disso.
    suggested_action: >-
      @sm/@po: quando a data se aproximar, a saída correta é a 900-20 corrigir os crons (esvaziando
      a seção) ou uma revisão explícita da classificação — NUNCA empurrar a data, que é exatamente o
      que a régua existe para impedir.

