evidencias_independentes:
  paridade_por_bytes: >-
    Sonda própria do @qa (criada, medida, removida): compilou o buildPrintHtml de
    origin/main (cópia temporária, só com `export` acrescentado) ao lado do de HEAD e
    comparou sha256 do HTML para dado limpo em 2 cenários (sem data/sem filtros; com data
    + 2 filtros) — IDÊNTICO nos dois. Contraprova no mesmo arquivo: dado com `&`/`<`
    DIVERGE, então a sonda é capaz de reprovar. exit 0. Árvore restaurada.
  brinde_tamanho_intocado: >-
    sha256 da árvore == sha256 do blob de origin/main
    (4725a29411efa123b1b7bafaf0efa44258161f738e77a2a645f4fcaa359951df) e
    `git diff origin/main...HEAD` desses 4 arquivos = 0 bytes.
  perdoes_auditados: >-
    As 14 SEGURAS_DECLARADAS foram auditadas uma a uma pelo @qa (o teste só exige motivo
    NÃO-VAZIO, não motivo CORRETO). A única que perdoa dado CRU é
    `TIPO_LABEL[d.tipo] ?? d.tipo`, e está dupla-trancada: CHECK (tipo IN
    ('mae','pai','outro')) em 031:36 intacto (o único DROP CONSTRAINT da família, 165:13,
    é de brindes_tipos) MAIS validação de aplicação nos 3 endpoints de escrita
    (destinatarios/route.ts:87, [id]/route.ts:31, import/route.ts:49) — defesa que a
    story não citou. STATUS_LABEL/TIPO_LABEL são dicionários de literais (types.ts:61,
    print-modal.tsx:18).
  next_build: >-
    NÃO rodado, e por um motivo novo: `pnpm --filter @trifold/web build:teste` sai exit 1
    porque packages/web/.env.development não existe nesta máquina, e um `next build` nu
    resolveria packages/web/.env.local — que nesta máquina aponta para PRODUÇÃO. Substituído
    por duas medições: (a) precedente em origin/main — lancamento-board.tsx:1 é "use client"
    e exporta initials(:38)/avatarBg(:41)/formatDue(:59); (b) nenhuma aresta nova para
    código de servidor — o único importador de print-modal é brindes-table.tsx:13, ele
    mesmo "use client", e os 4 exports novos têm zero consumidores fora do teste.

top_issues:
  - id: 'SEC-002'
    severity: low
    finding: >-
      A régua da AC6 prende a PRESENÇA de `escapeHtml(`, não a SUFICIÊNCIA do contexto.
      Medido pelo @qa (QM4): um sítio novo escapado dentro de atributo SEM aspas passa
      VERDE emitindo `onmouseover=alert(1)` vivo. Nenhum sítio de hoje está em atributo —
      não é vulnerabilidade viva, é falso-verde para o próximo autor.
    suggested_action: >-
      Backlog: escape por contexto (atributo/URL/JS) ou uma régua que proíba `${` fora de
      contexto de texto dentro de buildPrintHtml. Não bloqueia esta story.
  - id: 'TEST-002'
    severity: low
    finding: >-
      `startsWith("escapeHtml(")` é driblável por concatenação — medido pelo @qa (QM5):
      `${escapeHtml(a) + b}` passa VERDE com `b` cru. É o desenho literal do AC6 item 3,
      cravado pelo @po, não uma divergência do @dev.
    suggested_action: 'Mesmo backlog do SEC-002 — endurecer a régua para exigir que a expressão INTEIRA seja uma chamada de escape.'
  - id: 'MNT-001'
    severity: low
    finding: >-
      A régua varre só o recorte de `buildPrintHtml`. HTML montado em outra função e passado
      a `document.write` não é visto. Hoje `win.document.write(html)` (print-modal.tsx:266)
      recebe exclusivamente a saída de `buildPrintHtml`, e `document.write(` tem 1 único
      sítio de código em toda a app — reconfirmado pelo @qa.
    suggested_action: 'Aceito como residual. Se um segundo document.write nascer, a régua precisa nascer com ele.'

fora_do_escopo_desta_story:
  - id: 'ENV-001'
    severity: high
    finding: >-
      `packages/web/.env.local` EXISTE nesta máquina (807 bytes, 30/07, anterior à Story
      900-3b), aponta para o Supabase de PRODUÇÃO (dsopqkqjkmhytudaaolv) e carrega
      SUPABASE_SERVICE_ROLE_KEY. `.env.local` vence qualquer outro arquivo de env no Next,
      e `packages/web/.env.development` NÃO existe — ou seja, `pnpm dev` nesta máquina roda
      contra PRODUÇÃO, exatamente o risco que o CLAUDE.md declara eliminado ("`.env.local`
      não existe mais").
    suggested_action: >-
      @devops: renomear/remover o arquivo e criar packages/web/.env.development a partir do
      .example. NÃO é achado desta story — é estado da máquina, e foi encontrado por
      acidente ao tentar rodar `next build`.

