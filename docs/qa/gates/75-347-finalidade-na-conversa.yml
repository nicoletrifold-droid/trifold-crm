escopo: >
  Três mudanças de risco diferente no mesmo caminho: (1) o prompt de qualificação em PRODUÇÃO — o que
  a Nicole fala com lead pago; (2) a injeção de um campo no system prompt, que move o hash-ouro do
  turno; (3) a MUDANÇA DE DOIS PESOS da régua de calor, que alimenta `interest_level`,
  `qualification_status` e o gatilho de `shouldHandoff`. O risco não é o campo novo: é a régua.

resumo: >
  **O que sustenta o PASS é a medição em produção, não o teste.** Antes de escrever uma linha, medi
  90 dias em `dsopqkqjkmhytudaaolv`: o no-show por calor está INVERTIDO (`hot` 63,6% · `warm` 56,3% ·
  `cold` 52,2%), e a causa é aritmética — 34 leads estavam `hot` e **28 (82%) só eram `hot` pelos 20
  pontos de "aceitou visita"**. A `finalidade` valia zero e estava nula em 83% dos leads (1.515/1.826).

  **Efeito da nova régua simulado nos dados reais (303 conversas): `hot` 34 → 24 (11 saem, 1 entra),
  `warm` 68 → 82.** Os 11 que saem eram quentes só por terem aceitado uma visita — é exatamente o que
  a story quer desfazer.

  **Mutação medida:** desligar a injeção do `<lead_context>` e remover a guarda de não-sobrescrita
  derruba 3 dos 6 testes de fiação (rodado, confirmado vermelho e restaurado). Extrair a finalidade da
  fala da NICOLE (a `origem: "assistant"`) é caso de teste próprio — a pergunta dela contém as duas
  palavras, e sem o fail-closed a story reproduziria a 87-4.

status_reason: >
  Liberado para merge. Uma mudança de comportamento declarada (11 leads mudam de faixa de calor) e
  dois concerns registrados.

acoes_obrigatorias: []

concerns:
  - id: C1
    severidade: MEDIUM
    tipo: mudança-de-comportamento-declarada
    titulo: "11 leads deixam de ser `hot` no primeiro turno após o deploy"
    detalhe: >
      O score alimenta `shouldHandoff` (≥ 70 + pergunta de preço). Menos leads `hot` significa menos
      handoff automático por score — e é o efeito PRETENDIDO, porque o `hot` de hoje falta mais que o
      `cold`. O calor escolhido por humano continua vencendo (`stripManualInterestLevel`, 75-237). O
      recálculo acontece por conversa, no próximo turno de cada lead — não há backfill, e não deve
      haver: reprocessar 303 conversas mudaria badge de lead que ninguém está atendendo.
  - id: C2
    severidade: LOW
    tipo: precisão-da-extração
    titulo: "A extração de finalidade é por palavra-chave, não por modelo"
    detalhe: >
      Segue o padrão que já existe em `extractCollectedData` (nome, entrada, origem): barato, sem
      chamada extra de API, e roda no mesmo turno. O custo é recall — "quero pra minha mãe morar"
      pega; "é pro meu filho" não. Aceito de propósito: o campo só é ESCRITO quando está vazio, então
      um miss não estraga dado, apenas deixa a Nicole perguntar. Se o recall se mostrar baixo em
      produção, o caminho é o cron `enrich-leads` (que já roda Haiku sobre a conversa), não um
      segundo extrator no caminho quente.

