quality_checks:
  code_review: >
    PASS. IDS honesto: `grep` por `ErrorFallback|error-fallback|pickRetry|unstable_retry`
    dá zero no repo, e os 2 `error.tsx` do `/cliente` são inline, tela-cheia e dark-only —
    o CREATE do componente-base se sustenta, e o padrão de LINGUAGEM deles foi preservado
    ("Tentar novamente", `console.error` em effect, `digest` visível). Reuso de verdade e
    não de discurso: as classes do cartão são idênticas às de `dashboard/loading.tsx:19,27`
    e as do botão idênticas às de `dashboard/offline/page.tsx:26-31` — comparei string a
    string, nenhuma cor inventada ([[feedback-consultar-fonte-nao-duplicar-constante]]).
    A separação em 3 camadas (base visual / decisão pura / 2 arquivos de rota de 6 linhas)
    é o desenho certo: o `unstable_` fica confinado a UM ponto de mudança. Comentários
    explicam o PORQUÊ nos 4 pontos não óbvios e citam arquivo:linha verificáveis — todos
    os que eu checei conferem. Um detalhe de estilo, não issue: `onClick={onRetry}` passa
    o evento de clique como 1º argumento; `reset` e `unstable_retry` são arrows sem
    parâmetro no runtime, então é inofensivo (e é o que os 2 arquivos do `/cliente` já
    fazem), embora o doc mostre `onClick={() => unstable_retry()}`.
  unit_tests: >
    PASS. Suíte inteira rodada por mim: 184 arquivos, 2299 passed | 6 expected fail
    (2305), exit 0 — os 6 "expected fail" são a linha de base pré-existente. O ponto que a
    story mais temia está PROVADO na saída `--reporter=verbose`, não presumido: 4 linhas
    `✓ packages/web/src/lib/ui/error-retry.test.ts > pickRetry > …`. Contagem coerente com
    a base (183+1 arquivo, 2295+4 testes). Ausência de teste de componente é correta e
    declarada: sem jsdom/happy-dom/`@testing-library` no repo
    ([[feedback-projeto-sem-teste-de-componente]]) — e o time NÃO fabricou helper puro para
    a parte visual, extraiu só a decisão que existe de fato.
  acceptance_criteria: >
    PASS nas 8 (AC1, AC2, AC2b, AC3-AC7). A única lacuna declarada (AC5 sem runtime) foi
    fechada por mim com evidência de wiring no build, não dispensada.
  no_regressions: >
    PASS, e o risco nº 1 de adicionar um error boundary foi verificado explicitamente:
    `error.tsx` novo poderia ENGOLIR os sinais de navegação que o app lança de propósito.
    Não engole — `error-boundary.js:31-36` faz `if (isNextRouterError(error)) throw error`
    em `getDerivedStateFromError`, e `is-next-router-error.js` cobre `isRedirectError`
    (o `redirect()` dos guards de layout/página) e `isHTTPAccessFallbackError`
    (`notFound()`/`forbidden()`/`unauthorized()`). Logo `redirect()` e `notFound()` seguem
    funcionando exatamente como antes. Fora disso: zero arquivo existente tocado
    (`--diff-filter=MD` vazio), zero teste pré-existente alterado, eslint na linha de base
    exata de 24 warnings, `next build` exit 0 e o fluxo feliz reconferido pelo @dev em 4
    rotas (o boundary não renderiza enquanto nada lança — é o comportamento do mecanismo).
  performance: >
    PASS. Custo medido, não estimado: o chunk SSR de cada boundary tem ~1,1 KB
    (`packages_web_src_app_{dashboard,broker}_error_tsx_….js` = 1.148 e 1.133 bytes) e o
    único import externo é `AlertTriangle` do `lucide-react`, pacote que já entra em toda
    página de `/dashboard` e `/broker` pelos ícones do `SidebarNav` — não há dependência
    nova a carregar. Zero query, zero round-trip, zero trabalho no fluxo feliz.
  security: >
    PASS. Zero `dangerouslySetInnerHTML`, zero `process.env`, zero segredo/chave/token nos
    4 arquivos de produção (grep feito). Nenhuma rota nova → nada de `isPublicRoute` ou RLS
    a conferir; nenhuma escrita, nenhuma query. O texto exibido é o que o próprio Next já
    entrega ao cliente: em erro de Server Component a `message` é redigida pelo framework
    em produção (`error.md:111`) e sobra o `digest`; em erro de Client Component a mensagem
    é real, mas trata-se de código que já está público no bundle. Esta story não expõe nada
    que o framework não expusesse — e o `digest`, que é o dado sensível-por-correlação, é um
    hash opaco, não um identificador de negócio.
  documentation: >
    PASS. Story com File List, 4 decisões autônomas rotuladas, IDS protocol, self-critique
    com bugs previstos e o que foi feito, e — o que mais vale — 3 achados de infra
    pré-existentes registrados para o @qa/@devops em vez de escondidos. Os limites do AC7
    estão no código, com a ressalva do DOC-001. A ressalva da AC5 foi ESCRITA pelo @dev
    antes de eu perguntar; é o comportamento que eu quero ver num Dev Agent Record.

# Julgamento explícito dos 3 pontos que o @dev pediu.
dev_questions_ruled:
  - id: Q1
    question: "AC5 sem evidência de runtime no /broker. Exigir mais ou aceitar?"
    verdict: ACEITO — sem exigir observação de runtime, mas eu acrescentei evidência
    rationale: >
      O que se pagaria para "ver com os próprios olhos" seria ativar (`is_active=true`) a
      seed `corretor@trifold.com.br` ou criar um corretor — ou seja **DML em produção**
      para satisfazer um checkbox, criando um usuário que a roleta e as contagens de lead
      passariam a considerar. Isso é caro e arriscado de verdade
      ([[feedback-nao-quebrar-o-que-funciona]]) contra um ganho quase nulo, porque o
      raciocínio "código idêntico" tinha exatamente UM elo fraco — se o Next reconheceu o
      arquivo como boundary do segmento `/broker` — e esse elo não precisa de navegador
      para ser verificado. Verifiquei-o no artefato de build: os bundles de `/broker/**`
      carregam o chunk do `app/broker/error.tsx` e nenhum outro; os de `/dashboard/**`
      carregam o do dashboard; `/cliente` e `/login` não carregam nenhum. Com o wiring
      provado, o componente é o MESMO que já foi visto renderizando em runtime sob
      `/dashboard`, e o shell é idêntico — eu mesmo comparei `broker/layout.tsx:87,108-109`
      com `dashboard/layout.tsx:305,324-326`: `min-h-screen bg-stone-50 dark:bg-stone-950`
      e `<main className="lg:pl-56">` + `mx-auto max-w-6xl px-4 py-6 pb-24 lg:px-8 lg:py-8
      lg:pb-8`, iguais. Não sobra hipótese com risco material. Fica como follow-up de
      OPERAÇÃO: no primeiro erro real de um corretor, o `digest` da tela tem de casar com
      o `console.error` do log da Vercel — que é a mesma observação reativa que a story já
      previu no risco nº 3.
  - id: Q2a
    question: "Desvio da AC1: deps `[error, scope]` em vez de `[error]`."
    verdict: CORRETO — sem issue
    rationale: >
      A AC1 pede o COMPORTAMENTO "1 log por erro, não por render", e ele é preservado
      integralmente: `scope` é literal fixo (`"[dashboard/error]"` / `"[broker/error]"`) no
      arquivo de rota, então nunca muda entre renders e nunca re-dispara o effect. Omiti-lo
      abriria warning `react-hooks/exhaustive-deps` e estouraria a linha de base de 24 —
      isto é, cumprir a AC1 ao pé da letra violaria a AC6. O @dev escolheu a leitura certa
      da regra e documentou no arquivo (`error-fallback.tsx:48-51`). Confirmei o efeito
      colateral zero no lint que rodei: 24 warnings, nenhuma em arquivo desta story.
  - id: Q2b
    question: "Desvio de cor: `digest` em `dark:text-stone-500`, não `stone-600`."
    verdict: DIREÇÃO CORRETA, mas parou um degrau antes — vira UX-001 (low)
    rationale: >
      Não julguei por gosto, medi. Paleta oklch do Tailwind v4, contraste WCAG sobre o
      fundo do cartão `stone-900`: `stone-600` = **2,29:1** (falha até para texto grande),
      `stone-500` = **3,64:1**. O @dev estava certo e a percepção dele na tela era um fato,
      não uma impressão: a troca melhorou o contraste em ~59%, e num elemento que a própria
      story declara load-bearing (o suporte LÊ o `digest` para casar com o log — mitigação
      do risco nº 2). Mas `text-xs` é texto normal para a WCAG, o mínimo AA é 4,5:1 e
      3,64:1 ainda não chega. O degrau que falta é gratuito: `dark:text-stone-400` dá
      **6,76:1**, é o token que o próprio componente já usa no parágrafo imediatamente
      acima (`text-gray-500 dark:text-stone-400` = 4,84 / 6,76 — ambos AA), então não
      inventa cor nem foge do padrão da casa. Ou seja: aceito o desvio, e recomendo
      completá-lo. Ver UX-001.
  - id: Q2c
    question: "`error.message` exibido no fallback."
    verdict: CORRETO — sem issue de desenho (a cor dele entra no UX-001)
    rationale: >
      Três razões, e nenhuma é "porque dá". (1) É o padrão dos 2 arquivos do `/cliente`, a
      referência de linguagem que a story mandou preservar. (2) O texto ÚTIL em pt-BR não
      depende dele — está no `<h2>` e no parágrafo fixos —, e o bloco é guardado por
      `{error.message && …}`, então em produção, quando o Next redige a mensagem de Server
      Component, a UI não fica com um vazio esquisito nem promete detalhe que não tem.
      (3) Em dev é justamente o que faz o boundary não esconder bug (risco nº 2). Não é
      vazamento: erro de Client Component já é código público. O único reparo é de
      contraste — `text-gray-400` sobre branco dá **2,60:1**, a pior medição do componente
      e pior que a do `digest` que motivou o ajuste. Mesma cura do UX-001.
  - id: Q3
    question: "Validade do método da T4 (Playwright headless próprio + magic link da seed admin) e das evidências."
    verdict: VÁLIDO — método e evidências aceitos
    rationale: >
      O método está certo em três eixos. (a) Canal: terminal e headless próprio, não o
      Chrome do Marcos ([[feedback-terminal-nao-navegador]]); magic link de uso único via
      Auth admin API, sem trocar senha e sem escrever dado de negócio — o mínimo necessário
      para ter sessão, e não havia alternativa, porque `packages/web/.env.development` de
      fato não existe (conferi) e a seed de corretor está inativa. (b) Desenho do
      experimento: é o ponto que salva o teste. A falha auto-extinguível por contador de
      MÓDULO garante que o único evento entre as duas observações é o clique — sem ela,
      "editar o arquivo e clicar" faria o Fast Refresh remontar a árvore e daria falso PASS
      até com `reset()`, exatamente a armadilha que o @po previu. (c) Evidências
      DISCRIMINANTES, não confirmatórias: a lista voltar é evidência fraca (Fast Refresh
      também produziria); `window.__t4Marker` sobrevivendo mata a hipótese "recarregou a
      página"; e o `tentativa nº 1` → clique → `tentativa nº 2` no log do SERVIDOR mata a
      hipótese "foi só `reset()`", porque `reset` não provoca render no servidor. Essa
      terceira evidência casa 1:1 com o `this.context?.refresh()` que eu li na fonte do
      runtime — o mecanismo e a observação concordam por caminhos independentes. Também
      cheguei sozinho na negativa que o teste precisava: a página genérica do Next
      (`/Application error: a .*-side exception/`) NÃO casou. Aceito.

# Nada aqui bloqueia merge.
concerns:
  - id: UX-001
    severity: low
    category: accessibility
    file: "packages/web/src/components/ui/error-fallback.tsx:81,90"
    summary: >
      As duas linhas secundárias do cartão ficam abaixo do mínimo AA (4,5:1) para texto
      normal — e `text-xs` é texto normal para a WCAG. Medido na paleta oklch do Tailwind
      v4: `error.message` = `text-gray-400` sobre branco **2,60:1** e
      `dark:text-stone-500` sobre `stone-900` **3,64:1**; `digest` = `text-gray-500` sobre
      branco 4,84:1 (OK) e `dark:text-stone-500` **3,64:1**. O ajuste do @dev
      (`stone-600` → `stone-500`) foi na direção certa e ganhou ~59% (2,29 → 3,64), só não
      chegou ao mínimo. Pesa porque o `digest` é exatamente o que o suporte precisa LER
      para casar com o `console.error` da Vercel — é a mitigação do risco nº 2 da story.
    recommendation: >
      Usar em ambas as linhas o mesmo par que o parágrafo logo acima já usa:
      `text-gray-500 dark:text-stone-400` (4,84:1 / 6,76:1 — AA nos dois temas). Zero cor
      nova, zero fuga do padrão da casa. Vale de carona quando o arquivo reabrir; se o
      follow-up do `/cliente` unificar os 3 boundaries, corrigir lá de uma vez (o
      `text-stone-600` do `/cliente` sobre `stone-950` é ainda pior).
  - id: MNT-001
    severity: low
    category: maintainability
    file: "packages/web/src/components/ui/error-fallback.tsx:39-41"
    summary: >
      A prop `title?: string` não tem NENHUM consumidor: os dois arquivos de rota usam o
      default. A T3 dizia "idem (só o texto/`scope` muda)" e o texto não mudou — o que na
      prática é a decisão melhor (a frase genérica serve às duas áreas), mas deixa um ponto
      de extensão morto hoje.
    recommendation: >
      Manter é defensável — o follow-up do `/cliente` provavelmente vai querer variar o
      título. Só não deixar virar prop órfã permanente: se o follow-up do `/cliente` for
      descartado, remover a prop.
  - id: DOC-001
    severity: low
    category: docs
    file: "docs/stories/75-299-dashboard-error-boundary.story.md (story-dod-checklist, item 7)"
    summary: >
      O item 7 do DoD afirma que "os limites do AC7 (a-e) estão **no código**, nos
      comentários … não só na story". Conferi os 4 arquivos: (a), (b), (c) e (e) estão
      mesmo nos comentários; o (d) — os outros consumidores de `fetchAllLeads` (os 2 route
      handlers de analytics e o PDF do `analytics-report-data.ts`) não ganham nada com esta
      story — só existe na story. A AC7 pede "a story **ou** o código", então a AC está
      cumprida; a afirmação do DoD é que ficou um passo à frente do fato.
    recommendation: >
      Informativo. Se o comentário do `dashboard/error.tsx` for reaberto, acrescentar uma
      linha ao bloco (3): "route handler falha em 500/JSON — boundary não entra".
  - id: REQ-001
    severity: low
    category: requirements
    summary: >
      T6 aberta por desenho: conferir pós-deploy que `/dashboard`, `/dashboard/leads` e
      `/broker/leads` seguem idênticos no fluxo feliz. É o mesmo padrão do C-5 da 75-298 —
      não bloqueia o PR, mas fica registrado para não sumir. ⛔ Não provocar erro em prod
      para "testar o boundary": a única diferença dev↔prod aqui é a redação da `message`
      pelo Next, que é comportamento de framework, e o preço seria uma tela quebrada para
      um corretor ou gerente real.
    recommendation: >
      Exercer no primeiro acesso pós-deploy. E a observação legítima em prod é REATIVA:
      quando um erro real acontecer, conferir que o `Código: {digest}` da tela casa com o
      `console.error` no log da Vercel — é o que fecha o risco nº 2 de verdade.

