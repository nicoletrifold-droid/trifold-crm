  direto no pacote `web`, `eslint .` = 0 errors / 24 warnings TODAS pré-existentes e
  nenhuma em arquivo desta story, `next build` exit 0. Conferi as 4 afirmações
  load-bearing na FONTE, não no relato: o runtime passa `reset` E `unstable_retry` ao
  componente do usuário (`error-boundary.js:84-88`), `unstable_retry` é
  `refresh()` + `reset()` (`:20-25`), o doc do pacote diz "In most cases, you should use
  unstable_retry() instead" e registra a prop em `v16.2.0` (`error.md:121,157,329`), e o
  `vitest.config.ts` de fato só inclui `*.test.ts`. `git diff main...HEAD --diff-filter=MD`
  = VAZIO — zero arquivo existente tocado, como a story promete, e zero resíduo da falha
  forçada da T4. Fechei sozinho a lacuna da AC5 com evidência estrutural do build (ver
  ac_traceability AC5). O veredito não é PASS por três achados `low`, nenhum bloqueante:
  contraste do `digest`/`message` abaixo do AA (medido, não sentido), a prop `title` sem
  consumidor, e a T6 (pós-deploy) ainda aberta — mesmo padrão do C-5 da 75-298.

