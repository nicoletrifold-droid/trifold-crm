status_reason: >
  **Reproduzi tudo do zero — 16 mutações minhas, sempre na suíte inteira da raiz — e o núcleo do que
  o @dev entregou é sólido.** As três coisas que ele trouxe se confirmam: **(1)** a mutação da AC3-iv
  ao pé da letra derruba **ZERO** testes (medi: 2417 passed), e a decomposição dele em M3b (1 vermelho)
  e M3c (2 vermelhos) preserva a conclusão da AC inteira; **(2)** a guarda `origem !== "lead"` era
  **órfã**, e provei nos DOIS sentidos — com o teste desta story, 1 vermelho; com a árvore de
  `origin/main`, **2411 passed, zero vermelhos**; **(3)** o achatamento da `citacao` é **correção
  necessária, não mudança de comportamento fora de escopo** — reproduzi o modo de falha com uma
  mensagem REAL de produção e o resultado é pior do que ele descreveu.
  As réguas fecham sem margem: baseline `origin/main` medido por mim = **188 arquivos / 2411 passed /
  6 expected fail**; com o diff = **188 / 2417 / 6** (+6 `it`, um por teste novo). `tsc --noEmit`
  **0** em `packages/ai` e **0** em `packages/web`; lint **0 errors / 23 warnings**;
  `npm run prompts:check` **verde** (gate permanente do epic 87). O diff é de **3 arquivos**, todos em
  `packages/ai/src/flows/`, e **nenhuma linha de #427 ou #428** entrou — conferido por conjunto de
  arquivos contra a API do GitHub: os dois PRs tocam `haiku-enrichment.ts`, `enrich-leads/route.ts`,
  `chat/pipeline.ts` e `prompts/collected-data.ts`, **disjuntos** deste diff. Superfície pública de
  `@trifold/ai` **inalterada** (asserção executada, não lida). Nenhuma escrita em banco, em ambiente
  nenhum — só `SELECT` em produção.
  **O que não fecha são quatro coisas, nenhuma delas defeito de comportamento.**
  **(1) A contagem de vermelhos da M2 está errada.** O @dev publicou *"`1 failed` — só
  `AC2-(i)/Rita`"*. Medi **duas vezes**: são **2 failed** — cai também o `citação MULTILINHA`, que
  herda `data_absoluta` do `AGENDA_RITA` e afirma a linha inteira. A assimetria que a AC2-iii exige
  (Ronaldo **não** cai) sobrevive intacta, então a conclusão da AC fica de pé — mas o número colado é
  o único artefato que esta casa aceita como prova, e ele está errado. **É o quarto gate seguido deste
  epic com contagem de vermelho furada.**
  **(2) O Achado nº 7 subconta a família.** Não é *uma* guarda órfã, são pelo menos **duas**: mutei a
  sub-expressão `!o.citacao.trim()` e ela é órfã pelo MESMO mecanismo (0 vermelhos em `main`, 1
  vermelho agora). O `AC3 (fail-closed)` que ele escreveu resgata as duas — o achado é **melhor** do
  que ele publicou, e o texto do Achado precisa dizer *"as guardas de forma"*, não *"a guarda `origem`"*.
  **(3) Uma TERCEIRA guarda continua sem vermelho de teste, mesmo depois desta story.** Removi
  `if (typeof o.ancorado_em !== "string" || typeof o.expira_em !== "string") return null` e a suíte
  ficou **verde: 2417 passed, zero vermelhos**. Quem pega é o `tsc` (2× TS2322), não um teste. E o
  risco é maior aqui do que em qualquer outro consumidor: **`handoff` é o único chamador de
  `parseAgendaState` sem TTL a jusante**, então um estado sem âncora nenhuma **imprimiria ao corretor**
  — provei: `- Disponibilidade para visita: "sexta de manha" - nas palavras do lead, nao e visita marcada`.
  **(4) Três referências de linha ERRADAS no docstring que vai para produção.** O @dev pegou o
  deslocamento da `87-5 A` no arquivo dele (138 → 153) e **não** o pegou no arquivo que ele cita:
  `chat/pipeline.ts:760` (real **821**), `:991` (real **1064**), `:738-741` (real **~800**). Erram por
  60–73 linhas. É comentário, não comportamento — mas é exatamente a classe *"o próximo leitor procura
  no lugar errado"*, e num epic cujo docstring é a trilha de auditoria.

status_reason_r2: >
  **As QUATRO ressalvas do round 1 estão fechadas, e fechadas por medição minha, não por relato.**
  A régua eu recalibrei antes de tocar em qualquer mutação, porque no re-gate da 87-11 o número que
  me chegou vinha contaminado por trabalho não commitado de outra frente: `git status --porcelain --
  packages/` veio **VAZIO**, logo a árvore de trabalho **É** `fe74894a` byte a byte, e o que eu medir
  aqui é o que está no PR. Medi: **188 arquivos · 2418 passed · 6 expected fail**. Bate com o número
  que me foi passado — desta vez sem divergência, e agora sei *por que* não há.
  **(1) A guarda de âncora tem vermelho ATRIBUÍDO, provado nos dois sentidos.** M7 (remover a guarda,
  com o `it` novo) ⇒ **1 vermelho**, e é exatamente `AC3 (fail-closed/ÂNCORA)`, em `handoff.test.ts`.
  M7-sem-o-`it`-novo (remover a guarda **e** o `it`) ⇒ **2417 passed, ZERO vermelhos** — reproduzi o
  controle do @dev tal como ele o publicou. E acrescentei o terceiro sentido, M7-órfã (`origin/main` +
  guarda removida) ⇒ **2411 passed, zero vermelhos**. **Issue QA-3 do round 1: FECHADA.**
  **(2) Os cinco ponteiros do docstring estão CERTOS, conferidos por `awk` sobre
  `git show origin/main:<path>`, nunca por deslocamento inferido.** `:821` = `stripLegacyAgendaKeys`;
  `:1064` = `writeAgendaState(cd, null)`; `:799-803` = `readAgendaState` + o apagamento do vencido;
  `:1298` = onde o `finalData` nasce; `:1326` = onde o resumo é montado. Os cinco, exatos.
  **E a divergência que ele declarou: o @DEV ESTÁ CERTO e eu estava impreciso.** `awk '/citacao:/'`
  sobre `origin/main` devolve **exatamente duas linhas: 958 e 1048**. As `955` e `1047` que eu dera por
  corretas no R1 são `const st = buildAgendaState({` — a linha que **abre** a chamada. A frase do
  docstring é *"passam a mensagem do turno como `citacao`"*, e o ponteiro certo para essa afirmação é
  o da atribuição. Não era erro factual meu (a linha existe e é a chamada), mas era o ponteiro menos
  preciso, e num epic cujo docstring é trilha de auditoria isso importa. **Correção dele aceita.**
  **Issue QA-4: FECHADA.**
  **(3) A M2 são 2, confirmado.** Medi duas vezes, determinístico: `AC2-(i) par-ouro/Rita` **e**
  `citação MULTILINHA`. O mecanismo que ele explicou está no código e eu o li: `handoff.test.ts:391`
  monta `{ ...AGENDA_RITA, citacao: … }`, **herda `data_absoluta` por spread**, e `:396-398` afirma a
  linha inteira com `toBe` incluindo o `(dia 2026-08-18)`. **A assimetria da AC2-iii SOBREVIVE:
  `AC2-(ii)/Ronaldo` NÃO cai.** **Issues QA-1 e QA-2: FECHADAS.**
  **(4) Produção intocada.** `md5` dos 6 arquivos idêntico ao snapshot pré-QA depois de 15 mutações;
  `git status -- packages/` vazio. Escopo: em `agenda-state.ts` há **exatamente UMA** linha
  não-comentário alterada — a palavra `export`; em `handoff.ts`, 1 linha trocada + 1 import + 1 função
  de 6 linhas. **Nada de #427 nem de #428** — o diff é dos mesmos 3 arquivos e `merge-base` = `199a7a84`.
  Nenhuma escrita em banco; nesta rodada não toquei em produção nem para `SELECT`.
  **O que EU trouxe de novo, aplicando a lição da A6 da 87-11 — e é um achado, não um defeito.**
  A guarda de âncora é uma **disjunção** `if (A || B)`, e as **duas** fixtures do `it` novo fazem
  **A e B verdadeiros ao mesmo tempo**. Consequência medida: remover a guarda inteira acende o
  vermelho, mas **cada metade, sozinha, não acende nada** — e duas dessas mutações **sobrevivem
  também ao `tsc`**. Provei a consequência em vez de conjecturá-la: com `expira_em` enfraquecido
  (suíte verde, `tsc` 0), um estado **sem validade legível** é admitido e **IMPRESSO ao corretor**.
  É a mesma assimetria que o docstring do próprio @dev nomeia — por `readAgendaState` o `Date.parse`
  mascara em `null`; no `handoff`, que é o único chamador sem TTL a jusante, não há máscara.
  **Isolei sítio a sítio, como mandava a lição, e o resultado é o OPOSTO da 87-11:** os **três**
  chamadores de `parseAgendaState` têm cobertura própria, em arquivos distintos (M8 = 2 vermelhos em
  `handoff.test.ts`; M9 = 1 e M10 = 3 em `agenda-state.test.ts`). **O mascaramento aqui não é por
  sítio — é dentro do helper, entre sub-expressões da mesma linha.** Mecanismo diferente da A6;
  registro a diferença para ninguém colar o rótulo errado.
  **Por que PASS e não CONCERNS.** As quatro ressalvas do R1 caíram, todas verificadas por medição
  independente; **cada número que o @dev publicou nesta rodada bate com o meu, inclusive os dois
  controles**; não há defeito de comportamento; a superfície de produção é uma palavra, uma linha e
  uma função de seis linhas; as cinco réguas estão verdes medidas por mim; e o docstring que vai a
  produção está exato nos **doze** ponteiros que conferi. O achado novo (QA-6) **não contradiz
  nenhuma afirmação publicada** — a tabela da story diz que a guarda `:183` passou de 0 para 1
  vermelho, e isso é **verdade**, eu medi. Ele é uma camada mais funda de um item que o próprio @dev
  já roteou para o `W1-2d`. Segurar o gate por uma profundidade que ninguém alegou ter coberto seria
  mover a trave — ainda mais tendo eu autorizado o deploy no R1 com um registro de evidência
  estritamente PIOR que o de hoje.

