# ─────────────────────────────────────────────────────────────────────────────
achatamento_da_citacao:
  pergunta: "correção necessária ou mudança de comportamento fora de escopo?"
  veredito: "🟢 **CORREÇÃO NECESSÁRIA. E o @dev sub-argumentou o próprio caso.**"
  medicoes_minhas_em_producao:
    metodo: "Management API, `SELECT` na população INTEIRA — sem o teto de 1.000 do PostgREST"
    total_mensagens_role_user: 1876
    com_quebra_de_linha: "57 (3,04 %)"
    com_sequencia_de_2_ou_mais_espacos: "68 (3,63 %)"
    com_espaco_nas_bordas: "**0** — o `.trim()` é INERTE em produção hoje"
    seriam_alteradas_pelo_achatamento: "**99 (5,28 %)**"
    divergencia_com_o_numero_publicado: >
      O @dev publicou **3,5 % (35 de 1.000)**. Nos últimos 1.000 por `created_at` eu medi **25**; nos
      primeiros 1.000, **33**. A amostra de 1.000 do PostgREST não é aleatória e não é ordenada — o
      número dele é de uma sub-amostra de ordem física. **O valor populacional é 3,04 %, e a direção
      dele está certa.** Registro a divergência com o método, como manda a casa.
    denominador_que_importa_mais: >
      🔴 `citacao` **não é qualquer mensagem** — é a mensagem que dispara a pendência de agenda.
      Medi o proxy honesto (mensagens `role='user'` com token de dia/hora): **110 mensagens, 9
      alteradas pelo achatamento = 8,18 %**, e 6 com quebra de linha. **É mais que o DOBRO do que ele
      publicou, na população que de fato vira citação.**
  modo_de_falha_reproduzido_com_dado_real:
    mensagem: "`\"Esse mesmo \\nvamos deixar pra segunda.\"` — mensagem REAL de produção, `role='user'`"
    sem_achatamento: |
      INTERESSE:
      ...
      - Disponibilidade para visita: "Esse mesmo
      vamos deixar pra segunda." (dia 2026-08-18) - nas palavras do lead, nao e visita marcada
    com_achatamento: |
      - Disponibilidade para visita: "Esse mesmo vamos deixar pra segunda." (dia 2026-08-18) - nas palavras do lead, nao e visita marcada
    pior_caso_que_ele_nao_mediu: >
      🔴 Com `\n\n` na citação (e mensagens assim EXISTEM em produção — medi), o resumo ganha uma
      **linha em branco DENTRO do bloco `INTERESSE:`** — e a linha em branco é o **separador de bloco**
      deste formato. Reproduzi: o bloco `INTERESSE:` fica truncado e o resto da citação vira um bloco
      órfão sem cabeçalho. Não é uma linha a mais: é **quebra estrutural**. E ela se propaga, porque o
      `ai_summary` volta ao prompt da Nicole (`loader.ts:196-203`, Risco 3).
    conclusao: >
      É exatamente o *"resumo malformado"* do **gatilho (a) de rollback desta própria story**.
      Achatar é trabalho do formatador. **Dentro de escopo:** o achatamento vive apenas dentro de
      `formatDisponibilidade`, a única linha que esta story cria; o bloco `MENSAGENS DO LEAD` não foi
      tocado (comportamento anterior, Achado nº 8, corretamente cortado); e o dado gravado continua
      íntegro para auditoria.
  o_par_ouro_e_robusto_ou_e_sorte:
    veredito: "🟢 **ROBUSTO, e verificado — não aceito no relato.**"
    provas:
      - "`\"Terça\"` e `\"3ª feira às 17:30\"`: nenhuma sequência de 2+ espaços, nenhum `\\n`, nenhuma borda — o achatamento é IDENTIDADE nas duas. Conferido no valor de produção, não na fixture."
      - "As bordas: **0 de 1876** mensagens `role='user'` têm espaço nas bordas, então o `.trim()` é inerte na população inteira. Não há caso vivo em que ele mude alguma coisa."
      - "M6 (remover o achatamento) deixa **o par-ouro verde** e derruba **só** o `it` multilinha: as duas provas são independentes por construção, não por coincidência de fixture."
    ressalva_menor: >
      Para os ~8 % de citações com espaço irregular, o corretor lê um texto **normalizado** sob um
      rótulo que diz *"nas palavras do lead"*. É estritamente melhor que um bloco quebrado, o dado
      cru fica no banco, e não vale mudança — mas fica registrado.

