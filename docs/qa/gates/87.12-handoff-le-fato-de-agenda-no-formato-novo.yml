      prova: >
        `raw` vem de `collected_data[AGENDA_STATE_KEY]`, que é JSON parseado. Um array JSON só tem
        índices numéricos, logo `o.citacao` é sempre `undefined`, logo
        `typeof o.citacao !== "string"` já devolve `null` na guarda seguinte. **Não existe entrada
        alcançável que distinga as duas versões.** É redundância defensiva legítima. **NÃO conta
        como sub-expressão órfã.**
    - id: M12
      o_que: "🔬 remover SÓ o `.trim()` do achatamento em `formatDisponibilidade` (a vizinha do `.replace`)"
      eu_medi: "2418 verdes, zero vermelhos"
      classificacao: "🟡 **NÃO é equivalente, mas é INERTE — e o @dev DECLAROU isso no código, com o número.**"
      prova: >
        `replace(/\\s+/g," ")` colapsa a borda em UM espaço, então o `.trim()` ainda muda a saída
