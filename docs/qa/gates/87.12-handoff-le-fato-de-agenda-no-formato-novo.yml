    isolamento_por_sitio_primeiro:
      pergunta: "`parseAgendaState` tem três chamadores. Alguma mutação acende vários sítios de uma vez e mascara um sem cobertura?"
      metodo: "mutei o **SÍTIO DE CHAMADA**, não o helper — cada chamador perde a regra de admissão, um de cada vez"
      medicoes:
        - { id: M8, sitio: "`formatDisponibilidade` (handoff) — `parseAgendaState(cd[KEY])` → cast permissivo", eu_medi: "**2 vermelhos**, ambos em `handoff.test.ts`: `AC3 (fail-closed)` + `AC3 (fail-closed/ÂNCORA)`" }
