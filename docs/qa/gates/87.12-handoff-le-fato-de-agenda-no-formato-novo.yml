        - { id: M10, sitio: "`readAgendaState` (pipeline)", eu_medi: "**3 vermelhos** em `agenda-state.test.ts`: 2× `fonte` + `data_absoluta fora de YYYY-MM-DD`" }
      veredito: >
        🟢 **Os TRÊS sítios têm cobertura própria, em arquivos distintos.** É o **oposto** da 87-11:
        aqui nenhum sítio se esconde atrás de outro. **Registro a diferença de mecanismo para que
        ninguém cole o rótulo da A6 num achado que não é dela.**
    onde_o_buraco_estava_de_verdade: >
      🔴 Dentro do helper, **entre as sub-expressões da mesma linha**. A guarda de âncora é uma
      **disjunção** `if (A || B) return null`, e as **duas** fixtures do `it` novo fazem **A e B
      verdadeiros ao mesmo tempo**: `semAncora = { citacao, origem, fonte }` não tem `ancorado_em`
      **nem** `expira_em`; `ancoraNaoString = { ...AGENDA_RITA, ancorado_em: <número>, expira_em:
      <número> }` tem os **dois** como número. Com `A || B` sempre duplamente verdadeiro, apagar
      **uma** das metades deixa a outra segurando o caso — e o teste fica **verde**.
    tabela_das_mutacoes:
      - { id: M7,  o_que: "guarda de âncora INTEIRA removida",                                   vitest: "**1 vermelho**",           tsc: "2× TS2322", leitura: "✅ é o vermelho que a story publica — e ele é real" }
      - { id: M7a, o_que: "🔬 SÓ a metade `typeof o.ancorado_em !== \"string\"` removida",           vitest: "🔴 **2418 verdes, ZERO**", tsc: "1× TS2322", leitura: "órfã DE TESTE; o compilador ainda pega" }
      - { id: M7b, o_que: "🔬 SÓ a metade `typeof o.expira_em !== \"string\"` removida",             vitest: "🔴 **2418 verdes, ZERO**", tsc: "1× TS2322", leitura: "órfã DE TESTE; o compilador ainda pega" }
      - { id: M7c, o_que: "🔬 SÓ `ancorado_em` ENFRAQUECIDO — aceita número e coage p/ `string`",  vitest: "🔴 **2418 verdes, ZERO**", tsc: "🔴 **0 erros**", leitura: "🔴 **sobrevive às DUAS redes**" }
      - { id: M7d, o_que: "🔬 SÓ `expira_em` ENFRAQUECIDO — aceita número e coage p/ `string`",    vitest: "🔴 **2418 verdes, ZERO**", tsc: "🔴 **0 erros**", leitura: "🔴 **sobrevive às DUAS redes, e tem consequência provada**" }
      - { id: M11, o_que: "🔬 SÓ a metade `typeof o.citacao !== \"string\"` ENFRAQUECIDA (a IRMÃ do `!o.citacao.trim()`, que TEM vermelho)", vitest: "🔴 **2418 verdes, ZERO**", tsc: "🔴 **0 erros**", leitura: "🔴 nenhuma fixture da suíte inteira passa `citacao` não-`string`" }
    consequencia_provada_nao_conjecturada: >
      🔴 Sob **M7d** (suíte verde, `tsc` 0), rodei `generateHandoffSummary` com
      `{ agenda_state: { citacao: "Terça", origem: "lead", …, ancorado_em: "2026-08-15T12:20:47.409Z",
      expira_em: 1755431847409 } }` e a saída é:
      `- Disponibilidade para visita: "Terça" (dia 2026-08-18) - nas palavras do lead, nao e visita marcada`.
      **Um estado sem validade legível vai ao corretor.** E é exatamente a assimetria que o docstring
      do próprio @dev nomeia: por `readAgendaState`, `Date.parse("1755431847409")` → `NaN` →
      `isAgendaStateExpired` → `true` → `null`, **mascarado**; no `handoff`, que é o **único chamador
      sem TTL a jusante**, não há máscara. O modo de falha do QA-3 do R1 sobrevive em forma mais fina.
    a_contagem_certa: >
      Não é *"3 guardas, 3 vermelhos"*. É **6 sub-expressões, 3 com vermelho próprio**:
      `typeof citacao !== "string"` ❌ (M11) · `!citacao.trim()` ✅ (M5b, R1) ·
      `origem !== "lead"` ✅ (M5, R1) · `typeof ancorado_em !== "string"` ❌ (M7a/M7c) ·
      `typeof expira_em !== "string"` ❌ (M7b/M7d) · **a âncora como PAR** ✅ (M7).
      A tabela da story **não mente** — ela mede a guarda, e a guarda passou de 0 para 1. Esta é uma
      camada abaixo dela.
    conserto: >
      **Três linhas de fixture, zero linhas de produção.** Dissociar o que hoje vem colado:
      trocar o `ancoraNaoString` (que tem os dois como número) por **dois** objetos —
      `{ ...AGENDA_RITA, ancorado_em: 123 }` e `{ ...AGENDA_RITA, expira_em: 123 }` — e acrescentar
      `{ ...AGENDA_RITA, citacao: 123 }`. Aí cada metade ganha vermelho próprio.

