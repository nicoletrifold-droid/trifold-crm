decisao:
  gate: CONCERNS
  deploy_do_bloco_A: AUTORIZADO
  justificativa: >
    Nenhuma das quatro ressalvas é defeito de comportamento. O código está correto, os testes
    discriminam de verdade (16 mutações minhas, com controles nos dois sentidos onde importa), as
    redes de não-regressão são vivas e provadas, a superfície pública não mudou, o score não se move,
    e o desvio deliberado do desenho é a decisão certa com o número a favor — mais a favor do que o
    @dev mediu. **O que puxa para CONCERNS é evidência e documentação:** um vermelho publicado com o
    número errado (QA-1), um achado subcontado (QA-2), uma guarda que segue sem vermelho de teste
    (QA-3) e três ponteiros errados num docstring que vai para produção (QA-4).
