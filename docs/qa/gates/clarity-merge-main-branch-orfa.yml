top_issues:
  - id: OPS-001
    severity: medium
    category: deployment
    finding: >
      O AC5b manda publicar o vind-residence "a partir do mesmo checkout limpo pós-merge",
      mas a tabela "Convenção de Deploy" afirma "(projeto já linkado via
      .vercel/project.json)". As duas frases se contradizem: .vercel É GITIGNORED nos DOIS
      projetos (landing-pages/vind-residence/.gitignore:1 e
      landing-pages/trifold-design-system/.gitignore:16), logo um checkout limpo de main
      NÃO tem vínculo nenhum. Confirmado: o worktree desta story não tem
      landing-pages/vind-residence/.vercel/project.json (só a checkout principal tem).
      Os dois alvos falham de formas OPOSTAS:
        - trifold-design-system falha FECHADO: deploy.sh passo 1 aborta com o remédio
          exato ("rode: vercel link --yes --scope ... --project trifold-design-system").
          Protegido.
        - vind-residence falha ABERTO: `vercel deploy --prod --yes` sem vínculo CRIA UM
          PROJETO NOVO com o nome da pasta — exatamente o modo de falha que o comentário
          do próprio deploy.sh documenta como "achado QA-1". Resultado: um projeto Vercel
          órfão, vind-residence.vercel.app NUNCA republicado, e /vindresidence/ seguindo
          200 pelo proxy — o erro passa em silêncio, que é o mesmo modo de falha que
          originou esta story.
    suggested_action: >
      @devops, ANTES do AC5b: rodar `vercel link --yes --scope trifold-s-projects
      --project vind-residence` dentro de landing-pages/vind-residence/, OU confirmar que
      .vercel/project.json existe com projectName "vind-residence" e projectId
      prj_bSyrklkya14GAfeXdOlUXdyntqWp. Depois do deploy, conferir que a URL do
      deployment resolve DENTRO do projeto vind-residence (npx vercel ls), não num projeto
      novo. Mesma conferência vale para o passo 4a se o checkout for realmente limpo.

  - id: TEST-002
    severity: low
    category: tests
    finding: >
      O Dev Record afirma que landing-pages está fora do escopo do CI "por construção".
      Verdade para lint e type-check, FALSO para test: vitest.config.ts inclui
      explicitamente "landing-pages/**/*.test.ts" (linha adicionada pela Story 86-11 para
      as funções serverless do vind-residence), e ci.yml roda `pnpm test`. Ou seja, existe
      um gate de CI que alcança landing-pages/ e que o @dev declarou inexistente.
      Eu rodei: `npx vitest run landing-pages/` no worktree => 3 arquivos, 64 testes,
      todos passando (nenhum import de @trifold/*, logo sem patologia de symlink de
      worktree). O gate está VERDE — a claim estava errada, o resultado está certo.
      Nota de cobertura (pré-existente, não introduzida aqui): nenhum teste lê
      landing-pages/vind-residence/index.html. O yarden tem contrato estático sobre o seu
      index.html (tracking-browser.test.ts), o vind-residence não — então o snippet novo
      ali não tem cobertura automatizada.
    suggested_action: >
      Nenhuma ação de código. Corrigir a afirmação no Dev Record numa próxima passada e,
      se quiser fechar a assimetria, abrir story separada para um contrato estático do
      vind-residence/index.html (fora de escopo aqui).

  - id: TEST-001
    severity: low
    category: tests
    finding: >
      Ponto cego no assert de não-regressão do Yarden (contraprova B, minha). O assert só
      inspeciona blocos cujo `source` começa com "/yarden". Mutei o negative-lookahead do
      catch-all de "/((?!vindresidence|yarden).*)" para "/((?!vindresidence).*)" — o
      catch-all passa a capturar /yarden/* e a servir a CSP COM clarity — e o assert
      continuou VERDE (exit 0). Ele é mais estreito que a propriedade que promete garantir
      ("Yarden não ganha Clarity").
      NÃO é defeito deste PR: provado que nenhuma linha "source" mudou no diff
      (git diff origin/main HEAD -- vercel.json | grep '^[+-].*"source"' => vazio) e a CSP
      ao vivo de /yarden/ segue sem clarity.
    suggested_action: >
      Ao reusar este assert em stories futuras, acrescentar a checagem do lookahead:
      afirmar que o source do catch-all contém "yarden" na exclusão, ou avaliar a CSP
      efetiva por rota (casar /yarden/x contra todos os sources) em vez de por prefixo de
      source. Hardening do assert, não bloqueia este merge.

  - id: DOC-001
    severity: low
    category: docs
    finding: >
      Duas imprecisões factuais nas Completion Notes sobre o escopo do CI:
      (a) "landing-pages/vind-residence/package.json tem scripts: {}" — não tem: o arquivo
          não tem chave scripts nenhuma (só name/private/version/engines). A conclusão não
          muda (sem chave = sem script lint/type-check, e a pasta nem é membro do workspace).
      (b) "o ci.yml, que roda exatamente esses dois" — o ci.yml roda TRÊS gates turbo
          (type-check, lint E test) mais um quarto job (tenancy-gate, não-bloqueante).
          É o "test" omitido que gera o TEST-002.
      Terceira, menor: a nota lista h.clarity.ms/f.clarity.ms como os hosts de connect-src;
      o tag script hoje referencia i.clarity.ms. Todos subdomínios, conclusão inalterada.
    suggested_action: "Corrigir as três frases numa próxima passada no Dev Record. Sem impacto no artefato."

  - id: DOC-002
    severity: low
    category: docs
    finding: >
      O script que aplicou o token de CSP não foi commitado nem consta no File List, então
      as garantias que o Dev Record credita a ele ("aborta se o valor de origem não for o
      esperado, se /vindresidence* não aparecer 3x, se já contiver clarity") não são
      auditáveis nem re-executáveis por terceiros. Não importa para esta story porque eu
      verifiquei o ARTEFATO diretamente (blob == ponta órfã, 7/7 literais), mas fica
      registrado como afirmação não verificável.
      Correção de raciocínio: a justificativa "colar o literal reverteria em silêncio
      qualquer evolução futura de CSP em main" superestima o script. Com abort duro em
      qualquer divergência do valor de origem, ele NÃO se adapta a uma CSP evoluída — ele
      se recusa a rodar. O benefício é DETECÇÃO (fail-closed), não PRESERVAÇÃO. Fail-closed
      é de fato mais seguro que a colagem silenciosa do literal, então a decisão está
      correta; só a razão dada está errada.
    suggested_action: >
      Se a técnica for reusada, versionar o script em scripts/ para virar gate reexecutável;
      caso contrário, ajustar a redação da nota. Nenhuma ação nesta story.

  - id: DOC-003
    severity: low
    category: deployment
    finding: >
      Heads-up para o @devops, não é defeito desta story. `pnpm deploy:check`
      (scripts/check-deploy-drift.sh) é escopado no .vercel/project.json da RAIZ (projeto
      trifold-crm) e exige vínculo GitHub — não cobre nenhuma das duas landing pages. Pior:
      seu afeta_app() só trata docs/, .claude/, scripts/, *.md e *.sql como sem-impacto,
      então landing-pages/** conta como "app". Depois deste merge o deploy:check pode
      acusar DIVERGÊNCIA no projeto do CRM citando arquivos de landing-pages que o CRM não
      serve. NÃO rodar `--fix` com base nesse sinal.
    suggested_action: "Informativo. Se incomodar, abrir story para acrescentar landing-pages/ ao SEM_IMPACTO do script."

