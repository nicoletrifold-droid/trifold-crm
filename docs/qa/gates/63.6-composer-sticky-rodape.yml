  verificado por git grep: ZERO tel:/wa.me/api.whatsapp.com/whatsapp:// nos 2 arquivos
  tocados. Sem invadir 63-5 (unificação) nem 63-7 (sheet). Suíte completa 414/414;
  ESLint 0 nos arquivos da story; type-check 0 nos arquivos da story. Concerns todos
  LOW e documentados (test do wrapper, heurística 8rem, scroll interino pré-63-7).
