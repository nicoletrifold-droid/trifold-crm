issues:
  - id: TEST-001
    severity: low
    category: tests
    finding: >
      chat-scroll-area.tsx (componente novo) sem teste unitário. Repo não tem infra
      de teste de componente React e o comportamento de scroll é layout-dependente
      (não testável em node). Consistente com o padrão do Epic 63 (só helpers puros
      têm teste).
    suggested_action: >
      Não-bloqueante. Se infra de teste de componente for introduzida (jsdom +
      @testing-library), cobrir o contrato auto/smooth e scroll em mudança de
      messageCount.
    suggested_owner: dev
  - id: LAYOUT-001
    severity: low
    category: code
    finding: >
      h-[calc(100dvh-8rem)] usa 8rem como buffer heurístico, não derivado das alturas
      reais de header/nav. Como o painel está in-flow (não fixed) e a clearance da
      bottom nav vem do pb-24 do layout, o valor não é crítico — pior caso é o painel
      ligeiramente mais alto/baixo, nunca esconde o compositor.
    suggested_action: >
      Não-bloqueante. Revisar o cálculo de altura quando 63-5 (unificação) e 63-7
      (remoção do form) reestruturarem a tela.
    suggested_owner: dev
  - id: SCOPE-001
    severity: low
    category: requirements
    finding: >
      No mobile, LeadEditForm + cards permanecem ACIMA do painel de chat até a 63-7,
      então o corretor ainda rola a PÁGINA até chegar ao painel. A aspiração da User
      Story ("sem rolar para baixo de um formulário enorme") só é plenamente atendida
      com 63-7. Os ACs testáveis da 63-6 (que NÃO exigem remover o form — Out of Scope
      L203) estão 100% atendidos. @po já validou esse split (GO 8/10).
    suggested_action: >
      Não-bloqueante e por design (faseamento do epic). Concluir 63-7 (sheet de
      detalhes) para entregar a experiência completa.
    suggested_owner: dev

