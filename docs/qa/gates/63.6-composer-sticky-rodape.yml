quality_checks:
  - check: "1. Requirements Traceability"
    status: PASS
    note: >
      AC1 (page.tsx:221 min-h-0 flex-1 overflow-y-auto, max-h-96 removido; empty-state
      L275 idem), AC2 (compositor fora da ChatScrollArea em <div shrink-0> L281), AC3
      (pb-[max(1rem,env(safe-area-inset-bottom))] L281 + clearance pb-24 do broker/
      layout.tsx:44 acima da nav fixa sidebar-nav.tsx:145), AC4 (lg:h-[34rem] desktop
      não ocupa tela inteira; h-[calc(100dvh-8rem)] mobile — L212), AC5 (chat-scroll-
      area.tsx scrollTo no container, auto no mount / smooth em messageCount), AC6
      (type-check/ESLint limpos, sem regressão de envio).
  - check: "2. Code Quality & Standards"
    status: PASS
    note: >
      min-h-0 corretamente aplicado p/ permitir shrink do flex child e scroll real
      (sem ele, flex-1 não rola em flex-col). overflow-hidden no painel contém o
      scroll interno. Wrapper client mínimo (47 linhas), JSDoc explicando a escolha
      de rolar só o container. Imports absolutos @web/*. Server/client bem separados.
  - check: "3. Test Architecture"
    status: CONCERNS
    note: >
      chat-scroll-area.tsx (componente novo) sem teste unitário. Repo NÃO possui infra
      de teste de componente React (sem @testing-library, jsdom, vitest env dom; zero
      .test.tsx no monorepo) — padrão do projeto testa apenas helpers puros. Behavior
      de auto-scroll é layout-dependente (scrollHeight), não unit-testável em node sem
      nova stack. TEST-001 LOW advisory. Suíte completa 414/414 sem regressão.
  - check: "4. No Regressions"
    status: PASS
    note: >
      Envio (BrokerMessageInput), WindowStatusBadge e disabledByWindow intactos —
      page passa as mesmas props (leadId, disabledByWindow={windowClosed}). router.
      refresh() preservado; messageCount muda → auto-scroll. CON-3 (is_ai_active/
      takeover) não tocado. Suíte 414/414.
  - check: "5. Performance / Mobile-PWA"
    status: PASS
    note: >
      100dvh (não 100vh) é a escolha correta p/ mobile — exclui barra de endereços
      retrátil (gotcha da story respeitado). Nenhuma query adicional ao banco (mesma
      busca de messages/conversations). Auto-scroll via scrollTo no container, sem
      jank de window.
  - check: "6. Security (CON-1)"
    status: PASS
    note: >
      git grep -nE 'tel:|wa.me|api.whatsapp.com|whatsapp://|click-to-call' HEAD nos 2
      arquivos tocados → ZERO ocorrências. Contato com o lead permanece exclusivo do
      chat interno (dispatch oficial Epic 51). CON-2/CON-3 respeitados.
  - check: "7. Documentation"
    status: PASS
    note: >
      Dev Notes/Completion Notes honestas sobre escopo (form acima do chat até 63-7;
      var --header-height inexistente não inventada). Comentário no painel (page L203-
      211) explica a estrutura flex e o mapeamento dos ACs.

