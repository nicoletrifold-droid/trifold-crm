gate_decision:
  verdict: PASS
  rationale: >
    Os 6 ACs estão atendidos por código. CON-1 inviolável limpo; sem regressão (414/
    414); ESLint e type-check limpos nos arquivos da story; mobile/PWA correto (100dvh,
    safe-area, clearance da nav via pb-24); auto-scroll rola só o container (sem
    page-jump). As 3 issues são todas LOW e documentadas: ausência de teste do wrapper
    (sem infra de teste de componente no repo — padrão do projeto), heurística 8rem
    (não-crítica, in-flow), e scroll interino da página até a 63-7 (por design do
    faseamento; ACs da 63-6 não exigem remover o form). Recomendação: LIBERAR para
    @devops *push — pode entrar no PR #14.
