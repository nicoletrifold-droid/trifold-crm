issues:
  - id: PERF-001
    severity: low
    category: performance
    finding: >
      O badge no card (LeadWindowBadge) e o sort (sortByWindowUrgency(leads))
      chamam getWindowStatus sem injetar `now`, usando new Date() no render do
      client component. Snapshot de momento — não há countdown ao vivo na lista.
    suggested_action: >
      Não-bloqueante. Aceitável sob GR-3 do epic (tolerância ±1min; estático no
      load conforme Out of Scope da story). Live-refresh é débito futuro se exigido.
    suggested_owner: dev
  - id: A11Y-001
    severity: low
    category: code
    finding: >
      O ícone Clock do toggle de ordenação não tem aria-hidden; o texto visível
      "Janela fechando primeiro" já é lido por leitor de tela. O dot do badge tem
      aria-hidden e o texto ("Aberta/Fechando/Fechada") é acessível.
    suggested_action: >
      Não-bloqueante. Adicionar aria-hidden ao Clock decorativo se padronizar
      ícones decorativos.
    suggested_owner: dev
  - id: SCOPE-001
    severity: low
    category: requirements
    finding: >
      Badge exibido apenas no card mobile (desktop table sem badge) — por design
      (Out of Scope da story, @po validou GO 8/10). Desktop recebe apenas o sort.
    suggested_action: "Não-bloqueante. Adicionar badge à tabela desktop em follow-up se desejado."
    suggested_owner: sm

