gate_decision:
  verdict: PASS
  rationale: >
    Os 6 ACs estão atendidos por código. A query usa um único embed (sem N+1), a
    seleção da conversa mais recente é robusta (array/objeto/null/ts inválido), e a
    ordenação trata corretamente os boundaries (open/closing por remainingMs asc;
    closed/sem-janela ao final via +Infinity; comparador evita NaN). Os 12 testes
    cobrem esses casos. CON-1 limpo; CON-3 intocado; filtros e contadores
    preservados; suíte 431/431; lint e type-check limpos nos arquivos da story (o
    erro em page.tsx L90 é pré-existente, comprovado por git blame). As 3 issues
    são todas LOW (snapshot de janela sem live-refresh, ícone Clock sem aria-hidden,
    badge só mobile — todas por design/aceitas). Recomendação: LIBERAR para
    @devops *push.
  next_steps:
    - "@devops *push (branch feat/epic-51-handoff-chat-corretor) — commit f4fd35b."
    - "Smoke pós-deploy: cards WhatsApp exibem badge colorido, cards Telegram sem badge; ativar 'Janela fechando primeiro' → leads com menos tempo restante no topo."
