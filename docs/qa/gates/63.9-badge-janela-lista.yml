story: "63.9"
title: "Badge de Janela de 24h na Lista de Leads"
epic: 63
gate: PASS
verdict: PASS
status_reason: >
  AC1-AC6 atendidos por código. Query da lista estendida com UM embed
  `conversations(last_message_at)` (LEFT JOIN único do PostgREST — sem N+1);
  a conversa mais recente é reduzida em JS pelo helper puro `selectLatestMessageAt`
  (robusto a array/objeto/null/timestamp inválido). `LeadWindowBadge` reutiliza
  `getWindowStatus` (63-4) e retorna null p/ Telegram (AC2); badge compacto
  text-[11px] + dot colorido no card mobile (AC3). Toggle `aria-pressed` (≥44px)
  ordena via `sortByWindowUrgency` — open/closing por menor remainingMs, closed
  e sem-janela ao final (+Infinity), comparador evita NaN de Infinity-Infinity
  (AC4). 12 testes cobrem os boundaries. CON-1 INVIOLÁVEL: git grep ZERO
  ocorrências. CON-3 (is_ai_active) intocado. Filtros/contadores de page.tsx
  preservados (embed só adiciona um campo ao select). Suíte completa 431/431
  (33 arquivos); ESLint 0 nos arquivos da story; type-check 0 nos arquivos da
  story. O erro ESLint em page.tsx L90 (Date.now impure) é PRÉ-EXISTENTE
  (git blame: Marcos, commit 1615ae9b, 2026-06-03 — linha intocada pela 63-9).
reviewer: "Quinn (@qa)"
reviewedAt: "2026-06-18"
updated: "2026-06-18T22:12:00Z"
iteration: 1
quality_score: 94
waiver: { active: false }

quality_checks:
  - check: "1. Requirements Traceability"
    status: PASS
    note: >
      AC1 (LeadWindowBadge usa getWindowStatus + WINDOW_BADGE verde/âmbar/cinza,
      renderizado no card mobile), AC2 (isWhatsApp = !phone.startsWith('tg:') →
      return null p/ Telegram), AC3 (text-[11px] + dot 1.5w, canto do card sem
      poluir), AC4 (toggle sortByWindow + sortByWindowUrgency aplicado a mobile e
      desktop via displayedLeads), AC5 (embed conversations(last_message_at) único
      + selectLatestMessageAt em JS), AC6 (type-check/ESLint limpos nos arquivos).
  - check: "2. Code Quality & Standards"
    status: PASS
    note: >
      Helpers puros isolados em leads-window.ts com JSDoc justificando a escolha
      de reduzir em JS (em vez de order/limit aninhado frágil do PostgREST).
      Imports absolutos @web/*. selectLatestMessageAt normaliza array/objeto e
      ignora timestamps não-finitos. sortByWindowUrgency não muta o array (spread).
  - check: "3. Test Architecture"
    status: PASS
    note: >
      12 testes (leads-window.test.ts) com `now` injetado (determinístico):
      selectLatestMessageAt — null/undefined, array vazio, único array, único
      objeto, múltiplas→mais recente, ignora null/sem-ts (6); windowUrgencyKey —
      closed→+Inf, sem-histórico→+Inf, open→remainingMs, Telegram→+Inf (4);
      sortByWindowUrgency — ordenação por urgência + closed/telegram no final,
      não-mutação (2). Boundaries de Infinity e seleção do máximo cobertos.
  - check: "4. No Regressions"
    status: PASS
    note: >
      Embed só adiciona um campo ao SELECT existente; lógica de filtros/contadores
      de page.tsx inalterada (filter roda sobre `leads` antes do map que adiciona
      last_message_at). Desktop table recebe sort mas não o badge (Out of Scope,
      consistente). Suíte 431/431.
  - check: "5. Performance"
    status: PASS
    note: >
      UM embed LEFT JOIN (uma round-trip PostgREST) — sem N+1. selectLatestMessageAt
      é O(n) sobre conversas do lead, síncrono e leve. NFR-4 não se aplica (Fase 3
      permite query nova; @po confirmou). getWindowStatus é comparação de datas.
  - check: "6. Security (CON-1)"
    status: PASS
    note: >
      git grep -nE 'tel:|wa.me|api.whatsapp.com|whatsapp://|click-to-call' HEAD nos
      arquivos tocados → ZERO (exit 1). CON-3: is_ai_active não tocado. Sem nova
      superfície de dados sensíveis (last_message_at já é interno).
  - check: "7. Documentation"
    status: PASS
    note: >
      Completion Notes honestas sobre a escolha de JS-reduce vs PostgREST order,
      badge só mobile (escopo), filtros preservados. Comentários no embed e no map
      de page.tsx explicam o motivo do LEFT JOIN único.

