escopo: >
  Três defeitos independentes reportados pelo Marcos em 18/08 sobre a aba Formulários. O de maior
  alcance NÃO é o da tela: é a regra de etapa após agendar visita, que a story reescreve no
  `shared` e que vale para os QUATRO pontos de agendamento do produto (formulário público, link da
  imobiliária, agenda do CRM e Nicole no WhatsApp).

resumo: >
  **O código aguenta, e a parte crítica está coberta por mutação.** Apliquei nove mutações — cada
  uma com aplicar · rodar · reverter · conferir md5 — e as sete que incidem sobre comportamento
  coberto produzem vermelho: allowlist restaurada derruba 20 testes, payload sem limpar
  `lost_reason` derruba 4, activity de reativação suprimida derruba 2, "reativado" sem o guard
  local derruba 1, origem não sobrescrita derruba 2, UTM sobrescrita sem UTM na visita derruba 1.
  Os md5 dos três arquivos de produção voltaram idênticos aos originais — nenhuma linha mudou
  durante o gate.

  **Duas mutações NÃO mordiam** e eu tratei cada uma no seu tamanho. A da aba (AC1) eu fechei
  criando `campaigns-tabs.contract.test.ts`: essa regressão exata já aconteceu duas vezes — por
  cópia antes da 75-333 e por valor fixo NA própria 75-333 (4f66fc96) — e o teste novo morde os dois sintomas (aba escondida
  por `false` literal e barra ausente numa das quatro telas). A da Nicole (activity de reativação no
  pipeline `ai`) fica como dívida declarada: o comportamento crítico dela — a mudança de etapa — é o
  mesmo guard do `shared`, que tem cobertura; o que está sem teste são seis linhas de trilha.

  **O que sustenta o CONCERNS não é o código: é um efeito que o usuário ainda não sabe que
  comprou.** Sobrescrever `source` altera a atribuição de origem nos relatórios, não só na ficha —
  Analytics agrupa por `leads.source` no estado ATUAL do lead. Ver C1.

status_reason: >
  Liberado para merge. Duas ações antes do push (A1) e duas pendências que não bloqueiam (C1, C2).

