concerns:
  - id: C1
    severidade: MEDIUM
    tipo: impacto-de-negócio-não-declarado
    titulo: "A origem do último contato reescreve a atribuição histórica em Analytics"
    detalhe: >
      `analytics-report-data.ts:134` agrupa por `l.source` — a coluna atual do lead, não um snapshot
      do momento da entrada. Consequência: um lead que entrou por "website" em junho e preenche o
      formulário em agosto passa a contar como `form_qualificacao` TAMBÉM no recorte de junho. O
      pedido do Marcos ("a origem tem que ser o último local") é inequívoco e a story o cumpre; o
      que falta é ele saber que o relatório de origem muda junto. `metadata.origem_anterior` e a
      activity `lead_source_updated` preservam o rastro por lead, mas nenhum relatório os lê.
      Encaminhamento: avisar o Marcos. Se a atribuição histórica importar, é story própria
      (`lead_source_history` ou snapshot em `leads.source_original`) — não emenda aqui.
  - id: C2
    severidade: MEDIUM
    tipo: dívida-de-teste
    titulo: "Activity de reativação da Nicole sem cobertura"
    detalhe: >
      Mutação M7 (suprimir o `if (!stageErr && estavaPerdido)` em `pipeline.ts`) passa com 756
      testes verdes. O `pipeline-scheduling.test.ts` não tem cenário de lead em Perdido; montar um
      custa caro no setup daquele arquivo. Risco aceito: a etapa em si (o que o Marcos pediu) é o
      guard do `shared`, coberto por 18 casos.
  - id: C3
    severidade: LOW
    tipo: precisão-de-comentário
    titulo: "O comentário do PERDIDO_STAGE_IDS sugere unificação completa"
    detalhe: >
      O texto em `shared/constants/stages.ts` diz que os UUIDs "viviam copiados" em quatro lugares.
      A story unificou `web/lib/leads/stage-filters` e deu ao pacote `ai` a fonte comum, mas as
      cópias seguem em `api/leads/[id]/tasks/route.ts`, `api/leads/[id]/notes/route.ts`,
      `api/leads/[id]/mark-lost/route.ts`, `api/cron/supremo-sync/route.ts` e
      `components/leads/lead-detail-drawer.tsx`. Nenhuma delas está errada hoje; o comentário é que
      dá a impressão de que não existem mais. Bônus encontrado no caminho: `tasks/route.ts:6`
      rotula o UUID `…008` como "Represamento" quando ele é **Perdido** — comentário errado
      pré-existente, fora do escopo desta story.
  - id: C4
    severidade: LOW
    tipo: tipagem
    titulo: "`admin as never` no helper"
    detalhe: >
      `advance-visita-agendada.ts` passa o `SupabaseClient` como `never` para casar com o tipo
      estrutural `StageAdvanceClient`. Funciona e é o preço de o `shared` não depender de
      supabase-js, mas o cast engoliria uma mudança de assinatura futura sem erro de compilação.

impactos_conhecidos_e_aceitos:
  - titulo: "Leads em `represamento` e `acao_muffato` agora avançam ao agendar visita"
    detalhe: >
      Efeito direto de trocar allowlist por blocklist. `represamento` é acervo e `acao_muffato` é
      coluna exclusiva da Trifold — um lead nelas sai da coluna ao marcar visita. É exatamente o que
      a decisão do diretor pede ("agendou visita → a etapa é Visita Agendada"), mas quem usa essas
      colunas como fila de trabalho vai ver o lead migrar.
  - titulo: "`lost_reason_grupo` é zerado na reativação"
    detalhe: >
      O lead reativado sai das métricas de motivo de perda (migration 213). É o mesmo
      comportamento da reativação MANUAL (`api/leads/[id]/reativar`), que também limpa os dois
      campos e guarda os anteriores na activity — consistente com o padrão existente, não novidade
      desta story.
  - titulo: "Trigger 124 já registra `stage_change`"
    detalhe: >
      A activity `lead_reactivated` não substitui nem duplica o registro de etapa: o trigger de
      banco grava `stage_change` sozinho em toda alteração de `leads.stage_id`. A nova activity
      acrescenta o MOTIVO, que o trigger não tem como saber.

