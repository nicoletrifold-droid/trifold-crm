      resultado: "1 failed / 16 passed"
      veredito: "MORDE (depois do contract test novo; sem ele, passava verde)"
    - id: M6
      mutacao: "hub da Nicole volta a filtrar por `user.role`"
      resultado: "1 failed / 16 passed"
      veredito: MORDE
  pos_gate: "mutações sobre commit; `git status` limpo (só o contract test novo, adicionado no gate)"
