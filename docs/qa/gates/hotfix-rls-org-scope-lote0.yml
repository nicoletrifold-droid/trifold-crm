not_verified:
  - "Sintaxe plpgsql dos 4 corpos convertidos não foi executada (sem postgres/docker local; criar em prod seria DDL). Mitigado pela aplicação em transação única: erro de parse aborta tudo, sem estado parcial."
  - "As 2 RPCs de escrita (roleta_pick_and_advance, seed_system_roles) não foram exercitadas — mutariam produção. Cobertas pelo smoke obrigatório da roleta pós-deploy."
  - "Formato de request.jwt.claims com as chaves sb_publishable_/sb_secret_ — irrespondível read-only (ver C2)."

deploy_order: "Código ANTES do banco. Código novo × banco antigo funciona (service-role sempre teve acesso); banco novo × código antigo quebra o Painel Saúde & Billing (revoke de authenticated nas 5 tabelas de custo)."

devops_runbook:
  - "1. Deploy do código na Vercel PRIMEIRO. Confirmar que /dashboard/sistema/billing e o detalhe de campanha respondem ANTES de tocar o banco."
  - "2. Aplicar a migration em UMA transação. `supabase db push` já envolve. Se for pela Management API, mandar o arquivo INTEIRO em um único POST /database/query — nunca fatiar por statement."
  - "3. NUNCA BEGIN; … ROLLBACK; na Management API para 'testar'. Autocommit por statement grava em prod sem volta."
  - "4. Rodar o bloco de verificação (linhas 807-879, descomentado) DEPOIS de aplicar. Esperado: ZERO linhas. Antes de aplicar ele retorna 25 — usar isso como controle positivo."
  - "5. Smoke com sessão real: /broker como corretor; /dashboard como gerente-comercial; /dashboard/configuracoes/corretores (coluna de leads ativos não pode zerar); /dashboard/sistema como admin (lista + semáforos de saúde); /dashboard/sistema/billing como admin (painel + lista + 1 editar + 1 excluir); detalhe de campanha incluindo com o usuário de perfil social-media (bloco ROAS preenchido)."
  - "6. Smoke OBRIGATÓRIO da roleta: distribuir 1 lead ponta a ponta. É a única função de ESCRITA com guarda nova e não foi exercitada em nenhum dos dois rounds."
  - "7. Re-rodar os probes anônimos: as 8 RPCs com a anon key devem virar 404/403; system_events, v_mensagens_admin e meta_campaign_roas devem virar 401/403 com a anon key; e meta_campaign_roas TAMBÉM com um JWT de usuário comum (é o teste específico do B2)."
  - "8. Se aplicar fora do CLI, registrar a versão em supabase_migrations.schema_migrations (prod usa timestamp, repo usa numérico — drift conhecido), senão um db push futuro reaplica."
  - "9. Se precisar reverter P1: NÃO executar o DROP FUNCTION da linha 1011 antes de remover as 8 chamadas PERFORM (ver C3). Reverter P3 NUNCA."

