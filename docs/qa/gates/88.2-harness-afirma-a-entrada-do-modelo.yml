    `vitest --reporter=json`, contagem de testes vermelhos por arquivo, reversão por cópia de
    backup e `git status --porcelain` conferido entre mutações. Controle nulo (comentário inócuo
    na mesma constante) = **0 vermelhos**, então o instrumento não conta ruído.
    Nenhuma constante compartilhada e nenhuma guarda inteira foi tocada.

  - id: M1a
    mutacao: "lerBloco → \"\""
    declarado: 29
    medido: 29
    status: CONFERE
    quebra_por_arquivo: "agenda-state 15 · entrada-do-modelo 4 · historico-cauda 4 · contrato 4 · scheduling 2 · nicole-enabled 0"
  - id: M1b
    mutacao: "lerSystem → \"\""
    declarado: 6
    medido: 6
    status: CONFERE
    quebra_por_arquivo: "nicole-enabled 2 · historico-cauda 2 · entrada-do-modelo 1 · contrato 1"
    nota: "Emenda E1 do @po confirmada nos DOIS sentidos: nicole-enabled dá 0 sob M1a e 2 sob M1b."
  - id: M1c
    mutacao: "lerHistorico → []"
    declarado: 11
    medido: 11
    status: CONFERE
    quebra_por_arquivo: "historico-cauda 9 · scheduling 1 · contrato 1"
  - id: M1d
    mutacao: "lerPapeis → []"
    declarado: 1
    medido: 1
    status: CONFERE
  - id: M2
    mutacao: "a fixture do José lê auxiliares()[0] no lugar de resposta()"
    declarado: 5
    medido: 5
    status: CONFERE
    nota: "Os 5 são TODOS em pipeline-entrada-do-modelo. O rótulo discrimina."
  - id: M3
    mutacao: "resposta() devolve a primeira em vez de estourar"
    declarado: 2
    medido: 2
    status: CONFERE
    testes: "AC2-(ii) duas candidatas · AC2-(ii-b) zero candidatas"
  - id: M4
    mutacao: "rótulo decidido por ORDEM (indice === 0)"
    declarado: 4
    medido: 6
    status: DIVERGENCIA_PUBLICADA_E_CONFIRMADA
    julgamento: >
      **A explicação fecha.** Os 6 vermelhos que eu medi são, com nome: AC1 "duas chamadas
      IDÊNTICAS", AC2-(ii), AC2-(ii-b), AC2-(iii), AC2-(iv) e AC4 "`respostas` serve uma por chamada
      DE TURNO". Os dois que ele não previu são **exatamente** os dois que ele nomeou no Dev Agent
      Record — o de zero chamadas de turno e o de `respostas` das Ondas 2–3. Publicar a divergência
      em vez de reescrever o esperado é o comportamento certo, e a divergência é para MAIS, que é a
      direção que não esconde nada.
  - id: M5
    mutacao: "a régua perde o `\\s+` (padrão vira literal com espaço único)"
    declarado: 2
    medido: 2
    status: CONFERE
    testes: "M5b (cast em duas linhas) · o caso de mistura"
  - id: M6a
    mutacao: "lerTools → undefined fixo"
    declarado: 1
    medido: 1
    status: CONFERE
    teste_vermelho: "AC3 … `tools` volta idêntico ao que entrou"
  - id: M6b
    mutacao: "lerToolChoice → undefined fixo"
    declarado: 1
    medido: 1
    status: CONFERE
    teste_vermelho: "AC3 … `tool_choice` volta idêntico ao que entrou — mesma referência"
    julgamento: >
      **A separação é real.** M6a e M6b acendem testes com NOMES DIFERENTES. Antes do ajuste dele os
      dois acessores viviam no mesmo caso e uma guarda ficava atrás da outra; agora cada uma tem
      vermelho próprio. Confirmado, não aceito de palavra.
  - id: ME
    mutacao: "Math.min(i, n-1) → respostas[i] ?? respostas[n-1]"
    declarado: 0
    medido: 0
    status: EQUIVALENTE_CONFIRMADO
    porque_medido: >
      Equivalente **sob o contrato de tipo**: para `RespostaDoFake[]` denso e não vazio, `Math.min`
      e o `??` concordam para todo i ≥ 0. Fronteira que ele não escreveu e eu escrevo: as duas
      expressões **divergem** para um array com elemento nullish (`["a", undefined, "c"]`, i=1 →
      `undefined` × `"c"`). O TS proíbe esse array, então a equivalência vale — mas vale POR TIPO,
      não por álgebra pura. Ver F-3 sobre a guarda em que o argumento se apoia.
  - id: CATRACA_ANTES_DAS_MIGRACOES
    declarado: "vermelha, 5 encontrados × 1 declarado"
    medido: "5 × 1"
    status: CONFERE
    metodo: >
