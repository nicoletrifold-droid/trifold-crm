# 2. Os cinco pontos de desconfiança do briefing — julgados um a um
# ════════════════════════════════════════════════════════════════════════
pontos_de_desconfianca:

  - ponto: "1 — A quarta camada da auto-régua (a classe que mordeu 4× esta semana)"
    veredito: RESISTIU_A_QUATRO_ATAQUES
    ataques:
      - id: B1
        o_que_fiz: "Injetei o padrão POR EXTENSO num COMENTÁRIO do próprio anthropic-harness.test.ts"
        resultado: >
          **2 vermelhos**: o caso AC7-vi ("a varredura NÃO devolve este arquivo") **e** a igualdade
          de conjunto. É a prova de que o caso AC7-vi **não é vácuo** — ele discrimina a grafia que
          a story diz proibir, inclusive dentro de comentário.
      - id: B2
        o_que_fiz: "Quebrei PEDACOS_DO_CAST (\"Anthropic\" → \"Anthropik\")"
        resultado: >
          **4 vermelhos**, entre eles o **controle de vivacidade** dentro do próprio AC7-vi. A
          fixture montada não pode deixar de ser um exemplo válido em silêncio.
      - id: B3
        o_que_fiz: "Alarguei a população de `.test.ts` para `.ts`"
        resultado: "**1 vermelho** (igualdade de conjunto) — puxa o `anthropic-harness.ts`, que é onde o cast mora. A exclusão estrutural é medida, não declarada."
      - id: B4
        o_que_fiz: "Tirei a recursão da varredura (não desce em `__fixtures__/`)"
        resultado: "**1 vermelho** — o caso \"a população contém este próprio arquivo\". A não-vacuidade tem guarda."
    instrumento_independente: >
      `git grep --untracked -lE 'as[[:space:]]+unknown[[:space:]]+as[[:space:]]+Anthropic'` em
      `packages/ai/src/chat/**` devolve **2** hits: `__fixtures__/anthropic-harness.ts` (fora da
      população por ESTRUTURA — não é `.test.ts`) e `pipeline-corretor-no-historico.test.ts` (a
      única exceção). Nenhuma linha do teste do harness transcreve o padrão.

  - ponto: "2 — EXCECOES_DECLARADAS = 1 entrada real, não 3"
    veredito: CONFIRMADO_E_E_O_DESENHO_CERTO
    evidencia: >
      A única entrada é `pipeline-corretor-no-historico.test.ts`, que **existe** e **tem** o cast
      (confirmado pelo `git grep` acima). Os outros dois arquivos (`pipeline-collected-data` do #428
      e `pipeline-ai-summary-no-prompt` da 87-16) **não existem nesta base** — declará-los faria a
      régua nascer satisfeita e esvaziaria o caso de igualdade, exatamente como ele escreveu.
      A recusa dele está certa.
    catraca_acende_nos_dois_sentidos:
      - "C1 — exceção apontando para arquivo inexistente: **2 vermelhos** (igualdade + o caso 'aponta para arquivo existente')"
      - "C2 — `dono` sem `88-2b`: **1 vermelho**"
      - "C3 — migrei a exceção (tirei o cast) e esqueci de tirar da lista: **1 vermelho**"
      - "SIMULAÇÃO DO MERGE — criei um 7º arquivo com fábrica ad-hoc: catraca vermelha, **nomeando o arquivo novo** no diff da asserção"
    nota: >
      A varredura lê o **DISCO**, não o índice do git — o arquivo que criei era untracked e a
      catraca o pegou. Isso é mais forte que o `git grep --untracked` que ele usou como segundo
      instrumento, e é bom que os dois concordem.

  - ponto: "3 — A fixture do José, e o 88-14 intocado"
    veredito: CONFIRMADO_POR_REPRODUCAO_INDEPENDENTE
    metodo: >
      Não usei o harness (seria circular). Escrevi um fake próprio que guarda todos os
      `MessageCreateParams` e roda `processMessageWithMetadata` contra `createFakeSupabase`, com
      relógio fixo por override de `Date`. Script criado e apagado; árvore limpa depois.
    medido:
      caso_1: "literal de produção → `Visita JÁ confirmada … às 10:00` · REMARCAR=false · 14:00=false · scheduled_at **13:00Z intacto**"
      caso_2: "+ `podemos remarcar?` → **instrução idêntica byte a byte** (`instrucao(1) === instrucao(2)` devolveu literalmente `true`) · scheduled_at **13:00Z intacto**"
      caso_3: "− ` justamente ás 10h` → `REMARCAR … para … 14:00. O novo horário está LIVRE` · scheduled_at **17:00Z**, 1 linha"
      caso_4: "`ás 10h` → `as 10` → `REMARCAR … 14:00` · scheduled_at **17:00Z**, 1 linha"
      chamadas_por_turno: "2 em todos os 4 casos — 1 com `system`, 1 sem. `resposta()` não estoura."
    os_4_discriminam: true
    derivacao_por_uma_substituicao: >
      Confirmado, e é melhor do que o pedido: os controles 3 e 4 são calculados **em runtime** a
      partir de `JOSE_LITERAL` por `.replace()`, não redigitados. Se alguém editar o literal e o
      trecho sumir, o `.replace` vira no-op, o caso 3 passa a ser o caso 1 e **fica vermelho** —
      falha alto em vez de concordar em silêncio.
    parseHour_intocado: >
      **Confirmado.** `git diff $(git merge-base origin/main HEAD)..HEAD -- packages/ai/src/chat/visit-slot.ts`
      devolve **vazio**. O `88-14` não foi antecipado.

  - ponto: "4 — O falso verde de nicole-enabled:251-255 vira controle (M2)"
    veredito: CONFIRMADO
    evidencia: >
      Apontar a asserção para `auxiliares()[0]` em vez de `resposta()` dá **5 vermelhos**, todos em
      `pipeline-entrada-do-modelo`, com nome: os 4 casos do José + o próprio caso M2. O comentário
      que documentava o modo de falha virou execução.

  - ponto: "5 — Nenhuma AC depende de total de chamadas"
    veredito: CONFIRMADO
    evidencia: >
      `git grep --untracked` de `captura.chamadas` em toda a população `chat/**/*.test.ts` devolve
      **11 ocorrências, todas em `anthropic-harness.test.ts`** — o teste de contrato, onde as
      chamadas são feitas DIRETAMENTE no fake, sem pipeline e sem fire-and-forget. Nenhum arquivo de
      turno afirma total. A emenda E4 do @po está honrada e a M7-proibida não foi violada.

