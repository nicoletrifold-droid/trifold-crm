# 4. ACHADOS QUE NINGUÉM PEDIU
# ════════════════════════════════════════════════════════════════════════
achados:

  - id: F-1
    severidade: MEDIA
    titulo: "O filtro `type === \"text\"` do acessor `bloco` é um predicado ÓRFÃO — e é o lado da entrada de que a Onda 3 depende"
    arquivo: "packages/ai/src/chat/__fixtures__/anthropic-harness.ts:186"
    medido: >
      Troquei `.filter((b) => b.type === "text")` por `.filter(() => true)` em `lerBloco`:
      **0 vermelhos na suíte inteira.** Nenhuma fixture de `chat/` põe um bloco não-`text` no
      conteúdo da ÚLTIMA mensagem. Confirmado por
      `git grep --untracked -nE 'tool_result|tool_use' -- 'packages/ai/src/chat/**/*.test.ts'`:
      as 3 ocorrências estão TODAS no lado da RESPOSTA (o caso da AC4).
    por_que_importa: >
      A assimetria é datada. A AC4 cobre o lado da **saída** — `tool_use` na posição 0 — exatamente
      para habilitar a 88-1. O lado da **entrada**, onde a Onda 3 vai devolver `tool_result` ao
      modelo dentro da mensagem, não tem caso nenhum. É esse filtro que decide se `bloco` continua
      significando "o texto que o modelo recebeu" ou passa a devolver `""` em silêncio no primeiro
      turno com tool. Um harness cuja razão de existir é a Onda 3 tem o predicado da Onda 3 sem rede.
    nao_bloqueia_porque: "Nenhuma AC pede isso e a 88-1 está FORA de escopo por escrito. O defeito só nasce quando o primeiro bloco não-`text` entrar numa mensagem — o que acontece dentro da 88-1."
    remedio: >
      Um caso no contrato com `content: [{ type: "tool_result", … }, { type: "text", text: "…" }]`
      na última mensagem, afirmando que `bloco` devolve só o texto. Custo: ~6 linhas.
    dono_sugerido: "@dev, dentro da 88-1 (é a story que cria a condição)"

  - id: F-2
    severidade: BAIXA
    titulo: "Dois ramos não-array sem vermelho: `lerSystem` e `lerBlocosDoSystem` com `system` string crua"
    medido: "`String(s)` → `\"\"` em lerSystem: **0 vermelhos**. Ramo não-array de lerBlocosDoSystem → `[]`: **0 vermelhos**."
    julgamento: >
      Hoje o `pipeline.ts` sempre manda `system` como array de blocos, então são ramos defensivos
      sem consumidor. Não escondem defeito atual; escondem regressão futura. Registro porque o
      harness declara esses ramos na interface pública.

  - id: F-3
    severidade: BAIXA
    titulo: "A guarda em que o argumento de equivalência do ME se apoia é ela mesma não medida"
    medido: >
      `lerMessages` fallback `: []` → `[{role,content}]`: **0 vermelhos**.
      `escolherResposta`, guarda `opts.respostas.length > 0` removida: **0 vermelhos**.
    julgamento: >
      O @dev justificou o ME dizendo "a guarda `length > 0` já está acima". A álgebra dele está
      certa e o ME é equivalente — mas a guarda que sustenta o argumento não tem caso. Se alguém
      passar `respostas: []`, hoje cai no `opts.resposta ?? RESPOSTA_PADRAO`; sem a guarda cairia em
      `respostas[-1]` → `undefined` → `{ type:"text", text: undefined }`, e nada acenderia.

  - id: F-4
    severidade: BAIXA
    titulo: "A MESMA classe que ele consertou em M6a/M6b sobrevive 40 linhas acima — ele parou no par que percebeu"
    medido: >
      M1c (`historico`), M1d (`papeis`), A5 (`cacheavel → false`) e A6 (`text dos blocos → \"\"`)
      acendem **exatamente o mesmo teste**: `AC1 … acessores derivados: historico, papeis, bloco e
      blocosDoSystem saem da mesma chamada`. Para `papeis` e `blocosDoSystem` esse é o **único**
      vermelho da suíte inteira.
    diferenca_material_em_relacao_a_M6: >
      **Não é buraco de cobertura.** Medi as quatro isoladamente e as quatro SÃO detectadas — nenhuma
      guarda está escondida atrás de outra. O que se perde é resolução de diagnóstico: quando esse
      teste ficar vermelho, ele não diz qual dos cinco acessores caiu. Registro porque é literalmente
      o padrão que o @dev declarou contra si mesmo no caso `tools`/`tool_choice`, e o critério
      deveria valer para o vizinho também.

  - id: F-5
    severidade: INFORMATIVO
    titulo: "A catraca lê o DISCO, não o índice do git — e isso é uma força, não um risco"
    medido: "O 7º arquivo que criei para simular o merge era **untracked** e a catraca o pegou, nomeando-o."
    julgamento: "É mais forte que o `git grep --untracked` usado como segundo instrumento. Vale registrar para que ninguém 'conserte' a varredura trocando `readdirSync` por listagem do git."

