title: "Sincronizar telefone/WhatsApp do Sienge no cadastro de clientes"
epic: 75
gate: PASS
verdict: PASS
status_reason: >
  Dois bugs corrigidos na sync do Sienge. (1) Origem: a API devolve telefone em
  phones[] (confirmado em chamada real: phones=[{type:'Celular',number:'(44)...',main:true}]),
  não num campo phone plano — novo tipo SiengePhone + helper extractCustomerPhone
  (prioriza main → Celular → primeiro, normaliza via normalizePhoneBR). (2) Destino:
  o código gravava na coluna inexistente `phone`; agora grava em `telefone` e
  `whatsapp` no insert, e preenche ambos nos caminhos de vínculo (CPF/email) apenas
  quando vazios (phoneBackfillUpdates — não sobrescreve preenchimento manual).
  Backfill executado em prod: 59 clientes atualizados, 3 sem telefone no Sienge,
  0 erros; cobertura subiu de 11→67 (telefone) e 8→67 (whatsapp) dos 70 vinculados,
  formato 55DDD9XXXXXXXX verificado. typecheck (tsc --noEmit) e lint limpos.
  Pronto para @devops *push (o fix de código vale para sincronizações futuras;
  backfill dos existentes já aplicado direto nos dados).
