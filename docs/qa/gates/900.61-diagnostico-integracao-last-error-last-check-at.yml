  - id: CONCERN-3
    severidade: low
    bloqueia_merge: false
    titulo: "O registro de evidência diz 15 linhas; o banco diz 18"
    medido: >-
      `select count(*) from org_integrations` no `trifold-crm-dev` = **18** (3 orgs × 6 providers),
      **todas** com `created_at` entre 2026-08-29 21:31 e 2026-08-31 12:30 — ou seja, todas
      anteriores à migration de 2026-09-01. A story afirma "as 15 linhas que já existiam ficaram
      `NULL`" e "as 15 linhas do ambiente nasceram `disconnected`", duas vezes.
    por_que_importa: >-
      A AFIRMAÇÃO é verdadeira e eu a confirmei (16 linhas seguem `NULL`; as 2 que não seguem
      foram escritas depois, por `mark_error`, com trilha em `platform_audit_log`). Só o NÚMERO
      está errado — mas está numa seção cuja função inteira é ser "o medido".
    o_que_mudar: >-
      Trocar `15` por `18` nas duas ocorrências do Dev Agent Record de
      `docs/stories/900-61-diagnostico-integracao-last-error-last-check-at.story.md`.

observacoes:
  - >-
    **O degrau que o botão não deu: a declaração do @dev é EXATA, e eu a conferi na fonte.**
    `escrita.ts:128-134` chama `porta.markError` só quando `pedido.statusAtual &&
    STATUS_JA_CONFIGURADOS.has(pedido.statusAtual)` — comentário no código: "uma digitação errada
    não deixaria o tile vermelho para sempre". Como as linhas do ambiente nasceram `disconnected`,
    nenhuma tentativa frustrada produz `error`. **Isso BASTA, e por dois motivos medidos:**
    (a) as RPCs `*_as_platform` são a MESMA porta que a rota usa — a trilha mostra `secret_write`
    e `marked_connected` com `actor_type = platform_admin`, indistinguíveis de uma escrita da
    rota; (b) o degrau em questão (`disconnected → connected`) é PRÉ-EXISTENTE e não é território
    desta story: nada em `last_error`/`last_check_at` muda o caminho HTTP. O @dev disse em voz
    alta qual degrau não deu, e é o degrau certo a não dar. **Não vira concern.**
  - >-
    **A extração para fora do `.tsx` é real.** `linhaDeDiagnostico` e `detalheDaPendencia` têm
    **um único call site cada** (`integrations-panel.tsx:146` e `console-visao-geral.ts:331`),
    e os dois consomem. O `.tsx` faz só interpolação — não sobrou ternário de decisão no JSX.
  - >-
    **`p_codigo` continua `text` sem `CHECK`** — a AC6 manda registrar como follow-up e não
    consertar aqui; está no cabeçalho da migration `253` e no JSDoc de `diagnostico.ts`. O
    fallback é o contorno correto, e a escolha de `CODIGOS_DE_ERRO.includes(...)` em vez de
    `MENSAGENS_PT_BR[c] ?? …` fecha o furo de cadeia de protótipos (`constructor` devolveria uma
