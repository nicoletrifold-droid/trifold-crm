top_issues:
  - id: CONCERN-1
    severidade: medium
    bloqueia_merge: false
    titulo: "A régua do consumo prende PRESENÇA e ORDEM, não ALCANCE do render"
    medido: >-
      Sonda P1: mover o bloco `{diagnostico && (…)}` do corpo sempre renderizado para dentro do
      ramo `somenteLeitura ? (…)` de `integrations-panel.tsx` — sem alterar UMA letra do texto —
      deixa `tsc --noEmit` rc=0 e a suíte inteira em **312/4318/6, zero vermelho**. Como
      `somenteLeitura` só é verdadeiro para o WhatsApp, e `montarTilesDoPainel` força
      `ultimoErro: null` para o WhatsApp, o diagnóstico deixaria de existir na tela inteira e
      nada acenderia. É a mesma classe da 900-62 (`a régua para um degrau antes do dano`).
    o_que_mudar: >-
      Uma linha em `packages/web/src/lib/integrations/painel/diagnostico.test.ts`, no `it`
      "o tile chama `linhaDeDiagnostico` e desenha o retorno, nessa ORDEM" — âncora de ORDEM, a
      mesma família que eles já usam:
      `expect(codigo.indexOf("{diagnostico && ("), "o diagnóstico é desenhado ANTES do ramo somenteLeitura").toBeLessThan(codigo.indexOf("{somenteLeitura ? ("))`
      Conferido contra a fonte real: hoje `7881 < 8049`; sob P1 a ordem inverte e a régua acende.
  - id: CONCERN-2
    severidade: low
    bloqueia_merge: false
    titulo: "A régua de igualdade exata de linha é satisfeita por um duplo MORTO"
    medido: >-
      Sonda P2: com o call site real envenenado para `lastError: null`, um objeto morto
      (`const morto = { status: estado.status, lastError: estado.ultimoErro, lastCheckAt:
