status_reason: >-
  **Os 10 mutantes batem exato, e a prova mais bonita da story sobrevive a uma conferência mais
  dura do que a que o @dev fez.** Reproduzi os 10 sobre a fonte real, cada um com a suíte
  INTEIRA e `tsc --noEmit` rc=0 antes de contar o vermelho: os contadores saíram
  `1,3,1,2,1,3,1,2,1,2` — **idênticos à tabela do @dev, mutante a mutante**. O par exigido tem
  **kill sets disjuntos**: M3 mata só `o tile chama linhaDeDiagnostico … nessa ORDEM`; M4 mata
  `os três argumentos vêm do ESTADO do tile` + `controle positivo (2)`. Interseção vazia.
  **O fuso eu provei três vezes, e nenhuma delas depende do olho de ninguém.** (i) M5 numa
  máquina cujo `TZ` **é** `America/Sao_Paulo` — onde o teste de comportamento ficaria VERDE —
  ainda assim mata, pela régua de texto-fonte `timeZone: FUSO,`: o carrasco não depende de
  relógio. (ii) Sob `TZ=UTC` (Vercel/CI) o M5 acende **6** testes de comportamento a mais, e a
  suíte sem mutação segue verde nos dois fusos. (iii) Li de `org_integrations` no
  `trifold-crm-dev` o carimbo que a tela mostrou — `last_check_at = 2026-09-02 00:00:02.583706+00`,
  **2 segundos depois da virada da meia-noite em UTC** — e alimentei `dataDeChecagem` com ele sob
  `TZ=UTC`: devolve **01/09/2026**; o mesmo instante sem `timeZone` devolve **02/09/2026**.
  A condição de fronteira é do relógio, não de fixture.
  **AC4 está provada por estrutura, não por promessa:** o corpo VIVO de
  `_org_integration_write_secret` no banco de teste tem **0** ocorrências de `last_`, contra 2 em
  cada uma das outras duas — extraído por LINHA de `pg_get_functiondef`, nunca por `ILIKE` no
  blob. E o `sha256` registrado no ledger `trifold_migrations_aplicadas` para a `253`
  (`a1ecbc0d…`) é **igual ao do arquivo desta branch**: o que foi testado é o que vai ser
  mergeado.
  **O que segura o gate é uma ausência que eu medi, não um defeito vivo.** A régua do consumo
  prende PRESENÇA e ORDEM no texto-fonte, mas não prende ALCANCE do render: mover o bloco
  `{diagnostico && (…)}` para dentro do ramo `somenteLeitura ? (…)` — o ramo que só desenha para
  o WhatsApp, justamente o provider cujo diagnóstico é `null` por construção — deixa `tsc` rc=0 e
  a suíte **312 / 4318 / 6, zero vermelho**. O recurso some para os 5 providers que escrevem, e
  nada acende.

