invariant_check:
  currency_null: PASS
  detail: >-
    supabase-usage.ts (supabase_plan_info, supabase_requests_total) e resend-usage.ts
    (resend_monthly_quota_limit, resend_emails_sent_count_email_logs) — as 4 únicas linhas produzidas
    têm `currency: null` literal. Nenhuma escreve 'USD'/'BRL'. A agregação `WHERE currency IS NOT NULL`
    da 78-9 nunca incluirá estas linhas. Coluna service_cost_snapshots.currency é nullable
    (migration 164 L90: CHECK IN ('USD','BRL'), sem NOT NULL) — null é aceito pelo schema.

traceability:
  AC1: PASS  # Ambos coletores importam BillingCollector/CostSnapshotRow/CollectWindow de types.ts e rodam via runCollector; types.ts/run-collector.ts intocados.
  AC2: PASS  # supabase_plan_info (value=1, plano em raw_response) + supabase_requests_total; egress omitido com justificativa Article IV (sem endpoint).
  AC3: PASS  # resend_monthly_quota_limit via header x-resend-monthly-quota + resend_emails_sent_count_email_logs via COUNT em email_logs.
  AC4: PASS  # Invariante currency=null — verificada estaticamente (crítica).
  AC5: PASS  # Supabase 503 sem PAT (antes de coletar); Resend prossegue sem key (parcial, resend_api_key_missing no corpo) — divergência documentada e coerente.
  AC6: PASS  # Promise.allSettled isola sub-chamadas; parcial se uma falha, throw só se ambas falham (runner grava error).
  AC7: PASS  # Idempotência herdada do runCollector (onConflict service_id,snapshot_date,metric); todas as linhas usam snapshot_date=window.to.
  AC8: PASS  # CRON_SECRET: 503 sem secret, 401 header errado — idêntico a billing-collect-anthropic.
  AC9: PASS  # vercel.json: "0 13" (supabase) / "0 14" (resend) — sem colisão com horário fixo existente.
  AC10: PASS # Nenhum write em platform_services/service_billing_reminders; coletores só leem platform_services e email_logs, escrevem apenas service_cost_snapshots.

