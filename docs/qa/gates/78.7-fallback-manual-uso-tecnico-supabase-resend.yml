top_issues:
  - id: 'REL-001'
    severity: low
    finding: >-
      T5 (validação manual em DEV) e a linha de DoD de validação manual não foram executadas neste ambiente
      autônomo (sem servidor Next / sem secrets DEV). A invariante currency=null landando de fato no banco e
      a idempotência real são inferidas por raciocínio estático + comportamento herdado do runner 78-3, não por
      DB ao vivo.
    suggested_action: >-
      Confirmar no redeploy: (a) SELECT DISTINCT currency das linhas supabase/resend = só NULL; (b) 2ª chamada
      da mesma janela mantém 1 linha por (service_id,snapshot_date,metric). Não bloqueante — secrets já em prod.
  - id: 'REL-002'
    severity: low
    finding: >-
      Header x-resend-monthly-quota não pôde ser confirmado empiricamente sem RESEND_API_KEY válida (T1.5).
      Se o nome do header divergir em prod, a métrica resend_monthly_quota_limit é silenciosamente pulada
      (só um warn), degradando sem erro visível.
    suggested_action: >-
      No redeploy com a key real, verificar em log/response se a linha resend_monthly_quota_limit foi gravada;
      se ausente, ajustar RESEND_QUOTA_ENDPOINT/RESEND_QUOTA_HEADER. Parsing defensivo já evita dado inventado.

