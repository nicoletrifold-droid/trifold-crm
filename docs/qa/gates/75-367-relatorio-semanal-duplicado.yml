concerns:
  - id: C1
    severidade: LOW
    tipo: recuperabilidade + observabilidade
    titulo: "Run vencedora que falhe no envio não gera evento — só `console.error` e `last_result`"
    detalhe: >
      O trade-off dos 144h que o @po registrou está corretamente documentado (SQL de backdate do
      `started_at` + PDF sob demanda em `/api/analytics/report`), e a mitigação existe de fato — conferi
      a rota. O que sobra é o gatilho da mitigação: `errors` é contado e gravado em
      `cron_locks.last_result`, mas o caminho de falha **não escreve em `system_events`** (só
      `console.error` nas linhas 159 e 165). Ou seja, das três situações pós-deploy, duas gritam
      (`ANALYTICS_REPORT_RUN_DUPLICADA`, `ANALYTICS_REPORT_CLAIM_INDISPONIVEL`) e a única que custa 6
      dias de atraso fica dependendo de alguém rodar a query 1 da story por conta própria. Não é
      regressão desta story (a rota nunca teve recibo de sucesso, diferente do `FOLLOWUP_EXECUTED`) e
      não bloqueia o merge — mas é justamente a classe de silêncio que a 75-350/75-351 pagaram caro.
    recomendacao: >
      Backlog: emitir `ANALYTICS_REPORT_ENVIO_FALHOU` (level error, category cron, metadata com
      `errors`/`sent`) via `logEventOnce` quando `errors > 0`, antes do `finishCronRun`. Fecha o
      triângulo dos event types e faz a query 2 da story cobrir também a falha.
  - id: C2
    severidade: LOW
    tipo: causa-raiz-não-confirmada
    titulo: "Quem faz a segunda invocação segue desconhecido (herdado da 75-352)"
    detalhe: >
      Decisão explícita e correta da story: consertar o efeito sem depender de achar a causa externa ao
      repo. Reconferi o que dava para reconferir: `vercel.json` tem a rota uma única vez, não há
      `.github/workflows/`. O `ANALYTICS_REPORT_RUN_DUPLICADA` é o que vai dizer se o gatilho persiste —
      e sem ele o AC1 seria inverificável em produção (crédito à correção (a) do @po).
  - id: C3
    severidade: LOW
    tipo: lacuna-de-teste
    titulo: "Nenhum teste prova que o claim vem ANTES do select de `organizations`"
    detalhe: >
      O mock do Supabase rastreia `rpc()` em `rpcs[]`, mas `from().select()` não é registrado em lugar
      nenhum. `expect(rpcs[0])` prova que o claim é o primeiro **RPC**, não que precede a query. A ordem
      está correta por leitura de código (:53 vs :102) e o efeito prático está coberto (`dadosMontados
      === 0` / `pdfsRenderizados === 0` nos skips), então o risco é de refactor futuro, não de hoje.
    recomendacao: >
      Um `chamadas.push('select organizations')` no mock de `from()` e um assert de ordem relativa
      fechariam isso em 3 linhas, se alguém voltar ao arquivo.
  - id: C4
    severidade: LOW
    tipo: documentação
    titulo: "O PDF sob demanda cai em 30 dias por padrão, não nos 7 dias do e-mail"
    detalhe: >
      Dev Notes oferece `/api/analytics/report` como recuperação, e a rota existe e não tem trava — mas
      ela usa `resolvePeriod` a partir da URL, cujo padrão é 30 dias, enquanto o cron chama
      `resolvePeriod("7d")` fixo (Story 75-69). Para reproduzir o conteúdo do relatório semanal é
      preciso `?range=7d`. Detalhe de procedimento, não de código.
    recomendacao: "Se a story for revisitada, acrescentar `?range=7d` à linha da mitigação nas Dev Notes."

futuro:
  - "Se o relatório passar a ser por organização com múltiplas orgs, a trava única de RUN vira gargalo: uma org que falhe bloqueia todas as outras por 6 dias. Aí é a dupla trava do followup (run + item), como a própria story antecipa em 'Fora de escopo'."

