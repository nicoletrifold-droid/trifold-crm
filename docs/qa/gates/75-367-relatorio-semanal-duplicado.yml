migrations: ["nenhuma nova — reaproveita a 234 (cron_locks, claim_cron_run, finish_cron_run), aplicada em prod 20/08 10:49 UTC"]

escopo: >
  O cron `/api/cron/analytics-report` é invocado duas vezes por agendamento (gatilho externo ao repo,
  já mapeado na 75-352) e não tinha trava nenhuma. Resultado em produção: dois `emailId` distintos no
  Resend (`delivered` 02:01:52Z e 02:02:49Z de 24/08), mesmo conteúdo e mesmo anexo. A correção passa a
  chamar o claim atômico da 234 deste segundo lugar, com fail-CLOSED no chamador.

resumo: >
  **A correção não é copiar o followup — é invertê-lo no ponto que importa.** O helper compartilhado
  `claimCronRun` é fail-OPEN de propósito (`{ runId: null, claimed: true }` quando o RPC falha), e o
  `followup` depende disso porque tem uma segunda trava por lead (`claim_follow_up`). O
  `analytics-report` não tem segunda trava, então seguir sem trava seria reabrir exatamente o bug. O
  @dev implementou o fail-closed **no chamador**, discriminando `claimed === true && runId === null`,
  e não tocou no helper. Conferido por `git diff`: `claim-run.ts` recebeu 11 linhas adicionadas / 0
  removidas — só a constante. `claim-run.test.ts` roda verde **sem edição**, inclusive o caso "RPC com
  erro: fail-OPEN". `followup/route.ts` não aparece no diff.

  **A cobertura da causa-raiz é real, não só "o Resend não foi chamado".** Os mocks de
  `buildAnalyticsReportData` e `renderToBuffer` incrementam contadores próprios, e os dois testes de
  skip assertam `dadosMontados === 0` **e** `pdfsRenderizados === 0` — quem perde a corrida não paga os
  ~105s de PDF que a duplicata pagava antes.

status_reason: >
  Liberado para push. AC1-AC6 atendidos e verificados contra o código (não contra a documentação). Zero
  regressão: suíte inteira verde, `tsc --noEmit` limpo, eslint 0 erros nos arquivos tocados, build OK.
  Os 4 concerns são LOW e nenhum bloqueia o merge — o mais relevante (C1) é o custo já conhecido e
  documentado pelo @po dos 144h, com procedimento manual de recuperação escrito na story.

acoes_obrigatorias: []

verificacoes:
  - id: V1
    check: "1. Code review — padrões, legibilidade, manutenibilidade"
    resultado: >
      PASS — espelha o padrão já em produção no `followup` (claim → guard com `skipped_reason` →
      `finishCronRun` aguardado), e onde divergiu, divergiu de propósito e com o porquê no comentário.
      Dois `if` separados em vez de um composto: `if (!claimed)` cobre a duplicata, `if (runId === null)`
      só é alcançável com `claimed === true`, que é exatamente o retorno de fail-open do helper. Efeito
      colateral correto: depois dos guards o TS estreita `runId` para `string`, e o `finishCronRun` do
      caminho vencedor nunca recebe `null`. Comentários explicam decisão, não sintaxe.
  - id: V2
    check: "2. Unit tests — cobertura adequada, todos passando"
    resultado: >
      PASS — 7 casos novos em `route.test.ts`, e o que eles seguram é a assimetria de fail-safe (o item
      fácil de inverter num futuro "vamos padronizar os crons"). Rodado por mim: 14 passed nos dois
      arquivos tocados; **suíte inteira 242 arquivos / 2911 passed + 6 expected-fail, 20,4s**. Cobertos:
      caminho vencedor (e-mail único, destinatários, anexo PDF, números no corpo, recibo com
      contadores), `already_running`, `claim_indisponivel`, early return sem organização fechando o
      recibo, falha de envio contando em `errors`, 401 sem tocar na trava, `maxDuration === 300`.
  - id: V3
    check: "3. Acceptance criteria — todos atendidos"
    resultado: >
      PASS nos 6. AC1: claim em route.ts:53-57, antes do select de `organizations` (:102), do
      `buildAnalyticsReportData` (:121) e do `renderToBuffer` (:124); perdedora responde 200 com
      `already_running` e loga `ANALYTICS_REPORT_RUN_DUPLICADA` (`category: "cron"`, metadata com `job`
      e `intervalo_minimo_s`) — os três assertados no teste. AC2: constante em claim-run.ts:35, vizinha
      da do followup, com o comentário justificando o número. AC3: fail-closed no chamador (:80-100),
      helper intacto. AC4: `maxDuration = 300` em :19, com teste. AC5: `finishCronRun` aguardado nos
      DOIS returns do caminho vencedor — :109 (No organizations found, a correção exigida pelo @po) e
      :170. AC6: nenhuma migration nova; `vercel.json` fora do diff, rota aparece 1 vez com `"0 2 * * 1"`.
  - id: V4
    check: "4. No regressions — funcionalidade existente preservada"
    resultado: >
      PASS — `git diff --stat` toca 2 arquivos de código: `analytics-report/route.ts` (+74) e
      `claim-run.ts` (+11, 0 removidas). `claimCronRun`/`finishCronRun` byte-idênticos; o docblock do
      fail-open segue valendo. `followup/route.ts` não foi tocado e `claim-run.test.ts` passa sem
      edição (o caso de fail-open na linha 69 é a prova de que a assimetria ficou no chamador). O corpo
      do e-mail, o PDF e a lista de destinatários seguem intactos — o teste do caminho vencedor assere
      subject, `to`, `contentType` do anexo e `<strong>69</strong>` no HTML.
  - id: V5
    check: "5. Performance — dentro de limites aceitáveis"
    resultado: >
      PASS, com ganho. O claim adiciona 1 RPC antes do trabalho e o recibo 1 depois — troca ~105s de
      render de PDF descartado (o que a invocação duplicada fazia) por um round-trip. `maxDuration = 300`
      deixa de depender do default implícito da plataforma numa rota que leva ~105s, e é o mesmo valor
      já em uso por `supremo-sync`, `sienge-customer-sync` e `nicole-agenda-reconcile`.
  - id: V6
    check: "6. Security — OWASP básico"
    resultado: >
      PASS — o claim vem DEPOIS do `Bearer ${CRON_SECRET}` (:33), então nenhuma requisição não
      autenticada consegue queimar a janela de 144h; o teste "sem authorization não reivindica a trava"
      assere `rpcs` vazio no 401. O desvio declarado pelo @dev (`createAdminClient()` em :42, antes do
      claim) é aceitável: conferi `lib/supabase/admin.ts` — a função só lê env e chama `createClient`
      com `autoRefreshToken: false` / `persistSession: false`, zero I/O. Nenhuma query acontece antes do
      `claim_cron_run`. Sem segredo novo, sem PII no metadata dos eventos, `cron_locks` segue com RLS
      ligada e sem policy (só `service_role`).
  - id: V7
    check: "7. Documentation — atualizada se necessário"
    resultado: >
      PASS — Dev Agent Record com a ordem de implementação e as 3 decisões, "Verificar depois do deploy"
      com as duas queries SQL que tornam o AC1 falsificável em produção, e o procedimento de liberar a
      trava à mão (o único custo real dos 144h). Nada fora da story precisa mudar: os event types novos
      não alimentam dashboard nem runbook (o `FOLLOWUP_RUN_DUPLICADA` também não).

