# Defeitos encontrados PELA review, no código desta própria story, e corrigidos.
findings_fixed:
  - id: QA-1
    severity: high
    category: correctness
    file: "packages/web/src/app/api/leads/[id]/send-message/route.ts"
    summary: >
      O alerta de credencial morta era disparado com `void promise` num route
      handler. Em serverless a lambda pode encerrar com a escrita pendente e o
      e-mail nunca sai — ou seja, o mecanismo criado para acabar com a falha
      silenciosa falharia em silêncio. O repo já tem convenção para isso: `after()`
      do next/server, usado em 6 rotas (webhook/whatsapp, webhooks/meta-ads,
      webhooks/sienge, webhooks/landing-page, admin/email-blasts, login/actions).
      A própria Story 87-6 documenta essa classe de bug.
    fix: "trocado por after(() => alertCredencialMorta(...)) nas duas rotas"
  - id: QA-2
    severity: high
    category: correctness
    file: "packages/web/src/app/api/leads/[id]/messages/[messageId]/resend/route.ts"
    summary: >
      O reenvio assinava a mensagem com `appUser.name` — quem CLICOU — e não com
      quem escreveu. No atendimento compartilhado (75-165/75-171) um supervisor
      reenviando a mensagem da corretora faria o lead receber a fala dela assinada
      com o nome dele. `metadata.signed_as` já guardava o remetente correto.
    fix: "assina com metadata.signed_as, com fallback para appUser.name"
  - id: QA-3
    severity: medium
    category: security
    file: "packages/web/src/lib/meta/token-validity.ts"
    summary: >
      O token ia DUAS vezes na query string do debug_token (input_token e
      access_token). Query string é gravada por log de rede/proxy; header não.
    fix: >
      inspetor movido para o header Authorization (verificado contra a Meta com o
      token real: is_valid true, expires_at 0). `input_token` permanece na query
      por ser contrato da Meta. Teste atualizado para travar o novo formato.

# Riscos aceitos / dívida registrada — nada aqui bloqueia merge.
concerns:
  - id: C-1
    severity: high
    summary: >
      NÃO verificado rodando em prod (item do DoD). Testes unitários não cobrem:
      a bolha vermelha aparecendo na tela real do corretor, o e-mail chegando ao
      gestor, e a bolha de mídia não baixada. Recomendação: exercer em prod com um
      401 CONTROLADO (ex.: apontar temporariamente uma cópia do fluxo para um token
      inválido) FORA do horário comercial, ou aceitar a verificação no próximo
      incidente real.
  - id: C-2
    severity: medium
    summary: >
      A falha de envio da mensagem de TRANSIÇÃO (75-51-2) grava send_error com
      role='assistant'. O resolveDeliveryStatus devolve 'none' para assistant, então
      essa falha específica continua invisível. Fora do escopo desta story (o AC2
      fala da mensagem do corretor), mas é o mesmo buraco numa mensagem vizinha.
  - id: C-3
    severity: low
    summary: >
      mergeMessageMetadata faz read-modify-write sem lock: dois updates concorrentes
      no MESMO wamid podem se sobrescrever. Risco baixo (os 3 caminhos de mídia são
      mutuamente exclusivos por tipo de mensagem), mas não é atômico.
  - id: C-4
    severity: low
    summary: >
      A tela de integrações chama a Meta a cada render (timeout 6s, sem cache).
      É tela de configuração, tráfego baixo — aceitável, mas se virar lenta, cachear.
  - id: C-5
    severity: low
    summary: >
      O endpoint de reenvio não tem rate limit: um corretor pode clicar em sequência.
      Cada clique é 1 chamada ao Graph; sem risco de duplicar mensagem no banco
      (atualiza a mesma linha), mas pode gerar envios repetidos ao lead se todos
      derem certo em paralelo.

