# ─────────────────────────────────────────────────────────────────────────────
top_issues:
  - id: "SEC-001"
    severity: medium
    finding: >-
      A recusa de "*" da AC-B2 não cobre a sintaxe de embedding do PostgREST. Medido com sonda:
      platformQuery("organizations", "*") e ("organizations", "id, *") são recusados (controles
      positivos verdes), mas platformQuery("organizations", "id, users(*)") PASSA — o split por
      vírgula nunca vê um elemento igual a "*". Pior: como todo o schema tem
      `org_id uuid REFERENCES organizations(id)`, o embedding também contorna a própria
      PLATFORM_READABLE_TABLES — platformQuery("organizations", "id, leads(name, phone)") leria
      `leads`, que está deliberadamente FORA da lista, sem emitir nenhum `.from()` cru e portanto
      sem acender o scanner da AC-B4. Não há exposição viva (os 3 chamadores atuais usam listas de
      colunas planas), mas a tese de segurança da story — "a lista fechada é a única fronteira real
      sob D14" — é mais estreita do que o texto afirma.
    suggested_action: >-
      Não bloqueia esta onda. Registrar explicitamente na 900-42a (endurecimento) como item de AC —
      recusar `(` em `columns`, ou parsear os recursos embutidos e validá-los contra
      PLATFORM_READABLE_TABLES. Acrescentar a limitação ao comentário de topo de platform-query.ts
      para que a 900-42a não a herde em silêncio.
    ac_refs: ["AC-B1", "AC-B2"]
    owner_sugerido: "900-42a"

  - id: "MNT-001"
    severity: medium
    finding: >-
      aios/no-unscoped-admin-client subiu de 4 para 7 warnings e nenhum arquivo de /platform está em
      docs/audits/admin-client-allowlist.json (nem em `legitimos`, nem em `legado`) — incluindo os
      dois que o PR #498 já deixava avisando. O `_aviso` do próprio arquivo diz literalmente:
      "arquivo novo que precise do client cru vai para `legitimos`, com motivo, e isso aparece em
      diff". platform-query.ts é *o* caminho cross-org sancionado do painel; deixá-lo anônimo no
      meio de 7 warnings é o oposto do que a allowlist existe para produzir. A regra é `warn` no
      eslint.config.mjs, então nada bloqueia mecanicamente.
    suggested_action: >-
      JULGAMENTO: allowlistar ANTES do merge. Acrescentar a `legitimos` os DOIS arquivos que esta
      story cria — src/lib/tenancy/platform-query.ts ("caminho único de leitura cross-org do painel
      /platform; a fronteira é PLATFORM_READABLE_TABLES, não RLS — Story 900-22b") e
      src/lib/tenancy/admin-invite.ts ("convida o admin de uma empresa que não é a da Trifold;
      cross-org por natureza — Story 900-22b"). São 2 entradas JSON com motivo, não mudança de
      código, e é exatamente o mecanismo prescrito. Os 2 arquivos herdados do PR #498
      (app/api/platform/orgs/route.ts e a antiga orgs/page.tsx) NÃO são desta story — abrir item de
      backlog. O @dev acertou em não editar governança por conta própria; a decisão está tomada
      aqui.
    ac_refs: []
    owner_sugerido: "@dev nesta story (2 entradas) + backlog para os herdados do #498"

  - id: "REL-001"
    severity: low
    finding: >-
      A consulta de admin em orgs/page.tsx — platformQuery("users", "org_id, id, auth_id")
      .eq("role","admin") — NÃO tem .order("created_at"), enquanto ensureAdminInvited e a rota de
      reenvio têm .order("created_at", ASC).limit(1). O mapa da página fica com a primeira linha que
      o PostgREST devolver. Numa org com mais de um admin (a AC-A3 cita justamente a org "Trifold"
      legada como esse caso), o badge pode dizer "convite pendente" apontando para a linha B
      enquanto o botão Reenviar age sobre a linha A, e o operador recebe 400 NO_PENDING_INVITE sem
      entender por quê. O desempate determinístico foi aplicado na escrita e esquecido na leitura.
    suggested_action: >-
      Acrescentar .order("created_at", { ascending: true }) à consulta de admin da página, para que
      a linha exibida seja a MESMA que ensureAdminInvited escolheria. Uma linha.
    ac_refs: ["AC-A3", "AC-A5", "AC-B3"]

  - id: "SEC-002"
    severity: low
    finding: >-
      A senha temporária da conta Auth do admin é
      `Tmp_${Date.now().toString(36)}${Math.random().toString(36).slice(2,10)}!` — Math.random(),
      que não é CSPRNG. É cópia byte a byte de brokers/route.ts:67 e :275, então é REUSO fiel do
      idioma do projeto e não invenção desta story. Mas: (a) o principal aqui é o admin de uma
      empresa cliente inteira, blast radius maior que um corretor; (b) a janela é indefinida — um
      convite não aceito fica de pé para sempre; (c) o repositório JÁ TEM o padrão mais forte em
      users/[id]/reset-password/route.ts:42 (`crypto.randomUUID()`), então corrigir também seria
      REUSO, não invenção. Exploração prática é improvável (rate limit do Supabase Auth, ~41 bits).
    suggested_action: >-
      Trocar por crypto.randomUUID() em admin-invite.ts (1 linha, sem novo padrão). Opcionalmente
      abrir backlog para alinhar brokers/route.ts.
    ac_refs: ["AC-A3"]

  - id: "TEST-001"
    severity: low
    finding: >-
      Pontos cegos medidos do detectRawTableReads, não declarados no docstring (que só documenta o
      falso positivo em comentário): `db.from(\`leads\`)` (template literal) → [] e
      `db.from(TABELA_VAR)` (nome por variável) → []. `db.schema("public").from("leads")` → ["leads"],
      esse pega. São limites inerentes a uma regra de texto e não há evasão intencional no modelo de
      ameaça, mas o docstring afirma cobertura da regra "qualquer .from(<literal>)" sem nomear os
      falsos NEGATIVOS. A guarda de vivacidade também é fraca por construção: assere apenas
      total > 0 (hoje 6 arquivos), então uma quebra parcial do walker — por exemplo o regex de
      extensão passando a casar 1 arquivo só — passaria despercebida.
    suggested_action: >-
      Acrescentar os falsos negativos ao docstring de platform-query-scan.ts. Considerar
      toBeGreaterThanOrEqual(<piso conhecido>) na guarda de vivacidade, na 900-42a.
    ac_refs: ["AC-B4"]

  - id: "DOC-001"
    severity: low
    finding: >-
      A R9 do `npm run gate:tenancy` roda `git diff --diff-filter=A origin/main...HEAD` — só enxerga
      arquivo COMMITADO. Com a árvore ainda não commitada, ela reportou "nenhuma migration nova em
      relação a origin/main", ou seja, a migration 244 NÃO foi exercitada pela regra que existe para
      detectar colisão de CREATE OR REPLACE (classe CON-7). Sem consequência aqui — 244 é
      ALTER TABLE ADD COLUMN puro, sem função — mas a alegação "gate:tenancy +0" é verdadeira e
      vazia quanto a 244.
    suggested_action: >-
      @devops deve rodar `npm run gate:tenancy` DEPOIS do commit/push, quando a R9 passa a enxergar
      244, antes de aplicar o DDL.
    ac_refs: ["AC-A2", "T1"]

  - id: "ARCH-001"
    severity: low
    finding: >-
      `platformQuery(table, columns: string)` degrada a inferência do client tipado para
      GenericStringError[], forçando `as unknown as <Linha>[]` em todos os 3 chamadores. O custo é
      real e está documentado no topo de platform-query.ts com o caminho de saída nomeado (trocar
      string por genérico de literal na 900-42a). ACEITÁVEL NESTA ONDA: o parâmetro de runtime é
      justamente o que torna possível recusar "*", e o débito está escrito onde quem for endurecer
      vai lê-lo — não fica implícito para a 900-42a. O risco residual é a família `as unknown as`
      normalizar cast cego em telas futuras de /platform.
    suggested_action: >-
      Nenhuma ação nesta story. A 900-42a já herda a nota. Não replicar o cast sem comentário nas
      telas de 900-31/900-35/900-44.
    ac_refs: ["AC-B2", "AC-B3"]

  - id: "MNT-002"
    severity: low
    finding: >-
      O `UPDATE admin_invite_email` foi movido da rota para lib/tenancy/admin-invite.ts porque a
      rota está dentro do diretório varrido. A justificativa é CORRETA e a alternativa (afrouxar a
      exclusão) seria pior — é o C-1 do @po. Verificado: nenhuma exclusão foi afrouxada, o walker
      mantém `*.test.ts`/`__tests__/`/`__fixtures__/` com o comentário NÃO REMOVER, a restrição a
      .ts/.tsx está lá, e a AC-A2 continua com poder discriminante (mutação de ordem medida acima).
      Mas fica um PRECEDENTE: "se a régua acende, mova o código para lib/tenancy". Aplicado uma vez,
      com razão escrita, é engenharia; aplicado por reflexo, esvazia a régua sem nunca tocar nela.
    suggested_action: >-
      A 900-42a deve declarar explicitamente o critério de quando mover código para fora da
      população varrida é legítimo (escrita, que está fora do escopo declarado de platformQuery) e
      quando é evasão (leitura, que deveria passar por platformQuery).
    ac_refs: ["AC-A2", "AC-B4"]

