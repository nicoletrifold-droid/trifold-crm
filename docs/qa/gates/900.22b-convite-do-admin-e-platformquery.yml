divergencias_julgadas:
  - item: "POST retornava 200, não 201 (AC-A1 afirmava 201)"
    veredicto: "RESOLVER NO CÓDIGO foi certo"
    razao: >-
      O vermelho da AC-A1 não dependia do número (o teste espera 400 e recebia 2xx) e a AC-A7 exige
      201 explicitamente. Tornar o 201 explícito reconcilia as duas ACs sem inventar comportamento.
      Não havia decisão de produto a tomar.
  - item: 'platformQuery("users") precisou de `id` além de "org_id, auth_id"'
    veredicto: "RESOLVER NO CÓDIGO foi certo"
    razao: >-
      deriveAdminInviteStatus recebe `{ id, authId }` por assinatura escrita na própria AC-A5. A
      AC-B3 listou as colunas de forma incompleta; acrescentar `id` é a leitura que torna as duas
      ACs simultaneamente satisfazíveis. É correção de erro de transcrição, não mudança de escopo.
  - item: "renderPasswordActionEmail vive em lib/email-layout/ (diretório), não email-layout.ts"
    veredicto: "RESOLVER NO CÓDIGO foi certo"
    razao: "O import é idêntico. Fato do repositório, não decisão."
  - item: "[AUTO-DECISION] wizard não redireciona em already_active (a AC-A7 só nomeia failed/invited)"
    veredicto: "ACEITÁVEL, mas era a única que merecia um ping ao @sm"
    razao: >-
      A leitura é defensável e o @dev registrou o raciocínio: a AC-A5 manda a UI dizer que o e-mail
      foi ignorado, e router.push apagaria a mensagem pelo mesmo mecanismo que a AC-A7 documenta —
      logo navegar só em "invited" é a única regra que preserva as duas ACs. Isso é COMPORTAMENTO DE
      PRODUTO visível ao operador, não um fato do repositório: preencher um buraco de AC é papel do
      @sm/@po. Como a decisão está escrita, é reversível e nenhuma AC ficou violada, não retorna a
      story. Fica como observação de processo, não como correção.
  - item: "UPDATE admin_invite_email movido da rota para admin-invite.ts"
    veredicto: "CERTO — ver MNT-002"
    razao: >-
      Escrever na rota acenderia a régua com código correto, e a saída natural seria afrouxar a
      exclusão (o C-1 do @po). A alternativa escolhida preserva a régua E a AC-A2, o que eu medi
      com a mutação de ordem. O que sobra é o precedente, endereçado em MNT-002.

