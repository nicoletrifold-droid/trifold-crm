    Promise.all recebe a promessa dela. Nenhuma chamada passou a ser sequencial.
  - >
    Preset de 7 dias (caminho do cron semanal) inalterado: 193 linhas, nunca paginava e
    continua não paginando.
  - >
    Ordem com desempate por `id`: `created_at` não é único (importação em lote), e
    `.range()` sobre ordem com empate pula/repete linha — mesma lição do gate da 75-276.
  - >
    `RawLead` reusado em vez de tipo gêmeo; o import de `fetchAllLeads` já existia no
    arquivo (da 75-273), então não houve import duplicado.

