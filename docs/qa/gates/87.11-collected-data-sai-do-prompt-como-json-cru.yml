# ────────────────────────────────────────────────────────────────────────────
# Achados — o que EU encontrei e ninguém pediu
# ────────────────────────────────────────────────────────────────────────────
achados:

  - id: A1
    severidade: MEDIA-BAIXA
    categoria: tests
    titulo: "O truncamento da `citacao` do `agenda_state` é uma guarda ÓRFÃ — zero vermelhos"
    evidencia: >
      SONDA F: troquei `truncar(state.citacao)` por `state.citacao` em
      `collected-data.ts:160` e rodei a **suíte inteira**: `2.441 passed | 6 expected fail`,
      **zero vermelhos**. Nenhuma das 25 asserções da story exercita uma citação com mais de 120
      chars — a maior das fixtures é `"3ª feira às 17:30"` (17 chars).
      Confirmei que a guarda **funciona** com uma fixture descartável minha: citação de 279 chars
      entra como **120 chars + `…`**.
    por_que_importa: >
      `CITACAO_MAX = 280` (`agenda-state.ts:130`) limita a citação **na escrita**
      (`buildAgendaState`, `:149`), mas **`parseAgendaState` NÃO relimita na leitura** — `:190` faz
      `citacao: o.citacao`, sem `slice`. E 280 > 120. Ou seja: (a) uma citação de 121–280 chars é
      valor legítimo e o truncamento é o que a impede de entrar inteira no prompt; (b) qualquer
      registro gravado por outro caminho, ou por um escritor futuro, passa sem limite nenhum.
      **É a única linha do bloco novo cujo comprimento nenhuma fixture mede** — e é a linha que
      carrega texto livre do lead, que é exatamente a classe de dano que esta story existe para
      remover. Todas as outras guardas do módulo (`String(valor)`, filtro de legado, teto de linhas,
      teto de chars dos extras, cabeçalho, negação da citação, TTL) têm vermelho dedicado. Esta não.
    exposicao_em_producao: >
      **Nenhuma hoje.** Os dois únicos `agenda_state` vivos têm citação curta (`"3ª feira às 17:30"`
      e `"Terça"`). Não há regressão de comportamento — o código está certo. O que falta é a régua.
    recomendacao: >
      Uma fixture com `citacao` de ~279 chars e a asserção `- O lead mencionou … "<120 chars>…"`.
      Custa uma fixture e faz SONDA F ficar vermelha. **Antes da 87-10**, que vai escrever chave nova
      neste mesmo renderizador.
    dono: "@dev"
    bloqueia_merge: false

  - id: A2
    severidade: BAIXA
    categoria: tests
    titulo: "A contagem de vermelhos publicada é de população estreita (dois arquivos), não da RAIZ"
    evidencia: >
      Na suíte da raiz: **M0 = 6** (declarado 4), **M1 = 14** (declarado 12), **M6 = 10**
      (declarado 8). M2, M3, M4, M5 e M7 batem exatamente. A diferença é **sempre os mesmos dois
      testes** — os turnos-ouro da AC10 da 87-5 — e só aparece nas mutações que mexem no bloco de
      prompt que aquelas fixtures também produzem. M2/M3/M4/M5 não a produzem porque as fixtures da
      87-5 usam `{ name: "Ana" }`, que não tem `bedrooms`, não é legada e não passa de 120 chars.
    julgamento: >
      **É subestimação, não inflação** — o vermelho real é maior que o publicado, e o padrão é
      sistemático e explicável, o que é sinal de honestidade e não de manipulação. Por isso não muda
      o veredito.
      Mas a AC8 pede `npx vitest run` **da RAIZ**, e os três números publicados são de dois arquivos
      sem a população declarada ao lado. **É a mesma classe de erro que o próprio @dev consertou na
      régua de `grep` da AC1** — uma régua cujo denominador não está escrito — reaparecida na régua
      vizinha, medida no mesmo dia.
    recomendacao: "republicar M0/M1/M6 como `4 (nos dois arquivos da story) / 6 (na suíte da raiz)`"
    dono: "@dev"
    bloqueia_merge: false

  - id: A3
    severidade: INFORMATIVO
    categoria: tests
    titulo: "A única asserção puramente negativa da story sobrevive ao sumiço do estado"
    evidencia: >
      SONDA A (conversation_id trocado): dos 8 testes de `pipeline-collected-data.test.ts`, caem 7.
      O sobrevivente é `🔴 (i) o system INTEIRO não contém nenhuma das seis strings de maquinário`.
    julgamento: >
      Não é defeito — o arquivo se protege por composição: essa asserção mora num `describe` com dois
      controles positivos que caem, e o `toBe` do bloco inteiro cobre a forma. E o docstring do
      arquivo antecipa exatamente este modo de falha. Fica registrado porque é a única linha da story
      que, **isolada**, ficaria verde por o bloco ter sumido — e é a que a AC2-(iii) usa como
      vermelho principal.

  - id: A4
    severidade: INFORMATIVO
    categoria: code
    titulo: "Dois relógios no mesmo turno"
    evidencia: >
      `buildSystemPrompt` recebe o `now` de `pipeline.ts:672`; a aplicação do TTL do `agenda_state`
      em `:801` usa um `nowAgenda = new Date()` próprio. São duas instâncias distintas.
    julgamento: >
      **Sem consequência prática** — milissegundos contra um TTL de 48 h, e SONDA G mostra que a
      passagem do `now` tem vermelho. O `[AUTO-DECISION]` do @dev está certo no mérito (sem o `now`,
      o prompt citaria um fato que o próprio turno descarta 70 linhas adiante) e a ordem que ele
      descreve confere no código. Registro apenas para que a próxima story não leia *"o `now` do
      turno"* como invariante de um relógio só — hoje são dois.

  - id: A5
    severidade: INFORMATIVO
    categoria: code
    titulo: "A guarda do `if` mudou de forma (não é `if` novo, mas não é o mesmo `if`)"
    evidencia: >
      `if (state.collected_data && Object.keys(state.collected_data).length > 0)` virou
      `if (state.collected_data)`.
    julgamento: >
      Equivalente em comportamento: com `{}` o renderizador devolve `[]` e o spread não empurra
      linha nenhuma. Coberto byte a byte pela AC7-(a). O §5 promete *"nenhum `if` novo"* e não há
      `if` novo — mas há um `if` **alterado**, e a precisão do §5 é o padrão que este epic cobra.

