mutacoes:
  protocolo: "aplicar · npx vitest run (RAIZ) · ler · reverter · md5. Backup por cópia."
  baseline: "190 arquivos · 2.441 passed · 6 expected fail · 0 falhas"

  tabela:
    M0:
      forma: "git checkout de pipeline.ts — o despejo cru volta"
      declarado: 4
      medido_na_raiz: 6
      quais:
        - "AC2 > 🔴 o bloco inteiro, byte a byte"
        - "AC2 > 🔴 (i) o `system` INTEIRO não contém as seis strings de maquinário"
        - "AC2 > (ii) CONTROLE POSITIVO — citação e dados continuam no `system`"
        - "AC7 > 🔴 (b) HEAD menos exatamente a linha do JSON cru"
        - "87-5 AC10 > turno-ouro (a)   ← não contado pelo @dev"
        - "87-5 AC10 > turno-ouro (b)   ← não contado pelo @dev"
      julgamento: >
        **"4 é pouco para uma story cujo objeto é a subtração?" — não, e a conta explica por quê.**
        O arquivo de pipeline tem 8 testes. Destes, **6** têm `collected_data` não-vazio e portanto
        *podem* sentir a subtração. Dos 6, caem **4**. Os 2 que **não** caem são exatamente os dois
        de `qualificationScore` (AC5-iv) — e eles **têm de não cair**: a AC5 inteira existe para
        fixar que o score é insensível a esta story. Os outros 2 testes do arquivo (AC7-a e AC7-c)
        têm `collected_data` vazio e são idênticos ao `HEAD` por desenho.
        Ou seja: **todo teste que poderia detectar a subtração detecta**. A régua está saturada no
        arquivo, não frouxa. O número certo na suíte da raiz é **6**, com os 2 hashes da 87-5 por
        cima — ver o achado A2.
    M1:
      forma: "valorEscalar(): o `return null` final vira `return String(valor)`"
      declarado: 12
      medido_na_raiz: 14
    M2:
      forma: "renderDadosColetados() ganha `delete collectedData.bedrooms`"
      declarado: 10
      medido_na_raiz: 10
      confere: true
      nota: >
        Caem AC5-(iii) **e** AC5-(iv), como a AC5-(v) exige. Confirmei a aritmética do score de forma
        independente: `SCORE_WEIGHTS` = name 10 + property_interest 15 + bedrooms 10 + floor 10 +
        visit_availability 20 (via `hasAgendaFact`) = **65**; sem `bedrooms`, **55**; sem
        `agenda_state`, **45**. Os três números batem com o código e com os testes.
    M3:
      forma: "VALOR_MAX_CHARS 120 → 10.000"
      declarado: "3 (2 comportamentais + 1 asserção de constante)"
      medido_na_raiz: 3
      confere: true
      comportamentais_verificados: 2
      nota: >
        **A ressalva do @dev está correta e é honesta.** Dos 3, "os números são 120 e 12" é
        `expect(VALOR_MAX_CHARS).toBe(120)` — declaração, não comportamento. Sobram **2**
        comportamentais, e ele mesmo escreveu que quem contar 3 conta errado. Inflar contagem com
        asserção de constante seria a forma educada de mentir sobre cobertura; ele não fez isso, e
        volunteered a correção antes de eu perguntar.
    M4:
      forma: "MAX_LINHAS_DADOS 12 → 500"
      declarado: "2 (1 comportamental + 1 asserção de constante)"
      medido_na_raiz: 2
      confere: true
      comportamentais_verificados: 1
    M5:
      forma: "NAO_RENDERIZAVEIS perde o spread ...LEGACY_AGENDA_KEYS"
      declarado: 3
      medido_na_raiz: 3
      confere: true
      nota: "conjunto de vermelhos DISJUNTO do de M3 — é o que prova as duas guardas separadas"
    M6:
      forma: "o retorno deixa de prefixar CABECALHO_DADOS_COLETADOS"
      declarado: 8
      medido_na_raiz: 10
    M7:
      forma: "a linha de agenda perde a negação e vira `- Disponibilidade: <citacao>`"
      declarado: 5
      medido_na_raiz: 5
      confere: true
      nota: >
        A Armadilha 4 (*"não transformar a citação num fato"*) tem régua própria e ela morde. É a
        guarda mais importante do bloco novo do ponto de vista do Epic 88.

# ────────────────────────────────────────────────────────────────────────────
# Sondas minhas — 8 mutações que a story NÃO pede
# ────────────────────────────────────────────────────────────────────────────
sondas_do_qa:

  SONDA_A_mock_permissivo:
    pergunta: "o `createFakeSupabase` aceita qualquer filtro? (já achamos `in:` e `eq:` assim)"
    forma: "trocar o `conversation_id` da linha de `conversation_state` por outro uuid"
    resultado: "7 de 8 testes CAEM"
    veredito: O MOCK DISCRIMINA
    nota: >
      O fake aplica o predicado `.eq('conversation_id', …)` de verdade — some o estado, some o bloco,
      caem os byte-a-byte, os dois de score e os três da AC7. **Não há mock permissivo aqui**, e o
      @dev seguiu a Armadilha 3 (usar o harness da 75-279, não escrever mock novo).
      **O único sobrevivente é `(i) o system INTEIRO não contém as seis strings de maquinário`** — a
      única asserção puramente negativa do arquivo, que fica verde justamente porque o bloco inteiro
      sumiu. É o modo de falha que o docstring do próprio arquivo descreve. Está mitigado (ela mora
      num `describe` com dois controles positivos que caem), mas fica registrado: **é a única
      asserção da story que, sozinha, não distingue "entrou classificado" de "não entrou".**

  SONDA_B_hash_ouro_circular:
    pergunta: "os 2 hashes-ouro da 87-5 foram recapturados sem prova? (gravação circular)"
    forma: "`pipeline.ts` E `pipeline-corretor-no-historico.test.ts` AMBOS revertidos ao HEAD"
    resultado: "39 passed — os hashes ANTIGOS valem no HEAD"
    veredito: NÃO É CIRCULAR

  SONDA_C_recaptura_nasce_satisfeita:
    forma: "hashes NOVOS + `pipeline.ts` no HEAD"
    resultado: "2 vermelhos (os dois turnos-ouro)"
    veredito: A RECAPTURA NÃO NASCE SATISFEITA
    aritmetica_conferida_por_mim: >
      `CABECALHO_DADOS_COLETADOS`.length = **144**; `- Nome: Ana`.length = **11**;
      144 + 1 (o `\n`) + 11 = **156**. A linha antiga `Data collected so far: {"name":"Ana"}` = **37**.
      156 − 37 = **+119**. E os dois `length` assertados no arquivo movem exatamente
      30.256 → 30.375 e 30.082 → 30.201, **ambos +119**, com `dynamicSuffix` diferente nos dois
      cenários. **Só a linha certa mudou.** O `git diff` do arquivo toca apenas o docstring, 2
      `sha256` e 2 `length` — nada mais.
    veredito_final: "B + C + aritmética independente = recaptura PROVADA, não gravada"

  SONDA_D_ordem_dos_rotulos:
    forma: "trocar a ordem de `name` e `property_interest` em ROTULOS_QUALIFICACAO"
    resultado: "4 vermelhos"
    nota: >
      A ordem é fixada por teste. Conferi que a ordem do módulo é **exatamente** a de
      `SCORE_WEIGHTS` (`qualification.ts:15-24`) menos `visit_availability` — que é legado e por isso
      não tem rótulo. São 8 rótulos para 9 pesos, e o docstring explica o nono. Confere.

  SONDA_E_teto_come_a_linha_de_agenda:
    forma: "o teto deixa de reservar lugar para a linha de agenda"
    resultado: "1 vermelho"
    veredito: COBERTO

  SONDA_F_truncamento_da_citacao:
    forma: "`truncar(state.citacao)` → `state.citacao` na linha de agenda"
    resultado: "**ZERO vermelhos em 2.441 testes**"
    veredito: 🔴 GUARDA ÓRFÃ — ver achado A1

  SONDA_G_o_now_do_turno:
    forma: "o `now` recebido é trocado por um relógio fixo"
    resultado: "1 vermelho (`o estado de agenda VENCIDO não é citado`)"
    veredito: >
      O `[AUTO-DECISION]` de acrescentar o 2º parâmetro **tem** vermelho. A decisão é correta e o
      motivo dela é verificável no código: `buildSystemPrompt` roda em `pipeline.ts:734` e a leitura
      com TTL em `:801`. Ver a nota A4.

  SONDA_H_despejo_duplo_em_miniatura:
    forma: "`visit_explicitly_confirmed` sai de NAO_RENDERIZAVEIS"
    resultado: "2 vermelhos"
    veredito: COBERTO

