  contagens de M2/M4/M5 e `git diff` zero nos protegidos concordam.
  **Não sobe a PASS por uma coisa só, e ela é minha:** a guarda órfã que eu achei no R1 tinha uma
  **irmã**, e eu não a procurei. `truncar()` tem três sítios de chamada e M3 muta a constante
  compartilhada — o curto-circuito acende os três juntos e esconde que cada um pode estar sozinho.
