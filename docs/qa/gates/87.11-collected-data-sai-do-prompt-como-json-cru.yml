# ═══════════════════════════════════════════════════════════════════════════════
# ROUND 2 — re-gate FOCADO do PR #428 (16/08)
# Escopo: SÓ o que mudou depois do R1 (a C1 e a republicação da C2).
# NÃO reaberto: as três derrubadas do @dev, a C3, a C4.
# ═══════════════════════════════════════════════════════════════════════════════
round_2:
  verdict: CONCERNS  # mantido — e o motivo é NOVO, ver A6
  arvore_medida:
    forma: >
      `git worktree` isolado em `8e655ee8` (detached), `node_modules` por symlink. **1 commit
      sobre `199a7a84`**, `merge-base` = `199a7a84`. **Nada do #427 nem do #429 entrou na árvore** —
      provado abaixo pelo `md5` dos três arquivos do deploy B.
    arquivos_do_pr: 5
    higiene_final: "`git status` limpo no fim; `md5` de `collected-data.ts` restaurado em 16 de 16 mutações"

  # ───────────────────────────────────────────────────────────────────────────
  # A régua que me passaram não fecha, e a diferença é EXPLICÁVEL — não é defeito
  # ───────────────────────────────────────────────────────────────────────────
  regua_recalibrada:
    passada_pelo_lead: "190 arquivos · 2.444 passed · 6 expected fail"
    medida_por_mim_no_PR: "190 arquivos · **2.439** passed · 6 expected fail (2.445 total)"
    origin_main_199a7a84: "188 arquivos · 2.411 passed · 6 expected fail  ← medido, confere com a régua"
    conta: >
      2.411 (main) + 28 = **2.439**. E 28 = **25** (o delta do R1) + **3** (a C1). O delta da story
      fecha na casa decimal.
      Os **5** que faltam para 2.444 **não são desta story**: o R1 mediu uma árvore de trabalho que
      tinha o **deploy B da 87-5 NÃO commitado** por cima (por isso o "antes" do @dev era 2.416 e não
      2.411). O deploy B virou o **#427**, e o #428 não o carrega.
      **Prova independente disso:** os três arquivos do deploy B no PR têm `md5` **idêntico ao de
      `origin/main`** e **diferente** do que o R1 registrou em `higiene_de_arvore`:
      `894899a5…` (era `572219f7…`) · `dbf17592…` (era `471a4950…`) · `fbca905e…` (era `fc25e055…`).
      Ou seja: a divergência de 5 testes **é a prova de que o #427 não vazou para cá**, não um furo.
    veredito: "régua RECALIBRADA — `2.439` é o número correto do #428 sozinho; `2.444` é #428 + #427"

  # ───────────────────────────────────────────────────────────────────────────
  # 1. Os três testes novos mordem? — as DUAS coisas conferidas
  # ───────────────────────────────────────────────────────────────────────────
  c1_a_guarda_orfa_da_citacao:
    condicao: "SONDA F tem de passar a produzir ≥ 1 vermelho"
    sonda_F_reaplicada:
      forma: "`truncar(state.citacao)` → `state.citacao` em `collected-data.ts:160`"
      no_R1: "0 vermelhos em 2.441"
      no_R2: "**2 vermelhos** em 2.445"
      quais:
        - "AC6 (C1) > 🔴 (a) citação no MÁXIMO que o escritor legítimo produz (280) entra com 120 + `…`"
        - "AC6 (C1) > 🔴 (b) citação gravada por OUTRO caminho (jsonb cru, 500 chars) também é truncada"
    a_segunda_coisa_o_terceiro_teste:
      afirmacao_do_dev: "o (c) é controle de fronteira e **deve** ficar verde sob F — declarado antes de medir"
      medido: "sob F o (c) fica **VERDE**. A contagem correta é 2, não 3. **Contar 3 seria contar errado.**"
      mas_ele_e_inerte: >
        Não. **SONDA M** (minha, nova): troquei `valor.length > VALOR_MAX_CHARS` por `>=` — o conserto
        grosseiro que o (c) diz existir para impedir. **2 vermelhos, e um deles é o (c).**
        O controle de fronteira é **load-bearing**, não enfeite: ele é o único teste da suíte que
        distingue "corta acima de 120" de "corta a partir de 120", e é o que protege as citações
        vivas de produção (17, 16 e 5 chars) de virarem falas cortadas.
      sobre_a_ordem_da_declaracao: >
        **O que eu posso e o que eu não posso assinar.** O PR tem **um commit só**; não há como
        ordenar temporalmente "declarou" e "mediu" por `git`. O que eu verifiquei é mais forte que a
        cronologia e é o que importa: a declaração está **escrita no docstring do próprio teste**
        (`collected-data.test.ts:471-477`), é **substantivamente correta** (medida: verde sob F) e o
        teste que ela descreve **não é inerte** (medido: vermelho sob M). Uma declaração pós-fato que
        fosse conveniente teria dito "3 vermelhos"; esta subtrai um do próprio número.
    veredito: FECHADA — E BEM

  # ───────────────────────────────────────────────────────────────────────────
  # 2. A fixture é honesta? — e resiste a mexerem no CITACAO_MAX?
  # ───────────────────────────────────────────────────────────────────────────
  c1_honestidade_da_fixture:
    procedencia:
      medido: >
        `FALA_DA_IVONE` tem **1.981 chars** e é a fala real — o `SELECT` de hoje devolve
        `max(length(value #>> '{}')) = 1981` em `visit_availability`. **Bate exatamente.**
        Ela passa pelo escritor REAL (`buildAgendaState`, `fonte: "mencao"`), não por `"x".repeat(279)`.
      nota_de_precisao: >
        O docstring da fixture (e a story, e o meu próprio R1) dizem *"2.103 chars"*. **1.981 é o
        comprimento da string; 2.103 é o comprimento do JSON serializado** (aspas + escapes). Os dois
        números são certos para perguntas diferentes, e o texto usa o segundo para descrever a
        primeira. Nit de documentação, não de fixture — mas é literalmente a classe de erro
        (*denominador não declarado*) que este gate já cobrou duas vezes. Ver A7.
    as_assercoes_negativas_discriminam:
      medido: >
        `"Portal das Torres"` está no índice **187** e `"preciso de segurança"` no **258** — os dois
        DENTRO dos 280 que o escritor grava e FORA dos 120 que o renderizador deixa passar. O 258 é a
        escolha boa: ele prova que o corte é em 120 e **não** em 280.
        `"Deus queira que eu não precise"` está no **459** — dentro dos 500 do caminho cru (teste b).
        Nenhuma das negativas é vácua.
    resiste_a_mudarem_o_CITACAO_MAX:
      pergunta: "se alguém mexer no 280, a régua fica frouxa em silêncio ou grita?"
      SONDA_K:
        forma: "`CITACAO_MAX` 280 → **100** (o escritor passa a cortar ABAIXO do teto de leitura — a direção que TORNARIA a fixture vácua)"
        resultado: "**3 vermelhos**, dois deles os testes da C1 — (a) e (c)"
        leitura: "a régua **GRITA**. Não vira verde-por-construção; ela se acusa."
      SONDA_L:
        forma: "`CITACAO_MAX` 280 → **500** (o escritor passa a permitir mais)"
        resultado: "**1 vermelho**, e ele é do teste da própria 87-4 — os da C1 ficam verdes"
        leitura: "**nenhum falso alarme**. A guarda continua valendo e a relação `escrita > leitura` continua verdadeira."
      veredito: >
        **`toBeGreaterThan(VALOR_MAX_CHARS)` é a escolha certa e está PROVADA nos dois sentidos.**
        `toBe(280)` teria dado vermelho em K **e** em L — ruído na direção inofensiva. O que a
        asserção fixa é a **relação entre as duas réguas**, que é o que torna a guarda load-bearing;
        o número da escrita é livre para mudar. Resiste.

  # ───────────────────────────────────────────────────────────────────────────
  # 3. A C2 foi republicada certo? — conferida por REMEDIÇÃO, não por amostragem
  # ───────────────────────────────────────────────────────────────────────────
  c2_republicacao_da_contagem:
    metodo: >
      O lead pediu amostragem. **Rodei a bateria INTEIRA** (M0–M7 + F), cada uma na suíte da RAIZ,
      `aplicar · rodar · ler os nomes · reverter · conferir md5`. É mais barato que escolher amostra
      e defender a escolha.
    tabela_conferida:
      #        publicado P1 / P2      medido por mim (raiz)   confere
      M0: "4 / 6    →  **6** na raiz, 4 nos dois arquivos   ✓"
      M1: "12 / 14  →  **14** na raiz, 12 nos dois arquivos ✓"
      M2: "10 / 10  →  **10**                               ✓"
      M3: "6 / 6    →  **6**  (era 3 no R1)                 ✓"
      M4: "2 / 2    →  **2**                                ✓"
      M5: "3 / 3    →  **3**                                ✓"
      M6: "8 / 10   →  **10** na raiz, 8 nos dois arquivos  ✓"
      M7: "8 / 8    →  **8**  (era 5 no R1)                 ✓"
      F:  "2 / 2    →  **2**  (era 0 no R1)                 ✓"
    resultado: "**9 de 9 batem, número a número.** Nenhuma casa fora."
    a_divergencia_e_nominal: >
      Confirmada e nomeada: só M0, M1 e M6 divergem entre as duas populações, e os `+2` são
      **sempre** `AC10 > turno-ouro (a)` e `(b)` de `pipeline-corretor-no-historico.test.ts` — eu li
      as listas de nomes de M0, M1 e M6 uma a uma, não só os totais.
    a_bateria_INTEIRA_foi_remediada: >
      Confirmado, e este era o ponto: ele **não** consertou só as três cobradas. **M3 foi de 3 → 6** e
      **M7 de 5 → 8** por causa dos três testes novos, e ele republicou os dois. Publicar M0/M1/M6
      corrigidos deixando M3/M7 velhos seria o mesmo defeito com outro nome — e ele escreveu isso
      com essas palavras antes de eu perguntar.
    ressalva_de_precisao: >
      Dos 6 vermelhos de M3, o @dev conta "5 comportamentais + 1 de constante". O **(c)** cai em M3
      por **aritmética da própria fixture** (`noLimite = FALA_DA_IVONE.slice(0, VALOR_MAX_CHARS)`
      passa a fatiar 10.000), não porque M3 tenha quebrado a fronteira. Ele **declarou exatamente
      esse mecanismo** no texto (*"assertam a linha inteira e escrevem a expectativa em função de
      `VALOR_MAX_CHARS`"*), então não é contagem inflada — é contagem explicada. Fica registrado só
      para que ninguém leia "5 comportamentais" como "5 guardas independentes".
    veredito: FECHADA — ALÉM DO COBRADO

  # ───────────────────────────────────────────────────────────────────────────
  # 4. Nada de produção mudou depois do gate?
  # ───────────────────────────────────────────────────────────────────────────
  producao_intocada:
    md5_declarado: "collected-data.ts → dd55a5e2d9bfae89ce16b7d4dd0ad0d4"
    md5_medido:    "collected-data.ts → **dd55a5e2d9bfae89ce16b7d4dd0ad0d4**  ✓ · pipeline.ts → e4eb99a82f74e8e6f2c991802dd9a3ee ✓"
    mas_md5_so_prova_que_bate_com_o_declarado: >
      Certo — então corroborei por **quatro** caminhos que não dependem da palavra dele:
      **(a) Âncoras de linha do meu próprio R1.** O R1 citou `collected-data.ts:160` para o
      `truncar(state.citacao)`, `agenda-state.ts:190` para o `citacao: o.citacao` sem relimite,
      `pipeline.ts:734` para a chamada do `buildSystemPrompt` e `:801` para o `nowAgenda`.
