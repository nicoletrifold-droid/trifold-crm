# ACHADO NOVO — e ele é dívida MINHA, não do @dev
# ═══════════════════════════════════════════════════════════════════════════════
achados_do_R2:

  - id: A6
    severidade: MEDIA-BAIXA
    categoria: tests
    titulo: "A guarda órfã do truncamento tem uma IRMÃ, e ela continua órfã: o sítio dos ROTULADOS"
    o_padrao: >
      `truncar()` tem **TRÊS** sítios de chamada, e **M3 muta a CONSTANTE compartilhada** — ou seja,
      M3 acende os três de uma vez e **mascara** que cada sítio, isolado, pode não ter vermelho
      nenhum. É o curto-circuito clássico. No R1 eu isolei **um** dos três (a citação, `:160`),
      publiquei a guarda órfã e **parei ali**. Os outros dois eu nunca isolei.
    medido_agora:
      SONDA_F: "`:160` citação  → **2** vermelhos (era 0; fechado pela C1)"
      SONDA_I: "`:184` ROTULADOS → 🔴 **ZERO vermelhos em 2.445 testes**"
      SONDA_J: "`:196` extras    → **2** vermelhos (`profissao` e `cidade_bairro`) — coberto"
    nao_e_mutante_equivalente: >
      Provado por execução direta, com a guarda presente e ausente, sobre a mesma fixture:
      ```
      guarda presente  → linha "- Nome:" = 129 chars · reticência: sim · "Portal das Torres": não
      SONDA I aplicada → linha "- Nome:" = 1989 chars · reticência: não · "Portal das Torres": SIM
      ```
      **1.989 chars de prosa livre entram inteiros no prompt e nenhum dos 2.445 testes pisca.**
      É exatamente a classe de dano que esta story existe para remover.
    e_alcancavel_em_producao: >
      Hoje **não** — `SELECT` de 16/08: dos 8 rotulados, o maior valor de produção é `name` com **49**
      chars (`property_interest` 6, `source` 8, `floor` 5, `view` 6, `has_down_payment` 5,
      `garages` 1, `bedrooms` 1). Zero acima de 120. **Nenhuma exposição hoje** — igual à A1.
      Mas é alcançável pelo mesmo mecanismo já observado: quem escreve esses campos é o modelo, e a
      fixture **da própria story** (`ESTADO_DA_IVONE`) tem `name: "Tudo"` — o retrato de que o modelo
      escreve lixo em `name`. Os 1.981 chars foram escritos pelo mesmo escritor na chave vizinha.
    de_quem_e: >
      **Minha.** A A6 existia idêntica no R1 e eu não a vi: achei o primeiro órfão atrás do
      curto-circuito e publiquei o achado sem enumerar os outros sítios do mesmo helper. O @dev
      cumpriu a C1 **como escrita**, e cumpriu bem — o critério de aceite era *"a sonda F passar a dar
      ≥ 1 vermelho"*, e ele entregou 2, com as duas procedências separadas. Não há nada a cobrar dele
      sobre a A6 além de fechá-la agora.
    recomendacao: >
      Uma asserção a mais no `describe` que já existe: `renderDadosColetados({ name: FALA_DA_IVONE })`
      → a linha `- Nome:` sai com 120 chars + `…`. Custa ~5 linhas e faz a SONDA I ficar vermelha.
      **Antes da 87-10**, pelo mesmo motivo da C1.
    dono: "@dev"
    bloqueia_merge: false

  - id: A7
    severidade: INFORMATIVO
    categoria: docs
    titulo: "`2.103` é o comprimento do JSON, não da fala — o número viaja errado desde o @po"
    evidencia: >
      A fala da Ivone tem **1.981 chars** (medido no banco com `#>> '{}'` e na fixture com
      `String.length` — os dois batem). **2.103** é `length(value::text)`, com aspas e escapes.
      O número 2.103 aparece como *"chars da fala"* no docstring do módulo, no docstring da fixture,
      na story, no parecer do @po e **no meu próprio R1**.
    julgamento: >
      Sem consequência de código — nenhuma asserção usa 2.103. Registro porque é a mesma classe do
      A2: **um número publicado sem o denominador que o produziu**, e este atravessou quatro
      documentos sem ninguém remedir. Corrigir no docstring quando alguém encostar no arquivo.

  - id: A8
    severidade: INFORMATIVO
    categoria: tests
    titulo: "Duas mutações de vermelho ZERO que NÃO são achado — mutantes equivalentes, e por quê"
    evidencia: >
      Sondei mais duas guardas do mesmo módulo procurando irmãs da A6. As duas deram **0 vermelhos**,
      e as duas são **equivalentes**, não frouxidão:
      **SONDA N** (`Number.isFinite(valor)` → sempre verdadeiro): `collected_data` vem de `jsonb`, e
      `jsonb` **não representa** `NaN`/`Infinity`. O ramo é inalcançável pelo caminho real; a guarda é
      defesa contra um chamador não-jsonb futuro.
      **SONDA O** (`AGENDA_STATE_KEY` sai de `NAO_RENDERIZAVEIS`, sozinho): o `agenda_state` cai no
      laço dos extras, onde `valorEscalar(objeto)` devolve `null` — a **guarda estrutural absorve**.
      Comportamento idêntico.
    julgamento: >
      Registro para que a próxima rodada não conte estes dois como órfãos e infle o achado. Mas há
      uma nota real na SONDA O: `AGENDA_STATE_KEY` no `Set` e a guarda estrutural do `valorEscalar`
      protegem **o mesmo ativo em série** — qualquer uma das duas pode ser removida sozinha sem um
      único vermelho; só a remoção do **par** vaza o `agenda_state` como `[object Object]`. É defesa
      em profundidade funcionando, e nenhum teste fixa o par. Não vale régua nova; vale saber.

