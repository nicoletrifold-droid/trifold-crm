  **CONCERNS mantido — e é preciso dizer com clareza de quem é a dívida.**
  **As duas condições cobradas estão fechadas, e fechadas melhor do que o cobrado.** A C1 tirou a
  guarda da citação de 0 para 2 vermelhos com fixture de procedência real (a fala da Ivone pelo
