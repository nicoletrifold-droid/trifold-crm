# ────────────────────────────────────────────────────────────────────────────
# As três derrubadas do @dev — julgadas uma a uma
# ────────────────────────────────────────────────────────────────────────────
derrubadas_do_dev:

  D1_regua_de_grep_da_AC1:
    afirmacao: "a régua da AC1 é inatingível como escrita; população A = 0 e 0, população B = 0 e 5"
    medido:
      populacao_A_producao_sem_test:
        - "grep -F 'JSON.stringify(state.collected_data)' … | grep -v '.test.ts' → 0"
        - "grep -F 'Data collected so far' … | grep -v '.test.ts'               → 0"
      populacao_B_crua:
        - "JSON.stringify(state.collected_data) → 0  (zero mesmo cru)"
        - "Data collected so far                → 5, e as CINCO são as nomeadas por ele:"
        - "  pipeline-collected-data.test.ts:237   asserção de ausência (lista MAQUINARIO)"
        - "  pipeline-collected-data.test.ts:307   o bloco do HEAD capturado, literal"
        - "  pipeline-collected-data.test.ts:317   o filtro semJsonCru() que produz a régua da AC7"
        - "  pipeline-collected-data.test.ts:342   'a régua não nasce satisfeita'"
        - "  pipeline-corretor-no-historico.test.ts:1066  a aritmética do +119"
    veredito: DECOMPOSIÇÃO HONESTA
    julgamento: >
      Não esconde ocorrência real. Li as cinco linhas uma a uma: as cinco são **asserções ou o HEAD
      capturado**, e as cinco são load-bearing — tirar qualquer uma tira uma régua. O argumento
      estrutural dele está certo e é geral: **um teste que asserta a ausência de uma string precisa
      conter a string**, então uma régua de `grep` sem recorte de população é inatingível com testes
      honestos. A população de produção é 0 e 0 **sem interpretação nenhuma**, que é exatamente o que
      a AC1 exige de uma régua. O que ele fez não foi afrouxar a régua: foi declarar o denominador
      dela.

  D2_mutacao_da_AC6_falsificada:
    afirmacao: >
      "subir VALOR_MAX_CHARS 120 → 10.000 NÃO derruba a AC3-(i); a fala da Ivone some pelo FILTRO de
      LEGACY_AGENDA_KEYS, não pelo truncamento — duas guardas disjuntas que a story tratava como uma"
    reproducao:
      M3_teto_120_para_10000:
        vermelhos: 3
        lista:
          - "AC6 > os números são 120 e 12                                    (asserção de CONSTANTE)"
          - "AC6 > valor escalar acima de 120 chars entra TRUNCADO             (comportamental)"
          - "AC6 > 🔴 prosa de produção numa chave NÃO-legada é truncada      (comportamental, dado real)"
        ac3_i_caiu: false
      M5_filtro_de_legado_removido:
        vermelhos: 3
        lista:
          - "AC3 > 🔴 (i) NEGATIVO: nenhum fragmento dos 2.103 chars aparece  ← É ESTE"
          - "AC3 > o bloco da Ivone cabe em 4 linhas de dado"
          - "AC6 > estado vazio (ou só com chaves não-renderizáveis) devolve []"
    veredito: CONFIRMADO — E É O ACHADO MAIS IMPORTANTE DA STORY
    julgamento: >
      **A previsão da AC6 é falsa e eu reproduzi a falsificação.** Com o teto em 10.000 a AC3-(i)
      continua verde; quem a derruba é M5, e M3 não a toca. As duas mutações têm conjuntos de
      vermelhos **disjuntos** — não há um único teste em comum entre M3 e M5. A conflação estava na
      story, não na implementação.
      A correção dele é a correta e é a mais forte disponível: prosa longa numa chave **não-legada**
      é onde o truncamento é a **única** guarda, e é cenário real, não hipotético (os extras são
      texto livre do Haiku do cron). Ele usou a mesma prosa de produção, o que torna o vermelho
      comparável ao dano medido.
      **Este é o item que o lead marcou como "sem isso, subir o teto passaria por você". Passaria
      mesmo: eu conferi a AC6 como escrita e ela fica verde.**

  D3_premissas_da_AC9:
    afirmacao: >
      "NICOLE_LASTRO_DIARIO não é 0 all-time (são 6) e há CINCO event_type NICOLE% com contagem > 0;
      mas M1/M4 trazem denominador: 0 nos três últimos relatórios, logo o item 1 da AC9 é INERTE"
    medido_por_mim_16_08:
      eventos_NICOLE:
        - "NICOLE_LASTRO_DIARIO ......... 7   10/08 11:38 → 16/08 11:38   (a story diz 0 all-time)"
        - "NICOLE_HISTORY_TRUNCATED ..... 6   14/08 13:20 → 15/08 12:28"
        - "NICOLE_SLOT_UNAUTHORIZED ..... 2   10/08 00:13 → 10/08 00:14   ← baseline CONFIRMADO"
        - "NICOLE_AFIRMACAO_SEM_LASTRO .. 1   10/08 11:38"
        - "NICOLE_AGENDA_STATE_EXPIRADO . 1   13/08 18:31"
      denominador_dos_3_ultimos_relatorios:
        - "16/08 11:38 → denominador: 0 · total_disparos: 0 · com_lastro: 0 · lastro_pct: 0"
        - "15/08 11:38 → denominador: 0 · total_disparos: 2 · com_lastro: 0 · lastro_pct: 0"
        - "14/08 11:38 → denominador: 0 · total_disparos: 2 · com_lastro: 0 · lastro_pct: 0"
    veredito: CONFIRMADO NAS DUAS METADES
    julgamento: >
      São **cinco** `event_type` `NICOLE%` com contagem > 0, e o `NICOLE_LASTRO_DIARIO` está em **7**
      (subiu 6 → 7 com o cron das 11:38 de hoje, entre a medição dele e a minha). A premissa da story
      de que "o cron nunca executou" está morta.
      E a segunda metade é a que importa: **`denominador: 0` nos três últimos**, inclusive nos dois
      dias em que houve `total_disparos: 2`. Ler *"M1/M4 sem aumento"* sobre denominador zero é verde
      por construção — é a mesma classe da janela de 24 h sem poder estatístico que este epic já
      recusou duas vezes. **Assino: o item 1 da AC9 é INERTE e não pode ser publicado como
      evidência.**
      **O que sobra sustenta a janela?** Sim, com ressalva. `NICOLE_SLOT_UNAUTHORIZED` tem baseline
      **sólido e verificado** (2 all-time, os dois em 10/08 00:13–00:14) e é o único evento com
      semântica direta sobre o objetivo da story — mas ele é **raro**, e 24 h de silêncio nele não
      distinguem "não regrediu" de "não mediu". O que de fato sustenta a janela é a **amostragem
      dirigida**: medi **67** conversas com `length(collected_data::text) > 120` em produção, e o @po
      mediu **51,3 %** dos turnos acima de 120 chars. Com `n ≥ 5` isso é população suficiente, e é a
      única das três réguas que consegue detectar o gatilho de rollback específico desta story (a
      Nicole reperguntar dado que já estava no `collected_data`). **A janela fica de pé apoiada na
      amostragem, não no evento.** Isso precisa estar escrito para Marcos, porque a AC9 lista as três
      como se pesassem igual.

