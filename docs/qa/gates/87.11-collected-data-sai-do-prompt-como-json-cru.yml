metodo: >
  Nada foi aceito por relato. Cada régua foi rerodada; cada mutação foi reaplicada por script
  (`aplicar · rodar a SUÍTE DA RAIZ · ler · reverter · conferir md5`), com backup por cópia e não por
  `git stash`. Além das 8 mutações da story, apliquei **8 sondas minhas** que a story não pede.
  As leituras de produção (`dsopqkqjkmhytudaaolv`, Management API) são **somente SELECT**.
  Árvore conferida por `md5` no início e no fim: **8 de 8 arquivos idênticos**, incluindo os três do
  deploy B.

