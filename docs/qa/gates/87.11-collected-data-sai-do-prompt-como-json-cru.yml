status_reason: >
  **Reproduzi tudo do zero, e tudo o que o @dev declarou reproduz.** As três coisas que ele derrubou
  da própria story estão certas, e a segunda delas é um achado de verdade: **a mutação prevista pela
  AC6 é falsa** — subir `VALOR_MAX_CHARS` de 120 para 10.000 **não** derruba a AC3-(i), porque a fala
  de 2.103 chars da Ivone mora em `visit_availability`, que some pelo **filtro** de
  `LEGACY_AGENDA_KEYS` e não pelo truncamento. Medi as duas guardas separadas (M3 e M5) e elas são
  **disjuntas**: M5 derruba a AC3-(i), M3 não a toca. A régua que ele acrescentou — prosa de produção
  numa chave **não-legada** — é a única que fica vermelha quando o teto sobe. Sem ela, subir o teto
  para 10.000 teria passado por um QA que conferisse a AC6 como escrita.
  As réguas batem sem margem: suíte **190 arquivos / 2.441 passed / 6 expected fail**, `tsc --noEmit`
  **0** em `ai` e **0** em `web`, lint **0 errors / 23 warnings**, `git diff` **0 linhas** nos quatro
  arquivos protegidos, `grep` da AC1 **0/0** na população de produção e **0 e 5** na crua com as
  cinco linhas nomeadas conferindo uma a uma. Os três arquivos do **deploy B da 87-5** estão com
  `md5` idêntico ao declarado, **antes e depois** de oito mutações minhas. Os sítios 2 e 3 continuam
  abertos, como manda o escopo. Os dois hashes-ouro da 87-5 **não** são gravação circular: provei nos
  dois sentidos, e a aritmética do +119 fecha por conta própria (144 + 1 + 11 − 37).
  **O que não fecha são duas coisas, nenhuma delas defeito de código.**
  **(1) O truncamento da `citacao` do `agenda_state` é uma guarda ÓRFÃ:** removi o `truncar()` da
  linha de agenda e a suíte inteira ficou **verde — zero vermelhos em 2.441 testes**. A guarda
  funciona (medi: 279 chars entram como 120 + `…`) e `CITACAO_MAX = 280` a limita **na escrita** — mas
  `parseAgendaState` **não** relimita na leitura, e 280 > 120. É a única linha do bloco novo cujo
  comprimento nenhuma fixture exercita, numa story cujo objeto é justamente impedir prosa longa de
  entrar no prompt. Todas as outras guardas do módulo têm vermelho dedicado; esta não tem nenhum.
  **(2) A contagem de vermelhos publicada é de população estreita.** M0 derruba **6** na suíte da
  raiz, não 4; M1 derruba **14**, não 12; M6 derruba **10**, não 8. A diferença é sistemática e são
  sempre os mesmos dois testes — os hashes-ouro da 87-5. É **subestimação**, não inflação, e por isso
  não muda o veredito; mas a AC8 pede `npx vitest run` **da RAIZ** e os números publicados são de
  dois arquivos, sem a população declarada ao lado. É a mesma classe de erro que o próprio @dev
  consertou na régua de `grep` da AC1, reaparecida na régua vizinha.
  Nada disso bloqueia o deploy. As duas se fecham em menos de uma hora, e a primeira é a que eu
  quero fechada antes de a `87-10` escrever chave nova em cima deste renderizador.

