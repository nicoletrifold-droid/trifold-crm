corpo_do_pr: |
  ## O que este PR faz
  Os dois scripts de conciliação do Sienge liam `packages/web/.env.local` por caminho literal —
  arquivo que foi renomeado para `packages/web/.env.producao.local`, completando nesta máquina o
  desenho que a Story 900-3b já tinha estabelecido no código. Eles passam a ler o nome novo. Junto,
  o comentário de uso do `pipeline-diag.mjs` para de documentar um comando que **não inicia**.

  **3 arquivos, +7 −6, zero mudança de lógica** (um literal de caminho e dois comentários). Sem
  migration, sem variável de ambiente nova, sem arquivo criado ou removido.

  | Arquivo | Mudança |
  |---|---|
  | `scripts/sienge-recto-liquido-check.ts` | linha 72: caminho do `loadEnv`; linhas 69-71: comentário |
  | `scripts/sienge-conciliar-extrato-pdf.ts` | linha 71: caminho do `loadEnv` |
  | `packages/web/scripts/pipeline-diag.mjs` | linha 2: comentário de uso + linha nova com a alternativa de teste |

  ## O defeito, medido
  O `loadEnv()` dos scripts é `try { readFileSync } catch { return false }` — **engole o ENOENT** e
  falha uma linha depois, numa mensagem que não menciona arquivo nenhum:

  ```
  Faltam variáveis de ambiente: SIENGE_SUBDOMAIN, SIENGE_USERNAME, SIENGE_PASSWORD, NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
  ```

  Já o `pipeline-diag.mjs` documentava `node --env-file=packages/web/.env.local …`, e o Node
  **recusa iniciar** com `--env-file` inexistente: `node: packages/web/.env.local: not found`,
  **exit 9**. Não era comentário morto, era comando quebrado.

  ## Por que trocar o literal e não migrar para `resolverAmbiente()`
  Decisão do @sm, registrada na story e não reaberta no gate: os dois scripts são **só leitura** e
  só fazem sentido contra produção **por desenho** (não existe credencial de Sienge de teste em
  lugar nenhum do repositório, por decisão deliberada), e `resolverAmbiente()` não resolve
  credencial de Sienge — a guarda `TRIFOLD_ALLOW_PROD=1` só é exigida quando `escreve: true` e nem
  seria acionada. **Gatilho para reabrir, documentado:** se algum dos dois ganhar caminho de escrita
  no Supabase. Verificado no gate que nenhum dos dois escreve hoje.

  ## Evidência (QA, rodada 1 — PASS)
  - **AC2, a prova central — mudança de FORMA da saída, com controle negativo:**
    `DEPOIS` (HEAD) → `SIENGE_SUBDOMAIN, SIENGE_USERNAME, SIENGE_PASSWORD` (3), EXIT=1.
    `ANTES` (versão de `origin/main` rodada de dentro de `scripts/`, mesmo `__dirname`) → as
    **5** variáveis, EXIT=1. As duas do Supabase só saem da lista se o arquivo foi achado **e** as
    chaves têm valor não-vazio (o filtro é `!process.env[k]`). Contaminação de shell descartada
    antes: as 5 não existiam no ambiente.
  - **AC3 sem sonda redigitada:** corpo do `loadEnv` byte-idêntico entre os dois scripts
    (sha256 `c39f38dc…`) e linha de chamada byte-idêntica (sha256 `036aa258…`), ambos em
    `scripts/` ⇒ a medição do AC2 transfere. Somado a isso, prova em runtime **contra o arquivo
    real** via `process.on('exit')` injetado por `NODE_OPTIONS`: `SUPA_URL_SET=true SRK_SET=true`,
    e `false/false` na versão de `origin/main`.
  - **AC4 provado byte a byte:** com o nome do arquivo mascarado e as quebras de linha desfeitas, o
    comentário antes e depois é a **mesma string** — a explicação da armadilha (`vercel env pull`
    devolve variável `sensitive` **vazia, sem erro**) está preservada palavra por palavra.
  - **AC5:** `--env-file` com `.env.producao.local` → EXIT=0; com `.env.development` → EXIT=0; com o
    caminho antigo → EXIT=9 `not found`. A alternativa de teste é real (as duas variáveis exigidas
    existem e não estão vazias) e o script rodou **de ponta a ponta** contra o banco de teste
    (EXIT=0, 99 linhas).
  - **AC6:** nenhum arquivo de env tocado ou commitado — `--name-only | grep env` devolve só 2
    `.md`; `git check-ignore --no-index` confirma os 5 envs ignorados e `git ls-files` só rastreia
    os `.example`. Varredura do repositório inteiro: **zero** leitor vivo de
    `packages/web/.env.local` sobrando.
  - **Gates:** `pnpm test` reexecutado fresco → **EXIT=0**, 327 arquivos, 4633 passed | 6 expected
    fail (reproduz o número do @dev); `vitest run scripts/` → EXIT=0, 144 testes; `eslint` no
    `.mjs` alterado → EXIT=0, 0 errors/0 warnings, com o alcance do linter provado por sonda.
    `turbo lint/type-check/build` não foram reexecutados por mim: medi que `scripts/` da raiz está
    fora de toda task do turbo (a raiz não é workspace) e que o `include` do tsconfig do web não
    cobre `.mjs` — nenhuma das 3 mudanças é alcançável por eles. Quem cobre é a execução real.
  - **Custo:** zero chamada à API do Sienge. Confirmado `grep -c '^SIENGE'
    packages/web/.env.producao.local` → `0` antes de rodar, então os scripts param no filtro de
    `REQUIRED`, anterior a qualquer `fetch`. Nada escrito em produção.

  ## Ressalvas (todas `low`, nenhuma bloqueante)
  `DOC-001` a nota do AC6 na story diz "5 removidas / 6 adicionadas"; o medido é **6 / 7** ·
