notas_de_processo:
  P1: >
    **Terceira story seguida em que uma contagem declarada não sobrevive à remedição** — 87-4 (M4:
    1 declarado, 0 real), 87-7 (M-AC1: 5 declarado, 11 real), 87-8 (vermelho 2: "1 failed | 17
    passed (20)", real "1 failed | 19 passed (20)"). Aqui é o caso mais leve dos três: a contagem de
    FALHAS está certa nas três mutações, e é a que decide. Mas o aritmeticamente-impossível
    (1+17≠20) passou pelo autor — colar a saída do reporter em vez de transcrevê-la fecha essa
    classe inteira de uma vez.
  P2: >
    A AC4-(iii) troca a asserção ABSOLUTA que a AC pede ("nenhuma consulta a mais") por uma
    DIFERENCIAL (longa − curta = 1). O @dev justifica por escrito, e a diferencial de fato
    discrimina contra o `HEAD` (ela cai em V1). O que ela não pega é uma consulta acrescentada às
    DUAS pontas. Coberto por leitura de código — as consultas extras estão dentro de
    `if (truncou)`, com retorno antecipado antes — e pela AC10. Aceito como está.

