  V2_vermelho_2_a_guarda_da_AC4:
    metodo: "cauda aplicada, `|| jaFalouForaDaJanela` removido de `buildNoReintroContext`"
    declarado: "1 failed | 17 passed (20)"
    medido: "1 failed | **19** passed (20)"
    resultado: CONFERE_NA_SUBSTANCIA
    nota: >
      **É o vermelho mais importante da story e ele é real:** cai exatamente um teste, a AC4-(i)
      ("cauda-20 toda do lead, fala dela na posição 2 → bloco continua emitido"), e nenhum outro. O
      `HEAD` não produz esse vermelho — o problema NASCE com a correção, e a guarda é a resposta.
      Não é decorativa. O "17 passed" declarado é aritmeticamente impossível (1+17≠20); a contagem
      de FALHAS, que é a que importa, está certa. Terceira story seguida em que uma contagem
      declarada não sobrevive à remedição — ver nota de processo P1.

  V3_vermelho_3_deploy_B:
    metodo: "`git show HEAD:…/enrich-leads/route.ts`, teste intacto"
    declarado: "2 failed | 16 passed (18)"
    medido: "2 failed | 16 passed (18)"
    resultado: CONFERE

  V4_armadilha_a_o_fake_guardava_so_o_ultimo_order:
    era_real: SIM
    metodo: "`git show HEAD:…/__fixtures__/fake-supabase.ts` com o `pipeline.ts` da branch"
    medido: "2 failed | 151 passed — e a AC1 passa VERDE"
    nota: >
      A armadilha é mais sutil do que "passaria nos dois mundos", e é pior: com o fake do `HEAD` a
      AC1 fica **verde sem que a ordenação por `created_at` jamais tenha sido exercitada**. O fake
      guardava só o último `.order()`, que é o `id`; como as fixtures usam `id` ZERO-PADDED
      (`msg-01`…`msg-25`), a ordem por `id` COINCIDE com a ordem por `created_at` e o resultado é
      idêntico. O `created_at` vira decoração. As 2 falhas restantes vêm da ausência de
      `select(…, {count, head})`, não da ordenação. **A correção é necessária e o fake agora empilha
      os predicados de verdade** — provado por V6: tirar o segundo `.order()` do código de produção
      MUDA o resultado do fake.

  V5_armadilha_b_o_mock_do_cron_ignorava_order_e_limit:
    era_real: SIM
    metodo: "`if (orders.length > 0)` → `if (false)` no builder do `route.test.ts`, semeadura mantida"
    medido: "3 failed | 15 passed (18) — os TRÊS testes novos da AC8 caem"
    nota: >
      O mock honra `order`/`limit` de verdade; se parar de honrar, os três testes do deploy B ficam
      vermelhos na hora. Correção load-bearing.

  V6_desempate_por_id_NAO_TEM_TESTE_QUE_DISCRIMINE:
    era_real: NAO_COBERTO
    severidade: MEDIA
    metodo: "removi `.order(\"id\", { ascending: false })` de `pipeline.ts` E de `enrich-leads/route.ts`"
    medido: "38 passed (38) — **verde nas duas esteiras**"
    nota: >
      O teste chamado *"empate de created_at é desempatado por id (Armadilha 1)"* **não consegue
      falhar pelo motivo que nomeia**: ele roda o mesmo turno duas vezes e exige que os dois batam,
      mas o `sort` do fake é ESTÁVEL — dois runs idênticos sempre concordam, com ou sem desempate.
      **E o desempate É load-bearing, só que por outro motivo:** sem ele o grupo empatado volta
      INVERTIDO. Provei: acrescentando uma linha ao teste —
      `expect(primeiro.historico).toEqual(Array.from({length:20},(_,i)=>` + "`m${i+3}`" + `))` —
      o teste fica VERMELHO sem o `.order("id")` (recebe `…m9, m12, m11, m10, m13…`) e VERDE com
      ele. Uma linha em cada esteira transforma um teste decorativo num teste real.
      O do cron tem o mesmo buraco: só afirma o ÚLTIMO elemento.

  V7_lastAssistantMsg_e_a_regra_de_corte:
    resultado: CONFERE
    nota: >
      `isVisitSchedulingMode` (90-101) e `NICOLE_TALKED_VISIT_RE` (74-75) INTOCADOS — conferido no
      diff. O único acréscimo de decisão é o `|| jaFalouForaDaJanela` do `buildNoReintroContext`,
      que é MONOTÔNICO (só pode suprimir uma reapresentação, nunca provocar): não abre caminho
      novo, alarga uma supressão que já existia. A AC2 discrimina nas duas direções — os dois
      testes do par caem sob o `HEAD` (V1). Regra de corte da Onda 1: **respeitada**.
      O `history` que vai para a Anthropic é projetado explicitamente (`history.map(msg => ({role,
      content}))`, linha 1036) — o `created_at` novo do `select` **não** vaza para o payload nem
      para o custo de token.

  V8_suite_tipos_grep:
    suite_branch: "1887 passed | 7 expected fail (1894) — rodada da RAIZ"
    delta: "+23 = 20 (deploy A) + 3 (deploy B); 1887 − 23 = 1864, que é a referência da AC11"
    tsc_ai: "0 erros"
    tsc_web: "13 erros, todos pré-existentes (satori/sharp/pdf-lib), NENHUM nos arquivos tocados"
    grep_AC8_iii: "0 (baseline no HEAD: 2) ✅"
    arvore: "restaurada byte a byte depois das mutações — md5 conferido nos 5 arquivos"

