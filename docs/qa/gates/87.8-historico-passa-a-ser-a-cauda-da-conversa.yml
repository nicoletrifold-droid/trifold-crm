    appointments_nicole_90d: 6
    appointments_nicole_ultimo: "2026-07-31 01:05:32+00 (9 dias atrás)"
    contador_de_bloco_SISTEMA: "NÃO EXISTE — nenhum event_type do pipeline registra que o modo armou"
    system_events_NICOLE_pct: "0 all-time (o cron da 87-3 nunca rodou) — confirma o @dev e o @po"
    CLAUDE_RESPONSE_7d: 123
    enrich_leads_ultimo: "2026-08-09 18:30:13+00 · 27 conversas em 7 dias — o cron está VIVO"
    nota: >
      As duas premissas corrigidas no briefing se confirmam: o `emit` do pipeline chega ao
      `logEvent` (123 `CLAUDE_RESPONSE` em 7 d), e o `enrich-leads` está vivo e é observável por
