status_reason: >
  **O código está certo, e a evidência é a mais forte que este epic produziu.** Os três vermelhos
  declarados reproduzem exatamente — 12/20, 1/20 e 2/18 —, as duas armadilhas de harness que o @dev
  diz ter matado eram reais e as duas correções são load-bearing (provei desligando cada uma), os
  turnos-ouro da AC10 estão verificados contra o código do `HEAD` de verdade, o escopo é só leitura,
  suíte 1864 → 1887, `tsc` 0/13 pré-existentes, `grep` da AC8-(iii) em 0 com baseline 2.
  **O que não está certo é o INSTRUMENTO do risco de maior severidade.** A AC9-(ii) não consegue
  ficar vermelha em 24 h nas suas DUAS metades, e conferi as duas contra produção: `appointments`
  com `created_by='nicole'` são **3 em 30 dias** (último em 31/07, 9 dias atrás) e **não existe
  contador nenhum** de bloco `[SISTEMA]` de agendamento — listei todo `event_type` emitido pelo
  `pipeline.ts` e todo `event_type` gravado em `system_events` em 7 dias. É a mesma classe da
  `AC10-(ii)` da 87-7, e o precedente que eu mesmo assinei ali é explícito: AC que descreve o
  instrumento errado, e que o @dev não pode editar porque AC é do @po, fecha em **CONCERNS com
  condição nomeada por dono**, não em PASS — senão a janela de observação roda com a régua que já se
  provou inerte.
  **Fui além de declarar inerte: medi retrospectivamente o que a AC9-(ii) queria medir.** Para cada
  uma das 90 respostas cegas em 90 dias comparei o `lastAssistantMsg` que o código vê hoje (cabeça-20)
  com o que passará a ver (cauda-20). Em 30 dias o gate de agendamento arma **menos**, não mais
  (18 → 14): **3 turnos passam a ligar** e **7 deixam de ligar**. A previsão do @architect não se
  sustenta na população, e a direção de risco vale **0,1 turno/dia** — uma janela de 24 h produz
  zero, e zero não distingue "não aconteceu" de "não mede".
  Sobram, além disso, um teste nomeado que não consegue falhar pelo motivo que nomeia (o desempate
  por `id`, nas DUAS esteiras) e um número de dano publicado que não é nenhum dos dois oferecidos.
  Nenhum dos três é defeito de código; os três se fecham em menos de uma hora.

