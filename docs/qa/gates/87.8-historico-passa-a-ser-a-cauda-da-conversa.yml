condicoes_para_PASS:
  C1:
    dono: "@dev"
    custo: "~10 min"
    o_que: >
      Fechar o F1: acrescentar a asserção de SEQUÊNCIA COMPLETA ao teste de empate, nas duas
      esteiras (`pipeline-historico-cauda.test.ts` e `enrich-leads/route.test.ts`). Colar o
      vermelho: removendo `.order("id", { ascending: false })` o teste TEM de falhar. Hoje ele fica
      verde, medido.
  C2:
    dono: "@po"
    custo: "reescrita de AC, sem código"
    o_que: >
      Reescrever a AC9-(ii). Duas saídas, e as duas servem:
      (a) trocar o instrumento pela régua retrospectiva do F3, que já tem baseline medido
          (30 d: arma 18 → 14; passa a ligar 3; deixa de ligar 7) — roda-se a mesma consulta antes
          e depois do deploy; ou
      (b) autorizar um contador `NICOLE_VISIT_MODE_ARMED` via `emit` — é OBSERVABILIDADE, não
          caminho de decisão, portanto não fere a regra de corte da Onda 1 (a própria story já
          acrescenta um `emit`).
      Em qualquer das duas, declarar o PISO: com `n < 5` a janela se estende, não se declara
      sucesso. E manter o gatilho de rollback como está — *aumento COM `M1` subindo*, nunca o
      aumento sozinho.
  C3:
    dono: "@dev"
    custo: "~2 min, texto"
    o_que: >
      Corrigir a T0 do Dev Agent Record com o F2: publicar as TRÊS leituras e nomear a certa —
      **51 respostas em 17 conversas** em 30 dias, com o método (`row_number()` sobre a conversa
      inteira, resposta dentro da janela). Manter 90 d = 90 em 28, que sobrevive.

liberacao:
  deploy_A: >
    **Pode sair com C1 e C3 fechados e C2 NOMEADO** — o código está certo e o risco 2 deixou de
    estar apenas não-medido: está limitado (3 turnos/mês na direção de risco). Mantém-se tudo o que
    a story escreveu: sozinho, 24 h, responsável nomeado (D7 — sem nome, não sai), amostragem manual
    de 10 conversas longas (AC9-iii), `M1`/`M4` pela régua do cron da 87-3 com `?dry=1`.
  deploy_B: >
    Sem alteração: ≥24 h depois do A, sozinho, com a amostra de 5 leads campo a campo (AC9-v) E a
    régua da `AC10-(ii)` da 87-7 repetida, pela razão que o @po escreveu — depois do B o `ai_summary`
    nasce da cauda, e cauda recente tem mais fala de agendamento que o começo da conversa.
  ordem_de_merge: >
    `enrich-leads/route.ts` é tocado por três stories. Conferi as regiões: 87-7 em `route.ts:27,
    89-110, 173-250` e `pipeline.ts:1565-1585`; 87-8 em `route.ts:62-69` e `pipeline.ts:201-225,
    504-587, 627, 1620+`. **Nenhuma linha em comum** — o relato do @dev procede. A ordem
    **87-7 → 87-8-A → 87-8-B → 87-5-A → 87-5-B** confere-se ANTES do merge.

