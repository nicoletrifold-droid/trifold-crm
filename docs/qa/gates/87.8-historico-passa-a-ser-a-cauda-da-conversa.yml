achados:
  F1:
    severidade: MEDIA
    titulo: "O desempate por `id` não tem teste que discrimine, nas DUAS esteiras"
    detalhe: "ver V6"
    dono: "@dev"
    custo: "uma linha em cada arquivo de teste"

  F2:
    severidade: MEDIA
    titulo: "A régua da T0: nem 43 nem 66. São 51."
    detalhe: >
      O @dev está CERTO em que a leitura A (43) subconta, porque `loadConversationHistory` não
      filtra por data: o `limit(20)` opera sobre a conversa inteira, não sobre a janela de 30 dias.
      **Mas a leitura B (66) superconta**, e superconta de um jeito específico: ela inclui respostas
      que aconteceram ANTES da janela, em conversas que apenas têm atividade dentro dela — atribui
      dano velho a uma manchete de "30 dias". A leitura honesta é a terceira, e é a que o código
      realmente descreve: `row_number()` sobre a conversa INTEIRA, contando só respostas cujo
      próprio `created_at` está na janela.
      Medido por mim (09/08, somente SELECT):
        A — rn na janela, resposta na janela ........... 43 respostas em 14 conversas
        C — rn na conversa inteira, resposta na janela .. **51 respostas em 17 conversas**  ← a certa
        B — rn inteiro, TODAS as respostas de quem esteve ativo .. 66 em 17
        D — 90 dias, rn inteiro, resposta na janela ..... 90 em 28  ✅ (o número da story sobrevive)
      A correção sobre o publicado (43/47) é de **+18,6 %**, não de +53 %. Não muda decisão nenhuma;
      muda o que fica escrito — e este epic já errou unidade/denominador quatro vezes.
    dono: "@dev (texto do Dev Agent Record) + @sm (§1 da story)"

  F3:
    severidade: ALTA_PARA_A_JANELA_DE_OBSERVACAO
    titulo: "A AC9-(ii) não consegue ficar vermelha em 24 h — nas duas metades"
    detalhe: >
      Confirmado contra produção (V9). Base ≈ 0,1 appointment/dia e ZERO contador de `[SISTEMA]`.
      **Substituto medido, com baseline pronto:** para cada resposta cega, comparar o
      `lastAssistantMsg` da cabeça-20 (hoje) com o da cauda-20 (depois) contra
      `NICOLE_TALKED_VISIT_RE`:
        | janela   | respostas cegas | arma HOJE | arma DEPOIS | passa a ligar | deixa de ligar |
        | 30 d     | 51              | 18        | 14          | **3**         | 7              |
        | 31-90 d  | 39              | 11        | 10          | 3             | 4              |
      Duas consequências:
      (a) **a previsão do @architect não se sustenta na população** — ver a cauda faz o modo
          agendamento armar MENOS (18 → 14), não mais; o que existe é churn, 10 turnos mudando de
          lado em 30 dias;
      (b) **a direção de risco vale 3 em 30 dias = 0,1/dia** — a janela de 24 h renderia zero, e
          zero não distingue "não aconteceu" de "não mede". Dimensionar por `n`, não por horas —
          a lição que a 87-7 pagou.
      Ressalva da minha medição, declarada: o regex em SQL é o `NICOLE_TALKED_VISIT_RE` SEM os
      `\b` e sem a alternativa `horários livres|disponíveis`, e exercita só a perna
      `lastAssistantMessage` de `isVisitSchedulingMode` (a única que esta story muda) — `visit_proposed`
      e a pendência de agenda não são simulados. É ordem de grandeza, não censo.
    dono: "@po (a AC é dele)"

  F4:
    severidade: BAIXA
    titulo: "`truncou` dispara em conversa de EXATAMENTE 20 mensagens"
    detalhe: >
      `truncou = linhas.length === limit`. Numa conversa de exatamente 20 nada foi truncado, mas
      roda a consulta `count` extra e sai um `NICOLE_HISTORY_TRUNCATED` com
      `total_na_conversa: 20, limite: 20`. Quem consultar a `M3` precisa filtrar
      `total_na_conversa > limite`, senão o denominador de *"0 ocorrências de cauda errada"* nasce
      poluído. Uma linha de nota na consulta da M3 resolve; não vale mudar código de leitura agora.
    dono: "@qa/@po — nota na M3"

  F5:
    severidade: BAIXA_BACKLOG
    titulo: "A esteira esquecida tem uma quarta e uma quinta cabeça — no agente do CRM (Epic 52)"
    detalhe: >
      O `grep` da AC8-(iii) é deliberadamente escopado em dois arquivos, e a story faz bem em
      escopar. Mas o MESMO defeito está vivo fora do escopo, nos dois lugares em que o agente do
      CRM monta contexto para o modelo:
        · `packages/web/src/lib/agent/context-builder.ts:1165-1170` — `v_lead_conversations`,
          `.order("message_created_at", { ascending: true }).limit(50)` → as 50 PRIMEIRAS;
        · `packages/web/src/app/api/agent/chat/route.ts:151-155` — `agent_chat_messages`,
          `.order("created_at", { ascending: true }).limit(20)` → o agente lê as 20 PRIMEIRAS
          mensagens da PRÓPRIA sessão de chat.
      Não é trabalho desta story. É item de backlog, e nasce com o vermelho pronto.
    dono: "@po — backlog"

  F6:
    severidade: BAIXA_CONDICIONAL
    titulo: "Fora de expediente o evento da AC7 não sai — hoje inócuo, amanhã não"
    detalhe: >
      O retorno antecipado de fora-de-expediente (`pipeline.ts:500-512`) acontece ANTES de
      `loadConversationHistory`: naquele caminho não há histórico nem evento. **Hoje é inócuo** —
      conferi: a `agent_config` de produção tem `{"hours": {}, "always_on": true}` e
      `business-hours.ts:41` devolve `true` sempre, então o ramo nunca dispara. Registrado porque,
      se `always_on` for desligado algum dia, **27 das 51** respostas cegas/30 d caem em horas em
      que o evento ficaria mudo, e o denominador da `M3` seria lido errado sem ninguém perceber.
    dono: "nota"

