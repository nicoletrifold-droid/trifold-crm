strengths:
  - >
    A medição veio ANTES da implementação e mirou o risco certo: se
    netReceiptValue descontasse administrativeFee/insuranceAmount, a mudança
    inverteria o sinal do erro. 1.299/1.299 baixas reais, script versionado.
  - >
    Teste de mutação executado e documentado (7 de 10 reprovam o comportamento
    antigo) — os testes provaram ser capazes de reprovar, não só de passar.
  - >
    Escolha de usar netReceiptValue direto em vez de recalcular a fórmula: menos
    superfície para divergir do ERP.
  - >
    O caso `netReceiptValue: 0` está testado, e justifica `??` em vez de `||` —
    desconto integral não pode cair no nominal.
  - >
    Débito da 75-369 (script de conciliação ad-hoc, não versionado) pago no mesmo
    PR.

