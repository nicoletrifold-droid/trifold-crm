issues:
  - id: C1
    severity: medium
    category: code
    title: 'computeInformeFromStatements passa a misturar dois critérios'
    description: >
      O breakdown mensal do informe soma `receipt.receiptValue` cru (nominal) em
      client.ts:241-242, enquanto `accumulatedPaid` (linha 259) lê o agregado
      `i.receiptValue`, que esta story tornou líquido. Resultado: dentro da mesma
      função, `totalPaidInYear` fica nominal e `accumulatedPaid` fica líquido —
      a soma dos meses não fecha com o acumulado quando há juros ou desconto.
      A story afirma que "o informe acompanha automaticamente"; na prática só o
      acumulado acompanhou.
    impact: >
      Nenhum em produção: o informe está desativado (INFORME_RENDIMENTOS_ENABLED
      = false, lib/portal/features.ts:16). É dívida latente — morde quem religar
      a tela, e a incoerência não tem nenhuma razão de ser.
    recommendation: >
      Usar getCashReceiptValue nas linhas 241-242. Não pede decisão do financeiro
      nem cria pendência de critério fiscal: só faz a função inteira falar a
      mesma língua. Duas linhas.
    blocking: false
    status: RESOLVED
    resolution: >
      Corrigido em client.ts:244-246 — o mensal passa pelo mesmo
      getCashReceiptValue. Coberto pelo teste "baixas com juros e desconto: soma
      dos meses == acumulado, ambos líquidos"; mutação revertendo ao nominal
      reprova esse teste. Regressão completa reexecutada: vitest exit 0 (3.704
      passed), typecheck exit 0, lint exit 0.

