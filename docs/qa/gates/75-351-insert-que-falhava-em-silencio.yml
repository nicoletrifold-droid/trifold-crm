escopo: >
  Um insert que falhava 100% das vezes sem sintoma, matando a janela de cooldown de 48h por lead, mais
  o contador do cron que reportava entregas inexistentes. Achado ao VERIFICAR a 75-350 em produção —
  não por teste, por ir olhar o número no banco.

resumo: >
  **`follow_up_log.metadata` nunca existiu.** Dois dos três inserts da tabela mandavam a coluna, o
  PostgREST devolvia erro, e o código descartava o `{ error }` do `.insert()`. Prova em uma consulta:
  `alert_broker` 465 linhas (o único insert sem `metadata`), `nicole_sent` **0**, `post_visit` **0** —
  desde que a funcionalidade subiu.

  **O estrago não é o dado perdido, é o cooldown:** a janela de 48h por lead é lida dessa tabela, sem
  filtro de tipo. Sem a linha, o lead volta a ser elegível a cada run de 2 horas, indefinidamente.

  **Por que não virou spam:** a janela de 24h do WhatsApp barrava quase tudo (julho + agosto: 0
  entregas, 4.493 puladas). O defeito estava armado esperando conversas ativas — e as conversas ficaram
  ativas hoje. Conferido na run de 20:02: 84 puladas, todas por janela fechada, **zero entregas**,
  nenhum lead impactado.

status_reason: >
  Liberado para merge. A mitigação que importava (a coluna) já está em produção; o PR traz o conserto
  do padrão que esconde a falha.

acoes_obrigatorias: []

concerns:
  - id: C1
    severidade: MEDIUM
    tipo: padrão-que-se-repete-no-repo
    titulo: "`await supabase.from(x).insert(y)` descartando `{ error }` não é exclusividade deste arquivo"
    detalhe: >
      Esta story conserta os três inserts do caminho de follow-up, que era onde o defeito mordia. O
      PADRÃO, porém, está espalhado: `.insert()` sem `.select()` não lança, e todo lugar que ignora o
      retorno pode estar falhando em silêncio hoje. Uma varredura dirigida (inserts que alimentam
      cooldown, dedup ou idempotência) é candidata a story própria — não entrou aqui para o PR do
      incidente não virar refactor de repositório inteiro.
  - id: C2
    severidade: LOW
    tipo: verificação-pendente-por-tempo
    titulo: "A prova final acontece na run das 22:00 UTC"
    detalhe: >
      A coluna já está em produção e o código em produção já manda `metadata`, então o cooldown deve
      voltar na próxima run — mas isso é previsão até a linha aparecer. A consulta de verificação está
      no fim da story. Se não aparecer `nicole_sent`/`post_visit`, o diagnóstico está incompleto.

