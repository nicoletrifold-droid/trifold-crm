issues:
  - id: QA-001
    severity: medium
    category: code
    status: FIXED
    description: >
      A busca paginada de `appointments` ordenava por `lead_id`, que NÃO é único —
      medido em prod: 8 leads têm 2+ visitas, um tem 5. `fetchAllLeads` pagina com
      `.range()`, e ordem com empate não é determinística entre páginas: linha pulada
      ou repetida. O efeito seria um lead com visita classificado como "em atendimento"
      — número silenciosamente errado na tela, a classe de defeito mais cara deste
      projeto. DORMENTE hoje (59 linhas na tabela, nunca pagina); acordaria sozinho
      com o crescimento, sem ninguém mexer no código.
    recommendation: "Ordenar pela PK (`id`), que é única."
    resolution: "Corrigido: `.order(\"id\")` + comentário explicando por que não é lead_id."

  - id: QA-002
    severity: low
    category: requirements
    status: ACCEPTED
    description: >
      AC5 fala em busca "paginada/loteada ... por lead", mas o @dev implementou busca do
      conjunto inteiro paginada, sem lote de `lead_id`. Desvio deliberado e medido (59
      linhas na tabela; `.in()` com 300 uuid ≈ 12KB de URL). O AC é satisfeito no que
      importa — nenhum lead perde visita por corte do PostgREST — por paginação real.
    recommendation: "Nenhuma ação. Desvio documentado nas Dev Notes com o gatilho de revisita (~20k linhas)."

