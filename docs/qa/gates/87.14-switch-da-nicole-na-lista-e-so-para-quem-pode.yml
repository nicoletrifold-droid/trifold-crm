findings:

  Q1:
    severidade: medium
    categoria: tests
    titulo: 'A AC1-(i) se chama "os 10 papéis" e é discriminante para 2'
    medido: >
      instrumentando o mock (V2), os papéis que **chegam** ao gate de `imoveis.ativar_nicole` são
      `["admin","supervisor","obras","gerente-relacionamento"]`. Os outros 6 param no
      `requireCapability(appUser, "imoveis.editar")` de `route.ts:44`.
    por_que_importa: >
      O `expect(status).toBe(403)` do ramo recusado **não sabe de qual gate veio o 403**. Para os 6
      papéis sem `imoveis.editar`, ele continuaria verde mesmo que a capability
      `imoveis.ativar_nicole` fosse removida da rota — é colinearidade entre duas capabilities,
      irmã da que o @po pegou na E6 pelo eixo do seed. A mutação do V1 só mata porque `obras` e
      `gerente-relacionamento` viram 200, e esses dois **já eram cobertos pelos 2 testes da 87-13**.
    contribuicao_marginal_real_da_AC1: >
      (a) o trip-wire `expect(KNOWN_ROLES).toHaveLength(10)`, que é novo e vale — papel acrescentado
      ao registro quebra o teste; (b) assertar o **estado da linha** e não só o status (emenda E2).
      Ambas legítimas. O que não é verdade é a frase "os 10 papéis são exercidos [contra esta
      capability]".
    recomendacao: >
      Barato e decisivo: assertar o **corpo** do 403 ou instrumentar qual capability foi consultada,
      de modo que o teste distinga `imoveis.editar` de `imoveis.ativar_nicole`. Alternativa mais
      barata ainda: um comentário honesto no teste dizendo que 6 dos 10 são barrados antes, para o
      próximo leitor não superestimar a régua. **Não bloqueia** — a AC morde onde precisa morder.

  Q2:
    severidade: medium
    categoria: docs
    titulo: "O inventário de superfícies passou a mentir sobre onde este campo é editado — e a AC6 proíbe consertar"
    onde: "packages/ai/src/config-surfaces.test.ts:270"
    texto_atual: 'editadoEm: "painel /dashboard/properties/[id]/edit + PATCH /api/properties/[id]"'
    problema: >
      Depois desta story o campo **não é mais editável** naquela tela — o controle vive em
      `/dashboard/properties`. O `config-surfaces.test.ts` é justamente o artefato que este epic
      criou para impedir "controle no painel que o runtime ignora"; ele continua verde (o campo
      `editadoEm` é descritivo, só entra na mensagem de erro da linha 422, nunca é assertado), mas
      passou a apontar para a tela errada.
    tensao_declarada: >
      Corrigir a linha é 1 palavra e **viola a AC6** (zero diff em `packages/ai/`), cuja (iii) manda
      devolver a story ao @po se ficar vermelha. Não peço a correção aqui — registro que a story
      invalidou uma linha de um artefato de governança e que a própria cerca de escopo dela impede
      o conserto. É item de uma linha para a próxima story do epic que já abra `packages/ai/`.

  Q3:
    severidade: low
    categoria: requirements
    titulo: "As ACs de `grep` continuam sem dizer O QUE medem"
    contexto: >
      O @dev registrou as duas armadilhas no Dev Agent Record (o JSX quebrando a frase em duas
      linhas deu grep 0 com código certo; um comentário dele deixou o grep da AC5 em 1) e concluiu
      que *"uma AC de grep precisa dizer se mede o texto renderizado ou o texto do arquivo"*.
      **A conclusão ficou só no registro — o texto da AC5 não foi emendado**, e @dev não pode
      emendar AC (autoridade do @po).
    risco_real_medido: >
      Baixo nesta casa: a linha 429 tem 108 caracteres e **não há Prettier instalado nem
      configurado** no repositório (`npx prettier` → command not found; nenhum `.prettierrc`), e o
      lint não tem `max-len` como erro. Ou seja, nada no pipeline vai reflowar a frase sozinho. O
      risco é o próximo humano que quebre a linha por estética.
    recomendacao: "quando a AC5 for reaproveitada, escrever no corpo dela: 'mede o TEXTO DO ARQUIVO, e por isso a frase fica numa linha só de propósito'."

  Q4:
    severidade: low
    categoria: requirements
    titulo: "O passo 3 do roteiro da AC8 pede para observar uma coisa que não está na tela naquele momento"
    texto_da_AC: '"admin tenta ligar o Japura ⇒ aparece ''Pelo menos uma tipologia cadastrada'' e o link Completar cadastro; o switch **não** muda de estado"'
    o_que_o_codigo_faz: >
      ao clicar, a célula **inteira** é substituída pela pergunta de confirmação (decisão 4 do @dev,
      para não deixar checkbox mentindo). Depois do 422 o componente **não** reseta `confirmando`,
      então a célula mostra pergunta + [Confirmar]/[Cancelar] + erro + lista `faltando` + link.
      **O checkbox não está visível para se conferir que "não mudou".** O comportamento está certo
      (não há update otimista); o roteiro é que está escrito para o desenho anterior.
    como_conferir_na_pratica: "após o 422, clicar [Cancelar] e conferir que o checkbox volta desmarcado. Ajustei o roteiro do passo 3 abaixo."

  Q5:
    severidade: low
    categoria: tests
    titulo: "As 4 combinações num `it` só param na primeira que quebra"
    contexto: "ressalva de contagem que o próprio @dev levantou (AC4-(iv)(a) previa '2 dos 4 caem', o reporter mostra 1)"
    meu_juizo: ACEITAVEL_COM_RESSALVA
    razao: >
      A legibilidade está preservada: o rótulo passado como 2º argumento do `expect` aparece no
      vermelho (`false/false: expected true to be false`), então o leitor sabe **qual** combinação
      quebrou. O que se perde é **resolução**: o laço aborta na primeira falha, então se duas
      combinações quebrarem por motivos diferentes, só a primeira é vista. Para uma função de 6
      linhas isso não paga 4 `it`s — mas a AC deveria dizer "1 vermelho nomeando a combinação",
      não "2 dos 4 casos caem", senão a próxima pessoa vai procurar um segundo vermelho que não
      existe. O @dev declarou a divergência em vez de esconder; é o comportamento certo.

