status_reason: >
  **Reproduzi tudo do zero e o instrumento morde.** Apaguei o gate de capability da rota (a mutação
  que o briefing pediu, mais forte que a do @dev, que só trocava a chave) e a suíte da raiz devolveu
  **4 vermelhos**, entre eles a AC1-(i) e a AC3-(ii) — as duas ACs novas que tocam o gate. As 6
  mutações declaradas pelo @dev batem, e acrescentei **5 minhas** na função pura (motivo sempre
  preenchido, polaridade do rótulo invertida, `ligado` fixo): todas as cinco caem, com mensagem que
  nomeia a combinação. A guarda da 87-13 está **intacta e protegida**: `if (muda)` → `if (true)`
  derruba 2 testes, e mover `updateFields.nicole_enabled` para dentro do `if (muda)` derruba 1.
  **A D2 eu conferi literalmente, não por leitura.** Script próprio que extrai as strings dos dois
  arquivos e compara byte a byte: o `className` do `<span>` para os 8 papéis sem a capability é
  **idêntico** nas duas direções, o texto é idêntico, o `<td>` é idêntico, o `<span>` continua sendo
  **filho imediato** do `<td>` (`return badge` cru, sem wrapper) e o único atributo a mais é
  `title`. Réguas do @po batem: `packages/web` `tsc` = **0**, lint **0 errors / 23 warnings**, suíte
  **187 arquivos / 2372 passed / 6 expected fail**, AC6 vazia na minha própria forma de comando.
  **O que segura o PASS não é defeito de código — é o que a story afirma cobrir e não cobre.**
  Instrumentei o mock de `requireCapability` e medi quais papéis **chegam** ao gate de
  `imoveis.ativar_nicole`: são **4 dos 10**, não 10. Os outros 6 levam 403 do gate de
  `imoveis.editar`, em `route.ts:44`, antes. A AC1-(i) se chama *"os 10 papéis"* e é discriminante
  para **2**. Some-se a isso o `config-surfaces.test.ts`, que continua declarando que este campo é
  editado no `edit/page.tsx` — a tela de onde esta story acabou de removê-lo — e que a AC6 proíbe
  corrigir; e a **AC8 sem prova nenhuma** (T9 aberta, 2 caixas do DoD abertas). Nada disso impede o
  push; tudo isso impede chamar a story de Done hoje.

