nao_verificado:

  AC8_conferencia_humana:
    razao: >
      Não há harness de teste de componente React neste repositório (V9, reconferido por mim: sem
      `@testing-library`, zero `.test.tsx`, e o `include` do vitest nem coletaria um). O Playwright
      existe mas exige app de pé **e sessão autenticada por papel**, que esta story não monta.
      É a quarta story seguida assim; o @po já abriu o item no `docs/backlog.md`
      (*"[QA] 🔴 Não existe harness de teste de componente React"*).
    quem: "@qa (Quinn) + Gabriel — T9"
    roteiro_de_6_passos:
      - "1. **admin** abre `/dashboard/properties`: a coluna NICOLE mostra checkbox acionável nos quatro; Vind e Yarden ligados, Japura e Solum desligados."
      - "2. **admin** desliga o **Yarden** ⇒ pergunta *\"Desligar a Nicole no Yarden?\"* ⇒ [Confirmar] ⇒ a lista reflete \"desligada\" após o `router.refresh()`; **religa** ⇒ volta. (É o R2 — se o refresh não refletir, o conserto é `revalidatePath`.)"
      - "3. **admin** tenta ligar o **Japura** ⇒ [Confirmar] ⇒ aparece *\"Pelo menos uma tipologia cadastrada\"* e o link **Completar cadastro**. ⚠️ **corrigido (Q4):** o checkbox não está na tela nesse instante — clicar **[Cancelar]** e conferir que ele volta **desmarcado**."
