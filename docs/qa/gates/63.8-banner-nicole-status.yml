status_reason: >
  AC1-AC5 atendidos por código. Banner read-only AiStatusBanner renderizado no
  header do ConversationThread, abaixo do WindowStatusBadge (coexistem). Derivação
  via função pura deriveBrokerActive(messages, isAiActive) = brokerSentRecently(<24h)
  || !isAiActive — usa a MESMA fonte de verdade do takeover do cron (mensagem
  role='broker' nas últimas 24h), não o is_ai_active isolado. CON-3 INVIOLÁVEL
  respeitado: ZERO mutação de is_ai_active, ZERO chamada a endpoint handoff, ZERO
  botão/onClick/fetch (confirmado por git grep no diff — todas as ocorrências de
  'handoff'/'is_ai_active' são JSDoc/comentário). CON-1 INVIOLÁVEL: git grep
  tel:/wa.me/... → ZERO (exit 1). a11y: role="status" + aria-live="polite" nas duas
  variantes; ícones Bot/UserCheck com aria-hidden. Semântica correta: corretor que
  enviou <24h cai em Estado B mesmo com is_ai_active=true. Parse de created_at
  robusto (NaN não gera falso positivo — teste adicionado). Suíte completa 444/444
  (34 arquivos; +13 do helper, sendo 1 teste de robustez adicionado pelo QA);
  type-check 0 nos arquivos da story (3 erros ambientais pré-existentes em
  visual-editor.tsx/react-email-editor, fora do escopo); ESLint exit 0. page.tsx
  NÃO tocado (dados via props existentes). Issues todas LOW.
