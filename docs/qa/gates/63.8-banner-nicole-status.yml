      (corretor/humano). Decisão de design já aceita pelo @po (laranja=ação;
      status usa cor semântica própria). Observação de consistência: o verde do
      Estado B coabita o header com o verde do WindowStatusBadge (janela aberta),
      e o corretor é representado por laranja nas bolhas (63-2) mas por verde no
      banner. Não-enganoso e espacialmente separado; defensável.
