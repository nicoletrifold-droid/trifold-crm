status_reason: 'Fix de robustez da normalização de telefone BR (zero de discagem + DDI 55 sem DDD), em dois artefatos paritários: normalizePhoneBR (TS) e normalize_phone_br() (SQL, migration 120). Paridade SQL↔TS verificada por trace manual em todos os caminhos: 04399873661→5543999873661 (11d, strip 0, insert 9, prepend 55), 043999873661→5543999873661 (12d, strip 0, prepend 55), 55998041130→NULL (11d DDI sem DDD), e regressões (44999689446→5544999689446, 554499689446→5544999689446, 13d internacional/10d local passthrough) — ramo a ramo idênticos. A premissa estrutural da migration foi CONFIRMADA contra o schema: leads.phone_normalized É coluna GENERATED ALWAYS AS (normalize_phone_br(phone)) STORED (migration 021/024 linha 84-86), portanto CREATE OR REPLACE FUNCTION NÃO recomputa linhas existentes e o UPDATE leads SET phone = phone é necessário e correto para forçar a recomputação da coluna gerada. O recalc é idempotente (guard IS DISTINCT FROM → 0 linhas na 2ª execução) e colisão-seguro (guard NOT EXISTS contra o UNIQUE FULL idx_leads_org_phone_normalized_unique, migration 025 — multiplos NULLs permitidos). Decisão do @data-engineer de SEPARAR o merge destrutivo da migration está CORRETA e é a postura segura: DELETE FROM leads dispara ON DELETE CASCADE em 9 tabelas-filhas + 2 NO ACTION bloqueantes; a migration original só reatribuía activities (perda silenciosa de histórico de conversa/Nicole). A migration agora aplicada sozinha deixa o banco em estado CONSISTENTE: par Anezio (55998041130→NULL) é resolvido pelo recalc sem colisão; par José Edson permanece com o valor antigo (linha "ruim" pulada pelo NOT EXISTS) — divergência conhecida e benigna até o merge manual supervisado. 28/28 testes vitest re-executados pelo @qa (PASS). Um concern de robustez LOW documentado abaixo (não-bloqueante, não-triggerable no dataset auditado).'
reviewer: 'Quinn'
updated: '2026-06-25T20:35:00Z'

