    trigger: 'Gate pós-revisão do @data-engineer (renumeração 065→120 + separação do merge destrutivo). Fix de normalização de telefone BR em TS+SQL paritários.'
    summary: 'Os 7 quality checks passam. Paridade SQL↔TS verificada ramo a ramo (trace manual) para os 2 edge cases novos + regressões. Premissa GENERATED STORED da migration confirmada contra migration 021. Recalc idempotente + colisão-seguro validado contra o UNIQUE FULL. Decisão de separar o merge (CASCADE em 9 FKs) é correta e mantém o banco consistente. 28/28 vitest. PASS com 1 concern LOW de robustez do guard de recalc (não-triggerable no dataset auditado) + ação de follow-up obrigatória do merge manual José Edson.'

# Os 3 quality_gate tools nomeados na story (migration_safety, dedup_correctness, regression_check)
gate_checks:
  migration_safety: 'PASS — migration 120 é não-breaking (zero mudança de schema; só corpo de função via CREATE OR REPLACE + dados via UPDATE). Renumeração 065→120 correta: 065 colidia com 065_create_chamados.sql e 119 já ocupado por 119_whatsapp_send_log.sql em main → 120 é o próximo slot livre. Idempotente: 2ª execução → guard IS DISTINCT FROM zera o conjunto, nada muda. O UPDATE leads SET phone = phone é o mecanismo CORRETO de recomputação de coluna GENERATED STORED (confirmado: 021 linha 84-86 define phone_normalized GENERATED ALWAYS AS (normalize_phone_br(phone)) STORED; CREATE OR REPLACE sozinho deixaria valores stale). Função mantém IMMUTABLE STRICT SECURITY DEFINER + search_path fixo, requisito p/ uso em coluna gerada. Bloco MANUAL MERGE 100% comentado → db push o ignora deterministicamente.'
  dedup_correctness: 'PASS — recalc colisão-seguro via NOT EXISTS contra o UNIQUE FULL idx_leads_org_phone_normalized_unique (migration 025, sem WHERE → múltiplos NULL permitidos). Par Anezio (55998041130): recomputa p/ NULL, NULL não participa do UNIQUE → recalculado normalmente, ZERO merge necessário (correto). Par José Edson (04399873661 ruim vs 43999873661 sobrevivente, ambos → 5543999873661): a linha ruim é PULADA pelo NOT EXISTS porque o sobrevivente já segura o valor-alvo; a sobrevivente não é candidata (não-distinct). Resultado: banco consistente, ruim retém 5504399873661 antigo até merge manual. Decisão de DEFERIR o merge é a segura — auditoria do @data-engineer mapeou 9 FKs ON DELETE CASCADE (conversations→messages, appointments, lead_facts, lead_memories, follow_up_rules, lead_tasks, lead_property_interest [UNIQUE], visit_feedback, lead_distribution_log) + 2 NO ACTION (unit_sales, properties.reserved_by_lead_id) que a migration original NÃO tratava (só activities) → perda silenciosa de histórico/Nicole evitada. Template de merge reatribui TODAS as 13 FKs antes do DELETE.'
  regression_check: 'PASS — números já corretos normalizam IDÊNTICOS antes/depois: 44999689446→5544999689446, +5544999689446→5544999689446, 554499689446→5544999689446 (insert-9), 13d/10d passthrough. Trace confirma que os 2 novos ramos (strip-0 em 11/12d começando com 0; 11d começando com 55→null) só interceptam inputs que ANTES caíam no fallback errado — não tocam o caminho dos números válidos. Recalc só toca linhas IS DISTINCT FROM o valor atual → leads não-afetados ficam intactos (UPDATE nem os visita). 28/28 vitest cobrem invalid inputs, formatos válidos, insert-12d, internacional, zero de discagem (5 testes), DDI-sem-DDD (3 testes) e o bug de produção multi-formato.'

top_issues:
  - id: 'REL-001'
    severity: low
    category: dedup_correctness
    finding: 'O guard NOT EXISTS do recalc protege contra colisão com uma linha que JÁ segura o valor-alvo (o caso documentado do par José Edson). Ele NÃO protege contra duas linhas-candidatas distintas que recomputam para o MESMO novo valor não-nulo dentro do MESMO UPDATE (ex.: hipotéticos 04399873661 e 043999873661 no mesmo org, ambos→5543999873661, ambos atualmente com valores ≠ alvo): o WHERE qualificaria ambas no snapshot e o constraint check no write-time abortaria a migration por violação do UNIQUE.'
    impact: 'NÃO-TRIGGERABLE no dataset de produção auditado (2026-05-26, 3.176 leads): existe apenas a forma 04399873661 (sem variante 12d-zero), e seu gêmeo 43999873661 já está correto/não-candidato. Risco latente apenas se a migration for re-rodada contra dados que sofreram drift e passaram a conter dois zero-prefixos colidentes.'
    recommendation: 'Não-bloqueante para este deploy. Para robustez futura, considerar (opcional) executar o recalc por org/em lotes ou adicionar um DISTINCT ON do valor-alvo. A query de verificação pós-migration (a) já surfacearia qualquer divergência remanescente. Documentar como nota de operação, não corrigir agora.'

validation_evidence:
  vitest: 'npx vitest run phone re-executado pelo @qa da raiz → 28 passed (28), 1 test file, 117ms. Cobre os 5 testes de zero de discagem, 3 de DDI-sem-DDD, regressões e o bug multi-formato de produção.'
  parity_trace: 'Paridade SQL↔TS verificada por trace manual ramo a ramo (não só por testes): 04399873661, 043999873661, 55998041130, 44999689446, 554499689446, 1234567890123, 4499689446, whitespace/non-digit. Ordem dos guards idêntica entre phone.ts (linhas 41-64) e migration 120 (linhas 72-96). btrim+STRICT (SQL) ≡ trim+null-guards (TS).'
  schema_premise: 'Confirmado que leads.phone_normalized é GENERATED ALWAYS AS (normalize_phone_br(phone)) STORED (migration 021_phone_normalization_part1.sql:84-86 e 024) — valida a necessidade e correção do UPDATE leads SET phone = phone. UNIQUE idx_leads_org_phone_normalized_unique é FULL (migration 025:54, sem WHERE) → múltiplos NULL permitidos, base da segurança do par Anezio.'

ac_traceability:
  AC1: 'PASS — normalize_phone_br(04399873661) e normalizePhoneBR(04399873661) → 5543999873661 (trace + testes). Zero de discagem removido SOMENTE quando precede DDD válido: guard left(digits,1)=0 AND length IN (11,12), depois insert-9 se restarem 10 dígitos. Testes: 04399873661→5543999873661, 043999873661→5543999873661, igualdade zero-prefix==forma-correta, 10d-sem-zero passthrough.'
  AC2: 'PASS — normalize_phone_br(55998041130) e normalizePhoneBR(55998041130) → NULL em ambos (11d começando com 55, DDI sem DDD). Guard length=11 AND left(2)=55 → NULL, posicionado ANTES do prepend-55. Testes: 55998041130→null, formato com máscara →null, e o gêmeo 44998041130→5544998041130 (DDD real, não afetado).'
  AC3: 'DEFERIDO (não-bloqueante para o gate de código) — merge das duplicatas REMOVIDO da migration por decisão de segurança do @data-engineer (CASCADE em 9 FKs). Par Anezio: resolvido automaticamente pelo recalc (→NULL, sem colisão). Par José Edson: passo manual supervisado pós-deploy, template completo de reatribuição das 13 FKs no fim da migration 120. Rastreado em BL-25-4-02 e na ação de follow-up deste gate.'
  AC4: 'PASS — recalc via UPDATE leads SET phone = phone com guards IS DISTINCT FROM (toca só quem muda) + NOT EXISTS (pula colisões). Nenhum lead válido tem phone_normalized alterado (regression_check). Testes unitários dos 2 edge cases presentes (28/28). T2.3/validação pós-deploy rastreada em BL-25-4-01.'

nfr_validation:
  NFR-SAFETY (migration não-destrutiva): 'PASS — nenhum DELETE/DROP no caminho automático; merge destrutivo isolado em bloco comentado. Recalc idempotente e colisão-seguro.'
  NFR-CONSISTENCY (estado pós-migration): 'PASS — aplicar a 120 sozinha deixa o banco consistente: Anezio resolvido, José Edson em estado benigno conhecido (linha ruim retém valor antigo, não viola UNIQUE). Nenhum caminho de falha por colisão no dataset auditado.'
  NFR-PARITY (SQL↔TS): 'PASS — fonte de verdade única (phone.ts, 28 testes); SQL é mirror exato verificado por trace. Divergência futura mitigada pelos testes + comentário cruzado nos dois arquivos.'

article_iv_compliance: 'PASS — implementação 100% dentro do escopo das AC. A separação do merge é uma redução de escopo BEM justificada (auditoria de FKs documentada na story e na migration), não invenção. Nenhuma feature fora do PRD/story.'

