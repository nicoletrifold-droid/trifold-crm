sete_checks:
  - check: "1. Code review — padrões, legibilidade, manutenibilidade"
    nota: PASS
    evidencia: >
      Diff de 50 linhas em 1 arquivo de produção, das quais ~30 são docstring. `espalhar`
      é pura, determinística, com as três guardas na ordem certa (`k<=0`, `xs.length<=k`,
      `k===1`) ANTES da divisão por `k-1`. `freeSlotsInPeriod` mantém o filtro de "já
      passou" ANTES de qualquer query (não gasta round-trip com candidato morto) e o
      `non-null assertion` em `xs[i]!` é seguro porque os índices vêm de
      `round(i*(n-1)/(k-1))` com i ∈ [0,k-1] → sempre em [0,n-1]. Comentários explicam o
      PORQUÊ (a conversa da Ana) e não o o-quê. Único ponto de estilo: MNT-1.
  - check: "2. Unit tests — cobertura adequada, todos passando"
    nota: PASS
    evidencia: >
      +8 testes, todos capazes de reprovar — não por afirmação, por medição: 4 mutações
      minhas mataram AC1, AC2, AC3-ii, AC4 e os dois goldens. A `AC3-iii` é varredura
      (k=2..7 × n=k+1..8) assertando extremos, ordem, unicidade e length ≤ k, direto na
      função exportada, como a AC exigia. Fica TEST-1 (low) no sítio `:1044`.
  - check: "3. Acceptance criteria — todas atendidas conforme a story"
    nota: PASS
    evidencia: >
      AC1 ✅ [12:00, 14:00, 17:00] com o vermelho do HEAD medido por mim.
      AC2 ✅ [8:00, 9:30, 11:00], sequência COMPLETA (a régua apertada pelo @po), e os 7
      candidatos com último início 11:00.
      AC3 ✅ (i) 2 e 3 candidatos saem inteiros e em ordem; (ii) k=1 → 1 elemento, k=0/-1 →
      [], nenhum `undefined`, provado pela mutação (c); (iii) invariante de cobertura
      assertada NA FUNÇÃO.
      AC4 ✅ forma (b), autorizada literalmente pela AC e pelo §3.2 do @po: 11 emitidas,
