concerns:
  - id: REL-1
    severity: medium
    category: reliability
    file: "packages/ai/src/flows/visit-slot.ts (freeSlotsInPeriod) · packages/ai/src/chat/pipeline.ts:1044,1123"
    description: >
      A exposição a erro transitório de rede por oferta de período sobe de 3 para 11
      queries, sem `try/catch` em nenhum dos dois chamadores. Uma rejeição de `isSlotFree`
      sobe até `catch (asyncErr)` do webhook, virando `WEBHOOK_ASYNC_ERROR` — o lead que
      pediu "amanhã à tarde" não recebe resposta nenhuma. Mesmo MODO de falha do HEAD,
      ~3,7× mais provável.
    porque_nao_bloqueia: >
      Não é regressão de modo, é de probabilidade; é OBSERVÁVEL em `system_events`, não
      silenciosa; e a correção "falha = não livre" tem um contra-argumento sério (esconderia
      horário livre sob erro transitório, versão branda do próprio defeito da story), então
      merece desenho próprio em vez de um remendo dentro desta fatia.
    recommendation: >
      Story/backlog própria decidindo explicitamente entre (a) `Promise.allSettled` +
      tratar rejeição como "não livre" (responde com lista possivelmente incompleta) e
      (b) `try/catch` no chamador com uma mensagem `[SISTEMA]` honesta de "não consegui
      consultar a agenda agora". Qualquer das duas exige um evento próprio em
      `system_events` (hoje só existe o `WEBHOOK_ASYNC_ERROR` genérico) para o volume ser
      medível. REGISTRADO em `docs/backlog.md`.
  - id: MNT-1
    severity: low
    category: maintainability
    file: "packages/ai/src/flows/visit-slot.ts (espalhar)"
    description: >
      `espalhar` devolve `xs` por referência quando `xs.length <= k` e um array novo quando
      `xs.length > k` — superfície pública assimétrica, não documentada no docstring e não
      travada por teste (a `AC3-i` usa `toEqual`, que não distingue cópia de referência).
      Confirmado por mim: `espalhar([1,2,3],3) === [1,2,3]` (mesma referência).
    porque_nao_bloqueia: >
      Zero aliasing real hoje — o único chamador de produção passa
      `candidates.filter(...)`, array local, e ninguém muta o retorno. E o §1 do Desenho,
      normativo e validado pelo @po, escreve `return xs`: o @dev seguiu o desenho e
      ESCALOU a decisão em vez de escondê-la.
    recommendation: >
      Na próxima vez que `espalhar` for tocada (a Fatia 2 se apoia na invariante dela):
      `return xs.slice()`, ou uma linha no docstring dizendo que o retorno pode ser a
      própria referência. Custo de uma linha; evita que um chamador futuro herde a
      armadilha.
  - id: TEST-1
    severity: low
    category: test-coverage
    file: "packages/ai/src/chat/pipeline.ts:1044 (ramo de remarcação) · pipeline-agenda-state.test.ts:375-389"
    description: >
      O SEGUNDO chamador de `freeSlotsInPeriod` (o ramo de remarcação,
      `nPeriod && (nDay || pendenciaDay)`) mudou de comportamento com diff ZERO de código,
      e o único teste que passa por ele asserta apenas
      `toContain("Horários LIVRES nesse período")` — nenhuma asserção sobre QUAIS horários.
      O golden G6 byte-a-byte cobre o sítio `:1123` (fixture com `appointments: []`), não
      o `:1044`.
    porque_nao_bloqueia: >
      Declarado pelo @po na `AC10` e no risco `R1` ("segue verde sem provar nada"), com a
      mesma correção sendo desejável nos dois sítios. É lacuna conhecida e aceita, não
      descoberta neste gate.
    recommendation: >
      Na Fatia 2, ao mexer no ramo `day && !time`, acrescentar um golden do ramo de
      remarcação (fixture COM `appointments`, exercitando o `excludeAppointmentId`) — o
      caminho de remarcação é o que passa `apptId` e hoje ninguém tranca a lista dele.
  - id: PERF-1
    severity: low
    category: performance
    description: >
      11 requisições concorrentes ao PostgREST por oferta de período (7 em `manha`).
      Limitado pela geometria, query trivial e indexada, profundidade sequencial 1 — mas o
      número nunca foi medido em produção, só no fake.
    porque_nao_bloqueia: "Forma explicitamente autorizada pela `AC4-(b)` e pelo §3.2 do parecer do @po."
    recommendation: >
      Na janela `AC11-(i)`, comparar o p95 de `metadata->>'ms_async'` do evento
      `whatsapp_async_done` nas 24 h ANTES e nas 24 h DEPOIS do deploy. O evento já existe
      (`api/webhook/whatsapp/route.ts:1312-1326`) e é o teto que o @po invocou (D88-3) —
      custa um `select` e fecha a única incógnita desta fatia que o fake não podia responder.
  - id: DOC-1
    severity: low
    category: scope
    description: >
      `checkSlotAvailability` (o caminho "o horário que você pediu está ocupado, veja
      alternativas") mantém `if (alternatives.length >= 3) break` — a MESMA geometria de
      "os 3 primeiros" que esta story acaba de consertar em `freeSlotsInPeriod`.
    porque_nao_bloqueia: >
      Explicitamente FORA do escopo pelo quadro "O que esta story NÃO faz"
      (`evaluateSlot`, `checkSlotAvailability`, o INSERT do appointment). E ali a semântica
      é diferente e defensável: "as 3 alternativas mais próximas DEPOIS do horário pedido"
      é razoável, não é a borda de abertura de um período.
    recommendation: >
      Nenhuma ação nesta fatia. Registrado para que a próxima pessoa que ler
      `visit-slot.ts` não conclua que o padrão "3 primeiros" foi extinto do arquivo.

