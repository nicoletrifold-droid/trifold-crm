ac_traceability:
  AC1: 'PASS — GET /api/agent/context-meta retorna {isStale, isError, lastSyncAt} via fetchProvenance, reusando computeProvenance/safeProvenanceData da 76-1 (sem duplicar lógica de derivação). Acesso autenticado, sem RLS bypass. (SEC-001 resolvido: errorMessage removido do contrato por não ter consumidor)'
  AC2: 'PASS — banner âmbar com texto "Dados de Meta Ads possivelmente desatualizados — última sincronização há mais de 36h." quando isStale; renderizado no topo da view de chat (acima da context bar), visível sem scroll.'
  AC3: 'PASS — banner vermelho com texto "Falha na última sincronização com a Meta. Os dados podem estar incompletos." quando isError; erro tem prioridade sobre staleness.'
  AC4: 'PASS — SyncStatusBanner retorna null quando !isStale && !isError; painel mantém aparência padrão.'
  AC5: 'PASS — banner não-modal, não bloqueia input nem respostas; dismiss via X. Dismiss guarda a REFERÊNCIA do objeto status (derivado, sem setState em effect); reaparece no próximo poll de 5min (novo objeto). Padrão limpo que evita o lint react-hooks de cascading renders.'
  AC6: 'PASS — useProvenanceStatus(isOpen): fetch ao montar + setInterval 5min (alinhado ao TTL do context-builder); gated por painel aberto; clearInterval + flag cancelled no cleanup. Independente do streaming.'
  AC7: 'PASS (CRÍTICO) — ver tenant_isolation_check. createClient() com sessão do usuário (anon key + RLS), sem service_role, filtro org_id da sessão.'
  AC8: 'PASS — zero erros TS/ESLint nos arquivos da story (verificado em runtime).'

nfr_validation:
  NFR-TENANCY-1: 'PASS — anon key + RLS + .eq(org_id) da sessão em todas as 3 queries; org_id nunca vem de input do cliente.'
  NFR-OBS-1: 'PASS — fail-safe em servidor (FAIL_SAFE 200) e cliente (catch silencioso); nunca exibe aviso falso; mantém estado anterior em erro de rede.'
  NFR-PERF-1: 'PASS — polling leve gated por painel aberto; intervalo separado do streaming; endpoint reusa o mesmo padrão de queries batched. Sem impacto no streaming de chat.'
  NFR-COMPAT-1: 'PASS — mudança aditiva; buildGlobalContext/buildCampaignContext intocados (preserva batching/AC7 da 76-1); 565/565 sem regressão.'

article_iv_compliance: 'PASS com nota — implementação dentro do escopo das AC, sem feature inventada. A lógica de derivação de staleness é reusada da 76-1 (IDS respeitado). Exceção menor: errorMessage retornado mas não consumido (SEC-001) é tecnicamente fora do uso atual — recomendado remover sob YAGNI. A duplicação de query plumbing (ARCH-001) é débito de manutenção, não invenção de escopo.'

