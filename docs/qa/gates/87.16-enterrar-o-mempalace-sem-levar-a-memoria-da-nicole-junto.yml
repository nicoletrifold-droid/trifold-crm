    severity: medium
    category: 'requirements'
    finding: >-
      TRÊS linhas em DUAS PRs abertas reprovam as réguas desta story quando mergearem — e uma delas
      não está declarada em lugar nenhum. Extraí com precisão do `gh pr diff`:
      (a) `#428` · `packages/ai/src/chat/pipeline-collected-data.test.ts:160` — `lead_facts: []`,
      reprova a AC2 (`grep` ⇒ 1). Estava previsto na T3/AC2 ("9 ou 10 arquivos, depende da 87-11").
      (b) `#428` · `packages/ai/src/prompts/collected-data.ts:50` — `→ \`memory/loader.ts\` →
      prompt)`, reprova a AC8-b (`grep` ⇒ 1) e cita um caminho que deixou de existir. Declarado no
      Dev Agent Record §11.
      (c) 🔴 `#429` · `packages/ai/src/flows/handoff.ts:258` — `` (`memory/loader.ts:196-203`) ``,
      reprova a AC8-b também. **NÃO está declarado em nenhum lugar da story** — o aviso do @dev
      contava uma PR e são duas.
    suggested_action: >-
      Quem mergear POR ÚLTIMO conserta as três, e o gatilho é mecânico: rodar `grep -rn
      "lead_facts\|lead_memories\|match_lead_memory" packages/` e `grep -rn "memory/loader\|memory/writer"
      packages/` no rebase, ambos ⇒ 0. Como o merge desta story está atrás da ratificação do
      `D2-(c)` e a fila é #428 → #429, o cenário provável é ESTA story rebasear por último ⇒ o
      conserto é dela. Acrescentar o item (c) ao aviso do Dev Agent Record §11.

  - id: 'QA-2'
    severity: low
    category: 'docs'
    finding: >-
      O campo `ObjectReference.line` de `packages/shared/src/db/referenced-objects.ts:51` está
      documentado como *"Linha 1-based do início do literal"*, mas o que ele reporta é o início do
      MATCH — que, em cadeia multilinha (`await supabase` ⏎ `.from("x")`), é a linha do DONO. Por
      isso a saída vermelha colada diz `loader.ts:54`/`:105` e `pipeline.ts:1646`/`:1655` enquanto a
      própria §AC9-(D) da story previa `:55`/`:106` e `:1647`/`:1656`. Conferi contra `a60a1bc6`: o
      `.from("lead_facts")` está mesmo em `:1647` e o `await supabase` em `:1646`.
    suggested_action: >-
      Corrigir o docstring para "linha do início da CHAMADA" (o comportamento está bom — aponta o
      statement, que é o que o humano quer ver) e reconciliar a divergência de ±1 no Dev Agent
      Record. Numa story cuja tese é *"docstring que mente cria a próxima crença"*, um docstring com
      a definição errada de linha merece o conserto de 1 linha.

  - id: 'QA-3'
    severity: low
    category: 'tests'
    finding: >-
      Os nomes proibidos da AC5 são montados por `join` (`["lead","facts"].join("_")`) para não
      reprovar a régua de `grep` da AC2. **É solução, não disfarce** — julguei e o veredito é a
      favor: (a) a asserção continua íntegra, porque o teste compara contra a saída REAL do extrator
      sobre o `pipeline.ts`; (b) o próprio arquivo declara o motivo no cabeçalho, linhas 11-16;
      (c) os três literais SOBREVIVEM em texto plano em `scripts/check-db-objects.ts:6-7`, fora da
      população da régua — então `grep -rn "lead_facts" .` na raiz ainda acha UM lugar canônico.
      O custo residual é real e vale escrito: um retorno do MemPalace escrito com `join` em código
      de PRODUÇÃO passaria pela régua de `grep`. A defesa nesse caso não é a AC2 nem a AC5 — é o
      `db:objects:check`, que afirma o OBJETO e não a string.
    suggested_action: 'Nenhuma mudança pedida. Registrado para que a próxima story não leia a régua de `grep` da AC2 como cobertura completa — ela é proxy, e a cobertura de verdade é a AC9.'

