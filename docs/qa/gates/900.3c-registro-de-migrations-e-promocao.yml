status_reason: >-
  Rodada 4. R3-1 fechado, e fechado pela raiz: o `tenancy-gate` voltou intocado e a paginação
  foi para o job desta story. Provei mais forte do que foi pedido — não é só "o tenancy-gate
  está igual", é que **o arquivo inteiro da base é prefixo byte a byte do HEAD** (mesmo
  `sha256` para `origin/main:ci.yml` e para `sed -n '1,194p'` do HEAD), que é a definição
  operacional de "só acrescentei no fim". A régua de forma nova acende de verdade: exit 1 em
  `f6c21b21` (hunk `@@ -187,0`), exit 0 no commit atual (`@@ -194,0`), enquanto o `numstat`
  diz `0` nos dois. E mapeei as três réguas por construção: nenhuma sobra, nenhum buraco entre
  elas. Achei **uma** fragilidade real na régua nova e a medi — ela calcula a base pelo **tip**
  da `origin/main` e compara com um hunk que vem do **merge-base**; assim que a `main` mexer no
  `ci.yml` ela fica **falso-vermelha** sem nada de errado na branch. Correção de uma linha,
  entregue pronta no handoff. Não bloqueia: hoje tip == merge-base e a régua está correta.
reviewer: "Quinn (Test Architect)"
