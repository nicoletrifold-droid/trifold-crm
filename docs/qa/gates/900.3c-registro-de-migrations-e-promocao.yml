      - "⛔ db:status saiu 1 (motivo do status) → indeterminado"
      - "⛔ parsing sem casamento (relatório de outra árvore) → indeterminado"
      - "✅ PR SEM migration (diff legitimamente vazio) → limpo"
      - "✅ migration do PR já aplicada → limpo"
