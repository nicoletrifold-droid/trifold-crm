  Rodada 3, pós-CodeRabbit. Sete dos oito achados estão fechados e reproduzi cada um por
  execução — inclusive contra o banco real. Mas o oitavo (paginação do `listComments`) foi
  aplicado no **job errado**, e isso arrastou duas consequências que o commit não registra:
  (1) o job NOVO desta story continua **sem paginação**, então a garantia de "atualiza
  in-place em vez de acumular" da AC4 vale só em PR curto; (2) o job `tenancy-gate` — que já
  existia em `origin/main` — **foi modificado**, que é justamente o que a régua de
  não-reescrita existe para impedir, e a régua não pegou. Ela lê `170 0` (verde) **só porque**
  as duas linhas retiradas do `tenancy-gate` continuam existindo, idênticas, dentro do job
  novo: o LCS do git casou as duas e representou tudo como inserção pura. Medi o
  contrafactual — paginando também o job novo, a MESMA régua vai para `174 2` → exit 1.
  O commit message afirma o inverso dos dois fatos. Um item bloqueante antes do push;
  nenhum risco de dado, produção não tocada.
