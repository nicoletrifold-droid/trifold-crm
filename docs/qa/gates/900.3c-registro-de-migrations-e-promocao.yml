        `trifold_migrations_aplicadas_sha256_hex` CHECK `(sha256 ~ '^[0-9a-f]{64}$')` e
        `trifold_migrations_aplicadas_via_valido` CHECK `via IN ('backfill-onda-1','apply',
        'reset','reset-falha-conhecida')` — os dois presentes em `pg_constraint`.
      reprovam_de_verdade: "`sha256='NAO-E-HEX'` → `23514` · `via='via-inventada'` → `23514` · zero linhas de sonda ficaram (total segue 268)"
    fecha_o_meu_concerns_2_da_rodada_1: >-
      O drift que eu achei (COMMENT com 3 valores, código com 4) deixa de ser possível em
