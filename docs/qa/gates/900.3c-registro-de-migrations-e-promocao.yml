rodada_2:
  concerns_1_a_quarta_classe:
    status: FECHADO
    o_que_mudou: >-
      `montarAviso` ganhou `removidas = casados.filter(estado === "ÓRFÃ-no-banco")` e um bloco
      `⛔ REMOVIDA` com texto próprio; a manchete virou neutra ("precisam de atenção"), o que
      também fecha o NIT-8. A AC4 traz a justificativa original **riscada** e marcada como
      falsificada por medição.
    reproduzido_por_mim:
      - id: "R2-1 — o estado acende"
        entrada: "diff=[244_org_admin_invite_email.sql apagada] · relatório=[mesma, ÓRFÃ-no-banco]"
        medido: "estado=pendente · bloco '⛔ REMOVIDA — este PR apaga migration que consta como aplicada (1)'"
        antes_do_conserto: "estado=limpo, com o arquivo listado sob '✅ … já estão aplicadas'"
      - id: "R2-2 — CONTROLE NEGATIVO: órfã alheia continua invisível"
        entrada: "diff=[999_do_pr.sql] · relatório=[244 ÓRFÃ + 999 aplicada]"
        medido: "estado=limpo · 0 menções a 244_org_admin_invite_email · 0 menções a REMOVIDA"
        veredito: "a correção NÃO trocou falso-verde por falso-vermelho — o risco R6 segue fechado"
      - id: "R2-3 — renumeração (apaga velho + adiciona novo)"
        medido: "'2 migration(s) … precisam de atenção' · PENDENTE (1) E REMOVIDA (1), blocos separados"
        nota: "classe que eu não havia sondado na rodada 1; sai correta"
    vivacidade_do_controle_negativo:
      porque_eu_insisti: >-
        Um controle negativo que sobrevive a TODAS as mutações é decoração. Testei os dois
        sentidos e os conjuntos de morte são DISJUNTOS — é isso que prova que ele mede.
      mutacao_M5:
        forma: "`const removidas = [] // MUTACAO-QA-M5` (prova em disco: grep -c 1 → 0)"
        medido: "3 failed / 11 passed — os três casos do bloco novo. O controle negativo PASSA."
      mutacao_de_ruido:
        forma: "`removidas` derivada de `entrada.vereditos` (relatório inteiro) em vez de `casados`"
        medido: "1 failed / 13 passed — SÓ o controle negativo. Os três casos novos PASSAM."
      conclusao: "kill sets disjuntos ⇒ o controle negativo não é colinear com os testes do conserto"
    testes: "aviso-migrations-do-pr 11 → 14 · total dos dois arquivos novos 25 → 28"

  concerns_2_o_comment_do_via:
    status: FECHADO
    conferido_de_dentro_do_banco:
      col_description_via: >-
        "Proveniência do registro, QUATRO VALORES: backfill-onda-1 (…); apply (pnpm db:apply
        observou o sucesso); reset (…VIU o arquivo aplicar); reset-falha-conhecida (… NÃO
        aplicou, e o registro existe só para ele não aparecer como PENDENTE…)" — lido por
        `col_description('public.trifold_migrations_aplicadas'::regclass, attnum)`.
      via_no_ledger: "reset 263 + reset-falha-conhecida 4 + apply 1 = 268 ✅"
      linha_da_245: "arquivo=245_registro_de_migrations.sql · via=apply · sha=cc88e5aff20a…"
      rls: "relrowsecurity=true · policies=0 ✅"
      db_status: "aplicada 268 · PENDENTE 0 · ALTERADA 0 · ÓRFÃ 0"
    a_prova_que_importa: >-
      `shasum -a 256` do arquivo em disco = **cc88e5aff20a** = o `sha256` gravado no ledger.
      E o `via` é **`apply`**, não `backfill`: o banco EXECUTOU o arquivo novo (é por isso que
      o `col_description` já traz o texto novo — o `COMMENT ON` rodou de verdade). O ledger
      não está declarando; está descrevendo o que foi observado.
    o_caminho_da_remediacao:
      veredito: CORRETO
      analise: >-
        Ele recusou `UPDATE … SET sha256 = <novo>` — que teria sido declarar que o SQL novo
        rodou sem ninguém ver, exatamente a mentira que o campo `sha256` fecha — e usou
        `DELETE` do registro obsoleto → o estado volta a `PENDENTE`, que É a verdade (aquele
        conteúdo nunca rodou neste banco) → `db:apply` observa e grava `via='apply'`. O
        procedimento foi escrito no runbook ANTES de executado, com escopo travado ("só antes
        do merge e antes de produção") e com a condição de segurança nomeada (a migration
        precisa ser idempotente; se não for, a resposta é a regra geral — migration nova).
    correcao_extra_do_rollback:
      veredito: ACHADO REAL, e mais grave que o item que o originou
      analise: >-
        A linha 3 do Rollback mandava regerar o backfill inteiro. Fora da janela logo após o
        Passo 2, isso reescreveria as 268 linhas com `via='backfill-onda-1'` e **apagaria** as
        proveniências `reset`/`apply`/`reset-falha-conhecida` — transformaria observação em
        declaração em massa, silenciosamente. A correção delimita a janela e manda usar o
        procedimento de um arquivo só. Confirmei o texto no runbook.

  concerns_3_interpolacao_em_run:
    status: FECHADO
    medido_por_mim: >-
      Varri o bloco do job separando os corpos de cada `run:`: **0 linhas de `run:` com
      `${{ }}`** (a única ocorrência dentro de um `run:` está num `#` comentário explicando o
      porquê). Todas as 4 interpolações do bloco estão em mapeamentos `env:`:
      `BASE_REF`, `SUPABASE_MANAGEMENT_PAT`, `MOTIVO_DIFF`, `MOTIVO_STATUS`.
    escopo_maior_que_o_pedido: >-
      Eu havia nomeado só os dois `motivo`. Ele achou `BASE="origin/${{ github.base_ref }}"`
      na mesma varredura — a interpolação com a superfície MAIOR das três, porque
      `github.base_ref` é nome de branch e vinha antes das outras duas no fluxo.
    regressao_verificada: >-
      Rodei de novo, VERBATIM, o passo pós-hardening nos dois cenários sintéticos: checkout
      raso (`git fetch --depth=1`) → `motivo=nao consegui resolver a ref base origin/main`, e
      o arquivo de diff **nem é criado**; checkout completo → resolve e lista a migration. O
      refactor para `env:` não quebrou nenhuma das guardas.

  concerns_4_regua_pos_commit:
    status: FECHADO POR MEDIÇÃO
    medido_por_mim_no_repo_real: >-
      `git diff --numstat origin/main...HEAD -- .github/workflows/ci.yml` → `164  0` ·
      `awk '$2 != 0 { exit 1 }'` → exit **0** · `grep -c '^  static:\|^  tenancy-gate:'` → 2 ·
      jobs = [static, tenancy-gate, migrations-do-pr].
    confirmacao_da_rodada_1: "a vacuidade era mesmo artefato de gatear antes do commit, como eu havia medido em clone descartável"
    residuo: "só a repetição pós-squash/pós-merge-de-main — ver `o_que_o_devops_carrega`"

  obs_6_o_aviso_do_gate_tenancy:
    status: FECHADO, e ancorado no lugar certo
    o_que_mudou:
      - "`_aviso` passa a ser EMITIDO pelo gerador (`scripts/gate-tenancy.ts`, no objeto que ele serializa)"
      - "`_aviso` inserido no arquivo rastreado por edição cirúrgica (`--numstat 1 0`)"
      - "alerta impresso ANTES de sobrescrever, quando `schema.projectRef !== PROD_REF`"
    a_verificacao_que_eu_fiz_e_que_ninguem_pediu: >-
      Avaliei a constante `AVISO_DO_RELATORIO` do fonte e comparei com o `_aviso` do JSON
      rastreado: **byte-idênticos**. Importa porque, se divergissem, a próxima execução
      legítima do gate contra produção produziria um diff fantasma naquele campo — e um campo
      que "some sozinho" é como um aviso morre. Fixture: 10/10, e o teste não menciona
      `_aviso` (inerte ao campo novo, como deve ser).
    nao_rodou_o_gate_depois: "correto — rodar reescreveria `geradoEm` e, contra teste, envenenaria o arquivo"

  obs_5_falha_de_ledger_no_reset:
    status: ACEITO COMO IMPLEMENTADO — a decisão do coordenador prevalece
    o_que_foi_implementado: >-
      Contador próprio no `=== RESUMO ===` (`Falhas ao gravar o ledger: N`) + bloco de erro em
      `stderr` nomeando que a invariante da AC3 não vale nesta execução, mandando rodar
      `db:status` e refazer o Passo 2 do runbook antes de usar `db:apply`, e dizendo
      explicitamente que o exit code não reflete isso e por quê.
    meu_julgamento: >-
      Concordo em não virar exit code, e por uma razão que esta própria onda documentou: um
      reset de ~7,5 min que sai `1` porque um INSERT auxiliar falhou é um sinal que as pessoas
      aprendem a ignorar — é a mesma patologia da régua sempre-vermelha que a AC4 corrigiu
      ("ninguém confia num sinal que nunca muda"). E o furo não depende de alguém ler o log: o
      próximo `pnpm db:status` mostra 268 `PENDENTE`, e o job do PR comenta `⚠️` sobre isso. A
      detecção é redundante e vem de fora do reset, que é o que torna o resumo suficiente.
    residuo_de_uma_linha_so: >-
      O bloco de erro é impresso ANTES de `if (codigo === 0) console.log("Banco de teste
      reconstruído.")`. A ÚLTIMA linha da tela continua sendo a tranquilizadora, sem
      qualificação — exatamente o lugar onde o olho pousa depois de 7,5 min. Qualificar essa
      linha final quando `falhasDeRegistro.length > 0` custa uma linha e não toca no exit
      code. Recomendação, não bloqueio.

