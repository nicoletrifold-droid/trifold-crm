status_reason: >-
  A fatia entrega o que promete e as guardas novas são load-bearing: reproduzi o
  ALTERADA-APÓS-APLICAR contra o banco de teste real (db:status exit 0 / db:apply exit 1
  sem aplicar nada), forcei o terceiro estado do G2 por caminho REAL (checkout raso
  sintético, não por flag na mão) e medi o falso-verde que ele impede, e verifiquei a
  régua da AC4 num commit simulado (151/0 verde · 151/2 vermelho sob a mutação nomeada).
  Dois achados me impedem de dar PASS, ambos baratos: (1) PR que DELETA uma migration já
  aplicada produz comentário `✅ limpo` cujo próprio corpo lista o arquivo como
  `ÓRFÃ-no-banco` — a justificativa da AC4 para excluir ÓRFÃ ("não pode ser um arquivo que
  o PR traz") é empiricamente falsa, porque `git diff --name-only` lista caminho apagado;
  (2) o `COMMENT ON COLUMN … via` da própria `245` enumera três valores e o código grava
  quatro (`reset-falha-conhecida`), e o custo de corrigir sobe depois que a `245` for
  aplicada em produção.
