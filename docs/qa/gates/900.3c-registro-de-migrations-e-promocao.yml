handoff_devops:
  liberado: true
  antes_do_push:
    - "Nada pendente de código. Commit `3ad76545`."
    - "Confira que `origin/main` está fresca antes de rodar qualquer régua: `git fetch --prune origin`. Sem isso as três medem contra uma main velha — mesmo modo de falha que esta story fechou para o número da migration."
  pos_squash_ou_pos_merge_de_main:
    - "É a única medição que caduca com reescrita de histórico. Rode as TRÊS e cole no PR."
    - |
      # 1. deleções (a régua original da AC)
      git diff --numstat origin/main...HEAD -- .github/workflows/ci.yml | awk '$2 != 0 { exit 1 }'

      # 2. FORMA do diff — use ESTA versão, com a base vindo do MERGE-BASE (ver abaixo)
      MB=$(git merge-base origin/main HEAD)
      BASE=$(git show "$MB":.github/workflows/ci.yml | wc -l | tr -d ' ')
      test "$(git diff --unified=0 origin/main...HEAD -- .github/workflows/ci.yml | grep -c '^@@')" = 1 &&
      git diff --unified=0 origin/main...HEAD -- .github/workflows/ci.yml | grep -q "^@@ -${BASE},0 +"

      # 3. os jobs pré-existentes continuam lá, e não ganharam gêmeo
      grep -c '^  static:\|^  tenancy-gate:' .github/workflows/ci.yml   # 2
    - >-
      ⚠️ **Por que a versão 2 difere da que está na AC:** a AC calcula `BASE` com
      `git show origin/main:…` (o **tip**), mas o hunk que ela compara vem do **merge-base**.
      Medi: se a `main` mexer no `ci.yml` (e vai — a paginação do `tenancy-gate` é story
      própria), a régua fica **falso-vermelha** com a branch impecável. Com `BASE` do
      merge-base o falso-vermelho some e ela continua acusando o defeito real. Vale um ajuste
      de uma linha na AC4 quando alguém passar por ela.
    - >-
      E a leitura que eu pedi para acrescentar, agora com a régua que a implementa: **verde no
      `numstat` não prova que nenhum job existente mudou.** Quem quiser a versão de bolso:
      `git diff origin/main...HEAD -- .github/workflows/ci.yml | grep -c '^-'` (tem de casar
      com o `$2` do numstat) e **leia onde o hunk começa** — se antes da última linha da base,
      algo pré-existente foi tocado, mesmo com deleções zero.
  no_PR:
    - "O job já rodou e produziu `## Migrations deste PR — ✅ Nenhuma migration deste PR está pendente`. Desfecho esperado; qualquer `⛔` é sinal real."
    - "`## Gate de tenancy` 🔴 é **pré-existente** (idêntico no #524 já mergeado) e tem `R3: 0` — a allowlist desta story está correta. Não bloqueia; vale escalar ao @pm."
  depois_do_merge_producao:
    - "Aplicar a `245` em produção pelo runbook, com a versão deste commit (CHECKs + COMMENT dos quatro valores de `via`). Passo 0 → 1 → 2 → 3, sem pular o Passo 0."
    - "O Passo 0 é o que impede aplicar no projeto errado: nenhuma query de dentro do Postgres devolve o ref (medido — `current_database()`/`cluster_name` respondem igual nos dois). Use o banner `[db-env] ref=`, o `pnpm supabase:check`, o ref na URL do SQL Editor, e o discriminador de conteúdo em `organizations`."
    - "Backfill **gerado na hora** (`npx tsx scripts/gerar-backfill-ledger.ts`), nunca `.sql` congelado; a guarda `RAISE EXCEPTION` só passa sobre ledger vazio, que é a janela do Passo 2. Confira `grep -c \"^  ('\"` == `ls supabase/migrations/*.sql | wc -l`."
    - "Depois: `TRIFOLD_ENV=producao pnpm db:status` (leitura, não exige `TRIFOLD_ALLOW_PROD`) e commitar o espelho — substitui o marcador `AINDA NÃO MEDIDO`. **Só então o item de DoD 'aplicada em produção' fecha.**"
