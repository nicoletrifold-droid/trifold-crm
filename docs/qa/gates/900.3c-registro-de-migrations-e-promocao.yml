      e o sintoma seria ALTERADA-APÓS-APLICAR FALSO — o pior estado possível, porque bloqueia
      o db:apply por um defeito do artefato. Verifiquei: o gerador não abre conexão nenhuma
      (zero referência a fetch/URL/PAT), é determinístico salvo o comentário de timestamp, e
      o hash que ele produz para a 245 bate com o registrado. Mesma lógica pela qual o número
      da migration é remedido em vez de herdado.
  - decisao: "aplicada_em fora do espelho"
    veredito: APROVADA
    razao: >-
      Evita 268 linhas de churn em todo PR que rodar o reset, afogando o sinal que interessa
      (mudou de estado? mudou de hash?). O timestamp continua no banco, que é a fonte, e há
      teste ancorado nisso (`Object.keys` == arquivo/estado/sha256/via). Sobra 1 linha de
      churn por `gerado_em`, que é aceitável.
  - decisao: "--json <caminho> no db:status"
    veredito: APROVADA
    razao: >-
      Raspar texto de terminal seria a forma frágil, e o arquivo vai onde o chamador manda
      (não se confunde com o espelho rastreado). Efeito colateral bom e verificado: o estado
      ⛔ "parsing sem casamento" passa a ser exercível de verdade — eu o exercitei.

correcoes_nao_previstas_julgadas:
  - correcao: "runSql truncava em 800 chars e quebrava a leitura do ledger de 268 linhas"
    veredito: "BUG REAL, correção certa"
    analise: >-
      Herdado do reset, onde `msg` é mensagem de erro e truncar é adequado. A separação
      runSql (truncado, comportamento idêntico ao de antes para o reset) / runSqlBruto
      (corpo inteiro, usado pela leitura) preserva o call site antigo e não inventa
      comportamento novo. O aviso está no JSDoc, no lugar onde o próximo a errar vai ler.
      runSqlJson devolve `null` tanto para "falhou" quanto para "não é JSON", e quem chama
      distingue isso de "li e veio vazio" — a distinção certa, verificada em tabelaExiste.
  - correcao: "entrada de trifold_migrations_aplicadas na allowlist do gate de tenancy (R3)"
    veredito: "RAZÃO SUFICIENTE — não é atalho"
    analise: >-
      Quatro coisas conferidas antes de eu aceitar: (a) é o mecanismo SANCIONADO — a própria
      mensagem de erro do gate manda "tabela nova legítima sem org_id vai para
      tenancy-allowlist.yml com reason: preenchido, que é revisável em diff"; (b) o @dev NÃO
      tocou `tenancy-known-tables.json`, a grandfather list congelada com checksum, que é o
      atalho de verdade e é o que a guarda `assertKnownTablesIntegro` existe para pegar;
      (c) a razão é verificável e verifiquei: RLS ligada com zero policies no .sql, nenhuma
      ocorrência da tabela em `packages/` (só scripts, docs e CI), e a tabela descreve o
      SCHEMA, que é único para todos os tenants — org_id não seria "esquecido", seria errado;
      (d) a allowlist é um Set único compartilhado por R2/R3/R6/R8, então investiguei o
      colateral: R2 exige hasOrgId, R6 exige org_id ou matview, R8 é sobre funções — nenhuma
      delas reportaria esta tabela de qualquer forma. A isenção não esconde nada além do R3
      pretendido.
  - correcao: "gate:tenancy envenenando docs/audits/gate-tenancy-report.json"
    veredito: "ACHADO LEGÍTIMO, restauração confirmada, conhecimento mal ancorado"
    analise: >-
      `git status` do arquivo está limpo ⇒ restaurado como declarado, e a suíte fecha
      274/274. Mas o conhecimento ficou na story e na memória do agente; o repositório
      continua sem aviso (ver OBS-6). É a diferença entre "o próximo não repete" e "o
      próximo descobre do mesmo jeito caro".

