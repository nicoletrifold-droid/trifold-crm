      diff=[244, 245] · relatório=[244, 245] ⇒ `estado=limpo`, listando as duas. A guarda não
      travou o caso normal.
    mutacao_M6: "guarda volta a `casados.length === 0` (prova em disco 1→0) ⇒ 🔴 **2 failed** / 15 passed"
  major_2_on_conflict_do_update:
    status: FECHADO
    tres_construtores: "`sqlDeRegistroObservado` (db:apply) · `sqlDeRegistroEmLote({sobrescrever})` (reset/backfill). O construtor único antigo `sqlDeRegistro` **não existe mais** (grep no repo: 0)."
    db_apply_nao_consegue_sobrescrever:
      prova_estatica: >-
        `db-apply.ts` importa **apenas** `sqlDeRegistroObservado` do módulo de ledger — não
        importa `sqlDeRegistroEmLote`. A única escrita no ledger no arquivo é a linha 210.
      prova_dinamica_contra_o_banco: >-
        Emiti o SQL EXATO que o `db:apply` emitiria para a `245` já registrada, com `sha256`
        falso (`aaaa…`) e `via='apply'`: `RETURNING` devolveu **`[]`** (length 0) e a linha
        ficou **byte a byte idêntica** — `sha`, `via` e `aplicada_em` inalterados.
      ramo_alcancado: >-
        `[]` (e não `null`) ⇒ o `db:apply` toma o ramo **ANOMALIA** ("já existia registro …
        NÃO sobrescrevi"), que é a mensagem certa. Confirmei que `[]` é mesmo o que a
        Management API devolve para resultado vazio (`select 1 where false` → `[]`, ok=true),
        ou seja: o ramo novo **é alcançável**, não é código morto mascarado pelo ramo de erro.
      achado_lateral: >-
        Minha primeira sonda usou `via='SOBRESCRITA-QA'` e **não chegou** ao `ON CONFLICT`: o
        CHECK novo a barrou com `23514`. Confirmação acidental de que o Minor dos CHECKs está
        vivo em produção-de-teste.
    reset_precondicao_verdadeira: >-
      Verificada na ordem de execução real de `main()`, não no comentário: `resetarSchema()`
      (que executa `drop schema if exists public cascade`) é a **linha 35** relativa de
      `main()`; a população do ledger é a **linha 133**. E `resetarSchema` lança em falha ⇒ a
      população é inalcançável se o drop não tiver acontecido. Precondição verdadeira.
    backfill_guarda_exercida_contra_banco_povoado: >-
      Gerei o SQL e o rodei contra o ledger POVOADO do teste: `ERROR P0001: ABORTADO:
      trifold_migrations_aplicadas nao esta vazia…`. Contagem por `via` **idêntica** antes e
      depois (`apply:1 · reset:263 · reset-falha-conhecida:4`). Ledger intacto.
    mutacoes: "M7 (DO NOTHING → DO UPDATE) ⇒ 🔴 1 failed · M8 (guarda do backfill some) ⇒ 🔴 1 failed"
    escape_hatch_julgado: >-
      `--sobrescrever` existe, é **opt-in**, sem default, e o SQL gerado carrega um cabeçalho
      `⚠️` dizendo exatamente o que ele destrói. O runbook **não** o menciona (conferido: 0
      ocorrências), então ele não vira atalho de procedimento. Aceito.
  major_3_fallback_seguia_apos_erro:
    status: FECHADO
    medido: >-
      O laço de statements agora dá `break` no primeiro `!s.ok` e a mensagem nomeia
