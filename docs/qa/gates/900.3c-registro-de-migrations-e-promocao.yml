verificacoes_da_rodada_4:
  1_o_tenancy_gate_voltou_intocado:
    pedido: "confirmar por conta própria — é o cerne da escolha de remover em vez de declarar"
    o_que_eu_medi_alem_do_pedido: >-
      Em vez de comparar só o intervalo do `tenancy-gate`, comparei o arquivo da base contra o
      **prefixo inteiro** do HEAD:
      `diff <(git show origin/main:.github/workflows/ci.yml) <(sed -n '1,194p' .github/workflows/ci.yml)`
      → **sem diferença**, e `sha256` idêntico nos dois
      (`6963eec1e9931d91ac063af21b612207e28124c153e45b1f66d357b7f6ab77c1`).
    porque_isso_e_mais_forte: >-
      Comparar o intervalo do job pressupõe saber onde ele começa e termina — e foi
      exatamente um erro de localização (um `replace(…, 1)` num bloco que existe duas vezes)
      que produziu o R3-1. A igualdade de prefixo não depende de eu acertar fronteira nenhuma.
    localizacao_conferida_pela_marca_interna: >-
      `const marca` aparece em duas linhas: **185** (`'## Gate de tenancy'`) e **336**
      (`'## Migrations deste PR'`). O `existentes.data.find` não paginado está na **189**
      (tenancy-gate, base) e o `github.paginate` na **357** (job desta story). Confirmei pela
      marca, não pela contagem de linhas — que é a lição do R3-1.
  2_a_regua_de_forma_acende_de_verdade:
    pedido: "reproduzir nos dois estados; ela é nova e nunca foi auditada por ninguém além de quem a escreveu"
    medido_por_mim:
      f6c21b21:  "numstat `170  0` → exit **0** (cega) · hunk `@@ -187,0 +188,170 @@` → forma exit **1** ✅ acusa"
      "3ad76545": "numstat `171  0` → exit 0 · hunk `@@ -194,0 +195,171 @@` → forma exit **0**"
    veredito: >-
      Ela discrimina exatamente a classe que passou por mim duas vezes: edição no meio do
      arquivo disfarçada de inserção pura porque a linha removida reaparece verbatim adiante.
      `194` é a última linha da base, então `-194,0` é a assinatura de "acréscimo puro no fim".
  3_fragilidade_da_regua_nova:
    pedido: "o que acontece quando a main andar? ruidosa é descartada"
    achado: "🟡 SIM, ela fica FALSO-VERMELHA — e não é hipótese, é medido"
    causa: >-
      A régua mistura duas revisões: `BASE` vem de `git show origin/main:…` (o **tip**),
      enquanto o cabeçalho de hunk que ela compara vem de `git diff origin/main...HEAD` (o
      **merge-base**). Enquanto tip == merge-base as duas coincidem; no instante em que a
      `main` mexer no `ci.yml`, deixam de coincidir.
    experimento:
      montagem: "clone descartável; `origin/main` avança acrescentando um job ao fim do `ci.yml` (194 → 199 linhas); a branch NÃO muda"
      resultado: "BASE(tip)=**199**, hunk continua `@@ -194,0` → régua de forma **exit 1**, com a branch impecável e o `numstat` verde"
    correcao_de_uma_linha_medida:
      forma: |
        MB=$(git merge-base origin/main HEAD)
        BASE=$(git show "$MB":.github/workflows/ci.yml | wc -l | tr -d ' ')
      no_cenario_do_falso_vermelho: "exit **0** ✅ (falso-vermelho eliminado)"
      ainda_discrimina: "contra `f6c21b21` segue **exit 1** ✅ — não perdeu poder"
    porque_importa_ja: >-
      Não é risco distante: a paginação do `tenancy-gate` ficou como **story própria** e vai
      mexer neste mesmo arquivo na `main`. E o `@devops` faz **merge de `main` na branch**
      (prática registrada dele) — é o cenário exato do falso-vermelho, na hora exata em que a
      story manda repetir a régua.
    severidade: "não bloqueia — hoje tip == merge-base e a régua está correta. Vai para o handoff com a forma corrigida pronta para colar."
  4_cobertura_das_tres_reguas:
    pedido: "nem sobreposição inútil nem buraco"
    matriz_construida_por_mim: |
      caso                                   numstat  forma  jobs
      C0  estado atual (correto)                0       0      0
      C1  deleção no meio (passo do `static`)   1       1      0
      C2  edita job existente                   1       1      0
      C3  2º header `static:` no bloco novo     0       0      1
      R3-1 real (edita + gêmea verbatim)        0       1      0   ← f6c21b21, medido
    leitura:
      numstat_e_subsumida_pela_forma: >-
        Forma verde ⇒ hunk único `-BASE,0` ⇒ zero linhas deletadas em qualquer lugar ⇒ numstat
        verde. Não existe estado com forma verde e numstat vermelho. Ela fica como redundância
        barata e robusta (não depende do cálculo de `BASE`), não como cobertura.
      jobs_NAO_e_redundante: >-
        C3 é a célula que só ela pega: acrescentar um segundo header `^  static:` **dentro do
        bloco novo** é acréscimo puro no fim — forma e numstat são verdes por desenho, e o
        YAML fica com chave duplicada. Contagem 2 → 3 acusa.
      buracos_que_sobram_e_sao_aceitos:
        - "as três olham só o `ci.yml`; outro workflow ficaria de fora (fora do escopo da AC)"
        - "provam FORMA, não conteúdo: nada verifica se o job acrescentado é são — por desenho"
        - "dependem de `origin/main` fresca. Sem `git fetch --prune origin` antes, medem contra uma main velha — o mesmo modo de falha que esta story fechou para o número da migration. Vale a mesma primeira linha."

