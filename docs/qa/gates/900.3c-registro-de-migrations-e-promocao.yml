top_issues:
  - id: "CONCERNS-1"
    severity: medium
    finding: >-
      PR que DELETA uma migration já aplicada recebe comentário `✅ limpo` cujo próprio corpo
      lista o arquivo como `ÓRFÃ-no-banco`, sob a manchete "já estão aplicadas e nenhuma foi
      alterada depois da aplicação". É o mesmo modo de falha que o G2 e o G5 existem para
      fechar (estado que parece verde e não foi medido), sobrando numa quarta classe.
    origem: "Defeito de ESPECIFICAÇÃO, não do @dev — a AC4 manda excluir ÓRFÃ e dá a razão."
    razao_da_ac_refutada: >-
      A AC4 diz "ÓRFÃ-no-banco fica de fora com razão: é registro sem arquivo correspondente,
      não pode ser um arquivo que o PR traz". Medido e falso: `git diff --name-only` LISTA
      caminho apagado. Reproduzido — commitei uma deleção num repo sintético e o caminho
      apagado apareceu na saída, e o aviso respondeu `estado=limpo`.
    evidencia: >-
      diff = supabase/migrations/244_org_admin_invite_email.sql (apagado);
      relatório = mesmo arquivo com estado ÓRFÃ-no-banco;
      aviso = "✅ Nenhuma migration deste PR está pendente… - `244_…sql` — ÓRFÃ-no-banco".
    suggested_owner: dev
    suggested_action: >-
      Uma linha em montarAviso: se algum arquivo do PR casar com ÓRFÃ-no-banco, o estado não
      pode ser `limpo`. Basta um terceiro bloco (ou promover para `indeterminado`) dizendo
      "este PR REMOVE uma migration que consta como aplicada no teste — o ledger vai ficar
      com registro órfão". Custa ~8 linhas e um teste.
    bloqueia_merge: false

  - id: "CONCERNS-2"
    severity: low
    finding: >-
      O `COMMENT ON COLUMN public.trifold_migrations_aplicadas.via` da própria `245` enumera
      TRÊS valores (backfill-onda-1, apply, reset). O código grava QUATRO — o
      `reset-falha-conhecida` que o @dev introduziu como [AUTO-DECISION] na mesma story
      (reset-tenancy-testdb.ts, lote `["reset-falha-conhecida", conhecidas]`). O bloco de
      cabeçalho do .sql tem a mesma omissão.
    porque_nao_e_cosmetico: >-
      É a autodocumentação que fica DENTRO do banco de produção, e o custo de corrigir sobe
      depois: a `245` já está aplicada e registrada no teste (via='reset', sha dab5cf88…);
      editar o arquivo agora faz o db:status marcar ALTERADA-APÓS-APLICAR e o db:apply
      recusar em bloco — a ferramenta desta própria story. O runbook já prevê o remédio
      (Rollback, linha 3: regerar o backfill, ON CONFLICT DO UPDATE corrige o hash), mas o
      caminho precisa ser escolhido de propósito, não descoberto.
    suggested_owner: dev
    suggested_action: >-
      Corrigir o COMMENT (e o bloco de cabeçalho) ANTES de o @devops aplicar a 245 em
      produção, re-registrando o hash no teste pelo procedimento do runbook. Se a fatia já
      tiver ido para produção, vira migration nova só com o COMMENT.
    bloqueia_merge: false

  - id: "CONCERNS-3"
    severity: low
    finding: >-
      O passo "Monta o aviso" interpola `${{ steps.diff.outputs.motivo }}` /
      `${{ steps.status.outputs.motivo }}` DENTRO de um bloco `run:`. O motivo embute
      `github.base_ref`, que é nome de branch. `toJSON()` protege aspas, mas o resultado vira
      string entre aspas DUPLAS em bash, onde `$(…)` e crase ainda expandem — e nome de ref
      do git aceita os dois.
    mitigacao_ja_existente: "guard de fork ⇒ só branch de quem já tem push no repositório"
    suggested_owner: devops
    suggested_action: >-
      Passar os dois motivos por `env:` no próprio passo e ler `$MOTIVO_DIFF`/`$MOTIVO_STATUS`
      entre aspas — é a recomendação padrão de hardening do GitHub e não muda o comportamento.
    bloqueia_merge: false

  - id: "CONCERNS-4"
    severity: low
    finding: >-
      A régua de não-reescrita da AC4, como escrita (`origin/main...HEAD`), só mede depois
      que o commit existe. É a quarta régua desta onda que fica verde sem medir no momento
      em que alguém a roda — mas, ao contrário das três anteriores, aqui a vacuidade é
      transitória e a propriedade É real (medida por mim em commit simulado: 151/0 verde,
      151/2 vermelho).
    suggested_owner: devops
    suggested_action: >-
      Rodar a régua LITERAL uma vez depois do commit, antes do push, e colar a saída no PR.
      Duas linhas. Alternativa (para stories futuras): a AC declarar as duas formas — árvore
      enquanto não há commit, `origin/main...HEAD` a partir dele — em vez de só a segunda.
    bloqueia_merge: false

  - id: "OBS-5"
    severity: low
    finding: >-
      O reset registra o ledger em bloco e, se o INSERT falhar, imprime "AVISO: falhou ao
      registrar N arquivo(s)" e segue com exit 0. Um reset "bem-sucedido" pode terminar com
      o ledger vazio, e a promessa da AC3 ("nada fica PENDENTE depois de um reset bem-
      sucedido") deixa de valer sem que o exit code mude.
    atenuante: "Não é silencioso (a linha AVISO é impressa) e o db:status seguinte denuncia."
    suggested_owner: dev
    suggested_action: "Somar a falha do registro ao código de saída, ou ao menos ao bloco de resumo final."
    bloqueia_merge: false

  - id: "OBS-6"
    severity: low
    finding: >-
      A armadilha que esta story descobriu do jeito caro — `pnpm gate:tenancy` REESCREVE
      `docs/audits/gate-tenancy-report.json`, que é rastreado E é fixture de
      `gate-tenancy-auditoria.test.ts` — está registrada só na story e na memória de agente.
      O repositório não avisa: nem `scripts/gate-tenancy.ts`, nem o teste, nem o próprio
      JSON (ele não tem campo `_aviso`, ao contrário dos outros arquivos de docs/audits/).
    verificado: "o report está limpo em `git status` ⇒ o @dev restaurou como declarou"
    suggested_owner: dev
    suggested_action: >-
      Fora do escopo desta story (é do ferramental da 900-2a/2c). Vale um item de backlog:
      `_aviso` no JSON ou um aviso impresso quando `gate:tenancy` roda contra ref != produção.
    bloqueia_merge: false

  - id: "OBS-7"
    severity: low
    finding: >-
      `docs/architecture/saas-multi-tenant.md:1134` continua dizendo que o snapshot é
      "regenerado por `scripts/sync-schema.sh` (já existe)" — script que ESTA story deletou.
      A referência já era falsa numa das duas metades (quem regenera é
