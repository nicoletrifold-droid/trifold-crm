  xnxvygyfyyyzwhiuoehz (teste). O único comando com TRIFOLD_ENV=producao foi
  `db:apply --yes`, que aborta na guarda de flag ANTES do primeiro fetch (db-apply.ts:82
  vs. o primeiro `tabelaExiste` na linha 90) — e ainda assim rodei com PAT deliberadamente
  falso como cinto de segurança. Árvore devolvida byte a byte ao estado do @dev.

