top_issues:
  - id: "R3-1"
    severity: high
    bloqueia_push: true
    finding: >-
      A correção de paginação do `listComments` foi aplicada ao job **`tenancy-gate`**
      (pré-existente em `origin/main`, Story 900-2c) em vez do job **`migrations-do-pr`**
      (o que esta story entrega). São três fatos medidos, e o commit message afirma o
      contrário dos três.
    medido_por_mim:
      fronteiras_dos_jobs: "static:27 · tenancy-gate:105 · migrations-do-pr:228"
      onde_ficou_o_paginate: >-
        linha 192, dentro de `tenancy-gate` — confirmado pela marca do próprio bloco na
        linha 185: `const marca = '## Gate de tenancy';`
      onde_ficou_o_nao_paginado: >-
        linhas 358-359, dentro de `migrations-do-pr`:
        `github.rest.issues.listComments({ owner, repo, issue_number })` + `existentes.data.find(...)`
      no_origin_main: >-
        `git show origin/main:.github/workflows/ci.yml` traz a versão NÃO paginada nas linhas
        188-189, dentro do `tenancy-gate` ⇒ o job pré-existente foi modificado por esta branch
    consequencia_1_ac4_nao_cumprida: >-
      A AC4 exige, com estas palavras, "procura um comentário existente do bot e atualiza
      in-place, **em vez de acumular um novo a cada push**". Com `listComments` sem paginação
      (30 por página), num PR com mais de 30 comentários o `find` devolve `undefined` e o job
      cria comentário NOVO a cada push. Hoje o PR #525 tem 5 comentários de issue, então o
      defeito ainda não se manifesta — é latente, não teórico, e o próprio @dev escreveu a
      correção certa (só a colou no outro job).
    consequencia_2_a_regua_da_ac4_ficou_cega:
      o_que_a_regua_diz: "`git diff --numstat origin/main...HEAD -- .github/workflows/ci.yml` → `170  0` · awk exit 0 · VERDE"
      porque_ela_esta_verde: >-
        O diff é um hunk único `@@ -186,4 +186,174 @@` com **zero linhas `-`**. As duas linhas
        retiradas do `tenancy-gate` continuam existindo, VERBATIM, no job novo (358-359), e o
        LCS do git as casou — representando a modificação de um job pré-existente como
        inserção pura.
      contrafactual_que_eu_construi: >-
        Clone descartável; apliquei ao job novo exatamente a mesma paginação (o conserto que o
        CodeRabbit pediu), o que elimina a linha duplicada; commitei; rodei a MESMA régua
        literal: **`174  2`** → awk **exit 1**, e as duas linhas `-` aparecem.
      leitura: >-
        A régua não é falsa em geral — ela é cega para "modificar um job existente colando uma
        cópia da linha antiga em outro lugar do mesmo arquivo". O item de DoD "arquivo não
        reescrito, régua verde" está satisfeito por vacuidade neste commit. É a quinta régua
        desta onda a perder poder discriminante, e a primeira por colinearidade de conteúdo
        dentro do próprio arquivo.
    suggested_owner: dev
    suggested_action: >-
      Paginar o job `migrations-do-pr` (é a correção que já está escrita, só no lugar errado).
      Sobre o `tenancy-gate`: a mudança lá é boa e eu NÃO peço reversão — peço que ela deixe de
      ser invisível. Duas saídas honestas: (a) manter e declarar na AC4 que esta story alterou
      duas linhas do `tenancy-gate`, com a régua reconhecendo `2` deleções esperadas e
      nomeadas; ou (b) tirar o `tenancy-gate` deste PR e levá-lo na story própria que o @dev já
      registrou. O que não pode continuar é a régua dizendo `0` sobre uma modificação real.
    nota_sobre_a_decisao_registrada: >-
      O @dev registrou como decisão consciente "não conserto o `tenancy-gate` aqui porque
      produziria deleções no `ci.yml` e derrubaria a régua". O julgamento é **certo** — é
      exatamente o raciocínio que eu queria ver. Mas o código faz o oposto: ele consertou o
      `tenancy-gate` e deixou o job novo. A decisão está correta e não foi executada.

  - id: "R3-2"
    severity: low
    bloqueia_push: false
    finding: >-
      O `tenancy-gate` está 🔴 no PR #525 — `86 FAIL · 1 WARN`, `{"R2":57,"R6":22,"R7":7,"R8":1}`
