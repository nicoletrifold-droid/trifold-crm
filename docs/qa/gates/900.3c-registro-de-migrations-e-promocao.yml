    idempotencia: "bloco `DO $$` com `IF NOT EXISTS (… pg_constraint …)` — necessário porque `CREATE TABLE IF NOT EXISTS` pula constraints e o Postgres não tem `ADD CONSTRAINT IF NOT EXISTS`. Correto."
