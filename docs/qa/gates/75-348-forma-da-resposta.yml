escopo: >
  Quatro mudanças em três prompts de PRODUÇÃO (o que a Nicole fala com lead pago) mais uma função de
  envio atrás de flag. O risco não está distribuído por igual: a divisão em dois balões é a única
  parte que pode partir uma confirmação de visita no meio — e essa classe de falha já custou um
  incidente (75-245). Por isso a divisão nasce DESLIGADA e com teste próprio.

resumo: >
  **A repetição não era criatividade do modelo: era prompt prescritivo.** Os três prints do Marcos
  chegaram com a MESMA mensagem template do Meta, histórico vazio e prompt igual — e o
  `system-personality` de produção não tinha uma linha pedindo variação de abertura (o "varie suas
  respostas" vivia só no lembrete final do código, depois de a estrutura já estar decidida).

  Dois agravantes encontrados na leitura e corrigidos aqui: **o teto de tamanho era contraditório**
  (banco dizia "3-4 frases", código dizia "2-3 parágrafos" — ela obedecia ao maior), e **o guardrail
  mandava prometer um retorno que não existe** (RN8/RN9: "já te retorno, combinado?"). A 75-268 matou
  essa frase só para agenda; o `visit-scheduling` ainda a AUTORIZAVA explicitamente para preço de
  unidade e detalhe técnico de obra. Os dois lados foram fechados no mesmo PR — senão um slug
  desmentiria o outro.

status_reason: >
  Liberado para merge. A divisão em blocos entra desligada por decisão de medição, não por dúvida
  técnica.

acoes_obrigatorias: []

concerns:
  - id: C1
    severidade: LOW
    tipo: decisão-de-medição
    titulo: "A divisão em dois balões vai desligada (`NICOLE_RESPOSTA_EM_BLOCOS`)"
    detalhe: >
      Ligar a mudança de escrita (prompt) e a divisão de envio no mesmo dia tornaria impossível saber
      qual das duas melhorou a conversa. A flag existe para separar as duas medições. Para ligar:
      `scripts/vercel-env-set.sh` (NUNCA `vercel env add` por stdin — grava vazio, dois incidentes) e
      `vercel redeploy`. Só o literal `true` liga; o vazio da Vercel não liga, e há teste para isso.
  - id: C2
    severidade: LOW
    tipo: atribuição-de-efeito
    titulo: "75-347 e 75-348 chegam à produção no mesmo dia"
    detalhe: >
      As duas mexem no que a Nicole fala. Quando o no-show for remedido daqui a algumas semanas, o
      efeito será do CONJUNTO — não dá para atribuir a uma das duas. Foi decisão consciente do Marcos
      ("quero tudo"), e está registrado aqui para ninguém concluir causalidade errada depois.
  - id: C3
    severidade: LOW
    tipo: infra-transiente
    titulo: "Um `npm run build` falhou de forma transiente"
    detalhe: >
      Três invocações do turbo encadeadas na mesma linha (type-check; lint; build) produziram um
      `Failed: @trifold/web#build` sem erro no output. Reexecutado com `turbo run build --force`
      (0 cache, 4/4 tasks): exit 0. Não há falha de build no código desta story.

