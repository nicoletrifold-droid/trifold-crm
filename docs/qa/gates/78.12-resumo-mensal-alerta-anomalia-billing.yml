top_issues:
  - id: 'REL-001'
    severity: low
    finding: >-
      Race no dedup do resumo mensal: SELECT-check → envia → INSERT em billing_monthly_summary_log.
      Dois runs verdadeiramente concorrentes passariam ambos no SELECT e enviariam 2 e-mails
      (o 2º INSERT falharia só no PK, tarde demais). Retries do Vercel são sequenciais (mitiga o
      caso real do AC5). O cron de anomalia (mesma story) JÁ usa o padrão robusto INSERT-claim
      (23505) — inconsistência interna.
    suggested_action: >-
      Trocar para INSERT-claim-first (INSERT ... ON CONFLICT (period) DO NOTHING RETURNING;
      só enviar se retornou linha). Preserva a AUTO-DECISION "sem retry" da story e fecha a race.
      Não-bloqueante — impacto é e-mail informativo duplicado, sem corrupção de dado.
  - id: 'REL-002'
    severity: low
    finding: >-
      Métrica emailsSent infla quando RESEND não está configurado: sendEmail RESOLVE com
      {id:null,error} em falha de config (não rejeita), então o .then(sent++) conta como enviado
      e o .catch nunca dispara para erro de config. Só afeta observabilidade do log, não a lógica.
    suggested_action: >-
      Inspecionar o retorno de sendEmail ({id, error}) para contabilizar sent/errors com precisão.
      Cosmético/observabilidade — opcional.

