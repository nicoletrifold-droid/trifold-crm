gate_decision:
  verdict: PASS
  rationale: >
    Implementação correta e robusta. A correção crítica de dedup/race resolve o
    risco real (duas bolhas/key duplicada e mensagem perdida no auto-envio) via
    dedupeById + mergeMessages; dep de effect estável e cleanup completo eliminam
    re-subscribe e memory leak. ACs todos atendidos; CON-1/CON-3/CON-7/CON-8
    limpos; testes dos helpers cobrem boundaries. A única pendência é de INFRA
    (habilitar Realtime para messages), registrada como INFRA-001 (medium) — é
    pré-condição de DEPLOY do feature, não defeito de código, e o sistema degrada
    graciosamente sem ela.
  next_steps:
    - "@devops *push (commit 67ed19b)."
    - "@data-engineer/@devops: habilitar `messages` em supabase_realtime (migration 102) ANTES do feature funcionar em produção."
    - "Smoke pós-infra: lead responde via WhatsApp → mensagem aparece em ≤3s sem reload; janela fechada reabre; banner muda de outra aba."
