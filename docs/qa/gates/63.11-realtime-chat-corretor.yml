dedup_race_analysis:
  result: SOLID
  notes: >
    Cenário do próprio envio do corretor (INSERT chega via realtime E volta no
    router.refresh): (1) serverPlusRealtime=dedupeById([...messages, ...realtime])
    — server vem primeiro, em colisão de id o server vence → NUNCA duas bolhas com
    a mesma key React. (2) mergeMessages(serverPlusRealtime, optimistic) descarta o
    otimista cujo id já está no server (id otimista é o REAL persistido, carryover
    de 63-5). (3) useEffect([messages]) chama pruneRealtime apenas quando
    hasStaleRealtime=true (retorna a mesma ref quando nada muda → evita re-render).
    Resultado: no máximo 1 bolha por id em qualquer frame; nenhuma mensagem perdida
    (pruneRealtime só remove o que já está em messages, que será renderizado pelo
    servidor). A ressalva da story sobre "ver 2x por 1 frame" é mais conservadora
    que o código real — o dedupeById já fecha esse frame.
  multi_conversation_cap: "conversationIds.slice(0,3) (MAX_REALTIME_CHANNELS=3, R3); 3 conversas mais recentes (page ordena created_at desc)."
  effect_dep_stability: "dep = conversationIds.slice(0,3).join(',') (string value-equal entre renders apesar de nova ref do array) → sem re-subscribe em re-render disparado por state. eslint-disable exhaustive-deps justificado e documentado."
  cleanup: "channels.forEach(ch => supabase.removeChannel(ch)) no return do effect — todos os canais; supabase é a instância do closure que criou os canais."

