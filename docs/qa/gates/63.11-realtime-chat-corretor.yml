  canais no unmount (sem leak). Badge/composer/banner reagem ao inbound via
  localLastMessageAt e lista combinada. CON-1/CON-3/CON-7/CON-8 limpos. Helper puro
  com 10 testes cobrindo boundaries. ÚNICA pendência é de INFRA (não de código):
  habilitar `messages` na publicação supabase_realtime (migration 102 NÃO aplicada
  — token Supabase expirado). Sem isso o feature fica inerte, mas degrada de forma
  graciosa (reload/router.refresh continua funcionando). Pronto para @devops *push,
  com a ressalva de que a habilitação do Realtime é pré-condição para o feature
  funcionar em produção.
