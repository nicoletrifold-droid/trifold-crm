    suggested_action: >
      DEPLOY BLOCKER do FEATURE (não do código): @data-engineer/@devops habilitar
      `messages` em supabase_realtime (Dashboard → Replication ou ALTER PUBLICATION
      supabase_realtime ADD TABLE messages;) ANTES de considerar 63-11 funcional.
