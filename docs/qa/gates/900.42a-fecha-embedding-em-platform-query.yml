      `postgrest-js@2.101.1` (`dist/index.cjs`, `PostgrestQueryBuilder.select`) que `count` vira
      `headers.append(\"Prefer\", \`count=…\`)` a partir do **segundo** argumento e nunca toca
      `searchParams.set(\"select\", …)`. A AC8 está certa no detalhe: as 3 stories do console
      (900-56/58/59) podem contar por `Prefer: count=exact` sem encostar nesta guarda — o conserto
      é estender a assinatura, não afrouxar o `(`.
  - ponto: "6. Não é parser, é heurística. Procurar o falso negativo e o falso positivo."
    veredito: >-
      **É o ponto mais frágil, e a fragilidade está TODA na rede estática — a de runtime é exata.**
      Ver seção 4.

# ═════════════════════════════════════════════════════════════════════════════
# 4. A HEURÍSTICA, SONDADA — FALSO POSITIVO E FALSO NEGATIVO
# ═════════════════════════════════════════════════════════════════════════════
heuristica:
  rede_de_runtime:
    regra: "`columns.includes(\"(\")`"
    falso_negativo: >-
      **Nenhum, para vazamento entre tabelas.** Toda forma do PostgREST que traz linha de OUTRA
      tabela exige `(`: embedding `t(cols)`, spread `...t(cols)`, alias `a:t(cols)`, hint
      `t!fk(cols)`, agregado `t(count)`. As formas sem `(` (alias de coluna `a:col`, cast
      `col::text`, caminho JSON `col->>x`) são todas da PRÓPRIA tabela — não atravessam a lista.
    falso_positivo: >-
      **Zero contra o schema real, medido.** `information_schema.columns` no `trifold-crm-dev`,
      via Management API: das 59 colunas das 5 tabelas da lista (`organizations` 11, `users` 20,
      `org_integrations` 8, `platform_audit_log` 9, `whatsapp_config` 11), **0 têm `(` ou `)` no
      nome**. Somado a agregados desligados (AC8), não existe consulta legítima que a guarda
      recuse hoje. Os 12 `columns` distintos de produção estão em fixture no teste.
  rede_estatica:
    regra: "`/(?:platformQuery|\\.\\s*select)\\(([^)]*)/g` + `argumentos.includes(\"(\")`"
    sondagem: "10+3 formas passadas pela função, fora da árvore (node -e, nenhum arquivo no repo)."
    acende_corretamente:
      - "embedding literal, 1 linha e multi-linha"
      - "`...leads(name)` (spread)"
      - "`l:leads!org_id(name)` (alias + hint de FK)"
      - "`id, users(count)` (agregado)"
      - "**`platformQuery(t,\"id\").select(\"id, leads(name)\")`** — o `.select` encadeado acende pelo ramo `\\.\\s*select`"
    nao_acende_corretamente:
      - "os 12 `columns` reais de produção"
      - "`platformQuery()` citado em prosa"
      - "encadeamento `.eq()/.order()` depois da chamada"
      - "**`.select(\"id\", { count: \"exact\", head: true })`** — a forma que as stories 900-56/58/59 vão usar NÃO acende. Compatível com a AC8."
    falsos_negativos_encontrados_pelo_qa:
      - forma: "`)` em comentário ANTES do argumento com embedding"
        exemplo: "`platformQuery(\\n \"organizations\", // o fecha-parenteses )\\n \"id, leads(name)\",\\n)`"
      - forma: "`)` dentro de uma string ANTES do embedding"
      - forma: "concatenação com uma string contendo `)` antes do embedding"
    cobertura_dos_falsos_negativos: >-
        **Os 3 são pegos pela rede de RUNTIME** — em todos, o valor resolvido de `columns` contém
        `(`. São falsos negativos da rede estática, não do sistema. `[^)]*` parar no primeiro `)`
        é o custo declarado de não ser parser, e o custo é pago pela outra rede. **Registro, mas
        não cobro.**
    falso_positivo_conhecido: >-
      `.select(algumaFuncao())` dentro dos 2 diretórios varridos acende. Falha na direção segura
      (teste vermelho com código certo, ruído visível). Declarado no próprio arquivo.

# ═════════════════════════════════════════════════════════════════════════════
# 5. AS 5 COISAS QUE O @dev DECLAROU NÃO TER PROVADO — JULGADAS
# ═════════════════════════════════════════════════════════════════════════════
nao_provado_pelo_dev:
  - item: "1. Que a guarda protege em PRODUÇÃO."
    veredito: "ACEITO como limite honesto. É inferência a partir dos 13 call sites + suíte, e ele diz isso com todas as letras. A prova é do @devops pós-deploy. Não é dívida desta story."
  - item: "2. Que embedding é a última forma de vazamento por `columns`."
    veredito: >-
      **PARCIALMENTE REFUTADO A FAVOR DELE.** Varri a gramática de `select` do PostgREST: as
      únicas formas que atravessam tabela (embedding, spread, alias, hint, agregado) TODAS exigem
      `(`. As que não exigem (alias de coluna, cast, caminho JSON) são da própria tabela. Ele
      fechou mais do que sabia ter fechado, **por `columns`**. O buraco não está em `columns` —
      está no canal que ele não considerou (concern 1).
  - item: "3. Que `PLATFORM_READABLE_TABLES` está correta."
    veredito: "ACEITO. AC7 exclui explicitamente. Continua sem dona — ver observação 2."
  - item: "4. Que a rede estática cobre `columns` dinâmico."
    veredito: "ACEITO e registrado no código. É o limite declarado, e a rede de runtime o cobre — EXCETO na interseção da concern 1."
  - item: "5. A afirmação 'todo acesso de plataforma passa por platformQuery()' é FALSA hoje."
    veredito: >-
      **A VARREDURA DELE CONFERE, e a conclusão também.** Reli `platform-guard.ts:38-39,55-56` e
      `admin-invite.ts:120,142,169`: todos os `.select()` ali usam **literal fixo no fonte**
      (`\"id, email, name, is_platform_admin\"`, `\"id, auth_id, email, name\"`,
      `\"admin_invite_email\"`), nenhum tem `(`, e **nenhum recebe `columns` por parâmetro** — não
      há o que um chamador contamine. **Não são exploráveis pelo mecanismo desta story.** O que
      acrescento: eles moram em `lib/tenancy/`, FORA dos 2 diretórios que a rede estática varre,
      então uma edição futura ali não acende nenhuma das duas redes. Ver observação 2.
  - item: "6. A causa dos 7 vermelhos fantasma."
    veredito: >-
      **Não reproduzi, e a causa provável é minha, de ontem** (`feedback_arvore_compartilhada_
      explica_o_flake`): `*.test.ts` de outra sessão dentro do glob. Confirmei que a árvore está
      limpa disso agora. O @dev fez certo em não registrar causa que não mediu.

