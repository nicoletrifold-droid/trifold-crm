base: "árvore não commitada sobre `a7cbfc35` (branch `story/900-42a-fecha-embedding-platform-query`)"
escopo_revisado: >-
  As 4 ACs de implementação (AC1-AC6) e as duas de escopo (AC7, AC8). Os 4 arquivos de
  `packages/web/src/lib/tenancy/` do File List. NÃO revisado: comportamento em produção (não
  existe ainda — é do @devops depois do deploy), e a auditoria da lista `PLATFORM_READABLE_TABLES`,
  que a própria AC7 exclui.

status_reason: >-
  **O furo medido está fechado, e a prova é boa — melhor do que a story alega em um ponto e pior
  em outro.** Reproduzi as mutações que sustentam o veredito e ACRESCENTEI a que faltava: a M2 do
  @dev (predicado invertido) derruba 11, mas seu conjunto de morte é SUPERSET do da M1, não
  disjunto — inversão não é o mesmo que "guarda que recusa tudo". Rodei a mutação fiel
  (`columns.length > 0`, a guarda que protegeria e pararia o painel): ela derruba **exatamente os
  6 testes de caminho legítimo e NENHUM dos 5 de recusa**, enquanto a M1 derruba **exatamente os 5
  de recusa e nenhum legítimo**. Conjuntos DISJUNTOS de verdade — é isso, e não a contagem 11×5,
  que prova que a régua distingue em vez de reagir. A M5 confere: com o walker devolvendo `[]` o
  `it` novo fica VERMELHO, e quando removo APENAS o `expect(arquivos.length).toBeGreaterThan(0)`
  de dentro dele, ele fica VERDE sob o mesmo walker morto — a guarda de vivacidade é portante, não
  decorativa, e não é herdada do `it` irmão da 900-22b. A M4 confere: entre os 10 vermelhos está a
  varredura da ÁRVORE REAL, prova de que ela lê arquivo e reage a conteúdo. A AC8 eu remedi
  sozinho contra o `trifold-crm-dev`, **com chave anon, sem service-role**: `?select=count()` →
  400 `PGRST123`, `?select=id,users(count)` → 300 `PGRST201`, controles 200. E confirmei no fonte
  do `postgrest-js@2.101.1` que `count` viaja no **segundo** argumento de `.select()` virando
  cabeçalho `Prefer` — ortogonal a `columns`, como a AC8 afirma. A divergência declarada (endurecer
  também a rede estática) está CERTA e é comprovadamente aditiva: `detectRawTableReads` tem
  **sha256 idêntico** ao de `HEAD`, e os 13 `it` pré-existentes não têm uma linha alterada.
  **O que segura o gate é um achado meu, novo, que não está em nenhuma das 5 coisas que o @dev
  declarou não ter provado:** `platformQuery()` devolve o query builder, e
  `PostgrestTransformBuilder.select()` faz `url.searchParams.set("select", ...)` — ou seja,
  **`platformQuery(t, "id").select("id, leads(name, phone)")` SOBRESCREVE o select e emite
  exatamente a consulta que vazou as 6 linhas de lead**, sem passar pela guarda nova. A rede
  estática pega essa forma quando o argumento é literal e o arquivo está nos 2 diretórios varridos;
  ninguém pega quando o argumento vem de variável. Nada disso é regressão — antes desta story as
  DUAS formas passavam — mas a AC1 afirma "nenhuma consulta que emitiria uma linha de tabela fora
  de `PLATFORM_READABLE_TABLES` deve chegar ao Supabase", e essa afirmação, hoje, é maior que o
  código. É a diferença entre "protegi" e "estreitei", e uma story de segurança que deixa a
  diferença sem registro é como a próxima incidência nasce.

