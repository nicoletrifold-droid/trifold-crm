# ═════════════════════════════════════════════════════════════════════════════
briefing:
  - ponto: "1. A M2 é a mutação que sustenta tudo. Reproduzir."
    veredito: "REPRODUZIDA — 11 failed/6 passed, nomes conferidos. Mas ver M2' acima: a M2 sozinha não é disjunta da M1. O par disjunto agora existe."
  - ponto: "2. A M5 e a régua que aprova o vazio. Confirmar que o `toBeGreaterThan(0)` está no mesmo `it`."
    veredito: "CONFIRMADO por medição, não por leitura. Removendo só aquele `expect`, o `it` fica verde sob walker morto."
  - ponto: "3. A M4 prova que a varredura lê arquivo de verdade."
    veredito: "CONFIRMADO. A varredura da árvore real está entre os 10 vermelhos da M4."
  - ponto: "4. A divergência (fechar também `platform-query-scan.ts`) foi certa?"
    veredito: >-
      **CERTA — confirmo o julgamento do dono do produto, e agora com medição.** (a) Aditiva de
      fato: `detectRawTableReads` tem sha256 `8578111a…3238d3fc` idêntico ao de `HEAD`; o diff do
      arquivo é 44/0; o do teste é 110/1, e a única linha removida é o `import`. (b) Os 13 `it`
      pré-existentes seguem intactos — que é EXATAMENTE a condição que as próprias Dev Notes
      definiram para dizer que o escopo foi respeitado ("se algum quebrar, é sinal de que a
      checagem nova tocou algo fora do escopo"). (c) O mérito: o comentário de topo de
      `platform-query-scan.ts` afirma garantir a fronteira dos diretórios de plataforma. Deixá-lo
      cego para metade do mecanismo é criar uma garantia alegada — a mesma classe de defeito que
      esta story existe para fechar, um nível acima. **Endurecer uma rede e deixar a outra
      acreditando que vigia é pior que as duas fracas: as duas fracas ninguém confia.**
  - ponto: "5. A AC8 e o custo zero."
    veredito: >-
      **CONFIRMADO, remedido por mim com chave ANON (sem service-role) contra `trifold-crm-dev`,
      com `User-Agent`:** `?select=count()` → **400 `PGRST123` \"Use of aggregate functions is not
      allowed\"**; `?select=id,users(count)` → **300 `PGRST201`** com o payload de relacionamento
      ambíguo; controles `?select=id,name,slug` e `?select=id,leads(name,phone)` → 200 (`[]` sob
      RLS de anon — o 200 prova que o servidor ACEITA a sintaxe; quem devolve as linhas é o
      service-role de `createAdminClient()`, que é o caminho do `platformQuery()`). **Fechar `(`
