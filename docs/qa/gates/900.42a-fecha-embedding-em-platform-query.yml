# 8. CONCERNS
# ═════════════════════════════════════════════════════════════════════════════
top_issues:
  - id: "QA-900-42A-1"
    severity: medium
    bloqueia_merge: false
    finding: >-
      **O canal que a guarda não cobre: o `.select()` encadeado no builder devolvido.**
      `platformQuery()` devolve o `PostgrestFilterBuilder`, que herda `.select()` de
      `PostgrestTransformBuilder`. Lido no fonte de `postgrest-js@2.101.1` (`dist/index.cjs`
      l.368-378): `select()` faz `this.url.searchParams.set(\"select\", cleanedColumns)` — **set,
      não append: SOBRESCREVE**. Logo `platformQuery(\"organizations\", \"id\").select(\"id,
      leads(name, phone)\")` emite a MESMA consulta que vazou as 6 linhas de lead com `phone`
      não-nulo, e **não passa pela guarda nova**, que só inspecionou `\"id\"`.
      Cobertura residual: a rede estática pega essa forma (medido: acende pelo ramo
      `\\.\\s*select`) **desde que** o argumento seja literal E o arquivo esteja em
      `app/platform/**` ou `app/api/platform/**`. **Ninguém pega**
      `platformQuery(t,\"id\").select(variavel)`.
      **Não é regressão** — antes desta story as duas formas passavam, e hoje nenhum dos 13 call
      sites encadeia `.select()` (verificado: `git grep \"\\.select(\"` nos 2 diretórios devolve
      só um mock em `resend-admin-invite/route.test.ts`). É a diferença entre "protegi" e
      "estreitei", e a AC1 hoje afirma a primeira.
    suggested_action: >-
      **Antes de fechar a story (barato, sem mudar comportamento):** acrescentar ao bloco
      `EMBEDDING DO POSTGREST — FECHADO` do docstring de `platform-query.ts` 3-4 linhas dizendo
      que a guarda cobre o `columns` que ENTRA, não o builder que SAI; que `.select()` encadeado
      sobrescreve o `select` e é pego só pela rede estática, e só na forma literal dentro dos 2
      diretórios; e que o fechamento desse canal (devolver um builder com `select` selado, ou
      varrer `.select(` em `lib/tenancy/**` também) precisa de número de story novo.
      **E abrir item no backlog** com esse texto. Sem isso, o próximo leitor herda de AC1 uma
      garantia maior que o código — que é exatamente o defeito que esta story fecha um nível
      abaixo. Não peço mudança de código nesta story.
  - id: "QA-900-42A-2"
    severity: low
    bloqueia_merge: false
    finding: >-
      **Os dois leitores fora das duas redes.** `platform-guard.ts` (`.from(\"users\")
      .select(\"id, email, name, is_platform_admin\")`, 2×) e `admin-invite.ts` (`users`,
      `organizations`) leem com service-role, **não passam por `platformQuery()`** e moram em
      `lib/tenancy/` — **fora dos 2 diretórios que a rede estática varre**. Hoje são inofensivos
      pela razão estrutural que o @dev deu e que eu confirmei (colunas literais fixas, sem
      parâmetro, sem `(`). Mas depois desta story eles passam a ser **o único caminho de leitura
      de plataforma que nenhuma das duas redes observa** — e nada avisa se uma edição futura
      acrescentar `(` ali.
    suggested_action: >-
      Entrar como item nomeado na story de consolidação da AC7 (a que auditará
      `PLATFORM_READABLE_TABLES`): ou estender `DIRETORIOS_VARRIDOS` para incluir
      `lib/tenancy/**` com exclusão explícita dos 2 arquivos sancionados, ou registrar a exceção
      no docstring dos dois. Não é trabalho desta story.

