status_reason: 'AC1–AC9 atendidos, com as duas ressalvas do @po cumpridas e uma delas tendo pego um erro real: a story dizia "6 pontos em 5 arquivos" e são **8 pontos em 6 arquivos** — dois arquivos têm dois pontos de renderização cada. Contados um a um após a implementação: 1+1+2+2+1+1 = 8. Segurança verificada por payload explícito, não por leitura: javascript:, data:, vbscript:, file: e <script> atravessam como TEXTO. Suíte 1445, tsc limpo, eslint limpo, build 20.7s.'
