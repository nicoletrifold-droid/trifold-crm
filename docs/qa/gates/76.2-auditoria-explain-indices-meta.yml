# Parecer crítico sobre a ausência do EXPLAIN real (questão central do gate)
explain_limitation_assessment: |
  ACEITÁVEL para fechar como auditoria — com follow-up registrado, não bloqueio.
  Justificativa: (a) o objetivo da story é decidir SE existe gap que exija índice novo;
  o fator decisivo Seq Scan vs Index Scan é a cardinalidade, que FOI medida de fato em
  produção (≤1.172 linhas); (b) nessa escala todas as tabelas cabem em poucas páginas de
  heap e o planner legitimamente prefere Seq Scan — não há cenário plausível em que um
  índice novo se justifique, então o EXPLAIN real NÃO mudaria o desfecho "zero DDL";
  (c) nenhuma DDL é entregue → não há mudança a regredir, risco operacional nulo;
  (d) criar índice "por precaução" seria a ação ERRADA (violação Article IV). Portanto o
  EXPLAIN inferido é suficiente para a DECISÃO. A confirmação empírica continua sendo um
  upgrade de evidência desejável ("inferido" → "confirmado"), mas não é load-bearing para
  a correção da conclusão. Não justifica bloquear/manter a story parcial indefinidamente.

