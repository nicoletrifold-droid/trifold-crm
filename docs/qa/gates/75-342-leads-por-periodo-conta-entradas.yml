escopo: >
  Uma query, um rótulo e dois comentários. O risco não está no tamanho da mudança: está em ela ser
  uma REMOÇÃO de filtro numa rota que não tinha teste nenhum. "Tirar filtro" e "tirar filtro demais"
  são a mesma linha de diff.

resumo: >
  **As quatro mutações que importam mordem.** Reintroduzir o filtro de desfecho derruba 6 dos 10
  casos; tirar `segmento='principal'` derruba 7 (o IMOB volta a contar); tirar o `org_id` recém-
  adicionado derruba 6; quebrar a paginação derruba exatamente 1 — o caso dos 1001 leads, que é o
  único que a cobre. Os md5 dos dois arquivos mutados voltaram idênticos.

  A mudança de números em produção é ESPERADA e é o objetivo: o gráfico sobe para a base de
  entradas. Nenhuma outra tela consome esta rota (grep em `packages/web/src`: só `leads-chart.tsx`),
  e o PDF não tem série por período — então o raio de impacto é o próprio gráfico.

status_reason: >
  Liberado para merge. Uma dívida declarada (C1) e uma conferência que só existe pós-deploy (P1).

acoes_obrigatorias: []

concerns:
  - id: C1
    severidade: LOW
    tipo: dívida-de-teste
    titulo: "O rótulo (AC2) não tem rede"
    detalhe: >
      Trocar "Entradas no período" de volta para "Total no período" passa com a suíte inteira verde.
      O projeto não tem infra de teste de componente (sem jsdom) e extrair uma string estática para
      uma função pura só para testá-la seria cerimônia sem ganho. Risco real: baixo — se o rótulo
      voltar, o número continua certo; volta a divergência de LEITURA, que é o que a story
      documenta em comentário no próprio JSX.

impactos_conhecidos_e_aceitos:
  - titulo: "As barras sobem, e o histórico do gráfico muda"
    detalhe: >
      Quem olhar o gráfico depois do deploy vai ver dias mais altos que ontem. É a correção: o
      número anterior excluía os leads que entraram e depois foram marcados como perdidos. Na
      janela de 7d medida em 18/08 a diferença era de 10 leads (62 × 52).
  - titulo: "A paginação deixou de ser precaução"
    detalhe: >
      O recorte novo é o mesmo do /executive — 1.650 leads em 90d em prod, contra 612 do recorte
      antigo. O laço de `fetchAllLeads` já existia (75-269) e agora é o que impede o corte
      silencioso em 1000. Coberto por teste (M4).
  - titulo: "`org_id` explícito é acréscimo de escopo do @dev"
    detalhe: >
      Uma linha, fora dos ACs, encontrada porque o teste da outra org falhou. Não muda número em
      produção (RLS isola, org única), alinha esta query às demais 17 do Analytics. Sinalizado ao
      Marcos no PR — se ele preferir o escopo estrito, a linha sai sozinha.

