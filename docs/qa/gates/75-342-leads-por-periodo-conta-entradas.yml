pendencia_pos_deploy:
  - id: P1
    detalhe: >
      Em crm.trifold.eng.br/dashboard/analytics?range=7d, os três números têm que coincidir:
      régua do Pipeline ("N entradas no período"), card Entradas e o rodapé do gráfico. E o total do
      "Ritmo de Entradas" tem que bater com o do "Leads por Período" — são os dois gráficos que
      discordavam. Se não baterem, a causa é outra e a story não terminou.
  - id: P2
    detalhe: "Repetir em 30d e 90d (janela maior, diferença maior) e conferir se o dropdown de Origem ganhou alguma origem."
