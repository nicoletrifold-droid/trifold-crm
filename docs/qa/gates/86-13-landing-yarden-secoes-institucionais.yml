issues:
  - severity: low
    category: requirements
    id: "86.13-QA-001"
    description: >
      Stat 5 da seção Overview traz o número grande "2 subsolos + rooftop" com a legenda
      "lazer completo em dois níveis". Pela Ficha Técnica os 2 subsolos são de garagem;
      o lazer está no térreo e no rooftop. A legenda pode sugerir que o lazer ocupa os
      subsolos.
    recommendation: >
      NÃO é defeito de implementação — o texto está literalmente conforme a AC3, travada
      pelo stakeholder em 2026-09-03 (D1). Levar ao @po/stakeholder se quiser precisão
      ("térreo + rooftop"). O @dev não tem autoridade para alterar AC travada.
    blocking: false

  - severity: low
    category: code
    id: "86.13-QA-002"
    description: >
      `.banda{background-attachment:fixed}` só volta a `scroll` no @media (max-width:560px).
      Entre 561px e 979.98px (tablets/iPad) o `fixed` permanece — e o iOS Safari o ignora
      em qualquer largura.
    recommendation: >
      Cosmético. Herdado do padrão do `.band` da landing irmã e explicitamente autorizado
      pela AC7. Screenshot a 768px conferido pelo QA: banda legível, sem distorção.
      Registrar como dívida menor, não corrigir nesta story.
    blocking: false

  - severity: low
    category: docs
    id: "86.13-QA-003"
    description: >
      O File List não menciona os 3 arquivos de `.claude/agent-memory/aios-dev/` alterados
      nos commits 083526d8 e a1a47d56.
    recommendation: >
      Sem impacto de produto. Conformidade literal com a DoD #5 mantida (nada de código
      fora de `landing-pages/yarden/`). Anotar no próximo commit de memória.
    blocking: false

  - severity: info
    category: tests
    id: "86.13-QA-004"
    description: >
      A suíte completa da raiz mostra 71 asserções falhas em 3 arquivos de `packages/web`
      e 12 erros em `turbo type-check`. Nenhum tem relação com esta story.
    recommendation: >
      Causa provada pelo QA, não presumida: (1) `git log merge-base..HEAD -- packages/`
      é VAZIO — a branch inteira nunca tocou `packages/`; (2) os 4 arquivos envolvidos têm
      blob idêntico entre 06e9ecfa e HEAD; (3) `node_modules` desta worktree é symlink para
      `/Users/lucasprado/trifold-crm/node_modules`, instalado para o estado de `main`, que
      está 18 commits à frente — daí `@trifold/ai/src/flows/loop-breaker` e os símbolos de
      `@trifold/shared` não resolverem. Artefato de ambiente, não regressão.
    blocking: false

