top_issues:
  - id: 'TEST-001'
    severity: medium
    finding: >-
      No pipeline, `const vazioPorFalha = slots.length === 0 && indisponiveis > 0` tem as duas
      metades INERTES sob mutação vizinha. Medido por mim: `indisponiveis > 0` → `> 1` = 0
      vermelhos em 792; `slots.length === 0` → `>= 0` = 0 vermelhos em 792. Os testes de
      período no nível do pipeline só exercitam os extremos (nenhuma falha, ou todas). O
      segundo caso é o X-1 da própria story ("qualquer erro bloqueia tudo") no nível em que o
      bloco é decidido: com a mutação, um período com 3 horários livres e 1 sonda falha viraria
      recusa, apagando oferta legítima. A degradação parcial está coberta no nível unitário
      (AC3-iii de `freeSlotsInPeriod`), NÃO na composição do pipeline.
    suggested_action: >-
      Um teste em `pipeline-agenda-state.test.ts` com falha PARCIAL no período — o gancho já
      suporta (contar as sondas dentro de `ehSondaDeSlot` e falhar só a 1ª). Asserção: o bloco
      continua "Horários LIVRES nesse período", o CHECK sai com `indisponiveis > 0` e
      `desfecho: "ofertou"`. ~15 linhas. NÃO bloqueia o deploy deste P0.
  - id: 'DOC-001'
    severity: low
    finding: >-
      As contagens de mutação são sensíveis à FORMA da mutação, e a story publica o número sem
      publicar o diff aplicado. Medi M1 = 17 aplicando a linha original literal
      (`const { data } = await`) e 16 mantendo a desestruturação e só ignorando o `error`: a
      diferença é exatamente a régua da AC7, que tem vermelho próprio. Mesmo efeito em M4
      (declarado 2 · @dev 2 · meu 3, mutando os dois sítios de slot) e M2 (@dev 34 · meu 32).
      Nenhuma dessas divergências indica falha de qualidade — indica que o número sozinho não
      é reproduzível.
    suggested_action: >-
      Nas próximas stories da família, publicar o hunk exato da mutação ao lado da contagem.
  - id: 'MNT-001'
    severity: low
    finding: >-
      A régua da AC7 só reconhece a forma `const {…} = await`. `const r = await q…; const data =
      r.data` passa por ela. Limite conhecido de régua textual — a guarda real é o tipo
      tri-estado, que o compilador cobra.
    suggested_action: 'Nenhuma ação. Registrado para quem for estender a régua.'

