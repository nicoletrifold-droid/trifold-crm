armadilhas_do_meu_proprio_instrumento:
  - >-
    Não tenho `psql` nem `docker` nesta máquina: QA-75-371-2 e -3 são análise do mecanismo, não
    medição. Registrei a reprodução exata em vez de afirmar que rodei — o oposto disso já
    produziu falso verde neste projeto.
  - >-
    A mutação M1 mata 2 dos 4 testes do DELETE, não 4: "etapa comum continua sendo excluída" e
    "gate de capability vem antes da guarda" continuam verdes sem a guarda, porque nenhum dos
    dois discrimina a existência dela. São testes de não-regressão válidos, mas não são
    carrascos — contei certo para não superestimar a rede.
