fatos_de_processo:
  titulo: "A migration 250 JÁ ESTÁ EM PRODUÇÃO, e foi aplicada com o gate ainda em CONCERNS"
  como_descobri: >-
    `git status` acusou `docs/audits/migrations-aplicadas.json` modificado — arquivo que eu não
    toquei. O diff mostra produção saindo de **270 para 273** migrations aplicadas, com 248, 249
    e **250** entrando como `aplicada` via `apply`, auditoria regerada em 2026-09-01T14:02:44Z.
    O commit `4ebd1f9b` é de 10:59:56 -0300 (13:59:56Z) — ou seja, aplicou-se em prod ~2 min
    depois do commit, enquanto o único veredito de QA existente era o **CONCERNS** da rodada 1.
  linha_do_tempo:
    - "rodada 1 do gate → CONCERNS (4 bloqueios)"
    - "@dev corrige os 6 achados"
    - "commit 4ebd1f9b (13:59:56Z)"
    - "`db:apply` em PRODUÇÃO — 248, 249 e 250 (14:02:44Z)"
    - "só então o re-gate foi pedido"
  o_que_isto_viola: >-
    REGRA ZERO do `CLAUDE.md`: "Deploy sem quality gate @qa = VIOLAÇÃO". Aplicar migration em
    produção é ação de deploy, e deploy é autoridade EXCLUSIVA do @devops
    (`.claude/rules/agent-authority.md`). Registro como fato, não como reprovação: o gate julga a
    MUDANÇA, e a mudança está boa. Mas a ordem foi invertida e isso precisa estar escrito.
  a_boa_noticia_e_medida: >-
    **A versão que entrou em prod é a CORRIGIDA.** Confirmei em dois níveis independentes:
    (1) o `sha256` registrado como aplicado
    (`b9722f4439541f4e150c00541e9910e86a46e6118d85b3128357b48443d4ea60`) é byte a byte igual ao
    arquivo em disco, que tem a guarda do QA-2 e o `ORDER BY is_active DESC` do QA-3;
    (2) consultei o CORPO da função viva em produção (`pg_proc.prosrc`) e a guarda está lá.
    Não é o arquivo que diz — é o banco.
  risco_colateral: >-
    O mesmo `db:apply` levou 248 e 249 junto. Fora do escopo desta story, mas quem revisou a 250
    não necessariamente revisou aquelas duas.
  acao_necessaria: >-
    Corrigir a seção "Pendências para @devops" da story, que ainda afirma "a migration 250 não
    foi aplicada em banco nenhum — só provada e revertida". **Isso agora é falso** e é a primeira
    coisa que a próxima pessoa vai ler.

verificacao_de_producao_pos_deploy:
  metodo: >-
    Como o deploy já havia acontecido, conferir o estado real de prod passou a ser dever meu.
    LEITURA PURA (SELECT em catálogo + contagens), sem transação e sem escrita — `TRIFOLD_ALLOW_PROD`
    existe para escrita, e nada aqui escreve. Script: `qa-verifica-prod-250.ts`.
  medido:
    indice_parcial_existe: 1
    trigger_existe: 1
    guarda_do_QA2_viva_no_corpo_da_funcao: 1
    eh_security_definer: 0
    total_defaults: 1
    defaults_em_etapa_inativa: 0
    orgs_sem_padrao: 0
    quem_e_o_padrao: "Aguardando atendimento (pos 0)"
    total_etapas: 18
    total_orgs: 1
  veredito: >-
    **Produção sadia e a invariante vale nas três direções que importam**: exatamente um padrão,
    nenhum padrão em etapa inativa, nenhuma org sem padrão. `prosecdef = 0` confirma que o
    trigger roda com direitos do INVOCADOR como projetado — nada de escalada de privilégio.
  o_que_isto_fecha_do_R5: >-
    PARCIALMENTE. Prod tem 18 etapas, não as 17 da medição da story: duas foram criadas HOJE
    ("Follow-up" às 10:23 e "Joabe" às 11:00 BRT, esta última 25s depois do commit). Ou seja, o
    caminho BEFORE INSERT do trigger já rodou em produção por via real, sem 500 e sem quebrar a
    invariante. **Mas as duas nasceram com `is_default = false`** — então o ramo que interessa ao
    R5 (`IF NEW.is_default THEN UPDATE` nos irmãos) ainda NUNCA rodou em produção fora do service
    role. O R5 continua aberto, agora com o alvo afiado: o smoke test tem de MARCAR o checkbox.

armadilhas_do_meu_proprio_instrumento:
  - >-
    A B5 morreu e eu quase contei como vitória do teste. Morreu por um parêntese — a asserção de
    FORMATO — e não pela asserção anti-nome-de-perfil que existia para isso. Só descobri porque
    fui ver QUAL teste acendeu. Daí saiu a B6, que sobrevive. Mutação que morre pelo motivo
    errado é falso verde disfarçado de vermelho.
  - >-
    Na rodada 1 registrei os dois achados de banco como analíticos por não ter psql/docker.
    Estava certo em não afirmar medição — mas o @dev os mediu e um deles (QA-2) veio exatamente
    como eu descrevi, com `count = 0`. A conclusão que levo: analítico bem fundamentado vale como
    achado, não como prova, e quem tem o instrumento tem a obrigação de fechar a conta.
  - >-
    Quase entreguei este re-gate sem olhar `git status`. O que denunciou o deploy foi um arquivo
    de auditoria modificado que eu não tinha tocado — não a instrução que recebi, que afirmava
    "nada commitado". Estado do repositório é evidência; a descrição do estado, não.
  - >-
    Não reexecutei os scripts de PROVA (que escrevem em transação) em produção, de propósito.
    Auditei o método em vez do resultado — é onde um falso verde se esconde, e o script tem justamente a asserção que
    impede o caso mais perigoso (medir a migration intacta achando que removeu a guarda).
