story_title: "Pipeline: quem vê o botão é quem pode criar, e etapa padrão volta a ser única"
gate: CONCERNS
status_reason: >-
  O conserto que o Joabe precisava está CERTO e é o mais forte possível: a tela agora chama
  literalmente a MESMA função com a MESMA chave que a API — `can(user.id, user.orgId,
  "configuracoes.pipeline_editar")` no `page.tsx:15` contra
  `requireCapability(appUser, "configuracoes.pipeline_editar")` que é `can()` por dentro
  (`api-auth.ts:76`). Divergência tela↔API deixou de ser possível por construção, não por
  convenção. Varri a regressão de permissão nas duas direções e ela NÃO existe: quem perdeu o
  botão é exatamente quem a API já recusava com 403 (seed `configuracoes.pipeline_editar` =
  só admin, migs 225/226/227/241/243 idênticas; RLS mig 229 lê a mesma chave). Suíte, tipos e
  lint verdes, rodados por mim.
  O que segura o PASS são QUATRO achados, dois deles no banco:
  (1) revertendo o conserto PRINCIPAL — a tela de volta ao gate antigo — a suíte inteira fica
  **299 arquivos / 3.930 verdes**: a AC1 não tem UMA linha de teste, e a AC7 pede "gate da tela
  pela capability" explicitamente;
  (2) `provision_org()` é declaradamente idempotente e, re-executado sobre uma org existente,
  o trigger novo ZERA o padrão da org e o `ON CONFLICT DO NOTHING` descarta a linha que ia
  substituí-lo — a org fica SEM padrão nenhum, que é textualmente o estado que o comentário da
  migration 250 diz impedir;
  (3) o datafix da 250 ordena por `position` sem olhar `is_active`, então pode eleger uma etapa
  INATIVA como a padrão sobrevivente — a exata patologia que a story existe para matar;
  (4) a AC4 entrega o 409 na API mas NUNCA na tela: `stages-table.tsx:77` faz `if (res.ok)` e
  engole a recusa; clicar "Excluir" na etapa padrão não mostra nada. O ramo de 409 da função
  pura é, hoje, código morto — provei que removê-lo mantém o teste verde.
  Nada aqui quebra a produção de hoje (1 org, 1 padrão, ativa: a 250 é no-op e as mudanças de
  app estão corretas). Mas a story não pode ir a Done assim.

