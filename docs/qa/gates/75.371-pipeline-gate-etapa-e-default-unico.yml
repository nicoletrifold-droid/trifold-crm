auditoria_da_prova_em_banco:
  veredito: "Método válido. É mutação de banco de verdade, não teatro."
  o_que_conferi:
    - >-
      `prova-sem-guarda.ts` remove APENAS o bloco da guarda (do `IF TG_OP` até o `END IF;`) e
      **asserta que removeu** (`if (migration.includes("TG_OP")) throw`) antes de aplicar. Sem
      essa asserção a prova poderia estar medindo a migration intacta — é o cuidado que
      distingue mutação de banco de um `console.log` otimista.
    - >-
      O cenário replicado é fiel ao `provision_org`:
      `INSERT ... ('Novo','novo', is_default=true) ON CONFLICT (org_id, slug) DO NOTHING`, na org
      que tem o padrão. Em prod o padrão É slug=`novo`, então o conflito realmente dispara.
    - >-
      `runSqlBruto` (`scripts/lib/management-api.ts:60`) manda o texto INTEIRO num único `query`
      para `POST /v1/projects/{ref}/database/query` — o `BEGIN … ROLLBACK` é honrado como uma
      transação só. O controle que fecha a conta é a leitura INDEPENDENTE depois do ROLLBACK
      (17 etapas, 1 padrão, "Aguardando atendimento"), e ela foi feita.
    - >-
      `prova-migration-250-v2.ts` cobre A (ON CONFLICT descarta), B (clique do Joabe) e C
      (idempotência do datafix), tudo dentro de `BEGIN … ROLLBACK`, com os vereditos numa TEMP
      TABLE lida no fim.
  ressalva_registrada: >-
    Esses scripts vivem no scratchpad, fora do repositório: **não são rede de regressão** e nada
    os reexecuta. A invariante do banco fica protegida pela própria migration (índice + trigger)
    mais uma medição pontual. É aceitável — o trigger É a guarda —, mas fique dito que não há
    carrasco automatizado para o lado SQL, e que reverter a guarda do `TG_OP` ou o
    `ORDER BY is_active DESC` não acende nenhum vermelho em `npx vitese run`.

