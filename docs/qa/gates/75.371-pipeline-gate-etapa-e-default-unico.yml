status_reason: >-
  Segunda rodada, sobre a mesma árvore não commitada. **Os 4 bloqueios e os 2 `low` estão
  fechados, e fechados com o vermelho reproduzido — parte por mim, parte por medição em banco
  que eu não conseguia fazer na rodada 1.**
  QA-1: o `pipeline-gate.contract.test.ts` não afirma "a tela usa uma chave", ele EXTRAI a
  capability da fonte da tela e a das fontes das duas rotas e COMPARA as listas. Testei quatro
  formas de burlar: revert puro morre com **3 failed**, OR com outra capability morre com
  **2 failed**, abandonar `can()` e ler a matriz na mão morre com **2 failed**. É um carrasco
  de verdade, na direção certa (divergência tela↔API), não uma régua de existência de import.
  QA-2: a guarda `TG_OP = 'INSERT' AND EXISTS(org_id, slug)` é legítima e eu conferi a premissa
  na fonte, não no comentário — `UNIQUE(org_id, slug)` é **incondicional**
  (`001_base_schema.sql:104`), então "linha já existe" só pode terminar em descarte ou 23505, e
  não há terceiro caso onde a guarda deixaria de ceder o posto indevidamente. Auditei os DOIS
  caminhos vivos de `ON CONFLICT DO UPDATE` da tabela e os dois estão certos, por motivos
  diferentes — a afirmação do comentário não é hand-waving.
  QA-3/4/5/6: mutei cada um e cada um acende vermelho.
  **O que o @dev mediu vale mais que o meu raciocínio da rodada 1**: sem a guarda,
  `count(is_default) = 0`; com ela, `1`. Auditei o método dos scripts (é mutação de banco de
  verdade — o script ASSERTA que a guarda foi removida antes de aplicar) e ele se sustenta.
  Passa com **quatro resíduos `low` medidos** e nenhum bloqueio. O que mais me incomoda não
  estava na minha lista anterior: com o trigger transferindo o posto de verdade, a TABELA passa
  a mostrar **duas linhas com "Padrão: Sim"** até um reload, porque `handleStageUpdate` só
  remenda a linha editada. Não corrompe nada e não trava ninguém, mas é a tela desta story
  exibindo dois padrões — e vai voltar como reporte de bug parecidíssimo com o que acabamos de
  matar. Uma linha resolve. Recomendo antes do deploy; não seguro o gate por isso.

