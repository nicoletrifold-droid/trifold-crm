# ─────────────────────────────────────────────────────────────────────────────
# (b) A guarda do TG_OP tem outro caminho de escape?
# ─────────────────────────────────────────────────────────────────────────────
escapes_da_guarda_do_trigger:
  veredito: "Não encontrei escape vivo. Varri os cinco caminhos e a premissa da guarda."
  premissa_conferida_na_fonte: >-
    `UNIQUE(org_id, slug)` em `001_base_schema.sql:104` é **incondicional** (não é parcial em
    `is_active`). Isso é o que torna a guarda correta em vez de perigosa: com a linha já
    existente, o INSERT só pode ser descartado (`DO NOTHING`) ou estourar 23505 — não existe
    caso em que ele vira inserção e o posto precisaria ter sido cedido. E é por isso que o
    `EXISTS` **não filtrar `is_active` está certo**: a constraint também não filtra, então
    etapa padrão soft-deletada com slug 'novo' continua bloqueando o INSERT, e a guarda
    acompanha. Se a UNIQUE fosse parcial, a guarda seria um furo — não é.
  caminhos:
  - caminho: "`ON CONFLICT (org_id, slug) DO NOTHING` — `provision_org` (240/246)"
    veredito: "FECHADO. É o cenário do QA-2, medido em prod: com guarda 1, sem guarda 0."
  - caminho: "`ON CONFLICT (org_id, slug) DO UPDATE` — `supabase/seed.sql:37`"
    veredito: >-
      SEGURO, e por um motivo que vale registrar: o `DO UPDATE SET` lista name/type/position/color
      e **não** `is_default`. Então BEFORE INSERT dispara, a guarda retorna cedo, e
      `BEFORE UPDATE OF is_default` **não** dispara (a cláusula `OF` só acende se a coluna estiver
      no SET). Nada a transferir, nada perdido. Sem a guarda, este mesmo caminho zerava o padrão
      e não devolvia — o conserto do QA-2 protege o seed também, não só o `provision_org`.
  - caminho: "upsert do supabase-js — `scripts/run-seed.ts:64` (`onConflict: \"org_id,slug\"`)"
    veredito: >-
      SEGURO por caminho DIFERENTE do anterior: o PostgREST monta o `DO UPDATE SET` com TODAS as
      colunas enviadas, e `is_default` está entre elas. Logo `BEFORE UPDATE OF is_default`
      dispara, `NEW.is_default` é true para 'novo', os irmãos são zerados e a linha assume.
      É exatamente o que o comentário da migration afirma ("entra pelo ramo de UPDATE deste
      mesmo trigger") — conferido nas duas variantes, não presumido.
  - caminho: "`MERGE`"
    veredito: >-
      Sem uso no repositório (grep em `supabase/` e `scripts/`). Analiticamente entra pelos ramos
      normais: `WHEN NOT MATCHED THEN INSERT` → TG_OP 'INSERT' com slug ausente → guarda não
      acende → transfere; `WHEN MATCHED THEN UPDATE SET is_default` → ramo de UPDATE. Sem furo.
  - caminho: "service role / RLS"
    veredito: >-
      Sem furo nas duas pontas. Service role ignora RLS e o `EXISTS` vê tudo. Como
      `authenticated`, o `EXISTS` é filtrado por `stages_select_own_org` (mig 004,
      `FOR SELECT USING (org_id = user_org_id())`, permissiva e OR'd com a de capability) — e o
      `WITH CHECK` implícito da `stages_manage_admin` obriga `org_id = user_org_id()` no INSERT.
      Ou seja: o irmão da mesma org é SEMPRE visível para quem consegue inserir. Não há estado em
      que o `EXISTS` volte vazio e a constraint enxergue a linha.
  - caminho: "INSERT com slug NOVO mas org já provisionada"
    veredito: >-
      Guarda não acende (correto — é inserção de verdade) e o trigger transfere o posto.
      Resíduo teórico R5: se alguém tivesse RENOMEADO o slug da etapa padrão, reexecutar
      `provision_org` injetaria uma 'Novo' fantasma que rouba o posto. O slug NÃO é editável pela
      UI (o modal manda só name/type/color/is_default) e em prod o padrão é slug=`novo`, que
      casa. Além disso é comportamento pré-existente do `provision_org` (qualquer slug renomeado
      recria a etapa) e a 250 estritamente MELHORA o caso — antes gerava DOIS padrões.

# ─────────────────────────────────────────────────────────────────────────────
# (c) As guardas novas criaram beco novo?
# ─────────────────────────────────────────────────────────────────────────────
becos_novos:
  veredito: "Nenhum beco sem saída. Achei um sintoma de UI, que virou o resíduo R3."
  cenarios:
  - cenario: "trocar legitimamente qual etapa é a padrão"
    resultado: >-
      OK. Marcar OUTRA etapa como padrão manda `is_default: true` — a guarda do PATCH só acende
      em `=== false` — e o trigger transfere. É o caminho que a própria mensagem do 409 indica.
  - cenario: "renomear / recolorir a etapa que É a padrão"
    resultado: >-
      OK, e este era o beco mais provável. O modal manda `is_default: true` (espelha
      `stage.is_default`), então `fields.is_default === false` é falso e a guarda nem consulta o
      banco. Renomear o padrão continua funcionando.
  - cenario: "desativar (excluir) a etapa padrão de propósito"
    resultado: >-
      OK. Caminho: eleger outra como padrão (trigger transfere) → excluir a antiga (agora não é
      padrão, passa). Mensagem do 409 diz exatamente isso.
  - cenario: "org com UMA única etapa, que é a padrão"
    resultado: >-
      OK, não trava: criar etapa nova marcando padrão (trigger transfere) e depois excluir a
      antiga. Não existe estado sem saída.
  - cenario: "org com ZERO padrões (legado)"
    resultado: "OK — a guarda do PATCH só acende no `false`; marcar qualquer etapa como padrão passa."
  - cenario: "duas abas / UI velha"
    resultado: >-
      OK. Se a etapa já não é mais a padrão no banco, a guarda lê `is_default = false` e libera —
      a tela se autocorrige em vez de travar num 409 mentiroso.
  - cenario: "id inexistente ou de outra org, ou etapa já inativa"
    resultado: >-
      404 preservado nos dois handlers: a leitura da guarda volta `null` (sem erro), a guarda não
      opina, e o `.eq('is_active', true)` do UPDATE / do `softDelete` produz o 404 de sempre.
      Coberto por teste.

