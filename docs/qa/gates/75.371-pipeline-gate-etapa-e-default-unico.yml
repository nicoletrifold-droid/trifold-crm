  - id: R3
    severidade: low
    origem: "achado NOVO desta rodada"
    titulo: "Depois de transferir o padrão, a tabela mostra DUAS linhas com \"Padrão: Sim\""
    arquivo: "packages/web/src/app/dashboard/configuracoes/pipeline/_components/stages-table.tsx:246"
    cenario: >-
      `handleStageUpdate` faz `prev.map(s => s.id === updated.id ? {...s, ...updated} : s)` — só
      remenda a linha editada. Admin abre "Editar" na etapa B, marca "Etapa padrão", salva: o
      banco transfere o posto (trigger da 250) e B passa a mostrar "Sim", **mas a linha A continua
      mostrando "Sim"**, porque nada avisou o estado client. Não há `useEffect` sincronizando
      `initialStages` nem `key` forçando remount (`page.tsx:43`), então nem um
      `router.refresh()` corrigiria — é o gotcha já registrado do projeto
      (`feedback-router-refresh-nao-mexe-em-state-client`).
      **É sintoma NOVO desta story**: antes da 250, marcar B realmente deixava A padrão também,
      então as duas "Sim" eram verdade (era o bug). Agora o banco tem um padrão e a tela mostra
      dois — na tela cuja story é "etapa padrão volta a ser única".
      Não corrompe dado, não trava fluxo, e se corrige no reload. O risco real é de PROCESSO:
      vai voltar como reporte "o CRM tem duas etapas padrão", indistinguível do bug que acabamos
      de matar.
    correcao_sugerida: >-
      Em `handleStageUpdate`, quando `updated.is_default` for true, zerar `is_default` nas outras
      linhas do estado — espelhar no client o que o trigger fez no banco. Uma linha.
    recomendacao: "fazer antes do deploy; não bloqueia o gate"
