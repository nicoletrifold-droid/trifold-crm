    limitação inerente a teste de texto-fonte, compartilhada com o
    `configuracoes-gate.contract.test.ts` que serviu de precedente. Nenhum caminho de REVERT
    sobrevive.
  tentativas:
    - id: B1
      o_que: "revert puro: `canAccess(user.id, user.orgId, \"configuracoes.pipeline\")`"
      medido: "**3 failed** | 3 passed — MORRE"
    - id: B3
      o_que: >-
        mantém `can()` e alarga com OR para outra capability permissiva
        (`configuracoes.pipeline_followup`), sem usar `canAccess`
      medido: >-
        **2 failed** | 4 passed — MORRE. A comparação de LISTAS é o que pega: a tela passa a
        declarar 2 capabilities e a rota exige 1.
    - id: B4
      o_que: "abandona `can()` e lê a matriz na mão via `getUserPermissions(...)[\"configuracoes\"]`"
      medido: "**2 failed** | 4 passed — MORRE"
    - id: B5
      o_que: "`(await can(...)) || PODE.includes(user.role)` com `PODE` = lista de perfis"
      medido: >-
        **1 failed** | 5 passed — morre, MAS pelo motivo errado: quem pegou foi a asserção de
        FORMATO `/const canEdit = await can\(/` (eu escrevi parênteses em volta do await), não a
        asserção anti-nome-de-perfil. Diagnostiquei o teste que acendeu: "o botão de criar e a
        tabela saem do MESMO booleano do gate".
    - id: B6
      o_que: >-
        o mesmo alargamento de B5 SEM mexer no formato:
        `const canEdit = await can(user.id, user.orgId, "configuracoes.pipeline_editar") || PODE.includes(user.role)`
      medido: >-
        **6 passed — SOBREVIVE.** A tela volta a oferecer o botão para `gerente-comercial` e a
        API continua devolvendo 403: o beco sem saída do Joabe, de volta, com a suíte verde.
      severidade: low
      por_que_low: >-
        Não é caminho de revert — é código novo que alguém precisa escrever. E o teste 5 JÁ
