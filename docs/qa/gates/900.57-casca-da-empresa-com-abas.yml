# 1. AS DUAS RÉGUAS QUE NASCERAM CEGAS — confirmadas mortas
# ═══════════════════════════════════════════════════════════════════════════
as_duas_que_ele_pegou:
  - id: M2
    fuga_original: '`toContain("classes={classes}")` no arquivo inteiro, satisfeito pelo `<Badge>` com o `<Tile>` apagado'
    mutacao_que_apliquei: '`<Tile … classes={classes}>` vira `classes={PALETAS.stone}` (compila: importa `PALETAS`)'
    tsc: "rc=0"
    resultado: "1 VERMELHO — `o componente consome a tabela — a prop não é decorativa`"
    veredito: "MATA. O estreitamento para o call site do `<Tile>` funciona."
  - id: M4
    fuga_original: '`toContain(''palette="slate"'')` no arquivo inteiro, satisfeito por um comentário de topo'
    mutacao_que_apliquei: 'remove a linha `palette="slate"` do JSX'
    tsc: "rc=0"
    resultado: "1 VERMELHO — `a tela de integrações do console pede a paleta do console`"
    veredito: "MATA."
  - id: q4d
    proposito: "reproduzir a fuga ORIGINAL, para saber se o conserto cobre a forma que a causou"
    mutacao_que_apliquei: 'remove a prop E ressuscita a citação em comentário de BLOCO (` * … palette="slate" …`)'
    tsc: "rc=0"
    resultado: "1 VERMELHO"
    veredito: "MATA — o filtro de linhas iniciadas por `*` e `//` cobre a forma exata que apodreceu."

# ═══════════════════════════════════════════════════════════════════════════
# 2. A TERCEIRA DA FAMÍLIA — e ela veio em três
# ═══════════════════════════════════════════════════════════════════════════
a_terceira_da_familia:
  como_procurei: >-
    Enumerei toda asserção da régua que roda sobre TEXTO-FONTE e perguntei, para cada uma: que
    outra coisa no arquivo pode satisfazê-la? Comentário, string, call site vizinho. Três das
    quatro tinham resposta.
  furos:
    - id: q8
      severidade: ALTA
      asercao: 'expect(fonte).toContain("classesDaPaleta(palette)")'
      forma_do_furo: COMENTÁRIO
      mutacao: >-
        `const classes = classesDaPaleta(palette)` vira `const classes = PALETAS.stone`, com um
        comentário logo acima citando `classesDaPaleta(palette)` em prosa.
      tsc: "rc=0"
      resultado_da_regua: "**10/10 VERDE**"
      raio_de_explosao: >-
        A prop `palette` passa a ser **inteiramente decorativa**. A tela de integrações do console
        volta INTEIRA à escala do CRM — os 5 tiles, os 3 badges, os campos, a caixa de trilha. É o
        defeito que a story existe para corrigir, em tamanho natural. E a varredura de `stone-`
        não vê nada, porque `PALETAS.stone` é um identificador: não contém o literal `stone-`.
      por_que_escapa: >-
        É a MESMA fuga que ele consertou em `palette="slate"` — `toContain` sobre o arquivo
        inteiro — mas na outra asserção, que ficou como estava.
    - id: M3
      severidade: MEDIA
      asercao: 'const chamadaDoBadge = fonte.slice(fonte.indexOf("<Badge")); expect(chamadaDoBadge).toContain("classes={classes}")'
      forma_do_furo: CALL SITE VIZINHO
      mutacao: '`<Badge status={estado.status} classes={classes} />` vira `classes={PALETAS.stone}`'
      tsc: "rc=0"
      resultado_da_regua: "**10/10 VERDE**"
      medicao_da_causa: >-
        `indexOf("<Badge")` = offset **6285**; `indexOf("<Tile")` = offset **11984**. O `.slice()`
        vai do `<Badge>` até o **fim do arquivo** e portanto engole o call site do `<Tile>`.
        Contei: o pedaço a partir de `<Badge` contém **2** ocorrências de `classes={classes}`; o
        pedaço a partir de `<Tile`, **1**. Quando o `<Badge>` perde a prop, quem satisfaz a
        asserção do Badge é a linha do `<Tile>`.
      consequencia_formal: >-
        O conjunto de morte da asserção do Badge é **SUPERSET** do da asserção do Tile — ela só
        acende quando os DOIS perdem a prop. O comentário do teste afirma *"Medir os DOIS call
        sites separadamente é o que mata essa mutação"*: um está medido, o outro é colinear.
        Ele fechou a direção Tile→Badge e abriu a imagem espelhada Badge→Tile.
      raio_de_explosao: >-
        Menor: só o badge NEUTRO (verde e vermelho não dependem da paleta). O console voltaria a
        pintar "Não conectado" com `bg-stone-500/15 text-stone-300`, a cor exata do CRM.
    - id: q4c
      severidade: MEDIA
      asercao: 'linhas que não começam com `*` nem `//`, filtradas por `palette="slate"`, toHaveLength(1)'
      forma_do_furo: "COMENTÁRIO — de outra forma sintática"
      mutacao: 'remove a prop e deixa `{/* palette="slate" */}` no JSX'
      tsc: "rc=0"
      resultado_da_regua: "**10/10 VERDE**"
      isolamento: >-
        Medi as duas formas separadas. Comentário de BLOCO (`* …`) → **VERMELHO** (q4d).
        Comentário JSX (`{/* … */}`) → **VERDE** (q4c). O filtro cobre `*` e `//` e não cobre
        `{`, que é a forma idiomática de comentário dentro de JSX num `.tsx`.
      raio_de_explosao: "Igual ao q8 — a página cai no default `stone` e o console inteiro fica com a cara do CRM."
  o_padrao: >-
    Três furos, uma causa: o conserto mirou a **forma** que tinha mordido (o comentário de bloco;
    o `toContain` daquela asserção) e não a **classe** ("asserção sobre texto-fonte que qualquer
    vizinho pode satisfazer"). É a mesma lição de `feedback_varredura_herda_o_predicado_nao_a_classe`.

# ═══════════════════════════════════════════════════════════════════════════
# 3. A PROVA DE NÃO-REGRESSÃO DO CRM — reproduzida, e o que ela realmente diz
# ═══════════════════════════════════════════════════════════════════════════
nao_regressao_do_dashboard:
  como_reproduzi: >-
    `git show 1393fa68:…/integrations-panel.tsx` para fora da árvore, e um harness de vitest com
    config própria (também fora da árvore) aliasando `@web`, `react`, `react-dom/server` e um
    stub de `next/navigation`. Renderizei `renderToStaticMarkup` do componente de `main` e do
    componente da branch com **a MESMA entrada** — 5 tiles cobrindo os 3 tons de badge (ok /
    erro / neutro), com e sem `whatsapp_config` ativo — e comparei os atributos `class` posição
    a posição. Nada disso encostou na árvore do repositório.
  resultado: "77 atributos `class`; **73 idênticos**, **4 diferentes**."
  as_4_diferencas: >-
    São os 4 `<input type="password">` dos tiles graváveis (`meta_ads`, `meta_capi`, `sienge`,
    `telegram`):
      main   → `mt-1 w-full rounded border border-stone-700 bg-stone-950 px-2 py-1 font-mono text-sm text-stone-100`
      branch → `mt-1 w-full rounded border border-stone-700 bg-stone-950 px-2 py-1 text-sm text-stone-100 font-mono`
    **Mesmo multiconjunto de tokens**, só a posição de `font-mono` mudou — consequência direta de
    `` className={`${classes.campo} font-mono`} ``, que concatena em vez de intercalar.
  impacto_visual: >-
    **Zero.** `font-mono` (font-family) e `text-sm` (font-size/line-height) não conflitam, e a
    ordem da cascata vem da folha de estilo, não da ordem no atributo `class`. Confirmei que
    `font-mono` existe no CSS gerado pelo build.
  veredito: >-
    A afirmação **medida** do @dev ("os 5 tiles e os 3 badges têm exatamente as mesmas strings")
    é **VERDADEIRA** — verifiquei que os 8 estão entre os 73 idênticos. A afirmação do **Change
    Log** ("a paleta do `/dashboard` foi provada inalterada por comparação de markup renderizado")
    é mais larga do que a medição sustenta: o markup **não** é byte a byte igual; é
    **visualmente equivalente com 4 atributos de ordem trocada**. A diferença entre "sem
    diferença" e "diferença sem efeito" é a diferença entre ter medido tudo e ter medido a
    amostra certa. Ele mediu a amostra certa; escreveu a frase larga.
  controle_positivo: >-
    Com `palette="slate"` o markup MUDA (o comparador não é cego), e
    `markupSlate.replaceAll("slate-","stone-")` reproduz o markup de `main` **exceto** pelas
    mesmas 4 posições — isto é, a troca de paleta é exatamente uma substituição de escala e mais
    nada.
  o_que_a_prova_do_dev_nao_alcancava: >-
    Ele comparou "as classes de fato renderizadas nos 5 tiles e nos badges" numa tela buscada com
    sessão real. Isso é 8 dos 77 atributos. Os 4 que diferem estão nos campos de senha, fora da
    amostra. O harness de render que montei cobre os 77 em 200ms e **não precisa de sessão nem de
    banco** — o que também derruba a premissa "não há infra de teste de render neste projeto"
    para componentes de cliente puros.

