# 5. CONCERNS
# ═══════════════════════════════════════════════════════════════════════════
concerns:
  - id: QA-900-57-1
    severidade: alta
    bloqueante: "recomendado consertar ANTES do merge — custo ~8 linhas, zero código de produção"
    titulo: "Três furos da mesma família na régua central da AC4 (q8, M3, q4c)"
    achado: "ver a seção `a_terceira_da_familia` — os três medidos, `tsc` rc=0, régua 10/10 verde nos três"
    por_que_recomendo_antes_do_merge: >-
      A régua É a entrega da AC4 tanto quanto a prop. A própria story afirma que *"um teste que
      só chamasse a função de paleta ficaria verde com metade dos 18 lugares ainda remendados —
      que é o defeito da story, só que menor"*. Com o q8 aberto, o defeito volta **inteiro**, e
      volta verde. Mergear assim é entregar a proteção quebrada no dia 1 — e a proteção é a única
      coisa que impede o próximo PR de desfazer isso em silêncio.
    o_que_mudar:
      - >-
        **Uma função só, e usá-la nas quatro asserções de texto-fonte.** Ex.:
        `linhasDeCodigo(fonte)` = `fonte.split("\n").map(l => l.trim()).filter(l =>
        !l.startsWith("*") && !l.startsWith("//") && !l.startsWith("/*") && !l.startsWith("{/*"))`.
        Aplicar em `classesDaPaleta(palette)`, nos dois call sites e em `palette="slate"`. Isso
        fecha q8 e q4c.
      - >-
        **Delimitar o call site de verdade, em vez de `slice` até o fim do arquivo.** Ex.:
        recortar do `<Badge` até o primeiro `/>` (`fonte.slice(i, fonte.indexOf("/>", i))`), e o
        mesmo para `<Tile`. Isso fecha o M3 e torna os dois conjuntos de morte **disjuntos**.
      - >-
        **E, para não repetir o padrão:** os três consertos precisam de um `it` que os exerça —
        um controle positivo por furo, envenenando a fonte real (a régua já tem esse idioma, no
        `it` "o detector está VIVO contra o arquivo real"). Sem isso o conserto vira prosa, e
        prosa não é herdada pelo próximo PR.
  - id: QA-900-57-2
    severidade: baixa
    bloqueante: false
    titulo: "A frase do Change Log é mais larga que a medição — o markup do `/dashboard` não é byte a byte igual"
    achado: "4 dos 77 atributos `class` diferem por ordem de token (ver `nao_regressao_do_dashboard`). Sem efeito visual."
    o_que_mudar: >-
      Corrigir a frase do Change Log para o que foi medido ("os 5 tiles e os 3 badges têm classes
      idênticas; os campos de senha diferem só na ordem de `font-mono`, sem efeito visual"), ou —
      melhor — trocar `` `${classes.campo} font-mono` `` por um papel próprio na tabela
      (`campoMono`), o que restaura a igualdade byte a byte e mantém a tabela como única dona das
      classes do campo. Custo: 2 chaves na interface, 2 valores.
  - id: QA-900-57-3
    severidade: baixa
    bloqueante: false
    titulo: "`LinhaDaTrilhaDaPlataforma` e `rotuloDoAtor` não têm carrasco nenhum"
    achado: >-
      O componente extraído pela AC5 — o que a `900-59` vai reaproveitar — é exercitado **só por
      `type-check`**. Dentro dele, `rotuloDoAtor` tem lógica de verdade: lê
      `metadata.actor_label`, checa o tipo, checa string vazia e cai em `"sem rótulo"`. Nenhum
      desses quatro caminhos é tocado. Confirmei que a justificativa do @dev está CORRETA —
      `platform_audit_log` tem **0 linhas em produção E no ambiente de teste** (medido por
      agregado), e a tabela é append-only por trigger + `REVOKE`, então inserir para tirar um
      print seria sujeira permanente.
    o_que_mudar: >-
      A justificativa "não há infra de render para RSC" **não se aplica**: `linha-da-trilha.tsx`
      é render puro de um objeto simples, sem `async`, sem hook, sem acesso a banco. Um harness
      como o que usei para o A/B da paleta cobre os 4 caminhos de `rotuloDoAtor` em ~10 linhas,
      sem sessão e sem banco. Alternativa ainda mais barata e suficiente: extrair `rotuloDoAtor`
      como função pura exportada e testá-la em vitest — `actor_label` string, ausente, vazia, e
      de tipo errado (número/objeto).

# ═══════════════════════════════════════════════════════════════════════════
# 6. OBSERVAÇÕES
# ═══════════════════════════════════════════════════════════════════════════
observacoes:
  - id: OBS-1
    titulo: "A recusa da interpolação está PROVADA, não só argumentada"
    detalhe: >-
      O docblock de `paleta.ts` afirma que uma classe montada em runtime não existiria no CSS
      gerado. Verifiquei o outro lado, que era o risco real: com a tabela num `.ts` fora do
      componente, o Tailwind v4 (detecção automática de fonte, sem `tailwind.config`, só
      `@import "tailwindcss"`) **encontra as classes** — os **22 tokens de cor** da tabela
      (`stone` e `slate`) estão todos no CSS emitido pelo `build`, mais `font-mono`, `text-sm`,
      `bg-slate-950` e `bg-stone-950`. Se essa varredura ignorasse `.ts`, as duas telas sairiam
      sem fundo e nenhum teste desta base reprovaria. Não ignora.
  - id: OBS-2
    titulo: "A população da régua 'as DUAS telas montam os tiles pela MESMA função' cresceu de 2 para 4"
    detalhe: >-
      `nao-consumo.test.ts` vigia `montarTilesDoPainel(` em duas páginas. Depois desta leva há
      **quatro** superfícies montando tiles: as duas de integrações, o Resumo da empresa (`900-57`)
      e a Visão geral (`900-56`). As duas novas usam a função compartilhada — conferi — mas não
      estão na lista, então nada impede a próxima de fazer montagem própria. Não é regressão;
      é uma lista que ficou menor que a população que ela existe para cobrir.
  - id: OBS-3
    titulo: "As consequências não previstas da AC1 sobre a AC3 estão certas"
    detalhe: >-
      Remover o `← Empresas` e o `<h1>` com o nome da empresa de `integracoes/page.tsx` é
      obrigatório depois da casca — os dois passariam a aparecer duas vezes. O import de `Link`
      ficou órfão e foi removido junto (`lint --force` rc=0 confirma). E o guarda
      `if (!org) return …` continua na página com o motivo certo escrito: o TypeScript não sabe
      do `notFound()` do layout, e a consulta daqui pede uma coluna a mais.

