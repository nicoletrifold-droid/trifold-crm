# 4. A RÉGUA DE SEGURANÇA QUE ELE NÃO CONTORNOU
# ═══════════════════════════════════════════════════════════════════════════
nao_consumo:
  as_paginas_entraram_na_lista: "NÃO"
  como_confirmei:
    - "`nao-consumo.test.ts` **intocado** na branch (`git diff 1393fa68..HEAD` vazio para o arquivo)."
    - >-
      `AUTORIZADOS` tem as mesmas 8 chaves de antes. **Nenhuma** delas é `app/platform/page.tsx`
      nem `app/platform/orgs/[id]/page.tsx`.
    - >-
      As 10 fontes novas/alteradas do console têm **0** ocorrências de `secret_ref`,
      `decrypted_secrets` e `reveal_last4`.
    - >-
      **Controle positivo (q11):** acrescentei uma menção a `secret_ref` num comentário de
      `app/platform/page.tsx`. `tsc` rc=0 e a régua ficou **VERMELHA** —
      *"o conjunto de arquivos que tocam a credencial é exatamente o autorizado"*. Ou seja: a
      régua **continua mordendo** as páginas novas, que é precisamente o que se perde ao entrar
      na lista.
    - "Zero `access_token` em `app/platform/**` — a segunda régua da QA-900-51-2 também passa."
  veredito: >-
    O argumento dele está certo e o preço foi pago no lugar certo: reescrever comentário custa um
    parágrafo; entrar na lista custa a régua no dia em que a página realmente ler o cofre.

