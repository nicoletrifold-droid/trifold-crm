verdict: FAIL
verdict_rationale: >
  Implementação sólida e bem coberta, mas há uma corrida de carregamento que
  descarta o disparo do `ViewContent` no browser e faz o par server-side sair sem
  `fbp` — exatamente a chave de correspondência que esta story existe para
  consertar (9,2% de cobertura no baseline). Sem correção, a story entrega os
  eventos e não entrega a nota.

