verificacoes:
  - id: V1
    check: "1. O fix resolve a causa-raiz — nenhum import de packages/web/src saindo para docs/"
    resultado: >
      PASS. `org-scoped-admin.ts` tem exatamente 2 imports, ambos irmãos: `./admin` e
      `./org-scoped-tables.generated`. Varredura de `packages/` por import relativo aterrissando em
      `docs/`: zero. Varredura por qualquer import subindo 4+ níveis em `packages/web/src`: uma única
      ocorrência, `app/api/cron/followup/notify-alert.test.ts:25 → "../../../../lib/broker/
      notify-stalled-lead"`, que é legítima (aterrissa dentro de `src/lib`, não fora da árvore) — o
      mesmo falso positivo que o @po tinha antecipado. `schema-snapshot` só aparece em `packages/`
      dentro de dois comentários do próprio arquivo gerado (procedência), nunca num caminho de módulo.
      **Reprodução da condição da Vercel, executada por mim:** `docs/` movido para fora da árvore,
      `tsc --noEmit` em `packages/web` → **exit 0**; mesmo cenário + sonda com o import antigo →
      **exit 2 / `TS2307 Cannot find module '../../../../../docs/audits/schema-snapshot.json'`**.
      `docs/` restaurado ao fim, `git status` idêntico ao inicial e
      `git diff docs/audits/schema-snapshot.json` = 0 linhas (sha256 conferido).
  - id: V2
    check: "2. Paridade da lista — 92 de 120, diff vazio nos dois sentidos, 17 testes sem alteração"
    resultado: >
      PASS. Diff refeito de forma independente, comparando o conjunto do módulo contra a expressão
      antiga aplicada ao JSON commitado: total 120 · via JSON 92 (92 distintos) · via módulo 92
      (92 distintos) · `JSON \ módulo = []` · `módulo \ JSON = []` · lista ordenada = true ·
      `Set(JSON) ≡ Set(módulo)` = true (a forma em que `org-scoped-admin.ts` realmente consome).
      `git diff` de `org-scoped-admin.test.ts` = **0 linhas** (numstat vazio) e
      `npx vitest run org-scoped-admin.test.ts` → **17 passed**, expectativas intocadas. Como o @po
      registrou, esses 17 casos não provam o conteúdo da lista (3 asserts cobrem `leads`,
      `organizations` e uma tabela inexistente — um array manual com dois nomes passaria igual); a
      prova é o diff acima, e é por isso que o AC3 exigia esse número.
  - id: V3
    check: "3. Template ↔ arquivo gerado byte-idênticos (prova independente)"
    resultado: >
      PASS. Refeito por mim, sem reaproveitar o script do @dev: `renderOrgScopedTablesModule()`
      importado direto do gerador (o guard de `argv` não dispara — meu script não se chama
      `generate-schema-snapshot`) e alimentado com `docs/audits/schema-snapshot.json` commitado.
      Renderizado 3321 bytes · commitado 3321 bytes ·
      **sha256 igual nos dois: b2a45532432e08bc5e20f716877f05843186fcbae42668d7d3268c44523f57f6** ·
      byte-idênticos SIM. Extras que sustentam a garantia adiante: determinismo (render 2x → mesmos
      bytes) SIM; estabilidade à reordenação da entrada (`schema.tables` invertido → mesmos bytes)
      SIM, porque `renderOrgScopedTablesModule()` faz `[...new Set(...)].sort()`. Consequência: a
      próxima regeneração legítima por `pnpm gate:tenancy:snapshot` não produz diff fantasma. Script
      da prova ficou **fora do repo** (scratchpad da sessão) — nenhum artefato novo adicionado.
  - id: V4
    check: "4. Nenhum comentário mente — nada promete check automático inexistente"
    resultado: >
      PASS. `grep` por `check-org-scoped-tables-sync` / `check:org-scoped-tables-sync` fora de `docs/`:
      **zero em código**. Existe 1 ocorrência textual fora de `docs/`, em
      `.claude/agent-memory/aios-dev/feedback_corte_de_escopo_comentarios.md:14` — é a memória do
      próprio @dev descrevendo o incidente no passado ("ficaram comentários citando… script que havia
      sido apagado"), como lição aprendida. Não é código, não é comentário de código e não promete
      garantia: é o registro de por que a limpeza foi feita. Informativo, não achado. E a limitação
      está declarada **como limitação** nos três lugares certos, não escondida: cabeçalho do
      `.generated.ts` ("LIMITAÇÃO CONHECIDA: não existe check automático…"), docblock de
      `org-scoped-admin.ts` ("**Limitação conhecida.** Não existe check automático…") e cabeçalho de
      `generate-schema-snapshot.ts` ("Não há check automático de sincronia… `main()` grava os dois a
      partir da MESMA captura, e é isso (e só isso) que os mantém alinhados"). Os três dizem a mesma
      coisa e nenhum inventa garantia substituta.
  - id: V5
    check: "5. Nada reintroduzido — AC5/AC6 realmente fora do working tree"
    resultado: >
      PASS. `git diff --numstat` **vazio** nos três: `.github/workflows/ci.yml`,
      `packages/web/eslint.config.mjs`, `package.json` (raiz). `scripts/check-org-scoped-tables-sync.ts`
      e `scripts/org-scoped-tables-emissao.test.ts` **não existem** (`No such file or directory` nos
      dois). Conferido por leitura, não só por diff: `eslint.config.mjs` não tem
      `no-restricted-imports` nem `DIRS_FORA_DO_BUILD_DA_VERCEL`, e `aios/no-unscoped-admin-client`
      segue em **`warn`** na linha 26 — a promoção dela continua sendo da 900-15, como o Scope manda.
      `package.json` não tem script `check:org-scoped-tables-sync`.
  - id: V6
    check: "6. Nada fora de escopo tocado"
    resultado: >
      PASS. `git diff --numstat` **vazio** em `scripts/gate-tenancy.ts` (AC4),
      `docs/audits/schema-snapshot.json` (Scope OUT) e
      `packages/web/src/lib/supabase/org-scoped-admin.test.ts` (AC3). Nenhum arquivo de
      `analytics-report` aparece no `git status` — o PR #492 não foi contaminado no que é código.
      O diff de código da entrega tem exatamente 3 arquivos: `org-scoped-admin.ts` (troca de import +
      docblock; o corpo da função e `select`/`insert`/`update`/`delete` intocados — o diff mostra
      apenas `new Set(TABELAS_GERADAS)` no lugar do `filter/map` sobre o JSON),
      `generate-schema-snapshot.ts` (+~90 linhas: `renderOrgScopedTablesModule()`,
      `writeOrgScopedTablesModule()`, `ORG_SCOPED_TABLES_MODULE`, `SchemaParaEmissao`, e a chamada em
      `main()`) e o `.generated.ts` novo.
  - id: V7
    check: "7. org-scoped-tables.generated.ts é commitável"
    resultado: >
      PASS. `git check-ignore -v` → sem saída, **exit 1** (não é ignorado); aparece como `??` no
      `git status`. Não há padrão `*.generated.ts` em `.gitignore`. Esta é a checagem que sustenta o
      modo de falha mais irônico da story — ver bloqueio_de_release B1: se o arquivo ficar fora do
      commit, a Vercel quebra exatamente igual, porque ela importa o módulo e **não** roda codegen.
  - id: V8
    check: "8. Suíte, lint, type-check e build — executados por mim"
    resultado: >
      PASS, e a contagem de testes fecha com o esperado. `pnpm test` → **245 arquivos · 2982 passed ·
      6 expected fail (2988) · 21,47s** — exatamente o número de antes da story, confirmando que a
      queda de 246/2989 foi só o arquivo de 7 casos que saiu no corte, e não regressão.
      `npx turbo lint --force` (sem cache) → **0 errors, 30 warnings**, todas pré-existentes (unused
      vars, `<img>`, diretivas `eslint-disable` órfãs), nenhuma nos arquivos da story.
      `npx turbo build --force` → **5/5 successful, 0 cached, 1m47s** — build real, não replay de
      cache. `pnpm type-check` deu FULL TURBO (8/8 cache hit), então não me apoiei nele: rodei
      `npx tsc --noEmit` direto em `packages/web`, duas vezes, exit 0.
  - id: V9
    check: "9. Efeito colateral declarado — os 194 KB de JSON saíram do bundle"
    resultado: >
      PASS, verificado no artefato de build e não só no argumento. Marcadores exclusivos do snapshot
      em `.next/server/**/*.js`: `capturedAt` 0 arquivos, `hasOrgId` 0 arquivos, `management-api`
      0 arquivos. (`dsopqkqjkmhytudaaolv` aparece em 341 arquivos, mas é a URL do Supabase inlinada
      por env var, não o snapshot — conferido para não virar falso positivo.) `schema-snapshot` só
      sobrevive em `.next/cache/.tsbuildinfo`, que é metadado de cache, não bundle.

