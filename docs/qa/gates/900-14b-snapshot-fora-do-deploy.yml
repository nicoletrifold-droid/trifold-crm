story: "docs/stories/900-14b-snapshot-fora-do-deploy.story.md"
title: "Quality Gate — Tirar org-scoped-admin.ts de dentro de docs/: o import que só quebrava na Vercel"
epic: 900
gate: PASS
verdict: PASS
review_round: 1
reviewed_by: "@qa (Quinn)"
reviewed_at: "2026-08-24"
branch: "fix/75-367-relatorio-semanal-duplicado (hotfix POR CIMA, sem commit — ver bloqueio_de_release B1)"
tipo: "Hotfix de build — import fora da árvore que o .vercelignore envia"
migrations: ["nenhuma"]

escopo: >
  HOTFIX P0. `packages/web/src/lib/supabase/org-scoped-admin.ts` (criado pela 900-14) importava
  `docs/audits/schema-snapshot.json` subindo cinco níveis. O `.vercelignore` da raiz lista `docs`,
  então o arquivo existe no disco local e no CI do GitHub — e não existe no build da Vercel. Três
  deploys de produção em ERROR, produção parada desde 2026-08-23 15:46 UTC (12:46 BRT). A correção é
  codegen: `generate-schema-snapshot.ts` passa a emitir, da MESMA captura que produz o JSON, o módulo
  `packages/web/src/lib/supabase/org-scoped-tables.generated.ts`, e o client importa esse módulo.
  Escopo cortado ao mínimo pelo usuário em 2026-08-24: AC5 (check de sincronia no CI) e AC6 (regra
  ESLint de import) saíram — ver riscos_aceitos.

resumo: >
  **A correção está na camada exata onde o build falhava, e isso foi provado, não assumido.** O erro
  da Vercel é `Cannot find module` — classe `TS2307`, emitida pelo type-check que o `next build` roda
  sobre o projeto inteiro. Conferi que essa camada está de fato ligada:
  `packages/web/next.config.ts` traz `typescript: { ignoreBuildErrors: false }` explícito e o
  `tsconfig.json` inclui `**/*.ts`. É por isso que o defeito quebrava o deploy mesmo sem nenhuma rota
  importar `createOrgScopedAdminClient()` ainda (os únicos consumidores hoje são o próprio arquivo e
  seu teste; as 129 rotas são da 900-15). Reproduzi a condição da Vercel movendo `docs/` para fora da
  árvore e rodando `tsc --noEmit` em `packages/web`: **exit 0**. E, no MESMO cenário, com um arquivo
  sonda trazendo de volta o import antigo: **exit 2, `TS2307 Cannot find module`**. A contraprova é o
  que dá valor à prova — sem ela, um `exit 0` poderia significar apenas que o type-check não rodou.

  **A paridade da lista foi remedida por mim, de forma independente do @dev.** Não conferi o número
  que o Dev Agent Record afirma; alimentei `renderOrgScopedTablesModule()` com o JSON commitado e
  comparei conjuntos contra a expressão ANTIGA (`tables.filter(t => t.hasOrgId).map(t => t.name)`,
  literalmente o código removido): 120 tabelas no snapshot, 92 com `org_id` pelos dois caminhos, sem
  duplicatas, `JSON \ módulo = []`, `módulo \ JSON = []`. E fui além do que o AC3 pede, conferindo a
  igualdade na forma em que o código realmente consome a lista — `Set(JSON) ≡ Set(módulo)` — porque é
  o `Set` que decide se o client escopa ou não.

  **A prova de equivalência template ↔ arquivo gerado é a que mais importava, e ela fecha por
  sha256.** O cabeçalho do `.generated.ts` vive num template dentro do gerador, e regerar de verdade
  exige `SUPABASE_MANAGEMENT_PAT`, que não temos — então o @dev editou os dois em par. Se
  divergissem, o arquivo commitado deixaria de ser o que o gerador produz e a próxima regeneração
  legítima viraria um diff fantasma. Renderizei o template do zero e comparei bytes com o commitado:
  3321 = 3321, **sha256 idêntico**
  (`b2a45532432e08bc5e20f716877f05843186fcbae42668d7d3268c44523f57f6`). Também verifiquei o que o AC
  não pedia e que sustenta a garantia no tempo: a emissão é determinística (renderizar 2x → mesmos
  bytes) e **estável à reordenação da entrada** (embaralhei `schema.tables` e saiu byte-idêntico),
  porque o gerador ordena os nomes. Sem isso, a ordem em que o Postgres devolve tabelas produziria
  diff espúrio a cada regeneração.

status_reason: >
  Liberado para push. AC1-AC4 verificados contra o código e contra execução própria, não contra a
  documentação da story. AC5/AC6 são risco aceito por decisão do usuário, não pendência. AC7 é do
  @devops por desenho — o preview só existe depois do push. Suíte inteira verde
  (245 arquivos / 2982 passed / 6 expected fail — exatamente o número de antes da story), lint
  0 errors, `turbo build --force` 5/5 sem cache, `tsc --noEmit` limpo com `docs/` ausente. Nada fora
  de escopo foi tocado. Nenhum item exige volta ao @dev.

