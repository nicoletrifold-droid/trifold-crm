riscos_aceitos:
  - id: RA1
    origem: "Corte de escopo do usuário em 2026-08-24 (AC5) — decisão de produto, não falha técnica"
    titulo: "Não existe check automático de sincronia entre o .generated.ts e o schema-snapshot.json"
    severidade_residual: LOW
    detalhe: >
      Registro como risco aceito, não como pendência, e **não recomendo reintroduzir como bloqueio**.
      Medi a superfície real do risco antes de classificá-la, porque ela é menor do que parece:
      `generate-schema-snapshot.ts` é o **único** escritor de `docs/audits/schema-snapshot.json` em
      todo o repo (`gate-tenancy.ts` apenas lê, via `SNAPSHOT_PATH`), e o `main()` agora grava os dois
      artefatos da mesma captura, numa execução. Não há caminho automatizado que atualize o JSON sem
      atualizar o módulo. Logo a divergência exige **edição manual** de um dos dois arquivos — e o
      cabeçalho do gerado abre com "ARQUIVO GERADO — NÃO EDITE À MÃO". O que o corte tira não é uma
      proteção contra o fluxo normal; é a rede contra o desvio deliberado.
    mitigacao_existente: "gerador de escrita conjunta + cabeçalho de arquivo gerado + limitação declarada nos 3 comentários"
    recomendacao: "Backlog, se e quando a 900-15 migrar as 129 rotas — aí a lista passa a ter 129 consumidores em produção e o custo de uma defasagem silenciosa muda de ordem de grandeza. Hoje o único consumidor é o próprio arquivo e seu teste."
  - id: RA2
    origem: "Corte de escopo do usuário em 2026-08-24 (AC6) — decisão de produto, não falha técnica"
    titulo: "Não existe barreira de lint contra um novo import de packages/web/src para fora da árvore buildável"
    severidade_residual: MEDIUM
    detalhe: >
      Também risco aceito, também sem recomendação de bloqueio. Mas é o de maior severidade residual
      dos dois, e por um motivo específico: a classe de defeito que esta story conserta é **invisível
      em todos os sinais que o time olha** — `pnpm build` local passa, o CI do GitHub passa, os testes
      passam, o type-check passa. Só o deploy da Vercel reprova, e reprova depois do merge. Foi
      exatamente assim que a 900-14 parou produção por 3 deploys e ~37 horas. Hoje a ocorrência é
      única e está sendo removida por esta story, então o repo fica em zero; o que não fica é o
      impedimento de voltar a um.
    mitigacao_existente: "docblock de org-scoped-admin.ts explica o mecanismo (.vercelignore exclui docs/, passa local e no CI, quebra só na Vercel) para quem editar o arquivo; a story documenta o incidente"
    recomendacao: "Backlog. Quando voltar, mirar o DESTINO do import (nunca a profundidade dos ../) — a evidência do @po e a minha coincidem: app/api/cron/followup/notify-alert.test.ts:25 importa '../../../../lib/broker/notify-stalled-lead' legitimamente e precisa continuar passando."

concerns:
  - id: C1
    severidade: LOW
    tipo: robustez do gerador
    titulo: "writeOrgScopedTablesModule() resolve o destino por process.cwd(), não pela raiz do repo"
    detalhe: >
      `main()` chama `writeOrgScopedTablesModule(schema, process.cwd())`, e o `join(repoRoot,
      ORG_SCOPED_TABLES_MODULE)` resultante só aponta para o lugar certo se o comando rodar da raiz.
      Rodado de um subdiretório, o módulo é gravado num caminho errado (ou o write falha) em silêncio.
      **Não é defeito novo desta story e não peço mudança:** a gravação do JSON, na linha logo acima,
      já usava `join(process.cwd(), "docs", "audits", …)` desde a 900-2a — o código novo seguiu a
      convenção local, que é a decisão certa num hotfix. Vale só o registro de que `gate-tenancy.ts`
      resolve isso melhor, com um `REPO_ROOT` calculado (linha 152), e que a inconsistência entre os
      dois scripts é um convite a erro futuro. `pnpm gate:tenancy:snapshot` sempre roda da raiz, então
      o caminho normal está protegido.
    recomendacao: "Se alguém voltar ao gerador por outro motivo, trocar process.cwd() pelo REPO_ROOT que gate-tenancy.ts já exporta — 1 linha, e alinha os dois escritores."
  - id: C2
    severidade: LOW
    tipo: cobertura de teste
    titulo: "Nada em pnpm test afirma módulo ≡ render(snapshot) — a prova é de gate, não de suíte"
    detalhe: >
      Consequência direta e conhecida do corte (o teste que fazia essa afirmação era um dos 7 casos
      apagados), e por isso **não é achado nem pedido de volta ao @dev** — está coberto por RA1. O
      registro que importa para quem ler este gate depois: a igualdade byte-a-byte que eu medi vale
      para o commit de hoje, não é um invariante que a suíte reafirma amanhã. Quem regenerar deve
      fazê-lo por `pnpm gate:tenancy:snapshot`, o único caminho que emite os dois juntos.
    recomendacao: "Nenhuma ação nesta story. Se RA1 voltar ao escopo, este teste é o artefato mais baratode todos — 1 arquivo, sem credencial, sem banco."

bloqueio_de_release:
  - id: B1
    dono: "@devops (Gage)"
    severidade: HIGH
    titulo: "org-scoped-tables.generated.ts é untracked (??) e PRECISA entrar no commit"
    detalhe: >
      Não é defeito de código — é condição de release, e é o modo de falha mais irônico desta story:
      se o arquivo ficar fora do commit, o build da Vercel quebra **exatamente igual**, com o mesmo
      `Cannot find module`, porque a Vercel importa o módulo e não roda codegen. `git check-ignore`
      retorna 1 (não é ignorado), então nada impede o `git add` — só o esquecimento.
  - id: B2
    dono: "@devops (Gage)"
    severidade: HIGH
    titulo: "O hotfix está por cima da branch do PR #492, sem commit, e o tree carrega mudanças alheias"
    detalhe: >
      Branch atual `fix/75-367-relatorio-semanal-duplicado` (PR #492, escopo 75-367, em revisão).
      Commitar como está mistura o hotfix dentro do PR #492 e faz o preview dele deixar de servir de
      evidência para o AC7 desta story. O tree também traz `.claude/agent-memory/aios-dev|aios-po|
      aios-sm` e `docs/backlog.md`, que são de @dev/@po/@sm — um stash ou checkout às cegas os
      arrastaria junto. Separar isso é trabalho do @devops; eu não toquei em git (nem branch, nem
      stash, nem commit), por restrição de papel e porque a avaliação do código não depende disso.
      O hotfix precisa de branch própria a partir de `main` (`7cc4f0ab`).

