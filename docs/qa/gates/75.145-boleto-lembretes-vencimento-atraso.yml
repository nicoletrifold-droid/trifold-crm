focus_area_findings:
  - area: 'Correção da data em America/Sao_Paulo (±1 dia)'
    result: 'hojeSaoPaulo/horaSaoPaulo via Intl.formatToParts; diffDiasVencimento via Date.UTC nos dois lados; marcoParaDiff só {0,5,15}. Brasil sem horário de verão desde 2019 → 12 UTC = 09 BRT o ano todo. Sem bug de fuso.'
  - area: 'Dedup keys prefixadas / colisão'
    result: 'Chaves lembrete começam com venc_hoje:/atraso5:/atraso15:; novo-boleto começa com dígito (billReceivableId numérico) → colisão impossível. Migration 126: event_key é PK única, event_type fora do ON CONFLICT.'
  - area: 'Disparo 09 BRT / não-regressão novo-boleto'
    result: 'Passo 2 dentro de if(rodarLembretes); passo 1 (novo-boleto) roda incondicional nas 4 rodadas e é loop separado — não lê o cap sentForClient. Testes AC6 confirmam.'
  - area: 'Fallback gracioso WhatsApp'
    result: 'sendBoletoLembreteWhatsApp lança em !res.ok mas é chamada com .catch no dispatcher; notifyBoletoLembrete tem try/catch próprio e nunca lança → route não libera o claim (só falha do Sienge/getReceivableBill libera). Email/push já disparados. Teste AC8 confirma.'
  - area: 'Boleto pago (hasBoleto=false)'
    result: 'Excluído do array abertos em ambos os passos. Teste AC4 confirma.'
  - area: 'Qualidade dos testes'
    result: 'Não-tautológicos: asserem marco + event_key + event_type reais, independência do novo-boleto, e via fetch mock !ok que falha de WhatsApp não impede email/push. Edge cases cobertos (diff=16, pago, claim negado, hora errada).'
  - area: 'Não quebrar o que funciona (memoização)'
    result: 'Refactor de passo 1 byte-a-byte preservado: getReceivableBill→getBillMemo, obra inline→resolveObra (mesmo select/filtros), vínculo inline→clienteVinculado (!vinculo ≡ !(await …)). Caches per-cliente-iteration (sem vazamento entre clientes). Só cacheia resultado OK (falha re-tenta).'

