escopo: >
  A AC9 da 75-330 tinha sido entregue só no /broker. Esta story leva o painel para a ficha do
  /dashboard — a única que a SDR abre —, acrescenta "onde a pessoa parou" e passa a listar TODAS as
  respostas do lead em vez de só a última.

resumo: >
  **As cinco mutações mordem, cada uma em exatamente um caso** — o teste é preciso, não redundante:
  `parouEm` fixo em null derruba 1, aceitar resposta vazia derruba 1, tolerar schema quebrado como
  formulário vazio derruba 1, inverter a ordem derruba 1, tirar o escopo de org derruba 1. md5 do
  helper idêntico ao original depois do gate.

  A parte que a suíte NÃO alcança é a fiação de JSX (o painel aparecer nas duas abas, e o "Parou em"
  só em parcial): o projeto não tem jsdom. Está em C1, com conferência visual pós-deploy.

status_reason: >
  Liberado para merge. Uma dívida declarada (C1) e a conferência visual (P1/P2).

acoes_obrigatorias: []

concerns:
  - id: C1
    severidade: LOW
    tipo: dívida-de-teste
    titulo: "A fiação de JSX não tem rede"
    detalhe: >
      Remover `{painelFormulario()}` de uma das abas, ou trocar `parcial && parouEm` por só
      `parouEm`, passa com a suíte verde. Sem jsdom no projeto, a alternativa seria extrair a
      decisão "mostra ou não" para função pura — mas aqui a decisão JÁ é pura (`parcial`,
      `parouEm` vêm prontos do helper, testados): o que sobra no JSX é posicionamento, que se
      confere olhando. Mitigado por P1.
  - id: C2
    severidade: LOW
    tipo: escopo
    titulo: "A ficha do corretor mudou junto"
    detalhe: >
      `/broker/leads/[id]` passou a listar TODAS as respostas (era só a última) e ganha o "Parou
      em". Foi decisão declarada na AC3 — helper e componente são compartilhados, e deixar o
      corretor vendo menos que a SDR criaria duas verdades para a mesma pergunta. Efeito prático
      hoje: nenhum lead da base tem duas respostas, então a tela dele só ganha o "Parou em".

impactos_conhecidos_e_aceitos:
  - titulo: "As respostas 'sem contato' continuam invisíveis na ficha — e têm de continuar"
    detalhe: >
      3 das 6 respostas de ontem não têm lead (a pessoa saiu antes de nome+telefone). Não existe
      ficha onde mostrá-las; elas vivem na tela de Formulários, que é de onde a oferta ativa sai.
      Limite do dado, não da tela.
  - titulo: "Nenhuma activity nova é criada"
    detalhe: >
      Resposta parcial continua sem `form_completed` — de propósito: uma linha de timeline por POST
      parcial poluiria o Histórico. A visibilidade vem do painel, que lê a tabela.
  - titulo: "Uma query a mais por abertura de ficha de lead"
    detalhe: >
      `fetchRespostasDoLead` roda em toda abertura de `/dashboard/leads/[id]`, inclusive para lead
      que nunca preencheu formulário (volta vazia). Índice parcial
      `idx_lead_form_responses_lead` (mig 232) cobre exatamente este acesso.

