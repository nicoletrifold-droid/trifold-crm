  NFR-TENANCY-1: 'PASS — org_id em todas as 3 queries (orgId da sessão, nunca de input); entity_id na P1. Validado por teste iterando sobre todas as queries.'
  NFR-OBS-1: 'PASS — safeProvenanceData engole erro→null; ausência de dado vira "indisponível"; nunca inventa recência nem propaga erro que derrube a montagem.'
