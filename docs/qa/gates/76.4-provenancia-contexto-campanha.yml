ac_traceability:
  AC1: 'PASS — buildCampaignContext expande o Promise.all de 5→8 elementos (context-builder.ts:665-718) via ...provenanceQueryBuilders(supabase, orgId, {startDate: date30dAgo, endDate: today}, metaCampaignId). Query-prov-A (meta_insights_daily.synced_at) filtra org_id+level=campaign+entity_id+date∈[30d,today], order synced_at desc, limit 1, maybeSingle (= MAX synced_at). Query-prov-B (meta_ad_accounts.last_synced_at) e Query-prov-C (meta_sync_log) idênticas ao global. As 3 estão DENTRO do mesmo Promise.all (spread), sem round-trip extra.'
  AC2: 'PASS — zero duplicação. computeProvenance e formatProvenanceBlock chamados com os resultados das 3 queries (context-builder.ts:723, :782); nenhuma cópia. Design alternativo do @dev (parametrizar provenanceQueryBuilders com entityId? em vez de exportar safeProvenanceData) é superior à sugestão da story: mantém FONTE ÚNICA do plumbing e reduz superfície pública. Backward-compat: buildGlobalContext (context-builder.ts:465) chama sem entityId — sem mudança de comportamento.'
  AC3: 'PASS — formatProvenanceBlock(provenance, today) é empurrado em context-builder.ts:782, imediatamente após lines.push(`CONTEXTO CAMPANHA: "${campaign.name}"`) e antes da linha Status. Teste "bloco vem ANTES da linha de Status" verifica text.indexOf("[PROVENIÊNCIA") < text.indexOf("Status:").'
  AC4: 'PASS — a P1 da campanha recebe entityId=metaCampaignId, gerando .eq("entity_id", metaCampaignId) (teste "P1 ... E entity_id = metaCampaignId"). maxSyncedAt reflete o MAX(synced_at) DAQUELA campanha na janela 30d, não o MAX global. Teste de computeProvenance confirma que o synced_at específico da campanha é propagado.'
  AC5: 'PASS — quando a campanha não tem registros na janela, a P1 retorna null (via safeProvenanceData) → maxSyncedAt=null → fmtProvTimestamp → "indisponível"; isStale permanece false (deriva de meta_sync_log, não da P1). Tests: "sem synced_at na janela → indisponível, sem inventar data" e "campanha SEM synced_at na janela → indisponível e isStale=false". NFR-OBS-1 respeitado: ausência de dado ≠ dado defasado.'
  AC6: 'PASS — as 3 queries entram no Promise.all que alimenta o cache campaign:{orgId}:{metaCampaignId} (getCached/setCache em buildCampaignContext, TTL 5min). O bloco de proveniência expira e renova junto com o restante do contexto. NFR-PERF-1.'
  AC7: 'PASS (CRÍTICO) — ver tenant_isolation_check. Todas as 3 queries filtram org_id; P1 também entity_id. Teste itera sobre todas as queries gravadas confirmando .eq(org_id). Sem vazamento cross-org/cross-campanha.'
  AC8: 'PASS — isStale/isError coerentes com o global (mesma derivação via computeProvenance; sync é a nível de org). AGENT_SYSTEM_PROMPT intocado — as instruções de alerta da 76-1 já cobrem qualquer bloco de proveniência. Verificação manual do agente focado numa campanha citando a data permanece como teste manual downstream (DoD da story marca como pendente não-bloqueante).'
  AC9: 'PASS — type-check zero erros nos arquivos da story (só 3 pré-existentes de react-email-editor, não relacionados); ESLint exit 0. Verificado em runtime pelo @qa.'

