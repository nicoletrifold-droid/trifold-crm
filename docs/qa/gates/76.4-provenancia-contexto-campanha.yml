# Os 4 quality_gate tools nomeados na story
gate_checks:
  provenance_campaign_context_check: 'PASS — buildCampaignContext (context-builder.ts:721+) computa computeProvenance({maxSyncedAt, lastAccountSync, syncLog}) a partir das 3 queries e injeta formatProvenanceBlock(provenance, today) em context-builder.ts:782, logo APÓS lines.push(`CONTEXTO CAMPANHA: "${campaign.name}"`) e ANTES da linha Status (ordem confirmada pelo teste "injeta o bloco [PROVENIÊNCIA...] no header da campanha"). maxSyncedAt vem da P1 filtrada por entity_id=metaCampaignId, refletindo a recência DAQUELA campanha (AC4), não o MAX global da org.'
  staleness_alert_test: 'PASS — isStale/isError derivam de computeProvenance (76-1, mesma semântica: finished_at do último ciclo de meta_sync_log > 36h; status="error"). O sync é a nível de org (P2/P3 idênticas ao global), então o alerta de staleness/erro da campanha é coerente com o global por construção (AC8). Sem alteração em AGENT_SYSTEM_PROMPT — as instruções de datação/alerta da 76-1 cobrem qualquer bloco [PROVENIÊNCIA...] presente, incluindo o novo de campanha. Caso "sem synced_at na janela → indisponível + Dados defasados: não" coberto por teste (AC5/NFR-OBS-1).'
  tenant_isolation_check: 'PASS (CRÍTICO) — todas as queries de buildCampaignContext filtram .eq("org_id", orgId), validado pelo teste "isolamento multi-tenant: todas as queries filtram pelo org_id informado" que itera sobre TODAS as queries gravadas. A P1 de proveniência também filtra .eq("entity_id", metaCampaignId) (teste "P1 da proveniência usa a janela 30d da campanha E entity_id"). orgId vem do parâmetro da função (sessão), nunca de input do cliente. Nenhum vazamento cross-org nem cross-campanha.'
  no_duplication_check: 'PASS — nenhum helper de proveniência foi copiado/re-implementado. A P1 da campanha NÃO foi escrita inline (sugestão original da story); em vez disso o @dev parametrizou provenanceQueryBuilders com entityId? opcional (FONTE ÚNICA do plumbing, ARCH-001 da 76-3 preservado). P2/P3 continuam idênticas e compartilhadas; mudança de coluna/tabela permanece em 1 ponto. computeProvenance e formatProvenanceBlock reusados sem cópia. Consequência elegante: safeProvenanceData NÃO precisou ser exportada (T1/R1 contornado pelo design alternativo — menos superfície pública), apesar de a story sugerir exportá-la.'

