top_issues:
  - id: 'DOC-001'
    severity: medium
    finding: >-
      Dev Agent Record §6 afirma "ZERO alertas para o Ailton na rodada real". Falso: na minha rodada
      há 1 alerta para ele — a fala de 30/07 22:05 BRT, que afirma 03/08 12:00 e não tem fala
      corretiva NAQUELE dia afirmado. O CÓDIGO está certo (a unidade da supressão é lead + dia
      afirmado, e 03/08 ≠ 01/08; a fixture literal da AC4-iii é o par 22:17/22:18, e esse par
      produz zero alertas). A própria story se contradiz: a linha 16 da tabela dela marca
      "ALERTA" para o Ailton 22:05 e o §7-4 conta "Ailton 22:05" entre os 8 alertas.
    suggested_action: >-
      Corrigir a frase do §6 para "ZERO alertas para o PAR 22:17/22:18 (o dia afirmado 01/08); o
      alerta do Ailton na rodada é o da fala das 22:05, que afirma 03/08". Numa story cuja tese é
      "um instrumento que mente é pior que um que falha", uma afirmação falsa no registro dele não
      é cosmética.
    ac_afetada: 'AC4-(iii) — o comportamento fecha; o RELATO não'

  - id: 'REL-001'
    severity: low
    finding: >-
      O dedupe não é atômico: a rota faz select em system_events e depois insere via logEvent
      (fire-and-forget). Se dois projetos Vercel deployarem o mesmo vercel.json, os dois crons
      disparam no MESMO minuto (38 11) e podem ambos ler vazio e ambos escrever. A mitigação do
      Risco 4 cobre re-execução SEQUENCIAL, não CONCORRENTE.
    suggested_action: >-
      Registrar explicitamente que o dedupe não protege o caso concorrente. Quem fecha isso é a
      pré-tarefa da AC6 (@devops nomear o projeto Vercel), não o código.

  - id: 'REL-002'
    severity: low
    finding: >-
      logEvent é fire-and-forget e, no dia SEM alerta (o caso comum), o insert de
      NICOLE_LASTRO_DIARIO é a última instrução antes do return — nada mantém a lambda viva. É a
      classe do incidente da Story 75-139 (void sendEmail não chegava). ATENUANTE MEDIDO: o
      FOLLOWUP_EXECUTED de api/cron/followup tem exatamente a mesma forma (logEvent → return
      NextResponse.json) e ESTÁ em produção (2026-07-21) — o padrão funciona neste deploy.
    suggested_action: >-
      A prova por efeito da AC6 é o que resolve. Se a linha NICOLE_LASTRO_DIARIO não aparecer
      depois da primeira execução real do agendador, o conserto é after() (já usado em
      webhook/whatsapp), não investigação.

  - id: 'REL-003'
    severity: low
    finding: >-
      O select de dedupe não tem .limit() nem filtro por message_id — depende do teto default de
      1000 linhas do PostgREST. Hoje inofensivo (0,13 alerta/dia), mas degrada em silêncio se o
      volume mudar.
    suggested_action: 'Filtrar por metadata->>message_id nos ids candidatos, ou .limit() explícito.'

  - id: 'MNT-001'
    severity: low
    finding: 'DEFAULT_ORG_ID hardcoded na rota (consistente com daily-report, mas o projeto está pivotando para multi-tenant).'
    suggested_action: 'Item de backlog junto com os demais crons org-fixos — não desta story.'

  - id: 'TEST-001'
    severity: low
    finding: "eslint: 2 warnings de params não usados (_supabase, _opts) em route.test.ts."
    suggested_action: 'Remover os params ou prefixar conforme a regra do projeto.'

