issues:
  - severity: low
    category: requirements
    id: C-1
    description: >
      A cadeia inventário → taxonomia → registro tem 2 elos de transcrição humana e
      101×10 células; a amostragem (5/5) reduz mas não zera o risco de um seed
      transcrito errado. Um seed errado NÃO muda comportamento nesta story (nada
      consome) — só apareceria em F3.
    recommendation: >
      Em cada story de F3, o primeiro passo do @dev é conferir o seed das capabilities
      do módulo contra o gate hardcoded que está substituindo (diff role a role) ANTES
      de trocar o call site. Tornar isso item fixo do template das stories F3.
  - severity: low
    category: requirements
    id: C-2
    description: >
      Gates compostos por OR hoje (ex.: imobiliariasGuard = canAccess("imob") OR
      isPastaManager) não são espelháveis numa capability única: o seed de
      imob.imobiliarias_gerenciar cobre o ramo isPastaManager, mas quem passa hoje só
      pelo módulo imob (ex.: consultoria, se tiver o módulo) não está no seed. Se F3
      trocar o gate por can() sozinho, esses perfis perdem acesso.
    recommendation: >
      F3 desses gates deve compor "canAccess(módulo) OR can(capability)" ou ampliar o
      seed antes da troca — decisão por gate, registrada na story correspondente.
