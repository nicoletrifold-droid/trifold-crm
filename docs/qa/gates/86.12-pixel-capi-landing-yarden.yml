falso_positivo_de_worktree_iteracao_3: |
  A suíte completa nesta worktree dá **71 failed / 4266 passed + 6 expected fail**
  em 3 arquivos de `packages/web` (`webhook/whatsapp/__tests__/route.test.ts`,
  `lib/coach/barrel-contract.test.ts`, `lib/env-banner.test.ts`), e o
  `type-check` dá 12 linhas de erro. Número cru não é veredito — eu tinha que
  provar a paridade com baseline, e o `git stash` não servia (o trabalho está
  COMMITADO, o stash seria no-op).

  Método usado, sem mutar a worktree e sem criar branch/worktree nova:
  `git archive f3992973 | tar -x` num diretório temporário, replicando os MESMOS
  3 symlinks de `node_modules` da worktree. Confirmado que o extrato é o baseline
  (`grep -c 'Cadastre-se para mais informações'` = 0, `grep -c 'EM BREVE</span>'`
  = 1). Rodados os 3 arquivos lá: **3 arquivos / 71 failed** com as MESMAS TRÊS
  assinaturas de erro (`Cannot find package '@trifold/ai/src/flows/loop-breaker'`,
  `TypeError: conjunto is not iterable`,
  `AssertionError: expected 'undefined' to be 'function'`). Contagem idêntica →
  **0 regressão**, é pré-existente.

  Causa-raiz medida, não suposta: `node_modules` da worktree é symlink para
  `/Users/lucasprado/trifold-crm/node_modules`, e `packages/{web,ai}/node_modules`
  também. Não existe `node_modules/@trifold`, então `@trifold/ai`/`@trifold/shared`
  resolvem pela checkout PRINCIPAL, que está num commit mais antigo.
  `packages/ai/src/flows/loop-breaker.ts` **existe na worktree** e **não existe**
  no destino do symlink. Idem para todos os símbolos do `type-check`:
  `ehRefDeProducao`, `extrairRefDeUrlSupabase`, `detectObjection`,
  `draftCoachReply`, `isCoachEligible`, `bloqueadoPorLoop` — cada um aparece em
  2-3 arquivos da worktree e em **0** do destino do symlink.

  Prova adicional de que não pode ser desta leva: `git diff f3992973..HEAD --stat
  -- packages/` é **VAZIO** — zero byte de `.ts` tocado. `tsc` não lê `.html`,
  `.jpg`, `.webp` nem `docs/*.md`.

  `lint`: rodado com `turbo lint --force` (**0 cached**, porque cache hit não é
  evidência) → 8/8 tasks, **0 errors** / 30 warnings, todas pré-existentes em
  `packages/web`, nenhuma em `landing-pages/`.

  Nota estrutural registrada: `pnpm-workspace.yaml` declara só `packages/*`, e
  `landing-pages/yarden/package.json` não tem script de `lint`/`type-check` —
  logo esses dois gates **não cobrem** este arquivo de forma nenhuma. A cobertura
  real do `index.html` é o `vitest` de `landing-pages/yarden` + medição no
  browser. Isso reforça 86.12-QA-010.

