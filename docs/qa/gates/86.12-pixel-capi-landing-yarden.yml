status_reason: >
  Todos os 12 ACs implementáveis entregues e verificados no código; as 5
  armadilhas históricas desta família de stories foram checadas uma a uma e
  nenhuma se materializou. Restam 3 achados `low` (2 deles follow-ups amarrados à
  dependência externa de conteúdo do AC12) e o AC13, que é validação pós-deploy
  do @devops.

verdict_rationale: >
  Esta é a segunda cópia do padrão da 86-11, e o modo de falha dominante de um
  clone é silencioso: o código funciona, os testes passam, e o dado sai rotulado
  para o empreendimento errado. Revisei cada um desses pontos por leitura de
  código + MUTAÇÃO (8 mutações, todas mataram teste — nenhum dos testes-chave
  passa por vacuidade). Nada foi aceito por relato do @dev.

  O ADAPT do AC5 é do tamanho certo: 3 constantes viraram um `Record` fixo + um
  resolver, os 2 (únicos) call-sites trocaram de import, e `form-capi.ts` /
  `capi-payload.ts` / `capi-client.ts` / `landing-pages/vind-residence/*` não
  foram tocados — conferido por `git diff` vazio, não por afirmação. A
  não-regressão do Vind Residence é provada por VALOR (as três strings da 86-11
  escritas à mão no teste), não por acompanhar o `LANDING_CONFIGS`.

  Os dois achados que o @po levantou na validação estão fechados e travados por
  teste com assert positivo: `page: "yarden"` (identidade do lead no CRM) e
  `landing: "yarden"` (segmentação Meta) são campos DISTINTOS e ambos foram
  trocados. A trust boundary está no lugar certo — `landing`, `client_ip` e
  `client_ua` são atribuídos DEPOIS do loop da allowlist nos dois proxies,
  sobrescrevendo qualquer forja do browser.

