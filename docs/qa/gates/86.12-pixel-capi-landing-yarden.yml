status_reason: >
  A leva 3 (rótulo "EM BREVE"→"LANÇAMENTO", imagem nova do mapa, título dos 2
  formulários do hero) está correta e é cirúrgica: o CSS normalizado e todo o JS
  inline são **byte-idênticos** ao baseline (mesmo sha256), e o diff do DOM
  renderizado contém **exatamente** as 3 mudanças pretendidas e nada mais. Sem
  overflow em 14 larguras medidas de 320 a 2560px com Montserrat comprovadamente
  pintada. O gate cumulativo fica em CONCERNS apenas por herança: as 2 lacunas
  `medium` de cobertura da iteração 2 seguem abertas.

verdict_rationale: >
  Escopo real medido, não aceito por relato: `git diff f3992973..HEAD --stat` dá
  4 arquivos — a story, os 2 binários do mapa e o `index.html`. Zero byte em
  `packages/`, `yarden/api/`, `trifold-design-system/` ou `vind-residence/`, logo
  AC5-AC9 seguem cobertos pelos gates 1 e 2 sem re-verificação.

  Três provas de escopo que valem mais que a leitura do diff:
  (1) extraído o `<style>` dos dois lados, removidos os comentários e normalizado
  — `sha256` IDÊNTICO (538a326a…), ou seja **nenhuma regra de CSS mudou**, o delta
  de CSS era 100% comentário; (2) extraídos todos os `<script>` inline — `diff`
  VAZIO, **nenhuma linha de comportamento mudou**; (3) renderizados baseline e
  HEAD no Chromium a 1440px e 390px e diferenciados textContent, `<img>`,
  `<source>`, `<a>`, inputs/botões, lista de `id`, href do WhatsApp, `<title>` e
  todas as `<meta>` — divergem **só** em `"EM BREVE"→"LANÇAMENTO"` (1 ocorrência),
  `"Antecipe-se ao lançamento"→"Cadastre-se para mais informações"` (2 ocorrências,
  texto idêntico entre si) e na linha do mapa (attrs 637→636 + `alt`). Todo o
  resto — hero pool, interior lounge, família, logos, rodapé, float do WhatsApp,
  os 3 formulários, os 4 links de política — bit a bit igual. Isso é
  não-regressão provada, não eyeballada.

  O ponto onde eu não confiei na medição do @dev e refiz: o `<link>` do Google
  Fonts usa `display=optional`, e `font-display:optional` NUNCA faz swap — a
  primeira varredura que eu rodei pintou na fallback `-apple-system`, ~7% mais
  estreita que Montserrat, e teria me dado um falso "cabe". Refeito interceptando
  o CSS de `fonts.googleapis.com` e reescrevendo para `font-display:block`, com
  `document.fonts.load("400 20px 'Montserrat'")` explícito. **Prova de que a face
  certa pintou:** o mesmo texto mede 422,2px em Montserrat contra 394,4px na
  fallback em toda medição válida.

  Um número do Change Log 0.16 é vacuoso como está escrito (86.12-QA-009): "o
  eyebrow tem 393,9px dentro de brand 413,3px" compara CAIXAS, e `.hero-eyebrow` é
  filho de um flex column — a caixa dele é `stretch` do container por construção,
  então **jamais** poderia exceder. A conclusão está certa, mas a métrica que a
  sustenta é a contagem de linhas e a largura do TEXTO (200,4px de 393,9
  disponíveis a 1440px; 97,5px de ~170px a 320px), que eu medi. Achado `low` de
  documentação, não defeito de código.

