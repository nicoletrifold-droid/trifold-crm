mutacoes_executadas: |
  Teste verde não é prova; teste que morre quando o código quebra, é. Mutei 11
  vezes, cada mutação com verificação de que **de fato** foi aplicada (script que
  aborta se o texto-alvo não aparecer exatamente 1×), e restaurei por
  `git checkout --` com `git status` limpo ao final.

  **6 mataram teste (a guarda é real):**

  | # | Mutação | Resultado |
  |---|---|---|
  | MUT-1 | `srcset="assets/hero-piscina-rooftop-mobile.webp"` → `...-XX.webp` (arquivo inexistente, e o caminho só existe em `srcset`) | ❌ 2 falhas |
  | MUT-2 | `cp logo-yarden-creme.svg assets/hero-vind-residence.svg` + referência no HTML | ❌ 1 falha |
  | MUT-3 | asset órfão no disco (`sobra-de-clone.svg`, não referenciado) | ❌ 1 falha |
  | MUT-4 | volta ao placeholder: TODAS as refs `assets/` → `PLACEHOLDER.*` | ❌ 2 falhas (inclui o piso `>= 12`) |
  | MUT-E | id do `<noscript>` → `1337310707164660` (diverge do `init`) | ❌ 1 falha |
  | MUT-F | reintroduz `console.log("[lead capturado]", data)` | ❌ 1 falha |

  **5 SOBREVIVERAM (nenhum teste morreu — este é o achado da iteração):**

  | # | Mutação | Efeito real em produção | Resultado |
  |---|---|---|---|
  | MUT-A | `var enviando = false` movida para FORA do closure de `ligarFormulario` (escopo do script) | a trava de duplo-envio vira GLOBAL: preencher o 2º formulário com o 1º em voo é barrado — exatamente o que o comentário do próprio arquivo (linhas 691-698) diz que não pode acontecer | ✅ **23 passed** |
  | MUT-H | remove `['leadFormMobile','formMsgMobile']` do array `FORMULARIOS` (linha 801) | o formulário do hero mobile fica **inerte**: nenhum listener de submit, nenhum lead criado, nenhum `Lead`/`CompleteRegistration` — a página recarrega e o visitante some | ✅ **23 passed** |
  | MUT-B2 | remove `tabindex="-1" aria-hidden="true"` do honeypot `empresaSaber` (linha 610) | honeypot entra na ordem de tabulação e na árvore de acessibilidade — usuário real o preenche e é classificado como bot (`tracked:false`, lead descartado) | ✅ **23 passed** |
  | MUT-C2 | remove `role="status" aria-live="polite"` do `#formMsgSaber` (linha 630) | leitor de tela não anuncia nem sucesso nem erro naquele formulário | ✅ **23 passed** |
  | MUT-G | apaga o `label.check` inteiro do `leadFormSaber` (checkbox `required` de política) | o 3º formulário volta a enviar lead sem aceite de política — a assimetria que o Change Log 0.11 acabou de fechar | ✅ **23 passed** |

  Causa comum das 5: as asserções estáticas de `tracking-browser.test.ts` foram
  escritas na era do formulário único e não acompanharam a passagem para 3.
  `:106` lista só os 6 `id` do hero desktop; `:110-111` só o honeypot `#empresa`;
  `:118-119` só a live region `#formMsg`; e `:126-131` procura `if (enviando)
  return` / `enviando = true` / 2× `liberar();` no script inteiro — todos os três
  padrões **sobrevivem intactos** ao içamento da variável para fora do closure,
  que é justamente a regressão que a asserção deveria pegar.

  `git status --short landing-pages/yarden/` **vazio** após cada rodada.

falsos_positivos_descartados: |
  - **Honeypots com `name="empresa"` repetido nos 3 formulários** — parecia o bug
    clássico de `id` duplicado. Não é: os `id` SÃO distintos
    (`empresa`/`empresaMobile`/`empresaSaber`, `uniq -d` vazio no arquivo inteiro)
    e o handler usa `form.empresa.value` — acesso nomeado do `HTMLFormElement`,
    resolvido dentro daquele `<form>`. `getElementById` não aparece em lugar
    nenhum do caminho do honeypot. Compartilhar o `name` entre formulários
    distintos é correto e necessário (é o que o proxy espera receber).
  - **Dois formulários de hero simultâneos no DOM** — não duplicam captação: as
    media queries são `min-width:980px` (esconde `--estatico`) e
    `max-width:979.98px` (esconde `--sobreposto`), sem lacuna e sem sobreposição.
  - **`InitiateCheckout` com flag `disparado` global** — não é vazamento de
    isolamento: é decisão documentada (mede engajamento do visitante, não do
    componente), consistente com a 86-11, e disparar 2× seria 2 conversões de topo
    de funil para a mesma pessoa.
  - **Branch atrasada em relação a `origin/main`** (merge-base `412eb2cf`, e
    `origin/main` já está em `cd5ca433`) — não é defeito desta story. O `git diff
    main..HEAD` "apagando" Epic 87/90 é artefato de repo squash-merge; o PR será
    computado contra a merge-base correta. Registrado em `notas_para_devops`
    apenas como aviso de rebase.

