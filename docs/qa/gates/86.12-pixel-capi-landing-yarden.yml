mutacoes_executadas: |
  Teste que passa sem exercitar nada é pior que teste nenhum. Mutei o código e
  confirmei que cada guarda tem um teste que morre sem ela:

  | # | Mutação | Arquivo | Resultado |
  |---|---|---|---|
  | M1 | `hasOwnProperty.call(...)` → `slug in LANDING_CONFIGS` | `landing-page-tracking.ts` | ❌ 1 falha — a guarda de prototype chain é real (confirma D1) |
  | M2 | `page: PAGE_NAME` → `page: "vind-residence"` | `yarden/api/lead.js` | ❌ 1 falha — o achado do @po está travado |
  | M3 | remove `tracking.landing = LANDING_SLUG` | `yarden/api/lead.js` | ❌ 5 falhas |
  | M4 | id do `<noscript>` → `9999999999999999` | `yarden/index.html` | ❌ 1 falha — a divergência de dataset é pega |
  | M4b | `TRACK_ENDPOINT` → `vind-residence.vercel.app` | `yarden/index.html` | ❌ 1 falha |
  | M4c | reintroduz `console.log("[lead capturado]", data)` | `yarden/index.html` | ❌ 1 falha — `86.11-QA-005` não pode voltar num merge |
  | M5 | `resolveLandingConfig(tracking.landing)` → `(undefined)` | `landing-page/route.ts` | ❌ 1 falha |
  | M6 | `resolveLandingConfig(tracking?.landing)` → `(undefined)` | `track/route.ts` | ❌ 2 falhas |
  | M7 | `confiarEmClientIpDoCorpo: true` → `false` | `track/route.ts` | ❌ 1 falha — a precedência de IP/UA é testada de verdade |
  | M8 | `confiarEmClientIpDoCorpo: true` → `false` | `landing-page/route.ts` | ❌ 2 falhas |

  **8/8 mutações mataram teste.** Todos os arquivos restaurados e conferidos por
  `sha256` contra o backup pré-mutação; suíte completa re-executada depois da
  restauração com o mesmo resultado (255/3146).

falsos_positivos_descartados: |
  Coisas que pareciam achado e não eram — registradas para não voltarem como
  ruído numa próxima revisão:

  - **`var VISITOR_KEY` duplicado no `index.html`**: era artefato do MEU comando
    (`sed -n '1,60p;60,200p'` imprime a linha 60 duas vezes). `grep -n VISITOR_KEY`
    confirma **uma** declaração, na linha 60. Não é defeito.
  - **`.vercelignore` do yarden ser untracked**: é o estado esperado de um
    diretório novo inteiro. Rodei `git check-ignore` nos 9 arquivos do projeto —
    **nenhum é ignorado**, então o `.vercelignore` (que exclui `.claude`,
    `README.md` e `*.test.ts`) vai ser versionado junto. A armadilha que expôs
    `.claude` no `trifold-design-system` não se repete aqui.
  - **Blocos novos de CSP sem `X-Frame-Options`**: os 3 blocos do Vind Residence
    também não têm (só o catch-all tem). É clone fiel, e o `frame-ancestors 'none'`
    da própria CSP cobre o caso em navegador moderno. Não é regressão.

