status_reason: >
  O conteúdo definitivo entrou correto: as 3 marcações de formulário são de fato
  isoladas, o dataset bate nos 2 pontos do <head>, o `noindex` saiu e a nova
  asserção bidirecional de `assets/` mata as 4 mutações que ela promete matar.
  Nada bloqueia o merge. O que puxa para CONCERNS é cobertura: 2 dos 3
  formulários são funcionalmente **não testados** e a garantia-título desta leva
  (trava de duplo-envio POR formulário) sobrevive à mutação — provado, não
  suposto.

verdict_rationale: >
  Esta leva reescreveu o `index.html` de placeholder para a página definitiva e
  passou de 1 para 3 formulários. `api/`, `packages/web/` e a CSP do
  `trifold-design-system` NÃO foram tocados (`git diff 5a115358..HEAD` vazio
  nesses caminhos), então o gate PASS da iteração 1 continua valendo integralmente
  para AC5/AC6/AC7/AC8/AC9 — só o AC1/AC4/AC10/AC12 e os testes do browser foram
  re-verificados aqui, do zero.

  O código está certo em tudo que li: `ligarFormulario()` é chamada uma vez por
  par (form, mensagem), `var enviando` vive no closure de cada instância, o
  honeypot é lido por `form.empresa` (acesso nomeado, escopado ao `<form>`) e não
  por `getElementById`, os 3 honeypots têm `id` distintos, o par
  `event_id`/`complete_registration_event_id` é gerado dentro do handler a cada
  submissão, e as 3 mensagens têm `role="status"`/`aria-live="polite"`. Os 3
  `label.check` são byte-a-byte idênticos ("Políticas de privacidade"), com as
  linhas exatamente onde a tabela do AC12 diz (519-522 / 551-554 / 625-628) —
  conferido por md5 dos blocos, não por leitura a olho.

  Mas correção não é cobertura. Mutei o arquivo 11 vezes: 6 mutações mataram
  teste, **5 não mataram nenhum**. As 5 sobreviventes são todas em `leadFormMobile`
  e `leadFormSaber` — inclusive tirar o `leadFormMobile` do array `FORMULARIOS`,
  o que deixa aquele formulário completamente inerte (não envia lead, não dispara
  CAPI), com a suíte verde. Num arquivo que o próprio README avisa que vai ser
  mexido de novo, isso é uma regressão à espera de um merge.

