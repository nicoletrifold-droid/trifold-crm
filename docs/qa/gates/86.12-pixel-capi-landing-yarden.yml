    severity: low
    category: requirements
    finding: >
      `<meta name="robots" content="noindex, nofollow">` (D7) é comportamento que
      a story não pediu. A mitigação é uma linha de checklist no README (passo 0),
      não um teste — se ninguém remover a tag quando o conteúdo definitivo chegar,
      a landing final fica fora da busca orgânica em silêncio.
    suggested_action: >
      Aceitável para um placeholder (a URL hoje é 404, indexar página vazia é pior).
      Criar item de backlog amarrado à entrega do conteúdo do AC12 em vez de
      confiar só no README. Não bloqueia — não afeta tráfego pago nem Pixel/CAPI.
    status: OPEN

  - id: "86.12-QA-002"
    severity: low
    category: requirements
    finding: >
      O checkbox de aceite de política de privacidade é `required` mas o texto não
      tem link para política nenhuma (D4 — nenhuma URL foi fornecida, e inventar
      violaria o Artigo IV). Consentimento obrigatório apontando para nada é frágil
      do ponto de vista de LGPD.
    suggested_action: >
      Decisão correta do @dev (melhor sem link que com `href="#"` morto). Fornecer
      a URL da política junto com o conteúdo do AC12 e amarrar isso ao mesmo
      follow-up do `86.12-QA-001`.
    status: OPEN

  - id: "86.12-QA-003"
    severity: low
    category: security
    finding: >
      Herdado, não introduzido: `86.11-QA-003` (sem rate limit em
      `POST /api/webhooks/landing-page/track`) continua OPEN, e esta story
      acrescenta uma SEGUNDA fonte pública de tráfego para o mesmo endpoint — o
      proxy `yarden/api/track.js`, que também não tem rate limit. O CRM exige token
      (conferido: `Bearer` ou `?token=`, 401 sem ele), então o alvo real é o proxy.
    suggested_action: >
      Explicitamente fora de escopo pelo AC10 e correto assim. Manter no backlog da
      86-11 como propriedade da rota compartilhada, agora com a nota de que a
      superfície dobrou. Não reabrir nesta story.
    status: INHERITED

status_da_story: |
  Mantida em `InReview`. NÃO promovi para `Done`, e o motivo é factual:
  `story-lifecycle.md` atribui a transição para `Done` ao **@devops após o push**
  ("Done | @qa PASS, @devops pushes | @devops"), e neste momento nada foi
  commitado, nada foi deployado e o **AC13 não foi validado** (T12/T13 abertas).

  É o mesmo tratamento da story-irmã: a 86-11 recebeu gate PASS na iteração 2
  com `Status: InReview`, e só foi para `Done` num commit posterior
  (`96c28996 docs(story): 86-11 para Done — T12/AC11 verificada com browser real`).

  Marcar `Done` agora afirmaria "está em produção" sobre uma landing que não
  existe em produção — a mesma classe de rótulo silenciosamente errado que esta
  revisão inteira se dedicou a prevenir. **O gate está PASS: não há nada pendente
  do lado do @dev.**

notas_para_devops: |
  1. **A implementação está toda NÃO COMMITADA.** O branch `docs/86-12-story-draft`
     tem 3 commits, todos de @sm/@po (docs). Os 9 arquivos novos de
     `landing-pages/yarden/`, os 7 modificados em `packages/web` +
     `trifold-design-system/vercel.json` e o `.ai/decision-log-86-12.md` estão no
     working tree. Commitar antes do push.
  2. **`branch.docs/86-12-story-draft.remote/merge` está configurado no
     `.git/config`, mas o branch NÃO existe no remoto** (`git ls-remote` vazio).
     Inofensivo, mas explica o `[gone]` do `git status -sb` — não é sinal de push.
  3. **Ordem de deploy é carga viva** (sem ela o Pixel fica bloqueado mesmo com a
     landing no ar): (1) `packages/web` → (2) projeto Vercel `yarden` →
     (3) `landing-pages/trifold-design-system` (CSP).
  4. **T12** — criar o projeto `yarden`; replicar `LANDING_PAGE_WEBHOOK_SECRET`
     (mesmo valor do `vind-residence`) via `scripts/vercel-env-set.sh` ou REST API.
     **Nunca `vercel env add` via pipe/stdin** — grava valor vazio em silêncio
     (2 incidentes anteriores). Se o nome `yarden` estiver indisponível no scope,
     **escalar ao stakeholder**: o literal aparece em `ALLOWED_ORIGINS` (2
     arquivos), nos `rewrites`/`connect-src` da CSP e nos 2 endpoints do
     `index.html`.
  5. **T13 / AC13** — a não-regressão do Vind Residence EM PRODUÇÃO
     (`content_category: "landing_vind_residence"` + `metadata.landing_page:
     "vind-residence"`) é obrigatória no mesmo passo. Os testes unitários provam a
     função `resolveLandingConfig`, não o deploy. Filtrar por
     `content_category: "landing_yarden"` no Test Events — o dataset
     `1337310707164669` é compartilhado com a outra landing.
  6. Rebase do `trifold-design-system/vercel.json`: o arquivo já é tracked (PR
     #501/#505). Conferir que as adições do Yarden não se perdem numa resolução
     de conflito — o catch-all `/((?!vindresidence|yarden).*)` é a linha que mais
     importa e a mais fácil de perder.

