# ═══════════════════════════════════════════════════════════════════════════
# DELTA — rodada 5 (a porta de entrada). Revisada em 2026-09-01 por Quinn.
# Não é gate novo: é a seção de delta do gate CONCERNS já emitido em 2026-08-31.
# ═══════════════════════════════════════════════════════════════════════════
delta_rodada_5:
  escopo: >-
    Só o defeito da porta de entrada, consertado dentro desta story em dois commits:
    `170f005b` (login + `atalhoDoConsole()` + `sidebar-nav` + `dashboard/layout`) e
    `ccc10c68` (`app/page.tsx`, a segunda porta). As ACs originais (AC1–AC9) não foram
    re-revisadas — o gate da rodada 1 continua valendo para elas.
  gate_do_delta: CONCERNS
  defeitos_vivos: 0

  # ─────────────────────────────────────────────────────────────────────────
  decisao_de_escopo_AUTO_DECISAO:
    pergunta: "confirmar ou realocar o `[AUTO-DECISÃO]` do Dev Agent Record"
    veredicto: "**CONFIRMO o enquadramento. O que não está confirmado é o REGISTRO — ele contradiz o código.**"
    porque_confirmo: >-
      A matéria da `900-56` é a NAVEGAÇÃO do console (AC1/AC2 são a barra de itens), e a porta de
      entrada é a metade da navegação que fica do lado de fora. A `900-57` é a casca da empresa e a
      `900-58` é a lista; nenhuma tem jurisdição sobre "como se chega ao console". Abrir uma
      `900-62` produziria uma story cuja única AC seria "a AC1 da 900-56 vale também na direção de
      entrada" — e o registro dela apontaria de volta para cá. O raciocínio do @dev está certo.
    o_que_esta_errado_e_precisa_de_conserto: >-
      O conserto foi PARTIDO em dois commits, e o registro seguiu caminhos diferentes:
      `170f005b [Story 900-56]` está registrado aqui (File List da rodada 5, 7 arquivos);
      **`ccc10c68` também está etiquetado `[Story 900-56]`, mas `app/page.tsx` e `app/page.test.ts`
      só aparecem na File List da `900-60`**, como "carona fora do escopo". As duas coisas não
      podem ser verdade ao mesmo tempo. Ver QA-900-56-D1.

  # ─────────────────────────────────────────────────────────────────────────
  os_dois_sentidos_reproduzidos:
    metodo: >-
      Snapshot por CÓPIA (`cp`), sha256 dos dois lados, restauro conferido por `git diff` vazio.
      Nenhum `git stash` (9 stashes de outras sessões). `tsc --noEmit` rc=0 medido ANTES de contar
      cada vermelho.
    metade_A_login_e_raiz:
      baseline: "`app/page.test.ts` 9 passed · `app/page.tsx` sha256 `bf7d4969…` (o mesmo declarado)"
      A1_some_o_ramo: "rc=0 · **2 mortos** — só a METADE 1"
      A2_if_true: "rc=0 · **5 mortos** — só a METADE 2 (o mutante que o pedido exigia)"
      A3_inverte: "rc=0 · **7 mortos** — a UNIÃO exata de A1 e A2"
      veredicto: >-
        **Disjuntos, e de tamanhos diferentes.** Interseção A1∩A2 = ∅. A régua distingue
        "protegi" de "abri para todos", e "escondi de todo mundo" (A1) é o estado de antes.
    metade_B_o_atalho:
      MB1_literal_no_client: >-
        rc=0 · **3 mortos**, todos da METADE 2 — inclusive `a rota não está no TEXTO-FONTE do
        componente`. A METADE 1 fica verde. É o carrasco específico do VAZAMENTO, não do pixel.
      MC1b_isPlatformAdmin_true_sempre: "rc=0 · **5 mortos**"
      MB3_layout_incondicional: "rc=0 · **2 mortos**"
      MB4_layout_nao_passa: "rc=0 · **2 mortos** — o MESMO conjunto do MB3"

  # ─────────────────────────────────────────────────────────────────────────
  vazamento_do_endereco:
    pergunta: "`/platform` aparece no HTML/bundle servido a conta de empresa?"
    resposta: "**NÃO — e eu medi no bundle, não só no HTML.**"
    ao_vivo:
      plataforma_em_/dashboard: "2 marcadores `[data-atalho-console]` no DOM · `href=\"/platform\"` presente"
      empresa_a_em_/dashboard: >-
        **0** marcadores `[data-atalho-console]` · a string `/platform` **não aparece em lugar
        nenhum** do HTML servido (busca pela substring crua, não só por `href=`) · "Painel da
        plataforma" ausente
    no_bundle:
      metodo: >-
        Baixei os **23** `script[src]` que a página `/dashboard` da conta de EMPRESA carrega e
        procurei, em cada um, o marcador `data-atalho-console` (que é do `sidebar-nav.tsx`
        compilado) e a rota.
      resultado: >-
        **1** chunk contém `data-atalho-console` (`packages_web_src_0gweq~t._.js`) e ele
        **não contém `/platform`**. É a diferença exata entre esconder o pixel e não vazar o
        endereço — e é o que o desenho `{href,label}` em `server-only` compra.
    corroborado_por_mutacao: "MB1 acima — devolver o literal ao componente client reprova em 3 pontos"

  # ─────────────────────────────────────────────────────────────────────────
  julgamento_da_regua_de_FORMA:
    pergunta: "a régua estática do `app/dashboard/layout.tsx` basta?"
    o_que_o_dev_declarou: "MB3 e MB4 produzem o mesmo conjunto de morte — é gate, não carrasco de dois lados"
    o_que_eu_medi: "**Confirmado, e o limite é MAIOR do que o declarado.**"
    reproducao: "MB3 e MB4 matam os MESMOS 2 testes (`o layout passa o atalho calculado…` e `a ligação aparece UMA vez…`)"
    sonda_de_vizinho: >-
      Testei a forma que este repositório já viu driblar régua de fonte: escrevi a expressão
      exata dentro de um `{/* … */}` no call site, com a prop real removida. **VERMELHO (2)** —
      `codigoDe` não é satisfeito pelo comentário JSX. Essa porta está fechada.
    o_residuo_que_eu_achei_e_ele_nao_declarou:
      mutante: >-
        `import { atalhoDoConsole, isPlatformAdmin as _real } from "@web/lib/platform"` +
        `async function isPlatformAdmin(_id: string) { void _real; return true }` no próprio
        layout. O **texto do call site fica idêntico**, o import `from "@web/lib/platform"`
        continua lá, e o atalho passa a ser calculado por uma função local que responde `true`.
      efeito: >-
        O item "Painel da plataforma" e o `href=\"/platform\"` passam a aparecer no HTML de
        **todo** usuário logado do CRM. É exatamente o defeito que a régua diz impedir.
      medicao: "`tsc --noEmit` **rc=0** · suíte INTEIRA **308 arquivos / 4187 passed / 6 expected fail / rc=0** — **verde**"
      veredicto: >-
        A régua não é cega só entre "duas formas erradas" (MB3 × MB4): ela é cega a **qualquer
        mutante que preserve o texto**, e rebind de identificador preserva o texto. O limite
        declarado subestima o próprio limite.
    basta?: >-
      **Basta como gate, e eu não bloqueio por isso — mas o registro precisa dizer a verdade
      maior.** As duas pontas de COMPORTAMENTO têm carrasco de dois lados e disjunto
      (`atalhoDoConsole` em `lib/platform.test.ts`; `isPlatformAdmin` com 5 mortos em MC1b; o
      render em `sidebar-nav.test.ts` com 3 mortos em MB1). O elo que sobra — "o layout passa
      ESTA expressão" — é forma, e a prova de verdade dele é a tela, que eu refiz com as duas
      contas. Um `.tsx` server component `async` não é renderizável em node **e** o repositório
      não tem jsdom: fechar esse elo por teste hoje exigiria dependência nova, que é preço alto
      para um elo de uma linha. Ver QA-900-56-D2.

  # ─────────────────────────────────────────────────────────────────────────
  prova_na_tela_refeita_por_mim:
