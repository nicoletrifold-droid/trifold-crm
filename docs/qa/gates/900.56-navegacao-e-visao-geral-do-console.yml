      titulo: "O limite declarado da régua de FORMA é menor do que o limite real"
      o_que: >-
        O Dev Agent Record diz que MB3 e MB4 produzem o mesmo conjunto de morte. Verdade — e
        insuficiente: **qualquer** mutante que preserve o texto do call site sobrevive, inclusive
        o rebind de `isPlatformAdmin` por um local homônimo, que passa `tsc` e deixa a suíte
        inteira verde enquanto vaza o console para todo usuário logado (medido nesta rodada).
      conserto_sugerido: >-
        Não peço teste novo. Peço que o item 3 de "O que continua aberto" seja reescrito para
        nomear a classe certa — *"a régua afirma a FORMA do call site; ela é cega a qualquer
        mutante que preserve o texto, inclusive rebind de identificador"* — para que a próxima
        pessoa não confunda "gate de forma" com "carrasco". Se alguém quiser fechar de verdade,
