  concerns_do_delta:
    - id: QA-900-56-D1
      severidade: media
      titulo: "O registro desta story afirma o contrário do que o código faz, desde `ccc10c68`"
      onde: "`docs/stories/900-56-navegacao-e-visao-geral-do-console.story.md`"
      o_que_esta_errado:
        - >-
          **"O que continua aberto", item 1** diz: *"`app/page.tsx` é uma SEGUNDA porta da frente
          e continua roteando só por `role`… Não foi consertado"*. **É falso desde `ccc10c68`**,
          que é um commit `[Story 900-56]`. Eu medi o arquivo vivo: ele lê
          `is_platform_admin` na mesma projeção e redireciona para `/platform` antes de olhar o
          `role`. O texto foi escrito em `098bf4de` e o conserto veio logo depois, sem voltar aqui.
        - >-
          **A File List da rodada 5 não lista `app/page.tsx` nem `app/page.test.ts`.** Eles estão
          na File List da `900-60`, marcados como "carona fora do escopo", enquanto o commit que
          os traz é `[Story 900-56]`. Quem for reconstituir o que esta story entregou não acha os
          dois arquivos que fecham o defeito que ela nomeia.
      porque_importa: >-
        É a classe "delta de rodada deixa a raiz mentindo": a rodada seguinte conserta e a raiz
        continua declarando o furo aberto. O próximo leitor abre uma story para consertar algo já
        consertado, ou confia num "continua aberto" que não está.
      conserto_sugerido: >-
        Na `900-56`: fechar o item 1 de "O que continua aberto" (dizendo em que commit foi
        fechado) e acrescentar `packages/web/src/app/page.tsx` + `packages/web/src/app/page.test.ts`
        à File List da rodada 5. Na `900-60`: manter a menção como contexto, retirando os dois da
