# 2. MUTAÇÕES — cada vermelho precedido de `tsc --noEmit` rc=0
# ═══════════════════════════════════════════════════════════════════════════
mutacoes:
  protocolo: >-
    Harness fora da árvore: guarda os bytes, aplica, aborta se a mutação sair INERTE (arquivo
    idêntico), roda `tsc --noEmit` em `packages/web`, roda o alvo do vitest, restaura e confere
    `sha256` antes/depois. Todas as 12 restaurações conferiram.
  sobre_console_visao_geral_ts:
    - id: q5
      mutacao: "`saturada` medida sobre o VALOR filtrado (`pagina.filter(p).length >= TETO`) em vez da página"
      tsc: "rc=0"
      resultado: "1 VERMELHO — `saturação é propriedade da PÁGINA, não do valor filtrado`"
    - id: q6
      mutacao: "`diasDesdeOConvite` sempre usa `orgCriadaEm` (some a fonte `users.created_at`)"
      tsc: "rc=0"
      resultado: "2 VERMELHOS, em describes diferentes (o cálculo e a lista de pendências)"
    - id: q7
      mutacao: "`paginaSaturada`: `>=` vira `>`"
      tsc: "rc=0"
      resultado: "2 VERMELHOS — o caso EXATAMENTE no teto e o de página × valor"
    - id: q10
      mutacao: "`normalizarPeriodo` vira passthrough de qualquer número finito (mata a allowlist positiva)"
      tsc: "rc=0"
      resultado: "1 VERMELHO — `?dias=99999` deixaria de cair no padrão"
    - id: q12
      mutacao: "`rotuloDoProvider` indexa `DEFINICOES_DE_PROVIDER` sem `ehProviderDoPainel` (o caso `google`)"
      tsc: "rc=**2** na forma ingênua (TS2532 por `noUncheckedIndexedAccess`) — mutação REMODELADA"
      resultado: "com `!` para compilar: `tsc` rc=0 e 1 VERMELHO"
      licao: >-
        Mutação por remoção de guarda **não compila** nesta base — o narrowing do TS é uma
        segunda rede. Vale registrar: contar esse vermelho sem olhar o `tsc` teria creditado ao
        teste um mérito que é do compilador.
  sobre_platform_query_scan:
    - id: q13
      mutacao: "`createAdminClient().from(\"leads\").select(...)` cru dentro de `orgs/[id]/page.tsx`"
      tsc: "rc=0"
      resultado: "1 VERMELHO — a varredura de `app/platform/**` está VIVA contra os arquivos novos"

