# ═══════════════════════════════════════════════════════════════════════════
nenhum_numero_inventado:
  metodo: >-
    Varri toda a árvore de `app/platform/**` por `R$`, `MRR`, `receita`, `margem`,
    `faturamento`, `mensalidade` e por todo dígito que chega ao JSX renderizado.
  resultado_moeda_e_receita: >-
    **Zero ocorrências fora de comentário.** As 6 aparições de "R$ 0,00" / "MRR" estão todas em
    docblocks explicando por que o card NÃO existe. Faixa 2 (Receita) e faixa 3 (Margem) não
    renderizam — nem título, nem placeholder (AC7 ✔).
  numeros_da_visao_geral:
    - { numero: "Empresas ativas", fonte: "organizations.is_active", declara_saturacao: true }
    - { numero: "N inativa(s)", fonte: "organizations.is_active=false", declara_saturacao: true }
    - { numero: "Novas no período", fonte: "organizations.created_at ≥ corte", declara_saturacao: true }
    - { numero: "Convites pendentes", fonte: "deriveAdminInviteStatus sobre orgs × users", declara_saturacao: "true (HERDADA das duas páginas)" }
    - { numero: "Integrações com erro", fonte: "org_integrations.status='error'", declara_saturacao: true }
    - { numero: "convite pendente há N dias", fonte: "users.created_at, senão organizations.created_at — duas fontes, nenhuma terceira", declara_saturacao: "n/a" }
    - { numero: "criada DD/MM/AAAA", fonte: "organizations.created_at", declara_saturacao: "n/a" }
    - { numero: "N integrações conectadas", fonte: "montarTilesDoPainel", declara_saturacao: "**FALSE — ver QA-900-56-2**" }
  literal_zero_encontrado: >-
    Um só, em `uso/page.tsx`: `<code>0</code>` dentro da frase "Exibir `0` aqui afirmaria que a
    empresa não teve atividade nenhuma". É a explicação da regra, não uma medida.
  veredito: >-
    A regra vale para 7 dos 8 números da Visão geral. O oitavo e o caminho de erro estão nas
    concerns abaixo.

# ═══════════════════════════════════════════════════════════════════════════
# 5. CONCERNS
# ═══════════════════════════════════════════════════════════════════════════
concerns:
  - id: QA-900-56-1
    severidade: media
    bloqueante: false
    titulo: "Erro de consulta descartado vira `0` com cara de medida — e vira o convite de partida"
    achado: >-
      As 4 leituras de `app/platform/page.tsx` destroem o campo `error`
      (`const { data: X } = await platformQuery(...)`). Numa falha de leitura — timeout, chave
      trocada, `PGRST` qualquer — `data` vem `null`, os `?? []` transformam isso em página vazia,
      e a tela afirma **"Empresas ativas: 0"**, **"Convites pendentes: 0"**, **"Integrações com
      erro: 0"** e renderiza o vazio DE PARTIDA: *"Nenhuma empresa ainda. **Criar a primeira**"*.
      Um operador lendo isso conclui que o sistema está vazio. É a mesma classe que a AC9
      conserta — "o sistema não sabe" apresentado como se soubesse — por uma porta que a AC9 não
      enumera, porque a AC9 só fala de SATURAÇÃO.
    nao_e_regressao: >-
      O padrão é pré-existente: `orgs/page.tsx` (3 consultas), `orgs/[id]/layout.tsx`,
      `orgs/[id]/page.tsx` e `orgs/[id]/trilha/page.tsx` também descartam `error`. Nas telas de
      LISTA o efeito é uma lista vazia; aqui é a primeira vez que vira **número de manchete**.
      Nas cascas da `900-57` o descarte é fail-closed (`notFound()`), o que é o estado seguro.
    o_que_mudar: >-
      Ler `error` nas 4 consultas e, quando houver, tratar como a AC9 já trata saturação: o card
      para de afirmar um número. Reaproveitar a forma que já existe — trocar `ContagemDeclarada`
      por um terceiro estado (`{ valor, saturada, indisponivel }`) e fazer `formatarContagem`
      devolver `—`. Custo: o tipo, a função e as 4 destruturações. **E um teste por mutação:
      `formatarContagem({indisponivel:true})` tem que ser `—`, não `0`.** O vazio de partida
      (`orgs.length === 0`) só pode renderizar quando a consulta de `organizations` SUCEDEU.
  - id: QA-900-56-2
    severidade: media
    bloqueante: false
    titulo: "O único número sem declaração de saturação é justo o da tabela que satura primeiro"
    achado: >-
      `conectadas` (seção "Entraram recentemente") é um `number` cru, fora do mecanismo
      `ContagemDeclarada`. A AC9 enumera "os 4 cards da AC4 e as duas listas da AC5" — a lista da
      AC6 ficou de fora da letra, e o @dev implementou fiel. Mas a aritmética do teto aponta
      exatamente para lá: `organizations` precisa de 1.000 empresas para saturar; `whatsapp_config`
      idem; **`org_integrations` satura com ~200 empresas** (5 linhas por empresa — medido: 6
      linhas para 1 empresa em produção, 18 para 3 no teste). Pior: essa consulta **não tem
      `order by`**, então as 1.000 linhas que chegam são as que o Postgres devolver — e as
      empresas mais NOVAS, que são exatamente as que esta seção mostra, são as menos prováveis de
      estar entre elas. O resultado seria "0 integrações conectadas" nas 5 empresas em destaque,
      sem uma palavra de aviso.
    o_que_mudar: >-
      Herdar a saturação: `paginaSaturada(integracoes) || paginaSaturada(linhasWhatsApp)` e, quando
      verdadeira, a linha diz `≥ N` (ou some o número) — a função `formatarContagem` já faz isso.
      Duas linhas. Alternativa mais barata e mais correta: pedir `.order("org_id")` na consulta de
      `org_integrations`, para o corte ao menos ser determinístico.
  - id: QA-900-56-3
    severidade: baixa
    bloqueante: false
    titulo: "O predicado do período decide um NÚMERO e mora no `page.tsx` — contra a regra do próprio módulo"
    achado: >-
      `console-visao-geral.ts` abre declarando: *"Tudo que decide um NÚMERO ou uma LISTA está
      neste arquivo, e o `page.tsx` só busca linhas e desenha"*. O predicado
      `(o) => new Date(o.created_at) >= corteDoPeriodo` decide o card "Novas no período" e está
      inline no `page.tsx`. `normalizarPeriodo` e `inicioDoPeriodo` têm carrasco (matei a mutação
      da allowlist), mas a COMPARAÇÃO — parse de `created_at`, fuso, borda `>=` — não tem
      nenhum. E é justamente o item que o @dev declara não ter conseguido discriminar na tela
      (as 3 empresas do teste nasceram há ≤ 2 dias, então 7/30/90 devolvem as mesmas 3).
    o_que_mudar: >-
      Extrair `ehNovaNoPeriodo(org, corte)` (ou `contarNovasNoPeriodo`) para
      `console-visao-geral.ts` e cobrir a borda: uma org criada exatamente no corte, uma um
      milissegundo antes, uma depois. Mata o `>=`→`>` e o parse.
  - id: QA-900-56-4
    severidade: baixa
    bloqueante: false
    titulo: "Uma terceira tradução de `status`, na mesma leva que criou a segunda para eliminar a divergência"
    achado: >-
      A `900-57` moveu `status → rótulo + tom` para `providers.ts` com o argumento de que *"duas
      traduções do mesmo `status` são o começo de duas telas do console discordando sobre o mesmo
      fato — que é literalmente a QA-900-51-2"*. E a Visão geral traduz por conta própria:
      `t.status === "connected" || t.status === "active"`. Hoje coincide com
      `rotuloDeStatusDoTile(...).tom === "ok"`. No dia em que um sexto valor de `status` entrar
      no mapa como `ok`, o Resumo e o painel o mostram verde e a Visão geral não o conta.
    o_que_mudar: >-
      `tiles.filter((t) => rotuloDeStatusDoTile(t.status).tom === "ok").length`. Uma linha, e
      importa a função que a story irmã acabou de criar exatamente para isto.

# ═══════════════════════════════════════════════════════════════════════════
# 6. OBSERVAÇÕES (não exigem ação)
# ═══════════════════════════════════════════════════════════════════════════
observacoes:
  - id: OBS-1
    titulo: "O ramo JSX da saturação não é exercitado por nada"
    detalhe: >-
      `contagem.saturada && <p>…teto de 1000 linhas…</p>` e `<AvisoDeTeto />` são os únicos
      pontos onde a AC9 vira pixel, e nenhum teste os toca — o carrasco cobre a FUNÇÃO
      (`formatarContagem`), não o ramo. É consistente com o resto do repositório (sem harness de
      render para RSC) e o risco é baixo, porque o ramo é uma leitura direta do booleano já
      testado. Registro porque é o único lugar onde "a regra existe" e "a regra aparece" ainda
      não se encontram.
  - id: OBS-2
    titulo: "Os 5 itens declarados como não provados na tela — meu julgamento"
    detalhe: >-
      (1) forma `≥ N`: **basta** — os dois casos da AC estão cobertos e eu matei as duas mutações
      que os atacam por lados opostos (q5 e q7), com conjuntos de morte parcialmente disjuntos.
      (2) vazio de partida: **é o item mais fraco**, e não por si — porque é o MESMO ramo onde um
      erro de consulta aterrissa (QA-900-56-1). Consertada a concern 1, ele deixa de ser
      ambíguo. (3) classe "convite pendente": **basta** — 4 testes, e a mutação q6 mata em dois
      describes. (4) trilha com conteúdo: ver o gate da `900-57` (QA-900-57-3); a justificativa
      de não sujar uma tabela append-only está **correta** e eu a confirmei — `platform_audit_log`
      tem **0 linhas em produção E no teste**. (5) discriminação de período: **não basta** →
      QA-900-56-3.
  - id: OBS-3
    titulo: "A saturação HERDADA está feita direito"
    detalhe: >-
      `convitesPendentes.saturada = paginaSaturada(orgs) || paginaSaturada(linhasDeAdmin)` — o
      card que cruza duas páginas herda de ambas, e há teste para isso. E `orgs` vem
      `created_at DESC`, então o corte de 1.000 come as empresas ANTIGAS e nunca as 5 que a seção
      "Entraram recentemente" mostra. As duas decisões estão certas e são o contraste que torna
      a QA-900-56-2 visível.

