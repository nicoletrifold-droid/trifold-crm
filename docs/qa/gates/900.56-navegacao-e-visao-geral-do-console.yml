# 1. A DISCREPÂNCIA DE BASELINE — resolvida ANTES de medir delta
# ═══════════════════════════════════════════════════════════════════════════
baseline:
  qual_usei: >-
    A árvore de trabalho real, **não** o número do CI da `main`. A árvore carrega 6 arquivos
    modificados e não commitados da `900-55` (PR parado): `webhook/whatsapp/route.ts` + teste,
    `lib/meta/process-lead.ts` + teste, `lib/tenancy/webhook-org.ts` + teste. Conferi que são
    exatamente esses 6 e mais nada (`git status --short -- packages/`, `git ls-files --others`
    vazio) — o @dev não os tocou nem commitou.
  medicoes:
    depois_arvore_real: "299 arquivos / 3966 passed / 6 xfail (3972 total) / rc=0"
    os_2_arquivos_da_story_sozinhos: "2 arquivos / 32 testes (`console-visao-geral.test.ts` + `console-paleta.test.ts`)"
    baseline_derivada: "297 arquivos / 3934 passed / 6 xfail (3940 total)"
    delta: "+2 arquivos, +32 testes, xfail INALTERADO em 6 — bate com o declarado"
  onde_o_numero_do_dev_estava_impreciso: >-
    Ele reportou "297 / 3.934 / 6" para a árvore de trabalho. Os **297 arquivos** são do
    BASELINE, não da árvore (a árvore tem 299 — os 2 dele entram). E **3.934** é a contagem de
    `passed`, não o total: o total do baseline é 3.940 (3.934 + 6 xfail). Os dois números estão
    certos; os rótulos, não. Nenhuma conclusão muda.
  atribuicao_dos_32_do_ci: >-
    `3.902` (CI da `main`) `+ 32` = `3.934` fecha aritmeticamente. Corroborei sem arriscar a
    árvore: os 3 arquivos de teste da `900-55` ganharam **+11 blocos `it(` estáticos** contra o
    `HEAD` (39→44, 22→25, 48→51) e **3 `it.each` novos** onde o `HEAD` não tinha nenhum — 11
    blocos parametrizados expandindo para 32 casos é consistente. **Não fechei o último dígito
    de propósito** — ver `perigo_encontrado` abaixo.
  perigo_encontrado: >-
    ⚠️ Tentei medir o baseline com `git stash push -- <6 arquivos>`. O `push` FALHOU por citação
    do pathspec (nada foi guardado), mas o `git stash pop` que veio depois foi aplicar
    **`stash@{0}`, que é de OUTRA sessão** ("WIP stories 87-11/88-2/88-15 + agent-memory"). Ele
    abortou sozinho por conflito com as memórias modificadas, e conferi que a árvore ficou
    idêntica. Há **9 entradas de stash** neste repositório, todas de outras frentes: `git stash
    pop` sem ref explícita é uma arma apontada para o trabalho alheio. Não repeti.

