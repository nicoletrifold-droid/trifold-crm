# 3. AS DUAS DECISÕES CONTRA A LETRA DA AC — julgadas
# ═══════════════════════════════════════════════════════════════════════════
decisoes_contra_a_letra:
  - decisao: '"Trilha" nasce desabilitada (`<span>`), não como `<Link>` — contra a AC2'
    veredito: CERTO
    fundamento: >-
      Conferi: `packages/web/src/app/platform/trilha/page.tsx` **não existe**, e o `build`
      registra `/platform`, `/platform/orgs`, `/platform/orgs/[id]` e as 5 abas — e **nenhuma**
      `/platform/trilha`. A AC2 é internamente contraditória: afirma "rotas reais" sobre uma rota
      que não existe, e o MOTIVO escrito nela mesma é "em vez de linkar para uma rota que dá
      404". Obedecer à letra produziria exatamente o defeito que o motivo proíbe. Quando letra e
      motivo brigam **e o motivo é verificável**, vale o motivo.
    nit: >-
      O comentário do `layout.tsx` diz que "a story que a cria (`900-59`) ainda não foi escrita".
      Na árvore ela EXISTE — `docs/stories/900-59-trilha-de-plataforma.story.md`, **Status:
      Ready** (não commitada, então a frase é verdadeira na história committada e falsa na árvore
      de quem lê hoje). Uma linha para corrigir; registrado porque comentário que afirma estado
      do repositório envelhece exatamente assim.
  - decisao: '"Integrações conectadas" passa por `montarTilesDoPainel()` — além da letra da AC6'
    veredito: CERTO, e **não é hipotético**
    fundamento: >-
      Reproduzi a aritmética de forma determinística (3 asserções num harness fora da árvore):
      com a linha `whatsapp` de `org_integrations` em `disconnected` — que é o único estado
      possível, pelo CHECK `whatsapp_sem_identificador_proprio` da migration 247 — e
      `whatsapp_config` em `active` com `phone_number_id`, a montagem compartilhada devolve
      **2** e a contagem literal devolveria **1**. E fui além do exemplo do @dev: medi
      **PRODUÇÃO** por agregado (Management API, só leitura) — `org_integrations` tem **6 linhas,
      6 `disconnected`**, e `whatsapp_config` tem **1 `active` com `phone_number_id` não nulo**.
      Ou seja, **hoje, em produção**, a contagem literal diria "0 integrações conectadas" sobre
      uma empresa cujo canal está no ar. A QA-900-51-2 não seria "reintroduzida em tese": ela
      nasceria acesa na primeira renderização.
    contraprova: >-
      `status='active'` SEM `phone_number_id` **não** conta (a derivação exige os dois), e com
      `whatsapp_config` inativo as duas contagens concordam em 1 — a divergência é do fato, não
      um viés constante da montagem.

