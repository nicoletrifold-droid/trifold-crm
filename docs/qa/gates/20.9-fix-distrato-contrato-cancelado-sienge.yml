top_issues:
  - id: 'DATA-001'
    severity: medium
    category: reliability
    ac: 'AC 7'
    finding: >-
      O filtro de distrato em notifyClientes() bloqueia um portal user APENAS se
      users.sienge_customer_id estiver populado E coincidir com um cliente
      distratado. A ponte CRM→portal é exclusivamente sienge_customer_id (não há
      FK direta). Se algum dos 39 distratados existentes tiver
      users.sienge_customer_id = NULL, ele CONTINUARÁ recebendo notificações — o
      exato bug de privacidade que a story corrige (falso-negativo).
    suggested_action: >-
      Tornar a Task 6 (smoke pós-deploy) BLOQUEANTE para o deploy: após
      reconcile-distratos, asseverar que cada vínculo com distrato=true tem o
      clientes.sienge_customer_id espelhado no users.sienge_customer_id do portal
      user correspondente, e confirmar via teste real que esses clientes NÃO
      recebem. Considerar ponte de fallback (email/CPF) em iteração futura para
      robustez.
  - id: 'PERF-001'
    severity: low
    category: performance
    ac: 'AC 1 / AC 7'
    finding: >-
      A migration 109 cria idx_cov_distrato WHERE distrato = FALSE (desenhado
      para uma query de vínculos ATIVOS), mas notifyClientes() implementado
      consulta clientes_obras_vinculos WHERE obra_id AND distrato = true (seleção
      dos distratados). O índice parcial sobre distrato=FALSE não serve à query
      distrato=true. Intenção divergiu entre @data-engineer e @dev.
    suggested_action: >-
      Index sobre (obra_id) WHERE distrato = TRUE, ou índice composto
      (obra_id, distrato). Tabela pequena → impacto desprezível; não bloqueia.
  - id: 'MNT-001'
    severity: low
    category: maintainability
    ac: 'AC 8'
    finding: >-
      reconcileDistratosForObra() carrega a obra só por id, sem filtro org_id; a
      isolação de tenant é garantida apenas pela rota chamadora (que checa
      org_id). Função exportada → risco latente de cross-tenant se reusada fora
      da rota.
    suggested_action: >-
      Adicionar parâmetro org_id (ou documentar explicitamente o contrato de que
      a validação de tenant é responsabilidade do chamador).
  - id: 'DOC-001'
    severity: low
    category: docs
    ac: 'AC 7'
    finding: >-
      Comentário da migration 109 afirma que notifyClientes() filtra
      `distrato IS NOT TRUE`, mas a implementação consulta `distrato = true`
      (constrói conjunto de exclusão). Drift de documentação, ligado a PERF-001.
    suggested_action: 'Alinhar comentário da migration com a query real.'

acknowledged_debts:
  - id: 'INFO-janela-transitoria'
    note: >-
      Durante sync multi-contrato, o vínculo fica momentaneamente distrato=true
      entre processar o 1º contrato (Cancelado) e o 2º (Emitido). Estado FINAL
      correto. Só relevante se notificação disparar no meio de um sync —
      improvável. Já reconhecido por @dev e @po.
  - id: 'INFO-reconcile-orfao'
    note: >-
      Contrato presente no vínculo mas ausente do Sienge atual é omitido do mapa
      reconstruído (não inferimos situação). Se TODOS sumirem → {} → distrato=false
      (conservador, não bloqueia indevidamente). Validar no smoke pós-deploy.

