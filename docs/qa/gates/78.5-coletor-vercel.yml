  - ac: 'AC2 — Parsing JSONL correto'
    evidence: 'parseJsonl(): response.text() + split(\n) + filter(trim>0) + JSON.parse por linha em try/catch individual; linha malformada logada (vercel_jsonl_parse_error) e descartada. Nunca response.json() no corpo.'
    status: PASS
  - ac: 'AC3 — Requisição com params e auth exatos'
    evidence: 'Authorization: Bearer ${token}; URLSearchParams({teamId, from, to}) em ISO 8601 UTC. Nomes from/to/teamId confirmados na OpenAPI oficial (Completion Notes T1.4).'
    status: PASS
  - ac: 'AC4 — Mapeamento FOCUS -> CostSnapshotRow agregado por dia'
    evidence: 'aggregateDailyCost(): soma BilledCost de todas as linhas do mesmo ChargePeriodStart-dia em UMA CostSnapshotRow metric=cost_usd/currency=USD; moeda !=USD e BilledCost não-finito descartados defensivamente.'
    status: PASS
  - ac: 'AC5 — Janela <=1 ano validada antes da chamada'
    evidence: 'assertVercelWindow() lança VercelWindowTooLargeError se >366 dias; route.ts captura ANTES de runCollector -> 400 {error:"Window exceeds 1 year limit"}. Coletor revalida internamente como rede de segurança.'
    status: PASS
  - ac: 'AC6 — Custo diário idempotente por serviço'
    evidence: 'Upsert via runCollector com onConflict:service_id,snapshot_date,metric (78-3 inalterado). Verificação em runtime pendente (T7.4) até secrets em ambiente.'
    status: PASS (e2e deferred)
  - ac: 'AC7 — Cron autenticado + degradação graciosa'
    evidence: 'CRON_SECRET ausente -> 503; header incorreto -> 401; VERCEL_BILLING_TOKEN/VERCEL_TEAM_ID ausente -> 503 com env específica, ANTES de createAdminClient/runCollector (sem gravar snapshot).'
    status: PASS
  - ac: 'AC8 — Falha da API isolada não derruba o cron'
    evidence: 'collect() propaga erro; runCollector isola (try/catch), grava collection_status=error e route retorna 200 {ok:false,...}. Nunca 500 por falha isolada.'
    status: PASS
  - ac: 'AC9 — Backfill manual dentro do limite'
    evidence: 'route.ts lê ?from/?to opcionais (regex YYYY-MM-DD + from<=to); default = ontem em America/Sao_Paulo (saoPauloYesterday via Intl en-CA).'
    status: PASS
  - ac: 'AC10 — vercel.json sem colisão'
    evidence: 'Entry "20 10 * * *" p/ /api/cron/billing-collect-vercel; grep confirma único cron nesse horário (anthropic 0 10, openai 15 10, daily-report 59 10).'
    status: PASS

