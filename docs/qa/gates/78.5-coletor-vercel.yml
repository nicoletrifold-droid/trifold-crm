  - ac: 'AC1 — Adapta contrato BillingCollector sem modificá-lo'
    evidence: 'vercel.ts importa BillingCollector/CollectWindow/CostSnapshotRow de ./types (sem redefinir); route.ts chama runCollector(admin, vercelCollector, window). types.ts/run-collector.ts NÃO aparecem em git status (inalterados desde 78-3).'
