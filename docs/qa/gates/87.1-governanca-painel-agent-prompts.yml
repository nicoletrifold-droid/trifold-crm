# CARIMBO DE ORDEM DE DEPLOY — condição bloqueante para o @devops
# ---------------------------------------------------------------------------
condicao_de_deploy:
  bloqueante: true
  regra: >-
    O snapshot reconciliado — packages/ai/src/prompts/_production/{guardrails,
    property-presentation,system-personality}.txt + manifest.json — TEM de ir no MESMO
    commit/PR do código da AC6 (agent-prompts-parity.ts, page.tsx, prompt-editor.tsx).
  por_que: >-
    Risco 5 da story. Se o selo subir sem os .txt reconciliados, ele nasce ⚠️ em 3 de 7
    slugs e a AC6 morre no dia 1 — é o mesmo padrão de "critério que nasce vermelho" que o
    @po pegou na 87-13. Medido nesta revisão: contra o manifest de HEAD dá exatamente 3
    divergentes; contra o manifest do working tree dá 0.
  como_conferir_depois_do_merge: 'npm run prompts:check → tem de sair 0 e imprimir os 7 slugs'
  migration: >-
    A 222 JÁ está aplicada em produção (conferida objeto a objeto). O arquivo sobe para
    versionar o que já está no ar, mesmo padrão da 218. Nada a fazer na Vercel: sem env
    nova, sem cron novo. ⚠️ RENUMERADA de 219 para 222 pelo @devops em 11/08, na revisão
    do PR: colisão superveniente — o 219 foi consumido pela `main` por
    `219_fvs_fundacao.sql` (Story 75-293, PR #392) depois que este gate foi escrito, e
    220/221 estão com a Story 87-13 (PR #393). Renumerar é COSMÉTICO e não toca o banco:
    produção versiona por timestamp, não pelo prefixo `NNN_`, que é convenção só do
    repositório. NÃO REAPLICAR — os objetos já estão em produção e não mudaram.

producao_intocada_por_esta_revisao:
  conferido: true
  detalhe: >-
    Os 7 updated_at e os 7 md5 de content lidos no início e no fim da revisão são idênticos.
    Nenhuma escrita minha em dsopqkqjkmhytudaaolv — só SELECT e introspecção de catálogo.
    Todo experimento correu em xnxvygyfyyyzwhiuoehz e foi desfeito (0 prompts, 0 versões,
    0 usuários, 0 orgs de sandbox ao final; função restaurada, md5 igual ao de produção).

