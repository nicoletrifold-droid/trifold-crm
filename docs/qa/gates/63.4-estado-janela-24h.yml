status_reason: >
  AC1-AC6 e AC8 atendidos por código; AC7 parcial (countdown ao vivo via
  setInterval explicitamente Out of Scope da Fase 1 — badge calcula no render).
  Helper puro getWindowStatus (thresholds 22h/24h; Telegram sem restrição; null =
  fechada) com 10 testes verdes. Badge no header (CheckCircle2/Clock/CircleOff),
  retorna null para Telegram. Composer desabilitado proativamente via
  disabledByWindow, combinado sem sobrescrever a const interna (isDisabled =
  disabled || disabledByWindow). Derivado de last_message_at já buscado (NFR-4 ok,
  sem query extra). CON-1/CON-4 respeitados. type-check/ESLint limpos; suíte
  414/414.
