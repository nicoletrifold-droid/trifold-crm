issues:
  - id: WIN-001
    severity: low
    category: requirements
    finding: >
      AC7 parcial: o badge calcula o countdown uma vez no render (sem
      setInterval), então o "fecha em Xh Ym" não decrementa ao vivo enquanto a
      tela fica aberta. Explicitamente colocado em Out of Scope para a Fase 1.
    suggested_action: >
      Não-bloqueante. Adicionar useEffect + setInterval(1min) na Story 63-9
      (que reusa o helper) se desejado.
    suggested_owner: dev
  - id: WIN-002
    severity: low
    category: reliability
    finding: >
      `windowClosed` é calculado no servidor (page.tsx:74) e o badge recalcula no
      cliente (window-status-badge.tsx:44) — dois pontos de cálculo com
      getWindowStatus usando `now` distintos (server render vs client). Diferença
      desprezível (≤ segundos/min) e dentro da tolerância GR-3. Herdado também: a
      janela é medida por last_message_at (bumpado por mensagens outbound, não só
      inbound do lead) — mesma REL-001 do gate 51.1.
    suggested_action: >
      Não-bloqueante. Para precisão futura, medir a janela pela última mensagem
      role='user' (inbound). Avaliar junto de 63-10/51-5.
    suggested_owner: dev

