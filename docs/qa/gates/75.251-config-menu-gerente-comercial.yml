    suggested_action: 'Nenhuma ação nesta story — a solução não abre o pai. Mas a herança é uma armadilha ARMADA para o próximo perfil e para todo sub-módulo novo. Candidato a story: exigir linha explícita para sub-módulo sensível, ou inverter o default de herança.'
