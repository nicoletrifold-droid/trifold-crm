  NotificationToggle (client) no topo de /broker/instalar: detecta suporte/permissão/
  inscrição e permite Ativar (Notification.requestPermission + pushManager.subscribe +
  POST /api/push/subscribe) e Desativar (DELETE + sub.unsubscribe). Estados tratados:
  on/off/denied (instrução p/ desbloquear no navegador)/unsupported (iOS instalar).
  Menu e título renomeados "App e Notificações". Reusa a API de push existente (POST/
  DELETE). Card automático (BrokerPushPrompt) inalterado. typecheck, lint e build limpos.
  Permissão depende do navegador → conferência manual do usuário.
