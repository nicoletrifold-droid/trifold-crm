# ═════════════════════════════════════════════════════════════════════════════
# 1. AS 6 CONCERNS — FECHADAS, COM O VERMELHO REPRODUZIDO POR MIM
# ═════════════════════════════════════════════════════════════════════════════
concerns_fechadas:
  QA-900-23-1:
    titulo: "Carrascos cegos ao `select` (era high)"
    status: FECHADA
    metodo: "Mesma mutação da rodada anterior — remover `org_id` da lista de colunas. Nada mais."
    medido: |
      | Linha                                | Rodada 1 | Rodada 2 (medido por mim) | @dev alegou |
      |--------------------------------------|----------|---------------------------|-------------|
      | `meta-capi-dispatch/route.ts:87`     | 🟢 17/17 | 🔴 **12 failed \| 5 passed** | 12 ✅ |
      | `meta-ads-intelligence/route.ts:224` | 🟢 7/7   | 🔴 **5 failed \| 2 passed**  | 5 ✅  |
      | `meta-ads-intelligence/route.ts:347` | 🟢 7/7   | 🔴 **1 failed \| 6 passed**  | 1 ✅  |
      | `email-queue/route.ts:43`            | 🟢 2/2   | 🔴 **2 failed (2)**          | 2 ✅  |
      | `roleta-retry/route.ts:48`           | 🟢 13/13 | 🔴 **1 failed \| 13 passed** | 1 ✅  |

      Os cinco conferem exatamente. O `roleta-retry` subiu de 13 para 14 testes: lá não bastava
      projetar, porque **não existia asserção nenhuma** sobre o `org_id` chegar ao consumidor — o
      carrasco novo afirma `distributeLeadToNextBroker("l1", "org-real")`. Esse é o caso mais
      instrutivo dos cinco: projetar a coluna só acende se alguém estiver olhando para ela.
    qualidade_do_conserto: >-
      O helper `projetar()` replica o PostgREST (filtra as chaves pedidas) e está comentado com a
      razão de existir. **Ressalva de forma:** está DUPLICADO em 4 arquivos de teste, idêntico
      byte a byte. Não bloqueia — mas a próxima cópia deveria ser um import.

  QA-900-23-2:
    titulo: "Dívida do `logEvent` fire-and-forget (era medium)"
    status: FECHADA
    medido: |
      `for-each-org.ts` agora usa `await logEventOnce(...)` nos três pontos (`:155`, `:166`,
      `:189`). Duas mutações minhas:
      - **tirar SÓ o `await` do `CRON_RESUMO`** → 🔴 **1 failed | 15 passed** no módulo e
        🔴 **3 failed | 19 passed** na rota. Bate com o alegado. O carrasco mede o `await`,
        não a chamada.
      - **voltar para `logEvent`** → 🔴 **13 failed | 36 passed** nas 3 suítes.
        ⚠️ O @dev alegou "10 vermelhos". A diferença é de denominador (conjunto de arquivos), não
        de direção. **E há uma armadilha aqui que registro para a próxima rodada de quem for
        medir isto:** a mutação ingênua (trocar a chamada sem reimportar `logEvent`) derruba **41
        testes** por `ReferenceError` no carregamento do módulo — vermelho que não discrimina
        nada. Refiz importando `logEvent` junto, para o módulo carregar; só então os 13 vermelhos
        são o sinal.
    o_carrasco_e_bom_e_vale_dizer_por_que: >-
      O duplo de `logEventOnce` só completa a escrita num **macrotask** (`setTimeout(r, 5)`), então
      sem o `await` o array `completados` está vazio no ponto da asserção. E há um **contador de
      geração** (`geracao++` no `beforeEach`) que descarta a escrita ÓRFÃ — a que a falta de
      `await` deixa pendente e que, sem isso, completaria depois do fim do teste e cairia no array
      do teste SEGUINTE, fazendo-o passar por acidente. O comentário registra que foi exatamente
      assim que a M1 da 87-6 ficou verde na primeira rodada. Isso é instrumento de primeira linha.

  QA-900-23-2b:
    titulo: "R3 — a concessão de escopo da asserção da 87-6"
    status: FECHADA (era o mesmo fato de QA-900-23-2, como eu havia apontado)
    medido: >-
      `nicole-agenda-reconcile/route.test.ts:408` — `expect(logEventMock).not.toHaveBeenCalled()`
      **restaurada inteira**, e o conjunto de escritas não-aguardadas permitidas antes do response
      voltou a ser ∅. Acima disso, `:411` afirma `tipos).toContain("CRON_RESUMO")` sobre o canal
      AGUARDADO, e `:533` afirma `completados.map(e => e.event_type)).toEqual(["CRON_RESUMO"])` no
      caso de zero orgs. Ou seja: a garantia original **mais** uma afirmação positiva de para onde
      o evento foi. Estritamente mais forte, agora sim — na rodada anterior era meia verdade.

  QA-900-23-3:
    titulo: "`skipped` terminal — SQL de recuperação (era ressalva do handoff)"
    status: FECHADA, e a decisão de LUGAR está certa
    medido: |
      Reconferi as duas afirmações factuais do comentário, não aceitei nenhuma:
      - `supabase/migrations/215_meta_capi_outbox.sql:49` →
        `CHECK (status IN ('pending','sent','failed','skipped'))`, **sem restrição de transição**.
        A volta é permitida pelo schema. ✅
      - `grep meta_capi_outbox … | grep pending` → o ÚNICO match no repositório é o próprio
        comentário novo. Nada devolve a linha para `pending`. ✅
    julgamento_do_lugar: >-
      **Certo, e é a diferença entre um documento e um instrumento.** O SQL está no ramo
      `if (!datasetId)` de `meta-capi-dispatch/route.ts` — ao lado da linha que CRIA o estado, que
      é onde alguém em incidente vai olhar (o stack trace e o `CAPI_ORG_SEM_DATASET` levam para
      lá; ninguém abre um `.yml` de gate às 3h). O filtro `AND last_error = 'capi_nao_configurado'`
      preserva as linhas de `'lead not found'`, que são `skipped` por outra razão — esse detalhe é
      o que separa uma receita segura de um `UPDATE` que ressuscita lixo.
    nit_de_vocabulario: >-
      O comentário chama o `event_id` de "determinístico". Medido: `215:44-45` diz
      `'visit_' || lead_id || '_' || random_uuid` — ele é **estável por linha**, não derivado
      deterministicamente das entradas. A conclusão de segurança não muda (re-enfileirar a MESMA
      linha reenvia o MESMO `event_id`, e a Meta deduplica em 48 h), mas a palavra promete mais do
      que o dado entrega. Não bloqueia.

  QA-900-23-4:
    titulo: "Correção factual do lint (era low)"
    status: FECHADA, e resolvida na FONTE
    medido: >-
      `pnpm lint --force` → **30 problems (0 errors, 30 warnings)**. Cruzei os arquivos com
      warning contra `git diff --name-only e8ea5433 HEAD`: sobram só `followup/route.ts` e
      `nicole-health/route.test.ts`, os dois que eu já havia provado byte-idênticos ao baseline.
      **Zero warning atribuível a esta story.**
    porque_o_conserto_e_melhor_que_o_pedido: >-
      Eu esperava um `_token` renomeado ou um `eslint-disable`. Ele fez o contrário: o duplo passou
      a capturar o PAR e o teste afirma
      `[["waba-a","tok-a"], ["waba-b","tok-b"]]`. O parâmetro deixou de ser ignorado porque virou
      **garantia** — a org A nunca lista templates com o token da B, que é um cruzamento que a
      suíte anterior não conseguia ver. Warning some como efeito colateral de um teste melhor.

  QA-900-23-5:
    titulo: "`DAILY_REPORT_ORG_ID` (era low) e Change Log da ordem de merge"
    status: FECHADA
    medido: >-
      A fresta está registrada na story e vai no handoff (H2). O Change Log foi corrigido do jeito
      certo: a linha antiga NÃO foi reescrita em silêncio — levou um
      `[CORRIGIDO na rodada do gate — esta linha dizia "a main vermelha", que é uma mecânica que
      não se sustenta…]` inline, preservando o que se disse antes ao lado do que se apurou depois.
      É a mesma disciplina que a Decisão 1 desta story usou para o `900-20`.

