# 2. O SEXTO — PROCURADO, ACHADO, E SÃO TRÊS. NÃO TOCA AC NENHUMA.
# ═════════════════════════════════════════════════════════════════════════════
achado_novo:
  id: QA-900-23-6
  severity: low
  titulo: "A escotilha de join do `projetar()` desliga a projeção justamente onde `org_id` divide espaço com um embed"
  finding: >-
    `projetar()` devolve a linha INTEIRA quando as colunas contêm `(` — decisão documentada e
    defensável (joins do PostgREST vêm como objeto aninhado). Só que existem, nesta fatia, TRÊS
    `select` que carregam `org_id` **e** um embed na mesma string. Neles a projeção é inerte por
    construção: aplicar o helper como está não conserta.
  medido: |
    Mutação idêntica (remover `org_id` da lista), em `0762e260`:

    | Linha                                   | Select                                          | Suíte |
    |-----------------------------------------|-------------------------------------------------|-------|
    | `email-automations/route.ts:54`         | `id, org_id, delay_minutes, email_templates(slug)` | 🟢 3/3 |
    | `email-automations/route.ts:120`        | `id, org_id, email_templates(slug)`             | 🟢 3/3 |
    | `obras-approval-reminder/route.ts:26`   | `id, org_id, …, obra:obras!obra_id(name)`       | 🟢 2/2 |

    Duas causas somadas: esses dois fakes não receberam o `projetar()` (não estão entre os 4 que
    o ganharam), **e** mesmo que recebessem, o `includes("(")` os devolveria inteiros.
  porque_NAO_bloqueia: >-
    Nenhuma AC desta story nomeia esses três `select`. `email-automations` e
    `obras-approval-reminder` entram pela AC7, cuja garantia é try/catch no laço + campo de falha
    nomeado — e essa garantia TEM carrasco (amostrei as duas variantes da C10 na rodada anterior).
    O `org_id` ali é leitura pré-existente, não a correção que a story entrega. É a diferença
    entre "a guarda da AC não guarda" (rodada 1, high) e "existe superfície vizinha sem guarda"
    (rodada 2, follow-up).
  fix_sugerido: >-
    Trocar o `if (colunas.includes("("))` por um split de vírgulas de PRIMEIRO NÍVEL (ignorando as
    que estão dentro de parênteses) e manter os embeds inteiros — ~6 linhas. Como o helper já está
    duplicado em 4 arquivos, o conserto e a extração para um módulo compartilhado são a mesma
    tarefa.
  suggested_owner: dev
  nota_de_classe: >-
    Terceira aparição desta classe na Onda 2 (nicole-health → os 5 → estes 3). O padrão que se
    repete não é "o dev esqueceu": é que **toda vez que alguém procura, acha**. Vale virar item de
    checklist da próxima fatia, não achado de gate.

