# 4. HANDOFF @devops — CONFIRMADO, COM O H1 REESCRITO (a régua anterior era falsa)
# ═════════════════════════════════════════════════════════════════════════════
handoff_devops:
  - id: H1
    titulo: "ORDEM DE MERGE — #526 primeiro. E a régua muda depois do squash."
    fato: >-
      `origin/main..HEAD` = **4 commits**, o primeiro é `e8ea5433` = `headRefOid` do PR #526.
      Mergear este PR antes do #526 leva o #526 inteiro (com
      `supabase/migrations/246_org_integrations_e_unicidade_whatsapp.sql`) para a `main` por dentro
      deste, sem gate próprio.
    correcao_da_regua_do_gate_anterior: >-
      ⚠️ No gate anterior escrevi "confira que `origin/main..HEAD` cai para 2". **Essa régua é
      falsa neste repo.** Medido: os últimos merges da `main` são **squash** (`77f225d1`,
      `eb1e45de`, `563e639f`… todos com `(#NNN)` e sem merge commit). Simulei o squash do #526
      (`git commit-tree e8ea5433^{tree} -p origin/main`) e confirmei: `e8ea5433` **nunca** vira
      ancestral da `main`, e `git log $SQ..HEAD` continua devolvendo 4 commits **para sempre**.
      A régua de história nunca fica verde; quem esperar por ela vai concluir errado.
    procedimento_certo: |
      1. Espere o #526 ser mergeado (squash).
      2. `git fetch origin && git merge origin/main` NESTA branch (merge, não rebase).
      3. **Conflitos previstos** (medidos com `git merge-tree` contra a main simulada) — são 4,
         todos add/add, e a resolução é OURS em todos:
           - `docs/audits/admin-client-allowlist.json`
           - `scripts/lib/allowlist-lint.ts`
           - `scripts/admin-client-allowlist.test.ts`
           - `docs/stories/900-21b-allowlist-retriada-e-org-integrations.story.md`
         `246_*.sql` e `no-unscoped-admin-client.mjs` **auto-resolvem** (esta story não os tocou,
         o conteúdo é idêntico dos dois lados — conferido).
      4. **Régua de conteúdo, DOIS pontos** (a única que discrimina pós-squash):
         `git diff origin/main HEAD --stat` **não pode listar** `246_*.sql` nem
         `no-unscoped-admin-client.mjs`. Na simulação deu 36 arquivos, sem nenhum dos dois. ✅
      5. **Não confie na aba "Files changed" do PR:** o GitHub usa diff de TRÊS pontos
         (merge-base), e na simulação os três pontos listam `246_*.sql`,
         `no-unscoped-admin-client.mjs` e `allowlist-lint.ts` como se fossem desta story. A página
         vai mentir até o passo 2 ser feito.
  - id: H2
    titulo: "LER 3 ENVS NA VERCEL DE PRODUÇÃO (uma ida só)"
    detalhe: >-
      `META_CAPI_DATASET_ID` (bloqueante da AC5.2 — decide se o valor a semear é a env ou o
      literal `1337310707164669` de `capi-client.ts:73`), `DAILY_REPORT_ORG_ID` e
      `DAILY_REPORT_RECIPIENTS` (QA-900-23-5). Conta certa é `nicoletrifold-droid`; o token da CLI
      local devolve `forbidden`.
  - id: H3
    titulo: "O CÓDIGO DA AC5 NÃO SOBE NESTE DEPLOY — plano B segue ATIVO"
    detalhe: >-
      Reconfirmei hoje: `org_integrations` → `PGRST205` em produção. Cadeia obrigatória:
      #526 mergeado → migration `246` aplicada em PRODUÇÃO → seed do `dataset_id` com `RETURNING`
      + `SELECT` de confirmação (Task 9.3) → só então o deploy de `meta-capi-dispatch/route.ts` +
      `capi-client.ts` → checagem pós-deploy (Task 9.5).
  - id: H4
    titulo: "Se a ordem do H3 falhar, o SQL de recuperação está NO CÓDIGO"
    detalhe: >-
      `meta-capi-dispatch/route.ts`, ramo `if (!datasetId)` — com o filtro por `last_error` que
      preserva as linhas de `'lead not found'`. Não precisa mais abrir este gate para achá-lo.

