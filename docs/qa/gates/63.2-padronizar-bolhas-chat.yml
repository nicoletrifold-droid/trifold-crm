    severity: low
    category: requirements
    finding: >
      AC4 (status de entrega ⏳/✓/⚠) é parcial: page.tsx exibe ✓ (Check) fixo para
      TODA mensagem broker persistida, inclusive as gravadas com
      metadata.send_error (envio externo falhou mas a row foi salva — ver AC7/
      REL-001 do gate 51.1). page.tsx só seleciona id/role/content/created_at
      (L54), sem metadata, então não distingue "entregue" de "falhou". O ✓
      representa "persistido no banco", não "entregue ao lead" — pode induzir o
      corretor a achar que a mensagem chegou.
    suggested_action: >
      Não-bloqueante para Fase 1. Ao unificar em 63-5, buscar metadata.send_error
      e renderizar ⚠ quando presente; surfacing de ⏳/pending via estado otimista
      do composer. Casar com REL-001 de 51.1.
