escopo: >
  Quem recebe o relatório diário das 07:59 sai da env da Vercel e passa a ser escolha na tela. O
  risco não é a tela: é o envio. Errar aqui manda (ou deixa de mandar) WhatsApp para o diretor e
  para o gerente comercial, e ninguém descobre até alguém reclamar — este relatório não grava nada
  no banco.

resumo: >
  **As cinco mutações mordem.** Tirar o dedup derruba 4 casos; ignorar `is_active` derruba 2; afrouxar
  o parse do jsonb derruba 1; o cron voltar a ler só a env derruba 1; tirar o sub-módulo do mapa
  derruba 2. Working tree limpa depois do gate (`git status` vazio) — e desta vez as mutações
  rodaram **sobre trabalho já commitado**, que é a correção do erro de método de ontem.

  Os dois cenários que mais me preocupavam estão cobertos por teste: mensagem DUPLICADA (o telefone
  do Alexandre está na env E no cadastro dele) e "lista vazia" (que tem de se comportar exatamente
  como antes do deploy, senão o diretor deixa de receber no dia do deploy).

status_reason: >
  Liberado para merge. Uma dívida herdada (C1), uma decisão de arquitetura registrada (C2) e a
  aplicação em produção (P1–P3).

acoes_obrigatorias: []

concerns:
  - id: C1
    severidade: MEDIUM
    tipo: observabilidade
    titulo: "O envio continua sem rastro — dívida herdada, fora do escopo por decisão do Marcos"
    detalhe: >
      `sendDailyReport` chama a Graph API e não grava nada: nem linha em `messages`, nem log. Se o
      token de `whatsapp_config` rotacionar (como em 10/08), o relatório para de chegar em silêncio,
      e o alerta de saúde da 75-289 não cobre este caminho porque ele mede `send_error` em
      `messages`. Eu levantei e ele respondeu "no momento é outra demanda". Esta story melhora um
      pouco o que dá para ver: o JSON de retorno passa a incluir `destinatarios` (quem, não só
      quantos), o que aparece no log da Vercel.
  - id: C2
    severidade: LOW
    tipo: decisão-de-arquitetura
    titulo: "Lista de distribuição NÃO é capability — e isso é deliberado"
    detalhe: >
      A ideia inicial era `relatorios.receber_diario` na matriz. Descartada: na matriz o admin é
      `true` por construção (`adminFullMatrix`), e produção tem 5 admins ativos (2 com telefone) —
      a capability faria o Marcos e qualquer admin futuro receberem WhatsApp às 07:59 sem pedir. É a
      mesma distinção que a F3-4 registrou ao deixar `dashboard.ver_equipe` fora do modelo:
      composição de UX ≠ autorização. Fica escrito no cabeçalho de `recipients.ts` para não ser
      "corrigido" depois.

impactos_conhecidos_e_aceitos:
  - titulo: "Uma query a mais por execução do cron"
    detalhe: "Uma leitura de `organizations.settings` + uma de `users` por dia. Irrelevante."
  - titulo: "A env continua existindo"
    detalhe: >
      Mantida de propósito: é a porta para número que NÃO é usuário do CRM e é o que garante
      continuidade se a lista estiver vazia. Efeito colateral aceito: existem dois lugares de onde
      um número pode vir — mitigado pelo dedup normalizado e pelo `destinatarios` no retorno.
  - titulo: "Quem edita a lista é quem tem a tela"
    detalhe: >
      `configuracoes.relatorio-diario` (sub-módulo novo, ligável na matriz). A server action confere
      a permissão DE NOVO e valida os ids contra usuários ativos da org — formulário de cliente não
      escolhe telefone alheio.

