# ═══════════════════════════════════════════════════════════════════
# ACHADO NOVO DESTA RODADA
# ═══════════════════════════════════════════════════════════════════
achados_novos:
  - id: N2-cron
    severity: MEDIUM
    bloqueia_deploy: true
    title: >
      A queda de 20 pontos acontece SEM recibo quando a mensagem chega fora do horário comercial —
      e é o recibo que a decisão do Gabriel usa para explicar a reclassificação ao comercial
    where:
      - "packages/ai/src/chat/pipeline.ts:485-501 (retorno antecipado de fora do expediente)"
      - "packages/ai/src/chat/pipeline.ts:~700 (o `stripLegacyAgendaKeys` + o evento vêm DEPOIS)"
      - "packages/web/src/app/api/cron/enrich-leads/route.ts:127 (`omitLegacyAgendaKeys(currentData)`, sem evento)"
    mecanismo: >
      1. Lead com resíduo escreve fora de 8h–18h. `processMessage` responde a mensagem de fora de
         expediente e **retorna na linha 497** — antes do descarte do legado. Nenhum evento, nenhuma
         chave apagada. Mas `updateConversationTimestamp` roda: `last_message_at` avança.
      2. O cron `enrich-leads` (30 em 30 min, `is_ai_active = true` e `last_message_at >
         last_enriched_at`) pega essa conversa, persiste
         `{...omitLegacyAgendaKeys(currentData), ...}` — **apaga o legado** — e grava em `leads` o
         `qualification_score`/`qualification_status`/`interest_level` recalculados **sem** os 20
         pontos. **Não emite `NICOLE_AGENDA_STATE_LEGADO_DESCARTADO`.**
      3. No turno seguinte, dentro do expediente, o `processMessage` não encontra mais chave legada
         → `chavesLegadas.length === 0` → o evento **nunca** é emitido. O recibo se perde de vez.
    dimensionamento_producao:
      consultas: "read-only, `dsopqkqjkmhytudaaolv`"
      resultado: >
        56 estados com resíduo · **37 com `is_ai_active = true`** (são os que o cron alcança) ·
        **39/56 já têm o cron como último escritor** · e **221 de 888 mensagens de lead dos últimos
        30 dias (25 %) chegaram fora de 8h–18h BRT**. Ordem de grandeza: ~1 em cada 4 primeiros
        toques cai neste caminho — dos 27 leads que atravessam o corte de 70, algo como 6 a 7
        mudariam de faixa sem linha de auditoria.
    por_que_importa: >
      A decisão tomada hoje pelo Gabriel — reclassificar, porque fato falso não pontua — está
      explicitamente condicionada a *"a queda é auditável via `score_antes`/`score_depois` no
      `LEGADO_DESCARTADO`"*. Para um quarto da população ela não é. E é a MESMA classe do B2: o
      mesmo cron, os mesmos 20 pontos, um andar acima — o que me faz insistir nela.
    correcao_sugerida: >
      A mais barata: emitir `NICOLE_AGENDA_STATE_LEGADO_DESCARTADO` também no cron, quando
      `omitLegacyAgendaKeys` remover alguma chave, com `chaves`, `score_antes`
      (`calculateQualificationScore(currentData)`), `score_depois`
      (`calculateQualificationScore(mergedCollectedData)`), `lead_id` e `source: "cron/enrich-leads"`
      — o `logEvent` já existe em `packages/web/src/lib/logger.ts` e já persiste `metadata`.
      Alternativa (mais limpa mas mexe no fluxo): mover o descarte do legado para ANTES do retorno de
      fora de expediente no `processMessage`. Teste obrigatório junto, com o vermelho colado.

