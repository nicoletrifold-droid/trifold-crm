status_reason_rodada_3: >
  As duas condições fecharam, e conferi só o que prometi conferir: o diff das duas e os dois
  vermelhos.
  **C1 fechou na substância.** Sob a mutação M4, o teste `negotiatingSlot` agora fica VERMELHO — na
  rodada 2 a mutação inteira dava 0 vermelhos. Rodei as DUAS variantes da mutação (`isPendencia(…)`
  → `!!agendaState && (dia || hora)` e → `!!agendaState`) e nas duas o vermelho é o mesmo, com a
  assertion que o @dev colou. A segunda correção que ele descobriu ao rodar (sábado 15/08 → quinta
  13/08, porque sábado fecha ao meio-dia e 14:00 caía em `outsideHours`) é real e necessária —
  minha própria fixture de re-gate usara sexta 14/08 justamente por isso, sem eu ter nomeado o
  motivo. O teste ficou melhor do que eu pedi: ele também afirma a ausência de
  `APPOINTMENT_RESCHEDULED`.
  **C2 fechou, e no lugar certo.** O @dev consertou no lado que APAGA em vez de no caminho de
  off-hours, o que é a decisão correta: cobre qualquer conversa que o cron enriqueça antes do
  próximo turno, não só a que chegou de madrugada. Verifiquei os dois lados da junta com relógio
  fixo: às **23:57 BRT** (a hora exata da Valnira) o pipeline retorna antes, o legado fica INTACTO
  e sai ZERO evento — é o buraco que eu medi, reproduzido; e o cron agora emite, com `chaves`,
  `score_antes`, `score_depois` e `origem_do_descarte`. Dentro do expediente sai **exatamente um**
  recibo, o do pipeline, com o mesmo formato e sem `origem_do_descarte` — a contagem da AC8
  continua sendo uma só e não duplica.
  **M6 é cirúrgica de verdade:** troquei só a condição do `if` (`> 0` → `> 99`) e caem **3**, os
  três do bloco novo, com os outros 724 verdes. A tentativa grosseira que derrubava 14 testes não
  está no código.
  Suíte **1864 passed | 7 expected fail (1871)**, `tsc` limpo nos dois pacotes, árvore restaurada
  byte a byte depois das mutações. As correções de relato entraram (Divergências 5 e 6 reescritas
  para o estado final, `pipeline.ts:805`, e a série 1781 → 1842 → 1859 → **1864**). Ele não editou
  AC — correto: a AC3 desatualizada segue sinalizada como pendência do @po/@sm.
  Sobra **uma imprecisão de contagem, e só isso**: a M4 corrigida dá **1** vermelho, não 2 — o de
  `'de manhã' com MENÇÃO de dia'` não cai (com `ignorarMencao` a menção é descartada antes de
  importar, então a condição do ramo é falsa com e sem a mutação). E a linha M4 da tabela continua
  escrita como "1 (oferta sobre dia que o lead não repetiu)", que é a descrição do teste ERRADO,
  contradizendo a nota logo abaixo dela. É edição de texto e não segura o merge — mas é a terceira
  vez nesta story que uma contagem declarada não sobrevive à remedição, e isso vale como nota de
  processo. Ver D5.

status_reason_rodada_2: >
  Os dois bloqueantes estão FECHADOS, e fechados de verdade: não aceitei o relato, refiz cada um.
  O B1 não sobrevive a cinco mensagens neutras diferentes com estado completo e visita marcada — e
  conferi o que o gate anterior mandava conferir, que é a ESCRITA: nenhum `APPOINTMENT_RESCHEDULED`,
  nenhuma `activity` de `appointment_updated`, `scheduled_at` intacta. O fail-closed de `fonte` é
  real e vai além do que o @dev declarou: além do estado legado sem a chave, valor lixo
  ("sistema", "PENDENCIA", 1, null, {}) também cai em `mencao`. O B2 fechou com um dono só, e a
  mutação que o reabre derruba 3 testes.
  O achado que muda a premissa da story PROCEDE, e conferi na conversa real: a mensagem da Nicole
  de 03/08 23:56:38 é literalmente "Qual o melhor dia pra você, durante a semana ou sábado de
  manhã?", a Valnira responde "Semana de manhã" às 23:57:17 e o pré-fetch devolve os três sábados de
  08/08 às 23:57:21. Não havia pendência nenhuma. Fui além do que foi pedido e reencenei os dois
  turnos REAIS pelo `processMessage` do código novo: o turno da Nicole grava estado NENHUM
  (`origem: assistant`) e o "Semana de manhã" seguinte cai em "indicou o período mas não o dia".
  A Valnira é fechada pela AC2, na fonte — não pela guarda de período. A restauração de
  `nPeriod && (nDay || pendenciaDay)` é segura e devolve as 4 ocorrências legítimas que a v1 apagava.
  Capturei eu mesmo os quatro turnos-ouro G4–G7 do `HEAD` com o seed no formato ANTIGO (worktree em
  51f162ce) e eles batem BYTE A BYTE com o esperado da branch, inclusive o `scheduled_at` — a
  equivalência entre formatos com estado agora é medida, não afirmada.
  O que não fecha são duas coisas pequenas e específicas, e nenhuma delas é defeito de
  comportamento. (1) A nota 2 do gate anterior continua aberta: rodei a mutação M4 e ela dá ZERO
  vermelhos na suíte inteira — a linha "M4 · 1 vermelho" da tabela de mutações da story afirma uma
  evidência que não existe. A guarda É load-bearing (provei com outra fixture, e sem ela um "as 14"
  MOVE uma visita real), mas nenhum teste da entrega a protege. (2) Achei um caminho em que a queda
  de 20 pontos acontece SEM o recibo que a decisão do Gabriel exige: turno fora do horário comercial
  retorna antes do descarte do legado, e aí quem apaga é o cron — que muda o score e NÃO emite o
  `LEGADO_DESCARTADO`. 25 % das mensagens de lead dos últimos 30 dias chegam fora de 8h–18h.
  Os dois consertos são de ~10 linhas cada e eu deixo a fixture medida dos dois lados. O desenho não
  precisa ser reaberto e o restante da story está aprovado.

