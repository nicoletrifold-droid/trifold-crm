premissa_revista:
  resultado: "PROCEDE — e é mais forte do que o @dev escreveu"
  evidencia_producao: >
    Consulta read-only a `messages` (dsopqkqjkmhytudaaolv), conversa da Valnira, 03/08:
      23:56:38  assistant  "…Que tal vir conhecer o decorado pessoalmente? … Qual o melhor dia pra
                            você, durante a semana ou **sábado** de manhã?"
      23:57:17  user       "Semana de manhã"
      23:57:21  assistant  "Tenho horários disponíveis na semana de manhã. Qual desses funciona
                            melhor pra você, Valnira?
                             - Sábado, 8 de agosto às 08:00
                             - Sábado, 8 de agosto às 08:30
                             - Sábado, 8 de agosto às 09:00"
    O turno da Nicole é o PRIMEIRO em que se pergunta o dia. Não existia pendência. O "sábado" é
    fala DELA, capturada em `visit_availability` — menção, não pendência. **A v1 desta story estava
    errada nos dois sentidos**, exatamente como o @dev diz.
  verificacao_extra_minha: >
    Não parei na leitura da conversa: reencenei os DOIS turnos reais pelo `processMessage` do
    código novo, com as strings copiadas de produção.
      T1 (lead "Rua", Nicole responde a pergunta das 23:56:38)
         → `collected_data.agenda_state` = null  e  `visit_availability` = null
           (a fala dela não vira estado — é a AC2 agindo na FONTE)
      T2 (lead "Semana de manhã")
         → "[SISTEMA: O cliente indicou o período (de manhã) mas não o dia. Pergunte qual dia
            prefere. NÃO afirme nenhum horário …]"
    **Zero sábados.** A Valnira é fechada pela procedência (AC2), não pela guarda de período.
  consequencia_para_a_story: >
    A AC3, como está escrita ("Com `agenda_state.data_absoluta` num sábado e a mensagem sendo
    'Semana de manhã', o dia herdado NÃO entra"), passou a valer só para `fonte: "mencao"`. O código
    entregue está CERTO e a AC está desatualizada — é edição de @po/@sm, não minha. Ver D3.

