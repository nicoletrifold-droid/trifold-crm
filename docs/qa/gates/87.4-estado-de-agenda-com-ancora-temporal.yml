concerns:
  - id: D1
    severity: MEDIUM
    title: "A guarda de período sobrevive UM turno: qualquer turno neutro promove a menção a pendência"
    evidencia: >
      Medido no harness, `now` 2026-08-12T13:00:00Z, sem visita marcada,
      `agenda_state{fonte:"mencao", data_absoluta:"2026-08-15", hora:null}`:
        · direto  "de manhã"   → "indicou o período (de manhã) mas não o dia"     ← guarda vale
        · T1 "Oi" → o ramo `day && !time` chama `guardarAgenda(...)` e o estado gravado passa a ser
          `{"fonte":"pendencia","data_absoluta":"2026-08-15", …}` — a citação original é preservada,
          mas a procedência muda
          T2 "de manhã" → "[SISTEMA: O cliente quer a visita de manhã em sábado, 15 de agosto.
                           Horários LIVRES nesse período: 08:00 ou 08:30 ou 09:00 …]"
    leitura: >
      **Não é regressão**: o `HEAD` fazia exatamente o mesmo (`visit_availability` → `day` →
      `cd.visit_pending_date`, e o `pendingDay` entrava sem guarda depois). E o dia sempre veio de
      uma fala do LEAD, porque `extractCollectedData` só escreve com `origem: "lead"`. Mas isso
      limita o que a AC3 entrega de verdade, e é melhor estar escrito do que ser descoberto num
      incidente. Vigiar na janela de 24 h.
  - id: D2
    severity: LOW
    title: "A reclassificação é preguiçosa, não em lote — o comercial precisa saber disso"
    evidencia: >
      `stripLegacyAgendaKeys` só roda no turno. Dos 56 estados com resíduo, **19 têm
      `is_ai_active = false`** e podem ficar meses sem ser tocados: esses mantêm os 20 pontos e a
      faixa antiga indefinidamente. A queda dos 27 chega **lead a lead**, conforme as conversas se
      movem — não num dia. Quem explicar ao time comercial precisa dizer isso, senão a pergunta vira
      "por que só alguns mudaram?".
    numeros_conferidos_por_mim: >
      Reconferi em produção os números que o @dev publicou, e batem exatamente:
      `{"leads_residuo":56,"qualified":29,"qualified_70_89":27,"hot":16,"hot_60_79":7}`.
  - id: D3
    severity: LOW
    title: "O Dev Agent Record se contradiz: as Divergências 5 e 6 descrevem a v1, que a revisão desfez"
    itens:
      - "Divergência 5 diz *'Corrigido para `nPeriod && nDay`'* — a revisão restaurou `nPeriod && (nDay || pendenciaDay)`. E cita `pipeline.ts:847`; no `HEAD` o ramo está na **805**."
      - "Divergência 6 descreve o `hasPendingSlot` como **XOR** — a revisão eliminou o XOR (voltou a `isPendencia`)."
      - "O bloco *Validações* continua dizendo `1781 → 1840`; o número medido da raiz é **1842 → 1859**."
    acao: "Edição de texto do @dev. A story é o que sobra depois; contradição interna dela é dívida."
  - id: D5
    severity: LOW
    title: "A contagem da M4 corrigida é 1, não 2 — e a linha da tabela descreve o teste errado"
    evidencia: >
      Rodei as duas leituras da mutação e as duas dão **1 vermelho**, o do `negotiatingSlot`. O
      segundo que a story lista — `'de manhã' com MENÇÃO de dia não oferta sobre ela` — **não cai**:
      com `ignorarMencao: true` a menção é descartada antes de importar, então
      `nPeriod && (nDay || pendenciaDay)` é falso com e sem a mutação.
      Além disso a **linha M4 da tabela de mutações continua escrita como
      `1 (oferta sobre dia que o lead não repetiu)`** — número certo por coincidência, descrição do
      teste errado — e contradiz a nota logo abaixo dela, que diz 2.
    leitura: >
      **Não segura o merge**: a substância da C1 é que a guarda passou a ter teste discriminante, e
      passou. Mas é a **terceira vez** nesta story que uma contagem declarada não sobrevive à
      remedição (M4 na v2, M4 na v3, e a série da suíte). Nota de processo, não defeito: contar
      vermelhos é barato e a story é o lastro que sobra.
    acao: "Corrigir a linha M4 da tabela para `1 (negotiatingSlot: número pelado com menção move visita real)` e ajustar o bloco de saída. Edição de texto."
  - id: D6
    severity: LOW
    title: "Corrida teórica entre o pipeline e o cron poderia gerar recibo duplicado"
    evidencia: >
      O cron decide emitir a partir do `currentData` que leu; se o pipeline persistir o descarte
      entre a leitura e a escrita do cron, os dois emitem para as mesmas chaves. Exige que as duas
      passadas caiam praticamente no mesmo segundo, e o cron só pega conversa com
      `last_message_at > last_enriched_at` (o pipeline persiste dentro da própria request).
    leitura: "Aceito. Se a contagem da AC8 aparecer com pico esquisito na janela de 24 h, `origem_do_descarte` já permite desempatar lead a lead — o campo que o @dev acrescentou resolve o diagnóstico sem código novo."
  - id: D4
    severity: LOW
    title: "AC3 desatualizada em relação ao código entregue — precisa de ratificação do @po/@sm"
    evidencia: >
      A AC3 manda, sem qualificar, que *o dia herdado não entre* quando o lead dá só o período. O
      entregue aplica isso a `fonte: "mencao"` e NÃO a `fonte: "pendencia"` — e a evidência da
      conversa real diz que o entregue está certo e a AC está errada. Eu não posso editar AC.
      **Sem essa ratificação por escrito, o próximo leitor vai achar que a implementação diverge da
      story.**

