escopo: >
  Dívida técnica em dois pontos do caminho quente da Nicole, mais a mesma classe de defeito em cinco
  leitores espalhados pelo repo. Esta story NÃO troca o modelo — remove a armadilha que fazia a troca
  (feita pelo BANCO, sem deploy) derrubar a conversa.

resumo: >
  **Os dois bloqueios eram reais e mediram diferente do que eu supunha.** O primeiro é o que parecia:
  `temperature` vai em toda chamada (`pipeline.ts`) e a geração atual devolve 400 — verificado que a
  Nicole é o ÚNICO consumidor do repo que envia sampling, então o estrago era só dela, mas total.

  O segundo é PIOR do que "responde vazio", e a leitura do código corrigiu minha primeira conclusão:
  com `content[0]` sendo `thinking`, o texto sai vazio, cai no `SANITIZED_EMPTY_FALLBACK` (75-279) e o
  lead recebe **uma frase neutra em todo turno**. Não é silêncio — é uma conversa que PARECE funcionar
  enquanto joga fora tudo que o modelo disse. Falha sem exceção e sem log, a mesma família do token da
  Meta (75-289).

  **Achado não previsto na story:** `/api/leads/[id]/handoff/route.ts` ainda carregava
  `claude-haiku-4-20250414` — a string que a 82-1 unificou em `/summary` e no cron e **deixou passar
  aqui**. Esse modelo não existe mais no catálogo: toda chamada dessa rota falhava na API, e o `catch`
  ao redor engolia o erro e seguia sem resumo. Corrigido no mesmo PR por ser exatamente a classe de
  defeito da story (string de modelo fora da constante compartilhada).

status_reason: >
  Liberado para merge. Nenhuma mudança de comportamento com o modelo atual: `claude-sonnet-4-6`
  continua recebendo `temperature` 0,70, e a leitura de uma resposta de um bloco só é idêntica.

acoes_obrigatorias: []

concerns:
  - id: C1
    severidade: LOW
    tipo: manutenção
    titulo: "`MODELOS_COM_SAMPLING` é uma lista que envelhece"
    detalhe: >
      É lista de PERMISSÃO por desenho: modelo desconhecido sai SEM `temperature`. O pior caso de um
      esquecimento é uma resposta mais determinística; o pior caso da lista invertida (bloqueio) seria
      uma conversa que não acontece. Há teste que acende se `ANTHROPIC_MODELS.sonnet` passar a apontar
      para um modelo com sampling.
  - id: C2
    severidade: LOW
    tipo: escopo-ampliado-conscientemente
    titulo: "Cinco leitores fora do escopo original foram convertidos"
    detalhe: >
      `handoff`, `summary`, `memory/writer`, `classify-contact` e `lead-memory` liam por posição. Todos
      rodam em Haiku (sem thinking por padrão), então nenhum estava quebrado hoje — mas manter cinco
      cópias da leitura frágil é rearmar a armadilha para a próxima troca. Três flows já tinham a
      leitura certa com comentário; agora todos usam a MESMA função. Lição da 75-268.

