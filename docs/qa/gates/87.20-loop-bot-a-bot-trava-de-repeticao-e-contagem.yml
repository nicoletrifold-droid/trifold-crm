check_7_await_logEventOnce:
  veredito: "CONCERNS — o código está certo; o carrasco não discrimina o `await`"
  o_que_esta_certo: >-
    `route.ts:1350` usa `await logEventOnce({... NICOLE_LOOP_DETECTADO ...})` seguido de `return`,
    e o `pipeline.ts` **não** chama `emit()` para este evento (teste afirma isso) — uma escrita só,
    aguardada, sem duplicidade. `logEventOnce` é a variante que devolve `{inserted}` e é aguardável;
    `logEvent` é `void`.
  o_que_medi: |
    | mutação | resultado |
    |---|---|
    | `await logEventOnce(...)` → `logEvent(...)`  (a que a story pediu) | 🔴 **2 testes** |
    | `await logEventOnce(...)` → `void logEventOnce(...)` (só o `await` sai) | 🟢 **32/32 VERDE** |
  por_que_o_segundo_fica_verde: >-
    O helper `entregar()` drena **6 × 10 ms** de macrotasks depois do `POST`; o mock de
    `logEventOnce` resolve em **5 ms**. A promise órfã completa dentro do MESMO teste e da mesma
    `geracaoDoTeste`, então `escritasCompletadas` enche do mesmo jeito. O guard de geração protege
    contra vazamento ENTRE testes, não contra a falta de `await` DENTRO do teste.
  por_que_importa: >-
    Numa lambda, `after()` só mantém o processo vivo enquanto a promise do callback não resolve —
    um `void` ali morre com o processo. É a classe exata do recibo perdido de 10/08. E aqui o
    recibo não é decorativo: é o ÚNICO insumo do alerta ao admin (o cron lê `NICOLE_LOOP_DETECTADO`).
    Perdê-lo produz "contido e silencioso".

