    ACRESCENTAR o evento em vez de trocar o tipo, que eu confirmei mecanicamente contra o predicado
    do cron. Os 4 mutantes são reais, têm kill sets DISJUNTOS e todos com `tsc` rc=0. O 2×2 do
    Achado 2 reproduz, inclusive a célula 🟢 que sustenta a tese, e a ressalva de que o filtro antigo
    não era cego em geral é VERDADEIRA — reproduzi o 🔴 dele contra a mutação ingênua. A varredura
    de irmãos confere contra a `origin/main` nos dois pontos declarados, e declarar em vez de
    consertar foi a chamada certa nos dois. A linha 386 segue intocada e valendo. A higiene fecha:
    o 5º valor de R1 é commit público (`git cat-file -t` + ancestral de `origin/story/87-20`).
    Réguas batendo: 289 · 3.799 · 6 xfail · rc=0, lint/type-check/build rc=0.
