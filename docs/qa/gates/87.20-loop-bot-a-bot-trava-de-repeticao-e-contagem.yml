# 3. O FURO DO AC16 — MEDIDO, E A RECOMENDAÇÃO
# ═════════════════════════════════════════════════════════════════════════════
ac16:
  veredito: "CONCERNS (não bloqueante). O achado do @dev está CERTO e eu o confirmei no banco."
  medido_em_producao:
    quando: "read-only, só metadados — nenhum conteúdo, nenhum identificador transcrito"
    is_ai_active: false
    handoff_at: "T_contencao (a pausa manual)"
    handoff_reason_e_a_constante: false
    handoff_reason_len: 85
    ultima_mensagem_da_conversa: "T_contencao − 47s"
    ultima_mensagem_role_broker: "T_contencao − ~49h (não move a âncora)"
    mensagens_depois_da_pausa: 0
    janela_de_reativacao: "24h após a contenção"
  o_que_isso_significa_de_verdade: >-
    A reativação **não é um relógio que dispara sozinho** — ela acontece no processamento da
    PRÓXIMA mensagem de entrada depois daquele instante. Se o outro bot ficar quieto (está quieto
    há ~1h45 na medição), nada acontece. Se falar depois da janela de 24h:
      - **com o fix em produção:** o guard não reconhece o motivo manual → reativa 1 vez → a Nicole
        responde → o **Sinal C** a contém na 3ª despedida, gravando o motivo canônico → a partir
        daí o AC14 vale e ela não reativa mais. **Um ciclo, não infinitos.**
      - **sem o fix em produção:** reativa e o loop volta inteiro, sem trava nenhuma.
  recomendacao:
    prioridade_1: >-
      **Deploy dentro da janela de 24h após a contenção.** É o único controle que muda a ordem de
      grandeza do dano. O `UPDATE` abaixo é otimização de um ciclo; o prazo é a diferença entre
      "5 mensagens" e "loop sem trava".
    prioridade_2: >-
      **SIM, recomendo o `UPDATE` de uma linha** — decisão do dono do produto, execução do @devops,
      **eu não executei nada**:
      `UPDATE conversations SET handoff_reason = 'loop_bot_detectado' WHERE id = '<id da conversa contida>';`
      (o identificador NÃO é versionado — o @devops o obtém do painel/banco no momento da execução)
      Risco: zero funcional (o campo não é lido por nenhuma tela; só o guard novo o compara).
      Custo: sobrescreve a nota livre da pausa manual — cujo texto já está transcrito no Context da
      story, então não se perde. Ganho: o AC16 passa a valer como escrito, do primeiro ciclo.
      Ordem: tanto faz antes ou depois do deploy (o campo só é lido pelo guard novo).
    o_que_NAO_fazer: "despausar o incidente — a conversa deve continuar com `is_ai_active=false`."

