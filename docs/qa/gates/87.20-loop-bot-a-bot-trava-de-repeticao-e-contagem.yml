      Medi o predicado do consumidor: `nicole-health/route.ts:73` define
      `const EVENTO_LOOP = "NICOLE_LOOP_DETECTADO"` e `coletarLoops` filtra
      `.eq("event_type", EVENTO_LOOP)` — é o ÚNICO gatilho do branch de alerta do AC10, e o cron
