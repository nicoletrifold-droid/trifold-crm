# 2. AS 4 CONCERNS
# ═════════════════════════════════════════════════════════════════════════════
concerns:
  - id: QA-87-20-1
    severidade: medium
    bloqueia_deploy: false
    status: "RESOLVIDA — ver seção 9. O conserto do harness (`drenarAfter`) foi remedido por mim e vale também para o call site NOVO da 2ª passada."
    titulo: "O carrasco do recibo prova o CANAL, não o `await`"
    medido: "`void logEventOnce(...)` → suíte do webhook 32/32 verde."
    conserto_exato: >-
      Em `packages/web/src/app/api/webhook/whatsapp/__tests__/route.test.ts`: guardar a promise do
      callback no mock de `after` (`afterPromise = Promise.resolve().then(() => fn())` em vez de
      `void ...`) e, no teste "a escrita COMPLETA antes do fim", trocar o laço de drenagem por
      `await afterPromise` seguido do assert IMEDIATO sobre `escritasCompletadas`. Com `await` o
      callback só resolve depois da escrita; com `void` ele resolve antes → vermelho determinístico,
      sem depender de tempo. Alternativa equivalente: mock com promise liberada à mão (deferred).
    verificar_depois: "rodar as duas mutações (`→ logEvent` e `→ void logEventOnce`) e exigir 🔴 nas duas."

  - id: QA-87-20-2
    severidade: medium
    bloqueia_deploy: false
    titulo: "O canal de alerta da 87-19 nunca disparou em produção — a primeira contenção será o primeiro teste dele"
    medido_em_producao: |
      whatsapp_send_log com template `alerta_sistema_admin` .... **0**
      system_events `NICOLE_HEALTH_ALERTA` ....................... **0**
      system_events `NICOLE_HEALTH_SEM_CANAL` ................... **0**
      system_events `NICOLE_LOOP_DETECTADO` ..................... 0 (esperado, pré-deploy)
      whatsapp_send_log em 90 dias (outros templates) ........... 2.973, 17 templates distintos
    por_que_e_grave_ainda_que_aceito: >-
      `handoff_reason` é escrito por 6 rotas e lido por **zero telas** (a própria
      `/dashboard/conversas/[id]` projeta `is_ai_active, handoff_at` e NÃO `handoff_reason`).
      O alerta no WhatsApp é o único caminho até uma pessoa. Se `alerta_sistema_admin` não estiver
      `APPROVED` na Meta, a contenção funciona e ninguém fica sabendo — o estado que o próprio
      comentário do código chama de pior possível. O AC11 está certo (a contenção não depende do
      alerta), mas "aceito" não é "medido".
    o_que_fazer: >-
      (a) @devops/dono do produto: conferir o status do template `alerta_sistema_admin` no WhatsApp
      Manager ANTES do deploy — 2 minutos, e é a diferença entre alerta e silêncio.
      (b) Depois da primeira contenção, ler `entregasFalhas` e `alertasDeLoop` no JSON de
      `/api/cron/nicole-health` — a compensação já desfaz o dedup quando a entrega falha 100%.
      (c) O link do `{{1}}` foi conferido: `/dashboard/conversas/[id]` existe e `[id]` É o
      `conversation_id` (a página consulta `conversations.eq("id", id)`), então o endereço é válido.

  - id: QA-87-20-3
    severidade: low
    bloqueia_deploy: false
    titulo: "Os três sinais contam uma coluna SOBRECARREGADA — `role='assistant'` não é só o pipeline"
    medido: |
      Escritores de `role:"assistant"` em `messages`, fora do pipeline da Nicole:
      `cron/followup/route.ts` (2 pontos), `lib/ai/send-library-media.ts`,
      `lib/appointments/visit-feedback-core.ts`, `lib/relacionamento/route-inbound.ts`,
      `api/agent/chat/route.ts`, e a transição de handoff do `send-message` (esta É filtrada,
      via `is_transition`).
      Dos **41** encerramentos de 90 dias, **2** carregam `appointment_id`/`source`/`channel` no
      metadata — ou seja, NÃO nasceram do pipeline, e ainda assim contam para o Sinal C.
    o_que_salva_hoje: >-
      A régua mede a MESMA coluna sobrecarregada que o código lê — então o "1 falso positivo em 90
      dias" já inclui esses escritores. E conferi as 4 conversas no limite: **nenhuma** chegou a 2
      com ajuda de mensagem não-pipeline (`enc_de_visita = 0` nas quatro).
    o_risco_para_frente: >-
      A margem do Sinal C é **1**. Uma mensagem automática nova com linguagem de despedida (um
      follow-up, um pós-visita) consome essa margem sem passar por revisão de prompt. Se o Sinal C
      começar a disparar em conversa humana, a primeira hipótese a testar é esta — e o conserto
      barato é restringir o carregador ao que o pipeline escreveu, não mexer nos limiares.

  - id: QA-87-20-4
    severidade: low
    bloqueia_deploy: false
    titulo: "AC16 não vale na PRIMEIRA reativação — confirmado contra produção"
    ver: "seção 3 abaixo"

