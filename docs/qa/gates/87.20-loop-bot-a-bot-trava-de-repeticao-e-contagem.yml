      alerta de WhatsApp ao admin EXATAMENTE no único estado em que a máquina não resolve o
      problema e um humano precisa ir pausar à mão. É a armadilha inversa do
      "o alerta só existe no caminho errado": aqui, trocar o tipo criaria o buraco.
