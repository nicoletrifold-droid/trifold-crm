      - `:636-637` `saveMessages` + `updateConversationTimestamp` — ramo de fora-de-horário, com
        `return` próprio; nunca alcança `:1435`. (Confirma o que o @po já tinha dito.)
      - `:744` — é o `update` da PRÓPRIA contenção (`conterLoop`).
      - todos os outros `await` da janela são LEITURA (`loadConversationState`, `loadAgentConfig`,
        `loadConversationHistory`, `searchKnowledge`, `loadProperties`, `loadMemoryContext`,
        `checkSlotAvailability`, `freeSlotsInPeriod`, `anthropic.messages.create`).
    Depois do `return` ficam, por construção, as ~15: `createCalendarEvent` (:1629/:1704),
    `emit(APPOINTMENT_CREATED)` (:1680 → push ao corretor), `deleteCalendarEvent` (:1703/:1738),
    os quatro `activities.insert`, o avanço para "Visita Agendada", `emit(APPOINTMENT_RESCHEDULED)`
