    metodo: "Management API, só leitura, só agregados e metadados. Sem service-role, sem script na árvore, nenhuma escrita."
    conversas: "`is_ai_active=false` → 452 no total; `handoff_reason='loop_bot_detectado'` → **0** (esperado: código não deployado; o incidente foi contido À MÃO, com motivo em texto livre — coerente com a concern QA-87-20-4 do gate). **A conversa contida NÃO foi despausada.**"
    namespace_de_evento: >-
      `select event_type, count(*) from system_events where event_type like 'NICOLE_%'` devolve 8
      tipos, e NENHUM é `NICOLE_LOOP_DETECTADO`, `NICOLE_LOOP_ALERTA`, `NICOLE_LOOP_CONTENCAO_FALHOU`
      ou `NICOLE_HEALTH_ALERTA`. Duas leituras: (a) o nome novo não colide com nada em produção;
      (b) **a QA-87-20-2 continua de pé** — o canal de alerta da 87-19 segue sem nunca ter disparado.

# ═════════════════════════════════════════════════════════════════════════════
# 10. CONCERNS DO DELTA
# ═════════════════════════════════════════════════════════════════════════════
concerns_delta:
  - id: QA-87-20-5
    severidade: low
    bloqueia_deploy: false
    titulo: "A varredura de classe parou nas ESCRITAS — há uma LEITURA que falha ABERTA, em código novo da própria 87-20"
    onde: "`packages/web/src/app/api/cron/nicole-health/route.ts:95-102`, `coletarLoops`"
    o_que_medi: |
      `coletarLoops` lê `system_events` e faz `if (error || !data) return []`.
      O irmão da MESMA função, 10 linhas acima e pré-existente na `origin/main` (linha 100 da main),
      faz o oposto: `if (error) return NextResponse.json({error…}, {status:500})` — falha FECHADA.
      Divergência de convenção dentro do mesmo arquivo, introduzida pela 87-20 (commit `ced550b1`).
    por_que_e_a_mesma_familia: >-
      Falha de leitura vira "**zero conversas em loop**", e a rota devolve `ok: true` com
      `conversasEmLoop: []`. É literalmente "o mecanismo relata um estado que ele não verificou ter
      alcançado" — a frase que o @dev usou para justificar o Achado 1 — só que na direção da
      DETECÇÃO em vez da CONTENÇÃO. Não há evento nem status de erro: o ciclo some em silêncio.
    por_que_NAO_bloqueia:
      - "Dano limitado a UM ciclo: o cron roda a cada 10 min com janela de 15 min (sobreposição), então o ciclo seguinte recupera o alerta."
      - "Não afeta a CONTENÇÃO (AC11: a trava não depende do cron). Afeta só a latência do aviso."
      - "É código de `ced550b1`, já dentro do escopo do gate anterior — aqui entra como COMPLETUDE DA VARREDURA declarada em `b24fa075`, não como reabertura."
    conserto_sugerido: >-
      Uma linha: separar `if (error)` de `if (!data)` e, no ramo de `error`, gravar
      `NICOLE_HEALTH_LEITURA_FALHOU` (level `error`) antes do `return []` — ou adotar a falha
      FECHADA do irmão. O que não pode ficar é o silêncio.
    o_que_o_dev_precisa_fazer_agora: "NADA obrigatório. Se optar por só declarar, ACRESCENTAR esta terceira linha à tabela de irmãos da seção 10 da story, para a classe ficar honestamente fechada."

  - id: QA-87-20-6
    severidade: low
    bloqueia_deploy: false
    titulo: "O grito não tem destinatário — `NICOLE_LOOP_CONTENCAO_FALHOU` não chega a ninguém pelos canais existentes"
    o_que_medi: |
      Segui os dois consumidores possíveis de `system_events` no cron:
      1. branch de LOOP: `coletarLoops` filtra `.eq("event_type", "NICOLE_LOOP_DETECTADO")` — não casa o grito.
      2. branch de ERRO: varre `level='error'` e passa por `classificarErroIA(message)`, que casa
         apenas `credit balance is too low` / `purchase credits` / `insufficient_quota` /
         `authentication_error` / `invalid x-api-key` / `permission_error` / `rate_limit_error` /
         `overloaded_error`. A mensagem do grito ("Falha ao pausar a Nicole apos loop bot-a-bot …")
         não casa nenhuma → `classificarErroIA` devolve `null` → `if (!tipo) continue`. Descartado.
      E o texto do WhatsApp que o admin recebe é CONSTANTE (`nicole-health/route.ts:343`):
      `loop bot-a-bot detectado — {link}`, idêntico nos dois casos.
    por_que_isso_NAO_derruba_a_decisao_da_pergunta_1: >-
      Porque a alternativa (trocar o `event_type`) seria PIOR: apagaria também o alerta. Manter o
      recibo preserva o único caminho até uma pessoa, e a distinção existe no `metadata` do próprio
      recibo (`contencao: "falhou"`, `erro`) e no `message`. O admin recebe o link, abre a conversa
      e vê a Nicole ainda ativa. É um caminho mais fraco, não um caminho ausente.
    o_residual_honesto: >-
      O admin recebe a MESMA frase nos dois casos. Se ele confiar na semântica antiga
      ("loop detectado" ⇒ "Nicole pausada"), vai supor pausa onde não houve. O evento que carrega a
      verdade é `level: error` em `system_events`, e `system_events` **não tem tela** — o mesmo furo
      estrutural já apontado na QA-87-20-2 do gate.
    conserto_sugerido: "Story de follow-up: `coletarLoops` distinguir `metadata->>contencao` e o `motivo` do `{{1}}` dizer `contenção FALHOU — pausar à mão` nesse caso. Fora do escopo desta passada; não vale segurar o merge."

