    | conversas com ≥1 encerramento em **14** dias | **13** ← o número que o parecer repetiu |
    | conversas com ≥1 encerramento em **90** dias | **28** ← o valor certo da coluna de 90d |
    | mensagens de encerramento 14d / 90d | **23 / 41** (idêntico nos dois relatórios) |
  conclusao: >-
    (1) O `1.940 × 1.768` é **filtro**, não erro: o @po contou a coluna inteira, o @dev aplicou a
    exclusão da Story 87-5. Para ESTA story o denominador certo é o do @dev — os três sinais não
    contam fala de corretor. Efeito colateral cosmético: a razão "41 de 1.940" do parecer mistura
    numerador filtrado com denominador não-filtrado (o correto é 41/1.768 = 2,3%, não 2,1%).
    (2) O `13 × 28` é **artefato de cópia**, confirmado: 13 É o valor de 14 dias, medido agora.
    (3) **Nenhum número de bloqueio muda** — e são eles que decidem o desenho: A=1, B@25=0, B@15=1,
    C=1, picos 3/19/8, idênticos nas TRÊS execuções independentes (@po, @dev, eu).
  por_que_isso_basta: >-
    Denominador descritivo errado inflaciona ou desinflaciona uma porcentagem de relatório; ele não
    entra em nenhum limiar, em nenhuma fixture e em nenhuma asserção. O que entraria — o pico e a
    contagem de bloqueadas — é o que triplamente reproduz.

