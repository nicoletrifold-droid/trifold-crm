status_reason: >-
  Rodada única, sobre a árvore de trabalho (nada commitado), base `aa584dfb`. **Os 16 ACs estão
  implementados e o código de produção está correto** — não achei defeito vivo. Reproduzi, de forma
  independente: a régua contra produção (números de bloqueio **idênticos**: A=1, B@25=0, B@15=1,
  C=1, picos 3/19/8), a classificação mensagem a mensagem do incidente **direto do banco** (11
  comprimentos e o padrão `enc` batem byte a byte com a fixture), e 5 mutantes — M8, M14, M18
  (com `tsc --noEmit` rc=0 **antes** do vermelho), M22 e um probe meu de renomeação do `metadata`
  do recibo. Todos mortos. Suíte inteira 289 arquivos / 3.790 passando / 6 expected-fail, `lint`
  rc=0 (0 erros), `type-check` rc=0 e — o que ninguém tinha medido — **`next build` rc=0**, que é
  o que prova o import profundo `@trifold/ai/src/flows/loop-breaker` resolvendo no bundle da
  Vercel, não só no `tsc`.
  **4 concerns, nenhuma bloqueante.** A que mais me incomoda é de INSTRUMENTO, não de produto:
  tirar SÓ o `await` do `logEventOnce` (mantendo a função) deixa a suíte do webhook **32/32
  VERDE** — o carrasco prova "canal certo", não "aguardado". O código hoje está certo; o que falta
  é o dente que impede o refator de amanhã. As outras três são de vigilância pós-deploy: o canal de
  alerta da 87-19 **nunca disparou em produção** (0 envios do template, 0 `NICOLE_HEALTH_ALERTA`),
  a coluna que os três sinais contam é **sobrecarregada** (≥5 escritores fora do pipeline; 2 dos 41
  encerramentos de 90 dias são de um deles), e o AC16 **não vale na primeira reativação** —
  confirmei contra produção que o `handoff_reason` do incidente é texto livre de 85 chars, não a
  constante.
  **O controle que realmente limita o dano não é este gate: é o prazo.** A conversa reativa
  **24h após a contenção** (na PRÓXIMA mensagem de entrada depois disso). Deploy dentro da janela
  = 1 ciclo curto no pior caso. Deploy depois = loop sem trava nenhuma.
