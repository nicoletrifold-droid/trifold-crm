    (`.insert(`, `.update(`, `.upsert(`, `.delete(`, `saveMessages`, `createCalendarEvent`,
    `deleteCalendarEvent`, `emit(`, `updateConversationState`, `updateConversationTimestamp`,
    `processConversationTurn`, `.rpc(`) e listei TODOS os `await` da janela.
  resultado: |
