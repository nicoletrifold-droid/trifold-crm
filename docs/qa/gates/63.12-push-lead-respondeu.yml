gate_q1_analysis:
  result: CORRECT
  notes: >
    brokerSentRecently consultado na conversa CERTA: route.ts passa
    conversationId=conversation.id (a conversa onde o inbound foi inserido) →
    notify-on-reply faz .eq("conversation_id", conversationId).eq("role","broker")
    .gte("created_at", now-24h).limit(1). O brokerSentRecently(brokerMsgs ?? [])
    reaplica a mesma janela de 24h em memória (helper puro canônico de 63-8, mesma
    fonte-de-verdade do banner e do cron de follow-up) — redundante-por-segurança,
    documentado. assigned_broker_id null → return ANTES da 2ª query (Q3). Nicole
    sozinha (sem broker recente) → return sem push.
  query_shape: "select('role, created_at') casa exatamente com TakeoverMessage{role,created_at} esperado por brokerSentRecently."
  after_isolation: >
    after() do push é dedicado, dentro do guard if(text||mediaMetadata.media_type),
    após o INSERT, independente do after() da Nicole. try/catch interno garante
    best-effort; mesmo que lançasse, o HTTP 200 já foi enviado. getSupabaseAdmin()
    (admin client) é correto para webhook server-side (sem sessão de usuário).
  null_handling: "leadName ?? 'Lead'; messageExcerpt.slice(0,100) || 'Nova mensagem recebida.' (mídia sem texto via text ?? '')."

