status_reason: >
  Helper server-only notify-on-reply.ts implementa corretamente os 3 gates de
  produto decididos pelo @po: Q1 (corretor já assumiu — assigned_broker_id não-null
  + role='broker' <24h na conversa via brokerSentRecently canônico de 63-8), Q3
  (sem corretor → return, sem fallback) e Q2 (sem debounce, leads.metadata
  intocado). O disparo é via after() dedicado no webhook, após o INSERT inbound,
  dentro do guard correto, independente do after() da Nicole e fire-and-forget
  (nunca bloqueia o HTTP 200). Best-effort com try/catch interno (nunca propaga).
  Payload null-safe (nome ?? "Lead"; body 100ch ou fallback de mídia) com deep-link
  url=/broker/leads/{leadId} lido pelo service worker existente (sw-source.js
  intocado, CON-8). CON-1/CON-3/CON-7 limpos. 9 testes cobrem gates Q1/Q3,
  sem-debounce, best-effort e o payload puro. Os 10 ACs estão atendidos. Sem
  dependência de infra — funciona imediatamente no push. Pronto para @devops *push.
