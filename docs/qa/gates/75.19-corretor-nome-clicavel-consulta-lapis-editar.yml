status_reason: >
  Refator do detalhe do corretor em server wrapper (page.tsx) + client
  (_detail.tsx). O server calcula canEdit via canAccess('sistema') ||
  canAccess('corretores') — mesma regra da coluna de ações da lista — e passa ao
  client. Modo consulta read-only com todos os campos (email, telefone, CRECI,
  tipo, limite, status ativo/disponível, empreendimentos). Lápis 'Editar' só
  renderiza quando canEdit; ao clicar, entra no formulário existente (dados,
  empreendimentos interativos, senha, ativar/desativar). Cancelar volta à consulta
  restaurando o phone; salvar persiste, recarrega o broker (loadBroker) e volta à
  consulta. Nome na lista virou Link para [id], preservando o botão 'Editar' da
  última coluna (redundância pedida). typecheck (tsc --noEmit) e lint (eslint) sem
  erros nos 3 arquivos da story. Sem mudança de permissão de escrita (a API já
  enforça requireRole; a 75-18 cobriu o RLS). Frontend-only — sem migration.
