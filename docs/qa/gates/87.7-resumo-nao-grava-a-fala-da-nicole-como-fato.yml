condicoes_de_deploy:
  - id: D1
    dono: "@po"
    bloqueante: true
    texto: >
      **Trocar a régua no corpo da `AC10-(ii)` e da `AC11-(ii)`.** Hoje a AC ainda manda usar a
      coluna `relativo`, que é inerte. A régua correta está medida e escrita no Dev Agent Record e
      neste gate (`relativo_estrito` 2/11 deve cair · `data_absoluta` 6/11 deve subir ·
      `appts = 0` como gatilho de rollback, nunca prova). Considerar também a `data_absoluta_com_ano`
      (**0/11**, ver N2). **Enquanto a AC disser o que diz hoje, quem executar a T6 vai medir com o
      instrumento errado** — é o defeito que esta família de stories existe para não repetir.
  - id: D2
    dono: "@devops / responsável nomeado"
    bloqueante: true
    texto: >
      **Janela dimensionada por `n`, não por horas** (F6 da rodada 1, não contestado): ~3,9 conversas
      enriquecidas/dia e 6 dos 11 régua-positivos reescritos em 7 dias ⇒ 24 h entrega n ≈ 1 e a AC
      se declara inconclusiva pela própria regra. Observar até `n ≥ 5` régua-positivos reescritos
      (≈ 7 dias), com os gatilhos de rollback ativos desde a hora zero.
  - id: D3
    dono: "@devops"
    bloqueante: false
    texto: >
      **AC10-(iv) exige chamada manual:** `system_events` com `event_type like 'NICOLE_%'` = **0
      all-time** — o cron da 87-3 nunca rodou. O endpoint aceita `?dry=1`. Escrever isso no plano de
      deploy, ou a AC10-(iv) será "medida" contra um instrumento que não roda.
  - id: D4
    dono: "@devops"
    bloqueante: true
    texto: "`D7` continua aberto: sem responsável nomeado (Marcos ou Thielly), o deploy não sai."

recommendation: >
  **Código APROVADO para merge.** As três condições HIGH fecharam com prova medida, e o conserto do
  F1 é recuperação legítima — quatro leads com divergência ZERO, e a borda do afrouxamento tem
  vermelho. **O deploy (T6) fica bloqueado em D1 e D2**, que não são do @dev: com a `AC10-(ii)`
  como está escrita, a janela de observação mediria com a régua que já provamos inerte, e com 24 h
  não alcançaria o denominador que a própria AC exige.

