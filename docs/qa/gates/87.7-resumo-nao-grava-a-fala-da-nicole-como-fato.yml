condicoes:
  - id: C1
    de: F1
    status: FECHADA
    titulo: "Rollover de ano — consertado, e o conserto tem borda testada"
    o_que_eu_medi: |
      mutação                                                              vermelhos
      ───────────────────────────────────────────────────────────────────  ─────────
      M-F1   conserto revertido (sem ano-autoridade, sem back-off)             4   ← declarado 4 ✅
      M-F1a  só a ANO-AUTORIDADE removida (back-off continua)                  1
      M-F1b  só o BACK-OFF removido (ano continua mandando)                    3
      M-F1c  back-off ALARGADO para ±60 dias ("afrouxar até casar")            2   ← 🔴 é pego
      M-DIVERG  `diaAfirmado` volta a sair do literal (par contraditório)      2
    por_que_nao_e_afrouxamento: >
      Três provas independentes. (a) **As quatro recuperações têm `divergencia_min = 0`** — não
      "casou dentro da janela", casou no minuto. (b) **`M-F1c` é vermelho**: alargar o back-off
      para ±60 dias derruba a fixture da AC4 ("appointment três semanas atrás → sem_lastro"), que
      é exatamente a borda — 21 dias não é −7d, não é −1 mês, não é −1 ano. A régua que separa
      "recuperação" de "afrouxamento" existe e está no vermelho. (c) **`M-F1a` = 1**: o teste que
      pina a ano-autoridade é o NEGATIVO ("texto diz 2026, appointment é de 2025 → `sem_lastro`"),
      que é o único formato capaz de impedir que a autoridade do ano vire "casa quase sempre".
    contra_producao: |
      Módulo rodado por mim contra os 11 resumos REAIS + appointments reais, âncora = instante de
      escrita, datas via `parseTimestamptz`:

        DISTRIBUIÇÃO   com_lastro 6 · sem_lastro 3 · indeterminado 2      (gate R1: 2 · 7 · 2)

        RECUPERADOS (os 4), com o ramo que casou e a divergência:
          Helena   −1 ano   "sábado, 27 de junho, às 10h"  ↔ 27/06/2026 10:00 BRT   div 0
          Marlene  −1 ano   "segunda, 3 de agosto às 16h"  ↔ 03/08/2026 16:00 BRT   div 0
          André    −7 dias  "dia seguinte (quarta) 10h30"  ↔ 05/08/2026 10:30 BRT   div 0
          Valnira  −7 dias  "quinta-feira às 10h"          ↔ 06/08/2026 10:00 BRT   div 0

        OS 3 QUE CONTINUAM BLOQUEADOS — conferi a triagem dele um a um:
          Juca     sábado 11h30 ↔ visita 11/07 10:00 → div 10170 min (outro sábado E outra hora) ✅
          Miriam   8 de julho 10h ↔ visita 08/07 11:00 → div 60 min > janela de 30 ✅
          Edicleia "amanhã (sexta 15h)" ↔ visita 07/08 15:00 → div 1440 min (classe da AC11) ✅
    par_do_evento: >
      `dia_afirmado` e `divergencia_min` passaram a descrever o MESMO candidato. Conferido no caso
      Miriam: publica `2026-07-08` + `60 min` (antes: `2027-07-08` + número sem sentido). No
      caminho `com_lastro` não há evento emitido, então o canto em que `casouEm` e
      `candidatoMaisProximo` poderiam divergir é inobservável — não é problema.

  - id: C2
    de: F2
    status: "FECHADA NA SUBSTÂNCIA — pendente de dono (ver D1)"
    o_que_eu_remedi: |
      Produção, 2026-08-09 (Management API, somente SELECT):
        resumos ......................................... 231
        … casam `pr(ó|o)xim[ao]` ........................ 183   (79 %)
        … … literalmente "Próximo passo" ................ 170          ← a decomposição dele bate
        régua velha (`relativo`) sobre os 11 ............ 11/11 (satura)

        RÉGUAS NOVAS, remedidas por mim:
          relativo_estrito ..... 2 / 11   (população: 5 / 231)   deve CAIR
          data_absoluta ........ 6 / 11   (população: 7 / 231)   deve SUBIR
          appts = 0 ............ 0 / 11   → gatilho de rollback, nunca prova de sucesso
      Nenhuma das duas satura em nenhuma direção. As direções são opostas e estão declaradas — é o
      que faltava na régua anterior.
    credito: >
      Ele decompôs por conta própria e escreveu a regra de método ("régua nova só entra com a
      contagem de quantos casam por acidente ao lado"). É a correção certa do padrão, não a
      correção do sintoma.

  - id: C3
    de: F3
    status: FECHADA
    o_que_eu_medi: |
      M-F3a  `${blocoAgenda}` fora do prompt montado do Haiku ........ 1   (era 0)
      M-F3b  `${REGRAS_FATO_DE_AGENDA}` fora do ENRICHMENT_PROMPT .... 1   (era 0)
    analise: >
      O teste novo em `haiku-enrichment.test.ts` chama `enrichLeadFromConversation` **de verdade** —
      só o cliente Anthropic é dublado — e asserta sobre `mock.calls[0][0].messages[0].content`.
      É a string montada que a AC5-(ii) nomeia, não o argumento. As camadas 1 e 2 do escritor
      dominante (92,5 % da população) passaram a ter defesa.

  - id: C4
    de: F4
    status: "FECHADA NO MÉTODO — 1 número não reproduz"
    tabela: |
      mutação      declarado (R2)   medido por mim (raiz)   veredicto
      ───────────  ───────────────  ──────────────────────  ─────────────────────────────────
      M-AC1              14          13 / 15                ⚠️ depende da forma (ver abaixo)
      M-F1                4           4                     ✅
      M-AC4               5           5                     ✅
      M-AC11              5           5                     ✅
      M-F3a               1           1                     ✅
      M-F3b               1           1                     ✅
      M-NEG               1           1                     ✅
      M-A                 1           1                     ✅
      M-B                 2           2                     ✅
      M-AC5-A / -B-call   2           1 + 1                 ✅
    m_ac1: >
      "Trocar o detector pela semântica da `detectAffirmedSlot`" admite duas formas. Exigir dia E
      hora **só no ramo que já achou dia** → **13**. Replicar a `detectAffirmedSlot` inteira
      (`null` também quando não há dia, o que derruba o teste de `indeterminado`) → **15**. Ele
      declarou 14, que não é nenhuma das duas. Não muda conclusão nenhuma — em qualquer forma os
      testes discriminam com folga —, mas **a forma da mutação precisa estar escrita junto do
      número**, senão a contagem não é reproduzível e volta a valer como asserção em vez de medida.

  - id: C5
    de: F5
    status: FECHADA
    o_que_eu_medi: "M-NEG = 1 (era 0)"
    analise: >
      A fixture é o par certo: *"Marcou visita ao decorado para o dia 8, **mas não confirmou** o
      horário ainda"* — negação DEPOIS do verbo, que uma regra de frase inteira absolveria, com o
      par negativo da Orlice ao lado. E ele aceitou por escrito que a justificativa anterior estava
      errada (a frase da Lucimara não tem token de negação nenhum). A regra deixou de ser código
      indefeso.

  - id: C6
    de: F8
    status: NAO_FEITA
    obrigatorio: false
    texto: "Batimento positivo do guarda continua ausente: zero eventos na janela permanece ambíguo entre 'nada a bloquear' e 'não rodou'. Opcional; ver D3."

