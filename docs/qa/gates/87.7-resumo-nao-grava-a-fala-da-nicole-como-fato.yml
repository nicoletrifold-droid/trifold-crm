issues:
  - id: N1
    severity: medium
    category: requirements
    title: "O back-off abre uma janela ESTREITA de falso `com_lastro` — o preço declarado do fail-open"
    medido_por_mim: |
      Lead com visita REAL em sábado 08/08 10:00. Nicole afirma uma SEGUNDA visita que não existe:

        "nova visita … para sábado às 10h"        → com_lastro  🔴  (ramo −7 dias, div 0)
        "nova visita … para sábado às 15h"        → sem_lastro  ✅  (div 300)
        "nova visita … para quinta-feira às 10h"  → sem_lastro  ✅  (div 2880)
        "visita … para o dia 8 às 10h"            → com_lastro  🔴  (ramo −1 mês, div 0)
        lead SEM appointment nenhum (caso-mãe)    → sem_lastro  ✅
    analise: >
      O guarda deixa de bloquear uma afirmação falsa **apenas** quando ela cai no mesmo
      dia-da-semana E mesma hora (ou mesmo dia-do-mês E mesma hora) de uma visita real anterior.
      Mudar a hora ou o dia já bloqueia, e o caso-mãe (lead sem appointment) é imune.
      **É inerente e não tem conserto barato aqui:** `parseDayParts` apaga a distinção entre
      "sábado passado" e "próximo sábado", e `visit-slot.ts` não pode ser tocada (AC7).
      **Exposição medida:** 16 leads têm conversa com IA ativa E visita passada.
      **O trade é claramente favorável:** o defeito da rodada 1 congelava TODO lead com visita real
      (dano largo, ativo a cada 30 min); este atinge uma coincidência de dia+hora em 16 leads, e é
      fail-open, que é a postura declarada da story.
    recomendacao: >
      Registrar como risco residual na story e como candidato a follow-up do Epic 87: usar tempo
      verbal / preposição ("marcou … para" = futuro vs "visitou … em" = passado) para PREFERIR o
      candidato futuro quando o texto é prospectivo. Não é desta story.

  - id: N2
    severity: low
    category: requirements
    title: "Terceira coluna disponível e melhor que as duas — e ela está no CHÃO hoje"
    medido_por_mim: |
      `data_absoluta_com_ano`:  ai_summary ~* '(de 20[0-9]{2}|[0-9]{1,2}/[0-9]{1,2}/20[0-9]{2})'
        sobre os 11 da régua ....... 0 / 11    ← no piso; só pode SUBIR
        na população .............. 19 / 231
    analise: >
      É exatamente o que a camada 1 emite ("15 de agosto de 2026", "03/08/2026") e o que a camada 2
      manda copiar. Diferente de `data_absoluta` (6/11), ela **não pode ser satisfeita pelo estilo
      de escrita que já existia** — nenhum dos 11 resumos atuais escreve o ano. Uma métrica no piso
      que só sobe se o conserto funcionar é o instrumento mais limpo que esta story tem.
    recomendacao: "Sugerir ao @po como terceira coluna da AC10-(ii)/AC11-(ii), ao lado das duas já adotadas."

  - id: N3
    severity: low
    category: tests
    title: "F7 continua: a ligação `onEvent: emit` do escritor A não é exercida"
    medicao: "M-PIPE (remover `onEvent: emit` de `pipeline.ts`) → 0 vermelhos, suíte inteiramente verde"
    analise: "Consequência aceita da Decisão Autônoma nº 5 na rodada 1. Diff de uma linha, conferido de novo neste gate: a linha está lá. Permanece LOW."

