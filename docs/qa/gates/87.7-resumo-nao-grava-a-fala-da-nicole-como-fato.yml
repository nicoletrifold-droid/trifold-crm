status_reason: >
  As três condições HIGH da rodada 1 fecharam, e fecharam com prova que eu mesmo medi — não com
  argumento. O conserto do F1 não é afrouxamento: as quatro recuperações contra produção têm
  **divergência de ZERO minuto** (dia e hora batendo no minuto), e a mutação que alarga o back-off
  para ±60 dias — o caminho fácil de fazer o número subir — é **pega pela fixture da AC4**, que
  continua exigindo `sem_lastro` para um appointment de três semanas atrás. A régua inerte foi
  retirada por conta dele, com a decomposição feita antes de eu pedir (183 de 231 casam
  `próxim[ao]`, **170 literalmente "Próximo passo"**), e as duas substitutas que remedi não saturam
  em nenhuma direção. O teste do prompt montado do escritor dominante saiu de 0 para 1 em cada
  metade, chamando a função de verdade.
  **O código está aprovado para merge.** O que segura o CONCERNS não é dele: **a `AC10-(ii)` no
  corpo da story ainda é a régua inerte** — o @dev não pode editar AC, e quem executar a T6 lendo a
  AC repetiria exatamente o defeito que esta família de stories existe para não repetir. Some-se
  uma imprecisão de contagem (`M-AC1` declarado 14; medi 13 na variante estrita e 15 na semântica
  completa — o número depende da forma da mutação, que não está escrita) e um risco residual novo,
  estreito e documentado (o back-off pode absolver uma segunda visita falsa que caia no MESMO
  dia-da-semana e MESMA hora de uma visita real anterior).

