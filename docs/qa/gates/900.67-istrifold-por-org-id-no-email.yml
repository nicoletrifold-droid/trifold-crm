schema: 1
story: "900.67"
story_title: "O logo da Trifold no cabeçalho do e-mail deixa de ser decidido por regex no nome, e passa a ser por org_id"
gate: CONCERNS
status_reason: >-
  O mecanismo está certo e o defeito está morto: `isMarcaTrifold` compara por identidade, a fiação
  chega aos 9 sítios, e eu **li os 9** — o `orgId` de cada um é mesmo o do DESTINATÁRIO (os alvos
  são buscados com `.eq("org_id", appUser.org_id)`, o broker é inserido com `org_id: appUser.org_id`,
  o cron usa `appointment.org_id` para os dois destinatários, e `ensureAdminInvited(orgId)` é a org
  convidada). As duas descobertas que o @dev declara foram **reproduzidas**, e as duas procedem:
  com o detector antigo `/\borgId\s*[,:]/` a M2 fica **VERDE**, e sem a linha "Concretamente: NÃO
  acrescente `orgId,`…" a M3 fica **VERDE** — os dois consertos são carregadores, não cosméticos.
  Réguas batem byte a byte com o declarado (318 · 4372 | 6 · lint 0 erros · type-check 8/8 · build
  5/5 `--force`). **A concern é a 16ª armadilha, e é do carrasco, não do código:** `PASSA_ORG_ID` é
  testado contra a REGIÃO INTEIRA da chamada, não contra o objeto de opções — medido, um call site
  que PERDE o `orgId` das opções e menciona `orgId:` no argumento VIZINHO fica verde na suíte
  inteira (318/4372), que é exatamente o modo de falha nº 1 que a AC11 existe para fechar.
reviewer: "Quinn (Test Architect)"
updated: "2026-09-03T11:40:00Z"

# ─────────────────────────────────────────────────────────────────────────────
# O QUALIFICADOR
# ─────────────────────────────────────────────────────────────────────────────
qualificador_da_entrega: >-
  **Nada muda para a Trifold hoje**, e é essa a promessa: com o `org_id` da Trifold real a saída é
  byte a byte a de hoje (provado por `toBe` sobre a string completa do cabeçalho). O que muda é a
  DIREÇÃO da falha: `orgId` desconhecido, ou de outra org, agora rende TEXTO em vez da marca do
  primeiro cliente. O defeito latente que a `900-25` ia ativar ("Trifold Sandbox" casando
  `/trifold/i`) está morto — e tem teste nomeado com esse nome.
qualificador_o_que_NAO_esta_provado: >-
  Nada em produção: não há e-mail enviado nem render em ambiente real; "byte a byte" é prova de
  unidade. Além disso, o branch NÃO-Trifold continua imprimindo o literal hardcoded do chamador
  ("Trifold", "Trifold CRM") — a marca do tenant continua errada no TEXTO, e isso é a story futura
  já nomeada pela 900-64. Esta story só troca QUAL decisão abre o branch.

