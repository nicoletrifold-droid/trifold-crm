      resultado: "com `orgId` 🟢 **19/19**. `codigoDe` trima e junta com `\\n`, o `\\s*` da régua atravessa a quebra."
  veredicto: >-
    **Nenhuma das quatro produz falso verde, e nenhuma produz falso alarme.** O extrator se
