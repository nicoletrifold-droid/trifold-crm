# ─────────────────────────────────────────────────────────────────────────────
# ALCANCE — auditado independentemente
# ─────────────────────────────────────────────────────────────────────────────
alcance:
  varredura_propria: >-
    `grep -rn` de `renderBaseLayout` / `renderPasswordActionEmail` / `renderHeader` no repositório
    inteiro (fora `node_modules` e `docs`): **exatamente 10** call sites de aplicação, todos sob
    `packages/web/src`. Nenhum em `scripts/`, `packages/ai`, `packages/shared` ou `landing-pages`
    (que estão no `include` do vitest mas fora do `SRC` da régua). `renderHeader` só é chamado de
    `email-layout/index.ts` — não há terceira porta para o cabeçalho.
  duas_dimensoes: >-
    A régua afirma NOMES **e** CONTAGENS nas duas partições (`toEqual` sobre chaves ordenadas +
    `Record` com número por arquivo). Um 2º call site sem `orgId` dentro do arquivo já
    excepcionado é pego pelo `semOrgId.get(EXCECAO_AC7) === 1`. Vivacidade (`callSites.length === 10`,
    `arquivosVarridos.length > 100`, nenhuma região vazia) presente.
  valor_do_orgId_lido_a_mao: >-
    A régua mede PRESENÇA, não VALOR — o @dev declarou isso como não-provado. **Eu medi por leitura,
    e os 9 estão certos hoje:** `users/[id]/reset-password` e `admin/clientes/[id]/senha` buscam o
    alvo com `.eq("org_id", appUser.org_id)`; `brokers` sítio 1 insere o broker com
    `org_id: appUser.org_id` e o sítio 2 busca `targetUser` com `.eq("org_id", appUser.org_id)`;
    `appointment-email-reminders` usa `appointment.org_id` para corretor E lead;
    `login/actions` usa o `org_id` do próprio solicitante; `ensureAdminInvited(orgId, email)` é a
    org convidada. A invariante de um lado só fica fechada para os 9 de hoje — o risco residual é
    de call site FUTURO, e cai na concern abaixo.

# ─────────────────────────────────────────────────────────────────────────────
# §5.2 — as três correções do @dev ao briefing: CONFIRMADAS
# ─────────────────────────────────────────────────────────────────────────────
verificacao_secao_5_2:
  procedencia: "`tentarAppUrl` NÃO existe em `origin/main` nem nesta árvore — só na branch `story/900-66-…` (PR #565). A ressalva do @dev procede."
  sla_alerts_265: >-
    ✅ **CONFIRMADO, e é o mais grave.** O portão é `if (gestorElapsed >= gestorMin &&
    !lead.sla_alerta_gestor_em)`, e `markGestor.push(lead.id)` está **fora** de `if (wppConfig)` e
    fora de `if (basePush.ok)`. `sla_alerta_gestor_em` é gravado UMA vez. Logo: sem WhatsApp e sem
    URL base, nada sai, o lead é carimbado assim mesmo, e a supressão é **PERMANENTE por lead** —
    não uma janela. A justificativa do autor ("o WhatsApp já saiu sem link") só vale dentro de
    `if (wppConfig)`. Minha descrição de "janela" no briefing estava errada; a do @dev está certa.
  bolsao_rebalance_263: >-
    ✅ **CONFIRMADO.** `claim_obra_notif` é chamada e `claimed === true` é avaliado ANTES de
    `sendBolsaoDigest` rodar. O claim É consumido; o comentário que afirma o contrário contradiz o
    código.
  bolsao_rebalance_199: >-
    ✅ **CONFIRMADO — supressão DUPLA.** Entre o claim e o envio há um `insert` em `activities` com
    `type: "pre_bolsao_aviso"`, e é exatamente essa linha que o `jaAvisados` da rodada seguinte lê
    (`.eq("type","pre_bolsao_aviso")`, linhas 186-194). Claim + marcador.

# ─────────────────────────────────────────────────────────────────────────────
# Achados
# ─────────────────────────────────────────────────────────────────────────────
top_issues:
  - id: QA-900-67-1
    severity: medium
    finding: >-
      🔴 **A 16ª armadilha — `PASSA_ORG_ID` é medido contra a REGIÃO INTEIRA da chamada, não contra
      o objeto de opções.** `regioesDeChamada` recorta de `renderBaseLayout(` até o `)` que fecha —
      o que inclui o argumento `content`. Qualquer token `orgId:` em QUALQUER argumento satisfaz a
      régua. **Medido:** em `appointment-email-reminders:83` removi `orgId: appointment.org_id` das
      opções (o e-mail passa a renderizar TEXTO em vez da logo, em silêncio) e pus
      `${({ orgId: appointment.org_id }).orgId ?? ""}` dentro do template do corpo. `tsc` rc=0,
      `header-brand.test.ts` **15/15 VERDE**, e a suíte INTEIRA **318 arquivos / 4372 passed VERDE**.
      Nada no repositório acende. É literalmente o modo de falha nº 1 que a AC11 enumera ("um call
      site novo nasce sem `orgId` … o e-mail perde a logo da Trifold em silêncio, e nada fica
      vermelho"). A forma é realista: `renderBaseLayout(montarCorpo({ orgId }), { orgName })`.
    suggested_owner: dev
    suggested_action: >-
      Medir `PASSA_ORG_ID` só no ÚLTIMO objeto literal de topo da região (as opções), não na região
      inteira. Ex.: extrair o trecho do último `{` de profundidade-1 até seu `}` e testar ali.
      Rodar como M5 exatamente a mutação acima (esperado: 🔴, nomeando o arquivo) **e** re-rodar M1
      e M2 contra o detector novo (as duas seguem 🔴). Sem isso a AC11 fecha as formas ingênuas mas
      não a que o próximo refactor produz.
  - id: QA-900-67-2
    severity: low
    finding: >-
      **O `it` "a contagem por arquivo bate com uma medida independente do mesmo texto" não pode
      falhar.** Os dois lados contam ocorrências dos MESMOS marcadores no MESMO `codigoDe(arquivo)`:
      `regioesDeChamada` empurra exatamente uma região por ocorrência de marcador, dê certo o
      balanceamento ou não. **Medido:** troquei o recorte por `codigo.slice(inicio)` (engole tudo
      até o EOF) — o `it` "nenhum recorte engoliu o call site vizinho" ficou 🔴 (bom), e este ficou
      🟢, refutando o próprio comentário dele ("Se o recorte estivesse errado, as duas
      discordariam"). A cobertura real é do `it` vizinho; este é decorativo.
    suggested_owner: dev
    suggested_action: "Ou tornar a 2ª medida independente de verdade (contar por outro caminho), ou apagar o `it` e corrigir o comentário — guarda que não muda o veredicto engorda a impressão de cobertura."
  - id: QA-900-67-3
    severity: low
    finding: >-
      **A matabilidade da AC11.1 depende de UMA linha de prosa dentro de um comentário.** Medido em
      M3-contraprova: sem a linha `// Concretamente: NÃO acrescente `orgId,`…`, desligar o
      `codigoDe()` obrigatório fica 🟢 — e remover essa linha, por si só, não deixa nada vermelho.
      Ou seja, qualquer reescrita futura daquele comentário devolve o filtro ao estado decorativo,
      em silêncio. O @dev documentou o RACIOCÍNIO ali; falta documentar a FRAGILIDADE.
    suggested_owner: dev
    suggested_action: "Acrescentar meia linha ao comentário da AC7: `// ↑ esta linha é o carrasco do filtro `codigoDe` da AC11.1 — não a reescreva sem re-rodar M3.`"
  - id: QA-900-67-4
    severity: low
    finding: >-
      **AC5 (preview do admin) é um vazamento de marca quando houver 2º tenant.**
      `email-templates/preview` fixa `orgId: trifoldOrgId()`, então o admin da "Trifold Sandbox"
      (`900-25`) verá a logo da Trifold ao pré-visualizar um template DELE. A AUTO-DECISÃO está
      correta para hoje (byte a byte, tenant único) e está declarada — mas é a mesma classe de
      defeito que esta story existe para matar, adiada.
    suggested_owner: po
    suggested_action: "Nomear explicitamente na story futura da 900-64: o preview deve usar `user.orgId` quando houver mais de uma org ativa."

