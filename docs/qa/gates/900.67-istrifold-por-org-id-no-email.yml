alcance:
  varredura_propria: >-
    `grep -rn` de `renderBaseLayout` / `renderPasswordActionEmail` / `renderHeader` no repositório
    inteiro (fora `node_modules` e `docs`): **exatamente 10** call sites de aplicação, todos sob
    `packages/web/src`. Nenhum em `scripts/`, `packages/ai`, `packages/shared` ou `landing-pages`
    (que estão no `include` do vitest mas fora do `SRC` da régua). `renderHeader` só é chamado de
    `email-layout/index.ts` — não há terceira porta para o cabeçalho.
  duas_dimensoes: >-
    A régua afirma NOMES **e** CONTAGENS nas duas partições (`toEqual` sobre chaves ordenadas +
    `Record` com número por arquivo). Um 2º call site sem `orgId` dentro do arquivo já
    excepcionado é pego pelo `semOrgId.get(EXCECAO_AC7) === 1`. Vivacidade (`callSites.length === 10`,
    `arquivosVarridos.length > 100`, nenhuma região vazia) presente.
  valor_do_orgId_lido_a_mao: >-
    A régua mede PRESENÇA, não VALOR — o @dev declarou isso como não-provado. **Eu medi por leitura,
    e os 9 estão certos hoje:** `users/[id]/reset-password` e `admin/clientes/[id]/senha` buscam o
    alvo com `.eq("org_id", appUser.org_id)`; `brokers` sítio 1 insere o broker com
    `org_id: appUser.org_id` e o sítio 2 busca `targetUser` com `.eq("org_id", appUser.org_id)`;
    `appointment-email-reminders` usa `appointment.org_id` para corretor E lead;
    `login/actions` usa o `org_id` do próprio solicitante; `ensureAdminInvited(orgId, email)` é a
    org convidada. A invariante de um lado só fica fechada para os 9 de hoje — o risco residual é
    de call site FUTURO, e cai na concern abaixo.

