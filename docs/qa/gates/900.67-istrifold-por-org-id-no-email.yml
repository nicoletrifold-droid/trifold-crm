rodada_3_o_que_o_conserto_ACERTOU:
  mascara_na_mesma_passada: >-
    ✅ **Verdade, lida no codigo.** O array `mascara` e preenchido dentro do MESMO laco que equilibra
    a pilha; nao ha segundo laco. E o vizinho suspeito tambem esta limpo: `linhasDeCodigo`/`codigoDe`
    (`fonte-scan.ts`) **nao tem estado de string algum** — so a guarda para nao cortar URL. Entao nao
    existem duas maquinas que possam divergir sobre o que e literal.
  argumento_da_interpolacao: >-
    ✅ **Correto, e por razao mais forte que a declarada.** O @dev justifica por semantica ("chave nao
    mora dentro de string"). A justificativa robusta e mecanica: a mascara so troca caractere por
    ESPACO, entao so pode **remover** casamentos. Para um `orgId` desmascarado casar `[,:}]` apos
    caracteres mascarados, o caractere imediatamente seguinte teria de ser a aspa que abre o literal —
    que nao e espaco nem `[,:}]`. **Logo a mascara nunca fabrica um casamento**: o pior que a
    interpolacao apagada pode causar e falso ALARME (vermelho), nunca falso verde. Procurei os tres
    contra-exemplos pedidos (chave computada com template literal, template tag, spread de objeto
    inline): todos caem nesse lado seguro — apagados, viram vermelho que nomeia o arquivo. Nenhum
    deles existe no corpus.
  segunda_bateria: >-
    ✅ **E a que vale, e eu nao herdei numero nenhum.** Nao conferi a bateria do @dev: re-rodei M6,
    M6-contraprova e o ataque do comentario eu mesmo, contra o arquivo **como esta em `261d542f`**
    (sha256 `a297fb67de912b49ca5f3df511c293a94e25ffb01fbef58c024f6f783c0b01fa`, conferido antes e
    depois de cada mutacao). A limpeza cosmetica nao muda nada do que medi.

rodada_3_issues:
  - id: QA-900-67-6
    severity: medium
    finding: >-
      🔴 **O gemeo por CONCATENACAO do QA-900-67-5 — a mascara fecha a interpolacao e deixa a
      concatenacao aberta.** O conserto apaga o CONTEUDO do literal; num template, `orgId` mora
      dentro do literal e morre. Numa concatenacao, `orgId` mora **fora** do literal — so as aspas e
      o miolo sao apagados — e o token chega intacto a regua, seguido da virgula que satisfaz
      `[,:}]`. E o MESMO refactor (carimbar a org na URL), escrito com `+` em vez de interpolacao.
      **Medido em dois call sites reais, `tsc --noEmit` rc=0 nos dois, suite 20/20 VERDE nos dois:**
      (1) `admin-invite.ts:296`; (2) `users/[id]/reset-password/route.ts` com `URLSearchParams`. Nos
      dois casos `orgId` chega `undefined`, `isMarcaTrifold` devolve `false` e **o e-mail perde a
      logo da Trifold em silencio** — exatamente o modo de falha que a AC11 existe para fechar.
    populacao_alcancavel: >-
      **9 de 9 call sites fiados.** A forma (1) e estreita — exige um token grafado `orgId` em escopo,
      e so `admin-invite.ts` tem. A forma (2) **nao exige nada disso**: basta aninhar um objeto
      literal com a chave `orgId` dentro do valor de qualquer opcao-irma, e os dois tipos de opcoes
      tem irma de tipo `string` escrita inline em **todos** os 9 sitios (`userName`/`actionLink`/
      `siteUrl` no `renderPasswordActionEmail`; `orgName` no `renderBaseLayout`). Medida direta em 2
      dos 9; o mecanismo e o mesmo nos outros 7 e nao depende de nome de variavel.
    mecanismo: >-
      `objetoDeOpcoes` esta CERTO nas duas vezes — devolve o objeto de opcoes e mascara os literais.
      Quem erra segue sendo o ultimo elo: `PASSA_ORG_ID` e um teste de PRESENCA DE TEXTO, e continua
      sem distinguir "`orgId` e CHAVE deste objeto" de "`orgId` e texto em algum lugar do codigo
      deste objeto". Apagar strings tirou UMA das fontes de texto alheio; sobraram a concatenacao e
      o objeto aninhado.
    suggested_owner: dev
    suggested_action: >-
      Parar de perguntar por texto e passar a perguntar por POSICAO: casar `orgId` so quando ele e
      chave **do nivel de topo** do objeto extraido — a mesma pilha que ja roda pode marcar, na mesma
      passada, quais indices estao no nivel do objeto de opcoes e fora de qualquer aninhamento. Ai o
      objeto aninhado, o `+ orgId` e a interpolacao caem juntos, sem mascara e sem terceira regua.
      Carrascos obrigatorios: **M7-CONCAT** e **M8-OBJETO-ANINHADO** 🔴, com M1/M2/M3/M5/M6 seguindo
      🔴 e os 9 sitios reais seguindo 🟢 (controle de falso alarme).

