story_title: "O logo da Trifold no cabeçalho do e-mail deixa de ser decidido por regex no nome, e passa a ser por org_id"
gate: CONCERNS
status_reason: >-
  **Rodada 3 — confirmacao final, escopo estreito (`4bafc03d` -> `261d542f`, um arquivo:
  `header-brand.test.ts`).** O conserto do QA-900-67-5 **procede e e carregador**: **M6 🔴 2/18**
  byte a byte como declarado, nomeando `src/lib/tenancy/admin-invite.ts` e derrubando a contagem
  1->0; **M6-contraprova com o predicado de `4bafc03d` 🟢 19/19** — foi o apagamento novo que matou.
  Reguas da raiz batem byte a byte: **318 arquivos · 4377 passed · 6 expected fail**. As duas
  checagens que o @dev pediu que eu nao elogiasse **confirmam-se as duas**: (a) o falso alarme do
  comentario colado na chave e **anterior** — restaurei o teste de `4bafc03d` e medi 🔴 **3/16** la,
  igual ao declarado; (b) `codigoDe`/`linhasDeCodigo` **nao tem estado de string nenhum** (so a
  guarda de `:` para URL), logo ha **um unico** lugar decidindo o que e literal — "sem segunda
  varredura" e verdade lida no codigo. **O argumento da interpolacao esta certo**, e por um motivo
  mais forte do que o declarado: a mascara so troca caractere por espaco, e para `orgId` sobreviver
  desmascarado o caractere seguinte tem de ser uma aspa — que nao e espaco nem `[,:}]`. Logo a
  mascara **nunca cria** um casamento; so pode gerar falso alarme, jamais falso verde. **Mas o
  furo nao estava na interpolacao — estava ao lado dela.** Abro o **QA-900-67-6**: o gemeo por
  CONCATENACAO do QA-900-67-5. Como a mascara apaga o CONTEUDO do literal e o token fica FORA
  dele, `actionLink + "&org=" + orgId,` satisfaz `PASSA_ORG_ID` intacto. Medido em call site real,
  `admin-invite.ts:296`: logo perdida, `tsc` rc=0, suite **20/20 VERDE**. E a segunda forma dispensa
  variavel local: `actionLink + "&" + new URLSearchParams({ orgId: appUser.org_id ?? "" }).toString()`
  em `users/[id]/reset-password/route.ts` — idiomatica, `tsc` rc=0, **20/20 VERDE**. **Populacao
  alcancavel: 9 de 9 sitios fiados**, porque a segunda forma so exige um objeto aninhado dentro do
  valor de qualquer opcao-irma. Pelo criterio de parada dito antes da medicao (>=1 sitio real
  => conserta antes do merge), **este gate nao vira PASS**.
