findings_corrigidos_no_gate:
  - severity: medium
    category: code
    description: "stripSystemBlocks marcava `stripped: true` a partir da SUSPEITA ('o texto contém [SISTEMA'), não da remoção. Variante não casada pelo regex (ex.: '[SISTEMAS: …]') vazaria E seria reportada como higienizada."
    resolution: "Removido o `\\b` após SISTEMA (a variante que o modelo inventa não é previsível) e `stripped` passou a sair da comparação `cleaned !== text`. 2 testes novos."
  - severity: high
    category: code
    description: "Se a resposta inteira fosse o bloco vazado, a higienização deixaria string vazia. O webhook envia `text: { body: response }` SEM guarda de vazio e a Graph API recusa corpo vazio — o cliente receberia silêncio. O AC5 teria trocado um vazamento por uma mensagem perdida."
    resolution: "Fallback neutro (SANITIZED_EMPTY_FALLBACK) quando a limpeza esvazia a fala; não afirma dia, horário nem disponibilidade. Coberto por teste ponta a ponta."

