status_reason: >
  Flip de DEFAULT_PREFS.whatsapp_enabled false→true em lib/notificacoes.ts. Como
  não há linhas em obra_notificacao_prefs (prefs_total=0), todos os clientes usam
  o default — então WhatsApp passa a disparar nos eventos de obra para clientes
  com users.phone preenchido (68/72 após 75-21) e org com whatsapp_config (1 ok).
  E-mail e demais defaults inalterados. typecheck e lint limpos. Envio em massa /
  consentimento LGPD: consideração explicitamente aceita pelo usuário; cliente pode
  desativar nas preferências. Recomendação operacional registrada: validar com um
  disparo de teste real antes de um evento de obra em massa.
