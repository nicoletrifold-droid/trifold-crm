    - n: 7
      consumidor: "NICOLE_HISTORY_TRUNCATED (o SÉTIMO, nascido na 87-8 depois desta story)"
      linha: "pipeline.ts:622-635"
      decisao: "o `count` passa a usar a MESMA ROLES_DE_HISTORICO da janela"
      vermelho_dedicado: "Q10 = 1"
