    A5_A6_A7_A8: { dono: "@po / @sm / backlog", prazo: "não bloqueia" }

  separacao_util:
    codigo: "LIBERADO PARA MERGE sob R1–R5"
    janela_de_observacao: "NÃO PRONTA até A3 + A4 — e é isso, e só isso, que mantém o gate em CONCERNS"

recomendacao_final: >
  **CONCERNS — liberado para o @devops sob as restrições de §7, sendo R1 BLOQUEANTE.**
  O código está sólido e a rede de testes é honesta: as 21 mutações mordem, os dois consertos de
  harness são reais (provados nas quatro células) e os hashes do turno-ouro eu capturei do `HEAD` com
  as próprias mãos. Os oito achados não são defeitos de código — são um buraco de cobertura que a
  própria story abriu (A1), duas réguas que vão medir a coisa errada em produção (A2, A3), um gatilho
  de rollback que a adição fora das ACs apagou sem substituir (A4) e quatro itens menores. A1, A3 e A4
  fecham em minutos e eu recomendo fechá-los ANTES do deploy A, porque os três são sobre **saber o
  que aconteceu depois** — e esta é uma story cujo tema declarado é não errar em silêncio.
