    entra em `buildNoReintroContext` (conta como "nosso lado") e SAI de `lastAssistantMsg` (não é
    fala da Nicole). É exatamente onde cada uma precisava estar, e há teste para as duas direções
    (AC3-i-c e AC4).

ac7_um_carregador_nao_dois:
  forma: 'grep -rn ''\.in("role"'' packages/ai/src packages/web/src'
  medido: >
    18 ocorrências no total. Em CÓDIGO DE PRODUÇÃO com lista de papéis de histórico de conversa: **3**,
    todas em `conversation-history.ts` (:283 janela, :309 count, :318 sinal fora da janela), e
    NENHUMA com literal inline — usam `ROLES_DE_HISTORICO` e `PAPEIS_DO_NOSSO_LADO`. O `enrich-leads`
    não tem mais nenhuma. As outras 15 são filtros de `users.role` e não contam.
  resultado: FECHA
  sobre_a_ressalva_do_dev: >
    A ressalva dele ("a régua de grep mede o arquivo, não a tela; 3 dos hits que sobram são
    comentários meus") é honesta e correta — conferi coluna a coluna, não pelo total.

superficie_publica_de_trifold_ai:
  pergunta: "a extração de `loadConversationHistory` para módulo próprio mudou o comportamento de algum outro consumidor?"
  forma: "grep de todos os símbolos novos em packages/ + inspeção do barril `packages/ai/src/index.ts` (`export * from './chat'`)"
  medido: >
    Os únicos consumidores dos símbolos novos são: `pipeline.ts` (que passou a importar em vez de
    definir), `handoff.ts` (só `type ConversationRole`), `haiku-enrichment.ts` (só `rotuloDeCorretor`)
    e `enrich-leads/route.ts`. Nenhum outro arquivo do monorepo importa `loadConversationHistory`,
    `HistoricoCarregado`, `ConversationMessage` ou `toAnthropicHistory`. Os exports são ADITIVOS —
    nenhum símbolo pré-existente foi removido nem teve assinatura alterada.
  guarda_da_87_8_sobreviveu_a_extracao:
    forma: "mutei o carregador NOVO e rodei a suíte inteira de packages/ai/src/chat (197 testes)"
    X2_cabeca_em_vez_de_cauda: "23 failed  ← a guarda da 87-8 está viva no módulo extraído"
    X4_reverse_removido: "17 failed"
    X3_desempate_por_id_removido: "1 failed"
    resultado: EXTRACAO_SEM_PERDA_DE_REDE

consulta_em_lote_do_nome:
  forma: "leitura de `normalizarLinhas` + mutação Q8 (N+1) e Q9 (ignora signed_as)"
  medido:
    - "Q8 (vira N+1) derruba 1 — a asserção `fake.calls.filter(c => c === 'select:users')` tem length 1 com 3 mensagens e 2 corretores. A régua existe e morde."
    - "Q9 (ignora `signed_as`) derruba 2 — a ordem de resolução medida em produção está travada."
    - "`signed_as` presente ⇒ ZERO consultas a `users` (asserção explícita). É o caminho de 61 % das mensagens."
  quando_a_consulta_dispara: >
    Só quando há mensagem `broker` na janela SEM `signed_as` e COM `sent_by` — pela medição do @dev,
    ~39 % das mensagens de corretor. Uma consulta a mais por turno, no máximo, nunca por mensagem.
  se_a_consulta_falhar:
    coberto: "`const { data } = await …` ignora o `error` e cai em `nomePorId` vazio ⇒ rótulo `[CORRETOR HUMANO]` sem nome. Testado (`sent_by` apontando p/ usuário inexistente) e a conversa não quebra."
    nao_coberto: "uma REJEIÇÃO de promise (não um `{error}`) propagaria e derrubaria o turno. O supabase-js resolve com `{error}` em vez de rejeitar no caminho normal, então a exposição é baixa — mas o `loadConversationHistory` não tem `try/catch` e a story diz literalmente 'Nunca falhar a conversa por causa do nome'."
    severidade: low
  rotulo_mentiroso: >
    Não é possível por construção: o nome só sai de `signed_as` (gravado pelo próprio remetente) ou
    de `users.name` resolvido pelo `sent_by`/`broker_id` daquela mensagem. Na ausência dos dois, o
    rótulo sai SEM nome — nunca com o nome errado. Q14 (rótulo sempre sem nome) derruba 4, o que
    prova que a presença do nome é medida e não decorativa.

# ════════════════════════════════════════════════════════════════════════════
# 6 · ACHADOS — o que sobra, com severidade
# ════════════════════════════════════════════════════════════════════════════
achados:

  - id: A1
    severidade: medium
    categoria: tests
    titulo: "🔎 ACHADO PRÓPRIO — remover `.eq(\"conversation_id\", conversationId)` do carregador derruba ZERO teste em TODA a suíte"
    forma: >
      Mutei `conversation-history.ts` removendo o predicado de conversa e rodei (a) só o
      `route.test.ts` do deploy B e (b) a suíte inteira de `packages/ai/src/chat`.
    medido: "(a) 29 passed (29) — zero vermelhos · (b) 197 passed (197) — zero vermelhos"
    porque_acontece:
      - "No deploy B, o mock de `route.test.ts` tem `eq: () => builder` — o `.eq()` NÃO é aplicado. É a MESMA família do `.in()` que o @dev acabou de consertar, no mesmo arquivo, uma linha acima."
      - "No deploy A, o `fake-supabase` APLICA o `.eq()` de verdade — mas NENHUMA fixture tem uma segunda conversa, então o predicado nunca discrimina. É o mutante colinear da 87-13/87-14: o vizinho sem guarda."
    nao_e_regressao: >
      O predicado está intacto no código e sempre esteve. Não há defeito presente. Mas esta story
      acabou de transformar essa função no carregador ÚNICO de dois consumidores em pacotes
      diferentes — a partir do merge, é a única rede entre um erro ali e o histórico de OUTRA conversa
      chegando ao prompt da Nicole e ao extrator que escreve em `leads`.
    recomendacao: >
      Uma fixture com DUAS conversas (`conv-1` e `conv-2`, com fala de corretor em ambas) afirmando
      que só a da conversa pedida volta. Fecha em minutos e mata a classe inteira. Idem para o
      `.eq()` do mock do cron, que continua frouxo.
    bloqueia_deploy: false

  - id: A2
    severidade: medium
    categoria: requirements
    titulo: "A afirmação '7 de 10' não pode ser publicada como taxa de produção"
    detalhe: "ver §4 · julgamento_da_conclusao_1 — direção sustentada (17/20, IC95% [62 %; 97 %]), taxa condicional e não declarada"
    recomendacao: "adotar a redação autorizada em §4 no Dev Agent Record, no PR e em qualquer comunicação ao Gabriel/Marcos"
    bloqueia_deploy: false

  - id: A3
    severidade: medium
    categoria: requirements
    titulo: "🔎 ACHADO PRÓPRIO — a AC12-(ii) é COLINEAR e vai medir a coisa errada"
    o_que_a_AC_diz: "'zero ocorrências de valor do corretor repetido por ela (busca textual nas respostas do período)'"
    o_que_eu_medi: >
      No `HEAD`, a Nicole cita a string "35 mil" em **5/10** das respostas — sempre para NEGAR
      ("fica em torno de 80 mil reais, não 35 mil"). Depois do deploy A: **0/10**. Uma busca textual
      não distingue CONFIRMAR de NEGAR. Quem rodar a mesma busca no antes e no depois vai concluir
      "o deploy acabou com a repetição de valor" — e o que o deploy acabou foi com a CONTRADIÇÃO,
      que é outra coisa.
    o_que_de_fato_se_move_e_nao_esta_em_AC_nenhuma: >
      A entrega da regra comercial interna "a entrada mínima é 20 %": **7/10 no `HEAD` → 0/10 depois**.
      E o valor interno "80 mil": **7/10 → 0/10**. Esta é a métrica que mede o valor da story, e ela
      não está em AC nenhuma.
    recomendacao: >
      Reescrever a AC12-(ii) em duas partes: (a) busca por valor do corretor em contexto de
      CONFIRMAÇÃO (o valor sem negação adjacente) — que continua sendo o gatilho da RN4; e (b) busca
      por regra comercial interna nas respostas ("entrada mínima", "20 %", "80 mil") em conversa com
      fala de corretor, com o antes medido. Sem (b), a validação de produção não observa o efeito
      real da story.
    bloqueia_deploy: false

  - id: A4
    severidade: medium
    categoria: code
    titulo: "🔎 ACHADO PRÓPRIO — o gatilho de rollback ficou estruturalmente INALCANÇÁVEL, e o sinal que sobra é compartilhado"
    detalhe: >
      O critério de rollback escrito na story é "o rótulo `[CORRETOR HUMANO` aparecendo em qualquer
      mensagem enviada ao lead". Com a higienização adicionada fora das ACs (`stripSystemBlocks`
      passa a remover o rótulo), isso **nunca** vai acontecer — a adição é boa para o lead e
      **apaga o gatilho**. O sinal que sobra é o evento `NICOLE_SYSTEM_BLOCK_LEAK`, que o @dev
      deliberadamente NÃO renomeou (correto: é o que a instrumentação lê) — mas o `metadata` só tem
      `lead_id` e `raw_message` truncado em 500 chars. **Não há campo que diga QUAL marcação vazou.**
      A série do evento passa a misturar dois fenômenos com causas e severidades diferentes.
    recomendacao: >
      Acrescentar `marcacao: "SISTEMA" | "CORRETOR_HUMANO"` (ou um array) ao `metadata` do emit em
      `pipeline.ts:1196`. É subtração de ambiguidade, não caminho novo. E reescrever o gatilho de
      rollback como "**o evento** `NICOLE_SYSTEM_BLOCK_LEAK` com marcação `CORRETOR_HUMANO`", já que
      a mensagem enviada nunca mais vai carregá-lo.
    bloqueia_deploy: false

  - id: A5
    severidade: low
    categoria: requirements
    titulo: "O deploy B muda o UNIVERSO de leads enriquecidos, não só o conteúdo — e isso não está declarado"
    detalhe: >
      A guarda do cron é `if (messages.length < 2) { skipped++ }`. Com o corretor entrando, uma
      conversa com 1 mensagem do lead e N do corretor deixa de ser pulada e passa a ser enriquecida —
      escrevendo em `collected_data` e `leads`. Pela medição do próprio @dev (broker 1.288/305 vs
      user 1.042/194), há conversas nessa forma. O Dev Agent Record trata o deploy B só como "o
      extrator passa a VER o corretor"; ele também passa a **agir sobre leads que antes ignorava**.
    recomendacao: "medir quantas conversas cruzam o limiar de 2 e incluir esse número na AC12-(iv), que hoje só olha 5 leads enriquecidos"
    bloqueia_deploy: false

  - id: A6
    severidade: low
    categoria: requirements
    titulo: "`NICOLE_HISTORY_TRUNCATED.total_na_conversa` muda de POPULAÇÃO no deploy A"
    detalhe: >
      O `count` passa de 2 para 3 papéis (correto — contar 2 enquanto a janela carrega 3 publicaria
      um total menor que o próprio limite). Consequência: a série histórica do evento fica
      **incomparável** antes/depois do deploy A. Quem for ler `M1`/`M4` pela rotina da 87-3 na janela
      de 24 h precisa saber que um salto em `total_na_conversa` é a story, não uma regressão.
    recomendacao: "carimbar a data/hora do deploy A como quebra de série na rotina da 87-3"
    bloqueia_deploy: false

  - id: A7
    severidade: low
    categoria: code
    titulo: "Fail-open do nome cobre `{error}`, não uma rejeição de promise"
    detalhe: "ver §5 · consulta_em_lote_do_nome. Exposição baixa (supabase-js resolve com `{error}`), mas a story diz 'nunca falhar a conversa por causa do nome' e não há `try/catch`."
    recomendacao: "envolver a consulta a `users` num try/catch que devolve o Map vazio"
    bloqueia_deploy: false

  - id: A8
    severidade: low
    categoria: docs
    titulo: "A contagem 'sete consumidores' está desatualizada pelo próprio trabalho"
    detalhe: "`temFalaDeCorretor` (pipeline.ts:723) é o 8º leitor de `history`, criado por esta story. Está coberto por 3 mutações — só a lista não o inclui."
    bloqueia_deploy: false

  - id: A9
    severidade: informativo
    categoria: requirements
    titulo: "AC12 inteira NÃO foi executada — e não pode virar torcida"
    detalhe: "ver §8"
    bloqueia_deploy: false

