  R_A1_a_justificativa_da_fixture_e_FALSA:
    severidade: low
    categoria: docs
    afirmacao_auditada: >
      "As mensagens da conversa alheia são deliberadamente mais recentes (10:40+ contra 10:01+) …
      Uma fixture com a outra conversa mais antiga passaria verde nos dois mundos."
      (comentário do bloco de isolamento + §v1.1 do Dev Agent Record + entrada 1.1 do Change Log)
    forma: >
      Reescrevi o helper `alheias` para gerar `created_at` em **09:01+** (uma hora ANTES da conversa
      pedida) e rodei duas células: código íntegro, e depois com o predicado da janela removido.
    medido:
      celula_1_fixture_ANTIGA_codigo_INTEGRO: "39 passed (39) — verde, como esperado"
      celula_2_fixture_ANTIGA_predicado_da_JANELA_removido: "2 failed | 37 passed"
      os_dois_vermelhos:
        - "isolamento > (i) a JANELA devolve só as mensagens da conversa pedida"
        - "isolamento > (ii) de ponta a ponta: nada da outra conversa chega ao prompt da Nicole"
    resultado: AFIRMACAO_REFUTADA
    o_que_de_fato_faz_o_teste_morder: >
      A asserção de **igualdade da lista inteira** (`toEqual` com os 3 conteúdos) e a **contagem
      exata** (`totalEntradas === 4`). Com 6 mensagens no total e `limit(20)`, **nada é expulso da
      janela em nenhum dos dois arranjos** — as 6 entram, e 6 ≠ 3. A recência é irrelevante para
      esses dois testes; ela só acrescenta **um** vermelho colateral (o "controle positivo", que cai
      de 3 → 2 no alvo isolado). Nos testes (iii) e (iv) a conversa trunca, mas as asserções também
      são de valor exato (`totalNaConversa === 22`, `nossoLadoFalouForaDaJanela === false`), e
      mordem igual.
    por_que_isso_importa_e_nao_e_preciosismo: >
      A escolha da fixture é boa e conservadora — mantenha. O problema é que o comentário **credita a
      proteção ao mecanismo errado**, e é exatamente a classe de defeito que o Epic 87 persegue: uma
      régua que se atribui um poder que não tem. Risco concreto e nomeável: alguém que confie no
      comentário e troque `toEqual` por `not.toContain("90 mil")` — achando que "a recência protege"
      — cria um verde falso justamente nas conversas longas, que são as que truncam. A frase segura é
      *"a régua é a igualdade da lista inteira; a recência é cinto e suspensório, não o cinto"*.
    bloqueia_deploy: false

  # ── A PERGUNTA QUE O @dev NÃO FEZ ─────────────────────────────────────────
  R_A2_existe_um_quarto_ponto_de_vazamento:
    resposta: "SIM — e ele não é um quarto `.eq(\"conversation_id\")`. É o EIXO QUE NÃO EXISTE: organização."
    severidade: informativo_hoje / medium_no_pivo_SaaS
    o_achado: >
      As três mutações do @dev cobrem o eixo **conversa**, e o cobrem bem. Mas **nenhuma das quatro
      consultas do carregador tem escopo de ORGANIZAÇÃO**, e o único lugar que poderia reconciliar os
      dois eixos — o `pipeline.ts` — lê DOIS valores de org de fontes diferentes e **nunca os
      compara**:
        · `params.orgId` decide o prompt (`loadAgentConfig`, :545) e os empreendimentos (`loadProperties`, :588);
        · `conversation.org_id`, lido do banco em `:615`, decide onde ESCREVE (appointments :1453, activities :1515/:1564, handoff :1600).
      No webhook do WhatsApp os dois nascem separados: `orgId = config.org_id` (do número de telefone,
      `route.ts:400`) e `conversationId = conversation.id` (:601). Se divergirem, o carregador entrega
      o histórico sem uma linha de defesa — é literalmente *"informação de outra conversa, de outro
      lead"*, no eixo que ninguém testou.
    exposicao_pratica_hoje: >
      **ZERO.** Conferi por Management API: `agent_config` tem **uma única linha**, org
      `00000000-0000-0000-0000-000000000001`. Com uma org só, os dois valores não podem divergir.
      Mas o **pivô SaaS multi-tenant está no roadmap**, e esta função acabou de virar o carregador
      único de dois consumidores — é o momento certo de registrar, não de consertar.
    sub_achado_medido:
      titulo: "a consulta a `users` (`:236`) é a ÚNICA do carregador sem escopo NENHUM — nem conversa, nem org"
      forma: "troquei `.select(\"id, name\").in(\"id\", idsParaResolver)` por `.select(\"id, name\")` e rodei a suíte inteira"
      medido: "2407 passed | 6 expected fail — ZERO vermelhos"
      classificacao: MUTANTE_EQUIVALENTE
      leitura: >
        É equivalente **no comportamento** e nenhum teste deveria cair: o `Map` só é consultado por
        id, então o resultado observável é idêntico. Mas **não é equivalente no risco**: passa a
        trazer a tabela `users` inteira para a memória do turno, com client de service-role (RLS
        desligada). Nenhuma das três mutações do @dev alcança este ponto, e **nenhum teste
        alcançaria** — é achado de leitura, não de mutação. Por isso está aqui e não como pedido de
        teste novo.
    recomendacao:
      - "abrir item em `docs/backlog.md`: reconciliar `params.orgId` × `conversation.org_id` no pipeline (uma comparação e um evento), como pré-requisito do pivô multi-tenant"
      - "manter o `.in(\"id\", idsParaResolver)` — ele não tem rede de teste, e a leitura é a única guarda"
    bloqueia_deploy: false

  R_A3_o_change_log_NAO_basta_e_agora_com_numero:
    severidade: low
    pergunta: "marcar a 1.0 como superada e colar a redação autorizada na 1.1 é suficiente?"
    resposta: "NÃO — a ressalva ficou REFERENCIAL, não local"
    medido:
      ocorrencias_de_7_10_na_entrada_1_0: 2
      quais: >
        (a) "em **7/10** ela **contradiz a negociação fechada** … entregando regra comercial interna";
        (b) "em **7/10** ela diz ao lead que a mensagem do corretor *'não era pra você'*".
        As DUAS conclusões, as duas soltas.
      palavras_de_ressalva_dentro_da_propria_entrada_1_0:
        "superad": false
        "v1.1": false
        "condicional": false
        "IC95": false
        "denominador": false
      leitura: "a entrada 1.0 é um parágrafo único de ~4.000 caracteres, e não contém UMA palavra de ressalva"
    mitigacao_real_que_existe:
      medido: "a tabela do Change Log está em ordem DESCENDENTE — a entrada 1.1 (linha 1315) vem ANTES da 1.0 (linha 1316)"
      leitura: "quem lê sequencialmente encontra a correção primeiro. É mitigação de verdade e eu a credito."
    porque_ainda_assim_nao_basta: >
      Quem faz `grep "7/10"`, quem abre a story no meio, ou quem copia a linha 1.0 para um resumo de
      PR — leva o número solto, e **nas duas conclusões**. A ressalva mora a um parágrafo de distância,
      numa linha diferente da tabela.
    recomendacao: >
      Não reescrever o histórico (o ponto de um Change Log é preservar o que foi afirmado). Inserir na
      própria entrada 1.0, **imediatamente depois de cada uma das duas ocorrências**, um marcador
      inline de uma linha: *"⚠️ número superado na v1.1 — taxa condicional, ver acima"*. É exatamente
      a disciplina que o próprio @dev aplicou ao `NICOLE_SYSTEM_BLOCK_LEAK`: o identificador não muda,
      só a frase. Duas inserções.
      *(Não executei: por `story-file-permissions` só posso editar a seção QA Results.)*
    bloqueia_deploy: false

  # ── JULGAMENTO PEDIDO ─────────────────────────────────────────────────────
  julgamento_da_regua_aplicada_a_conclusao_2:
    o_que_o_dev_escreveu: >
      "7/10 na minha amostra e 5/10 na do @qa, 12 de 20 agregado (60 %, IC95 % [36 % ; 81 %]),
      condicional ao mesmo cenário. O que decide não é a contagem bruta (em contagem bruta B não é
      pior que o `HEAD`) e sim a natureza: é um defeito novo, que não existe hoje em produção e seria
      criado pelo deploy."
    veredito: CONCORDO_INTEGRALMENTE
    conferencia_aritmetica: "12/20 = 60 %, Clopper-Pearson 95 % = [36,1 % ; 80,9 %] — bate com o meu cálculo independente"
    merito: >
      Ele aplicou a régua a si mesmo numa afirmação que **ninguém tinha cobrado** e que sustentava a
      restrição mais dura do gate. Reconhecer que "em contagem bruta B não é pior que o `HEAD`" —
      quando essa contagem é justamente o que enfraquece o próprio argumento dele — é a leitura
      honesta, e é a certa.
    dois_reforcos_que_ele_nao_usou_e_que_deixam_o_R1_mais_forte:
      1_assimetria_de_reversibilidade: >
        A e B **não são comparáveis na mesma escala**. A é dano **herdado** — está em produção há
        meses e o rollback NÃO o remove, porque ele É o estado atual. B seria dano **criado**, e o
        rollback o remove. Um regime de deploy avalia a **variação**, não o nível: por isso "B tem
        contagem bruta menor que A" é irrelevante, e não só secundário.
      2_R1_e_robusta_a_TODO_o_intervalo: >
        Esta é a razão decisiva e ela dispensa o ponto estimado: o custo de **não** fatiar é **zero**
        (não fatiar é o default), e o benefício evita um defeito cujo limite inferior do IC é **36 %**.
        **Mesmo no pior canto do intervalo a decisão é idêntica.** Uma restrição de deploy que
        sobrevive ao limite inferior do próprio IC não precisa que o ponto esteja certo — e é
        exatamente esse teste que R1 passa. Registro isto porque é o que responde a um eventual
        *"mas 12/20 é pouco"*: não é pouco nem muito, é **irrelevante para a decisão**.
    conclusao: "R1 permanece BLOQUEANTE, agora com fundamento que não depende da amostra"

  itens_do_round_1_que_seguem_ABERTOS:
    nota: >
      O @dev declarou deliberadamente que não os faria por serem reescrita de AC (@po/@sm). **A
      delegação está correta** e eu a endosso — mas os itens seguem abertos, e são o que sustenta o
      CONCERNS agora.
