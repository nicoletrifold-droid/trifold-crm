# 2 · Os dois verdes falsos — PROVA DUPLA, quatro células cada
# ════════════════════════════════════════════════════════════════════════════
# "Consertei e remedi (0→1)" é uma afirmação sobre DOIS mundos. Testei os dois.

prova_dupla_verde_falso_1_mock_do_cron:
  hipotese: "o `.in()` do mock era `() => builder` e não filtrava papel nenhum"
  celulas:
    - cenario: "mock ANTIGO (revertido por mim) · SEM mutação"
      medido: "29 passed (29)"
    - cenario: "mock ANTIGO · COM a mutação do filtro (B2)"
      medido: "29 passed (29)  ← ZERO vermelhos. O VERDE FALSO REPRODUZIDO."
    - cenario: "mock NOVO · COM a mutação do filtro (B2)"
      medido: "1 failed | 28 passed  ← o conserto morde"
  resultado: CONSERTO_REAL
  leitura: >
    Confirmado de primeira mão: antes do conserto, o teste provava a existência da FIXTURE, não a do
    filtro. É a mesma família da 87-13 (7/7 verde com o filtro removido) e da 75-270.

prova_dupla_verde_falso_2_AC5_ii_bloco_cacheavel:
  hipotese: "a AC5-(ii) era medida sobre a string CONCATENADA do `system`, que é idêntica nos dois mundos"
  celulas:
    - cenario: "sem o teste (ii-b) · SEM mutação"
      medido: "33 passed | 1 skipped"
    - cenario: "sem o teste (ii-b) · COM a mutação C2 (instrução movida p/ bloco estático cacheável)"
      medido: "33 passed | 1 skipped  ← ZERO vermelhos. O VERDE FALSO REPRODUZIDO."
    - cenario: "com o teste (ii-b) · COM a mutação C2"
      medido: "1 failed | 33 passed  ← o conserto morde"
  resultado: CONSERTO_REAL
  leitura: >
    A AC é sobre ESTRUTURA (bloco a bloco, com `cache_control`), e só o array a enxerga. O teste
    (ii-b) captura `cache_control` bloco a bloco — é a asserção certa para a AC certa.

