# 8 · 🔴 AC12 — o que este gate NÃO pode afirmar, e o carimbo contra a torcida
# ════════════════════════════════════════════════════════════════════════════
ac12_validacao_em_producao:
  status: NAO_EXECUTADA
  razao: "é validação pós-deploy; o código não está no ar"
  carimbo_obrigatorio: >
    🔴 **A janela de 24 h do deploy A tem ~21 % de chance de produzir um caso de reativação
    espontâneo** (0,23 evento/dia, e só 10 das 305 conversas com corretor ainda têm
    `is_ai_active = true`). **Se a janela não produzir um caso, o resultado é INCONCLUSIVO — jamais
    "sem regressão".** Uma AC que espera um evento que provavelmente não acontece na janela não é
    validação, é torcida. Quem fechar a AC12-(i) sem o turno provocado e colado com horário está
    fechando uma AC vazia.
  o_que_fecha_a_AC12_i: "cenário PROVOCADO com telefone de teste (conversa com fala de corretor · IA reativada · lead volta a escrever), turno colado com horário — exatamente como a AC10 da 87-4"
  correcao_pedida_na_AC12_ii: "ver achado A3 — a busca textual como está é colinear"
  responsavel_nomeado: "AINDA NÃO DEFINIDO (Marcos ou Thielly). Por D7, **sem responsável nomeado o deploy não sai** — e este gate não o supre."
  ac12_iv_deploy_B: "amostra de 5 leads enriquecidos + (recomendado, achado A5) a contagem de conversas que cruzaram o limiar de 2 mensagens"

