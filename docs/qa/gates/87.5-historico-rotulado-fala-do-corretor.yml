# 3 · AC10 — o turno-ouro, capturado POR MIM no HEAD (não relatado)
# ════════════════════════════════════════════════════════════════════════════
ac10_verificacao_independente:
  forma: >
    `git worktree add … 24800872`, `node_modules` linkado, capturador próprio escrito por mim
    (mesmo seed, mesmo relógio `2026-08-12T13:00:00Z`, mesmo `createFakeSupabase`, mesma fixture),
    chamando o `processMessageWithMetadata` DO HEAD e imprimindo sha256(system) + length.
  medido_no_HEAD:
    - turno: "(a) 4 msgs, com fala da Nicole"
      sha256: "3ec9480d84f943732ccc4f2ce4e760a2db110c16de7114e207dd5e7405eb0aa3"
      length: 30256
      papeis: '["user","assistant","user","assistant","user"]'
      bloco: '"qual o preço?"'
    - turno: "(b) primeira mensagem, só o lead"
      sha256: "d634f39ecc852edb9c55c1ad8069c5a946cc82138853d159110b813153183371"
      length: 30082
      papeis: '["user","user"]'
      bloco: '"tem apartamento de 3 quartos?"'
  resultado: CONFERE_BYTE_A_BYTE
  sobre_a_regua_que_nasce_satisfeita: >
    A objeção "medir 'aparecem os três papéis' não distingue nada" está respondida no desenho do
    teste, e eu conferi: as asserções são sobre POSIÇÃO e CONTEÚDO exatos (`historico[2]` é
    literalmente o rótulo + a fala) e `papeisComAtual` é comparado com `toEqual`, não com `contains`.
    O cenário (b) MOVE o hash (30.082 ≠ 30.256), então a régua acompanha o `dynamicSuffix` em vez de
    ser constante de natureza — a ressalva do @dev sobre os três turnos-ouro da 87-8 darem o mesmo
    hash é honesta e a solução dele (trocar o terceiro por um cenário que move) é a certa.

