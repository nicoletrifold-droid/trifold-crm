round_2_escopo: >
  Re-gate FOCADO nos dois itens devolvidos ao @dev (A1 e A2). NÃO reabri as 21 mutações, os sete
  consumidores nem os hashes da AC10 — continuam valendo do round 1. R1 (indivisibilidade de deploy)
  e AC12 (inconclusiva por desenho) ficam como estavam.
round_2_resumo: >
  **Os dois itens estão fechados, e o A1 foi fechado com mais rigor do que eu pedi.** Confirmei as
  três contagens por mutação própria contra a suíte inteira — **4 / 1 / 1, conjuntos DISJUNTOS**,
  nenhum teste cai em duas mutações. Confirmei a célula que fecha o argumento do mock: com o `.eq()`
  antigo o teste de isolamento do cron falha **mesmo com o código de produção íntegro**. Réguas
  remedidas: **187 · 2.407 passed · 6 expected fail**, `tsc` 0/0, lint 0/23 — e o **`md5` de
  `conversation-history.ts` está de volta ao original** (`79e6596f…`): confirmo que **nenhuma linha
  de produção mudou** neste round, o que baixa o risco do PR para o de uma entrega só-de-teste.
  **Três achados novos, nenhum bloqueante.** (R-A1) A justificativa escrita da fixture é **falsa** —
  medi, e com a conversa alheia mais ANTIGA a mutação da janela **continua derrubando 2**; o que faz
  o teste morder é a asserção de igualdade de lista, não a recência. (R-A2) Existe sim um quarto
  ponto, e ele não é um quarto `.eq("conversation_id")`: é **o eixo que não existe — organização**.
  (R-A3) O Change Log não basta, e agora com número: **duas** ocorrências de "7/10" na entrada 1.0
  sem **uma única** palavra de ressalva local.
  **O código está liberado para merge sob R1–R5. O que sustenta o CONCERNS agora não é o código: é
  que a JANELA DE OBSERVAÇÃO não está pronta** — A3 (AC12-ii colinear) e A4 (gatilho de rollback sem
  sinal distinguível) continuam abertos e foram delegados ao @po/@sm, corretamente. Eles precisam
  fechar **antes da janela de 24 h**, não antes do merge.
branch: "main em 24800872 — tudo no working tree, nada commitado"
po_validation: "docs/qa/po-validation-87-3-87-4-87-5.md (GO condicional 8/10, seis correções aplicadas)"
nao_confundir_com: "PR #425 (Story 87-14) está ABERTO e não mergeado; conferi os 9 arquivos dele — são DISJUNTOS dos desta story"

status_reason: >
  **Reproduzi tudo do zero e o código aguenta.** Vinte e uma mutações aplicadas por mim ao código
  (não ao relato), cada uma com aplicar · rodar · ler · reverter · conferir `md5`: as vinte e uma
  produzem vermelho, e as contagens batem ou superam as declaradas. Os **dois verdes falsos** que o
  @dev diz ter consertado eu provei com a matriz de quatro células (com/sem a guarda × com/sem a
  mutação): com o harness antigo a mutação derrubava **ZERO** nos dois casos, com o novo derruba 1 —
  os consertos são reais, não declaratórios. **Os dois hashes do turno-ouro da AC10 eu capturei eu
  mesmo num worktree em `24800872`** e batem byte a byte (`3ec9480d…`/30.256 e `d634f39e…`/30.082),
  com papéis e bloco idênticos. Réguas conferidas: suíte **187 · 2.401 passed · 6 expected fail**,
  `tsc` **0** em `packages/web` e **0** em `packages/ai`, `turbo lint --force` **0 errors / 23
  warnings** — os quatro números do Dev Agent Record estão certos.

  **Reproduzi o experimento contra o modelo de produção, e o `HEAD` é PIOR do que o @dev relatou.**
  Confirmei antes por Management API que `agent_config.model_primary = claude-sonnet-4-6` e
  `temperature = 0.70` — o modelo que ele usou É o de produção. Com o payload literal despejado do
  pipeline (3 variantes, n=10 cada, 30 chamadas reais): na variante `HEAD` ela contradisse a
  negociação em **10/10** (o @dev mediu 7/10) e entregou a regra comercial interna *"a entrada mínima
  é 20 %"* em **7/10**, com o valor interno *"80 mil"* em **7/10**. Com o rótulo e sem a instrução,
  **5/10** disseram ao lead que a mensagem do corretor *"não era pra você / foi por engano"*. Com a
  instrução, **10/10** atribuíram ao corretor e **0/10** vazaram o rótulo. **A conclusão nº 2 do @dev
  está sustentada e virou restrição BLOQUEANTE de fatiamento neste gate.**

  **O que me impede de dar PASS são cinco coisas, e nenhuma é defeito de código.** (1) Achei, por
  mutação que ninguém pediu, que **remover `.eq("conversation_id", conversationId)` do carregador
  derruba ZERO teste em toda a suíte** — o predicado não foi tocado por esta story, mas a story
  acabou de fazer dele o carregador único de dois consumidores, e essa é agora a única rede. (2) A
  afirmação *"hoje, em produção, ela contradiz negociação fechada em 7 de 10"* **não pode ser
  publicada como está**: n=10 numa única fixture, sem denominador declarado — é a mesma classe de
  defeito que o @po cobrou desta própria story na condição de escape. (3) A **AC12-(ii) é colinear**
  e vai medir a coisa errada. (4) O **gatilho de rollback ficou estruturalmente inalcançável** e o
  sinal que sobra é compartilhado com o `[SISTEMA]`. (5) O deploy B **muda o universo de leads
  enriquecidos**, não só o conteúdo — e isso não está declarado.

