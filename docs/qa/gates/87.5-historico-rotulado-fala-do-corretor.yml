# ════════════════════════════════════════════════════════════════════════════
deploy:

  R1_rotulo_e_instrucao_sao_INDIVISIVEIS:
    severidade: BLOQUEANTE
    razao: >
      Medido por mim contra o modelo de produção: com o rótulo e SEM a instrução, em **5/10** a
      Nicole diz ao lead que a mensagem do corretor "não era pra você / foi por engano" — desmentindo
      a conversa real. Esse defeito NÃO existe hoje em produção; seria criado pelo deploy. É o único
      jeito conhecido de esta story piorar produção.
    o_que_NAO_pode_ser_separado_do_deploy_A:
      - "packages/ai/src/chat/conversation-history.ts (o arquivo inteiro)"
      - "pipeline.ts — a constante `CONTEXTO_FALA_DE_CORRETOR`"
      - "pipeline.ts:723 — `const corretorContext = temFalaDeCorretor(history) ? … : \"\"` e a soma dele ao `dynamicSuffix` (linha 740)"
      - "pipeline.ts:1113 — `...toAnthropicHistory(history)`"
      - "pipeline.ts — `MARCACOES_INTERNAS` + os dois `.replace` de `[CORRETOR HUMANO` em `stripSystemBlocks`"
      - "pipeline.ts:867 — `lastAssistantMsg` restrito (AC3: sem isto, o gate de agendamento passa a ligar por fala de corretor)"
    regra: "se QUALQUER um destes ficar fora do PR do deploy A, o deploy A NÃO SAI."

  R2_deploy_A_sozinho:
    arquivos_do_deploy_A:
      - "packages/ai/src/chat/conversation-history.ts (novo)"
      - "packages/ai/src/chat/pipeline-corretor-no-historico.test.ts (novo)"
      - "packages/ai/src/chat/pipeline.ts"
      - "packages/ai/src/chat/index.ts"
      - "packages/ai/src/flows/handoff.ts"
      - "packages/ai/src/chat/pipeline.test.ts"
      - "packages/ai/src/flows/handoff.test.ts"
      - "docs/backlog.md · docs/stories/87-5-… · docs/qa/gates/87.5-…"
    o_que_NAO_pode_subir_junto: "os TRÊS arquivos do deploy B, nomeados em R3"

  R3_deploy_B_em_PR_PROPRIO_e_>=24h_depois:
    arquivos_do_deploy_B_exatamente_tres:
