      nota: "INVISÍVEL ao type-check em qualquer variante. A rede é teste, e só teste — está nomeado no código e no Dev Agent Record. Correto."
    - n: 3
      consumidor: "fronteira da Anthropic (toAnthropicHistory)"
      linha: "pipeline.ts:1113"
