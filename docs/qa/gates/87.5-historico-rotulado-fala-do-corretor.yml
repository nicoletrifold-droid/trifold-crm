# 4 · O EXPERIMENTO COM O MODELO — reproduzido do zero
# ════════════════════════════════════════════════════════════════════════════
experimento_llm:
  reproduzido_por_mim: true
  modelo_de_producao_confirmado:
    forma: "Supabase Management API sobre dsopqkqjkmhytudaaolv: `select model_primary, temperature from agent_config`"
    medido: "model_primary = claude-sonnet-4-6 · temperature = 0.70 · max_tokens = 1024"
    nota: >
      Conferi porque `ANTHROPIC_MODELS.sonnet` em `client/anthropic.ts` diz `claude-sonnet-5` — mas
      a Nicole NÃO usa essa constante: usa `agentConfig.model_primary`, lido do banco. O modelo que o
      @dev testou É o de produção. A constante `sonnet` serve a outros consumidores.
  metodo: >
    Payload LITERAL despejado do próprio pipeline em 3 variantes (dump temporário, já removido):
    A = worktree no HEAD `24800872` (cega ao corretor, 3 entradas);
    B = código atual com `corretorContext = ""` (rótulo SEM instrução, 4 entradas);
    C = código atual (rótulo COM instrução, 4 entradas, system +558 bytes).
    n=10 por variante, 30 chamadas reais, `claude-sonnet-4-6`, temperature 0.7, system e messages
    exatamente como o pipeline monta. Classificação por leitura das 30 respostas + verificação
    programática por regex.
  medido_por_mim:
    A_HEAD_cega:
      contradiz_a_negociacao: "10/10"
      entrega_a_regra_interna_entrada_minima_20pct: "7/10"
      entrega_o_valor_interno_80_mil: "7/10"
      repete_ou_confirma_o_valor_do_corretor: "0/10"
      diz_engano: "0/10"
      atribui_ao_corretor: "0/10"
      vaza_o_rotulo: "0/10"
    B_rotulo_SEM_instrucao:
      contradiz_a_negociacao: "1/10"
      diz_que_foi_engano_nao_era_pra_voce: "5/10"
      atribui_ao_corretor: "0/10"
      repete_ou_confirma_o_valor: "0/10"
      vaza_o_rotulo: "0/10"
    C_rotulo_COM_instrucao_a_story:
      atribui_ao_corretor: "10/10"
      contradiz: "0/10"
      diz_engano: "0/10"
      entrega_regra_interna: "0/10"
      repete_ou_confirma_o_valor: "0/10"
      vaza_o_rotulo: "0/10"
  amostra_literal_do_HEAD: >
    [A1] "Sandra, a entrada mínima é de 20% do valor do imóvel, que fica em torno de 80 mil reais.
    Ela não é parcelada em 10x." · [A10] "a entrada do Vind fica em torno de 80 mil reais, não 35
    mil. A entrada mínima é 20% do valor do imóvel, e isso é fixo pra todos os empreendimentos da
    Trifold."
  amostra_literal_do_rotulo_SEM_instrucao: >
    [B4] "espera um segundo! Essa última mensagem não era pra você, foi um erro meu aqui interno." ·
    [B8] "essa mensagem anterior não foi minha, tá? Parece que caiu aqui por engano."

  # ── O JULGAMENTO que o gate foi mandado fazer ─────────────────────────────
  julgamento_da_conclusao_1:
    afirmacao_do_dev: "Hoje, em produção, ela contradiz negociação fechada em 7 de 10."
    veredito: "DIREÇÃO SUSTENTADA · NÚMERO NÃO PUBLICÁVEL COMO TAXA DE PRODUÇÃO"
    porque_a_direcao_se_sustenta: >
      Duas amostras independentes de n=10, colhidas por pessoas diferentes com payloads montados
      separadamente, deram 7/10 e 10/10. Agregadas: **17/20 = 85 %, IC95% [62,1 % ; 96,8 %]** — o
      limite inferior está muito acima de qualquer leitura de "acontece às vezes". O fenômeno é
      real, robusto e a minha medição é MAIS grave que a dele.
    porque_o_numero_nao_pode_ser_publicado_assim:
      - "**n=10 numa fixture é n=10 numa fixture.** O IC95% de 7/10 sozinho é [34,8 % ; 93,3 %] — uma
        largura de 58 pontos. Escrever '7 de 10' sugere precisão que a amostra não tem."
      - "**O denominador não está declarado, e é condicional.** A fixture é o pior caso construído: a
        ÚLTIMA fala do histórico é do corretor fechando negócio e a mensagem do lead pede confirmação
        explícita do valor. Isso é o cenário de REATIVAÇÃO, medido pelo próprio @dev em 10 conversas
        / 30 respostas em 30 dias — não é a população dos turnos da Nicole. A taxa correta é
        'condicional ao cenário de reativação com valor fechado na última fala', e nessa forma ela é
        útil e defensável."
      - "**Uma única fixture, um único empreendimento, um único valor, uma única redação.** O @dev
        variou a redação apenas para testar 'repete o valor' (0/9), não para 'contradiz'. A afirmação
        generaliza sobre 'negociação fechada', que é uma classe muito maior do que o que foi medido."
      - "**É a mesma classe de defeito que o @po cobrou DESTA story** na condição de escape (§ 'os
        quatro denominadores') e que já custou caro na 87-3: régua percentual sem denominador
        declarado responde o que quiserem perguntar."
    redacao_que_o_gate_autoriza: >
      "No cenário de reativação com valor fechado na última fala do corretor, o `HEAD` contradisse a
      negociação em 17 de 20 execuções (85 %, IC95% [62 % ; 97 %]; duas amostras independentes de
      n=10 contra `claude-sonnet-4-6` em temperatura 0,7, fixture única) — e em 7 de 10 entregou ao
      lead a regra comercial interna 'a entrada mínima é 20 %'. A taxa é condicional a esse cenário e
      NÃO é a taxa dos turnos da Nicole."
  julgamento_da_conclusao_2:
    afirmacao_do_dev: "Subir o rótulo SEM a instrução seria pior que não subir nada."
    veredito: "SUSTENTADA NA SUBSTÂNCIA · CARIMBADA COMO RESTRIÇÃO BLOQUEANTE DE DEPLOY (ver §7)"
    ressalva_honesta: >
      Na minha amostra, B produziu 6/10 respostas defeituosas (5 "engano" + 1 contradição com regra
      interna) contra 10/10 de A — ou seja, em CONTAGEM BRUTA a variante B não é pior que o `HEAD`.
      O que é inegável, e é o que importa, é que B introduz um defeito **novo e de outra natureza**:
      a Nicole desmentindo ao lead uma conversa real do corretor ("essa mensagem não era pra você").
      Isso não existe hoje em produção — seria dano criado pelo deploy, não dano herdado.
      Agregando as duas amostras: **12/20 = 60 %, IC95% [36,1 % ; 80,9 %]**.
    consequencia_operacional: >
      Rótulo e instrução são UM artefato indivisível. Fatiar os dois em PRs diferentes é o único jeito
      conhecido de esta story piorar produção. Ver a lista nominal de símbolos em §7.

