issues:
  - id: A11Y-001
    severity: low
    category: code
    finding: >
      O slide-over não implementa focus trap — com o painel aberto, Tab pode mover o foco
      para o conteúdo de fundo (a página não fica inert/aria-hidden). Escape, backdrop,
      retorno de foco ao gatilho e foco inicial no botão Fechar estão corretos. Consistente
      com o padrão leve de overlay do projeto (quick-history-modal.tsx).
    suggested_action: >
      Não-bloqueante. Se for adotada uma camada de modal acessível no futuro (focus-trap/
      inert no background), aplicar uniformemente aos overlays do projeto.
    suggested_owner: dev
  - id: SCOPE-002
    severity: low
    category: requirements
    finding: >
      "Transferir corretor" (TransferBrokerSection) permanece exclusivo de
      lead-detail-drawer.tsx (admin/supervisor) e fora de page.tsx — corretamente excluído
      do escopo (portá-lo seria nova funcionalidade).
    suggested_action: "Nenhuma. Se necessário em page.tsx no futuro, criar story dedicada."
    suggested_owner: sm

