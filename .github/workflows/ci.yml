# Story 900-1 — a primeira verificação automática deste repositório.
#
# Até hoje o repo não tinha CI nenhum (.github/ só continha agents/). Nada impedia que um
# PR com type error, lint quebrado ou teste vermelho chegasse à main. Este workflow fecha
# isso, e nada mais — ele NÃO altera código de aplicação.
#
# Ele é incremental por desenho: as ondas seguintes do Epic 900 PENDURAM JOBS aqui
# (900-2c, 900-17 e 900-18 acrescentam os seus). Nunca reescreva este arquivo — acrescente
# job. Esta esteira não referencia nenhum gate de onda futura, de propósito: a AC8 da
# 900-1 verifica isso por grep, para a esteira não nascer acoplada ao que ainda não existe.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Um PR que recebe vários pushes seguidos não precisa manter as execuções antigas vivas.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: type-check · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Instala pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Instala Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # cache do store do pnpm — a chave sai do pnpm-lock.yaml automaticamente
          cache: pnpm

      - name: Instala dependências
        run: pnpm install --frozen-lockfile

      # Cache do turbo: sem ele, cada job reexecuta tudo do zero mesmo sem mudança.
      - name: Cache do turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # Os três passos rodam com `if: always()` (menos o primeiro) para que um PR com
      # problemas em mais de uma frente mostre TODOS de uma vez. Um relatório por push
      # vale mais que três rodadas de correção em série.
      - name: type-check
        id: typecheck
        run: pnpm type-check

      - name: lint
        id: lint
        if: always() && steps.typecheck.conclusion != 'cancelled'
        run: pnpm lint

      - name: test
        id: test
        if: always() && steps.typecheck.conclusion != 'cancelled'
        run: pnpm test

      # Falha o job se QUALQUER um dos três falhou. Necessário porque o `if: always()`
      # acima permite que os passos seguintes rodem depois de uma falha — sem esta
      # barreira, o job terminaria verde com passo vermelho.
      - name: Resultado
        if: always()
        run: |
          echo "type-check: ${{ steps.typecheck.outcome }}"
          echo "lint:       ${{ steps.lint.outcome }}"
          echo "test:       ${{ steps.test.outcome }}"
          if [ "${{ steps.typecheck.outcome }}" != "success" ] \
          || [ "${{ steps.lint.outcome }}"      != "success" ] \
          || [ "${{ steps.test.outcome }}"      != "success" ]; then
            echo "::error::Um ou mais checks falharam."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Story 900-2c — gate de isolamento multi-tenant.
  #
  # NÃO-BLOQUEANTE NESTA ONDA (`continue-on-error: true`), e a razão é de sequência,
  # não de confiança: o gate acusa 83 violações herdadas, e travar PRs por dívida
  # pré-existente pararia o desenvolvimento sem corrigir nada. A `900-18` remove o
  # `continue-on-error` na saída da Onda 1, quando o baseline chegar a zero.
  #
  # ⚠️ A consequência precisa ser dita: o script retorna 1 numa regressão real (violação
  # nova, total em alta ou qualquer R3) e **o PR passa assim mesmo**. Quem lê só o
  # ✅ do CI não vê. Por isso o job publica um comentário no PR — é ele que carrega o
  # sinal enquanto o job não trava.
  # ---------------------------------------------------------------------------
  tenancy-gate:
    name: gate de tenancy (não-bloqueante)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          # R9 compara as migrations deste PR com a base — precisa do histórico, não de um
          # checkout raso, senão a regra se abstém em silêncio e ninguém nota.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instala dependências
        run: pnpm install --frozen-lockfile

      - name: Roda o gate
        id: gate
        env:
          SUPABASE_MANAGEMENT_PAT: ${{ secrets.SUPABASE_MANAGEMENT_PAT }}
          GATE_TENANCY_BASE: origin/${{ github.base_ref || 'main' }}
        run: |
          set +e
          pnpm gate:tenancy 2>&1 | tee /tmp/gate.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Publica o relatório no PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/gate.log', 'utf8');
            const code = '${{ steps.gate.outputs.exit_code }}';
            const veredito = code === '0'
              ? '✅ **Catraca OK** — a dívida de isolamento não aumentou neste PR.'
              : '🔴 **Catraca falhou** — este PR acrescenta dívida de isolamento, ou há violação de R3.';

            let report = null;
            try { report = JSON.parse(fs.readFileSync('docs/audits/gate-tenancy-report.json', 'utf8')); } catch {}

            const linhas = (report?.violacoes ?? []).slice(0, 30)
              .map(v => `| ${v.severity} | ${v.rule} | \`${v.table}\` | ${v.detail} |`).join('\n');
            const extra = (report?.violacoes?.length ?? 0) > 30
              ? `\n\n_…e mais ${report.violacoes.length - 30} violações. Veja o log do job._` : '';

            const corpo = [
              '## Gate de tenancy',
              '',
              veredito,
              '',
              report ? `**${report.totais.fails} FAIL · ${report.totais.warns} WARN** — por regra: \`${JSON.stringify(report.totais.porRegra)}\`` : '',
              '',
              linhas ? '| Sev | Regra | Objeto | Detalhe |\n|---|---|---|---|\n' + linhas + extra : '_Sem violações._',
              '',
              '<details><summary>Saída completa do gate</summary>',
              '',
              '```',
              log.slice(-8000),
              '```',
              '',
              '</details>',
              '',
              '> ⚠️ **Este gate valida o banco, não o código.** Ele não vê rota em service-role sem `.eq(\'org_id\')` — a maior superfície de risco (129 de 318 route handlers usam `createAdminClient` e bypassam RLS). O par indispensável é a regra de ESLint da story `900-14`. **Gate verde não significa isolamento garantido.**',
              '',
              '> O job é **não-bloqueante** nesta onda: mesmo com a catraca vermelha o PR pode ser mergeado. A `900-18` torna o gate bloqueante ao fim da Onda 1.',
            ].join('\n');

            const marca = '## Gate de tenancy';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const existentes = await github.rest.issues.listComments({ owner, repo, issue_number });
            const meu = existentes.data.find(c => c.body.startsWith(marca) && c.user.type === 'Bot');
            if (meu) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: meu.id, body: corpo });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: corpo });
            }

  # ---------------------------------------------------------------------------
  # Story 900-3c — aviso de migration não aplicada no banco de teste.
  #
  # LEITURA PURA SOBRE O BANCO. O job roda `pnpm db:status` (só SELECT, via Management API)
  # e compara o veredito com as migrations que ESTE PR traz. Ele não aplica migration, não
  # roda `reset:testdb`, não usa `--confirmar` e não escreve uma linha no banco de teste —
  # que é o mesmo projeto onde as pessoas rodam `pnpm dev`.
  #
  # A versão anterior deste job escrevia (reset + apply a cada execução) para dar uma
  # garantia que o fluxo manual — `pnpm db:status` / `pnpm db:apply` — já dava, e pagava por
  # isso destruindo o banco de desenvolvimento compartilhado dezenas de vezes por dia. O job
  # de escrita foi removido pela raiz, não mitigado. Sem escrita não há estado a herdar entre
  # PRs, então também NÃO HÁ `concurrency` de banco aqui: duas execuções de PRs diferentes
  # podem rodar ao mesmo tempo sem se atrapalhar.
  #
  # ⚠️ "Leitura pura" vale para o BANCO, não para a árvore de trabalho: `pnpm db:status`
  # regenera `docs/audits/migrations-aplicadas.json`, que é rastreado. O job NÃO commita esse
  # arquivo e NÃO falha por causa de árvore suja. A escrita local é efêmera e inofensiva.
  #
  # O comentário no PR é publicado SEMPRE (`if: always()`), com três estados nomeados —
  # pendente / limpo / não-foi-possível-verificar. A razão é medida: `git diff --name-only`
  # devolve vazio com exit 0 tanto para "este PR não traz migration" quanto para "não
  # consegui resolver as refs", e sem o terceiro estado cinco situações (três delas falhas)
  # ficariam visualmente idênticas. Com ele, ausência de comentário significa uma coisa só:
  # o job não rodou.
  # ---------------------------------------------------------------------------
  migrations-do-pr:
    name: migrations deste PR (aviso, não-bloqueante)
    # Guard de fork: este job entrega o SUPABASE_MANAGEMENT_PAT (PAT global de conta) ao
    # runner. PR vindo de fork não roda — é a única superfície nova que este job abre.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Mesma razão do tenancy-gate acima, e por DOIS comandos aqui: o cruzamento compara
          # as migrations deste PR com a base, e a régua de não-reescrita usa
          # `origin/main...HEAD`. `actions/checkout@v4` traz `fetch-depth: 1` por padrão, e um
          # checkout raso faz as duas se absterem em silêncio e ninguém notar.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instala dependências
        run: pnpm install --frozen-lockfile

      # Apura QUAIS migrations este PR traz. O ponto delicado está aqui: "lista vazia" e "não
      # consegui apurar" precisam sair por caminhos diferentes, senão viram o mesmo silêncio.
      - name: Migrations que este PR traz
        id: diff
        # `github.base_ref` é nome de branch e entra por `env:`, não por interpolação dentro
        # do `run:` — mesmo motivo do passo "Monta o aviso" abaixo, e mesmo padrão que o job
        # `tenancy-gate` já usa com `GATE_TENANCY_BASE`. (CONCERNS-3 do @qa.)
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set +e
          BASE="origin/$BASE_REF"
          if ! git rev-parse --verify --quiet "$BASE" >/dev/null; then
            echo "motivo=nao consegui resolver a ref base $BASE (checkout raso? fetch-depth: 0 ausente?)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MB=$(git merge-base "$BASE" HEAD)
          if [ -z "$MB" ]; then
            echo "motivo=nao ha merge-base entre $BASE e HEAD (historico incompleto: checkout raso?)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$MB" HEAD -- supabase/migrations/ > /tmp/pr-migrations.txt
          if [ $? -ne 0 ]; then
            echo "motivo=git diff --name-only falhou contra $BASE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Base: $BASE (merge-base $MB)"
          echo "Migrations do PR:"; cat /tmp/pr-migrations.txt

      # `db:status` contra o banco de TESTE. O ref não é segredo — ele já é literal e
      # versionado em packages/shared/src/constants/supabase-refs.ts, que é a fonte única.
      # E a duplicação aqui é GUARDADA, não livre: se alguém trocar esta URL pelo ref de
      # produção, `resolverAmbiente()` aborta (guarda 3 de scripts/lib/db-env.ts) em vez de
      # obedecer. Só o PAT é secret.
      - name: Relatório do banco de teste (leitura)
        id: status
        env:
          TRIFOLD_ENV: teste
          SUPABASE_URL: https://xnxvygyfyyyzwhiuoehz.supabase.co
          SUPABASE_MANAGEMENT_PAT: ${{ secrets.SUPABASE_MANAGEMENT_PAT }}
        run: |
          set +e
          pnpm db:status --json /tmp/db-status.json 2>&1 | tee /tmp/db-status.log
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          if [ "$CODE" != "0" ]; then
            echo "motivo=pnpm db:status saiu $CODE (tabela trifold_migrations_aplicadas ausente no banco de teste? veja o log do job)" >> "$GITHUB_OUTPUT"
          fi
          # Nunca falha o passo: quem carrega o veredito é o comentário, não o exit code.
          exit 0

      # Monta o corpo do comentário. Roda mesmo se os passos acima falharam — é o passo que
      # transforma "falhei" num estado NOMEADO em vez de silêncio.
      # Os dois motivos entram por `env:`, NUNCA interpolados dentro do `run:`.
      # `${{ … }}` é substituído no texto do script ANTES de o bash existir: uma string entre
      # aspas duplas ainda expande `$(…)` e crase, e o motivo carrega `github.base_ref`, que
      # é nome de branch e aceita os dois caracteres. Por `env:`, o valor chega como dado —
      # o shell nunca vê o conteúdo como código. (CONCERNS-3 do @qa; o guard de fork é a
      # segunda camada, não a única.)
      - name: Monta o aviso
        if: always()
        env:
          MOTIVO_DIFF: ${{ steps.diff.outputs.motivo }}
          MOTIVO_STATUS: ${{ steps.status.outputs.motivo }}
        run: |
          args=(--diff /tmp/pr-migrations.txt --status /tmp/db-status.json)
          [ -n "$MOTIVO_DIFF" ]   && args+=(--motivo-diff   "$MOTIVO_DIFF")
          [ -n "$MOTIVO_STATUS" ] && args+=(--motivo-status "$MOTIVO_STATUS")
          args+=(--saida /tmp/aviso-migrations.md)
          npx tsx scripts/aviso-migrations-do-pr.ts "${args[@]}"

      # O comentário é publicado SEMPRE. Se nem o passo anterior conseguiu produzir o corpo,
      # este passo escreve o ⛔ ele mesmo — "nenhum comentário" nunca é desfecho válido.
      - name: Publica o aviso no PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marca = '## Migrations deste PR';
            let corpo;
            try {
              corpo = fs.readFileSync('/tmp/aviso-migrations.md', 'utf8');
            } catch {
              corpo = [
                marca,
                '',
                '⛔ **Não foi possível verificar** — o job não conseguiu nem montar o relatório ' +
                'do aviso (o passo anterior falhou antes de produzir o arquivo).',
                '',
                'Veja o log do job. Isto **não** é "está tudo certo".',
              ].join('\n');
            }
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const existentes = await github.rest.issues.listComments({ owner, repo, issue_number });
            const meu = existentes.data.find(c => c.body.startsWith(marca) && c.user.type === 'Bot');
            if (meu) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: meu.id, body: corpo });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: corpo });
            }
